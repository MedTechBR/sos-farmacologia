ocas autorizadas. Receita pela DCB, pela DCI ou pelo nome do referência pode ser atendida com genérico. A lista de similares intercambiáveis é consultada no portal da Anvisa, atualizado continuamente (CFF, 2024).\u003c/p>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Em fármacos de índice terapêutico estreito (fenitoína, carbamazepina, levotiroxina, lítio), a troca é permitida quando intercambiável, mas a troca frequente entre fabricantes pode alterar a resposta. Oriente o paciente a manter o mesmo produto e avise o prescritor quando a troca for inevitável.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar qualquer forma especial, mostre o produto e diga como tomar: “Este é de liberação prolongada, engula inteiro, não parta”; “Este dissolve embaixo da língua”; “Agite antes de cada dose e guarde na geladeira”. Pergunte se o paciente tem dificuldade de engolir: é a deixa para descobrir que ele tritura tudo em casa.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Filha de paciente idoso pergunta se pode triturar a venlafaxina XR do pai para misturar na papa, porque ele engasga. O farmacêutico explica que a trituração libera a dose toda de uma vez, entra em contato com o prescritor e sugere avaliar uma alternativa, como cápsula que possa ser aberta conforme a bula ou outro antidepressivo em solução.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m01-mapa-farmaco","titulo":"Farmacocinética e farmacodinâmica","centro":"Farmacocinética e dinâmica","ramos":[{"t":"Absorção e 1ª passagem","itens":["Jejum: levotiroxina e alendronato","Quinolona e tetraciclina + Ca, Fe, Mg, Al: quelação","Sublingual escapa do fígado (nitratos)","Morfina oral: cerca de 3 vezes a dose parenteral"]},{"t":"Metabolismo e CYP","itens":["3A4: metade dos fármacos; toranja inibe","Indutor: carbamazepina, fenitoína, rifampicina, fumo","Inibidor: claritromicina, azóis, fluoxetina","Pró-fármaco: codeína, tramadol, clopidogrel"]},{"t":"Eliminação e meia-vida","itens":["4 a 5 meias-vidas: equilíbrio ou eliminação","TFG pela CKD-EPI 2021, sem raça","Ajuste renal: gabapentinoides, levetiracetam, lítio","Hepatopata: lorazepam e oxazepam acumulam menos"]},{"t":"Receptores","itens":["Agonista pleno: morfina, fentanil","Parcial com teto: buprenorfina, aripiprazol","Antagonista: naloxona, flumazenil","Potência não é eficácia (fentanil x morfina)"]},{"t":"Segurança","itens":["IT estreito: varfarina, lítio, digoxina, fenitoína","RAM tipo A: dose-dependente e previsível","RAM tipo B: imprevisível e grave (SSJ, anafilaxia)","Notificar no VigiMed: basta a suspeita"]},{"t":"Formas farmacêuticas","itens":["LP, XR, CR, retard: não partir nem triturar","Entérico: não triturar (omeprazol, diclofenaco)","Gota não é mL: ver bula e gotejador","Suspensão: agitar antes de cada dose","Troca: genérico ou similar intercambiável"]}]},{"id":"m01-mapa-formas","titulo":"Formas farmacêuticas e vias","centro":"Formas e vias","ramos":[{"t":"Liberação prolongada","itens":["Siglas: LP, XR, CR, SR, LA, retard, OROS","Partir ou triturar: dose inteira de uma vez","Sulco funcional só quando a bula autoriza","Ex.: oxicodona LC, venlafaxina XR"]},{"t":"Gastrorresistente","itens":["Dissolve no intestino, não no estômago","Protege o fármaco: omeprazol, pantoprazol","Protege o estômago: diclofenaco sódico","Triturar destrói o revestimento"]},{"t":"Mucosa oral","itens":["Sublingual: sem primeira passagem","Engolir o SL atrasa ou reduz o efeito","Orodispersível: desfaz na língua, sem água"]},{"t":"Líquidos orais","itens":["Gota não é mL: gotas por mL na bula","Dipirona 500 mg/mL: 20 gotas = 1 mL","Suspensão: agitar antes de cada dose","Reconstituído: anotar data de descarte"]},{"t":"Sonda enteral","itens":["Triturar e dispersar um de cada vez","Lavar a sonda com água entre as doses","Nunca misturar no frasco da dieta","Fenitoína: pausar a dieta antes e depois"]},{"t":"Outras vias","itens":["Adesivo: pele íntegra, sem calor local","Inalador: a técnica decide a dose no pulmão","Colírio: 1 gota, 5 min entre frascos","Gestante não manipula finasterida partida"]}]},{"id":"m01-mapa-ram","titulo":"Reações adversas e farmacovigilância","centro":"RAM e farmacovigilância","ramos":[{"t":"Conceito (OMS)","itens":["Resposta nociva e não intencional","Com doses usuais em seres humanos","Notificar não exige certeza: basta a suspeita"]},{"t":"Tipos de RAM","itens":["A: dose-dependente e previsível","B: imprevisível, rara e grave","C crônica, D tardia, E fim de uso","F: falha terapêutica (ex.: indutor)"]},{"t":"Causalidade","itens":["Relação temporal com o início","Melhora ao retirar (dechallenge)","Volta ao reintroduzir (rechallenge)","Naranjo: definida, provável, possível, duvidosa"]},{"t":"Sinais de alarme","itens":["Falta de ar, inchaço de lábios: urgência","Bolhas e lesões em mucosa: suspeitar de SSJ","Icterícia, sangramento, urina escura"]},{"t":"Onde notificar","itens":["Evento adverso: VigiMed (Anvisa)","Queixa técnica: Notivisa","Queixa técnica com evento adverso: VigiMed","Cidadão e profissional também notificam"]},{"t":"No balcão","itens":["Registrar produto, lote, dose e datas","Listar outros medicamentos em uso","Encaminhar o caso grave antes de notificar"]}]}],"apoio":[{"tipo":"tabela","id":"m01-tab-cyp","titulo":"Indutores e inibidores do CYP450 frequentes no balcão","colunas":["Isoenzima","Indutores","Inibidores","Substratos sensíveis","Consequência típica"],"linhas":[["CYP3A4","Carbamazepina, fenitoína, fenobarbital, rifampicina, erva-de-são-joão","Claritromicina, eritromicina, cetoconazol, itraconazol, fluconazol, ritonavir, diltiazem, verapamil, suco de toranja","Sinvastatina, atorvastatina, anticoncepcionais, midazolam, alprazolam, fentanil, sildenafila","Inibidor: miopatia, sedação, hipotensão. Indutor: falha do anticoncepcional"],["CYP2D6","Pouco induzível","Fluoxetina, paroxetina, bupropiona, quinidina, terbinafina","Codeína, tramadol (pró-fármacos), metoprolol, tricíclicos, tamoxifeno","Inibidor reduz analgesia de codeína e tramadol"],["CYP2C9","Rifampicina, carbamazepina","Fluconazol, amiodarona, metronidazol, sulfametoxazol","Varfarina, fenitoína, glibenclamida, AINE","Sangramento com varfarina; hipoglicemia"],["CYP2C19","Rifampicina, carbamazepina","Omeprazol, esomeprazol, fluvoxamina, fluconazol","Clopidogrel (pró-fármaco), citalopram, diazepam","Menor ativação do clopidogrel"],["CYP1A2","Tabaco fumado, carbamazepina, rifampicina","Fluvoxamina, ciprofloxacino","Clozapina, olanzapina, teofilina, cafeína, agomelatina","Parar de fumar ou iniciar inibidor: intoxicação"]],"nota":"Indução leva cerca de 1 a 2 semanas para se instalar e para desaparecer; inibição age em horas a dias. Lista não exaustiva: confirme cada par em base de interações e na bula."},{"tipo":"quadro","id":"m01-quadro-nao-partir","titulo":"Não partir, não triturar, não mastigar","html":"\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Forma\u003c/th>\u003cth>Como reconhecer\u003c/th>\u003cth>Por que não alterar\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Liberação prolongada\u003c/td>\u003ctd>LP, XR, ER, SR, CR, LA, retard, OROS, HBS no nome\u003c/td>\u003ctd>Libera a dose inteira de uma vez: intoxicação\u003c/td>\u003ctd>Oxicodona LC, venlafaxina XR, metformina XR, nifedipino LP, levodopa HBS\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Gastrorresistente\u003c/td>\u003ctd>“Revestimento entérico”, “liberação retardada”\u003c/td>\u003ctd>Ácido destrói o fármaco ou o fármaco lesa o estômago\u003c/td>\u003ctd>Omeprazol, pantoprazol, diclofenaco sódico\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sublingual\u003c/td>\u003ctd>“Sublingual”, “SL”\u003c/td>\u003ctd>Engolido perde a absorção rápida e sofre primeira passagem\u003c/td>\u003ctd>Dinitrato de isossorbida SL, zolpidem SL\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Orodispersível\u003c/td>\u003ctd>“Orodispersível”, “ODT”\u003c/td>\u003ctd>Feito para desintegrar na língua; não exige água\u003c/td>\u003ctd>Ondansetrona orodispersível\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Risco a quem manipula\u003c/td>\u003ctd>Teratogênico ou citotóxico\u003c/td>\u003ctd>Pó ou contato com o fármaco expõe gestante ou cuidador\u003c/td>\u003ctd>Finasterida, dutasterida, metotrexato, talidomida\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cápsula mole\u003c/td>\u003ctd>Conteúdo líquido ou oleoso\u003c/td>\u003ctd>Dose imprecisa e perda do conteúdo\u003c/td>\u003ctd>Vitaminas lipossolúveis, nifedipino cápsula\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Sulco não garante divisão exata. Só parta, abra ou triture quando a bula do produto autorizar. Na dúvida, procure apresentação líquida, dose menor pronta ou outra opção com o prescritor.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Alguns produtos de liberação prolongada têm sulco funcional e podem ser partidos ao meio, mas nunca mastigados ou triturados. Algumas cápsulas com microgrânulos podem ser abertas e dispersas, sem triturar os grânulos. A autorização está sempre na bula.\u003c/p>\u003c/div>"},{"tipo":"tabela","id":"m01-tab-it-toxicidade","titulo":"Índice terapêutico estreito: o que monitorar e sinais de toxicidade","colunas":["Fármaco","O que se monitora","Sinais de toxicidade a reconhecer","Gatilhos comuns","Conduta no balcão"],"linhas":[["\u003cb>Lítio\u003c/b>","Litemia (manutenção em geral 0,6 a 1,2 mmol/L, bula), função renal, TSH","Diarreia, vômitos, sonolência, fraqueza muscular, falta de coordenação; depois ataxia, zumbido, visão turva","AINE, diurético tiazídico, IECA, desidratação, diarreia","Não indicar AINE; com sinais de toxicidade, encaminhar no mesmo dia"],["\u003cb>Digoxina\u003c/b>","Nível sérico, potássio, magnésio, função renal","Perda de apetite, náusea, vômitos, visão amarelo-esverdeada, palpitação ou pulso lento","Hipopotassemia por diurético, queda da TFG, idade avançada","Sinais de intoxicação: encaminhar no mesmo dia"],["\u003cb>Varfarina\u003c/b>","RNI na faixa-alvo definida pelo prescritor","Manchas roxas sem trauma, sangramento de gengiva ou nariz, urina avermelhada, fezes pretas","AINE, AAS, fluconazol, metronidazol, amiodarona, antibióticos","Não indicar AINE; avisar o prescritor de todo medicamento novo"],["\u003cb>Fenitoína\u003c/b>","Nível sérico (fenitoína total 10 a 20 mg/L, bula), albumina","Nistagmo, desequilíbrio (ataxia), fala arrastada, sonolência","Cinética saturável, fluconazol, dieta enteral (reduz absorção)","Não trocar de produto sem avisar; sinais de excesso: encaminhar"],["\u003cb>Ácido valproico\u003c/b>","Nível sérico, enzimas hepáticas, plaquetas","Mal-estar, fraqueza, vômitos, inchaço no rosto, icterícia; dor abdominal (pancreatite)","Carbapenêmicos (queda do nível), gestação","Sinais hepáticos ou abdominais: encaminhar no mesmo dia"],["\u003cb>Carbamazepina\u003c/b>","Nível sérico, sódio, hemograma","Visão dupla, tontura, desequilíbrio, confusão; febre com lesões de pele","Claritromicina, eritromicina, fluconazol; ela reduz o anticoncepcional","Lesão de pele com febre: urgência"],["\u003cb>Teofilina\u003c/b>","Nível sérico","Náusea, vômitos, taquicardia, tremor, insônia; convulsão","Ciprofloxacino, fluvoxamina, parar de fumar","Perguntar por tabagismo e antibiótico novo"],["\u003cb>Metotrexato oral\u003c/b>","Hemograma, função renal e hepática","Feridas na boca, febre, dor de garganta, sangramento","Tomada diária por engano no lugar da semanal","Escrever o dia da semana na embalagem e confirmar o entendimento"]],"nota":"Faixas de nível sérico conferidas na bula de lítio e de fenitoína (FDA); sinais de toxicidade conforme as bulas de lítio, digoxina, fenitoína e valproato (FDA); erro de tomada diária do metotrexato conforme alerta da EMA/Infarmed (2019). A faixa-alvo de cada paciente é definida pelo prescritor."},{"tipo":"fluxo","id":"m01-fluxo-partir-triturar","titulo":"Pode partir, triturar ou abrir? Paciente com disfagia ou sonda","passos":[{"t":"Paciente com dificuldade de engolir ou com sonda enteral pergunta como usar um medicamento sólido","tipo":"inicio"},{"t":"A forma é de liberação prolongada (LP, XR, CR, SR, retard, OROS) ou gastrorresistente?","tipo":"decisao","sim":"Não triturar nem mastigar; partir só se a bula autorizar o sulco. Contatar o prescritor para alternativa","nao":"Seguir para o próximo passo"},{"t":"É sublingual, orodispersível ou cápsula mole?","tipo":"decisao","sim":"Não triturar; usar como a forma prevê ou buscar outra apresentação com o prescritor","nao":"Seguir para o próximo passo"},{"t":"O fármaco é citotóxico ou teratogênico (metotrexato, finasterida, talidomida)?","tipo":"decisao","sim":"Não triturar nem dispersar: risco a quem manipula. Buscar apresentação pronta com o prescritor","nao":"Seguir para o próximo passo"},{"t":"A bula autoriza partir, triturar ou abrir a cápsula?","tipo":"decisao","sim":"Orientar a técnica descrita na bula","nao":"Procurar forma líquida, orodispersível, transdérmica ou outro fármaco com o prescritor"},{"t":"Sonda: pausar a dieta, triturar cada comprimido até pó fino, dispersar em água filtrada e dar um de cada vez, lavando a sonda entre eles (Incor, 2020)","tipo":"acao"},{"t":"Nunca colocar medicamento no frasco da dieta. Fenitoína e levotiroxina têm absorção reduzida com a dieta enteral","tipo":"alerta"},{"t":"Registrar a orientação e comunicar ao prescritor toda troca de forma farmacêutica","tipo":"fim"}]},{"tipo":"checklist","id":"m01-check-paciente-risco","titulo":"Paciente de risco: idoso, gestante, lactante, renal e hepático","itens":["Listar todos os medicamentos, chás e suplementos em uso","Idoso: conferir sedativos, anticolinérgicos e polifarmácia (Critérios de Beers, AGS 2023)","Idoso: perguntar sobre quedas, confusão ou sonolência recentes","Perguntar se há gravidez, chance de gravidez ou plano de engravidar","Conferir na bula as restrições de uso na gestação e na lactação","Perguntar se amamenta e a idade do bebê; consultar o LactMed (NIH)","Lactante: não indicar codeína nem tramadol (FDA, 2017)","Perguntar sobre doença renal e pedir a TFGe mais recente (CKD-EPI 2021)","Conferir na bula o ajuste por faixa de TFG; evitar AINE na doença renal crônica","Perguntar sobre hepatopatia, consumo de álcool e icterícia","Conferir na bula o ajuste hepático (Child-Pugh) e a dose diária do paracetamol","Checar se há fármaco de índice terapêutico estreito em uso","Encaminhar ao prescritor quando houver dúvida de dose ou contraindicação","Registrar a orientação dada"]},{"tipo":"cartoes","id":"m01-cartoes","titulo":"Cartões de revisão","itens":[{"f":"Indutor enzimático: o efeito aparece rápido ou devagar?","v":"Devagar, em cerca de 1 a 2 semanas, e também demora a sumir após a suspensão."},{"f":"Por que fluoxetina reduz a analgesia da codeína?","v":"Inibe a CYP2D6, que converte codeína em morfina."},{"f":"Equação recomendada para estimar a TFG?","v":"CKD-EPI 2021, sem coeficiente de raça."},{"f":"Diferença entre potência e eficácia?","v":"Potência é a dose para um efeito; eficácia é o efeito máximo possível."},{"f":"Cite quatro fármacos de índice terapêutico estreito.","v":"Varfarina, lítio, digoxina, fenitoína (também carbamazepina, valproato, teofilina, levotiroxina)."},{"f":"Onde notificar suspeita de reação adversa a medicamento?","v":"No VigiMed, sistema da Anvisa; basta a suspeita."},{"f":"Comprimido com XR ou LP no nome pode ser triturado?","v":"Não. Libera a dose inteira de uma vez; só altere se a bula autorizar."},{"f":"Queixa técnica sem evento adverso: onde notificar?","v":"No Notivisa. Com evento adverso associado, no VigiMed (Anvisa)."},{"f":"Quem pode notificar no VigiMed?","v":"Cidadãos, profissionais de saúde, detentores de registro e patrocinadores de estudos."},{"f":"Depois de parar um indutor, por quanto tempo o anticoncepcional fica comprometido?","v":"Cerca de 28 dias: usar método não afetado ou proteção adicional (FSRH, 2022)."},{"f":"Primeiros sinais de intoxicação por lítio?","v":"Diarreia, vômitos, sonolência, fraqueza muscular e falta de coordenação (bula)."},{"f":"Sinal visual típico da intoxicação digitálica?","v":"Visão com predomínio amarelo-esverdeado, junto de náusea, anorexia e arritmia."},{"f":"Primeiros sinais de excesso de fenitoína?","v":"Nistagmo, ataxia e fala arrastada (bula)."},{"f":"Sonda: como dar vários comprimidos no mesmo horário?","v":"Triturar e dispersar cada um separadamente, lavando a sonda com água entre eles."},{"f":"Metformina com TFGe abaixo de 30 mL/min/1,73 m²?","v":"Contraindicada pela bula; contatar o prescritor."},{"f":"Por que codeína e tramadol não são recomendados na amamentação?","v":"Mãe metabolizadora ultrarrápida da CYP2D6 gera morfina ou metabólito ativo do tramadol em excesso no leite (FDA, 2017)."}]},{"tipo":"questoes","id":"m01-questoes","titulo":"Questões de fixação","itens":[{"p":"Homem de 63 anos usa sinvastatina 40 mg/dia e recebe claritromicina para pneumonia. Três dias depois, relata dor muscular difusa e urina escura. O mecanismo mais provável é:","alt":["Indução da CYP3A4 pela claritromicina, com queda da sinvastatina","Inibição da CYP2D6, com acúmulo do metabólito ativo","Inibição da CYP3A4, com aumento da exposição à sinvastatina","Deslocamento da sinvastatina da albumina pela claritromicina","Antagonismo farmacodinâmico no receptor muscular"],"c":2,"com":"A claritromicina é inibidor potente da CYP3A4, via principal de metabolismo da sinvastatina; a exposição aumenta e surge miopatia ou rabdomiólise. Não é indutora (A). A CYP2D6 não é a via da sinvastatina (B). Deslocamento de albumina tem pouca relevância clínica nesse caso (D) e não há antagonismo de receptor (E)."},{"p":"Cuidadora pergunta se pode partir ao meio o comprimido de oxicodona de liberação controlada de 20 mg para dar meia dose ao paciente que está muito sonolento. O farmacêutico deve:","alt":["Autorizar, pois metade terá exatamente 10 mg de liberação controlada","Autorizar, desde que a metade seja engolida com bastante água","Orientar triturar e dissolver em água para dosar melhor","Orientar não partir e contatar o prescritor para ajuste da dose","Orientar dar o comprimido inteiro em dias alternados"],"c":3,"com":"Partir comprimido de liberação controlada pode liberar a dose de uma vez (dose dumping), com risco de depressão respiratória. Sonolência excessiva exige reavaliação pelo prescritor, que pode indicar apresentação de dose menor. A, B e C expõem ao risco; E altera o esquema sem base."},{"p":"Puérpera que amamenta recebe paracetamol com codeína. O motivo farmacocinético da recomendação contrária ao uso na amamentação é:","alt":["A codeína não passa para o leite materno, mas reduz bastante a produção láctea","O paracetamol é convertido em morfina pela CYP3A4","Mãe metabolizadora ultrarrápida da CYP2D6 gera morfina em excesso no leite","A codeína é antagonista do receptor mu e causa abstinência no bebê","A codeína induz a CYP2D6 do lactente"],"c":2,"com":"A codeína é convertida em morfina pela CYP2D6; em mães ultrarrápidas, a morfina no leite pode intoxicar o lactente, com sedação e depressão respiratória (FDA, Drug Safety Communication de 20/04/2017). A codeína passa para o leite (A). O paracetamol não gera morfina (B). A codeína é agonista (D) e não induz enzimas do bebê (E)."},{"p":"Mulher de 28 anos usa anticoncepcional oral combinado e começou carbamazepina para epilepsia. Pergunta se a pílula continua protegendo. A orientação adequada é:","alt":["Informar que a eficácia pode cair e encaminhar para método não afetado pelo indutor","Tranquilizar, pois a carbamazepina inibe a CYP3A4 e aumenta o nível do hormônio da pílula","Orientar dobrar a dose da pílula por conta própria durante todo o tratamento anticonvulsivante","Orientar tomar a pílula e a carbamazepina com intervalo de 4 horas para evitar a interação","Tranquilizar, pois só antibióticos como a amoxicilina reduzem o efeito do anticoncepcional oral"],"c":0,"com":"A carbamazepina é indutora enzimática e aumenta a depuração dos hormônios; a FSRH (2022) recomenda DIU ou acetato de medroxiprogesterona de depósito, com cautela até 28 dias após suspender o indutor. Ela não é inibidora (B). Ajustar dose por conta própria é automedicação (C). A interação é metabólica, não de absorção, e intervalo entre tomadas não resolve (D). Antibióticos não indutores, como a amoxicilina, não reduzem a eficácia (E; FSRH, 2022)."},{"p":"Homem de 78 anos usa metformina 850 mg duas vezes ao dia. A creatinina do exame é 1,1 mg/dL, \"dentro da referência\", e o laudo traz TFGe de 28 mL/min/1,73 m² (CKD-EPI 2021). O farmacêutico conclui que:","alt":["A creatinina normal garante que a dose atual de metformina é segura","Metformina é contraindicada abaixo de 30 pela bula: contatar o prescritor","Deve recalcular por Cockcroft-Gault, que é o padrão atual para ajustar doses","Pode orientar o paciente a reduzir a dose pela metade e manter o uso sem avisar","Basta trocar a metformina por liberação prolongada, que é segura em qualquer faixa de TFG"],"c":1,"com":"A bula da metformina (Glifage®) contraindica o uso com TFGe abaixo de 30 mL/min/1,73 m²; o farmacêutico comunica o prescritor. Creatinina \"normal\" no idoso com pouca massa muscular pode esconder TFG baixa (A). O padrão para estimar TFG é a CKD-EPI 2021 sem raça (KDIGO 2024), não Cockcroft-Gault (C). Mudar a dose por conta própria não resolve a contraindicação (D), e a forma XR tem a mesma restrição renal (E)."},{"p":"Cliente devolve um frasco de comprimidos com cor diferente do habitual e que esfarelam ao toque. Não teve nenhum sintoma. O registro correto é:","alt":["Notificação no VigiMed como evento adverso grave","Nenhuma notificação: basta trocar o produto no balcão","Comunicação só ao fabricante, que decide se informa a Anvisa","Notificação no VigiMed, pois toda queixa técnica sem evento adverso vai para ele","Queixa técnica no Notivisa, guardando o produto e o número do lote"],"c":4,"com":"Desvio de qualidade sem evento adverso é queixa técnica e vai para o Notivisa; se houver evento adverso associado, a notificação é feita no VigiMed (Anvisa, 2024). Não houve evento adverso (A e D). Trocar o produto sem notificar perde o sinal de qualidade do lote (B), e a notificação à Anvisa não depende do fabricante (C)."},{"p":"Cuidadora de paciente com sonda nasoenteral e dieta contínua pergunta como dar a fenitoína em comprimido. A orientação correta é:","alt":["Pausar a dieta antes e depois da dose, conforme o protocolo do serviço","Misturar o comprimido triturado diretamente no frasco da dieta enteral contínua","Triturar junto com os outros comprimidos do horário para ganhar tempo","Administrar sem lavar a sonda, para não diluir a dose de fenitoína","Manter a dieta correndo, pois a nutrição enteral aumenta a absorção"],"c":0,"com":"A dieta enteral reduz a absorção da fenitoína; o manual do Incor (2020) pausa a dieta 40 minutos antes e religa 40 minutos depois. Medicamento não vai no frasco da dieta (B); cada comprimido é triturado e dado separadamente (C); a sonda é lavada com água entre as administrações (D). A dieta reduz, e não aumenta, a absorção (E)."},{"p":"Paciente de 45 anos em uso de carbonato de lítio pede \"um anti-inflamatório\" para dor no joelho e conta que há dois dias tem diarreia, sonolência e tremor maior que o habitual. O farmacêutico deve:","alt":["Indicar ibuprofeno por 3 dias, pois o uso curto não interfere no lítio","Não indicar AINE e encaminhar logo para avaliação médica e litemia","Indicar diclofenaco e orientar aumentar a dose do lítio por causa do tremor","Orientar suspender o lítio por conta própria até a diarreia passar","Indicar antidiarreico e manter tudo, pois tremor maior é esperado com lítio"],"c":1,"com":"AINE reduz a eliminação renal do lítio, e diarreia, vômitos, sonolência, fraqueza e falta de coordenação são sinais precoces de intoxicação (bula do lítio, FDA). O quadro pede avaliação médica com litemia. Mesmo uso curto de AINE eleva a litemia (A). Aumentar a dose agrava a toxicidade (C). Suspender sem avaliação não substitui o atendimento (D), e o quadro não é esperado (E)."},{"p":"Idosa de 82 anos usa digoxina e hidroclorotiazida. Chega com náusea, falta de apetite e diz que \"está vendo tudo amarelado\". A conduta adequada é:","alt":["Indicar antiemético de venda livre e reavaliar o quadro em uma semana","Considerar virose e orientar hidratação oral em casa por alguns dias","Orientar tomar a digoxina junto com leite para reduzir a náusea","Orientar dobrar a dose do diurético para eliminar o excesso de líquido","Suspeitar de intoxicação digitálica e encaminhar no mesmo dia"],"c":4,"com":"Anorexia, náusea, vômitos e alteração visual (predomínio de amarelo-esverdeado) são sinais de intoxicação por digoxina; idade avançada e hipopotassemia por diurético predispõem (bula do Lanoxin®, FDA). Antiemético mascara o quadro (A); tratar como virose atrasa o diagnóstico (B); leite não resolve (C); mais diurético agrava a hipopotassemia (D)."},{"p":"Na classificação de reações adversas de Rawlins e Thompson, ampliada por Edwards e Aronson, qual par está correto?","alt":["Anafilaxia por penicilina: tipo A, dose-dependente","Hipoglicemia por glibenclamida: tipo B, imprevisível","Abstinência na suspensão abrupta do clonazepam: tipo F, falha","Gravidez com pílula e carbamazepina: tipo F","Osteoporose por corticoide de uso crônico: tipo E, fim de uso"],"c":3,"com":"Tipo F é falha terapêutica, muitas vezes por interação, como o indutor que reduz o anticoncepcional (Edwards e Aronson, 2000). Anafilaxia é tipo B (A); hipoglicemia por sulfonilureia é tipo A, dose-dependente (B); abstinência é tipo E, de fim de uso (C); osteoporose por corticoide é tipo C, crônica (E)."},{"p":"Mãe recebe prescrição de dipirona gotas 500 mg/mL, 10 gotas, para o filho. A bula informa 20 gotas por mL. Quanto de dipirona há na dose prescrita?","alt":["25 mg","250 mg","500 mg","5 g","12,5 mg"],"c":1,"com":"Com 20 gotas por mL, cada gota tem 25 mg; 10 gotas correspondem a 0,5 mL e 250 mg. Uma gota isolada tem 25 mg (A); 500 mg seriam 20 gotas (C); 5 g seriam 10 mL, erro de trocar gotas por mililitros, que multiplica a dose por 20 (D); 12,5 mg seria meia gota (E). Gotas por mL e mg por gota: bula do produto (Novalgina®)."}]}],"fontes":["Brasil. Lei nº 9.787, de 10 de fevereiro de 1999 (medicamento genérico). Anvisa. RDC nº 16/2007 e RDC nº 58, de 10 de outubro de 2014 (medicamento similar intercambiável). Conselho Federal de Farmácia. Em defesa dos medicamentos genéricos e da autoridade técnica dos farmacêuticos, notícia de 24/01/2024. https://site.cff.org.br","Anvisa. VigiMed: o que é e como cadastrar? Publicado em 08/10/2020, atualizado em 21/03/2024. https://www.gov.br/anvisa/pt-br/assuntos/fiscalizacao-e-monitoramento/notificacoes/vigimed/vigimed-saiba-mais","Anvisa. VigiMed: perguntas e respostas (notificação de eventos adversos a medicamentos e vacinas; envio ao banco de dados da OMS). Portal antigo da Anvisa.","Faculty of Sexual and Reproductive Healthcare (FSRH). Clinical Guidance: Drug Interactions with Hormonal Contraception. Maio de 2022.","U.S. Food and Drug Administration. Drug Safety Communication: FDA restricts use of prescription codeine pain and cough medicines and tramadol pain medicines in children; recommends against use in breastfeeding women. 20 de abril de 2017. Drug Safety Communication sobre opioides associados a benzodiazepínicos, 2016.","Instituto do Coração (Incor), Hospital das Clínicas da FMUSP, Serviço de Farmácia. Manual de orientações para o preparo e administração de medicamentos via sonda enteral. Elaboração 2016, atualização 2 de julho de 2020.","Glifage® e Glifage® XR (cloridrato de metformina). Bula. Merck S/A (Brasil): contraindicação com TFGe abaixo de 30 mL/min/1,73 m².","U.S. Food and Drug Administration. Prescribing information: lithium carbonate (2018), Lanoxin® (digoxina), Dilantin® (fenitoína) e Depakote®/ácido valproico (2025). Drugs@FDA e DailyMed.","Infarmed. Circular Informativa nº 120/CD/550.20.001, de 17/07/2019: Metotrexato, novas medidas para evitar erros de medicação (recomendação do PRAC/EMA).","American Geriatrics Society Beers Criteria Update Expert Panel. American Geriatrics Society 2023 updated AGS Beers Criteria for potentially inappropriate medication use in older adults. J Am Geriatr Soc 2023;71(7):2052-2081.","Inker LA et al. New creatinine- and cystatin C-based equations to estimate GFR without race. N Engl J Med 2021;385:1737-1749. KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD.","Edwards IR, Aronson JK. Adverse drug reactions: definitions, diagnosis, and management. Lancet 2000;356:1255-1259. Naranjo CA et al. A method for estimating the probability of adverse drug reactions. Clin Pharmacol Ther 1981;30:239-245."]},{"id":"m02","num":2,"titulo":"Sistema nervoso central","escopo":"Antidepressivos, antipsicóticos, anticonvulsivantes, anestésicos gerais e locais, sedativos e hipnóticos, antiparkinsonianos e opioides: mecanismo, uso, efeitos adversos, interações, receituário pela Portaria 344/98 e suas atualizações e orientação ao paciente no balcão.","cor":"#8E5AF2","icone":"brain","curto":"Sistema nervoso central","topicos":[{"id":"m02-antidepressivos","titulo":"Antidepressivos","resumo":"\u003cp>Antidepressivos estão entre os psicotrópicos mais dispensados na farmácia comercial. Além da depressão, são usados em transtornos de ansiedade, transtorno obsessivo-compulsivo, dor neuropática, fibromialgia, enxaqueca, insônia e cessação do tabagismo. Quase todos agem aumentando a disponibilidade de monoaminas (serotonina, noradrenalina, dopamina) na fenda sináptica, por bloqueio de recaptação, bloqueio de receptores ou inibição da enzima que as degrada.\u003c/p>\n\u003ch3>Latência e duração do tratamento\u003c/h3>\n\u003cp>O bloqueio da recaptação acontece em horas, mas a melhora clínica depende de adaptações dos receptores que levam semanas. Em geral, alguma melhora aparece em 2 a 4 semanas e o efeito pleno em 4 a 8 semanas. Os efeitos adversos, por outro lado, surgem nos primeiros dias. Essa diferença explica boa parte dos abandonos: o paciente sente náusea e insônia antes de sentir melhora.\u003c/p>\n\u003cp>Depois da remissão, as diretrizes recomendam manter o antidepressivo por meses (no primeiro episódio, em geral de 6 a 12 meses), e por mais tempo em quem teve vários episódios (CANMAT 2023). A suspensão é decisão do prescritor e deve ser gradual.\u003c/p>\n\u003ch3>Inibidores seletivos da recaptação de serotonina (ISRS)\u003c/h3>\n\u003cp>Fluoxetina, sertralina, paroxetina, citalopram, escitalopram e fluvoxamina bloqueiam o transportador de serotonina. São a primeira escolha na maioria dos casos pela segurança em superdosagem.\u003c/p>\n\u003cul>\n\u003cli>Efeitos comuns: náusea, diarreia, cefaleia, insônia ou sonolência, inquietação nas primeiras semanas, sudorese, disfunção sexual (redução da libido, retardo ejaculatório, anorgasmia), que costuma persistir.\u003c/li>\n\u003cli>Hiponatremia por secreção inapropriada de hormônio antidiurético, mais frequente em idosos e com diuréticos.\u003c/li>\n\u003cli>Aumento de sangramento, porque a plaqueta depende da serotonina captada do plasma. O risco cresce com AINE, ácido acetilsalicílico e anticoagulantes.\u003c/li>\n\u003cli>Prolongamento do intervalo QT com citalopram, dose-dependente: a FDA limita a dose a 40 mg/dia e a 20 mg/dia acima de 60 anos (FDA, 2012). O escitalopram tem efeito menor, mas também exige cautela.\u003c/li>\n\u003c/ul>\n\u003cp>Particularidades: a fluoxetina tem meia-vida longa e inibe fortemente a CYP2D6; a paroxetina tem efeito anticolinérgico, inibe a CYP2D6 e causa a síndrome de descontinuação mais intensa do grupo; a fluvoxamina inibe fortemente a CYP1A2 (eleva clozapina, teofilina, cafeína e agomelatina); sertralina e escitalopram têm menos interações.\u003c/p>\n\u003ch3>Inibidores da recaptação de serotonina e noradrenalina (IRSN)\u003c/h3>\n\u003cp>Venlafaxina, desvenlafaxina, duloxetina e milnaciprana bloqueiam os dois transportadores. A ação noradrenérgica ajuda na dor neuropática e na fibromialgia (duloxetina). A venlafaxina eleva a pressão arterial de forma dose-dependente e tem descontinuação intensa. A duloxetina pede cautela em hepatopatas e em quem consome muito álcool.\u003c/p>\n\u003ch3>Tricíclicos\u003c/h3>\n\u003cp>Amitriptilina, nortriptilina, imipramina e clomipramina bloqueiam a recaptação de serotonina e noradrenalina, mas também receptores muscarínicos, histamínicos H1 e alfa-1 adrenérgicos. Daí os efeitos: boca seca, constipação, retenção urinária, visão turva, confusão no idoso (anticolinérgicos), sonolência e ganho de peso (H1), hipotensão ortostática e quedas (alfa-1). Hoje são mais usados em dose baixa para dor crônica, enxaqueca e insônia associada à dor.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Tricíclicos são cardiotóxicos em superdosagem (alargamento do QRS, arritmias, convulsões) e uma caixa inteira pode ser letal. Em paciente com depressão e risco de suicídio, quantidades grandes em casa são um perigo concreto. O farmacêutico pode sugerir ao prescritor dispensação fracionada ou envolvimento da família.\u003c/p>\u003c/div>\n\u003ch3>Inibidores da monoaminoxidase (IMAO)\u003c/h3>\n\u003cp>A tranilcipromina inibe de forma irreversível as MAO-A e MAO-B; a moclobemida inibe a MAO-A de forma reversível. São reservados para casos resistentes. Os riscos principais são dois:\u003c/p>\n\u003cul>\n\u003cli>Crise hipertensiva com alimentos ricos em tiramina (queijos curados, embutidos e carnes curadas, chope e cervejas não pasteurizadas, molho de soja, extrato de levedura, alimentos fermentados ou estragados), com o IMAO irreversível.\u003c/li>\n\u003cli>Síndrome serotoninérgica ou crise hipertensiva com outros medicamentos: ISRS, IRSN, tricíclicos, tramadol, meperidina, metadona, dextrometorfano, triptanos e simpaticomiméticos de balcão (pseudoefedrina, fenilefrina).\u003c/li>\n\u003c/ul>\n\u003cp>Trocas entre IMAO e outros antidepressivos exigem intervalo sem medicamento, definido pela bula (em geral cerca de 2 semanas depois de suspender o IMAO irreversível e cerca de 5 semanas depois de suspender a fluoxetina).\u003c/p>\n\u003ch3>Antidepressivos atípicos\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Bupropiona\u003c/strong>: inibe a recaptação de dopamina e noradrenalina. Não causa disfunção sexual nem ganho de peso e é usada na cessação do tabagismo. Reduz o limiar convulsivo: contraindicada em epilepsia, bulimia, anorexia e na retirada abrupta de álcool ou benzodiazepínico. Inibe a CYP2D6. Pode causar insônia, ansiedade e aumento da pressão arterial.\u003c/li>\n\u003cli>Mirtazapina: antagoniza receptores alfa-2 (aumentando a liberação de serotonina e noradrenalina), 5-HT2, 5-HT3 e H1. Causa sonolência e aumento de apetite e de peso. Útil quando há insônia e perda de apetite; menos náusea e disfunção sexual.\u003c/li>\n\u003cli>Trazodona: antagonista 5-HT2A e inibidor fraco da recaptação de serotonina. Em dose baixa, é usada para insônia. Efeitos: sonolência, hipotensão ortostática, tontura e, raramente, priapismo (ereção dolorosa e prolongada, emergência urológica).\u003c/li>\n\u003cli>Vortioxetina: inibe a recaptação de serotonina e modula vários receptores serotoninérgicos (ação multimodal). Náusea é o efeito mais comum; disfunção sexual menos frequente que com ISRS.\u003c/li>\n\u003cli>Agomelatina: agonista dos receptores de melatonina MT1 e MT2 e antagonista 5-HT2C. Pouca disfunção sexual. Risco de hepatotoxicidade: a bula exige dosar transaminases antes de iniciar e periodicamente nos primeiros meses. É contraindicada com inibidores potentes da CYP1A2 (fluvoxamina, ciprofloxacino) e em hepatopatia.\u003c/li>\n\u003c/ul>\n\u003ch3>Síndrome serotoninérgica\u003c/h3>\n\u003cp>É a toxicidade por excesso de serotonina, geralmente pela associação de dois fármacos serotoninérgicos ou por aumento de dose. Instala-se em horas. A tríade clássica tem:\u003c/p>\n\u003col>\n\u003cli>Alteração do estado mental: agitação, ansiedade, confusão.\u003c/li>\n\u003cli>Hiperatividade autonômica: taquicardia, sudorese, hipertermia, midríase, diarreia, pressão instável.\u003c/li>\n\u003cli>Alterações neuromusculares: tremor, clônus (especialmente induzível no tornozelo e ocular), hiperreflexia, rigidez.\u003c/li>\n\u003c/ol>\n\u003cp>Associações perigosas frequentes: ISRS ou IRSN com tramadol, meperidina, metadona, IMAO, linezolida, azul de metileno, dextrometorfano, erva-de-são-joão, lítio ou triptanos (risco baixo, mas descrito). O diagnóstico usa os critérios de Hunter. Casos moderados a graves são emergência.\u003c/p>\n\u003ch3>Síndrome de descontinuação\u003c/h3>\n\u003cp>A suspensão abrupta, ou até o esquecimento de doses, pode causar tontura, sensação de “choques” ou formigamento, náusea, sintomas gripais, insônia, sonhos vívidos, irritabilidade e ansiedade. Aparece em poucos dias e é mais intensa com paroxetina e venlafaxina (meia-vida curta) e rara com fluoxetina. Não é sinal de dependência no sentido de uso compulsivo, mas exige retirada gradual planejada pelo prescritor.\u003c/p>\n\u003ch3>Risco de suicídio em jovens\u003c/h3>\n\u003cp>Em crianças, adolescentes e adultos jovens (até 24 anos), os antidepressivos foram associados a aumento de pensamentos e comportamentos suicidas no início do tratamento e nas mudanças de dose, o que gerou alerta em caixa na bula americana (FDA). O tratamento não deve ser negado por isso; a recomendação é acompanhamento próximo nas primeiras semanas e orientação à família para sinais de alerta: agitação, insônia intensa, impulsividade, fala sobre morte.\u003c/p>\n\u003ch3>Lista e receituário\u003c/h3>\n\u003cp>Todos os antidepressivos citados (incluindo bupropiona, mirtazapina, trazodona, vortioxetina, agomelatina, tianeptina, moclobemida e tranilcipromina) estão na \u003cstrong>Lista C1\u003c/strong> da Portaria SVS/MS 344/1998 (Anexo I, Atualização n. 101, publicada pela RDC 1.036/2026). Exigem Receita de Controle Especial em duas vias: a primeira fica retida na farmácia e a segunda é devolvida ao paciente com a identificação da dispensação. A receita vale por 30 dias a partir da emissão, em todo o território nacional, e a quantidade fica limitada a 5 ampolas ou 60 dias de tratamento (Portaria 344/1998, arts. 52 e 59); acima disso, o prescritor justifica com CID ou diagnóstico e posologia nas duas vias (art. 60). Cada receita pode conter até 3 substâncias da Lista C1 (art. 57). Os modelos gráficos de receituário passaram a ser os publicados no portal da Anvisa, e a prescrição eletrônica é permitida, mas não obrigatória: o receituário em papel continua válido, e foto ou documento escaneado não vale como receita eletrônica (RDC 1.000/2025). A escetamina em spray nasal, também usada na depressão, é da Lista B1 e só pode ser dispensada e usada em estabelecimento de saúde.\u003c/p>\n\u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>Lista C1 da Portaria 344/1998: “Lista das outras substâncias sujeitas a controle especial (Sujeitas à Receita de Controle Especial em duas vias)” (Anexo I, Atualização n. 101, RDC 1.036/2026).\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Na primeira dispensação, explique três coisas: a melhora demora semanas, os efeitos incômodos iniciais costumam diminuir e o remédio não deve ser parado por conta própria. Pergunte por tramadol, triptanos, xarope com dextrometorfano, chás e suplementos. Desaconselhe automedicação com descongestionante em quem usa IMAO. Se o cliente relatar ideias de morte, não encerre o atendimento: acolha, oriente procurar o médico ou o serviço de urgência no mesmo dia e informe o CVV (telefone 188).\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 45 anos, em uso de sertralina 100 mg, pede tramadol com receita do dentista após extração. O farmacêutico identifica risco de síndrome serotoninérgica, orienta sobre sinais de alerta (tremor, agitação, febre, diarreia), contata o dentista e sugere considerar analgésico não serotoninérgico, como dipirona ou paracetamol associado a AINE se não houver contraindicação.\u003c/p>\u003c/div>"},{"id":"m02-antipsicoticos","titulo":"Antipsicóticos","resumo":"\u003cp>Antipsicóticos tratam esquizofrenia, transtorno bipolar, agitação psicótica e, em doses e indicações específicas, depressão resistente, transtornos de comportamento e delirium. No balcão, aparecem também prescritos em dose baixa para insônia (quetiapina) e em idosos com demência, situações que pedem atenção redobrada.\u003c/p>\n\u003ch3>Mecanismo e vias dopaminérgicas\u003c/h3>\n\u003cp>Todos os antipsicóticos bloqueiam, em algum grau, o receptor dopaminérgico D2. O bloqueio em cada via explica efeito e reação adversa:\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Via\u003c/th>\u003cth>Função\u003c/th>\u003cth>Consequência do bloqueio D2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Mesolímbica\u003c/td>\u003ctd>Recompensa, sintomas positivos\u003c/td>\u003ctd>Redução de delírios e alucinações (efeito desejado)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Mesocortical\u003c/td>\u003ctd>Cognição, afeto\u003c/td>\u003ctd>Piora de sintomas negativos e cognitivos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nigroestriatal\u003c/td>\u003ctd>Movimento\u003c/td>\u003ctd>Efeitos extrapiramidais\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tuberoinfundibular\u003c/td>\u003ctd>Inibe a prolactina\u003c/td>\u003ctd>Hiperprolactinemia\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Os antipsicóticos atípicos (segunda geração) bloqueiam também o receptor 5-HT2A, o que reduz os efeitos extrapiramidais. O aripiprazol e o brexpiprazol são agonistas parciais D2.\u003c/p>\n\u003ch3>Típicos e atípicos\u003c/h3>\n\u003cul>\n\u003cli>Típicos de alta potência (haloperidol, flufenazina): mais efeitos extrapiramidais, menos sedação.\u003c/li>\n\u003cli>Típicos de baixa potência (clorpromazina, levomepromazina, tioridazina): mais sedação, efeito anticolinérgico e hipotensão.\u003c/li>\n\u003cli>Atípicos: risperidona e paliperidona (mais prolactina), olanzapina (mais ganho de peso e alterações metabólicas), quetiapina (sedação, hipotensão, metabólico), aripiprazol (acatisia, pouca alteração metabólica e de prolactina), ziprasidona e lurasidona (devem ser tomadas com refeição para absorção adequada; a ziprasidona prolonga o QT), clozapina (reservada para esquizofrenia resistente).\u003c/li>\n\u003c/ul>\n\u003ch3>Efeitos extrapiramidais\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Efeito\u003c/th>\u003cth>Quando aparece\u003c/th>\u003cth>Como se apresenta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Distonia aguda\u003c/td>\u003ctd>Horas a dias\u003c/td>\u003ctd>Contração involuntária: torcicolo, crise oculógira, protrusão de língua, trismo; mais em jovens\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Acatisia\u003c/td>\u003ctd>Dias a semanas\u003c/td>\u003ctd>Inquietação interna, incapacidade de ficar parado\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Parkinsonismo\u003c/td>\u003ctd>Semanas\u003c/td>\u003ctd>Rigidez, lentidão, tremor, face inexpressiva\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Discinesia tardia\u003c/td>\u003ctd>Meses a anos\u003c/td>\u003ctd>Movimentos involuntários da boca e da língua, às vezes irreversíveis\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A distonia aguda responde a anticolinérgico (biperideno) e assusta muito o paciente. Antieméticos antidopaminérgicos de uso comum, como \u003cstrong>metoclopramida\u003c/strong> e bromoprida, causam os mesmos efeitos, sobretudo em crianças e jovens.\u003c/p>\n\u003ch3>Síndrome metabólica\u003c/h3>\n\u003cp>Olanzapina, clozapina e quetiapina são os que mais causam ganho de peso, resistência à insulina, diabetes e dislipidemia. O consenso das sociedades americanas de diabetes e psiquiatria (ADA/APA, 2004) recomenda medir peso, circunferência abdominal, pressão arterial, glicemia e perfil lipídico antes de iniciar, em 12 semanas e depois periodicamente. A farmácia pode apoiar com aferição de pressão, peso e glicemia capilar, registrando e encaminhando resultados alterados.\u003c/p>\n\u003ch3>Síndrome neuroléptica maligna\u003c/h3>\n\u003cp>Reação rara e grave, mais comum no início do tratamento, em aumentos rápidos de dose e com antipsicóticos de alta potência ou injetáveis. Sinais: febre alta, rigidez muscular intensa (em “cano de chumbo”), alteração de consciência, instabilidade autonômica (taquicardia, pressão variável, sudorese) e elevação da creatinofosfoquinase (CK). É emergência médica. A suspensão abrupta de levodopa produz quadro semelhante.\u003c/p>\n\u003ch3>Hiperprolactinemia\u003c/h3>\n\u003cp>Mais comum com risperidona, paliperidona, amissulprida, sulpirida e típicos. Causa galactorreia, amenorreia, irregularidade menstrual, redução da libido, disfunção erétil, ginecomastia e, a longo prazo, perda de massa óssea. Pacientes raramente relatam espontaneamente; perguntar com tato ajuda a detectar.\u003c/p>\n\u003ch3>Intervalo QT\u003c/h3>\n\u003cp>Vários antipsicóticos prolongam o QT (tioridazina, pimozida, ziprasidona, haloperidol em dose alta ou intravenoso, quetiapina). O risco de arritmia (torsades de pointes) aumenta com outras drogas que prolongam o QT (macrolídeos, quinolonas, ondansetrona, hidroxicloroquina, citalopram, metadona), com hipopotassemia (diuréticos, diarreia) e com bradicardia.\u003c/p>\n\u003ch3>Clozapina\u003c/h3>\n\u003cp>É o antipsicótico mais eficaz na esquizofrenia resistente, mas causa agranulocitose (queda grave dos neutrófilos), miocardite nas primeiras semanas, convulsões dose-dependentes, constipação grave que pode evoluir para íleo, sialorreia noturna, sedação e alterações metabólicas.\u003c/p>\n\u003cp>A monitorização hematológica é obrigatória. A bula brasileira do produto de referência exige leucócitos de pelo menos 3.500/mm³ e neutrófilos de pelo menos 2.000/mm³ para iniciar, contagem semanal nos 6 primeiros meses e quinzenal depois, mantida até 4 semanas após a suspensão (bula do profissional, Leponex®, Viatris). Outros países revisaram essas regras recentemente (a bula americana de 2025 deixou de exigir o programa REMS, mas mantém a monitorização dos neutrófilos); no Brasil, vale a bula vigente e o protocolo do serviço.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Paciente em uso de clozapina com febre, dor de garganta, aftas ou sinais de infecção precisa de hemograma no mesmo dia. Constipação persistente também é alerta. Parar de fumar de repente eleva o nível da clozapina (a fumaça do tabaco induz a CYP1A2) e aumenta os efeitos adversos (bula do Leponex®): o médico precisa ser avisado.\u003c/p>\u003c/div>\n\u003ch3>Idosos com demência\u003c/h3>\n\u003cp>Antipsicóticos aumentam a mortalidade (principalmente por eventos cardiovasculares e infecções) em idosos com demência, o que gerou alerta em caixa da FDA para toda a classe. O uso para agitação nessa população deve ser pontual, na menor dose e por tempo curto, segundo os critérios de Beers (AGS, 2023).\u003c/p>\n\u003ch3>Interações e adesão\u003c/h3>\n\u003cp>O tabagismo induz a CYP1A2 e reduz os níveis de clozapina e olanzapina; parar de fumar, inclusive em internação, eleva esses níveis. A fluvoxamina e o ciprofloxacino (inibidores potentes da CYP1A2) aumentam a clozapina, e a bula americana recomenda reduzir a dose a um terço nessa associação (Clozaril®, FDA, 2025). A carbamazepina reduz os níveis de quase todos os antipsicóticos. Álcool, benzodiazepínicos e opioides somam sedação e risco de queda. Anticolinérgicos associados (biperideno, tricíclicos, anti-histamínicos de primeira geração) somam boca seca, constipação e confusão, e a constipação com clozapina pode ser grave.\u003c/p>\n\u003cp>A baixa adesão é a principal causa de recaída na esquizofrenia. Formas injetáveis de depósito (decanoato de haloperidol, palmitato de paliperidona, aripiprazol de liberação prolongada) são aplicadas em serviços de saúde a cada algumas semanas e garantem a exposição. Na farmácia, o farmacêutico pode notar atrasos na retirada do medicamento, pista importante de abandono.\u003c/p>\n\u003cp>A quetiapina em dose baixa é usada com frequência para insônia, prática sem respaldo das diretrizes para esse uso isolado e com os mesmos riscos metabólicos, de queda e de hipotensão, além de interações com outros sedativos.\u003c/p>\n\u003ch3>Lítio\u003c/h3>\n\u003cp>O carbonato de lítio, estabilizador de humor de primeira linha no transtorno bipolar, costuma aparecer na mesma receita que antipsicóticos. Tem índice terapêutico estreito e eliminação exclusivamente renal, com reabsorção ligada ao sódio. Desidratação, dieta pobre em sal, diarreia, vômitos, febre, AINE, diuréticos tiazídicos, IECA e bloqueadores do receptor de angiotensina elevam a litemia. Sinais de intoxicação: tremor grosseiro, diarreia, vômitos, sonolência, confusão, ataxia e fala arrastada. A longo prazo, o lítio pode causar hipotireoidismo, poliúria e perda de função renal, motivo da monitorização periódica de litemia, TSH e creatinina com TFG.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Paciente em uso de lítio que pede anti-inflamatório para dor muscular deve ser orientado a preferir paracetamol ou dipirona e a falar com o médico antes de qualquer AINE, inclusive em gel aplicado em grandes áreas por muitos dias.\u003c/p>\u003c/div>\n\u003ch3>Lista e receituário\u003c/h3>\n\u003cp>Os antipsicóticos de uso clínico (haloperidol, clorpromazina, levomepromazina, flufenazina, periciazina, pimozida, sulpirida, amissulprida, risperidona, paliperidona, olanzapina, quetiapina, aripiprazol, brexpiprazol, ziprasidona, lurasidona, asenapina, zuclopentixol e clozapina) estão na Lista C1 (Portaria 344/1998, Atualização n. 101). O lítio, estabilizador de humor de índice terapêutico estreito, também é C1. Receituário: Receita de Controle Especial em duas vias, válida por 30 dias, com até 60 dias de tratamento (Portaria 344/1998, arts. 52 e 59).\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Pergunte ao cuidador sobre rigidez, tremor, inquietação, sono excessivo e ganho de peso. Oriente levantar devagar (hipotensão ortostática) e evitar álcool. Em jovem com torcicolo ou olhos “virados para cima” após metoclopramida ou antipsicótico, encaminhe ao serviço de urgência: é distonia aguda e tem tratamento rápido.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhora de 79 anos com demência começou quetiapina para agitação noturna e teve duas quedas em uma semana. A filha pergunta se pode dar meio comprimido a mais. O farmacêutico orienta não aumentar a dose, relaciona as quedas à sedação e à hipotensão e contata o médico para reavaliação.\u003c/p>\u003c/div>"},{"id":"m02-anticonvulsivantes","titulo":"Anticonvulsivantes","resumo":"\u003cp>Os anticonvulsivantes (antiepilépticos) tratam epilepsia, mas também dor neuropática, enxaqueca, transtorno bipolar e ansiedade. Vários deles têm índice terapêutico estreito, interações graves por indução enzimática e risco teratogênico, o que torna essa classe uma das mais importantes para o farmacêutico.\u003c/p>\n\u003ch3>Mecanismos principais\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mecanismo\u003c/th>\u003cth>Fármacos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Bloqueio de canais de sódio\u003c/td>\u003ctd>Carbamazepina, oxcarbazepina, fenitoína, lamotrigina, lacosamida, topiramato (em parte)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Aumento da ação do GABA\u003c/td>\u003ctd>Fenobarbital, benzodiazepínicos, ácido valproico (em parte), topiramato (em parte)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ligação à proteína SV2A\u003c/td>\u003ctd>Levetiracetam, brivaracetam\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Subunidade alfa-2-delta de canais de cálcio\u003c/td>\u003ctd>Gabapentina, pregabalina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Múltiplos\u003c/td>\u003ctd>Ácido valproico, topiramato\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Carbamazepina\u003c/h3>\n\u003cp>Usada em epilepsia focal, neuralgia do trigêmeo e transtorno bipolar. É indutor potente (CYP3A4 e outras) e induz o próprio metabolismo (autoindução): nas primeiras semanas a concentração cai, e a dose costuma ser ajustada. Faixa terapêutica usual de 4 a 12 mcg/mL. Efeitos: tontura, diplopia, ataxia, hiponatremia, leucopenia, alterações hepáticas, exantema. Inibidores da CYP3A4 (claritromicina, eritromicina, fluconazol, diltiazem, verapamil, suco de toranja) elevam o nível e causam intoxicação.\u003c/p>\n\u003cp>A carbamazepina pode causar síndrome de Stevens-Johnson e necrólise epidérmica tóxica (SSJ/NET), mais frequentes nos primeiros meses. O alelo \u003cstrong>HLA-B*1502\u003c/strong>, comum em pessoas de ascendência asiática (sobretudo do sudeste asiático e chineses Han), aumenta muito esse risco; a bula americana recomenda testar esses pacientes antes de iniciar. O alelo HLA-A*3101 se associa a outras reações de hipersensibilidade.\u003c/p>\n\u003ch3>Oxcarbazepina\u003c/h3>\n\u003cp>Parecida com a carbamazepina, com menos interações e sem autoindução relevante, mas com mais hiponatremia. Também reduz a eficácia de anticoncepcionais hormonais.\u003c/p>\n\u003ch3>Fenitoína\u003c/h3>\n\u003cp>Tem cinética saturável (não linear): quando a enzima satura, pequenos aumentos de dose causam grandes aumentos de concentração. Faixa terapêutica usual de 10 a 20 mcg/mL; muito ligada à albumina. Efeitos agudos de excesso: nistagmo, ataxia, fala arrastada, sonolência. Uso crônico: hiperplasia gengival, hirsutismo, acne, traços faciais grosseiros, osteomalácia, anemia megaloblástica. É indutor potente e teratogênica. Absorção reduzida pela dieta enteral.\u003c/p>\n\u003ch3>Fenobarbital\u003c/h3>\n\u003cp>Barbitúrico de meia-vida longa (vários dias no adulto), usado em epilepsia, inclusive em crianças. Causa sedação, prejuízo cognitivo, alterações de comportamento em crianças e dependência; suspensão abrupta pode precipitar crises. É indutor enzimático potente. Está na Lista B1, mas o adendo 2 da lista sujeita os medicamentos com fenobarbital à Receita de Controle Especial em duas vias.\u003c/p>\n\u003ch3>Ácido valproico e valproato\u003c/h3>\n\u003cp>Ácido valproico, valproato de sódio e divalproato de sódio têm amplo espectro (crises generalizadas e focais), além de uso em transtorno bipolar e profilaxia de enxaqueca. Efeitos: náusea, tremor, ganho de peso, queda de cabelo, trombocitopenia, hiperamonemia, pancreatite e hepatotoxicidade (risco maior em crianças pequenas e em politerapia). É inibidor enzimático: aumenta muito o nível da lamotrigina. Antibióticos carbapenêmicos derrubam o nível do valproato em horas, com risco de crise.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>O valproato é o anticonvulsivante mais teratogênico. Na monoterapia durante a gestação, cerca de 10% dos bebês nascem com malformações (tubo neural, coração, fenda labial e palatina), contra 2 a 3% na população geral, e até 30 a 40% das crianças expostas têm atraso do desenvolvimento na idade pré-escolar (bula do Valpakine®, Sanofi). A bula contraindica o uso em meninas e mulheres com potencial de engravidar, salvo se cumpridas as condições do programa de prevenção da gravidez: avaliação do potencial de gravidez, teste de gravidez antes de iniciar, contracepção eficaz sem interrupção, revisão pelo menos anual com especialista e Formulário Anual de Reconhecimento de Risco. Na epilepsia, também é contraindicado na gravidez, salvo se não houver alternativa adequada.\u003c/p>\u003c/div>\n\u003cp>A mulher que usa valproato e descobre a gravidez não deve suspender por conta própria (risco de crises graves): precisa de avaliação médica urgente. A bula atribui ao farmacêutico entregar o cartão da paciente a cada dispensação e orientar que ela não interrompa o medicamento e procure o especialista imediatamente em caso de gravidez planejada ou suspeita.\u003c/p>\n\u003ch3>Lamotrigina\u003c/h3>\n\u003cp>Usada em epilepsia e na prevenção de depressão bipolar. O principal risco é exantema, incluindo SSJ/NET, mais provável com dose inicial alta, escalonamento rápido, associação com valproato e em crianças. Por isso a titulação é lenta, seguindo rigorosamente o esquema da bula (com doses menores quando associada ao valproato). Quem interrompe o uso por mais de alguns dias pode precisar reiniciar a titulação. Anticoncepcionais com estrogênio induzem a glicuronidação e reduzem a concentração de lamotrigina em cerca de 50%, e as crises podem voltar; na semana sem pílula ativa, o nível sobe e pode chegar ao dobro no fim da semana (bula americana do Lamictal®, FDA, 2025). Por isso a dose de manutenção costuma ser ajustada quando a paciente começa ou para o anticoncepcional com estrogênio.\u003c/p>\n\u003ch3>Levetiracetam\u003c/h3>\n\u003cp>Poucas interações, eliminação renal (ajustar pela TFG). Efeito adverso marcante: alterações de humor e comportamento, como irritabilidade, agressividade e depressão.\u003c/p>\n\u003ch3>Topiramato\u003c/h3>\n\u003cp>Usado em epilepsia e profilaxia de enxaqueca. Efeitos: parestesias, perda de apetite e de peso, lentidão cognitiva e dificuldade de encontrar palavras, cálculo renal, acidose metabólica e, raramente, glaucoma agudo de ângulo fechado (dor ocular e visão turva súbitas, emergência). Em doses mais altas reduz a eficácia de anticoncepcionais. É teratogênico (fenda labial e palatina, baixo peso), e a agência europeia instituiu programa de prevenção da gravidez também para ele (EMA, 2023).\u003c/p>\n\u003ch3>Gabapentina e pregabalina\u003c/h3>\n\u003cp>Ligam-se à subunidade alfa-2-delta de canais de cálcio e reduzem a liberação de neurotransmissores excitatórios. Indicações principais: dor neuropática, epilepsia focal (adjuvante) e, para a pregabalina, transtorno de ansiedade generalizada e fibromialgia. Efeitos: tontura, sonolência, edema periférico, ganho de peso, visão turva. Eliminação renal: dose reduzida pela TFG. Têm potencial de uso indevido, sobretudo em pessoas com histórico de uso de opioides, e a associação com opioides ou outros depressores aumenta o risco de depressão respiratória (FDA, 2019).\u003c/p>\n\u003cp>Situação regulatória em outubro de 2026: gabapentina e pregabalina permanecem na Lista C1 (Portaria 344/1998, Anexo I, Atualização n. 101, RDC 1.036/2026), com Receita de Controle Especial em duas vias. Outros países endureceram o controle desses fármacos; no Brasil não houve mudança de lista até a data de revisão.\u003c/p>\n\u003ch3>Indução enzimática e contracepção\u003c/h3>\n\u003cp>Carbamazepina, oxcarbazepina, fenitoína, fenobarbital, primidona e topiramato em dose alta reduzem a eficácia de pílulas combinadas, pílulas só de progestagênio, adesivo, anel e implante. A orientação de serviços de planejamento familiar (FSRH, 2022) é preferir métodos não afetados: DIU de cobre, DIU hormonal de levonorgestrel ou injetável trimestral de medroxiprogesterona. A indução persiste por semanas após a suspensão do indutor. Na contracepção de emergência, o DIU de cobre é preferível; se for usado levonorgestrel oral, a mesma diretriz recomenda dose dupla (3 mg), decisão que cabe ao prescritor.\u003c/p>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Mulher em idade fértil com anticonvulsivante na receita gera duas perguntas no balcão: “Usa algum método para evitar gravidez?” e “Planeja engravidar?”. As respostas mudam a conduta: interação com o método e risco teratogênico.\u003c/p>\u003c/div>\n\u003ch3>Adesão, esquecimento e gravidez\u003c/h3>\n\u003cp>A causa mais comum de crise em quem tem epilepsia controlada é a dose esquecida ou suspensa. Privação de sono, álcool em excesso, febre e alguns medicamentos (bupropiona, tramadol, quinolonas em dose alta, alguns antipsicóticos) reduzem o limiar convulsivo. Quando o paciente esquece uma dose, a conduta depende do fármaco e do intervalo até a próxima tomada; a regra geral das bulas é não dobrar a dose seguinte.\u003c/p>\n\u003cp>Mulheres com epilepsia podem engravidar com segurança se o tratamento for planejado: escolha do fármaco de menor risco (lamotrigina e levetiracetam têm os menores riscos de malformação entre os principais), menor dose eficaz, ácido fólico antes da concepção em dose definida pelo médico e acompanhamento dos níveis séricos, que caem na gestação, especialmente o da lamotrigina. Suspender o anticonvulsivante ao descobrir a gravidez expõe mãe e feto ao risco de crises.\u003c/p>\n\u003ch3>Lista e receituário\u003c/h3>\n\u003cp>Ácido valproico, valproato de sódio, divalproato, carbamazepina, oxcarbazepina, fenitoína, lamotrigina, levetiracetam, topiramato, lacosamida, gabapentina, pregabalina, primidona, vigabatrina e cenobamato estão na Lista C1. Estiripentol também é C1. Fenobarbital e perampanel estão na Lista B1, mas os adendos 2 e 9 dessa lista os sujeitam à Receita de Controle Especial em duas vias. Clonazepam e clobazam, usados em epilepsia, são B1 com Notificação de Receita B. Para anticonvulsivantes e antiparkinsonianos, a quantidade por receita pode chegar a 6 meses de tratamento (Portaria 344/1998, art. 59, parágrafo único).\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Reforce: tomar no mesmo horário, não suspender de repente, não trocar de marca sem necessidade, evitar álcool, avisar sobre qualquer manchas na pele ou febre nas primeiras semanas (lamotrigina, carbamazepina) e procurar o médico antes de engravidar. Antes de dispensar antibiótico, antifúngico ou anticoncepcional para quem usa anticonvulsivante, confira a interação.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Jovem de 22 anos com epilepsia em uso de carbamazepina pede pílula do dia seguinte. O farmacêutico identifica a interação com o indutor, explica que a eficácia do levonorgestrel em dose habitual pode estar reduzida e orienta procurar com urgência um serviço que possa inserir DIU de cobre ou avaliar o esquema, e conversar com o neurologista sobre um método contraceptivo adequado.\u003c/p>\u003c/div>"},{"id":"m02-anestesicos","titulo":"Anestésicos gerais e locais","resumo":"\u003cp>Anestésicos gerais são de uso hospitalar, mas o farmacêutico de drogaria atende pacientes no pré e no pós-operatório e precisa entender os conceitos básicos. Anestésicos locais, por outro lado, estão no balcão todos os dias: pomadas para hemorroida, géis bucais, pastilhas e sprays para garganta, cremes antes de procedimentos.\u003c/p>\n\u003ch3>Anestesia geral: conceitos essenciais\u003c/h3>\n\u003cp>Anestesia geral é um estado reversível e induzido por fármacos que combina inconsciência (hipnose), amnésia, analgesia, imobilidade e controle das respostas autonômicas. Raramente um só fármaco faz tudo: o anestesiologista associa hipnótico, opioide, bloqueador neuromuscular e, às vezes, sedativo.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Fármacos\u003c/th>\u003cth>Pontos principais\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Inalatórios halogenados\u003c/td>\u003ctd>Sevoflurano, desflurano, isoflurano\u003c/td>\u003ctd>Potência medida pela concentração alveolar mínima (CAM); podem desencadear hipertermia maligna em suscetíveis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Gás\u003c/td>\u003ctd>Óxido nitroso\u003c/td>\u003ctd>Analgésico, pouco potente como anestésico isolado\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Venosos\u003c/td>\u003ctd>Propofol, etomidato, tiopental\u003c/td>\u003ctd>Indução rápida; propofol causa hipotensão e dor à injeção\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Venosos com analgesia\u003c/td>\u003ctd>Cetamina, escetamina\u003c/td>\u003ctd>Antagonistas NMDA; mantêm reflexos de via aérea; podem causar alucinações\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sedativos\u003c/td>\u003ctd>Midazolam, dexmedetomidina\u003c/td>\u003ctd>Ansiólise e sedação; dexmedetomidina é agonista alfa-2\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A hipertermia maligna é uma reação hereditária a halogenados e à succinilcolina: rigidez, aumento rápido de CO\u003csub>2\u003c/sub> expirado, febre e acidose, tratada com dantroleno. Paciente com história familiar deve informar antes de qualquer cirurgia.\u003c/p>\n\u003cp>Sevoflurano, desflurano, isoflurano, propofol, etomidato e dexmedetomidina constam da Lista C1; tiopental, cetamina e escetamina são B1, e cetamina e escetamina só podem ser dispensadas e usadas em estabelecimentos de saúde (adendo 14 da Lista B1) (Portaria 344/1998, Atualização n. 101).\u003c/p>\n\u003cp>No pós-operatório, o paciente chega à farmácia com analgésicos, às vezes opioides, antieméticos e anticoagulantes profiláticos. Sonolência, náusea, constipação e retenção urinária são esperadas nos primeiros dias, mas sonolência intensa ou respiração lenta exigem avaliação.\u003c/p>\n\u003ch3>Pré-operatório no balcão\u003c/h3>\n\u003cp>Antes de cirurgias e procedimentos, a equipe médica decide quais medicamentos suspender e quando. O farmacêutico ajuda o paciente a levar a lista completa, incluindo fitoterápicos e suplementos: ginkgo, alho em cápsula, ômega 3 em dose alta e erva-de-são-joão interferem em sangramento ou em anestésicos. Anticoagulantes, antiagregantes, antidiabéticos (incluindo análogos de GLP-1, que retardam o esvaziamento gástrico) e IMAO têm regras próprias de manejo perioperatório definidas pela equipe. A orientação de jejum também é da equipe; o balcão não deve substituí-la.\u003c/p>\n\u003ch3>Anestésicos locais: mecanismo\u003c/h3>\n\u003cp>Anestésicos locais bloqueiam canais de sódio dependentes de voltagem pelo lado de dentro da membrana do neurônio e impedem a condução do impulso. Para chegar lá, o fármaco atravessa a membrana na forma não ionizada (base). Em tecido inflamado ou infectado, o pH é mais ácido, a fração ionizada aumenta e o efeito diminui: por isso um abscesso é difícil de anestesiar.\u003c/p>\n\u003cp>As fibras finas são bloqueadas primeiro: dor e temperatura somem antes do tato, da pressão e da força muscular.\u003c/p>\n\u003ch3>Ésteres e amidas\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Metabolismo\u003c/th>\u003cth>Alergia\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Ésteres\u003c/td>\u003ctd>Benzocaína, tetracaína, procaína\u003c/td>\u003ctd>Colinesterase plasmática, rápido\u003c/td>\u003ctd>Mais frequente, pelo metabólito ácido para-aminobenzoico (PABA)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Amidas\u003c/td>\u003ctd>Lidocaína, prilocaína, bupivacaína, ropivacaína, mepivacaína, articaína\u003c/td>\u003ctd>Hepático\u003c/td>\u003ctd>Rara; quando ocorre, muitas vezes é ao conservante\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Truque de memória: as amidas têm a letra “i” antes de “caína” no prefixo (lidocaína, prilocaína, bupivacaína, mepivacaína, ropivacaína); os ésteres não (benzocaína, procaína, tetracaína).\u003c/p>\n\u003ch3>Toxicidade sistêmica\u003c/h3>\n\u003cp>Quando muito anestésico chega ao sangue (dose alta, injeção intravascular acidental, aplicação em grande área de pele lesada ou mucosa), surgem sinais em sequência: formigamento ao redor da boca, gosto metálico, zumbido, tontura, agitação, convulsões e, depois, depressão cardiovascular e arritmias. A bupivacaína é a mais cardiotóxica. O tratamento hospitalar inclui suporte e emulsão lipídica.\u003c/p>\n\u003ch3>Vasoconstritor\u003c/h3>\n\u003cp>A epinefrina (adrenalina) associada ao anestésico local reduz o fluxo sanguíneo local, prolonga o efeito, diminui o sangramento e reduz a absorção sistêmica, permitindo dose total maior. Na odontologia, outros vasoconstritores também são usados. Pacientes cardiopatas, hipertensos descompensados e usuários de betabloqueador não seletivo ou tricíclico exigem avaliação do profissional que vai aplicar. Para o balcão, a informação útil é: o paciente deve contar ao dentista quais medicamentos usa.\u003c/p>\n\u003ch3>Uso tópico em farmácia\u003c/h3>\n\u003cul>\n\u003cli>Lidocaína: pomadas e cremes para hemorroidas (associada a outros ativos), géis bucais, soluções para garganta, sprays e géis para pequenos procedimentos. Algumas associações com lidocaína e com benzocaína constam da Lista de Medicamentos Isentos de Prescrição (IN 285/2024, com a lista atualizada pela IN 404/2025).\u003c/li>\n\u003cli>Benzocaína: pastilhas e soluções para dor de garganta, em associação com antissépticos.\u003c/li>\n\u003cli>Lidocaína com prilocaína em creme: anestesia da pele antes de punções e pequenos procedimentos, com oclusão e tempo de aplicação definidos na bula; em lactentes há limite de área e de dose.\u003c/li>\n\u003cli>Tetracaína: está na Lista C1; o adendo 5 libera da prescrição as preparações tópicas odontológicas sem outro ativo, exige prescrição sem retenção para colutórios e soluções otorrinolaringológicas (otite externa) e prescrição com retenção para as oftálmicas. Outros anestésicos oftálmicos (proximetacaína, oxibuprocaína) também são C1.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Colírio anestésico não se vende para alívio de dor ocular em casa. O uso repetido lesa a córnea e mascara doenças graves. Essas substâncias estão na Lista C1 e as preparações oftálmicas exigem receita retida (Portaria 344/1998, adendo 5 da Lista C1).\u003c/p>\u003c/div>\n\u003ch3>Uso correto dos anestésicos tópicos\u003c/h3>\n\u003cp>Anestésicos tópicos aliviam sintomas, mas não tratam a causa. Pomadas para hemorroidas com lidocaína devem ser usadas por poucos dias; sangramento retal, dor intensa ou sintomas que persistem pedem avaliação médica. Aplicações repetidas em pele lesada, queimada ou em mucosa extensa aumentam a absorção sistêmica. Uso prolongado de produtos com benzocaína ou outros ésteres pode causar dermatite de contato. Sprays e géis bucais reduzem o reflexo de deglutição por algum tempo: comer logo após a aplicação, sobretudo em crianças e idosos, aumenta o risco de engasgo e de morder a língua ou a bochecha.\u003c/p>\n\u003ch3>Metemoglobinemia por benzocaína e prilocaína\u003c/h3>\n\u003cp>Benzocaína e prilocaína (por um metabólito) oxidam o ferro da hemoglobina, formando metemoglobina, que não transporta oxigênio. Bebês e crianças pequenas são mais suscetíveis. A FDA determinou, em 2018, a retirada do mercado americano dos produtos de venda livre com benzocaína para dentição em menores de 2 anos, pelo risco de metemoglobinemia e pela falta de benefício, e exigiu advertência sobre metemoglobinemia nos demais produtos com benzocaína.\u003c/p>\n\u003cp>Sinais: pele, lábios e unhas acinzentados ou azulados, que não melhoram com oxigênio, cansaço, cefaleia, falta de ar, taquicardia, confusão. Surgem minutos a poucas horas após o uso. O tratamento hospitalar é com azul de metileno.\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Para dor de dentição, oriente medidas sem fármaco (mordedor de borracha firme, que pode ser resfriado mas não congelado, e massagem na gengiva com dedo limpo) e analgésico oral em dose por peso quando necessário, conforme orientação pediátrica. Não indique gel anestésico com benzocaína para bebês. Para dor de garganta em adulto, pastilha com anestésico é aceitável por poucos dias; febre alta, dificuldade de engolir saliva ou duração maior que alguns dias exigem encaminhamento.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mãe pede gel para passar na gengiva do filho de 10 meses. O farmacêutico explica o risco da benzocaína nessa idade, orienta medidas não farmacológicas e sinais que exigem consulta (febre alta, recusa alimentar, irritabilidade intensa) e não dispensa o gel.\u003c/p>\u003c/div>"},{"id":"m02-sedativos-hipnoticos","titulo":"Sedativos e hipnóticos","resumo":"\u003cp>Insônia e ansiedade levam muitas pessoas à farmácia pedindo “algo para dormir”. Benzodiazepínicos, drogas Z, antidepressivos sedativos, anti-histamínicos e melatonina têm perfis e regras muito diferentes. A primeira linha para insônia crônica é a terapia cognitivo-comportamental para insônia (TCC-I) e a revisão de hábitos; hipnóticos são para uso curto e criterioso.\u003c/p>\n\u003ch3>Benzodiazepínicos: mecanismo e efeitos\u003c/h3>\n\u003cp>Benzodiazepínicos ligam-se ao receptor GABA-A em sítio próprio e aumentam a frequência de abertura do canal de cloreto quando o GABA está presente. O resultado é hiperpolarização e menor excitabilidade neuronal. Os efeitos são ansiolítico, hipnótico, anticonvulsivante, relaxante muscular e amnésia anterógrada. Isolados, têm margem de segurança maior que os barbitúricos; associados a álcool, opioides ou outros depressores, podem causar depressão respiratória grave.\u003c/p>\n\u003ch3>Classificação pela meia-vida\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Implicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Curta ação\u003c/td>\u003ctd>Midazolam\u003c/td>\u003ctd>Indução do sono, procedimentos; mais insônia de rebote e amnésia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ação intermediária\u003c/td>\u003ctd>Alprazolam, lorazepam, bromazepam\u003c/td>\u003ctd>Ansiedade; alprazolam tem retirada difícil por meia-vida curta e alta potência\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Longa ação\u003c/td>\u003ctd>Diazepam, clonazepam, clobazam, cloxazolam, flurazepam\u003c/td>\u003ctd>Efeito residual no dia seguinte, acúmulo no idoso; retirada mais suave\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>O diazepam gera metabólito ativo (desmetildiazepam) de meia-vida muito longa. Lorazepam e oxazepam só sofrem glicuronidação e acumulam menos em hepatopatas e idosos. A equivalência de doses entre benzodiazepínicos é aproximada e varia entre fontes; serve para planejar troca e retirada, nunca como conversão exata (ver material de apoio).\u003c/p>\n\u003ch3>Tolerância, dependência e retirada\u003c/h3>\n\u003cp>Tolerância ao efeito hipnótico aparece em poucas semanas; ao efeito ansiolítico, mais lentamente. Dependência física pode surgir após 2 a 4 semanas de uso contínuo. A retirada abrupta causa ansiedade, insônia de rebote, irritabilidade, tremor, sudorese, hipersensibilidade a luz e som e, em uso de doses altas ou prolongado, convulsões e delirium.\u003c/p>\n\u003cp>A retirada deve ser gradual, com reduções pequenas e espaçadas, ajustadas à tolerância do paciente, durante semanas a meses. Uma estratégia comum é trocar um benzodiazepínico de meia-vida curta por um de meia-vida longa (diazepam ou clonazepam) e reduzir este (Ashton, 2002). A decisão é do prescritor; o farmacêutico apoia o paciente com calendário de doses e acompanhamento.\u003c/p>\n\u003ch3>Idosos e quedas\u003c/h3>\n\u003cp>Os critérios de Beers (AGS, 2023) recomendam evitar benzodiazepínicos em idosos pelo aumento de prejuízo cognitivo, delirium, quedas, fraturas e acidentes de trânsito. A mesma recomendação vale para as drogas Z. Quando o idoso já usa há anos, a conduta é planejar retirada, não suspender de uma vez.\u003c/p>\n\u003ch3>Drogas Z\u003c/h3>\n\u003cp>Zolpidem, zopiclona e eszopiclona agem no mesmo receptor GABA-A, com seletividade maior para subunidades ligadas ao sono. Têm meia-vida curta (o zolpidem de liberação imediata, cerca de 2 a 3 horas). Riscos: comportamentos complexos durante o sono (sonambulismo, dirigir, cozinhar ou sair de casa sem lembrar depois), que levaram a FDA a incluir alerta em caixa em 2019; sonolência e prejuízo psicomotor na manhã seguinte, maiores em mulheres e com formas de liberação prolongada; dependência e uso abusivo. Tomar só ao deitar e com 7 a 8 horas disponíveis para dormir.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Particularidade\u003c/th>\u003cth>Lista\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Zolpidem liberação imediata\u003c/td>\u003ctd>Início rápido; dificuldade para iniciar o sono\u003c/td>\u003ctd>B1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Zolpidem sublingual\u003c/td>\u003ctd>Doses menores, usado conforme bula; risco de prejuízo se tomado com pouco tempo de sono restante\u003c/td>\u003ctd>B1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Zolpidem liberação prolongada\u003c/td>\u003ctd>Ajuda a manter o sono; mais sonolência residual\u003c/td>\u003ctd>B1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Zopiclona e eszopiclona\u003c/td>\u003ctd>Meia-vida um pouco maior; gosto metálico ou amargo é comum\u003c/td>\u003ctd>B1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lemborexante\u003c/td>\u003ctd>Antagonista dos receptores de orexina, mecanismo diferente\u003c/td>\u003ctd>B1\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>A RDC 871/2024 excluiu o adendo 4 da Lista B1, que equiparava à C1 o zolpidem até 10 mg por unidade, e determinou: “A partir de 01º de agosto de 2024, as prescrições e dispensações de medicamentos à base de zolpidem e zaleplona, devem ser realizadas por meio da Notificação de Receita B, em cor azul” (art. 2º). O adendo 5, que admitia Receita de Controle Especial para zopiclona e eszopiclona até 7,5 mg, também foi excluído: na lista vigente, zolpidem, zopiclona, eszopiclona e lemborexante estão na B1 sem exceção (Atualização n. 101, RDC 1.036/2026).\u003c/p>\u003c/div>\n\u003ch3>Melatonina\u003c/h3>\n\u003cp>No Brasil, a melatonina não é aprovada como medicamento. É autorizada apenas como suplemento alimentar, para pessoas com 19 anos ou mais, com consumo máximo de 0,21 mg por dia, sem qualquer alegação de melhora do sono ou de tratamento de insônia, e com advertência de não uso por gestantes, lactantes, crianças e pessoas em atividades que exigem atenção constante (Anvisa, alteração da IN 28/2018 aprovada em 2021; Ministério da Saúde). Produtos com dose maior, para crianças ou com indicação terapêutica no rótulo são irregulares, e a Anvisa tem determinado o recolhimento de produtos irregulares, como uma melatonina sublingual em gotas com alegação de tratar insônia (março de 2026). A ramelteona, agonista de receptores de melatonina, consta da Lista C1.\u003c/p>\n\u003ch3>Anti-histamínicos sedativos e outros\u003c/h3>\n\u003cp>Difenidramina, hidroxizina, prometazina e dexclorfeniramina causam sonolência por bloqueio H1 central. A tolerância ao efeito sedativo surge em dias, a sonolência residual é comum e o efeito anticolinérgico causa confusão, retenção urinária e constipação no idoso (evitar, segundo Beers 2023). Em crianças pequenas podem causar agitação paradoxal; a prometazina é contraindicada abaixo de 2 anos pelo risco de depressão respiratória fatal (alerta em caixa da FDA). Antidepressivos sedativos em dose baixa (trazodona, mirtazapina, amitriptilina) e antipsicóticos como quetiapina são usados para insônia sem evidência robusta para esse fim isolado. Fitoterápicos como valeriana e passiflora têm evidência limitada e também potencializam outros depressores.\u003c/p>\n\u003ch3>Quem pede algo para dormir\u003c/h3>\n\u003cp>A insônia pode ser sintoma de outra condição: dor, ansiedade, depressão, apneia do sono, refluxo, noctúria, pernas inquietas, hipertireoidismo, uso de cafeína, álcool, descongestionantes, corticoides, bupropiona, ISRS ou broncodilatadores. Antes de qualquer sugestão, o farmacêutico investiga a duração, o padrão (dificuldade para iniciar, manter ou despertar precoce) e o impacto no dia.\u003c/p>\n\u003cp>Medidas de higiene do sono que podem ser orientadas no balcão:\u003c/p>\n\u003cul>\n\u003cli>Horário regular para deitar e levantar, inclusive nos fi

  --ok:#0E9F6E; --okSup:#E3F8EF; --err:#E5484D; --errSup:#FFECEC; --warn:#D97706; --warnSup:#FFF4DE;
  --rG:24px;
  --sombra:0 1px 2px rgba(20,24,39,.04),0 4px 14px rgba(20,24,39,.05);
  --sombraM:0 12px 32px rgba(20,24,39,.12),0 2px 6px rgba(20,24,39,.05);
  --mola:cubic-bezier(.34,1.56,.64,1); --suave:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --lat:264px; --nav:0px; --fonteL:1;
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --papel:#0D1017; --sup:#161B26; --sup2:#1C2230; --sup3:#252D3E;
  --ink:#EDF0F7; --ink2:#A3ABBE; --ink3:#737C95; --linha:#252C3B; --linhaF:#343D51;
  --okSup:#0F2A20; --errSup:#34181A; --warnSup:#33260C;
  --sombra:0 1px 2px rgba(0,0,0,.4); --sombraM:0 14px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --papel:#0D1017; --sup:#161B26; --sup2:#1C2230; --sup3:#252D3E;
  --ink:#EDF0F7; --ink2:#A3ABBE; --ink3:#737C95; --linha:#252C3B; --linhaF:#343D51;
  --okSup:#0F2A20; --errSup:#34181A; --warnSup:#33260C;
  --sombra:0 1px 2px rgba(0,0,0,.4); --sombraM:0 14px 34px rgba(0,0,0,.55);
  color-scheme:dark;
}}
body{--acSup:color-mix(in srgb,var(--ac) 12%,var(--sup));--acInk:color-mix(in srgb,var(--ac) 78%,var(--ink));--acBt:color-mix(in srgb,var(--ac) 88%,#000)}
:root[data-tema="escuro"] body{--acSup:color-mix(in srgb,var(--ac) 20%,var(--sup));--acInk:color-mix(in srgb,var(--ac) 65%,#fff)}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]) body{--acSup:color-mix(in srgb,var(--ac) 20%,var(--sup));--acInk:color-mix(in srgb,var(--ac) 65%,#fff)}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.25;margin:0}
a{color:var(--acInk)}
button,input,select,textarea{font:inherit;color:inherit}
.ti{line-height:1}
[hidden]{display:none!important}
kbd{font:600 11px var(--sans);background:var(--sup2);border:1px solid var(--linhaF);border-radius:6px;padding:1px 6px;color:var(--ink2)}

/* ---------- barra lateral ---------- */
#lateral{position:fixed;inset:0 auto 0 0;width:var(--lat);background:var(--sup);border-right:1px solid var(--linha);display:flex;flex-direction:column;z-index:30;padding:20px 14px 12px}
.marca{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;padding:0 6px 16px}
.marca .logo{width:38px;height:38px;border-radius:50%;background:var(--marca);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:21px;box-shadow:0 6px 16px color-mix(in srgb,var(--marca) 35%,transparent)}
.marca small{display:block;font-size:11.5px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:1px}
.navGrupo{color:var(--ink3);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:12px 12px 6px}
#abas{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.aba{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink2);border-radius:999px;min-height:40px;padding:4px 12px 4px 4px;font-size:13.5px;font-weight:540;cursor:pointer;text-align:left;text-decoration:none;line-height:1.25;transition:background .2s,color .2s}
.aba .ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:0 0 auto;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);transition:transform .25s var(--mola),background .2s,color .2s}
.aba:hover{background:var(--sup2);color:var(--ink)}
.aba:hover .ti{transform:scale(1.1) rotate(-6deg)}
.aba[aria-current="true"]{background:color-mix(in srgb,var(--c) 12%,var(--sup));color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:650}
.aba[aria-current="true"] .ti{background:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.aba .pct{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.pe{border-top:1px solid var(--linha);padding-top:8px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.btIco{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink2);border-radius:999px;padding:8px 10px;font-size:13px;font-weight:560;cursor:pointer;text-align:left}
.btIco:hover{background:var(--sup2);color:var(--ink)}
.btIco .ti{font-size:18px}
.btIco.on{background:var(--warnSup);color:var(--warn)}
.btIco.alerta{color:var(--warn)}
.btIco .ponto{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:auto}
main{margin-left:var(--lat);padding:30px 40px 70px;max-width:calc(1280px + var(--lat))}
#topoMovel,#barra{display:none}
@media(min-width:900px) and (max-width:1180px){
  :root{--lat:76px}
  #lateral{padding:18px 10px}
  .marca{justify-content:center;padding:0 0 12px}.marca .nm,.navGrupo{display:none}
  .aba{justify-content:center;padding:4px;width:44px;margin:0 auto}
  .aba span,.aba .pct{display:none}
  .pe{grid-template-columns:1fr;justify-items:center}.pe .btIco span,.pe kbd{display:none}
  main{padding:26px 28px 60px}
}
@media(max-width:899px){
  :root{--lat:0px;--nav:64px}
  #lateral{display:none}
  main{margin:0;padding:16px 16px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
  #topoMovel{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--papel) 92%,transparent);padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--linha)}
  #topoMovel .marca{padding:0;font-size:16px;flex:1;min-width:0}
  #topoMovel .marca .logo{width:32px;height:32px;font-size:17px}
  #topoMovel .marca b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topoMovel .btIco{padding:8px}
  #barra{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sup);border-top:1px solid var(--linha);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #barra button{--c:var(--c-indigo);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:2px 0;cursor:pointer}
  #barra button .ti{font-size:20px;width:46px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s}
  #barra button[aria-current="true"]{color:color-mix(in srgb,var(--c) 75%,var(--ink))}
  #barra button[aria-current="true"] .ti{background:var(--c);color:#fff}
}

/* ---------- título de página ---------- */
#pgTitulo{display:grid;grid-template-columns:auto 1fr auto;column-gap:16px;align-items:center;margin-bottom:20px}
#pgTitulo .selo{grid-row:span 2;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-size:27px;box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 35%,transparent);animation:pop .5s var(--mola) both}
#pgTitulo h1{grid-column:2;font-size:27px;font-weight:750;letter-spacing:-.03em}
#pgTitulo p{grid-column:2;margin:3px 0 0;font-size:14px;color:var(--ink2)}
#pgTitulo .acoes{grid-column:3;grid-row:1/span 2;display:flex;gap:8px}
@media(max-width:899px){#pgTitulo{margin-bottom:14px}#pgTitulo .selo{width:44px;height:44px;font-size:21px}#pgTitulo h1{font-size:21px}#pgTitulo p{font-size:12.5px}#pgTitulo .acoes{display:none}}

/* ---------- superfícies e controles ---------- */
.card{background:var(--sup);border:1px solid var(--linha);border-radius:var(--rG);box-shadow:var(--sombra);padding:22px 24px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h3 .ti{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acSup);color:var(--acInk);font-size:16px;flex:0 0 auto}
.sub{color:var(--ink2);font-size:13.5px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--acBt);background:var(--acBt);color:#fff;border-radius:999px;min-height:42px;padding:9px 20px;font-weight:620;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;
  box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 28%,transparent);transition:transform .15s var(--mola),box-shadow .2s,filter .2s}
.bt:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in srgb,var(--ac) 34%,transparent)}
.bt:active{transform:scale(.96)}
.bt .ti{font-size:17px}
.bt.sec{background:var(--sup);color:var(--ink);border-color:var(--linhaF);box-shadow:none}
.bt.sec:hover{background:var(--sup2);filter:none}
.bt.mini{min-height:34px;padding:5px 14px;font-size:13px}
.bt:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.linhaBt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--sup);border:1.5px solid var(--linhaF);border-radius:14px;padding:9px 13px;min-height:42px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{min-height:300px;resize:vertical;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 16%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--linhaF);background:var(--sup);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s;text-decoration:none}
.chip:hover{border-color:var(--ac);color:var(--acInk)}
.chip[aria-pressed="true"]{background:var(--acBt);border-color:var(--acBt);color:#fff}
.chip .ti{font-size:15px}
.chip .n{font-size:11.5px;opacity:.75}
.pil{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:650;background:var(--sup2);color:var(--ink2);white-space:nowrap}
.pil .ti{font-size:13px}
.barra{height:8px;border-radius:999px;background:var(--sup3);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:999px;background:var(--k,var(--ac));transition:width 1s var(--suave)}
.tabs2{display:inline-flex;background:var(--sup2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs2 a{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;transition:background .2s,color .2s}
.tabs2 a .ti{font-size:16px}
.tabs2 a .ct{display:none}
.tabs2 a .n{font-size:12px;font-weight:700;color:var(--ink3)}
.tabs2 a:hover{color:var(--ink)}
.tabs2 a[aria-current="true"]{background:var(--sup);color:var(--acInk);box-shadow:var(--sombra)}
.tabs2 a[aria-current="true"] .n{color:var(--acInk)}
.barraMod{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
@media(max-width:640px){.barraMod{position:sticky;top:57px;z-index:20;background:color-mix(in srgb,var(--papel) 94%,transparent);margin:0 -16px 16px;padding:6px 16px}.tabs2{display:flex;width:100%;flex-wrap:nowrap}.tabs2 a{flex:1;justify-content:center;padding:8px 6px;font-size:13px;gap:5px}.tabs2 a .n{display:none}.tabs2 a .lg{display:none}.tabs2 a .ct{display:inline}}
.faixa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warnSup);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:color-mix(in srgb,var(--warn) 70%,var(--ink));border-radius:18px;padding:10px 12px 10px 16px;margin:0 0 18px;font-size:14px;font-weight:550}
.faixa .ti{font-size:18px}
.faixa span{flex:1;min-width:200px}

/* ---------- início ---------- */
.vIni{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.vIni>*{min-width:0}
.vHero{--k:var(--c-indigo);grid-column:span 8;position:relative;overflow:hidden;border-radius:28px;padding:28px 30px;background:var(--k);color:#fff;display:flex;gap:24px;align-items:center;box-shadow:0 18px 40px color-mix(in srgb,var(--k) 30%,transparent)}
.vHero .bola{position:absolute;border-radius:50%;background:#fff;opacity:.09;pointer-events:none}
.vHero .b1{width:260px;height:260px;right:-70px;top:-90px;animation:flutua 9s ease-in-out infinite}
.vHero .b2{width:130px;height:130px;right:170px;bottom:-60px;opacity:.07;animation:flutua 7s ease-in-out infinite reverse}
.vHero .b3{width:46px;height:46px;left:46%;top:18px;opacity:.12;animation:flutua 6s ease-in-out infinite}
.vHero .txt{flex:1;min-width:0;position:relative}
.vHero small{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.17);padding:5px 12px;border-radius:999px}
.vHero h2{font-size:27px;line-height:1.15;margin:14px 0 8px;font-weight:760;letter-spacing:-.03em}
.vHero p{margin:0 0 18px;opacity:.9;font-size:14.5px;max-width:52ch}
.vHero .bt{background:#fff;color:color-mix(in srgb,var(--k) 80%,#000);border-color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.vHero .bt.sec{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.32);box-shadow:none}
.vAnel{position:relative;width:150px;height:150px;flex:0 0 auto}
.vAnel svg{transform:rotate(-90deg)}
.vAnel .arco{transition:stroke-dashoffset 1.4s var(--suave)}
.vAnel .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.vAnel .val b{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em}
.vAnel .val span{font-size:12px;opacity:.88;margin-top:4px}
.vMeta{grid-column:span 4;border-radius:28px;padding:22px 24px;background:var(--sup);border:1px solid var(--linha);box-shadow:var(--sombra);display:flex;flex-direction:column}
.vMeta h3{font-size:15px}
.metaItem{--k:var(--c-azul);display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;margin-top:14px}
.metaItem .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,var(--sup));color:var(--k);font-size:17px}
.metaItem b{font-size:13.5px}.metaItem .barra{margin-top:5px;height:6px}
.metaItem em{font-style:normal;font-weight:750;font-size:13px;font-variant-numeric:tabular-nums}
.vMeta .rodape{margin:auto 0 0;padding-top:16px;font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.vStats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.vStat{--k:var(--c-azul);border-radius:24px;padding:18px 20px;background:color-mix(in srgb,var(--k) 11%,var(--sup));border:1px solid color-mix(in srgb,var(--k) 18%,transparent);display:flex;gap:14px;align-items:center;text-align:left;color:var(--ink);text-decoration:none;transition:transform .2s var(--mola),box-shadow .2s}
a.vStat:hover{transform:translateY(-4px);box-shadow:0 12px 26px color-mix(in srgb,var(--k) 22%,transparent)}
.vStat .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--k);color:#fff;font-size:22px;flex:0 0 auto;box-shadow:0 8px 18px color-mix(in srgb,var(--k) 35%,transparent);transition:transform .3s var(--mola)}
a.vStat:hover .ic{transform:rotate(-10deg) scale(1.08)}
.vStat b{display:block;font-size:25px;font-weight:800;line-height:1.1;letter-spacing:-.03em;color:color-mix(in srgb,var(--k) 75%,var(--ink));font-variant-numeric:tabular-nums}
.vStat span{font-size:12.5px;color:var(--ink2);font-weight:520}
.vTit{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 0 -4px;flex-wrap:wrap}
.vTit h3{font-size:17px}
.vTit .ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sup3);color:var(--ink2);font-size:17px}
.vTit small{color:var(--ink3);font-weight:600;font-size:13px}
.listaL{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.itemL{--k:var(--c-azul);background:var(--sup);border:1px solid var(--linha);border-radius:22px;padding:20px 18px 16px;box-shadow:var(--sombra);position:relative;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .2s var(--mola),box-shadow .2s;display:flex;flex-direction:column;gap:14px}
.itemL::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--k)}
.itemL:hover{transform:translateY(-4px);box-shadow:var(--sombraM)}
.itemL .topo{display:flex;align-items:center;gap:12px}
.itemL .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,var(--sup));color:var(--k);font-size:22px;flex:0 0 auto;transition:transform .25s var(--mola),background .2s,color .2s}
.itemL:hover .ic{transform:scale(1.08) rotate(-6deg);background:var(--k);color:#fff}
.itemL .num{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--k) 80%,var(--ink))}
.itemL h3{font-size:16px;line-height:1.3;margin-top:1px}
.itemL .conta{display:flex;gap:6px;flex-wrap:wrap}
.itemL .rod{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.itemL .rod .barra{flex:1;height:6px}
@media(max-width:1100px){.vHero,.vMeta{grid-column:1/-1}.vStats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  .vIni{gap:14px}
  .vHero{flex-direction:column-reverse;align-items:flex-start;padding:22px 20px;border-radius:24px}
  .vHero h2{font-size:22px}.vAnel{width:120px;height:120px;align-self:center}.vAnel svg{width:120px;height:120px}.vAnel .val b{font-size:27px}
  .vHero .linhaBt .bt{flex:1}
  .vStats{gap:10px}.vStat{padding:14px;gap:10px;border-radius:20px}.vStat .ic{width:38px;height:38px;font-size:18px}.vStat b{font-size:20px}
  .vMeta{padding:18px;border-radius:24px}
}

/* ---------- leitura (resumo) ---------- */
.leitor{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:26px;align-items:start}
.folha{background:var(--sup);border:1px solid var(--linha);border-radius:28px;padding:36px 48px 40px;box-shadow:var(--sombra);min-width:0}
.folha .dek{font-size:calc(16px * var(--fonteL));color:var(--ink2);margin:0;padding-bottom:22px;border-bottom:1px solid var(--linha);line-height:1.6}
.topico{padding-top:34px;scroll-margin-top:24px}
.topico+.topico{border-top:1px solid var(--linha);margin-top:30px}
.topico>header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.topico h2{font-size:calc(23px * var(--fonteL));flex:1;display:flex;align-items:flex-start;gap:12px;letter-spacing:-.025em}
.topico h2::before{content:"";width:6px;height:26px;border-radius:999px;background:var(--ac);flex:0 0 auto;margin-top:1px}
.ctl{display:none;gap:4px;flex:0 0 auto}
body.editando .ctl{display:inline-flex}
.ctl button{border:1px solid var(--linhaF);background:var(--sup);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:var(--ink2);padding:0;cursor:pointer}
.ctl button:hover{background:var(--sup2);color:var(--ink)}
.ctl button.del:hover{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.ctl button:disabled{opacity:.35;cursor:default}
.fimTop{display:flex;justify-content:flex-end;margin-top:8px}
.estudado{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--linhaF);background:var(--sup);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:650;color:var(--ink2);cursor:pointer;transition:all .2s var(--mola)}
.estudado:hover{border-color:var(--ok);color:var(--ok)}
.estudado.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s var(--mola)}
.lado{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px}
.lado .card{padding:16px;border-radius:22px}
.lado .card h3{font-size:14.5px;margin-bottom:10px}
.toc{display:flex;flex-direction:column;gap:1px;max-height:48vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.toc a{display:flex;gap:8px;align-items:flex-start;text-decoration:none;color:var(--ink2);font-size:13px;padding:6px 10px;border-radius:10px;border-left:3px solid transparent;line-height:1.35}
.toc a:hover{background:var(--sup2);color:var(--ink)}
.toc a.on{color:var(--acInk);border-left-color:var(--ac);background:var(--acSup);font-weight:650}
.toc a .ti{color:var(--ok);font-size:15px;margin-top:1px}
.praticar{display:flex;flex-direction:column;gap:8px}
.praticar a{--k:var(--ac);display:flex;align-items:center;gap:10px;border-radius:999px;padding:7px 16px 7px 7px;background:var(--k);color:#fff;font-weight:650;font-size:13.5px;text-decoration:none;box-shadow:0 6px 14px color-mix(in srgb,var(--k) 28%,transparent);transition:transform .2s var(--mola)}
.praticar a:hover{transform:translateX(4px)}
.praticar a .ti{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:15px}
.progMini{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.progMini .barra{flex:1;height:7px}
.progTopo{position:fixed;top:0;left:var(--lat);right:0;height:3px;z-index:50}
.progTopo i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.fontesL{margin-top:38px;padding-top:18px;border-top:1px solid var(--linha);font-size:13px;color:var(--ink2)}
.fontesL h4{font-size:14px;margin-bottom:8px;color:var(--ink)}
.fontesL ol{margin:0;padding-left:20px}.fontesL li{margin:5px 0;word-break:break-word}
@media(max-width:1180px){.leitor{grid-template-columns:minmax(0,1fr)}.lado{position:static;order:-1;flex-direction:row;flex-wrap:wrap}.lado .tocCard{display:none}.lado .card{flex:1;min-width:240px}}
@media(max-width:640px){.folha{padding:22px 18px;border-radius:22px}.topico h2{font-size:calc(19.5px * var(--fonteL))}.topico{padding-top:24px}.topico+.topico{margin-top:22px}}

/* conteúdo escrito (resumo, quadros) */
.conteudo{font-size:calc(16.5px * var(--fonteL));line-height:1.72;color:var(--ink)}
.conteudo p{margin:0 0 14px}
.conteudo h3{font-size:calc(18.5px * var(--fonteL));margin:28px 0 10px;color:var(--acInk)}
.conteudo h4{font-size:calc(16px * var(--fonteL));margin:20px 0 8px}
.conteudo ul,.conteudo ol{padding-left:24px;margin:0 0 16px}
.conteudo li{margin:5px 0}
.conteudo li::marker{color:var(--ac)}
.conteudo strong,.conteudo b{font-weight:700}
.tab{overflow-x:auto;margin:18px 0 22px;border:1px solid var(--linha);border-radius:16px}
.tab table,table.t{border-collapse:collapse;width:100%;font-size:calc(14px * var(--fonteL));line-height:1.45}
.tab th,table.t th{background:color-mix(in srgb,var(--ac) 10%,var(--sup));color:color-mix(in srgb,var(--ac) 70%,var(--ink));text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:bottom}
.tab td,table.t td{padding:9px 12px;border-top:1px solid var(--linha);vertical-align:top}
.tab tr:nth-child(even) td,table.t tr:nth-child(even) td{background:color-mix(in srgb,var(--sup2) 55%,transparent)}
.cx{border-radius:18px;padding:16px 18px 6px;margin:20px 0;font-size:calc(15.5px * var(--fonteL));background:color-mix(in srgb,var(--q) 8%,var(--sup));border:1px solid color-mix(in srgb,var(--q) 25%,transparent)}
.cx>b:first-child{display:flex;align-items:center;gap:8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:color-mix(in srgb,var(--q) 80%,var(--ink));margin-bottom:6px}
.cx>b:first-child::before{font-family:"tabler-icons";font-weight:400;font-size:15px;text-transform:none;letter-spacing:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--q);color:#fff}
.cx p{margin:0 0 10px}
.cx.chave{--q:var(--c-azul)}.cx.chave>b:first-child::before{content:"\ea51"}
.cx.alerta{--q:var(--c-vermelho)}.cx.alerta>b:first-child::before{content:"\ea06"}
.cx.balcao{--q:var(--c-verde)}.cx.balcao>b:first-child::before{content:"\ea4e"}
.cx.lei{--q:var(--c-violeta)}.cx.lei>b:first-child::before{content:"\ef90"}
.cx.exemplo{--q:var(--c-laranja)}.cx.exemplo>b:first-child::before{content:"\eaed"}
@media(max-width:640px){.tab td,.tab th{min-width:120px}.conteudo{font-size:calc(16px * var(--fonteL))}}

/* ---------- mapa mental vivo ---------- */
.pulaMapa{margin:-4px 0 16px}
.mapaCard{background:var(--sup);border:1px solid var(--linha);border-radius:28px;box-shadow:var(--sombra);padding:20px 22px 16px;margin:0 0 20px;scroll-margin-top:20px}
.mapaCard header,.bloco>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mapaCard header .ic,.bloco>header .ic,.mapaGrande .barraG .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-size:20px;flex:0 0 auto;box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
.mapaCard header .tit{flex:1;min-width:0}
.mapaCard header h2,.bloco>header h2{font-size:18px;letter-spacing:-.02em}
.mapaCard header small{display:block;font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.bloco>header h2{flex:1}
.mmBotoes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.mmBotoes .soMapa{display:contents}
.mmBotoes button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--linhaF);background:var(--sup);border-radius:999px;min-height:36px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .15s}
.mmBotoes button:hover{border-color:var(--ac);color:var(--acInk)}
.mmBotoes button .ti{font-size:16px}
.mmBotoes button[aria-pressed="true"]{background:var(--acBt);border-color:var(--acBt);color:#fff}
.mmBotoes [data-mapa="vista"]{margin-left:auto}
.mapaCard.vistaCartoes .mmBotoes .soMapa{display:none}
.mapa-rolo{border-radius:20px;background:color-mix(in srgb,var(--sup2) 55%,var(--sup));overflow:hidden;position:relative}
.mapa-rolo svg,.mapaGrande .area svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mapa-rolo svg.arrastando,.mapaGrande .area svg.arrastando{cursor:grabbing}
.dicaMapa{margin:8px 2px 0;font-size:12px;color:var(--ink3)}
.mapaCard.vistaCartoes .mapa-rolo,.mapaCard.vistaCartoes .dicaMapa{display:none}
.mmCartoes{display:none}
.mapaCard.vistaCartoes .mmCartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mapa-svg text{font-family:var(--sans)}
.mapa-svg text.mm-ico{font-family:"tabler-icons";font-weight:400}
.mm-txt{fill:var(--ink)}
.mm-sub{fill:var(--ink2)}
.mm-rotulo{fill:#fff}
.mm-centroTxt{fill:#fff}
.mm-it{fill:color-mix(in srgb,var(--k) 9%,var(--sup));stroke:color-mix(in srgb,var(--k) 55%,transparent);stroke-width:1.3}
.mm-contaFundo{fill:var(--sup)}
.mm-fio{fill:none;stroke-width:2;stroke-opacity:.7;stroke-linecap:round}
.mm-no{cursor:pointer;outline:none}
.mm-no rect{transition:filter .25s}
.mm-no:hover rect,.mm-no:focus-visible rect{filter:brightness(1.08) drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.mm-ramo{transition:opacity .3s}
.mm-item rect.mm-it{transition:fill .2s}
.mm-item:hover rect.mm-it{fill:color-mix(in srgb,var(--k) 18%,var(--sup))}
.mm-centro{cursor:pointer}
/* brotar ao abrir */
.mapa-svg:not(.estatico) .mm-ramo{transform-box:view-box;transform-origin:var(--cx) var(--cy);animation:brota .75s var(--mola) both;animation-delay:calc(var(--i) * 70ms)}
.mapa-svg:not(.estatico) .mm-item{animation:aparece .45s var(--suave) both;animation-delay:calc(var(--i) * 70ms + 380ms + var(--d) * 45ms)}
.mapa-svg:not(.estatico) .mm-centro{transform-box:fill-box;transform-origin:center;animation:pop .6s var(--mola) both}
@keyframes brota{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
/* destaque e foco */
.mapa-svg:has(.mm-ramo:hover) .mm-ramo:not(:hover){opacity:.28}
.mapa-svg.foco .mm-ramo:not(.fixo){opacity:.15}
.mapa-svg.foco:has(.mm-ramo:hover) .mm-ramo.fixo:not(:hover){opacity:1}
/* Teste-se: itens escondidos até tocar no ramo */
.mapa-svg.revisao .mm-ramo .mm-itens{opacity:0;transition:opacity .35s}
.mapa-svg.revisao .mm-ramo.revelado .mm-itens{opacity:1}
.mapa-svg.revisao .mm-ramo:not(.revelado) .mm-no rect{stroke:#fff;stroke-width:2.5;stroke-dasharray:5 4}
.mapa-svg.revisao .mm-ramo.revelado .mm-item{animation:aparece .4s var(--suave) both;animation-delay:calc(var(--d) * 60ms)}
.mmCartao{--k:var(--c-azul);border-radius:22px;border:1px solid color-mix(in srgb,var(--k) 22%,transparent);background:color-mix(in srgb,var(--k) 6%,var(--sup));overflow:hidden;animation:sobe .45s var(--suave) both;animation-delay:calc(var(--i) * 50ms)}
.mmCartao header{display:flex;align-items:center;gap:10px;background:var(--k);color:#fff;padding:10px 14px}
.mmCartao header .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.mmCartao h4{font-size:15px;flex:1;letter-spacing:-.01em}
.mmCartao em{font-style:normal;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 9px}
.mmCartao ul{list-style:none;margin:0;padding:10px 14px 12px;display:grid;gap:7px}
.mmCartao li{position:relative;padding-left:18px;font-size:14px;line-height:1.45}
.mmCartao li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--k)}
.mmCartao li b{font-weight:650}
.mmCartao .subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.mmCartao .subs span{font-size:12px;font-weight:600;background:color-mix(in srgb,var(--k) 13%,var(--sup));color:color-mix(in srgb,var(--k) 75%,var(--ink));border-radius:999px;padding:2px 9px}
.mapaCard.revisao .mmCartao:not(.revelado){cursor:pointer}
.mapaCard.revisao .mmCartao:not(.revelado) ul{filter:blur(7px);opacity:.5;user-select:none}
.mapaCard.revisao .mmCartao:not(.revelado) header::after{content:"Toque para revelar";font-size:11.5px;font-weight:650;opacity:.85}
.veu{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px 16px;animation:fade .2s ease;overflow-y:auto}
.veu.cheio{padding:14px;align-items:stretch;background:var(--papel)}
.mapaGrande{width:100%;display:flex;flex-direction:column;gap:10px;margin:0;border-radius:24px;padding:14px 16px}
.mapaGrande .barraG{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mapaGrande .barraG h2{flex:1;font-size:18px;min-width:200px}
.mapaGrande .mmBotoes{margin:0}
.mapaGrande .area{flex:1;min-height:0;overflow:hidden;background:color-mix(in srgb,var(--sup2) 55%,var(--sup));border-radius:20px}
.mapaGrande .area svg{height:100%}

/* ---------- material de apoio ---------- */
.filtroA{margin-bottom:18px}
.bloco{background:var(--sup);border:1px solid var(--linha);border-radius:26px;box-shadow:var(--sombra);padding:22px 26px;margin:0 0 18px;scroll-margin-top:20px}
.bloco>header .tipo{font-size:12px;font-weight:650;color:var(--ink3)}
.bloco .nota{font-size:13px;color:var(--ink2);margin:10px 0 0}
.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1.5px solid var(--linha);border-radius:16px;cursor:pointer;line-height:1.45;transition:background .15s,border-color .15s}
.check label:hover{border-color:var(--linhaF)}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--linhaF);margin:0;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;transition:all .2s var(--mola)}
.check input:checked{background:var(--ok);border-color:var(--ok);animation:pop .3s var(--mola)}
.check input:checked::after{content:"\ea5e";font-family:"tabler-icons";color:#fff;font-size:14px}
.check label:has(input:checked){background:var(--okSup);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.check label:has(input:checked) span{color:var(--ink2)}
.fluxo{display:flex;flex-direction:column;align-items:center;padding:4px 0}
.passo{position:relative;max-width:600px;width:100%;text-align:center;border-radius:18px;padding:12px 18px;border:1.5px solid color-mix(in srgb,var(--ac) 45%,transparent);background:var(--sup);font-size:15px;line-height:1.45}
.passo.inicio,.passo.fim{border-radius:999px;background:var(--acBt);border-color:var(--acBt);color:#fff;font-weight:650}
.passo.decisao{border-color:color-mix(in srgb,var(--c-ambar) 60%,transparent);background:color-mix(in srgb,var(--c-ambar) 9%,var(--sup))}
.passo.decisao::before{content:"Decisão";display:block;font-size:11px;font-weight:750;color:color-mix(in srgb,var(--c-ambar) 70%,var(--ink));letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.passo.alerta{border-color:color-mix(in srgb,var(--err) 55%,transparent);background:var(--errSup)}
.passo.alerta::before{content:"Atenção";display:block;font-size:11px;font-weight:750;color:var(--err);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.saidas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;text-align:left}
.saidas div{border-radius:12px;padding:7px 10px;font-size:13.5px}
.saidas .sim{background:var(--okSup);color:color-mix(in srgb,var(--ok) 70%,var(--ink))}
.saidas .nao{background:var(--errSup);color:color-mix(in srgb,var(--err) 70%,var(--ink))}
.saidas b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.seta{width:2px;height:24px;background:var(--linhaF);position:relative}
.seta::after{content:"";position:absolute;left:50%;bottom:-2px;translate:-50% 0;border:6px solid transparent;border-top-color:var(--linhaF);border-bottom:0}
/* cartões (um por vez) */
.flash{max-width:720px;margin:0 auto}
.flashTopo{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink2);font-weight:600}
.carta{perspective:1600px;cursor:pointer;min-height:250px;border:0;background:none;padding:0;width:100%;display:block;text-align:center;color:var(--ink)}
.carta .in{position:relative;min-height:250px;transition:transform .6s var(--suave);transform-style:preserve-3d}
.carta.virada .in{transform:rotateY(180deg)}
.carta .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sup);border:1px solid var(--linha);border-radius:26px;box-shadow:var(--sombraM);padding:28px 32px 20px;display:flex;flex-direction:column;overflow:auto}
.carta .face::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--ac);border-radius:26px 26px 0 0}
.carta .verso{transform:rotateY(180deg);background:color-mix(in srgb,var(--ac) 7%,var(--sup))}
.carta .rot{font-size:11.5px;font-weight:750;color:var(--acInk);text-transform:uppercase;letter-spacing:.05em}
.carta .cont{flex:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:620;line-height:1.45;padding:14px 0}
.carta .verso .cont{font-size:17px;font-weight:500}
.carta .dica{font-size:12.5px;color:var(--ink3)}
.navQ{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.navQ .pontos{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.navQ .pontos i{width:8px;height:8px;border-radius:50%;background:var(--sup3)}
.navQ .pontos i.v{background:color-mix(in srgb,var(--ac) 45%,var(--sup3))}
.navQ .pontos i.ok{background:var(--ok)}.navQ .pontos i.er{background:var(--err)}
.navQ .pontos i.at{outline:2px solid var(--ac);outline-offset:2px}
/* questões (uma por vez) */
.quiz{max-width:900px}
.qTopo{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qNum{background:var(--acSup);color:var(--acInk);padding:6px 14px;border-radius:999px;font-weight:650;font-size:13px}
.qPlacar{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600}
.enun{font-size:17px;line-height:1.7;margin:0 0 16px}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--linha);background:var(--sup);border-radius:18px;padding:11px 14px;cursor:pointer;font-size:15px;line-height:1.5;color:var(--ink);transition:transform .18s var(--mola),border-color .15s,background .15s,box-shadow .2s;width:100%}
.alt .let{width:32px;height:32px;min-width:32px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:13.5px;background:var(--sup2);color:var(--ink2);transition:background .2s,color .2s,transform .25s var(--mola)}
.alt .tx{padding-top:4px}
.alt:not([disabled]):hover{border-color:var(--ac);background:var(--acSup);transform:translateX(4px);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 14%,transparent)}
.alt:not([disabled]):hover .let{background:var(--acBt);color:#fff;transform:scale(1.08)}
.alt[disabled]{cursor:default}
.alt.certa{background:var(--okSup);border-color:var(--ok);animation:acerto .55s var(--mola)}
.alt.errada{background:var(--errSup);border-color:var(--err);animation:treme .45s}
.alt.certa .let{background:var(--ok);color:#fff}.alt.errada .let{background:var(--err);color:#fff}
.coment{margin-top:16px;border-radius:20px;padding:14px 18px;animation:desliza .45s ease both;font-size:15px;line-height:1.65}
.coment.ok{background:var(--okSup);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.coment.er{background:var(--errSup);border:1px solid color-mix(in srgb,var(--err) 30%,transparent)}
.coment b{display:block;margin-bottom:4px}
/* receitas e POP: documentos, sempre claros */
.receita{max-width:660px;margin:4px auto;border-radius:8px;padding:22px 24px;border:1.5px solid #9AA3B5;box-shadow:0 14px 34px -16px rgba(0,0,0,.4);font-size:13.5px;line-height:1.35;color:#1F2430;background:#fff}
.receita.amarela{background:#FFF3B0;border-color:#D9B92E}
.receita.azul{background:#D9E8FF;border-color:#7FA6E6}
.receita .rc-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1.5px solid rgba(0,0,0,.35);padding-bottom:8px;margin-bottom:10px}
.receita .rc-topo b{font-size:16px;text-transform:uppercase;letter-spacing:.02em;display:block}
.receita .rc-topo span{font-size:12.5px}
.receita .rc-num{border:1.5px solid rgba(0,0,0,.45);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center;min-width:120px;max-width:260px;background:rgba(255,255,255,.45)}
.receita .rc-sec{border:1px solid rgba(0,0,0,.35);border-radius:4px;margin:8px 0;background:rgba(255,255,255,.35)}

/* ---------- busca ---------- */
.caixaBusca{width:min(700px,100%);background:var(--sup);border-radius:26px;box-shadow:var(--sombraM);overflow:hidden;animation:sobe .3s var(--suave)}
.caixaBusca .campoB{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.caixaBusca .campoB>.ti{font-size:20px;color:var(--ink3)}
.caixaBusca input{border:0;box-shadow:none!important;padding:6px 0;font-size:17px;min-height:0}
.caixaBusca .res{max-height:62vh;overflow-y:auto;padding:8px}
.caixaBusca .vazioB{padding:26px;text-align:center;color:var(--ink3);font-size:14px;margin:0}
.itR{--k:var(--c-azul);display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink)}
.itR:hover,.itR.sel{background:var(--sup2)}
.itR .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,var(--sup));color:var(--k);flex:0 0 auto;font-size:17px}
.itR b{font-size:14px;display:block;font-weight:650}
.itR small{font-size:12px;color:var(--ink3);font-weight:600}
.itR p{margin:3px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
mark{background:color-mix(in srgb,var(--c-ambar) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- modal, gaveta, aviso ---------- */
.modal{width:min(720px,100%);background:var(--sup);border-radius:26px;box-shadow:var(--sombraM);padding:24px;animation:sobe .3s var(--suave);max-height:86vh;overflow-y:auto}
.modal h2{font-size:19px;margin-bottom:6px}
.modal .sub{margin:0 0 16px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 12px}
.ajuda{font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sup2);border-radius:14px;padding:10px 12px;white-space:pre-wrap;color:var(--ink2);margin:0 0 12px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opcoes{display:grid;gap:8px;margin:0 0 14px}
.opcoes label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--linha);border-radius:16px;padding:10px 14px;cursor:pointer;font-weight:550}
.opcoes label:has(input:checked){border-color:var(--ac);background:var(--acSup)}
.opcoes input{accent-color:var(--ac)}
.opcoes select{min-height:34px;padding:4px 10px}
.rodM{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.erro-ed{color:var(--err);font-size:13.5px;margin:6px 0 0}
.gaveta{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-radius:26px 26px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom));z-index:90;box-shadow:var(--sombraM);animation:sobeF .3s var(--suave);max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.gaveta .puxa{width:44px;height:5px;border-radius:999px;background:var(--linhaF);margin:0 auto 12px;flex:0 0 auto}
.gaveta .gradeMais{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gaveta .gradeMais button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.gaveta .gradeMais button .ti{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--sup2);color:var(--ink)}
.aviso{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--papel);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:100;box-shadow:var(--sombraM);animation:sobeA .3s var(--suave);max-width:calc(100% - 32px);text-align:center}
@media(max-width:640px){.duas{grid-template-columns:1fr}input,select,textarea{font-size:16px!important}.modal{padding:20px 18px}}

/* ---------- edição ---------- */
.edBarra{position:sticky;top:10px;z-index:19;display:flex;flex-wrap:wrap;gap:3px;align-items:center;background:var(--ink);color:var(--papel);border-radius:18px;padding:6px 8px;margin:0 0 16px;box-shadow:var(--sombraM)}
.edBarra button{border:0;background:transparent;color:inherit;border-radius:10px;padding:6px 9px;font-size:13px;display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.edBarra button:hover{background:color-mix(in srgb,var(--papel) 16%,transparent)}
.edBarra .sep{width:1px;height:22px;background:color-mix(in srgb,var(--papel) 25%,transparent);margin:0 4px}
.edBarra .dica{font-size:12px;opacity:.65;margin-left:auto;padding-right:6px}
[contenteditable=true]{outline:2px dashed color-mix(in srgb,var(--c-ambar) 70%,transparent);outline-offset:6px;border-radius:6px}
[contenteditable=true]:focus{outline-color:var(--ac)}
.edNovo{display:none;margin:16px 0}
body.editando .edNovo{display:flex;gap:8px;flex-wrap:wrap}
.edNovo select{width:auto;border-radius:999px}

/* ---------- movimento ---------- */
.anima>*{animation:sobe .5s var(--suave) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sobeA{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes sobeF{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes acerto{0%{transform:scale(1)}35%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes treme{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes desliza{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes flutua{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script id="sos-dados" type="application/json">{"versao":"2026-10-15T23:56:06+00:00","titulo":"SOS Farmacologia","subtitulo":"Farmacologia aplicada ao balcão e à dispensação, para alunos do 9º e 10º semestres de Farmácia e farmacêuticos recém-formados. Oito módulos, cada um com resumo para leitura, mapas mentais e material de apoio.","config":{"marca":"SOS Farmacologia","marca2":""},"modulos":[{"id":"m01","num":1,"titulo":"Princípios de farmacologia para o balcão","escopo":"Farmacocinética, farmacodinâmica, formas farmacêuticas e vias de administração aplicadas à dispensação: absorção, metabolismo pelo CYP450, função renal estimada por CKD-EPI 2021, índice terapêutico, reações adversas e notificação, e o que pode ou não ser partido ou triturado.","cor":"#5B5BF0","icone":"flask","curto":"Princípios para o balcão","topicos":[{"id":"m01-farmacocinetica","titulo":"Farmacocinética aplicada ao balcão","resumo":"\u003cp>Farmacocinética descreve o que o organismo faz com o medicamento: absorção, distribuição, metabolismo e excreção (ADME). Para quem trabalha no balcão, esses conceitos explicam orientações do dia a dia, como tomar a levotiroxina em jejum, separar o ciprofloxacino do leite ou desconfiar quando um anticonvulsivante e um anticoncepcional aparecem na mesma receita.\u003c/p>\n\u003ch3>Absorção\u003c/h3>\n\u003cp>Absorção é a passagem do fármaco do local de administração para a corrente sanguínea. Por via oral, quase tudo é absorvido no intestino delgado, por difusão passiva da forma não ionizada e lipossolúvel. Interferem na absorção o pH do meio, o esvaziamento gástrico, a presença de alimento, o fluxo sanguíneo local e a formação de complexos insolúveis.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Jejum\u003c/strong>: levotiroxina e alendronato têm absorção reduzida por alimento; a bula orienta tomar em jejum, com água, e aguardar antes do café da manhã (o alendronato exige ainda permanecer em pé).\u003c/li>\n\u003cli>Quelação: tetraciclinas e fluoroquinolonas formam complexos com cálcio, magnésio, alumínio, ferro e zinco (leite, antiácidos, suplementos). O intervalo entre as tomadas vem na bula de cada produto.\u003c/li>\n\u003cli>Alimento que aumenta absorção: alguns fármacos precisam de refeição, como lurasidona e ziprasidona (ver antipsicóticos).\u003c/li>\n\u003cli>pH gástrico: inibidores da bomba de prótons reduzem a absorção de fármacos que dependem de meio ácido, como o itraconazol em cápsula e o sal carbonato de cálcio.\u003c/li>\n\u003c/ul>\n\u003ch3>Biodisponibilidade e efeito de primeira passagem\u003c/h3>\n\u003cp>Biodisponibilidade (F) é a fração da dose que chega inalterada à circulação sistêmica. Por via intravenosa, F é 100% por definição. Por via oral, parte do fármaco se perde na parede intestinal e no fígado antes de alcançar a circulação: é o efeito de primeira passagem. Fármacos com primeira passagem intensa têm dose oral bem maior que a parenteral. A morfina oral tem biodisponibilidade baixa e variável, por isso a dose oral equivalente é cerca de 3 vezes a parenteral. A nitroglicerina e o dinitrato de isossorbida sublinguais escapam da primeira passagem porque a mucosa oral drena para a veia cava, sem passar pelo fígado.\u003c/p>\n\u003cp>Genéricos e similares intercambiáveis demonstram bioequivalência com o referência: a velocidade e a extensão da absorção (Cmáx e área sob a curva) ficam dentro de limites estatísticos aceitos pela Anvisa.\u003c/p>\n\u003ch3>Distribuição\u003c/h3>\n\u003cp>Depois de absorvido, o fármaco se distribui para os tecidos. O volume de distribuição (Vd) é um volume aparente que relaciona a quantidade no corpo com a concentração no plasma. Vd alto (amiodarona, antidepressivos tricíclicos) indica grande acúmulo nos tecidos; Vd baixo (varfarina) indica fármaco preso ao plasma.\u003c/p>\n\u003cp>Só a fração livre (não ligada à albumina) atravessa membranas e age. Fármacos muito ligados a proteínas, como varfarina, fenitoína e ácido valproico, podem ter mais efeito quando a albumina cai (desnutrição, cirrose, síndrome nefrótica, idoso frágil). A barreira hematoencefálica limita a entrada de fármacos polares no sistema nervoso central: a domperidona age pouco no cérebro, enquanto a metoclopramida atravessa e causa efeitos extrapiramidais. Placenta e leite materno recebem fármacos lipossolúveis e de baixo peso molecular.\u003c/p>\n\u003ch3>Metabolismo e o sistema CYP450\u003c/h3>\n\u003cp>O metabolismo transforma o fármaco em compostos mais polares, fáceis de excretar. Na fase I (oxidação, redução, hidrólise) atuam principalmente as enzimas do citocromo P450 (CYP). Na fase II, o fármaco ou seu metabólito é conjugado (glicuronidação, sulfatação, acetilação, conjugação com glutationa). O fígado concentra a maior parte dessa atividade, mas o intestino também contribui, sobretudo com a CYP3A4.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Isoenzima\u003c/th>\u003cth>Substratos de balcão\u003c/th>\u003cth>Observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>CYP3A4\u003c/td>\u003ctd>Sinvastatina, atorvastatina, anlodipino, sildenafila, midazolam, alprazolam, carbamazepina, fentanil, ciclosporina\u003c/td>\u003ctd>Metaboliza cerca de metade dos fármacos de uso clínico\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CYP2D6\u003c/td>\u003ctd>Codeína, tramadol, metoprolol, tricíclicos, risperidona, tamoxifeno\u003c/td>\u003ctd>Polimorfismo genético: metabolizadores lentos e ultrarrápidos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CYP2C9\u003c/td>\u003ctd>Varfarina, fenitoína, AINE, losartana, glibenclamida\u003c/td>\u003ctd>Interação com varfarina causa sangramento\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CYP2C19\u003c/td>\u003ctd>Clopidogrel, omeprazol, citalopram, escitalopram, diazepam\u003c/td>\u003ctd>Ativa o clopidogrel\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>CYP1A2\u003c/td>\u003ctd>Teofilina, clozapina, olanzapina, cafeína, agomelatina\u003c/td>\u003ctd>Induzida pelo tabaco fumado\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Indutores\u003c/strong> aumentam a quantidade de enzima. O efeito começa devagar, em cerca de 1 a 2 semanas, e também demora a desaparecer depois da suspensão: para anticoncepcional hormonal, a orientação é manter método não afetado ou proteção adicional por 28 dias após parar o indutor (FSRH, 2022). Exemplos: carbamazepina, fenitoína, fenobarbital, rifampicina, erva-de-são-joão (hipérico) e o tabagismo (CYP1A2, pelos hidrocarbonetos da fumaça, não pela nicotina). Consequência típica: falha terapêutica do outro fármaco, como gravidez com anticoncepcional hormonal em quem usa carbamazepina.\u003c/p>\n\u003cp>Inibidores bloqueiam a enzima e o efeito aparece em horas a poucos dias. Exemplos: claritromicina, eritromicina, cetoconazol, itraconazol, fluconazol, ritonavir, suco de toranja (CYP3A4 intestinal), fluoxetina, paroxetina e bupropiona (CYP2D6), fluvoxamina e ciprofloxacino (CYP1A2), omeprazol (CYP2C19). Consequência típica: toxicidade do outro fármaco, como miopatia com sinvastatina associada a claritromicina.\u003c/p>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Indutor reduz o efeito do substrato e a resposta demora a aparecer. Inibidor aumenta o efeito do substrato e a resposta é rápida. Quando o substrato é um pró-fármaco, a lógica se inverte: inibir a enzima reduz o efeito.\u003c/p>\u003c/div>\n\u003ch4>Pró-fármacos\u003c/h4>\n\u003cp>Pró-fármaco é inativo (ou pouco ativo) e depende do metabolismo para gerar a forma ativa. Exemplos: codeína em morfina e tramadol em O-desmetiltramadol (CYP2D6), clopidogrel no metabólito ativo (CYP2C19), enalapril em enalaprilato (esterases), valaciclovir em aciclovir, levodopa em dopamina. Paciente que usa fluoxetina ou paroxetina (inibidores fortes da CYP2D6) pode ter pouca analgesia com codeína ou tramadol.\u003c/p>\n\u003ch3>Excreção\u003c/h3>\n\u003cp>Os rins eliminam fármacos e metabólitos polares por filtração glomerular e secreção tubular; parte pode ser reabsorvida. A via biliar elimina pelas fezes e alguns compostos voltam ao sangue pela circulação êntero-hepática. Fármacos de eliminação renal predominante acumulam quando a função renal cai: gabapentina, pregabalina, levetiracetam, lítio, metformina, digoxina, aciclovir, a maioria dos antibióticos betalactâmicos e os metabólitos da morfina.\u003c/p>\n\u003ch3>Meia-vida e estado de equilíbrio\u003c/h3>\n\u003cp>Meia-vida (t½) é o tempo para a concentração plasmática cair pela metade. Depois de 4 a 5 meias-vidas, praticamente todo o fármaco foi eliminado (cerca de 94 a 97%). O mesmo número de meias-vidas é necessário para atingir o estado de equilíbrio (steady state) quando o fármaco é tomado em doses regulares: a quantidade que entra por intervalo se iguala à que sai.\u003c/p>\n\u003cul>\n\u003cli>Fármaco de meia-vida longa demora a atingir o equilíbrio. Quando o efeito precisa ser rápido, o médico usa dose de ataque.\u003c/li>\n\u003cli>A fluoxetina e seu metabólito ativo (norfluoxetina) têm meia-vida longa. Por isso a troca de fluoxetina por um inibidor da monoaminoxidase (IMAO) exige intervalo de semanas, conforme a bula.\u003c/li>\n\u003cli>Meia-vida curta exige várias tomadas ao dia ou forma de liberação prolongada.\u003c/li>\n\u003c/ul>\n\u003ch3>Função renal: estimativa pela CKD-EPI 2021\u003c/h3>\n\u003cp>A referência atual para estimar a taxa de filtração glomerular (TFG) é a equação CKD-EPI 2021, sem coeficiente de raça (KDIGO 2024). Ela usa creatinina sérica, idade e sexo:\u003c/p>\n\u003cp>TFGe = 142 × min(Scr/κ; 1)\u003csup>α\u003c/sup> × max(Scr/κ; 1)\u003csup>-1,200\u003c/sup> × 0,9938\u003csup>idade\u003c/sup> × 1,012 (se mulher), em que κ = 0,7 (mulher) ou 0,9 (homem) e α = -0,241 (mulher) ou -0,302 (homem). Resultado em mL/min/1,73 m².\u003c/p>\n\u003cp>Laboratórios já liberam a TFGe junto com a creatinina. A bula de cada medicamento indica o ajuste por faixa de TFG. Exemplos de balcão: metformina contraindicada com TFG abaixo de 30 mL/min/1,73 m² (bula do Glifage®); gabapentina, pregabalina e levetiracetam com redução de dose; AINE a evitar na doença renal crônica.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Creatinina “normal” não garante rim normal no idoso com pouca massa muscular. Sempre que houver ajuste renal na bula, o dado a usar é a TFG estimada, e não a creatinina isolada.\u003c/p>\u003c/div>\n\u003ch3>Função hepática\u003c/h3>\n\u003cp>Não existe um exame único que estime a capacidade de metabolizar fármacos. Usa-se a classificação de Child-Pugh (bilirrubina, albumina, tempo de protrombina, ascite, encefalopatia) e a bula de cada produto. Em hepatopatas, benzodiazepínicos que dependem só de glicuronidação (lorazepam, oxazepam) acumulam menos que diazepam e alprazolam. Paracetamol exige dose diária menor e cautela com álcool. Fármacos com grande primeira passagem ficam mais biodisponíveis na cirrose.\u003c/p>\n\u003ch3>Idoso\u003c/h3>\n\u003cp>Com o envelhecimento aumenta a gordura corporal e diminuem a água total, a massa muscular e a TFG. Fármacos lipossolúveis (diazepam) acumulam por mais tempo; fármacos hidrossolúveis (lítio, digoxina) atingem concentração maior. A sensibilidade do sistema nervoso central também aumenta, o que explica quedas e confusão com sedativos.\u003c/p>\n\u003ch3>Gestação e lactação\u003c/h3>\n\u003cp>Na gestação, o volume plasmático, a TFG e a atividade de algumas enzimas aumentam, e a concentração de vários fármacos cai (lamotrigina, levetiracetam, lítio). A placenta deixa passar fármacos lipossolúveis e de baixo peso molecular, e o risco para o feto depende da fase: no primeiro trimestre predominam as malformações; depois, efeitos sobre crescimento e função. No leite materno passam fármacos lipossolúveis, pouco ligados a proteínas e de meia-vida longa. A exposição do lactente é estimada pela dose relativa infantil; bases como o LactMed (NIH) e o manual do Ministério da Saúde sobre amamentação e uso de medicamentos ajudam na consulta. O farmacêutico deve perguntar sobre gravidez e amamentação antes de qualquer indicação.\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Perguntas que revelam problema farmacocinético: “Toma algum outro remédio, chá ou suplemento?”, “Fuma? Parou de fumar recentemente?”, “Tem problema nos rins ou no fígado?”, “Toma com comida ou em jejum?”. Parar de fumar reduz a indução da CYP1A2 e pode elevar a concentração de clozapina e olanzapina em poucas semanas: o prescritor precisa saber.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 52 anos usa levotiroxina e começou carbonato de cálcio com vitamina D, tomando os dois juntos pela manhã. O TSH subiu. O farmacêutico orienta tomar a levotiroxina em jejum, com água, e o cálcio só horas depois, em outra refeição, e comunica ao médico a mudança no horário.\u003c/p>\u003c/div>"},{"id":"m01-farmacodinamica","titulo":"Farmacodinâmica e segurança","resumo":"\u003cp>Farmacodinâmica estuda o que o fármaco faz no organismo: onde se liga, que resposta provoca e com que intensidade. Os conceitos de agonista, antagonista, potência e eficácia explicam por que a naloxona reverte a morfina, por que a buprenorfina tem efeito teto e por que alguns medicamentos exigem tanto cuidado com a dose.\u003c/p>\n\u003ch3>Alvos dos fármacos\u003c/h3>\n\u003cp>A maioria dos fármacos age em proteínas: receptores, enzimas, canais iônicos e transportadores. Os receptores se agrupam em quatro famílias principais.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo de receptor\u003c/th>\u003cth>Velocidade\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Canal iônico controlado por ligante\u003c/td>\u003ctd>Milissegundos\u003c/td>\u003ctd>GABA-A (benzodiazepínicos, barbitúricos, drogas Z), nicotínico\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Acoplado à proteína G\u003c/td>\u003ctd>Segundos\u003c/td>\u003ctd>Opioides, adrenérgicos, dopaminérgicos, serotoninérgicos, muscarínicos, histamínicos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ligado a enzima (quinase)\u003c/td>\u003ctd>Minutos\u003c/td>\u003ctd>Insulina, fatores de crescimento\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nuclear\u003c/td>\u003ctd>Horas a dias\u003c/td>\u003ctd>Corticoides, hormônio tireoidiano, estrogênio\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Outros alvos: enzimas (AINE inibem a cicloxigenase, IMAO inibem a monoaminoxidase), transportadores (inibidores seletivos da recaptação de serotonina bloqueiam o transportador SERT) e canais iônicos dependentes de voltagem (anestésicos locais e vários anticonvulsivantes bloqueiam canais de sódio).\u003c/p>\n\u003ch3>Agonistas e antagonistas\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Agonista pleno\u003c/strong>: liga-se e produz a resposta máxima do sistema. Exemplos: morfina e fentanil no receptor mu.\u003c/li>\n\u003cli>Agonista parcial: liga-se mas produz resposta submáxima, mesmo com todos os receptores ocupados. Na presença de agonista pleno, comporta-se como antagonista parcial. Exemplos: buprenorfina (mu) e aripiprazol (D2). A buprenorfina tem efeito teto para depressão respiratória e pode precipitar abstinência em quem usa morfina ou metadona.\u003c/li>\n\u003cli>Antagonista competitivo: ocupa o receptor sem ativá-lo e pode ser deslocado por dose maior de agonista. Exemplos: naloxona (opioides), flumazenil (benzodiazepínicos).\u003c/li>\n\u003cli>Antagonista não competitivo: bloqueio que não se desfaz com mais agonista (ligação irreversível ou em outro sítio).\u003c/li>\n\u003cli>Modulador alostérico positivo: liga-se em sítio diferente e potencializa o ligante natural. Os benzodiazepínicos aumentam o efeito do GABA, mas não abrem o canal sozinhos, o que explica a margem de segurança maior que a dos barbitúricos.\u003c/li>\n\u003c/ul>\n\u003ch3>Potência e eficácia\u003c/h3>\n\u003cp>Potência é a dose necessária para produzir determinado efeito (quanto menor a dose, mais potente). Eficácia é o efeito máximo alcançável. Fentanil é muito mais potente que a morfina (microgramas contra miligramas), mas a eficácia analgésica dos dois é semelhante. Tramadol e codeína têm eficácia menor que a morfina para dor intensa. Na prática, eficácia importa mais que potência: um fármaco potente só exige dose menor.\u003c/p>\n\u003ch3>Índice terapêutico\u003c/h3>\n\u003cp>Índice terapêutico (IT) é a relação entre a dose tóxica e a dose eficaz (DT50/DE50). Quanto mais estreito, menor a distância entre tratar e intoxicar. Fármacos de IT estreito pedem dose exata, monitorização de nível sérico ou de efeito, cuidado com interações e com troca de fabricante.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco de IT estreito\u003c/th>\u003cth>O que monitorar\u003c/th>\u003cth>Risco típico\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Varfarina\u003c/td>\u003ctd>RNI\u003c/td>\u003ctd>Sangramento com antibióticos, AINE, fluconazol, amiodarona\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Digoxina\u003c/td>\u003ctd>Nível sérico, potássio, função renal\u003c/td>\u003ctd>Náusea, arritmia, visão amarelada\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lítio\u003c/td>\u003ctd>Litemia, função renal, TSH\u003c/td>\u003ctd>Intoxicação com AINE, diurético tiazídico, IECA, desidratação\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fenitoína\u003c/td>\u003ctd>Nível sérico, albumina\u003c/td>\u003ctd>Cinética saturável: pequeno aumento de dose, grande aumento de nível\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Carbamazepina\u003c/td>\u003ctd>Nível sérico, sódio, hemograma\u003c/td>\u003ctd>Toxicidade com claritromicina, fluconazol\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ácido valproico\u003c/td>\u003ctd>Nível sérico, enzimas hepáticas, plaquetas\u003c/td>\u003ctd>Queda grave com carbapenêmicos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fenobarbital\u003c/td>\u003ctd>Nível sérico, sedação\u003c/td>\u003ctd>Depressão do sistema nervoso central\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Teofilina\u003c/td>\u003ctd>Nível sérico\u003c/td>\u003ctd>Convulsão e arritmia com ciprofloxacino, fluvoxamina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Levotiroxina\u003c/td>\u003ctd>TSH\u003c/td>\u003ctd>Variação de resposta com troca de produto e com cálcio ou ferro\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tacrolimo e ciclosporina\u003c/td>\u003ctd>Nível sérico, função renal\u003c/td>\u003ctd>Rejeição com indutores, toxicidade com inibidores da CYP3A4\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Metotrexato oral\u003c/td>\u003ctd>Hemograma, função renal e hepática\u003c/td>\u003ctd>Erro de tomada diária no lugar de semanal\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Tolerância, dependência e abstinência\u003c/h3>\n\u003cp>Tolerância é a perda de efeito com o uso repetido, exigindo dose maior para o mesmo resultado. Pode ser farmacodinâmica (dessensibilização ou redução de receptores, como nos opioides e benzodiazepínicos) ou farmacocinética (autoindução do metabolismo, como na carbamazepina). Taquifilaxia é a tolerância que surge em horas ou dias: descongestionantes nasais tópicos (nafazolina, oximetazolina) perdem efeito e causam congestão de rebote quando usados por mais de poucos dias.\u003c/p>\n\u003cp>Dependência física é a adaptação que gera síndrome de abstinência na suspensão abrupta. Acontece com opioides, benzodiazepínicos, barbitúricos, gabapentinoides, antidepressivos (síndrome de descontinuação) e até com betabloqueadores (rebote de taquicardia). Dependência física é diferente de transtorno por uso de substância, que envolve perda de controle, compulsão e prejuízo funcional.\u003c/p>\n\u003ch3>Reações adversas a medicamentos\u003c/h3>\n\u003cp>A Organização Mundial da Saúde define reação adversa a medicamento (RAM) como resposta nociva e não intencional que ocorre com doses normalmente usadas em seres humanos. A classificação clássica de Rawlins e Thompson separa dois grandes tipos, depois ampliada.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Característica\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>A (aumentada)\u003c/td>\u003ctd>Dose-dependente, previsível pela farmacologia, frequente, baixa letalidade\u003c/td>\u003ctd>Hipoglicemia por sulfonilureia, sangramento por varfarina, constipação por opioide\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B (bizarra)\u003c/td>\u003ctd>Não depende da dose, imprevisível, rara, alta gravidade\u003c/td>\u003ctd>Anafilaxia por penicilina, síndrome de Stevens-Johnson por lamotrigina, agranulocitose por clozapina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C (crônica)\u003c/td>\u003ctd>Ligada ao uso prolongado\u003c/td>\u003ctd>Osteoporose por corticoide\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D (tardia)\u003c/td>\u003ctd>Aparece muito depois\u003c/td>\u003ctd>Teratogenicidade, discinesia tardia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>E (fim de uso)\u003c/td>\u003ctd>Na suspensão\u003c/td>\u003ctd>Abstinência de benzodiazepínico, rebote de clonidina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F (falha)\u003c/td>\u003ctd>Falha terapêutica, muitas vezes por interação\u003c/td>\u003ctd>Gravidez com anticoncepcional e carbamazepina\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Para avaliar se o medicamento causou o evento, usa-se a relação temporal, a melhora com a retirada (dechallenge), a recorrência com a reintrodução (rechallenge) e a exclusão de outras causas. O algoritmo de Naranjo organiza essas perguntas em pontos e classifica a causalidade como definida, provável, possível ou duvidosa.\u003c/p>\n\u003ch3>Interações farmacodinâmicas\u003c/h3>\n\u003cp>Nem toda interação passa pelo CYP. Interações farmacodinâmicas acontecem quando dois fármacos agem sobre o mesmo sistema, sem alterar a concentração um do outro.\u003c/p>\n\u003cul>\n\u003cli>Efeito aditivo ou sinérgico: benzodiazepínico com opioide ou álcool (depressão respiratória); dois serotoninérgicos (síndrome serotoninérgica); varfarina com AINE ou ácido acetilsalicílico (sangramento por mecanismos diferentes); vários fármacos que prolongam o QT; vários anticolinérgicos no idoso (confusão, retenção urinária); IECA ou bloqueador do receptor de angiotensina com espironolactona (hiperpotassemia).\u003c/li>\n\u003cli>Antagonismo: AINE reduz o efeito de anti-hipertensivos e diuréticos; betabloqueador não seletivo reduz a resposta ao salbutamol; metoclopramida e antipsicóticos anulam a levodopa.\u003c/li>\n\u003c/ul>\n\u003cp>A interação farmacodinâmica costuma ser previsível pela farmacologia de cada fármaco, e o raciocínio do farmacêutico começa por verificar se os dois fármacos sedam, causam sangramento, prolongam o QT, elevam serotonina, elevam potássio ou têm efeito anticolinérgico.\u003c/p>\n\u003ch3>Farmacovigilância e VigiMed\u003c/h3>\n\u003cp>Farmacovigilância é o conjunto de atividades de detecção, avaliação, compreensão e prevenção de efeitos adversos e outros problemas relacionados a medicamentos. Muitas reações raras só aparecem depois da comercialização, quando milhões de pessoas usam o produto. No Brasil, a notificação de eventos adversos a medicamentos e vacinas é feita no \u003cstrong>VigiMed\u003c/strong>, sistema da Anvisa aberto a cidadãos, profissionais de saúde, detentores de registro e patrocinadores de estudos; a Anvisa avalia as notificações e as envia ao banco de dados da OMS. Queixas técnicas (desvio de qualidade: comprimido quebrado, cor alterada, frasco sem lacre, suspeita de falsificação) vão para o Notivisa; quando a queixa técnica vem junto com um evento adverso, a notificação é feita no VigiMed (Anvisa, VigiMed: o que é e como cadastrar, 2024).\u003c/p>\n\u003cp>A notificação não exige certeza de causalidade. Basta a suspeita. Notificações de farmacêuticos de farmácia comunitária têm valor porque o balcão vê o paciente depois que ele sai do consultório.\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao ouvir “desde que comecei este remédio, estou com…”, registre: nome do produto, lote, data de início, dose, o que aconteceu, quando começou, se melhorou ao parar e outros medicamentos em uso. Reação grave (falta de ar, inchaço de lábios, bolhas na pele, icterícia, sangramento) exige encaminhamento imediato ao serviço de urgência. Depois do atendimento, notifique no VigiMed.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Rapaz de 24 anos começou lamotrigina há três semanas e chega com febre, ardor nos olhos e lesões na boca. O farmacêutico reconhece sinal de alerta para reação cutânea grave, orienta procurar urgência sem tomar a próxima dose sem avaliação médica e notifica a suspeita no VigiMed.\u003c/p>\u003c/div>"},{"id":"m01-formas-vias","titulo":"Formas farmacêuticas e vias de administração","resumo":"\u003cp>Boa parte dos erros de medicação depois da dispensação acontece em casa: o comprimido de liberação prolongada partido ao meio, as gotas medidas em mililitros, a suspensão sem agitar, o comprimido triturado para a sonda. A forma farmacêutica foi desenhada para controlar onde e quando o fármaco é liberado, e alterá-la muda o perfil de absorção e de segurança.\u003c/p>\n\u003ch3>Formas de liberação modificada\u003c/h3>\n\u003cp>Formas de liberação imediata liberam o fármaco logo após a desintegração. Formas de liberação modificada mudam o tempo ou o local da liberação:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Liberação prolongada\u003c/strong> (siglas comuns no nome comercial: LP, XR, ER, SR, CR, LA, retard, OROS, HBS): liberam a dose aos poucos, permitindo uma ou duas tomadas ao dia. Partir, triturar ou mastigar pode liberar a dose inteira de uma vez (dose dumping), com risco de intoxicação. Exemplos: oxicodona de liberação controlada, venlafaxina XR, metformina XR, nifedipino de liberação prolongada, levodopa com benserazida HBS, pramipexol de liberação prolongada.\u003c/li>\n\u003cli>Liberação retardada ou gastrorresistente (revestimento entérico): o revestimento resiste ao ácido do estômago e só se dissolve no intestino. Protege o fármaco do ácido (omeprazol, pantoprazol) ou o estômago do fármaco (diclofenaco sódico, ácido acetilsalicílico com revestimento entérico). Triturar destrói essa proteção.\u003c/li>\n\u003c/ul>\n\u003cp>Há exceções. Alguns comprimidos de liberação prolongada têm sulco funcional e a bula autoriza partir (sem mastigar ou triturar). Algumas cápsulas de liberação retardada contêm microgrânulos que podem ser abertos e dispersos em líquido ou alimento pastoso, desde que os grânulos não sejam mastigados. A regra segura é: só partir, abrir ou triturar quando a bula do produto autoriza.\u003c/p>\n\u003ch3>Sublingual, orodispersível e mastigável\u003c/h3>\n\u003cul>\n\u003cli>Sublingual: colocado sob a língua até dissolver, sem engolir; absorção rápida pela mucosa e sem primeira passagem. Exemplos: dinitrato de isossorbida sublingual, zolpidem sublingual. Engolir o comprimido reduz o efeito ou atrasa o início.\u003c/li>\n\u003cli>Orodispersível: desintegra sobre a língua em segundos e é engolido com a saliva, sem água. A absorção ocorre, em geral, no trato digestivo. Útil para quem tem náusea ou dificuldade de engolir (ondansetrona orodispersível).\u003c/li>\n\u003cli>Mastigável: deve ser mastigado (alguns antiácidos, montelucaste pediátrico). Engolir inteiro pode reduzir o efeito.\u003c/li>\n\u003cli>Efervescente: dissolver totalmente em água antes de beber. Contém sódio, o que interessa ao hipertenso e ao paciente com insuficiência cardíaca.\u003c/li>\n\u003c/ul>\n\u003ch3>Outros motivos para não partir ou triturar\u003c/h3>\n\u003cul>\n\u003cli>Revestimento que protege quem manipula: fármacos teratogênicos ou citotóxicos (finasterida, dutasterida, metotrexato, talidomida). Gestante não deve manusear comprimido partido ou triturado de finasterida, e a cápsula de dutasterida não deve ser aberta.\u003c/li>\n\u003cli>Gosto muito amargo ou irritação de mucosa.\u003c/li>\n\u003cli>Fármaco sensível à luz ou à umidade.\u003c/li>\n\u003cli>Cápsula mole com conteúdo líquido (dose imprecisa se perfurada).\u003c/li>\n\u003c/ul>\n\u003cp>Sulco no comprimido nem sempre significa que as metades têm a mesma dose: há sulcos apenas decorativos ou para facilitar a deglutição. A bula informa se o comprimido é divisível.\u003c/p>\n\u003ch3>Gotas e mililitros\u003c/h3>\n\u003cp>Não existe equivalência universal entre gota e mililitro. O número de gotas por mL depende da viscosidade, da tensão superficial e do gotejador de cada produto. A bula informa quantas gotas correspondem a 1 mL e quanto de fármaco há em cada gota. Exemplos: a dipirona gotas 500 mg/mL tem 20 gotas por mL (25 mg por gota) segundo as bulas usuais; o clonazepam solução oral 2,5 mg/mL tem 0,1 mg por gota (bula do Rivotril®).\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Confundir gotas com mililitros multiplica a dose por 20 ou mais. Em criança, oriente com o dispositivo dosador do próprio produto (gotejador, seringa ou copo graduado). Colher de cozinha não serve como medida. Escreva a dose no rótulo ou na receita na unidade do dispositivo (“10 gotas” ou “2,5 mL”).\u003c/p>\u003c/div>\n\u003ch3>Suspensões e pós para reconstituição\u003c/h3>\n\u003cp>Antibióticos pediátricos (amoxicilina, amoxicilina com clavulanato, azitromicina, cefalexina) vêm como pó para reconstituir. Orientação básica:\u003c/p>\n\u003col>\n\u003cli>Agitar o frasco fechado para soltar o pó.\u003c/li>\n\u003cli>Adicionar água filtrada ou fervida e fria até perto da marca, agitar, aguardar a espuma baixar e completar até a marca exata.\u003c/li>\n\u003cli>Agitar bem antes de cada dose: o fármaco suspenso decanta e a primeira dose sairia diluída, a última concentrada.\u003c/li>\n\u003cli>Conservar e descartar conforme a bula: o prazo de validade após o preparo (em geral de 5 a 14 dias, conforme o produto) e a necessidade de geladeira variam. A amoxicilina com clavulanato costuma exigir refrigeração.\u003c/li>\n\u003c/ol>\n\u003cp>Depois da reconstituição, anote no frasco a data do preparo e a data de descarte indicada na bula.\u003c/p>\n\u003ch3>Administração por sonda\u003c/h3>\n\u003cp>Paciente com sonda nasoenteral ou gastrostomia precisa de plano para cada medicamento:\u003c/p>\n\u003cul>\n\u003cli>Preferir forma líquida (solução, suspensão) ou comprimido de liberação imediata que possa ser triturado.\u003c/li>\n\u003cli>Nunca triturar liberação prolongada ou revestimento entérico; pedir ao prescritor alternativa.\u003c/li>\n\u003cli>Triturar cada comprimido separadamente até pó fino, dispersar em água e administrar um de cada vez.\u003c/li>\n\u003cli>Lavar a sonda com água antes, entre os medicamentos e depois (volumes definidos pelo serviço; o manual do Incor usa 20 mL de água filtrada entre as administrações no adulto). Nunca misturar medicamento no frasco da dieta.\u003c/li>\n\u003cli>Interações com a dieta enteral: a absorção da fenitoína cai com a nutrição enteral contínua (o manual do Incor pausa a dieta 40 minutos antes e religa 40 minutos depois); a levotiroxina e as quinolonas sofrem efeito semelhante; a vitamina K da dieta interfere na varfarina.\u003c/li>\n\u003c/ul>\n\u003ch3>Outras vias frequentes no balcão\u003c/h3>\n\u003cul>\n\u003cli>Transdérmica: adesivos de fentanil, buprenorfina, rotigotina, nicotina e hormônios liberam o fármaco de forma contínua. Aplicar em pele íntegra, seca e sem pelos, alternar o local, não cortar o adesivo salvo autorização da bula e evitar calor sobre ele.\u003c/li>\n\u003cli>Inalatória: a técnica correta do inalador dosimetrado (agitar, expirar, acionar no início de inspiração lenta, prender a respiração) ou do inalador de pó (inspiração rápida e profunda) determina quanto fármaco chega ao pulmão. Espaçador melhora a deposição e reduz candidíase oral com corticoide inalatório.\u003c/li>\n\u003cli>Oftálmica: uma gota basta (o fundo de saco conjuntival comporta pouco volume); intervalo de cerca de 5 minutos entre colírios diferentes; pressionar o canto interno do olho reduz a absorção sistêmica (importante com colírio de timolol). Frasco aberto tem prazo de uso definido na bula.\u003c/li>\n\u003cli>Retal: supositórios e enemas, úteis em vômitos ou quando a via oral não é possível; absorção mais irregular.\u003c/li>\n\u003cli>Vaginal: aplicar à noite, deitada, para reduzir o escoamento; a conduta durante a menstruação segue a bula do produto.\u003c/li>\n\u003c/ul>\n\u003ch3>Intercambialidade\u003c/h3>\n\u003cp>O mercado brasileiro tem três categorias de medicamento com o mesmo fármaco:\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Categoria\u003c/th>\u003cth>O que é\u003c/th>\u003cth>Identificação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Referência\u003c/td>\u003ctd>Inovador, com eficácia e segurança comprovadas em estudos clínicos\u003c/td>\u003ctd>Nome comercial\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Genérico\u003c/td>\u003ctd>Bioequivalente ao referência, intercambiável por lei\u003c/td>\u003ctd>Nome pela DCB e faixa amarela com a letra G na embalagem\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Similar\u003c/td>\u003ctd>Mesmo fármaco, dose e forma; identificado por nome comercial\u003c/td>\u003ctd>Nome comercial\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Similar intercambiável\u003c/td>\u003ctd>Similar com equivalência ou bioequivalência aprovada pela Anvisa\u003c/td>\u003ctd>Informação de intercambialidade na bula (RDC 58/2014)\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>O farmacêutico pode trocar o referência pelo genérico ou pelo similar intercambiável com aquele referência, salvo restrição escrita do prescritor, e deve registrar a troca na receita. A intercambialidade prevista em norma é sempre em relação ao medicamento de referência (Lei 9.787/1999, RDC 16/2007, RDC 58/2014): genérico por similar e similar por outro similar não são tr

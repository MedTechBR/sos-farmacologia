03ctd>Uma mão (frente e verso)\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Um braço inteiro\u003c/td>\u003ctd>3\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Um pé\u003c/td>\u003ctd>2\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Uma perna inteira\u003c/td>\u003ctd>6\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Tronco anterior ou posterior\u003c/td>\u003ctd>7 cada\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A medida ajuda a evitar os dois erros mais comuns: quantidade pequena demais (por \"medo de corticoide\", com falha de tratamento) e uso em grande área por meses. Aplicação uma ou duas vezes ao dia é suficiente para a maioria das formulações; passar mais vezes não aumenta o efeito.\u003c/p> \u003ch3>Locais e pacientes de maior risco\u003c/h3> \u003cul> \u003cli>\u003cb>Face e pálpebras\u003c/b>: pele fina e absorção alta; usar baixa potência por poucos dias. Na região periocular, há risco de glaucoma e catarata.\u003c/li> \u003cli>\u003cb>Dobras, axilas, virilha e genitais\u003c/b>: oclusão natural; risco de atrofia e estrias; baixa potência.\u003c/li> \u003cli>\u003cb>Criança\u003c/b>: maior relação superfície/peso e maior absorção; baixa ou média potência, curso curto; na área de fralda a fralda funciona como oclusão.\u003c/li> \u003cli>\u003cb>Idoso\u003c/b>: pele atrófica, equimoses fáceis.\u003c/li> \u003cli>\u003cb>Áreas extensas ou pele muito lesada\u003c/b>: absorção sistêmica com possível supressão do eixo HHA e hiperglicemia.\u003c/li> \u003c/ul> \u003ch3>Efeitos adversos\u003c/h3> \u003cp>Locais: atrofia da pele, estrias (irreversíveis), telangiectasias, púrpura, dermatite perioral, acne e rosácea induzidas por corticoide, hipopigmentação, hipertricose, retardo de cicatrização e mascaramento de infecção (micose que fica atípica e se espalha, conhecida como tinha incógnita). Ao suspender um corticoide potente usado por muito tempo na face ou em área extensa, pode haver \u003cstrong>rebote\u003c/strong>: piora intensa com vermelhidão, ardor e descamação, que leva o paciente a reaplicar e prolonga o ciclo. Por isso, cursos longos são reduzidos aos poucos (menos vezes por semana ou troca por potência menor) sob orientação médica.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Cremes que associam corticoide potente, antifúngico e antibiótico são muito pedidos como \"pomada para tudo\". Em micose, o corticoide alivia a coceira, mas favorece a expansão do fungo; em infecção bacteriana, o antibiótico tópico seleciona resistência. Lesão sem diagnóstico, que piora ou não melhora em 7 dias, deve ser avaliada pelo médico.\u003c/p>\u003c/div> \u003ch3>Corticoides nasais e inalatórios\u003c/h3> \u003cp>Corticoides de uso nasal (rinite) e inalatório (asma e DPOC) agem no mesmo receptor, com absorção sistêmica baixa. Técnica de uso, efeitos locais (candidíase oral, disfonia, epistaxe) e doses estão no módulo 7.\u003c/p>  \u003ch3>Veículo\u003c/h3> \u003cul> \u003cli>\u003cb>Pomada\u003c/b>: oclusiva, maior penetração, boa para lesões secas, espessas e descamativas; menos indicada em dobras e áreas pilosas.\u003c/li> \u003cli>\u003cb>Creme\u003c/b>: versátil, para lesões agudas e úmidas e para áreas maiores; mais aceito pelo paciente.\u003c/li> \u003cli>\u003cb>Loção, solução e espuma\u003c/b>: couro cabeludo e áreas pilosas; podem arder em pele lesada (álcool).\u003c/li> \u003cli>\u003cb>Gel\u003c/b>: áreas pilosas e oleosas; pode ressecar.\u003c/li> \u003c/ul> \u003ch3>Dermatite atópica\u003c/h3> \u003cp>A base do tratamento é a hidratação diária da pele com emoliente, banho morno e curto e sabonete suave. O corticoide tópico controla as crises e pode ser usado de forma intermitente para prevenir recaídas, conforme o prescritor. Na face e em pálpebras, inibidores de calcineurina tópicos (tacrolimo, pimecrolimo), de venda sob prescrição, são alternativa sem atrofia. O medo exagerado de corticoide leva ao uso de quantidades mínimas e à falha terapêutica; o farmacêutico pode corrigir isso explicando a unidade de ponta de dedo e o tempo de uso.\u003c/p> \u003ch3>Picadas de inseto\u003c/h3> \u003cp>Reação local (vermelhidão, coceira, inchaço de alguns centímetros) melhora com compressa fria, anti-H1 oral de segunda geração e, se necessário, corticoide tópico de baixa potência por poucos dias. Inchaço grande que ultrapassa duas articulações, sinais de infecção (calor crescente, dor, pus, febre) ou qualquer sintoma sistêmico exigem avaliação; sintomas fora do local da picada podem ser anafilaxia.\u003c/p>  \u003ch3>Tempo de uso e suspensão\u003c/h3> \u003cp>Para lesões agudas, cursos de poucos dias a 2 semanas costumam bastar. Depois que a pele melhora, o prescritor pode reduzir a frequência (uma vez ao dia, depois dias alternados) ou trocar por potência menor, mantendo o hidratante. Tubo de corticoide potente que acaba todo mês sem consulta é sinal de uso crônico sem acompanhamento e merece conversa e encaminhamento. Corticoide tópico em pele com ferida aberta, úlcera, acne, rosácea ou infecção viral (herpes, varicela) não deve ser usado.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Pergunte onde está a lesão, há quanto tempo, se coça, se há secreção, crosta ou bolha, se já usou algo e por quanto tempo. Em dermatite leve de adulto, fora da face, o acetato de hidrocortisona 1% (10 mg/g), que está na lista de MIP para dermatites, eczemas, eritema solar e picadas de inseto (IN 285/2024), pode ser orientado por poucos dias. Encaminhe se: lesão na face de bebê, área extensa, febre, secreção purulenta, lesão que não melhora em 7 dias, suspeita de micose ou herpes, ou uso prolongado de corticoide potente.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mãe pede creme de clobetasol para \"assadura\" de bebê de 8 meses. O farmacêutico explica que a fralda funciona como oclusão e aumenta muito a absorção, que o clobetasol é de potência muito alta e não deve ser usado nessa área, orienta troca frequente de fralda, limpeza com água e pasta à base de óxido de zinco e encaminha ao pediatra se houver lesões com pontos satélites (sugestivas de candidíase) ou piora em 3 dias.\u003c/p>\u003c/div>"},{"id":"m06-antialergicos","titulo":"Anti-histamínicos e antialérgicos","resumo":"\u003cp>Antialérgicos estão entre os produtos mais procurados no balcão, para coceira, espirros, coriza, urticária e picada de inseto. A escolha correta exige entender a histamina, os seus receptores e a diferença entre as duas gerações de anti-histamínicos H1 (anti-H1).\u003c/p> \u003ch3>Histamina e receptores\u003c/h3> \u003cp>A histamina fica armazenada em grânulos de mastócitos (pele, mucosas, vias aéreas) e basófilos. Na alergia do tipo imediato, o alérgeno se liga a anticorpos IgE presos ao mastócito, que libera histamina, leucotrienos, prostaglandinas e citocinas em minutos. Os receptores de histamina são quatro:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Receptor\u003c/th>\u003cth>Onde atua\u003c/th>\u003cth>Efeito da histamina\u003c/th>\u003cth>Bloqueio usado em\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>H1\u003c/td>\u003ctd>Vasos, brônquios, terminações nervosas, sistema nervoso central\u003c/td>\u003ctd>Vasodilatação, edema, coceira, espirro, broncoconstrição; vigília\u003c/td>\u003ctd>Alergia (anti-H1)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>H2\u003c/td>\u003ctd>Célula parietal do estômago, coração\u003c/td>\u003ctd>Secreção ácida\u003c/td>\u003ctd>Dispepsia, refluxo (famotidina)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>H3\u003c/td>\u003ctd>Sistema nervoso central\u003c/td>\u003ctd>Modula liberação de neurotransmissores\u003c/td>\u003ctd>Sem uso no balcão\u003c/td>\u003c/tr> \u003ctr>\u003ctd>H4\u003c/td>\u003ctd>Células imunes\u003c/td>\u003ctd>Quimiotaxia\u003c/td>\u003ctd>Em pesquisa\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Os anti-H1 funcionam como agonistas inversos: estabilizam o receptor na forma inativa. Funcionam melhor quando tomados \u003cstrong>antes\u003c/strong> da exposição ou no início dos sintomas, e agem pouco sobre a congestão nasal, que depende mais de leucotrienos e inflamação tardia.\u003c/p> \u003ch3>Primeira geração\u003c/h3> \u003cp>São lipofílicos, atravessam a barreira hematoencefálica e se ligam também a receptores muscarínicos, alfa-adrenérgicos e serotoninérgicos. Exemplos: \u003cstrong>dexclorfeniramina\u003c/strong>, \u003cstrong>prometazina\u003c/strong>, \u003cstrong>hidroxizina\u003c/strong>, difenidramina, clemastina, ciproeptadina, e a clorfeniramina e bronfeniramina dos antigripais.\u003c/p> \u003cul> \u003cli>\u003cb>Sedação e prejuízo psicomotor\u003c/b>: sonolência, lentidão de reflexos, prejuízo para dirigir e operar máquinas, que pode persistir no dia seguinte quando tomados à noite. Somam efeito com álcool, benzodiazepínicos, opioides e outros depressores.\u003c/li> \u003cli>\u003cb>Efeito anticolinérgico\u003c/b>: boca seca, visão turva, constipação, retenção urinária (risco na hiperplasia prostática), piora de glaucoma de ângulo fechado, taquicardia, confusão.\u003c/li> \u003cli>\u003cb>Idoso\u003c/b>: os Critérios de Beers (Sociedade Americana de Geriatria, 2023) recomendam evitar anti-H1 de primeira geração pelo risco de confusão, quedas e retenção urinária.\u003c/li> \u003cli>\u003cb>Criança menor de 2 anos\u003c/b>: prometazina e dexclorfeniramina são contraindicadas nessa idade (bulas registradas no Brasil); a prometazina por risco de depressão respiratória fatal. Em crianças maiores pode ocorrer excitação paradoxal (agitação, insônia).\u003c/li> \u003cli>\u003cb>Hidroxizina\u003c/b>: útil no prurido e com efeito ansiolítico; prolonga o intervalo QT. A EMA (2015) limitou a dose diária de adulto a 100 mg (50 mg em idosos), e a bula brasileira traz 25 mg 3 a 4 vezes ao dia, até 50 mg/dia no idoso, e recomendou evitar em quem tem fatores de risco para arritmia.\u003c/li> \u003c/ul> \u003ch3>Segunda geração\u003c/h3> \u003cp>São pouco lipofílicas ou substratos da glicoproteína P que as retira do cérebro. Causam pouca sedação e quase nenhum efeito anticolinérgico, e têm ação de 24 horas. São a primeira escolha para rinite alérgica e urticária. Exemplos: loratadina, desloratadina, cetirizina, levocetirizina, fexofenadina, bilastina, rupatadina e ebastina.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose adulto\u003c/th>\u003cth>Particularidade\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Loratadina\u003c/td>\u003ctd>10 mg 1x/dia\u003c/td>\u003ctd>Pró-fármaco de desloratadina; muito usada em gestação\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Desloratadina\u003c/td>\u003ctd>5 mg 1x/dia\u003c/td>\u003ctd>Metabólito ativo da loratadina\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Cetirizina\u003c/td>\u003ctd>10 mg 1x/dia\u003c/td>\u003ctd>Sedação leve em parte dos pacientes; ajuste em doença renal\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Levocetirizina\u003c/td>\u003ctd>5 mg 1x/dia\u003c/td>\u003ctd>Enantiômero ativo da cetirizina; ajuste renal\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fexofenadina\u003c/td>\u003ctd>120 mg 1x/dia (rinite); 180 mg 1x/dia (urticária)\u003c/td>\u003ctd>Tomar com água; sucos de frutas reduzem a absorção\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Bilastina\u003c/td>\u003ctd>20 mg 1x/dia\u003c/td>\u003ctd>Em jejum: 1 hora antes ou 2 horas depois de alimento ou suco\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Rupatadina\u003c/td>\u003ctd>10 mg 1x/dia\u003c/td>\u003ctd>Também antagoniza o fator ativador de plaquetas; evitar com inibidores do CYP3A4 e suco de toranja\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Ebastina\u003c/td>\u003ctd>10 a 20 mg 1x/dia\u003c/td>\u003ctd>Metabolizada pelo CYP3A4; cuidado com cetoconazol e macrolídeos\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Condição de venda (IN 285/2024, na redação da IN 404/2025): loratadina 10 mg, desloratadina 5 mg, levocetirizina 5 mg, fexofenadina até 180 mg, ebastina 10 mg e epinastina 20 mg estão na lista de MIP; cetirizina, bilastina e rupatadina não estão e exigem prescrição. Entre os de primeira geração, a dexclorfeniramina oral (2 mg e 6 mg de liberação prolongada) é MIP; prometazina e hidroxizina orais exigem prescrição.\u003c/p> \u003cp>A fexofenadina depende de transportadores intestinais (OATP) para ser absorvida. Sucos de laranja, maçã e toranja inibem esses transportadores e reduzem bastante a quantidade que chega ao sangue; a orientação é tomar com água e afastar o suco por algumas horas. Antiácidos com alumínio e magnésio também reduzem a absorção e devem ser separados. A bilastina também perde absorção com alimento e com suco de toranja.\u003c/p> \u003ch3>Urticária\u003c/h3> \u003cp>Urticária são placas elevadas, avermelhadas e muito pruriginosas que mudam de lugar e desaparecem em menos de 24 horas cada uma, às vezes com angioedema (inchaço de lábios, pálpebras). A forma aguda (menos de 6 semanas) costuma ter gatilho em infecção viral, medicamento (AINE, antibiótico) ou alimento. O tratamento é anti-H1 de segunda geração em dose padrão. Na urticária crônica, a diretriz internacional (EAACI/GA²LEN/EuroGuiDerm/APAAACI, 2022) recomenda anti-H1 de segunda geração diário e, se não houver controle, aumento até quatro vezes a dose padrão, decisão que cabe ao prescritor; a etapa seguinte é omalizumabe. Anti-H1 de primeira geração não são recomendados como tratamento regular.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Angioedema sem placas de urticária, principalmente em usuário de IECA (enalapril, captopril), é mediado por bradicinina e não responde a anti-H1 nem a corticoide. Inchaço de língua ou garganta, rouquidão ou dificuldade para engolir pedem atendimento de urgência.\u003c/p>\u003c/div> \u003ch3>Rinite alérgica\u003c/h3> \u003cp>Anti-H1 de segunda geração por via oral controlam bem espirros, prurido e coriza; agem pouco na obstrução nasal. Na rinite persistente ou com obstrução importante, o corticoide nasal é mais eficaz. A combinação, a lavagem nasal e o descongestionante estão detalhados no módulo 7.\u003c/p> \u003ch3>Gestação, lactação e criança\u003c/h3> \u003cp>Na gestação, loratadina e cetirizina são as mais estudadas e costumam ser as escolhidas pelo prescritor. Na lactação, as de segunda geração em dose habitual são compatíveis; as de primeira geração podem causar sonolência ou irritabilidade no lactente e reduzir a produção de leite. Em criança, usar a apresentação pediátrica (xarope ou gotas) e a idade mínima da bula de cada produto.\u003c/p> \u003ch3>Antialérgicos oftálmicos\u003c/h3> \u003cp>Na conjuntivite alérgica (coceira intensa, lacrimejamento, olho vermelho bilateral, sem secreção purulenta), os colírios são mais eficazes que o anti-H1 oral para os olhos.\u003c/p> \u003cul> \u003cli>\u003cb>Anti-H1 tópicos com ação estabilizadora de mastócitos\u003c/b> (olopatadina, cetotifeno, epinastina): alívio em minutos e prevenção; uso uma a duas vezes ao dia conforme o produto.\u003c/li> \u003cli>\u003cb>Estabilizadores de mastócitos puros\u003c/b> (cromoglicato dissódico): impedem a liberação de histamina, mas levam dias para fazer efeito; usados como prevenção na estação de alergia, várias vezes ao dia.\u003c/li> \u003cli>\u003cb>Colírios vasoconstritores\u003c/b> (nafazolina, tetrizolina): clareiam o olho, mas causam rebote com uso continuado; não tratam a alergia.\u003c/li> \u003c/ul> \u003cp>Lentes de contato devem ser retiradas antes da aplicação (o conservante cloreto de benzalcônio adere à lente) e recolocadas após cerca de 15 minutos.\u003c/p>  \u003ch3>Anti-H1 escondidos em outros produtos\u003c/h3> \u003cp>Muitos antigripais combinam anti-H1 de primeira geração (clorfeniramina, dexbronfeniramina) com descongestionante e analgésico. Indutores do sono vendidos sem receita costumam ser anti-H1 de primeira geração (difenidramina, doxilamina). O cliente que já usa um anti-H1, um benzodiazepínico ou bebe álcool soma sedação sem perceber. No idoso, a soma de anticolinérgicos (anti-H1, antidepressivos tricíclicos, oxibutinina, antiespasmódicos) aumenta o risco de confusão, retenção urinária e quedas.\u003c/p> \u003ch3>Quando o anti-H1 de primeira geração ainda é usado\u003c/h3> \u003cp>Há usos em que o efeito sedativo ou anticolinérgico é desejado: prometazina como antiemético ou para sedação por prescrição, hidroxizina para prurido noturno intenso, dexclorfeniramina injetável como adjuvante em reação alérgica no serviço de saúde. São escolhas do prescritor. Para alergia do dia a dia, a segunda geração é mais segura e tão eficaz quanto.\u003c/p> \u003ch3>Interações e cuidados\u003c/h3> \u003cul> \u003cli>Álcool, benzodiazepínicos, opioides, antipsicóticos: soma de depressão do sistema nervoso (1ª geração).\u003c/li> \u003cli>Inibidores da monoaminoxidase: potencializam efeitos anticolinérgicos e sedativos de anti-H1 de primeira geração.\u003c/li> \u003cli>Fármacos que prolongam QT (alguns antiarrítmicos, macrolídeos, antipsicóticos, ondansetrona): cautela com hidroxizina, ebastina e rupatadina em dose alta.\u003c/li> \u003cli>Doença renal: reduzir dose de cetirizina e levocetirizina conforme a TFG.\u003c/li> \u003c/ul>  \u003ch3>Coceira sem lesão e coceira que não passa\u003c/h3> \u003cp>Prurido generalizado sem lesões visíveis pode ser pele seca (comum em idosos e no inverno), mas também sinal de doença hepática, renal, tireoidiana, hematológica, efeito de medicamento (opioides, alguns antimaláricos) ou escabiose (coceira pior à noite, com lesões entre os dedos e em familiares). O anti-H1 alivia pouco nesses casos. Prurido que dura mais de 2 semanas, que acorda à noite ou que acompanha emagrecimento, icterícia ou febre deve ser investigado pelo médico. Na gestação, coceira intensa em palmas e plantas no terceiro trimestre pode indicar colestase gestacional e exige avaliação obstétrica.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Prefira anti-H1 de segunda geração para quem dirige, trabalha, estuda, é idoso ou tem glaucoma ou próstata aumentada. Pergunte se toma suco no café da manhã (fexofenadina, bilastina), se usa antifúngico ou macrolídeo (ebastina, rupatadina) e se tem doença renal (cetirizina, levocetirizina). Olho vermelho com dor, baixa da visão, fotofobia, secreção amarela ou de um lado só exige avaliação médica.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Motorista de aplicativo de 41 anos pede \"dexclorfeniramina\" para urticária que surgiu ontem. O farmacêutico pergunta sobre falta de ar, inchaço da boca e medicamentos novos (tomou ibuprofeno há dois dias), orienta suspender o ibuprofeno, indica loratadina 10 mg uma vez ao dia em vez de um anti-H1 sedativo e encaminha se as placas persistirem além de alguns dias ou surgirem sinais de gravidade.\u003c/p>\u003c/div>"},{"id":"m06-anafilaxia","titulo":"Anafilaxia e reação alérgica no balcão","resumo":"\u003cp>Anafilaxia é uma reação de hipersensibilidade sistêmica grave, de início rápido, que pode matar por obstrução das vias aéreas, broncoespasmo ou choque. Pode começar dentro da farmácia, minutos depois de alguém tomar um comprimido, ou chegar como um cliente que diz \"estou me sentindo estranho\" após uma picada de abelha. O farmacêutico precisa reconhecer o quadro, chamar ajuda e saber que \u003cstrong>adrenalina é o tratamento de primeira linha\u003c/strong>.\u003c/p> \u003ch3>Gatilhos mais comuns\u003c/h3> \u003cul> \u003cli>Alimentos: amendoim, castanhas, leite, ovo, peixes e frutos do mar, trigo.\u003c/li> \u003cli>Medicamentos: betalactâmicos, AINEs e AAS, dipirona, contraste iodado, bloqueadores neuromusculares, alguns imunobiológicos.\u003c/li> \u003cli>Picada de himenópteros: abelha, vespa, formiga.\u003c/li> \u003cli>Látex e, mais raramente, exercício físico associado a alimento.\u003c/li> \u003c/ul> \u003ch3>Como reconhecer\u003c/h3> \u003cp>Pelos critérios da Organização Mundial de Alergia (WAO, 2020), a anafilaxia é muito provável quando há:\u003c/p> \u003col> \u003cli>\u003cb>início agudo\u003c/b> (minutos a poucas horas) com envolvimento de pele ou mucosa (urticária generalizada, coceira, vermelhidão, inchaço de lábios, língua ou úvula) \u003cb>mais\u003c/b> pelo menos um entre: comprometimento respiratório (falta de ar, chiado, estridor, tosse), queda da pressão ou sinais de má perfusão (desmaio, tontura, confusão, incontinência) ou sintomas gastrointestinais intensos (cólica forte, vômitos repetidos), especialmente após alimento; \u003cb>ou\u003c/b>\u003c/li> \u003cli>\u003cb>hipotensão, broncoespasmo ou envolvimento da laringe\u003c/b> logo após exposição a um alérgeno conhecido ou muito provável para aquele paciente, \u003cb>mesmo sem lesões de pele\u003c/b>.\u003c/li> \u003c/ol> \u003cp>Parte das anafilaxias ocorre sem lesões de pele (segundo critério acima). Rouquidão, voz abafada, dificuldade para engolir e sensação de \"garganta fechando\" indicam edema de laringe. Sensação de morte iminente é um sintoma frequente e deve ser levada a sério.\u003c/p> \u003ch3>O que fazer\u003c/h3> \u003col> \u003cli>\u003cb>Ligar para o SAMU (192)\u003c/b> imediatamente e informar \"suspeita de anafilaxia\". O médico regulador orienta por telefone.\u003c/li> \u003cli>\u003cb>Interromper a exposição\u003c/b> quando possível (parar de comer, remover o ferrão de abelha raspando com um cartão).\u003c/li> \u003cli>\u003cb>Posicionar\u003c/b>: deitado de costas; sentado se a falta de ar for o principal problema; gestante semideitada sobre o lado esquerdo; inconsciente em posição lateral de segurança (WAO, 2020). Elevar as pernas é opcional, porque o benefício é controverso. Não deixar a pessoa levantar ou caminhar de repente, porque a mudança brusca para a posição de pé pode precipitar parada cardíaca.\u003c/li> \u003cli>\u003cb>Adrenalina intramuscular\u003c/b> na face anterolateral da coxa, o mais cedo possível. Se o paciente tiver a própria adrenalina prescrita, o farmacêutico ajuda a aplicar.\u003c/li> \u003cli>Manter a vigilância até a chegada da equipe; repetir a adrenalina se não houver melhora, conforme orientação do regulador.\u003c/li> \u003c/ol> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Referência (WAO, 2020)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Medicamento\u003c/td>\u003ctd>Adrenalina (epinefrina) 1 mg/mL\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dose\u003c/td>\u003ctd>0,01 mg/kg (0,01 mL/kg da solução 1 mg/mL)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dose máxima por aplicação\u003c/td>\u003ctd>0,5 mg (em criança, calcular pelo peso)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Via e local\u003c/td>\u003ctd>Intramuscular, face anterolateral do terço médio da coxa\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Repetição\u003c/td>\u003ctd>A cada 5 a 15 minutos, se necessário\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Por que anti-histamínico e corticoide não bastam\u003c/h3> \u003cp>Anti-H1 alivia coceira e urticária, mas não desfaz o edema de laringe, não reverte broncoespasmo e não eleva a pressão. Corticoide leva horas para agir e não há prova de que previna a reação bifásica. Os dois são \u003cstrong>adjuvantes\u003c/strong>, dados depois da adrenalina. Dar um comprimido de anti-histamínico e \"esperar para ver\" atrasa o tratamento eficaz. A WAO (2020) registra que a adrenalina ainda é subutilizada e que algumas diretrizes já tratam o anti-H1 como terceira linha, pelo risco de atrasar a adrenalina. Broncodilatador inalatório alivia o chiado, mas não substitui nova dose de adrenalina intramuscular quando os sintomas persistem.\u003c/p> \u003ch3>Autoinjetor de adrenalina no Brasil\u003c/h3> \u003cp>Em abril de 2026, a Associação Brasileira de Alergia e Imunologia (ASBAI) reafirmou que \u003cstrong>não há autoinjetor de adrenalina aprovado pela Anvisa\u003c/strong>. No mesmo mês, a Anvisa determinou a apreensão e a proibição de venda de um autoinjetor estrangeiro anunciado por uma rede de farmácias, por se tratar de produto sem registro (Diário Oficial da União de 2 de abril de 2026). Hoje, quem precisa de autoinjetor recorre à importação por pessoa física, sujeita às regras sanitárias, com custo alto. Alguns alergistas prescrevem um kit com ampola de adrenalina 1 mg/mL e seringa de 1 mL, com treinamento do paciente e da família e instruções escritas, alternativa prevista pela WAO (2020) onde não há autoinjetor. A farmácia não pode vender nem anunciar produto sem registro.\u003c/p> \u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>Medicamento sem registro na Anvisa não pode ser comercializado, anunciado ou dispensado em farmácia. A Lei nº 6.360/1976 (art. 12) estabelece que nenhum medicamento pode ser industrializado, exposto à venda ou entregue ao consumo antes de registrado no Ministério da Saúde.\u003c/p>\u003c/div> \u003ch3>Reação alérgica leve no balcão\u003c/h3> \u003cp>Nem toda alergia é anafilaxia. Urticária localizada, coceira ou inchaço restrito ao local de uma picada, sem falta de ar, sem rouquidão, sem tontura e sem vômitos, é reação leve. Conduta: identificar e suspender o suspeito, oferecer anti-H1 de segunda geração quando a condição de venda permitir, compressa fria, orientar os sinais de alarme e pedir que volte ou procure atendimento se algo novo aparecer nas próximas horas. Reação a medicamento deve ser notificada à Anvisa pelo VigiMed e registrada para o paciente informar em consultas futuras.\u003c/p>  \u003ch3>Fatores que agravam a reação\u003c/h3> \u003cp>Asma não controlada, doença cardiovascular, idade avançada, mastocitose e o uso de betabloqueador ou IECA tornam a anafilaxia mais grave ou mais difícil de tratar. O betabloqueador pode reduzir a resposta à adrenalina; isso não é motivo para deixar de aplicá-la, e a equipe de emergência dispõe de alternativas. Esforço físico, álcool, febre e AINE podem facilitar a reação a um alimento que antes era tolerado.\u003c/p> \u003ch3>Adrenalina: segurança\u003c/h3> \u003cp>Não existe contraindicação absoluta à adrenalina na anafilaxia. Palidez, tremor, palpitação, ansiedade e cefaleia passageiros são esperados e indicam que o fármaco chegou à circulação. A via intramuscular na coxa é preferida à subcutânea porque a absorção é mais rápida e previsível. A via venosa fica restrita ao ambiente hospitalar, pelo risco de arritmia quando usada sem monitorização.\u003c/p> \u003ch3>Depois do episódio\u003c/h3> \u003cp>Todo paciente que recebeu adrenalina precisa ser levado a um serviço de emergência, mesmo que melhore, porque os sintomas podem voltar horas depois (reação bifásica). Na alta, o médico deve orientar sobre o gatilho, prescrever adrenalina para uso em nova crise e encaminhar ao alergista. A farmácia pode ajudar a identificar o medicamento suspeito, anotar o nome do princípio ativo (não só a marca) no cadastro do cliente e alertar para produtos com o mesmo princípio ativo ou da mesma classe.\u003c/p>  \u003ch3>Farmácia que aplica injetáveis e vacinas\u003c/h3> \u003cp>Quando a farmácia oferece aplicação de injetáveis ou vacinação, a anafilaxia deixa de ser hipótese remota. O serviço precisa ter protocolo escrito de atendimento de intercorrências, equipe treinada, materiais e medicamentos previstos pela norma sanitária do serviço e o telefone de emergência visível. Após cada aplicação, o cliente deve permanecer em observação pelo tempo definido no protocolo, sentado e acompanhado, e ser orientado sobre sinais tardios. O registro de lote, horário e reação adversa é obrigatório.\u003c/p>  \u003ch3>O que pode parecer anafilaxia\u003c/h3> \u003cul> \u003cli>\u003cb>Reação vasovagal\u003c/b> (desmaio comum, por exemplo ao ver agulha): palidez, suor frio, náusea e pulso lento, sem urticária, sem chiado e com melhora rápida ao deitar.\u003c/li> \u003cli>\u003cb>Crise de ansiedade\u003c/b>: falta de ar com formigamento em mãos e boca, sem urticária, sem queda de pressão.\u003c/li> \u003cli>\u003cb>Crise de asma\u003c/b>: chiado e falta de ar sem lesões de pele, em asmático conhecido.\u003c/li> \u003c/ul> \u003cp>Na dúvida entre anafilaxia e outro quadro, a conduta é tratar como anafilaxia e acionar o SAMU: o risco de atrasar a adrenalina é muito maior que o de aplicá-la sem necessidade.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Quem já teve anafilaxia deve ter plano de ação escrito, adrenalina prescrita, identificação (pulseira ou cartão) e acompanhamento com alergista. Ao dispensar AINE, antibiótico ou dipirona, pergunte sobre reações anteriores. Cliente com histórico de anafilaxia por AINE não deve receber nenhum AINE no balcão.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Rapaz de 19 anos entra na farmácia com placas pelo corpo, lábios inchados e voz rouca 20 minutos após comer camarão. O farmacêutico pede a um colega que ligue para o SAMU, deita o paciente de costas (sentado, se a falta de ar piorar deitado), pergunta se ele tem adrenalina (não tem) e segue as orientações do médico regulador até a chegada da ambulância, sem oferecer anti-histamínico como substituto.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m06-mapa-aines","titulo":"AINEs: mecanismo, riscos e balcão","centro":"AINEs","ramos":[{"t":"Mecanismo","itens":["Bloqueiam COX: menos prostaglandina","COX-1: estômago, plaqueta, rim","COX-2: inflamação, endotélio, rim","AAS: bloqueio irreversível da plaqueta"]},{"t":"Escolha","itens":["Menor dose, menor tempo","Nunca dois AINEs juntos","Coxibe: menos úlcera, mesmo risco CV e renal","Nimesulida: fígado; máx. 15 dias (EMA)","Gel tópico: idoso com dor localizada"]},{"t":"Riscos","itens":["Úlcera e sangramento sem dor prévia","Lesão renal em desidratado e idoso","Infarto, AVC, PA alta, piora da IC","Broncoespasmo em asma com pólipo nasal"]},{"t":"Gestação e dengue","itens":["Evitar a partir de 20 semanas (FDA 2020)","3º trimestre: fecha canal arterial","Dengue: sem AAS, AINE e corticoide (MS 2024)","Opção: paracetamol ou dipirona"]},{"t":"Interações","itens":["Anticoagulante, AAS, ISRS: sangramento","IECA/BRA + diurético: lesão renal","Lítio: intoxicação","Metotrexato: toxicidade"]},{"t":"Gastroproteção","itens":["Idade de 65 anos ou mais","Úlcera prévia","Anticoagulante, AAS, corticoide, ISRS","IBP diário durante o uso"]}]},{"id":"m06-mapa-corticoides","titulo":"Corticosteroides sistêmicos e tópicos","centro":"Corticosteroides","ramos":[{"t":"Mecanismo","itens":["Receptor no citoplasma, age no núcleo","Reprime genes inflamatórios","Efeito em horas, não em minutos"]},{"t":"Equivalência","itens":["Hidrocortisona 20 mg","Prednisona/prednisolona 5 mg","Metilprednisolona 4 mg","Dexametasona 0,75 mg (longa)"]},{"t":"Uso correto","itens":["Dose única pela manhã com alimento","Curso \u003c 2 semanas: sem desmame","Uso longo: nunca parar sozinho","Diabético: glicemia da tarde sobe"]},{"t":"Efeitos adversos","itens":["Curto: glicemia, insônia, PA, apetite","Longo: Cushing, osteoporose, catarata","Infecção e supressão do eixo HHA"]},{"t":"Tópicos","itens":["Potência: baixa, média, alta, muito alta","1 ponta de dedo = 0,5 g = 2 palmas","Face, dobras, criança: baixa potência","Atrofia, estrias, rebote, tinha incógnita"]},{"t":"Alertas","itens":["Ritonavir + fluticasona: Cushing","Vacina viva: evitar em dose alta","Injetável de depósito só com receita"]}]},{"id":"m06-mapa-antialergicos","titulo":"Antialérgicos e anafilaxia","centro":"Alergia no balcão","ramos":[{"t":"Histamina","itens":["H1: coceira, edema, espirro, vigília","H2: ácido gástrico","Anti-H1: melhor antes da exposição"]},{"t":"Anti-H1 1ª geração","itens":["Dexclorfeniramina, prometazina, hidroxizina","Sono, reflexo lento, efeito anticolinérgico","Idoso: evitar (Beers 2023)","Menor de 2 anos: contraindicado"]},{"t":"Anti-H1 2ª geração","itens":["Loratadina 10 mg, desloratadina 5 mg","Cetirizina 10 mg, levocetirizina 5 mg","Fexofenadina 120 a 180 mg: tomar com água","Bilastina 20 mg em jejum"]},{"t":"Usos","itens":["Urticária: 2ª geração diária","Rinite: espirro e coriza","Olho: olopatadina, cetotifeno","Angioedema por IECA: não responde"]},{"t":"Anafilaxia","itens":["Pele + respiração ou pressão","Ligar 192 e deitar de costas","Adrenalina IM na coxa: 1ª linha","0,01 mg/kg; máx. 0,5 mg por dose","Anti-H1 e corticoide: só adjuvantes"]},{"t":"Brasil","itens":["Sem autoinjetor registrado (2026)","Vender sem registro: infração","Notificar reação no VigiMed"]}]}],"apoio":[{"tipo":"tabela","id":"m06-tab-aines","titulo":"AINEs e analgésicos: doses de adulto e alertas","colunas":["Fármaco","Seletividade","Venda (IN 285/2024)","Dose usual adulto","Dose máx./dia","Alerta"],"linhas":[["Ibuprofeno","Não seletivo","MIP até 400 mg por unidade e suspensão oral","200 a 400 mg a cada 6 a 8 h","1,2 g sem prescrição (bula MIP); dose maior só prescrita","Pode reduzir o efeito antiplaquetário do AAS"],["Naproxeno","Não seletivo","MIP: 500 mg; sódico 550 mg","Sem prescrição: 500 mg 1x/dia; prescrito: 250 a 500 mg a cada 12 h","500 mg sem prescrição; prescrito, em geral 1 g em uso contínuo","Meia-vida longa; risco GI maior, CV menor"],["Diclofenaco","Não seletivo (tende a COX-2)","Oral: prescrição; gel e solução tópica: MIP","50 mg 2 a 3x/dia","150 mg","Risco CV semelhante ao dos coxibes; hepatotoxicidade"],["Cetoprofeno","Não seletivo","Prescrição","100 mg 2x/dia ou 50 mg 3x/dia","300 mg","Gel: fotossensibilidade"],["Nimesulida","Preferencial COX-2","Oral: prescrição; gel 20 mg/g: MIP","50 a 100 mg a cada 12 h","200 mg (EMA, até 15 dias); bula brasileira admite 400 mg em caso excepcional","Hepatotoxicidade; contraindicada abaixo de 12 anos e na amamentação"],["Piroxicam","Não seletivo","Prescrição","20 mg 1x/dia","20 mg","Alto risco GI e reações cutâneas graves"],["Meloxicam","Preferencial COX-2","Prescrição","7,5 a 15 mg 1x/dia","15 mg","Meia-vida longa"],["Celecoxibe","Seletivo COX-2","Prescrição","100 mg 2x/dia ou 200 mg 1x/dia","400 mg","Risco CV e renal; alergia a sulfonamida"],["Etoricoxibe","Seletivo COX-2","Prescrição","60 a 90 mg 1x/dia (120 mg na gota aguda, por até 8 dias)","120 mg","Eleva PA; evitar em hipertensão não controlada"],["Dipirona","Sem ação anti-inflamatória relevante","MIP (comprimido até 1 g, solução oral, supositório)","500 mg a 1 g até 4x/dia","4 g","Agranulocitose rara; hipotensão"],["Paracetamol","Sem ação anti-inflamatória relevante","MIP","500 mg a 1 g a cada 4 a 6 h","4 g, sem passar de 1 g por dose (menos em hepatopata ou etilista)","Hepatotoxicidade por superdose"]],"nota":"Condição de venda pela Lista de MIP (IN 285/2024, Anexo I, na redação da IN 404/2025): a isenção vale só para a mesma forma, indicação e concentração igual ou menor que a da lista. Doses de adulto conferidas em bulas brasileiras (Tylenol® 750 mg, dipirona 1 g, ibuprofeno 400 mg, naproxeno 500 mg, nimesulida 100 mg, cetoprofeno 100 mg) e na ficha técnica europeia do etoricoxibe; para diclofenaco, piroxicam, meloxicam e celecoxibe são doses de referência clássicas, a conferir na bula do produto. Em idosos e na doença renal (TFG por CKD-EPI 2021), usar a menor dose pelo menor tempo."},{"tipo":"tabela","id":"m06-tab-corticoides","titulo":"Equivalência dos corticosteroides sistêmicos (valores aproximados)","colunas":["Fármaco","Dose equivalente","Potência glicocorticoide","Potência mineralocorticoide","Duração biológica"],"linhas":[["Hidrocortisona","20 mg","1","1","8 a 12 h"],["Prednisona","5 mg","4","0,8","12 a 36 h"],["Prednisolona","5 mg","4","0,8","12 a 36 h"],["Metilprednisolona","4 mg","5","Mínima","12 a 36 h"],["Dexametasona","0,75 mg","25 a 30","Desprezível","36 a 72 h"],["Betametasona","0,6 a 0,75 mg","25 a 30","Desprezível","36 a 72 h"]],"nota":"Valores aproximados, conforme a tabela de Liu e colaboradores (Allergy Asthma Clin Immunol, 2013); pequenas variações existem entre fontes. Exemplo de conversão: prednisona 40 mg corresponde a cerca de dexametasona 6 mg."},{"tipo":"tabela","id":"m06-tab-topicos","titulo":"Potência dos corticosteroides tópicos","colunas":["Potência","Exemplos","Onde e quanto tempo"],"linhas":[["Baixa","Acetato de hidrocortisona 1% (MIP); desonida 0,05%","Face, pálpebras, dobras, criança; cursos curtos"],["Média","Triancinolona acetonida 0,1%; butirato de hidrocortisona 0,1%","Tronco e membros de adulto; até 2 a 3 semanas"],["Alta","Valerato de betametasona 0,1%; dipropionato de betametasona 0,05%; furoato de mometasona 0,1%","Lesões espessas em adulto; evitar face e dobras"],["Muito alta","Propionato de clobetasol 0,05%","Psoríase, líquen, palmas e plantas; prescrição e cursos curtos"]],"nota":"Classificação aproximada em quatro grupos, como a usada no Reino Unido e na Nova Zelândia (DermNet NZ); fluticasona e desoximetasona mudam de grupo conforme a fonte. Acetato de hidrocortisona 10 mg/g é o único corticoide tópico da lista de MIP (IN 285/2024). Pomada é mais potente que creme da mesma molécula; oclusão (fralda, curativo) aumenta a absorção. Uma unidade de ponta de dedo (cerca de 0,5 g) cobre duas palmas de mão de adulto."},{"tipo":"tabela","id":"m06-tab-antih1","titulo":"Anti-histamínicos H1: primeira e segunda geração","colunas":["Fármaco","Geração","Venda (IN 285/2024)","Dose adulto","Sedação","Observação"],"linhas":[["Dexclorfeniramina","1ª","MIP (2 mg; 6 mg LP; solução oral)","2 mg a cada 6 a 8 h (máx. 12 mg/dia)","Alta","Comprimido: acima de 12 anos; solução oral: contraindicada abaixo de 2 anos"],["Prometazina","1ª","Oral: prescrição; creme: MIP","25 mg, conforme prescrição","Muito alta","Menor de 2 anos: depressão respiratória fatal"],["Hidroxizina","1ª","Prescrição","25 mg 3 a 4x/dia (máx. 100 mg/dia)","Alta","Prolonga QT; idoso máx. 50 mg/dia (bula; EMA 2015)"],["Loratadina","2ª","MIP","10 mg 1x/dia","Mínima","Opção frequente na gestação"],["Desloratadina","2ª","MIP","5 mg 1x/dia","Mínima","Metabólito ativo da loratadina"],["Cetirizina","2ª","Prescrição","10 mg 1x/dia","Leve","Ajustar na doença renal"],["Levocetirizina","2ª","MIP","5 mg 1x/dia","Leve","Ajustar na doença renal"],["Fexofenadina","2ª","MIP (até 180 mg)","120 mg (rinite) ou 180 mg (urticária) 1x/dia","Mínima","Com água; sem suco de fruta e antiácido próximo"],["Bilastina","2ª","Prescrição","20 mg 1x/dia","Mínima","Em jejum, longe de alimento e suco"],["Rupatadina","2ª","Prescrição","10 mg 1x/dia","Leve","Inibidores do CYP3A4 e toranja aumentam o nível"],["Ebastina","2ª","MIP (10 mg)","10 a 20 mg 1x/dia","Leve","Cuidado com cetoconazol e macrolídeos"]],"nota":"Condição de venda pela Lista de MIP (IN 285/2024, na redação da IN 404/2025). Doses de adulto e adolescente conforme bulas (dexclorfeniramina e hidroxizina conferidas em bulas brasileiras; demais, doses padrão de bula). Na urticária crônica, o aumento até 4 vezes a dose padrão de anti-H1 de 2ª geração é decisão do prescritor (EAACI/GA²LEN/EuroGuiDerm/APAAACI, 2022)."},{"tipo":"fluxo","id":"m06-fluxo-alergia","titulo":"Reação alérgica no balcão","passos":[{"t":"Cliente com coceira, placas, inchaço ou mal-estar após alimento, medicamento ou picada","tipo":"inicio"},{"t":"Há falta de ar, chiado, rouquidão, inchaço de língua ou garganta, tontura, desmaio ou vômitos repetidos?","tipo":"decisao","sim":"Tratar como anafilaxia: seguir para o próximo passo","nao":"Reação leve: ir para o passo de conduta da reação leve"},{"t":"Ligar para o SAMU (192) e informar suspeita de anafilaxia","tipo":"alerta"},{"t":"Deitar de costas (sentado se falta de ar; gestante sobre o lado esquerdo); não deixar levantar de repente","tipo":"acao"},{"t":"O paciente tem adrenalina prescrita?","tipo":"decisao","sim":"Ajudar a aplicar na face lateral da coxa e anotar o horário","nao":"Seguir orientação do médico regulador do SAMU"},{"t":"Sem melhora em 5 a 15 minutos: nova dose de adrenalina se disponível, conforme o regulador","tipo":"acao"},{"t":"Anti-H1 e corticoide não substituem a adrenalina e não atrasam o chamado","tipo":"alerta"},{"t":"Reação leve: suspender o suspeito, anti-H1 de 2ª geração quando permitido, compressa fria","tipo":"acao"},{"t":"Orientar sinais de alarme nas próximas horas e retorno ou atendimento se surgirem","tipo":"acao"},{"t":"Registrar, notificar no VigiMed se for medicamento e encaminhar ao médico ou alergista","tipo":"fim"}]},{"tipo":"checklist","id":"m06-check-aine","titulo":"Antes de dispensar um AINE","itens":["Perguntar se está grávida e com quantas semanas","Descartar suspeita de dengue em quadro febril agudo","Perguntar sobre anticoagulante, AAS, clopidogrel e antidepressivo","Perguntar sobre anti-hipertensivo, diurético, lítio e metotrexato","Investigar úlcera, sangramento digestivo ou gastrite prévia","Investigar doença renal, insuficiência cardíaca e infarto ou AVC prévio","Perguntar sobre asma com pólipo nasal ou reação prévia a AINE","Checar se já usa outro AINE, inclusive em antigripal","Orientar tomar após refeição e pelo menor tempo","Avaliar necessidade de gastroproteção"]},{"tipo":"cartoes","id":"m06-cartoes","titulo":"Cartões de revisão","itens":[{"f":"Qual isoforma da COX protege a mucosa gástrica?","v":"COX-1 (constitutiva)."},{"f":"Por que coxibes aumentam o risco de trombose?","v":"Reduzem a prostaciclina endotelial (COX-2) sem reduzir o tromboxano plaquetário (COX-1)."},{"f":"A partir de quantas semanas a FDA (2020) recomenda evitar AINE na gestação?","v":"20 semanas, pelo risco de disfunção renal fetal e oligoâmnio."},{"f":"Analgésicos indicados na suspeita de dengue?","v":"Dipirona ou paracetamol; AAS, AINEs e corticoides são contraindicados."},{"f":"Fatores que indicam gastroproteção no uso de AINE?","v":"Idade de 65 anos ou mais, úlcera prévia, anticoagulante, AAS, corticoide ou ISRS, dose alta."},{"f":"O que é a tríplice ameaça para o rim?","v":"AINE associado a IECA ou BRA e diurético."},{"f":"Restrições da EMA para nimesulida?","v":"Segunda linha, máximo 15 dias, contraindicada em hepatopatia e menores de 12 anos."},{"f":"Nimesulida oral no Brasil é MIP?","v":"Não; é venda sob prescrição. Só o gel 20 mg/g está na lista de MIP (IN 285/2024)."},{"f":"Dose de dexametasona equivalente a prednisona 5 mg?","v":"0,75 mg."},{"f":"Curso de corticoide que dispensa desmame?","v":"Menos de 2 semanas (ex.: crise de asma)."},{"f":"Melhor horário para corticoide oral em dose única?","v":"Pela manhã, com o café da manhã."},{"f":"Quanto vale uma unidade de ponta de dedo?","v":"Cerca de 0,5 g, suficiente para duas palmas de mão de adulto."},{"f":"Exemplo de corticoide tópico de potência muito alta?","v":"Propionato de clobetasol 0,05%."},{"f":"Por que evitar anti-H1 de 1ª geração em idosos?","v":"Sedação, confusão, quedas e efeito anticolinérgico (Critérios de Beers 2023)."},{"f":"Como tomar fexofenadina?","v":"Com água, longe de sucos de frutas e de antiácidos com alumínio e magnésio."},{"f":"Primeira linha na anafilaxia?","v":"Adrenalina intramuscular na face anterolateral da coxa."},{"f":"Dose de adrenalina IM na anafilaxia?","v":"0,01 mg/kg da solução 1 mg/mL, até 0,5 mg por aplicação (WAO 2020)."},{"f":"Há autoinjetor de adrenalina registrado no Brasil?","v":"Não; a ASBAI confirmou em abril de 2026 que nenhum foi aprovado pela Anvisa."},{"f":"Angioedema por IECA responde a anti-H1?","v":"Não; é mediado por bradicinina e exige avaliação de urgência."}]},{"tipo":"questoes","id":"m06-questoes","titulo":"Questões de fixação","itens":[{"p":"Gestante de 24 semanas pede ibuprofeno para dor lombar. Segundo o alerta da FDA de 2020, a conduta mais adequada é:","alt":["Dispensar ibuprofeno 400 mg por até 5 dias, após refeições","Evitar AINE, orientar paracetamol e encaminhar se persistir","Dispensar nimesulida, por ser preferencial para COX-2","Dispensar diclofenaco gel para aplicar em toda a região lombar","Indicar AAS 500 mg, por ter efeito antiagregante protetor"],"c":1,"com":"A FDA (15/10/2020) recomenda evitar AINEs a partir de 20 semanas pelo risco de disfunção renal fetal e oligoâmnio. Nimesulida e AAS em dose analgésica também são AINEs. Gel em área extensa gera absorção sistêmica. Paracetamol é a opção de primeira linha na gestação."},{"p":"Idoso de 70 anos em uso de varfarina pede algo para dor de dente. Qual a escolha mais segura no balcão?","alt":["Naproxeno 500 mg a cada 12 horas por 5 dias, após as refeições","Cetoprofeno 100 mg a cada 12 horas por 3 dias","Piroxicam 20 mg uma vez ao dia por 7 dias","Celecoxibe 200 mg uma vez ao dia por 5 dias, por ser seletivo","Paracetamol em dose habitual e encaminhar ao dentista"],"c":4,"com":"AINEs, inclusive coxibes, aumentam o risco de sangramento com varfarina e o risco renal no idoso. Paracetamol em dose habitual, por pouco tempo, é a escolha; uso prolongado em dose alta pode elevar o INR, por isso o encaminhamento ao dentista para tratar a causa."},{"p":"Sobre a seletividade dos AINEs, assinale a alternativa correta.","alt":["Coxibes reduzem úlcera, mas mantêm risco renal e cardiovascular","O diclofenaco tem o menor risco cardiovascular de toda a classe","Coxibes eliminam o risco renal porque poupam a COX-1 presente no rim","O ibuprofeno em dose baixa tem o maior risco gastrointestinal","O AAS inibe a cicloxigenase das plaquetas de forma reversível"],"c":0,"com":"Coxibes reduzem lesão GI por pouparem a COX-1, mas a COX-2 participa da perfusão renal e da prostaciclina endotelial, mantendo risco renal e cardiovascular. Diclofenaco tem risco CV semelhante ao dos coxibes. Ibuprofeno em dose baixa está entre os de menor risco GI. O AAS acetila a COX de modo irreversível."},{"p":"Cliente de 45 anos, asmático com pólipo nasal, teve crise de falta de ar após AAS no passado. Para dor de cabeça, pede diclofenaco. A conduta é:","alt":["Dispensar, porque o diclofenaco não tem relação com o AAS","Dispensar ibuprofeno em dose baixa, que não causa a reação","Dispensar AINE junto com anti-histamínico para prevenir a crise","Não dispensar AINE; orientar paracetamol e avaliação médica","Dispensar nimesulida, que não tem reação cruzada com o AAS"],"c":3,"com":"A doença respiratória exacerbada por AINE tem reação cruzada entre inibidores de COX-1 (AAS, diclofenaco, ibuprofeno, nimesulida em dose alta). Paracetamol em dose habitual costuma ser tolerado; coxibes, se necessários, dependem de decisão médica. Anti-histamínico não previne broncoespasmo."},{"p":"Paciente vai trocar prednisona 20 mg/dia por dexametasona. A dose equivalente aproximada de dexametasona é:","alt":["0,75 mg","1,5 mg","3 mg","6 mg","20 mg"],"c":2,"com":"Prednisona 5 mg equivale a dexametasona 0,75 mg. Logo, 20 mg de prednisona (4 vezes 5 mg) equivalem a 4 vezes 0,75 mg, ou seja, 3 mg de dexametasona."},{"p":"Adulto recebeu prednisona 40 mg/dia por 5 dias para crise de asma. Quanto à suspensão, é correto orientar que:","alt":["Deve reduzir 5 mg por semana até parar de vez","Pode parar ao fim do 5º dia, sem desmame","Deve passar a dose para a noite antes de parar","Deve manter 5 mg/dia por mais um mês inteiro","Precisa trocar por dexametasona antes de parar"],"c":1,"com":"Cursos com menos de 2 semanas não exigem desmame (PCDT da Asma 2026, com base na GINA). A dose deve ser pela manhã, porque a tomada noturna suprime mais o eixo HHA. Desmame é necessário em uso prolongado ou em dose alta por semanas."},{"p":"Diabético tipo 2 inicia prednisona 40 mg pela manhã. Qual orientação está correta?","alt":["Basta a glicemia de jejum para detectar a hiperglicemia do corticoide","Corticoide costuma reduzir a glicemia em diabéticos tipo 2","Deve suspender a metformina enquanto durar o curso de corticoide","Deve dividir a dose e tomar metade à noite para evitar picos","Medir também antes do jantar, quando a glicemia tende a subir"],"c":4,"com":"Prednisona matinal eleva principalmente a glicemia pós-prandial e vespertina; a de jejum pode estar normal. Não se suspende antidiabético por conta própria; ajustes são do prescritor. Dose noturna aumenta insônia e supressão do eixo."},{"p":"Mãe traz receita antiga de clobetasol para eczema no rosto da filha de 4 anos. A orientação mais adequada é:","alt":["Explicar que face de criança pede baixa potência e encaminhar ao pediatra","Usar clobetasol duas vezes ao dia por 30 dias seguidos, sem pausa","Usar clobetasol sob curativo oclusivo para potencializar o efeito","Trocar por creme com corticoide, antifúngico e antibiótico associados","Usar a menor quantidade possível, menos de meia unidade de ponta de dedo por mês"],"c":0,"com":"Clobetasol é de potência muito alta; na face e em criança há maior absorção e risco de atrofia, telangiectasia e dermatite perioral. Oclusão aumenta a absorção. Associações tríplices sem diagnóstico favorecem micose atípica e resistência. Quantidade insuficiente leva à falha; a escolha da potência é do prescritor."},{"p":"Cliente toma fexofenadina 180 mg com suco de laranja no café da manhã e diz que o remédio não faz efeito. A explicação mais provável é:","alt":["Indução do CYP3A4 hepático causada pelo suco de laranja","Redução da absorção por inibição de transportadores intestinais","Aumento da excreção renal do fármaco provocado pelo ácido do suco","Tolerância farmacológica após poucos dias de uso contínuo","Interação farmacodinâmica da fexofenadina com a cafeína"],"c":1,"com":"Sucos de laranja, maçã e toranja inibem os transportadores OATP do intestino e reduzem a absorção da fexofenadina. A orientação é tomar com água e afastar o suco. A fexofenadina é pouco metabolizada pelo CYP3A4 e não sofre interação relevante com cafeína."},{"p":"Senhora de 78 anos, com glaucoma de ângulo fechado e constipação, pede antialérgico para coceira. A melhor opção é:","alt":["Dexclorfeniramina 2 mg a cada 6 horas","Prometazina 25 mg à noite","Hidroxizina 25 mg três vezes ao dia","Loratadina 10 mg uma vez ao dia","Difenidramina 50 mg ao deitar"],"c":3,"com":"Anti-H1 de 1ª geração (dexclorfeniramina, prometazina, hidroxizina, difenidramina) têm efeito anticolinérgico e sedativo, devem ser evitados em idosos (Critérios de Beers 2023) e pioram glaucoma de ângulo fechado e constipação. Loratadina é de 2ª geração, com efeito anticolinérgico mínimo."},{"p":"Jovem apresenta urticária generalizada, rouquidão e tontura 15 minutos após comer amendoim, dentro da farmácia. A primeira conduta é:","alt":["Dar loratadina 10 mg e observar na farmácia por uma hora","Dar prednisona 40 mg e liberar com retorno no dia seguinte","Ligar 192, deitar o paciente e garantir adrenalina IM","Oferecer água e orientar ir a pé até a unidade de saúde","Aplicar corticoide tópico nas placas e anti-H1 em gotas"],"c":2,"com":"Há pele mais comprometimento respiratório e circulatório: anafilaxia pelos critérios da WAO (2020). Adrenalina IM é a primeira linha; anti-H1 e corticoide são adjuvantes e não revertem edema de laringe nem choque. Levantar e caminhar pode precipitar colapso. O SAMU (192) deve ser acionado de imediato."}]}],"fontes":["Anvisa. Instrução Normativa nº 285, de 7 de março de 2024. Lista de Medicamentos Isentos de Prescrição. Diário Oficial da União, 12 mar. 2024; Anexo I na redação da Instrução Normativa nº 404, de 10 de novembro de 2025 (Diário Oficial da União, 13 nov. 2025), consultada no texto publicado.","Brasil. Ministério da Saúde. Portaria Conjunta SAES/SCTIE nº 43, de 24 de março de 2026. Aprova o Protocolo Clínico e Diretrizes Terapêuticas da Asma (Relatório de Recomendação Conitec nº 1078, dez. 2025). https://www.gov.br/conitec/","FDA. Drug Safety Communication: FDA recommends avoiding use of NSAIDs in pregnancy at 20 weeks or later because they can result in low amniotic fluid. 15 out. 2020, atualizada em 16 out. 2020 (AINE oftálmico). https://www.fda.gov/drugs/drug-safety-and-availability/ (consultada em out. 2026).","European Medicines Agency. Questions and answers on the review of systemic medicines containing nimesulide (Article 107 procedure). EMA, 2012.","Associação Brasileira de Alergia e Imunologia (ASBAI). Nota sobre a inexistência de autoinjetor de adrenalina aprovado pela Anvisa. Abril de 2026 (conferida por reportagens de abril de 2026).","Anvisa. Resoluções de apreensão e proibição de autoinjetor de adrenalina sem registro. Diário Oficial da União, 2 abr. 2026 (conferidas por reportagens).","Brasil. Lei nº 6.360, de 23 de setembro de 1976, art. 12. Vigilância sanitária de medicamentos.","Brasil. Ministério da Saúde. Dengue: diagnóstico e manejo clínico, adulto e criança. 6ª ed. Brasília, 2024 (item 6.1.2 e Apêndice H).","Cardona V, Ansotegui IJ, Ebisawa M, et al. World Allergy Organization Anaphylaxis Guidance 2020. World Allergy Organ J. 2020;13(10):100472. doi:10.1016/j.waojou.2020.100472 (texto completo no PubMed Central, consultado em out. 2026).","Zuberbier T, et al. The international EAACI/GA²LEN/EuroGuiDerm/APAAACI guideline for the definition, classification, diagnosis, and management of urticaria. Allergy. 2022;77(3):734-766 (referência clássica, não reaberta nesta revisão).","American Geriatrics Society. 2023 Updated AGS Beers Criteria for potentially inappropriate medication use in older adults. J Am Geriatr Soc. 2023 (referência clássica, não reaberta nesta revisão).","Bulas registradas no Brasil consultadas em reproduções (sites de farmácias e bula.com.br, out. 2026; Bulário Eletrônico da Anvisa inacessível): nimesulida 100 mg (Nimesilam®, EMS; Inflalid®, Legrand; Vitamedic), Tylenol® 750 mg, dipirona monoidratada 1 g, ibuprofeno 400 mg, naproxeno 500 mg, Profenid® (cetoprofeno), Hixizine® (hidroxizina), Polaramine® (dexclorfeniramina) e prometazina (Fenergan®).","FDA. Drug Safety Communication: FDA strengthens warning that non-aspirin NSAIDs can cause heart attacks or strokes. 9 jul. 2015 (referência clássica, não reaberta nesta revisão).","Long CC, Finlay AY. The finger-tip unit: a new practical measure. Clin Exp Dermatol. 1991;16(6):444-447 (referência clássica, não reaberta nesta revisão).","Liu D, Ahmet A, Ward L, et al. A practical guide to the monitoring and management of the complications of systemic corticosteroid therapy. Allergy Asthma Clin Immunol. 2013;9(1):30. doi:10.1186/1710-1492-9-30 (tabela 3).","DermNet NZ. Topical corticosteroids (potência e unidade de ponta de dedo). https://dermnetnz.org/topics/topical-steroid (consultado em out. 2026).","AEMPS (Espanha). Ficha técnica de etoricoxib, CIMA (posologia na artrite gotosa aguda; conferida por resumo de busca, out. 2026).","Comitê Estadual de Saúde do Rio de Janeiro (TRF2). Parecer técnico nº 0074/2026: adrenalina autoinjetável sem registro na Anvisa (conferido por resumo de busca)."]},{"id":"m07","num":7,"titulo":"Sistema respiratório","escopo":"Fisiopatologia de asma, DPOC e rinite; broncodilatadores, corticoides inalatórios e associações; tratamento atual da asma (AIR e MART) e da DPOC (grupos ABE); dispositivos e técnica inalatória; antileucotrienos, cromonas e imunobiológicos; rinite alérgica e tosse. Fontes principais: GINA 2026, GOLD 2026, PCDT da Asma (Portaria Conjunta nº 43/2026) e PCDT da DPOC (Portaria Conjunta nº 29/2025), alertas FDA e EMA.","cor":"#0AA5C2","icone":"lungs","curto":"Sistema respiratório","topicos":[{"id":"m07-fisiopatologia","titulo":"Asma, DPOC e rinite: bases fisiopatológicas","resumo":"\u003cp>Asma, doença pulmonar obstrutiva crônica (DPOC) e rinite alérgica são as doenças respiratórias crônicas que mais geram movimento no balcão: compra de bombinhas, pedidos de \"remédio para chiado\", descongestionantes e xaropes. Entender o que acontece na via aérea ajuda a explicar por que cada medicamento existe e por que trocar um pelo outro dá errado.\u003c/p> \u003ch3>A via aérea em poucas linhas\u003c/h3> \u003cp>O ar entra pelo nariz (que filtra, aquece e umidifica), passa pela laringe, traqueia e brônquios, que se dividem até os bronquíolos e alvéolos, onde acontece a troca gasosa. Os brônquios têm músculo liso na parede, controlado pelo sistema nervoso autônomo:\u003c/p> \u003cul> \u003cli>\u003cb>receptores beta-2 adrenérgicos\u003c/b>: quando estimulados, relaxam o músculo e abrem o brônquio (alvo do salbutamol e do formoterol);\u003c/li> \u003cli>\u003cb>receptores muscarínicos M3\u003c/b>: quando estimulados pela acetilcolina (via nervo vago), contraem o músculo e aumentam o muco (alvo dos antimuscarínicos, como ipratrópio e tiotrópio).\u003c/li> \u003c/ul> \u003cp>Doenças obstrutivas reduzem o calibre dos brônquios por três mecanismos que se somam: contração do músculo liso, inflamação com edema da parede e excesso de muco. A espirometria mede essa obstrução pela relação entre o volume expirado no primeiro segundo (VEF1) e a capacidade vital forçada (CVF).\u003c/p> \u003ch3>Asma\u003c/h3> \u003cp>Asma é uma doença inflamatória crônica das vias aéreas com \u003cstrong>hiper-responsividade\u003c/strong> (o brônquio se fecha com estímulos que não afetariam outra pessoa) e \u003cstrong>obstrução variável e reversível\u003c/strong>. Na maioria dos pacientes, a inflamação é do tipo 2: participam eosinófilos, mastócitos, linfócitos Th2, anticorpos IgE e interleucinas 4, 5 e 13. Por isso o corticoide inalatório, que reduz essa inflamação, é a base do tratamento.\u003c/p> \u003cul> \u003cli>\u003cb>Sintomas\u003c/b>: chiado, falta de ar, aperto no peito e tosse, que variam ao longo do tempo e de intensidade, pioram à noite ou de madrugada e são desencadeados por gatilhos.\u003c/li> \u003cli>\u003cb>Gatilhos\u003c/b>: infecções virais, poeira e ácaros, pelos de animais, mofo, fumaça de cigarro, poluição, exercício, ar frio, riso ou choro, AINE e betabloqueador em pacientes sensíveis.\u003c/li> \u003cli>\u003cb>Exacerbação (crise)\u003c/b>: piora aguda e progressiva que exige mudança no tratamento. É a principal causa de morte por asma, que quase sempre é evitável.\u003c/li> \u003c/ul> \u003cp>Começa geralmente na infância, mas pode surgir em qualquer idade. Muitos pacientes se sentem bem entre as crises, deixam o tratamento de manutenção e passam a usar só a \"bombinha de alívio\": esse comportamento é o principal alvo da orientação farmacêutica.\u003c/p> \u003ch3>DPOC\u003c/h3> \u003cp>DPOC é uma doença crônica causada principalmente pela exposição a partículas e gases nocivos: tabagismo, fumaça de fogão a lenha ou de queima de biomassa, poeiras e fumos ocupacionais. A inflamação é dominada por neutrófilos e macrófagos e leva a duas alterações:\u003c/p> \u003cul> \u003cli>\u003cb>bronquite crônica e doença de pequenas vias aéreas\u003c/b>: parede espessada, muco em excesso, tosse com catarro;\u003c/li> \u003cli>\u003cb>enfisema\u003c/b>: destruição das paredes dos alvéolos, com perda da retração elástica e aprisionamento de ar.\u003c/li> \u003c/ul> \u003cp>A obstrução é \u003cstrong>persistente\u003c/strong> (relação VEF1/CVF menor que 0,7 após broncodilatador, pelo GOLD) e progride lentamente. Os sintomas típicos são falta de ar aos esforços, que piora com os anos, tosse crônica e expectoração. As exacerbações (piora aguda, geralmente por infecção respiratória ou poluição) aceleram a perda de função e aumentam a mortalidade, inclusive por eventos cardiovasculares. Parar de fumar é a única medida que muda a história natural da doença.\u003c/p> \u003ch3>Rinite alérgica\u003c/h3> \u003cp>Rinite alérgica é a inflamação da mucosa nasal mediada por IgE após contato com alérgenos (ácaros, fungos, pólen, pelos). A fase imediata, em minutos, depende de histamina: espirros em salva, coriza aquosa, coceira no nariz, olhos e palato. A fase tardia, horas depois, depende de leucotrienos e de células inflamatórias: obstrução nasal persistente. Asma e rinite andam juntas: grande parte dos asmáticos tem rinite, e rinite não tratada piora o controle da asma.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Característica\u003c/th>\u003cth>Asma\u003c/th>\u003cth>DPOC\u003c/th>\u003cth>Rinite alérgica\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Início\u003c/td>\u003ctd>Qualquer idade, frequentemente infância\u003c/td>\u003ctd>Geralmente após 40 anos\u003c/td>\u003ctd>Infância e adolescência\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Causa principal\u003c/td>\u003ctd>Predisposição e inflamação tipo 2\u003c/td>\u003ctd>Tabaco e biomassa\u003c/td>\u003ctd>Sensibilização a alérgenos\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Sintomas\u003c/td>\u003ctd>Variáveis, com períodos sem sintomas\u003c/td>\u003ctd>Persistentes e progressivos\u003c/td>\u003ctd>Espirros, coriza, prurido, obstrução\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Obstrução\u003c/td>\u003ctd>Variável e reversível\u003c/td>\u003ctd>Persistente\u003c/td>\u003ctd>Nasal\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Base do tratamento\u003c/td>\u003ctd>Corticoide inalatório\u003c/td>\u003ctd>Broncodilatador de longa ação e cessação do tabagismo\u003c/td>\u003ctd>Corticoide nasal e anti-H1\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Na asma, o problema central é a inflamação, e o tratamento começa pelo anti-inflamatório (corticoide inalatório). Na DPOC, o problema central é a obstrução fixa com sintomas, e o tratamento começa pelos broncodilatadores de longa ação. Confundir os dois é a origem de muitos erros de prescrição e de orientação.\u003c/p>\u003c/div>  \u003ch3>Como se mede a obstrução\u003c/h3> \u003cp>A \u003cstrong>espirometria\u003c/strong> é o exame que confirma asma e DPOC. Mede o VEF1 e a CVF antes e depois de um broncodilatador. Na asma, a obstrução melhora de forma significativa após o broncodilatador ou varia ao longo do tempo; na DPOC, a relação VEF1/CVF continua abaixo de 0,7 mesmo após o broncodilatador. O \u003cstrong>pico de fluxo expiratório\u003c/strong> (PFE), medido com um aparelho portátil e barato, ajuda o asmático a acompanhar a doença em casa e a reconhecer uma crise no início; não substitui a espirometria para diagnóstico.\u003c/p> \u003ch3>Situações que confundem\u003c/h3> \u003cp>Algumas pessoas têm características de asma e de DPOC ao mesmo tempo (por exemplo, asmático que fumou por décadas). Nesses casos, o corticoide inalatório não deve ser retirado, porque a parte asmática exige anti-inflamatório. Outras causas de falta de ar e chiado que o balcão pode confundir com asma ou DPOC: insuficiência cardíaca (piora deitado, inchaço nas pernas), anafilaxia, corpo estranho em criança, crise de ansiedade, anemia e embolia pulmonar. Por isso, falta de ar nova, sem diagnóstico, nunca é tratada com bombinha emprestada.\u003c/p>  \u003ch3>Tabagismo e outras exposições\u003c/h3> \u003cp>O tabaco piora a asma, reduz a resposta ao corticoide inalatório e é a principal causa de DPOC. Fumo passivo na infância aumenta crises de asma e infecções respiratórias. Cigarro eletrônico também irrita a via aérea e mantém a dependência de nicotina; a Anvisa mantém proibida a comercialização desses dispositivos no Brasil (decisão de 2024). Em áreas rurais, a fumaça de fogão a lenha é causa importante de DPOC em mulheres que nunca fumaram.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao atender alguém com queixa respiratória, pergunte: idade, se fuma ou fumou, há quanto tempo tem os sintomas, se são contínuos ou em crises, o que piora, se acorda à noite com falta de ar, quantas vezes usou a bombinha de alívio na última semana e se já foi a pronto-socorro por isso. Essas respostas orientam se é caso de orientação, ajuste com o médico ou urgência.\u003c/p>\u003c/div>"},{"id":"m07-broncodilatadores","titulo":"Broncodilatadores","resumo":"\u003cp>Broncodilatadores relaxam o músculo liso brônquico e aliviam a falta de ar. Existem três grupos: agonistas beta-2 adrenérgicos, antimuscarínicos e metilxantinas. Os dois primeiros são usados por via inalatória, que entrega o fármaco direto no brônquio, com efeito rápido e menos efeitos sistêmicos.\u003c/p> \u003ch3>Agonistas beta-2 de curta ação (SABA)\u003c/h3> \u003cp>\u003cstrong>Salbutamol\u003c/strong> (Aerolin®) e \u003cstrong>fenoterol\u003c/strong> (Berotec®) começam a agir em 3 a 5 minutos e duram 4 a 6 horas. São os broncodilatadores de alívio clássicos e estão disponíveis no SUS (PCDT da Asma, 2026). O salbutamol aerossol de 100 mcg por jato e a solução para nebulização de 5 mg/mL estão no Programa Farmácia Popular (PCDT da Asma, 2026). Na crise leve a moderada, o PCDT da Asma (2026) prevê salbutamol de 4 a 10 jatos (100 mcg cada) a cada 20 minutos na primeira hora, preferencialmente com espaçador, e depois conforme a resposta.\u003c/p> \u003cp>A GINA 2026 orienta \u003cstrong>agitar o aerossol de salbutamol antes de cada jato\u003c/strong> e, na crise, disparar um jato por vez no espaçador, porque o frasco não agitado pode liberar doses irregulares.\u003c/p> \u003ch3>Agonistas beta-2 de longa ação (LABA)\u003c/h3> \u003cul> \u003cli>\u003cb>Formoterol\u003c/b>: início rápido (poucos minutos, semelhante ao salbutamol) e duração de 12 horas. É o único LABA que pode ser usado como alívio, sempre associado a corticoide inalatório (budesonida-formoterol).\u003c/li> \u003cli>\u003cb>Salmeterol\u003c/b>: início lento (10 a 20 minutos), duração de 12 horas; usado em associação com fluticasona.\u003c/li> \u003cli>\u003cb>Vilanterol, indacaterol e olodaterol\u003c/b>: duração de 24 horas, uma tomada ao dia; usados em associações para asma (vilanterol com fluticasona) e DPOC.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>LABA nunca deve ser usado sozinho na asma: sem corticoide inalatório, aumenta o risco de crise grave e morte. Na asma, o LABA vem sempre no mesmo dispositivo que o corticoide ou junto com ele. Na DPOC, LABA isolado ou com LAMA é permitido.\u003c/p>\u003c/div> \u003ch3>Antimuscarínicos de curta ação (SAMA)\u003c/h3> \u003cp>O \u003cstrong>brometo de ipratrópio\u003c/strong> (Atrovent®) bloqueia receptores muscarínicos, começa a agir em 15 a 30 minutos e dura 6 a 8 horas. É usado na DPOC como alívio e, na crise de asma grave, em associação com SABA no serviço de saúde. Apresentações: aerossol de 20 mcg por jato e solução para nebulização de 0,25 mg/mL, as duas previstas no PCDT da DPOC (2025). A associação de fenoterol com ipratrópio em aerossol (Duovent®) também está no mercado (lista de preços CMED, out. 2026).\u003c/p> \u003ch3>Antimuscarínicos de longa ação (LAMA)\u003c/h3> \u003cul> \u003cli>\u003cb>Tiotrópio\u003c/b>: 24 horas; no inalador de névoa suave (Respimat), 2 jatos de 2,5 mcg uma vez ao dia.\u003c/li> \u003cli>\u003cb>Glicopirrônio\u003c/b>: 24 horas; inalador de cápsula.\u003c/li> \u003cli>\u003cb>Umeclidínio\u003c/b>: 24 horas; inalador Ellipta, em associação com vilanterol (62,5 mcg + 25 mcg) ou na terapia tripla.\u003c/li> \u003c/ul> \u003cp>Os LAMA são a base do tratamento da DPOC, quase sempre associados a um LABA. Na asma, o tiotrópio é opção de etapa 5 em adultos, mas não foi incorporado ao SUS para asma (Conitec, PCDT 2026).\u003c/p> \u003ch3>Efeitos adversos dos broncodilatadores inalatórios\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Efeitos mais comuns\u003c/th>\u003cth>Cuidado\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Beta-2 agonistas\u003c/td>\u003ctd>Tremor de mãos, taquicardia, palpitação, cãibras, hipocalemia em doses altas\u003c/td>\u003ctd>Arritmia e doença coronariana; uso excessivo é sinal de asma descontrolada\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Antimuscarínicos\u003c/td>\u003ctd>Boca seca, gosto metálico, tosse, retenção urinária, constipação\u003c/td>\u003ctd>Glaucoma de ângulo fechado (névoa ou pó no olho); hiperplasia prostática\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Teofilina\u003c/td>\u003ctd>Náusea, vômito, insônia, taquicardia, arritmia, convulsão\u003c/td>\u003ctd>Índice terapêutico estreito e muitas interações\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Teofilina e aminofilina\u003c/h3> \u003cp>As metilxantinas (teofilina oral, aminofilina) inibem fosfodiesterases e antagonizam a adenosina. O efeito broncodilatador é fraco e o índice terapêutico é \u003cstrong>estreito\u003c/strong>: a dose eficaz fica perto da dose tóxica (faixa terapêutica clássica de 10 a 20 mg/L; muitos serviços buscam 5 a 15 mg/L para reduzir toxicidade). Por isso perderam espaço para os inalatórios e não estão entre as opções preferidas da GINA e do GOLD. Ainda aparecem em receitas de idosos e em regiões com acesso restrito.\u003c/p> \u003cp>Interações que \u003cb>aumentam\u003c/b> o nível (risco de intoxicação): ciprofloxacino, claritromicina e eritromicina, fluvoxamina, cimetidina, alopurinol em dose alta, insuficiência cardíaca, doença hepática, febre prolongada e \u003cb>parar de fumar\u003c/b> (o tabaco induz o CYP1A2; ao parar, o nível sobe). Interações que \u003cb>reduzem\u003c/b> o nível: tabagismo, carbamazepina, fenitoína, rifampicina. Sinais de intoxicação: náusea e vômitos persistentes, agitação, taquicardia, arritmia e convulsão.\u003c/p>  \u003ch3>Broncoespasmo induzido por exercício\u003c/h3> \u003cp>Muitos asmáticos têm chiado ou tosse durante ou logo após atividade física. Com a asma bem controlada pelo corticoide inalatório, o sintoma costuma diminuir. Para prevenção, o prescritor pode orientar o medicamento de alívio alguns minutos antes do exercício: budesonida-formoterol em dose baixa no regime 1 ou SABA no regime 2, além de aquecimento prévio (PCDT da Asma, 2026). Precisar do alívio antes de todo exercício por muito tempo sugere asma não controlada.\u003c/p> \u003ch3>Aerossol com espaçador ou nebulização\u003c/h3> \u003cp>Na crise leve a moderada, o aerossol com espaçador é tão eficaz quanto a nebulização, mais rápido, mais barato e com menos efeitos como taquicardia; o PCDT da Asma (2026) indica o pMDI com espaçador como via preferencial. A nebulização fica para crises graves no serviço de saúde, para quem não consegue usar o espaçador e para alguns pacientes com DPOC. Nebulizar apenas soro fisiológico não trata broncoespasmo.\u003c/p> \u003ch3>Situações especiais\u003c/h3> \u003cp>Na gestação, SABA e LABA são considerados seguros, segundo o PCDT da Asma (2026); asma descontrolada é que traz risco ao feto. Betabloqueadores não seletivos (propranolol, timolol em colírio) antagonizam os beta-2 agonistas e podem precipitar broncoespasmo. Doses altas de beta-2 agonista somadas a diuréticos ou corticoide sistêmico aumentam o risco de hipocalemia, relevante em cardiopatas.\u003c/p>  \u003ch3>Pedido de bombinha sem receita\u003c/h3> \u003cp>Os broncodilatadores inalatórios são de venda sob prescrição médica (tarja vermelha na lista de preços da CMED publicada em 09/10/2026; conferir a embalagem de cada produto). Diante de alguém em crise sem receita, a prioridade é avaliar a gravidade (fluxo do balcão no material de apoio) e garantir atendimento. Diante de alguém que compra \"a de sempre\" todo mês sem acompanhamento, o caminho é registrar, conversar sobre controle da asma e encaminhar, porque o padrão de compra é o sinal mais visível de risco que a farmácia enxerga.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Quem compra salbutamol ou fenoterol com frequência deve ser perguntado sobre o tratamento de manutenção. Pelo PCDT da Asma (2026), usar mais de 3 frascos de 200 doses por ano corresponde a uso médio maior que diário, aumenta o risco de crise grave e indica reavaliação médica. Em usuário de teofilina, conferir antibiótico novo (ciprofloxacino, claritromicina) e mudança no hábito de fumar.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhor de 68 anos, com DPOC, usa teofilina de liberação prolongada e chega com náusea, vômitos e palpitação três dias depois de começar ciprofloxacino para infecção urinária. O farmacêutico reconhece a interação (inibição do CYP1A2), orienta procurar atendimento no mesmo dia e informa o médico por escrito sobre a suspeita de intoxicação por teofilina.\u003c/p>\u003c/div>"},{"id":"m07-corticoides-inalatorios","titulo":"Corticosteroides inalatórios e associações","resumo":"\u003cp>O corticoide inalatório (CI) reduz a inflamação brônquica, diminui a hiper-responsividade, previne crises e reduz a mortalidade por asma. Age na mesma via dos corticoides sistêmicos (módulo 6), mas a dose é medida em microgramas e chega direto ao alvo, com efeito sistêmico pequeno. O efeito sobre os sintomas aparece em dias e o efeito máximo em semanas; por isso o paciente precisa entender que o CI \"não alivia na hora\" e que deve ser usado mesmo sem sintomas, conforme a prescrição.\u003c/p> \u003ch3>Fármacos\u003c/h3> \u003cul> \u003cli>\u003cb>Beclometasona\u003c/b> (dipropionato): aerossol e cápsulas; no SUS em cápsula ou pó de 200 e 400 mcg e em aerossol de 50 e 250 mcg por jato; as concentrações de 50, 200 e 250 mcg estão no Farmácia Popular (PCDT da Asma, 2026).\u003c/li> \u003cli>\u003cb>Budesonida\u003c/b>: cápsulas, pó (Turbuhaler) e aerossol; também em suspensão para nebulização e em associação com formoterol.\u003c/li> \u003cli>\u003cb>Fluticasona\u003c/b>: propionato (duas vezes ao dia, com salmeterol) e furoato (uma vez ao dia, com vilanterol, no dispositivo Ellipta).\u003c/li> \u003cli>\u003cb>Ciclesonida\u003c/b>: pró-fármaco ativado no pulmão, com menor efeito na orofaringe; no Brasil, a lista de preços da CMED (out. 2026) traz apenas a forma nasal.\u003c/li> \u003cli>\u003cb>Mometasona\u003c/b>: inalatória e, mais usada no Brasil, nasal.\u003c/li> \u003c/ul> \u003ch3>Doses baixas, médias e altas\u003c/h3> \u003cp>As doses de CI são classificadas em baixa, média e alta. A maior parte do benefício vem da dose baixa; doses altas aumentam efeitos adversos e ficam para uma minoria (PCDT da Asma, 2026).\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Corticoide (12 anos ou mais)\u003c/th>\u003cth>Baixa (mcg/dia)\u003c/th>\u003cth>Média (mcg/dia)\u003c/th>\u003cth>Alta (mcg/dia)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Beclometasona (aerossol, partícula padrão)\u003c/td>\u003ctd>200 a 500\u003c/td>\u003ctd>mais de 500 a 1.000\u003c/td>\u003ctd>mais de 1.000\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Budesonida (pó ou aerossol)\u003c/td>\u003ctd>200 a 400\u003c/td>\u003ctd>mais de 400 a 800\u003c/td>\u003ctd>mais de 800\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fluticasona, propionato\u003c/td>\u003ctd>100 a 250\u003c/td>\u003ctd>mais de 250 a 500\u003c/td>\u003ctd>mais de 500\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fluticasona, furoato\u003c/td>\u003ctd>100\u003c/td>\u003ctd>sem faixa intermediária\u003c/td>\u003ctd>200\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Beclometasona e budesonida conforme o Quadro 10 do PCDT da Asma (2026), adaptado da GINA 2025; fluticasona conforme a Tabela 6 do guia resumido da GINA 2026, que mantém as mesmas faixas para beclometasona e budesonida. Para crianças de 6 a 11 anos, as faixas são menores (por exemplo, budesonida baixa de 100 a 200 mcg/dia).\u003c/p> \u003ch3>Efeitos adversos locais e o enxágue\u003c/h3> \u003cp>Parte da dose fica na boca e na garganta. Os efeitos locais mais comuns são \u003cstrong>candidíase oral\u003c/strong> (placas brancas removíveis, ardor), disfonia (rouquidão por miopatia das cordas vocais) e tosse irritativa. Prevenção:\u003c/p> \u003cul> \u003cli>enxaguar a boca com água, gargarejar e \u003cb>cuspir\u003c/b> após cada uso;\u003c/li> \u003cli>usar espaçador com o aerossol, que retém as partículas grandes que se depositariam na orofaringe;\u003c/li> \u003cli>usar a menor dose eficaz.\u003c/li> \u003c/ul> \u003cp>Efeitos sistêmicos aparecem com doses altas por muito tempo: equimoses, catarata, glaucoma, perda óssea, supressão do eixo adrenal e pequena redução da velocidade de crescimento em crianças (cerca de 1 cm, geralmente no primeiro ano). Na DPOC, o CI aumenta o risco de pneumonia, motivo pelo qual só é indicado em grupos específicos (contagem de eosinófilos). Inibidores potentes do CYP3A4, como ritonavir e cobicistate, elevam muito o nível de fluticasona e budesonida e podem causar síndrome de Cushing; nesses pacientes, o prescritor costuma preferir beclometasona.\u003c/p> \u003ch3>Associações em um só dispositivo\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Associação\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Uso principal\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Budesonida + formoterol\u003c/td>\u003ctd>CI-LABA\u003c/td>\u003ctd>Asma: manutenção e alívio (MART) ou alívio anti-inflamatório (AIR); DPOC em casos selecionados\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Beclometasona + formoterol\u003c/td>\u003ctd>CI-LABA\u003c/td>\u003ctd>Asma; também possível como MART\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fluticasona (propionato) + salmeterol\u003c/td>\u003ctd>CI-LABA\u003c/td>\u003ctd>Asma, manutenção; não usar como alívio\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fluticasona (furoato) + vilanterol\u003c/td>\u003ctd>CI-LABA\u003c/td>\u003ctd>Asma, manutenção uma vez ao dia; não usar como alívio\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Umeclidínio + vilanterol; tiotrópio + olodaterol; indacaterol + glicopirrônio\u003c/td>\u003ctd>LAMA-LABA\u003c/td>\u003ctd>DPOC\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Fluticasona (furoato) + umeclidínio + vilanterol; beclometasona + formoterol + glicopirrônio; budesonida + formoterol + glicopirrônio\u003c/td>\u003ctd>Terapia tripla\u003c/td>\u003ctd>DPOC exacerbadora com critério de eosinófilos; asma grave\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Só associações que contêm formoterol podem ser usadas como alívio. O PCDT da Asma (2026) orienta não usar CI-salmeterol, CI-vilanterol ou CI-indacaterol como alívio e também não usar CI-formoterol como alívio em quem faz manutenção com outro LABA, por falta de evidência de segurança e eficácia.\u003c/p>\u003c/div>  \u003ch3>Adesão e medo do corticoide\u003c/h3> \u003cp>A principal causa de falha do corticoide inalatório é não usar. Pais têm medo de que a criança \"fique dependente\" ou pare de crescer, adultos param quando os sintomas melhoram e muitos confundem o CI com o corticoide oral. Explicações úteis no balcão: a dose inalatória é medida em microgramas, centenas de vezes menor que a dose oral; o CI controla a inflamação e reduz a necessidade de corticoide oral, que tem muito mais efeitos adversos; a pequena redução da velocidade de crescimento observada no início não compromete a altura final de forma relevante na maioria das crianças, e a asma descontrolada também prejudica o crescimento.\u003c/p> \u003ch3>Gestação e criança pequena\u003c/h3> \u003cp>O PCDT da Asma (2026) considera o corticoide inalatório seguro na gestação e não recomenda suspendê-lo; durante a amamentação, os medicamentos da asma podem ser mantidos. Em crianças de até 5 anos, a dose baixa diária de referência é beclometasona 100 mcg/dia em aerossol com espaçador e máscara, e o tratamento diário é indicado quando há sintomas mais de duas vezes por semana ou crise grave no último ano. A budesonida em suspensão para nebulização é alternativa em lactentes, conforme prescrição.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>A cada dispensação de corticoide inalatório, pergunte se a pessoa enxágua a boca e cospe depois do uso, se está usando todos os dias e quantas doses restam no contador. Rouquidão ou placas brancas na boca são motivo para rever técnica, uso de espaçador e enxágue, e para informar o prescritor.\u003c/p>\u003c/div>"},{"id":"m07-asma","titulo":"Tratamento da asma","resumo":"\u003cp>O tratamento da asma mudou muito desde 2019. A mensagem central, adotada pela GINA e pelo PCDT da Asma do Ministério da Saúde (Portaria Conjunta SAES/SCTIE nº 43, de 24 de março de 2026, que revogou o PCDT de 2023), é que \u003cstrong>todo asmático deve receber tratamento com corticoide inalatório\u003c/strong> e que tratar asma apenas com broncodilatador de alívio (SABA) não é recomendado, por aumentar o risco de crise grave e morte.\u003c/p> \u003ch3>Objetivos e princípios\u003c/h3> \u003cul> \u003cli>Controlar sintomas e, principalmente, \u003cb>prevenir exacerbações graves\u003c/b>, que s

ns de semana.\u003c/li>\n\u003cli>Usar a cama só para dormir e para atividade sexual; sair da cama se não adormecer em cerca de 20 minutos.\u003c/li>\n\u003cli>Evitar cafeína à tarde e à noite, álcool perto de deitar e refeições pesadas tarde.\u003c/li>\n\u003cli>Reduzir telas e luz forte antes de dormir; quarto escuro, silencioso e com temperatura agradável.\u003c/li>\n\u003cli>Atividade física regular, longe do horário de deitar.\u003c/li>\n\u003cli>Evitar cochilos longos durante o dia.\u003c/li>\n\u003c/ul>\n\u003cp>Insônia que dura mais de algumas semanas, ronco com pausas respiratórias, sonolência ao dirigir ou insônia associada a tristeza persistente exigem avaliação médica.\u003c/p>\n\u003ch3>Associação com álcool e opioides\u003c/h3>\n\u003cp>Álcool, benzodiazepínicos, drogas Z, barbitúricos, opioides, gabapentinoides, anti-histamínicos sedativos e antipsicóticos somam efeito depressor no sistema nervoso central e na respiração. A associação de opioide e benzodiazepínico tem alerta em caixa da FDA (2016) pelo aumento de mortes por overdose. O risco é maior em idosos, pessoas com apneia do sono, doença pulmonar e doença renal.\u003c/p>\n\u003ch3>Receituário\u003c/h3>\n\u003cp>Benzodiazepínicos (alprazolam, bromazepam, clonazepam, clobazam, cloxazolam, diazepam, flunitrazepam, lorazepam, midazolam, nitrazepam) e drogas Z estão na Lista B1 e exigem Notificação de Receita B (azul), com numeração fornecida pela vigilância sanitária. A notificação vale 30 dias a partir da emissão, somente na unidade federativa que concedeu a numeração, e cobre até 5 ampolas ou 60 dias de tratamento (Portaria 344/1998, arts. 45 e 46). Cada notificação traz uma só substância (art. 35, § 7º) e fica retida na farmácia.\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de dispensar hipnótico ou benzodiazepínico, pergunte sobre álcool, opioides, outros calmantes e se o paciente dirige ou opera máquinas. Oriente: não associar com bebida alcoólica, não dirigir se estiver sonolento, levantar à noite com luz acesa (idosos), não aumentar a dose e não parar de repente após uso prolongado. Para quem pede “algo para dormir” sem receita, investigue a causa (dor, ansiedade, cafeína, telas, horários irregulares, apneia), oriente higiene do sono e encaminhe insônia que dura mais de algumas semanas.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhor de 74 anos, em uso de clonazepam há 10 anos, caiu no banheiro de madrugada. Ele pede para aumentar a dose porque “o remédio não faz mais efeito”. O farmacêutico explica a tolerância, relaciona a queda ao sedativo, não orienta mudança de dose e contata o médico sugerindo plano de redução gradual, entregando ao paciente um registro de doses para levar à consulta.\u003c/p>\u003c/div>"},{"id":"m02-antiparkinsonianos","titulo":"Antiparkinsonianos","resumo":"\u003cp>A doença de Parkinson resulta da perda progressiva de neurônios dopaminérgicos da substância negra, com redução da dopamina no corpo estriado e predomínio relativo da acetilcolina. As manifestações motoras são bradicinesia (lentidão), rigidez, tremor de repouso e instabilidade postural; há também sintomas não motores, como constipação, depressão, alterações do sono e hipotensão ortostática. O tratamento repõe a dopamina, imita sua ação ou reduz sua degradação.\u003c/p>\n\u003ch3>Levodopa com inibidor da descarboxilase\u003c/h3>\n\u003cp>A dopamina não atravessa a barreira hematoencefálica; a levodopa, sua precursora, atravessa e é convertida em dopamina no cérebro. Sozinha, porém, seria transformada em dopamina na periferia, com náusea e hipotensão e pouca chegada ao cérebro. Por isso é sempre associada a um inibidor periférico da dopa-descarboxilase: \u003cstrong>carbidopa\u003c/strong> (Sinemet® e genéricos) ou benserazida (Prolopa®). É o fármaco mais eficaz para os sintomas motores.\u003c/p>\n\u003cul>\n\u003cli>Proteína da dieta: aminoácidos neutros da proteína competem com a levodopa pelo transporte no intestino e na barreira hematoencefálica. Em pacientes com flutuações, orienta-se tomar a levodopa cerca de 30 a 60 minutos antes das refeições e, se necessário, concentrar a proteína à noite, sem reduzir o total diário sem orientação nutricional.\u003c/li>\n\u003cli>Ferro oral reduz a absorção; separar as tomadas.\u003c/li>\n\u003cli>Efeitos: náusea, hipotensão ortostática, sonolência, alucinações e confusão (idosos), discinesias (movimentos involuntários no pico de dose).\u003c/li>\n\u003cli>Flutuações motoras com a progressão: \u003cem>wearing-off\u003c/em> (o efeito acaba antes da próxima dose) e fenômeno \u003cem>on-off\u003c/em> (alternância imprevisível). O médico ajusta horários, fraciona doses ou associa outros fármacos.\u003c/li>\n\u003cli>Apresentações especiais: liberação prolongada (HBS, não partir nem mastigar) e dispersível (dissolver em água, início mais rápido).\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>A suspensão abrupta da levodopa pode causar síndrome semelhante à síndrome neuroléptica maligna (febre, rigidez, confusão). Em internação ou jejum para exames, o paciente e o cuidador devem lembrar a equipe da medicação. Metoclopramida, bromoprida e antipsicóticos típicos pioram o Parkinson; a domperidona, que quase não entra no cérebro, é o antiemético preferido nessa população.\u003c/p>\u003c/div>\n\u003ch3>Agonistas dopaminérgicos\u003c/h3>\n\u003cp>Pramipexol e ropinirol (orais) e rotigotina (adesivo transdérmico) estimulam diretamente o receptor de dopamina. São usados no início da doença em pacientes mais jovens, em associação com levodopa e na síndrome das pernas inquietas, em doses menores.\u003c/p>\n\u003cul>\n\u003cli>Transtornos do controle de impulsos: jogo patológico, compras compulsivas, hipersexualidade, compulsão alimentar. Pacientes raramente contam espontaneamente; o cuidador muitas vezes percebe antes.\u003c/li>\n\u003cli>Sonolência excessiva e episódios de sono súbito, inclusive dirigindo.\u003c/li>\n\u003cli>Edema de membros inferiores, hipotensão, náusea, alucinações (mais em idosos).\u003c/li>\n\u003cli>Rotigotina: aplicar um adesivo por dia, alternando o local, em pele limpa e sem pelos; retirar antes de ressonância magnética e cardioversão, conforme a bula.\u003c/li>\n\u003c/ul>\n\u003ch3>Inibidores da MAO-B\u003c/h3>\n\u003cp>Rasagilina e selegilina inibem a monoaminoxidase B e reduzem a degradação da dopamina. Efeito sintomático modesto, usados no início ou como adjuvantes. Interações: são contraindicados ou exigem extremo cuidado com meperidina, tramadol, metadona, dextrometorfano e outros IMAO (risco de síndrome serotoninérgica); antidepressivos serotoninérgicos e simpaticomiméticos pedem avaliação médica. Em doses usuais, a restrição de tiramina é menos rigorosa que com IMAO não seletivos, mas o paciente deve evitar excessos.\u003c/p>\n\u003ch3>Amantadina\u003c/h3>\n\u003cp>Antagonista do receptor NMDA com efeito dopaminérgico leve. Reduz discinesias induzidas pela levodopa. Efeitos: livedo reticular (pele com aspecto rendado nas pernas), edema, alucinações, confusão, boca seca. Eliminação renal: ajuste pela TFG.\u003c/p>\n\u003ch3>Anticolinérgicos\u003c/h3>\n\u003cp>Biperideno e triexifenidil restabelecem o equilíbrio dopamina e acetilcolina e são úteis no tremor em pacientes mais jovens e nos efeitos extrapiramidais de antipsicóticos. Causam boca seca, constipação, retenção urinária, visão turva, piora de glaucoma de ângulo fechado e confusão. Os critérios de Beers recomendam evitá-los em idosos. Têm potencial de uso indevido pelo efeito euforizante.\u003c/p>\n\u003ch3>Inibidores da COMT\u003c/h3>\n\u003cp>A entacapona inibe a catecol-O-metiltransferase periférica, prolongando a meia-vida da levodopa e reduzindo o wearing-off. É tomada junto com cada dose de levodopa e existe em associação fixa (levodopa, carbidopa e entacapona). Pode aumentar discinesias, causar diarreia e deixar a urina castanho-alaranjada, sem significado clínico. A tolcapona, do mesmo grupo, exige monitorização hepática.\u003c/p>\n\u003ch3>Parkinsonismo induzido por medicamentos e pernas inquietas\u003c/h3>\n\u003cp>Nem todo tremor e lentidão em idoso é doença de Parkinson. Bloqueadores de receptores de dopamina causam parkinsonismo reversível: antipsicóticos, metoclopramida, bromoprida e os antivertiginosos \u003cstrong>flunarizina\u003c/strong> e cinarizina, muito usados no Brasil para tontura, às vezes por anos. Ácido valproico e lítio também podem causar tremor e parkinsonismo. Diante de um idoso com sintomas novos que usa um desses fármacos, o farmacêutico leva a hipótese ao médico: a retirada pode resolver o quadro em semanas a meses.\u003c/p>\n\u003cp>Na síndrome das pernas inquietas, agonistas dopaminérgicos em dose baixa à noite aliviam o desconforto, mas com o tempo podem causar aumento (augmentation): sintomas mais cedo no dia, mais intensos e em outras partes do corpo. A deficiência de ferro piora a síndrome, e a dosagem de ferritina faz parte da avaliação médica. Anti-histamínicos sedativos, antidepressivos serotoninérgicos e antieméticos antidopaminérgicos costumam piorar os sintomas.\u003c/p>\n\u003ch3>Sintomas não motores e medicamentos de balcão\u003c/h3>\n\u003cp>Constipação é muito frequente no Parkinson e piora com anticolinérgicos e opioides; o farmacêutico orienta líquidos, fibras e laxantes osmóticos quando indicados. Hipotensão ortostática piora com anti-hipertensivos, alfabloqueadores para próstata e tricíclicos. Antigripais com anti-histamínicos de primeira geração e descongestionantes podem causar confusão e retenção urinária no idoso. Depressão e ansiedade são comuns e tratadas com antidepressivos, o que exige atenção às interações com IMAO-B. Alucinações e psicose induzidas pelos dopaminérgicos não devem ser tratadas com haloperidol ou risperidona; o médico usa antipsicóticos com menor bloqueio D2, como quetiapina ou clozapina.\u003c/p>\n\u003ch3>Lista e receituário\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Lista (Portaria 344/1998)\u003c/th>\u003cth>Receituário\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Levodopa com carbidopa ou benserazida\u003c/td>\u003ctd>Não consta das listas\u003c/td>\u003ctd>Receita comum (venda sob prescrição)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Pramipexol, ropinirol, rotigotina\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Receita de Controle Especial em duas vias\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rasagilina, selegilina\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Receita de Controle Especial em duas vias\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Amantadina, entacapona, tolcapona\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Receita de Controle Especial em duas vias\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Biperideno\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Receita de Controle Especial em duas vias\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Triexifenidil\u003c/td>\u003ctd>B1\u003c/td>\u003ctd>Notificação de Receita B (azul)\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Para antiparkinsonianos da Lista C1, a Portaria 344/1998 admite quantidade de até 6 meses de tratamento por receita. O triexifenidil consta nominalmente da Lista B1 na atualização vigente (Atualização n. 101, RDC 1.036/2026), o que muda o receituário em relação ao biperideno.\u003c/p>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ajude o paciente a montar uma tabela de horários e respeite-a na dispensação: no Parkinson, atraso de dose piora os sintomas. Pergunte ao cuidador sobre alucinações, quedas, sonolência e mudanças de comportamento (jogo, compras). Desaconselhe metoclopramida e bromoprida e consulte o médico antes de dispensar antieméticos, descongestionantes ou xaropes para tosse a quem usa rasagilina ou selegilina.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>A esposa de um paciente de 66 anos em uso de pramipexol conta que ele passou a gastar o salário em apostas online, algo que nunca fez. O farmacêutico explica que o comportamento pode ser efeito do medicamento, orienta não suspender por conta própria e contatar o neurologista com urgência.\u003c/p>\u003c/div>"},{"id":"m02-opioides","titulo":"Analgésicos opioides","resumo":"\u003cp>Opioides são os analgésicos mais eficazes para dor aguda intensa e para dor oncológica, mas carregam riscos sérios: depressão respiratória, dependência, constipação e interações. No balcão, o farmacêutico confere o receituário correto, orienta o uso seguro, previne a constipação e reconhece sinais de intoxicação.\u003c/p>\n\u003ch3>Receptores opioides\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Receptor\u003c/th>\u003cth>Efeitos principais\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Mu (MOP)\u003c/td>\u003ctd>Analgesia, euforia, depressão respiratória, miose, constipação, náusea, prurido, dependência física\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Kappa (KOP)\u003c/td>\u003ctd>Analgesia espinhal, sedação, disforia, diurese\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Delta (DOP)\u003c/td>\u003ctd>Analgesia, modulação do humor\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Pela ação no receptor mu, os opioides se dividem em agonistas plenos (morfina, oxicodona, metadona, fentanil e, com eficácia menor, codeína), agonista parcial (buprenorfina), agonista-antagonista (nalbufina) e antagonistas (naloxona, naltrexona). O tramadol é agonista mu fraco (principalmente pelo metabólito O-desmetiltramadol) e inibe a recaptação de serotonina e noradrenalina.\u003c/p>\n\u003ch3>Fármacos de uso comum\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Morfina\u003c/strong>: referência para comparação. Metabólitos renais (morfina-6-glicuronídeo, ativo, e morfina-3-glicuronídeo, neuroexcitatório) acumulam na doença renal: sedação, mioclonias, confusão.\u003c/li>\n\u003cli>Codeína: pró-fármaco convertido em morfina pela CYP2D6; analgesia moderada, muito usada em associação com paracetamol; também antitussígena.\u003c/li>\n\u003cli>Tramadol: dor moderada. Riscos próprios: convulsões (dose alta, associação com bupropiona e outros fármacos que reduzem o limiar), síndrome serotoninérgica com antidepressivos, hipoglicemia e hiponatremia.\u003c/li>\n\u003cli>Oxicodona: agonista pleno potente; o comprimido de liberação controlada deve ser engolido inteiro.\u003c/li>\n\u003cli>Metadona: meia-vida longa e muito variável, acúmulo nos primeiros dias, prolongamento do QT, muitas interações (CYP3A4 e CYP2B6). A titulação e a conversão de outros opioides para metadona são complexas e feitas só por especialista.\u003c/li>\n\u003cli>Fentanil transdérmico: adesivo trocado a cada 72 horas, para dor crônica estável em pacientes já tolerantes a opioides; não serve para dor aguda nem para quem nunca usou opioide. Calor (febre, bolsa térmica, sauna, banho muito quente) aumenta a absorção e pode causar overdose.\u003c/li>\n\u003cli>Buprenorfina: agonista parcial de alta afinidade, com efeito teto na depressão respiratória; no Brasil, usada em adesivo transdérmico para dor crônica. Pode precipitar abstinência em quem usa agonista pleno, e a reversão com naloxona exige doses maiores.\u003c/li>\n\u003cli>Tapentadol: agonista mu e inibidor da recaptação de noradrenalina.\u003c/li>\n\u003c/ul>\n\u003ch3>Equivalência analgésica aproximada\u003c/h3>\n\u003cp>Para estimar a carga total de opioide, usa-se a dose diária em equivalentes de morfina oral (MME). Fatores da tabela da diretriz do CDC (Dowell et al., 2022): codeína 0,15; tramadol 0,2; tapentadol 0,4; morfina 1; oxicodona 1,5; hidromorfona 5; metadona 4,7; fentanil transdérmico 2,4 (aplicado à dose em mcg/h). Assim, oxicodona 20 mg/dia corresponde a cerca de 30 MME, e um adesivo de fentanil de 12 mcg/h, a cerca de 30 MME. A própria diretriz alerta: os fatores são estimativas, não servem para converter um opioide em outro (a troca começa com dose bem menor, pela tolerância cruzada incompleta) e não se aplicam à buprenorfina. A morfina oral equivale a cerca de um terço da potência da parenteral.\u003c/p>\n\u003ch3>Efeitos adversos e como preveni-los\u003c/h3>\n\u003cul>\n\u003cli>Constipação: acontece em quase todos e não diminui com o tempo (não há tolerância). Todo paciente em uso regular de opioide deve receber laxante profilático, de preferência estimulante (bisacodil, senosídeos) associado ou não a osmótico (macrogol, lactulose), além de líquidos. Fibras isoladas, sem água suficiente, podem piorar.\u003c/li>\n\u003cli>Náusea e vômitos: comuns no início, com tolerância em dias.\u003c/li>\n\u003cli>Sedação e prejuízo psicomotor: maiores no início e nos aumentos de dose. Não dirigir nesse período.\u003c/li>\n\u003cli>Depressão respiratória: o efeito mais grave. Risco maior no início do tratamento, em aumentos de dose, em idosos, com apneia do sono, doença pulmonar, doença renal e com associação a benzodiazepínicos, álcool e gabapentinoides.\u003c/li>\n\u003cli>Prurido, retenção urinária, miose, hipotensão.\u003c/li>\n\u003cli>Uso prolongado: tolerância, dependência física, hiperalgesia induzida por opioide, hipogonadismo.\u003c/li>\n\u003c/ul>\n\u003ch3>Intoxicação e naloxona\u003c/h3>\n\u003cp>Sinais de overdose: sonolência profunda ou inconsciência, respiração lenta ou ausente, pupilas puntiformes, lábios arroxeados, ronco anormal. A conduta é chamar o SAMU (192), manter a via aérea e ventilar. A naloxona, antagonista competitivo, reverte o quadro em minutos, mas tem duração mais curta que muitos opioides (metadona, formas de liberação prolongada, fentanil adesivo), e o paciente pode voltar a dormir: precisa de observação em serviço de saúde. No Brasil, as apresentações registradas de uso corrente são injetáveis (0,4 mg/mL), e a naloxona consta da Lista C1.\u003c/p>\n\u003ch3>Metabolizadores da CYP2D6\u003c/h3>\n\u003cp>Codeína e tramadol dependem da CYP2D6 para gerar o metabólito mais ativo. Metabolizadores lentos (cerca de 5 a 10% de pessoas de ascendência europeia) têm pouca analgesia. Metabolizadores ultrarrápidos produzem morfina em excesso e podem ter intoxicação grave com dose usual; há mortes descritas em crianças após amigdalectomia e em lactentes amamentados por mães ultrarrápidas. Por isso a FDA contraindicou codeína e tramadol em menores de 12 anos, e em menores de 18 anos após amigdalectomia ou adenoidectomia, e desaconselhou o uso na amamentação (FDA, 2017). Inibidores da CYP2D6 (fluoxetina, paroxetina, bupropiona) imitam o metabolizador lento.\u003c/p>\n\u003ch3>Uso racional e armazenamento\u003c/h3>\n\u003cp>Na dor aguda (pós-operatório, fraturas, extrações), o opioide deve ser usado na menor dose eficaz e pelo menor tempo, em geral poucos dias, associado a analgésicos não opioides (paracetamol, dipirona, AINE quando não contraindicados), que reduzem a dose necessária. Na dor oncológica e em cuidados paliativos, o objetivo é controle contínuo, com doses regulares em horário fixo e doses de resgate. Opioides em uso prolongado não devem ser suspensos de repente: a redução é gradual, planejada pelo prescritor, para evitar abstinência (bocejos, lacrimejamento, coriza, pupilas dilatadas, arrepios, diarreia, cólicas, ansiedade, insônia).\u003c/p>\n\u003cp>Comprimidos e adesivos guardados em casa são a principal fonte de uso indevido por familiares e de intoxicação acidental em crianças. Oriente guardar em local trancado ou fora do alcance e descartar sobras em pontos de coleta de medicamentos.\u003c/p>\n\u003ch3>Listas e receituário\u003c/h3>\n\u003cp>A regra geral: substâncias das Listas A1 e A2 exigem Notificação de Receita A (amarela), com numeração fornecida pela vigilância sanitária, validade de 30 dias em todo o território nacional (para compra em outra UF, acompanhada da receita com justificativa) e quantidade de até 5 ampolas ou 30 dias de tratamento (Portaria 344/1998, arts. 41 e 43). Os adendos das listas, porém, deslocam várias apresentações para a Receita de Controle Especial em duas vias.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Lista\u003c/th>\u003cth>Receituário (Atualização n. 101, RDC 1.036/2026)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Morfina, metadona, fentanil, tapentadol, hidromorfona\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>Notificação de Receita A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Oxicodona\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>Notificação A; comprimidos de liberação controlada com até 40 mg por unidade: Receita de Controle Especial (adendo 5)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Buprenorfina\u003c/td>\u003ctd>A1\u003c/td>\u003ctd>Notificação A; adesivo transdérmico em matriz: Receita de Controle Especial (adendo 8)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Codeína\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>Até 100 mg por unidade e concentração até 2,5% nas formas indivisíveis: Receita de Controle Especial (adendo 2); acima disso, Notificação A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tramadol\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>Até 100 mg por unidade: Receita de Controle Especial (adendo 3); acima disso, Notificação A\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nalbufina\u003c/td>\u003ctd>A2\u003c/td>\u003ctd>Até 10 mg por unidade: Receita de Controle Especial (adendo 5)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Naloxona, naltrexona\u003c/td>\u003ctd>C1\u003c/td>\u003ctd>Receita de Controle Especial\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>Adendo 3 da Lista A2: “preparações à base de tramadol, inclusive as misturadas a um ou mais componentes, em que a quantidade não exceda 100 miligramas de tramadol por unidade posológica ficam sujeitas a prescrição da Receita de Controle Especial, em 2 (duas) vias” (Portaria 344/1998, Anexo I, Atualização n. 101).\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Confira lista, adendo e tipo de receituário antes de separar o produto. Na entrega, oriente: tomar só a dose prescrita, nunca associar com álcool ou calmantes sem orientação, iniciar o laxante junto com o opioide, guardar fora do alcance de crianças, não dividir com outras pessoas e devolver sobras em ponto de coleta. Para o adesivo de fentanil: não cortar, evitar calor sobre o local, trocar no dia certo e descartar dobrado ao meio com as faces adesivas para dentro. Ensine o familiar a reconhecer sonolência excessiva e respiração lenta e a chamar o SAMU (192).\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 38 anos, amamentando um bebê de 1 mês, apresenta receita de paracetamol com codeína após cesariana. O farmacêutico informa a recomendação contrária ao uso na amamentação, orienta observar no bebê sonolência excessiva, dificuldade para mamar e respiração lenta, e contata o médico para discutir alternativa analgésica compatível.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m02-mapa-humor-psicose","titulo":"Antidepressivos e antipsicóticos","centro":"Humor e psicose","ramos":[{"t":"ISRS e IRSN","itens":["Efeito em 2 a 4 semanas; pleno em 4 a 8","Náusea, insônia, disfunção sexual","Sangram com AINE; hiponatremia no idoso","Venlafaxina eleva PA; citalopram prolonga QT"]},{"t":"Tricíclicos e IMAO","itens":["Tricíclico: anticolinérgico, ortostase, letal em excesso","IMAO + tiramina: crise hipertensiva","IMAO + descongestionante ou tramadol: perigo","Fluoxetina: cerca de 5 semanas antes de IMAO"]},{"t":"Atípicos","itens":["Bupropiona: reduz limiar convulsivo","Mirtazapina: sono, apetite e peso","Trazodona: insônia; priapismo raro","Agomelatina: transaminases; não com fluvoxamina"]},{"t":"Riscos dos antidepressivos","itens":["Serotoninérgica: mental, autonômico, clônus","Descontinuação: tontura e choques (paroxetina)","Até 24 anos: vigiar ideação suicida no início"]},{"t":"Antipsicóticos","itens":["Bloqueio D2; atípicos também 5-HT2A","EPS: distonia, acatisia, parkinsonismo, discinesia","Metabólico: olanzapina, clozapina, quetiapina","SNM: febre, rigidez, CK alta: emergência",{"t":"Clozapina","itens":["Hemograma conforme bula","Parar de fumar eleva o nível","Febre ou dor de garganta: hemograma"]}]},{"t":"Receituário","itens":["Antidepressivos e antipsicóticos: lista C1","Receita de Controle Especial em 2 vias","Validade 30 dias; até 60 dias de tratamento","Escetamina spray: B1, só em serviço de saúde"]}]},{"id":"m02-mapa-neuro","titulo":"Anticonvulsivantes, sedativos e antiparkinsonianos","centro":"Crises, sono e Parkinson","ramos":[{"t":"Indutores","itens":["Carbamazepina, fenitoína, fenobarbital","Reduzem anticoncepcional: preferir DIU","Oxcarbazepina e topiramato em dose alta também"]},{"t":"Teratogenia e pele","itens":["Valproato: programa de prevenção da gravidez","Lamotrigina: titulação lenta; risco de SSJ","Carbamazepina: HLA-B*1502 em asiáticos","Topiramato: fenda labial e glaucoma agudo"]},{"t":"Gabapentinoides","itens":["Gabapentina e pregabalina: lista C1","Dose ajustada pela TFG","Com opioide: depressão respiratória"]},{"t":"Benzodiazepínicos e Z","itens":["B1: Notificação de Receita B (azul)","Zolpidem: Notificação B desde 1º/8/2024","Idoso: Beers 2023 recomenda evitar","Retirada gradual, nunca abrupta","Com álcool ou opioide: depressão respiratória"]},{"t":"Melatonina","itens":["Só suplemento: até 0,21 mg/dia, 19 anos ou mais","Sem alegação para sono; não é medicamento"]},{"t":"Parkinson","itens":["Levodopa longe da proteína; não suspender","Agonistas: compulsões e sono súbito","Triexifenidil B1; biperideno C1","Evitar metoclopramida; preferir domperidona"]}]},{"id":"m02-mapa-opioides-anestesicos","titulo":"Opioides e anestésicos","centro":"Opioides e anestésicos","ramos":[{"t":"Receptores e fármacos","itens":["Mu: analgesia, miose, depressão respiratória","Buprenorfina: agonista parcial, efeito teto","Tramadol: mu fraco e serotoninérgico","Metadona: meia-vida longa e QT"]},{"t":"Equivalência CDC 2022","itens":["Codeína 0,15; tramadol 0,2; oxicodona 1,5","Fentanil adesivo: 2,4 x dose em mcg/h","Fator não serve para trocar de opioide"]},{"t":"Segurança","itens":["Laxante profilático desde o início","Naloxona reverte, mas dura menos","CYP2D6 ultrarrápido: codeína tóxica","Codeína e tramadol: não usar abaixo de 12 anos"]},{"t":"Receituário","itens":["A1 e A2: Notificação de Receita A (amarela)","Tramadol até 100 mg/unidade: Controle Especial","Codeína até 100 mg/unidade: Controle Especial","Oxicodona LC até 40 mg: Controle Especial"]},{"t":"Anestésicos locais","itens":["Bloqueiam canal de sódio por dentro","Ésteres (benzocaína): alergia ao PABA","Amida tem i antes de caína (lidocaína)","Vasoconstritor prolonga e reduz toxicidade"]},{"t":"Riscos dos tópicos","itens":["Benzocaína abaixo de 2 anos: metemoglobinemia","Colírio anestésico: C1 com receita retida","Toxicidade: gosto metálico, zumbido, convulsão"]}]}],"apoio":[{"tipo":"tabela","id":"m02-tab-antidepressivos","titulo":"Antidepressivos: classes, efeitos e receituário","colunas":["Classe","Exemplos","Mecanismo","Efeitos marcantes","Receituário"],"linhas":[["ISRS","Fluoxetina, sertralina, paroxetina, citalopram, escitalopram, fluvoxamina","Inibe a recaptação de serotonina","Náusea, insônia, disfunção sexual, sangramento, hiponatremia; QT com citalopram","C1: Receita de Controle Especial em 2 vias"],["IRSN","Venlafaxina, desvenlafaxina, duloxetina, milnaciprana","Inibe a recaptação de serotonina e noradrenalina","Como ISRS; aumento de PA (venlafaxina); descontinuação intensa","C1: Receita de Controle Especial em 2 vias"],["Tricíclicos","Amitriptilina, nortriptilina, imipramina, clomipramina","Inibe a recaptação e bloqueia M, H1 e alfa-1","Boca seca, constipação, sonolência, ortostase, ganho de peso; cardiotóxico em excesso","C1: Receita de Controle Especial em 2 vias"],["IMAO","Tranilcipromina, moclobemida","Inibe a monoaminoxidase","Crise hipertensiva com tiramina e simpaticomiméticos; síndrome serotoninérgica","C1: Receita de Controle Especial em 2 vias"],["Atípicos","Bupropiona","Inibe a recaptação de dopamina e noradrenalina","Insônia, convulsão em dose alta; sem disfunção sexual","C1: Receita de Controle Especial em 2 vias"],["Atípicos","Mirtazapina","Antagonista alfa-2, 5-HT2, 5-HT3 e H1","Sonolência, apetite, ganho de peso","C1: Receita de Controle Especial em 2 vias"],["Atípicos","Trazodona","Antagonista 5-HT2A e inibe recaptação","Sonolência, ortostase, priapismo raro","C1: Receita de Controle Especial em 2 vias"],["Atípicos","Vortioxetina","Multimodal serotoninérgico","Náusea; menos disfunção sexual","C1: Receita de Controle Especial em 2 vias"],["Atípicos","Agomelatina","Agonista MT1 e MT2, antagonista 5-HT2C","Hepatotoxicidade: transaminases conforme bula","C1: Receita de Controle Especial em 2 vias"]],"nota":"Lista C1 da Portaria SVS/MS 344/1998, Anexo I, Atualização n. 101 (RDC 1.036/2026). Receita válida por 30 dias, com até 60 dias de tratamento e até 3 substâncias da C1 por receita (Portaria 344/1998, arts. 52, 57 e 59)."},{"tipo":"tabela","id":"m02-tab-benzodiazepinicos","titulo":"Benzodiazepínicos e drogas Z: meia-vida e equivalência aproximada (Ashton)","colunas":["Fármaco","Meia-vida aproximada (h)","Dose equivalente a 10 mg de diazepam","Observação","Receituário"],"linhas":[["Alprazolam","6 a 12","0,5 mg","Retirada difícil; ansiedade entre doses","Notificação B"],["Bromazepam","10 a 20","5 a 6 mg","Ação intermediária","Notificação B"],["Clobazam","12 a 60","20 mg","Também usado em epilepsia","Notificação B"],["Clonazepam","18 a 50","0,5 mg","Gotas 2,5 mg/mL: 0,1 mg por gota","Notificação B"],["Diazepam","20 a 100 (metabólito ativo: 36 a 200)","10 mg","Acúmulo no idoso; usado para retirada","Notificação B"],["Flunitrazepam","18 a 26 (metabólito ativo: 36 a 200)","1 mg","Potente; risco de uso criminoso","Notificação B"],["Lorazepam","10 a 20","1 mg","Só glicuronidação: melhor no hepatopata","Notificação B"],["Nitrazepam","15 a 38","10 mg","Hipnótico de ação longa","Notificação B"],["Midazolam","Curta (poucas horas)","Não estabelecida para uso crônico","Indução do sono e procedimentos","Notificação B"],["Zolpidem","2","20 mg","Comportamentos complexos no sono","Notificação B (desde 1º/8/2024)"],["Zopiclona","5 a 6","15 mg","Gosto amargo","Notificação B"]],"nota":"Valores aproximados da Tabela 1 do Manual Ashton (2002), que avisa que as equivalências se baseiam em experiência clínica, variam entre indivíduos e não coincidem com as de outros autores. O midazolam não consta dessa tabela. Use só para planejar trocas e retiradas com o prescritor, nunca como conversão exata. Lista B1 sem adendo para esses fármacos (Portaria 344/1998, Atualização n. 101, RDC 1.036/2026)."},{"tipo":"tabela","id":"m02-tab-opioides","titulo":"Opioides: lista, receituário, equivalência aproximada e alertas","colunas":["Fármaco","Lista","Receituário","Fator MME (CDC 2022)","Alerta"],"linhas":[["Codeína","A2","Até 100 mg/unidade e até 2,5% (indivisível): Receita de Controle Especial; acima: Notificação A","0,15","Pró-fármaco CYP2D6; não usar abaixo de 12 anos nem na amamentação"],["Tramadol","A2","Até 100 mg/unidade: Receita de Controle Especial; acima: Notificação A","0,2","Convulsão, síndrome serotoninérgica, hipoglicemia"],["Morfina","A1","Notificação A","1","Metabólitos acumulam na doença renal"],["Oxicodona","A1","Liberação controlada até 40 mg/unidade: Receita de Controle Especial; demais: Notificação A","1,5","Não partir nem mastigar"],["Metadona","A1","Notificação A","4,7 (estimativa grosseira)","Meia-vida longa, acúmulo, QT; conversão só por especialista"],["Fentanil transdérmico","A1","Notificação A","2,4 x mcg/h","Só para tolerante a opioide; calor aumenta absorção"],["Buprenorfina","A1","Adesivo em matriz: Receita de Controle Especial; demais: Notificação A","Não se aplica","Agonista parcial; pode precipitar abstinência"],["Tapentadol","A1","Notificação A","0,4","Também noradrenérgico"],["Naloxona","C1","Receita de Controle Especial","Não se aplica","Duração menor que a de muitos opioides"]],"nota":"Listas e adendos: Portaria 344/1998, Anexo I, Atualização n. 101 (RDC 1.036/2026). Fatores MME: tabela de Dowell et al., CDC 2022. São estimativas aproximadas para somar a carga diária de opioide; a própria diretriz diz que não servem para converter um opioide em outro, pedem cautela extra com metadona e fentanil e não incluem a buprenorfina."},{"tipo":"tabela","id":"m02-tab-anticonvulsivantes","titulo":"Anticonvulsivantes: interações, alertas e lista","colunas":["Fármaco","Efeito enzimático","Alerta principal","IT estreito","Lista"],"linhas":[["Carbamazepina","Indutor potente e autoindução","SSJ/NET (HLA-B*1502), hiponatremia, teratogenia","Sim","C1"],["Oxcarbazepina","Indutor moderado","Hiponatremia; reduz anticoncepcional","Não","C1"],["Fenitoína","Indutor potente","Cinética saturável, hiperplasia gengival, teratogenia","Sim","C1"],["Fenobarbital","Indutor potente","Sedação, dependência, teratogenia","Sim","B1 com adendo: Receita de Controle Especial"],["Ácido valproico","Inibidor","Teratogenia grave, hepatotoxicidade, pancreatite; dobra a lamotrigina","Sim","C1"],["Lamotrigina","Sem efeito relevante; nível cai com estrogênio","Exantema e SSJ: titulação lenta","Não","C1"],["Levetiracetam","Sem efeito relevante","Irritabilidade e depressão; ajuste renal","Não","C1"],["Topiramato","Indutor fraco em dose alta","Parestesia, cálculo renal, glaucoma agudo, teratogenia","Não","C1"],["Gabapentina e pregabalina","Sem efeito relevante","Sedação, edema, uso indevido; ajuste renal","Não","C1"]],"nota":"Lista conforme Portaria 344/1998, Anexo I, Atualização n. 101 (RDC 1.036/2026). Para anticonvulsivantes, a quantidade por receita pode chegar a 6 meses de tratamento (Portaria 344/1998, art. 59, parágrafo único)."},{"tipo":"checklist","id":"m02-check-psicotropico","titulo":"Dispensação de psicotrópico: checklist de orientação","itens":["Conferir a lista do fármaco e o tipo de receituário exigido (Notificação A, Notificação B ou Receita de Controle Especial)","Conferir validade de 30 dias a partir da emissão e quantidade máxima permitida para a lista","Conferir identificação do paciente, do prescritor, dose, forma, posologia e quantidade","Verificar adendos de lista (tramadol, codeína, oxicodona, fenobarbital) antes de recusar ou aceitar a receita","Perguntar por álcool, outros calmantes, opioides, antidepressivos e suplementos","Checar interações graves: serotoninérgicos, depressores do SNC, indutores e inibidores do CYP","Perguntar sobre gravidez, planejamento de gravidez e método contraceptivo","Explicar o tempo para início do efeito e os efeitos adversos esperados","Orientar não parar de repente nem mudar a dose por conta própria","Orientar não dirigir nem operar máquinas se houver sonolência","Orientar guarda segura, fora do alcance de crianças, e descarte de sobras em ponto de coleta","Informar sinais de alerta que exigem procurar serviço de saúde","Escriturar a dispensação no sistema exigido e reter a via ou notificação devida","Registrar a orientação e oferecer retorno para acompanhamento"]},{"tipo":"fluxo","id":"m02-fluxo-opioide","titulo":"Receita de opioide no balcão: qual receituário é o correto","passos":[{"t":"Cliente apresenta receita de analgésico opioide","tipo":"inicio"},{"t":"Identificar o fármaco e localizar a lista (A1, A2 ou C1) na atualização vigente do Anexo I da Portaria 344/1998","tipo":"acao"},{"t":"O fármaco é tramadol, codeína, oxicodona de liberação controlada ou buprenorfina em adesivo?","tipo":"decisao","sim":"Conferir o adendo: dose por unidade (tramadol e codeína até 100 mg; oxicodona LC até 40 mg) ou adesivo em matriz","nao":"Exigir Notificação de Receita A (amarela) para A1 e A2"},{"t":"A apresentação se enquadra no adendo?","tipo":"decisao","sim":"Aceitar Receita de Controle Especial em 2 vias","nao":"Exigir Notificação de Receita A"},{"t":"A receita está dentro da validade de 30 dias e da quantidade permitida, com campos completos?","tipo":"decisao","sim":"Seguir para a avaliação clínica","nao":"Não dispensar e orientar o paciente a retornar ao prescritor"},{"t":"Há benzodiazepínico, álcool, gabapentinoide, antidepressivo serotoninérgico ou criança menor de 12 anos envolvida?","tipo":"decisao","sim":"Contatar o prescritor e registrar a intervenção antes de dispensar","nao":"Dispensar"},{"t":"Orientar dose, laxante profilático, sinais de intoxicação, guarda e descarte","tipo":"acao"},{"t":"Sonolência intensa ou respiração lenta: chamar o SAMU (192)","tipo":"alerta"},{"t":"Reter a via ou a notificação e escriturar no sistema de controle","tipo":"fim"}]},{"tipo":"cartoes","id":"m02-cartoes","titulo":"Cartões de revisão","itens":[{"f":"Receituário dos antidepressivos?","v":"Lista C1: Receita de Controle Especial em 2 vias, válida 30 dias."},{"f":"Tríade da síndrome serotoninérgica?","v":"Alteração mental, hiperatividade autonômica e alterações neuromusculares (clônus, hiperreflexia)."},{"f":"Antidepressivo que reduz o limiar convulsivo e não causa disfunção sexual?","v":"Bupropiona."},{"f":"O que acontece com a clozapina quando o paciente para de fumar?","v":"O nível sobe, porque cessa a indução da CYP1A2: risco de toxicidade."},{"f":"Sinais da síndrome neuroléptica maligna?","v":"Febre, rigidez intensa, alteração de consciência, instabilidade autonômica e CK elevada."},{"f":"Valproato em mulher com potencial de engravidar?","v":"Contraindicado, salvo programa de prevenção da gravidez cumprido (bula)."},{"f":"O que o estrogênio faz com a lamotrigina?","v":"Reduz o nível em cerca de metade; crises podem voltar."},{"f":"Receituário do zolpidem desde 1º/8/2024?","v":"Notificação de Receita B (azul), em qualquer concentração."},{"f":"Situação da melatonina no Brasil?","v":"Só suplemento alimentar, até 0,21 mg/dia, para 19 anos ou mais, sem alegação para sono."},{"f":"Antiemético preferido no Parkinson?","v":"Domperidona; evitar metoclopramida e bromoprida."},{"f":"Receituário do triexifenidil?","v":"Lista B1: Notificação de Receita B. O biperideno é C1."},{"f":"Tramadol 50 mg cápsula: qual receituário?","v":"Receita de Controle Especial em 2 vias (adendo 3 da Lista A2)."},{"f":"Por que não usar benzocaína em gengiva de bebê?","v":"Risco de metemoglobinemia em menores de 2 anos, sem benefício comprovado."},{"f":"Validade e quantidade da Notificação de Receita B?","v":"30 dias, só na UF da numeração; até 5 ampolas ou 60 dias de tratamento (Portaria 344/1998, arts. 45 e 46)."},{"f":"Quantidade máxima por receita de anticonvulsivante C1?","v":"Até 6 meses de tratamento (Portaria 344/1998, art. 59, parágrafo único)."},{"f":"Zopiclona 7,5 mg em Receita de Controle Especial, em 2026?","v":"Não serve: o adendo foi excluído; zopiclona exige Notificação de Receita B."}]},{"tipo":"questoes","id":"m02-questoes","titulo":"Questões de fixação","itens":[{"p":"Mulher de 41 anos apresenta Receita de Controle Especial em duas vias para zolpidem 10 mg, emitida há 5 dias. Em outubro de 2026, a conduta correta do farmacêutico é:","alt":["Dispensar, pois o zolpidem até 10 mg segue o regime da Lista C1","Não dispensar: o zolpidem exige Notificação de Receita B","Dispensar metade da quantidade e reter a primeira via","Dispensar, desde que a quantidade não ultrapasse 60 dias","Não dispensar, pois o zolpidem exige Notificação de Receita A"],"c":1,"com":"Desde 1º de agosto de 2024 todos os medicamentos com zolpidem, em qualquer concentração, exigem Notificação de Receita B, após a exclusão do adendo da Lista B1 que equiparava doses até 10 mg à C1 (Anvisa e CFF, 2024). A, C e D seguem a regra antiga. O zolpidem não é da Lista A3 (E)."},{"p":"Paciente apresenta receita de tramadol 50 mg cápsulas, 30 unidades. Pela atualização vigente da Portaria 344/1998, o receituário adequado é:","alt":["Receita comum em uma via, sem retenção","Notificação de Receita A, por ser substância da Lista A2","Notificação de Receita B, por ser psicotrópico","Receita de Controle Especial em 2 vias (adendo da A2)","Receita de Controle Especial em uma via, sem retenção"],"c":3,"com":"O tramadol está na Lista A2, mas o adendo 3 sujeita as preparações com até 100 mg por unidade posológica à Receita de Controle Especial em duas vias, com retenção (Atualização n. 101, RDC 1.036/2026). Notificação A (B) vale para apresentações acima desse limite. Não é B1 (C), nem receita comum (A, E)."},{"p":"Mulher de 26 anos, sem método contraceptivo, recebe prescrição inicial de valproato de sódio para transtorno bipolar. Segundo a bula brasileira, o uso nessa paciente:","alt":["É contraindicado, salvo programa de prevenção da gravidez cumprido","É livre, pois o risco teratogênico se limita à epilepsia","Exige apenas ácido fólico em dose alta para eliminar o risco fetal","É permitido desde que a dose fique abaixo de 500 mg/dia","Depende só de um teste de gravidez negativo na primeira consulta médica"],"c":0,"com":"A bula contraindica o valproato em mulheres com potencial de engravidar, salvo cumprimento do programa de prevenção da gravidez (avaliação, teste, contracepção eficaz, revisão anual, termo assinado). O risco vale para qualquer indicação (B). Ácido fólico não elimina o risco (C), não há dose segura comprovada (D) e um teste isolado não basta (E)."},{"p":"Homem de 50 anos, em uso de fluoxetina, começou tramadol há 2 dias. Chega agitado, sudoreico, com tremor, diarreia e clônus nos tornozelos. A hipótese principal e a conduta são:","alt":["Abstinência de opioide; orientar aumentar o tramadol","Reação alérgica ao tramadol; indicar anti-histamínico","Intoxicação por opioide; orientar observação em casa","Hipoglicemia pelo tramadol; oferecer açúcar e liberar","Síndrome serotoninérgica; encaminhar à urgência"],"c":4,"com":"Agitação, sinais autonômicos (sudorese, diarreia) e alterações neuromusculares (tremor, clônus) após associar dois serotoninérgicos configuram síndrome serotoninérgica, que exige avaliação urgente. Abstinência (A) e intoxicação por opioide (C) não cursam com clônus; intoxicação dá miose e sonolência. Alergia (B) e hipoglicemia (D) não explicam o quadro."},{"p":"Paciente com epilepsia controlada com lamotrigina começa anticoncepcional combinado oral e volta a ter crises. A explicação mais provável é:","alt":["O anticoncepcional inibe a CYP2D6 e acumula lamotrigina","O estrogênio induz a glicuronidação da lamotrigina","A lamotrigina induz o metabolismo do anticoncepcional","O progestagênio bloqueia o canal de sódio e anula o efeito","A pílula reduz a absorção intestinal por quelação"],"c":1,"com":"O estrogênio aumenta a glicuronidação da lamotrigina e pode reduzir seu nível à metade, com retorno das crises. A lamotrigina não é metabolizada pela CYP2D6 (A) e não é indutor relevante do anticoncepcional (C). D e E não têm base farmacológica."},{"p":"Mãe pede gel anestésico com benzocaína para a gengiva do filho de 9 meses, que está com os dentes nascendo. A melhor orientação é:","alt":["Dispensar e orientar aplicar até 4 vezes ao dia","Dispensar lidocaína gel no lugar, que não tem riscos","Não indicar o gel e orientar medidas sem fármaco","Dispensar e orientar observar só se houver vermelhidão local","Indicar o gel apenas à noite, quando a dor piora"],"c":2,"com":"Benzocaína em menores de 2 anos se associa a metemoglobinemia e não tem benefício comprovado na dentição (FDA, 2018), por isso o gel não deve ser indicado. A orientação é mordedor firme, massagem gengival e analgésico oral quando necessário, conforme o pediatra. Lidocaína tópica também tem riscos em bebês (B). A, D e E expõem a criança ao risco."},{"p":"Homem de 35 anos com esquizofrenia em uso de clozapina estável conta que parou de fumar há 2 semanas e está muito sonolento e salivando mais. O farmacêutico deve considerar:","alt":["Abstinência de nicotina, que não interfere na clozapina","Agranulocitose, que se manifesta tipicamente por sonolência","Indução da CYP3A4 pela cessação do tabagismo","Aumento do nível de clozapina pela perda da indução da CYP1A2","Síndrome neuroléptica maligna, que se apresenta só com sialorreia"],"c":3,"com":"Hidrocarbonetos da fumaça induzem a CYP1A2, principal via da clozapina; ao parar de fumar, o nível sobe em poucas semanas, com sedação, sialorreia e risco de convulsão. O médico precisa ajustar a dose. A nicotina não é a causa da indução (A). Agranulocitose se manifesta por infecção (B). SNM tem febre e rigidez (E). C confunde a isoenzima."},{"p":"Idoso com doença de Parkinson em uso de levodopa com benserazida apresenta náusea. A filha pede metoclopramida. A orientação adequada é:","alt":["Evitar metoclopramida e discutir domperidona com o médico","Dispensar metoclopramida, que melhora a absorção da levodopa","Dispensar bromoprida, que não atravessa a barreira hematoencefálica","Suspender a levodopa até a náusea passar","Associar haloperidol em dose baixa para a náusea"],"c":0,"com":"Metoclopramida e bromoprida bloqueiam receptores D2 centrais e pioram o Parkinson; a domperidona quase não atravessa a barreira hematoencefálica e é a opção usual. B e C erram o mecanismo. Suspender levodopa (D) é perigoso. Haloperidol (E) piora o parkinsonismo."},{"p":"Receita para tratamento de efeitos extrapiramidais traz triexifenidil 2 mg. Pela atualização vigente das listas da Portaria 344/1998, o receituário exigido é:","alt":["Receita comum sem retenção","Receita de Controle Especial em duas vias, como o biperideno","Notificação de Receita A","Notificação de Receita B, por estar na Lista B1","Receita de Controle Especial com quantidade para 6 meses"],"c":3,"com":"O triexifenidil consta nominalmente da Lista B1 (Atualização n. 101, RDC 1.036/2026) e exige Notificação de Receita B. O biperideno é C1, com Receita de Controle Especial (B e E aplicam a regra da C1). Não é A (C) nem isento de controle (A)."},{"p":"Homem de 30 anos com epilepsia apresenta Receita de Controle Especial em duas vias, emitida há 10 dias, de carbamazepina 200 mg, 1 comprimido de 12 em 12 horas, com quantidade para 180 dias. A conduta correta é:","alt":["Dispensar só 60 dias, limite único para toda a Lista C1","Não dispensar, pois receita de C1 vale apenas 10 dias","Dispensar o total, permitido para anticonvulsivantes","Exigir Notificação de Receita B, por se tratar de anticonvulsivante","Dispensar 30 dias e devolver as duas vias ao paciente"],"c":2,"com":"A Portaria 344/1998 limita a Receita de Controle Especial da C1 a 60 dias de tratamento (art. 59), mas o parágrafo único do mesmo artigo permite até 6 meses para antiparkinsonianos e anticonvulsivantes; a carbamazepina é C1 (Atualização n. 101, RDC 1.036/2026). A aplica a regra geral sem a exceção. A receita vale 30 dias (art. 52), e não 10 (B). Notificação B é para a Lista B1 (D). A primeira via fica retida na farmácia (E)."},{"p":"Mulher de 24 anos, em uso de valproato de sódio para epilepsia, conta ao retirar o medicamento que a menstruação atrasou e o teste de farmácia deu positivo. A orientação adequada do farmacêutico é:","alt":["Suspender o valproato hoje e levar o teste à próxima consulta de rotina","Trocar por conta própria para lamotrigina, que tem menor risco fetal","Reduzir a dose à metade até conseguir falar com o neurologista","Manter o uso e esperar o início do pré-natal para discutir o caso","Não interromper o remédio e procurar o especialista com urgência"],"c":4,"com":"A bula do valproato orienta que a paciente não interrompa a medicação e procure o especialista imediatamente em caso de gravidez suspeita, e atribui ao farmacêutico reforçar essa orientação e entregar o cartão da paciente (bula do Valpakine®, Sanofi). Suspender ou reduzir por conta própria (A, C) expõe mãe e feto a crises tônico-clônicas e estado de mal epiléptico. A troca de fármaco é decisão do especialista (B). Esperar o pré-natal (D) atrasa uma reavaliação urgente."}]}],"fontes":["Brasil. Ministério da Saúde. Secretaria de Vigilância Sanitária. Portaria SVS/MS nº 344, de 12 de maio de 1998. Regulamento técnico sobre substâncias e medicamentos sujeitos a controle especial (arts. 35, 41, 43, 45, 46, 52, 57, 59 e 60). DOU, 1998 (republicada em 1º/2/1999). https://bvsms.saude.gov.br/bvs/saudelegis/svs/1998/prt0344_12_05_1998_rep.html","Anvisa. Resolução da Diretoria Colegiada RDC nº 1.036, de 9 de julho de 2026. Atualização do Anexo I (Listas de Substâncias Entorpecentes, Psicotrópicas, Precursoras e Outras sob Controle Especial) da Portaria SVS/MS nº 344/1998: Atualização n. 101. DOU, 13/7/2026. Texto integral das listas e adendos consultado em legisweb.com.br.","Anvisa. Resolução da Diretoria Colegiada RDC nº 1.023, de 11 de maio de 2026. Atualização n. 100 do Anexo I da Portaria SVS/MS nº 344/1998 (exclusão do adendo 13 da Lista B1 e adendos sobre Cannabis). DOU, 13/5/2026.","Anvisa. Lista de substâncias sujeitas a controle especial: atualizações do Anexo I da Portaria 344/1998. gov.br/anvisa, página atualizada em 13/7/2026. https://www.gov.br/anvisa/pt-br/assuntos/medicamentos/controlados/lista-substancias","Anvisa. Resolução da Diretoria Colegiada RDC nº 871, de 17 de maio de 2024. Exclusão do adendo 4 da Lista B1; zolpidem e zaleplona com Notificação de Receita B a partir de 1º/8/2024.","Conselho Federal de Farmácia. Receitas de zolpidem emitidas antes de 1º de agosto devem ser atendidas durante sua validade. Notícia de 2/8/2024. https://site.cff.org.br","Anvisa. Gerência de Produtos Controlados. RDC nº 1.000/2025: receituários eletrônicos e físicos. Webinar para o Sistema Nacional de Vigilância Sanitária, fevereiro de 2026. https://www.gov.br/anvisa","Anvisa. Instrução Normativa nº 285, de 7 de março de 2024, e Instrução Normativa nº 404, de 10 de novembro de 2025. Lista de Medicamentos Isentos de Prescrição. DOU, 13/11/2025.","Brasil. Ministério da Saúde. Melatonina. Saúde de A a Z, gov.br/saude, 2025. https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/m/melatonina","Valpakine® (valproato de sódio). Bula para o profissional de saúde: contraindicações e Programa de Prevenção da Gravidez. Sanofi Medley, Brasil, 2018.","Leponex® (clozapina). Bula para o profissional de saúde. Viatris, Brasil (versão de 2022).","U.S. Food and Drug Administration. Clozaril (clozapine) tablets: prescribing information. HLS Therapeutics, DailyMed, 2025. Lamictal (lamotrigine): prescribing information. GlaxoSmithKline, DailyMed, 2025.","Dowell D, Ragan KR, Jones CM, Baldwin GT, Chou R. CDC Clinical Practice Guideline for Prescribing Opioids for Pain, United States, 2022. MMWR Recomm Rep 2022;71(RR-3):1-95 (tabela de equivalentes de morfina).","Ashton CH. Benzodiazepines: how they work and how to withdraw (The Ashton Manual), Tabela 1. Newcastle University, 2002. https://www.benzo.org.uk/manual/","Boyer EW, Shannon M. The serotonin syndrome. N Engl J Med 2005;352:1112-1120. Dunkley EJC et al. The Hunter Serotonin Toxicity Criteria. QJM 2003;96:635-642.","U.S. Food and Drug Administration. Drug Safety Communication: FDA takes action against the use of OTC benzocaine teething products due to serious safety risk and lack of benefit, maio de 2018.","U.S. Food and Drug Administration. Drug Safety Communications: codeína e tramadol em crianças e na amamentação (2017); comportamentos complexos do sono com zolpidem, zopiclona e eszopiclona (2019); gabapentinoides e depressão respiratória (2019); opioides associados a benzodiazepínicos (2016); citalopram e intervalo QT (2012).","Faculty of Sexual and Reproductive Healthcare (FSRH). Clinical Guidance: Drug Interactions with Hormonal Contraception. NHS Specialist Pharmacy Service: Using contraception with enzyme-inducing medicines.","American Geriatrics Society Beers Criteria Update Expert Panel. American Geriatrics Society 2023 updated AGS Beers Criteria for potentially inappropriate medication use in older adults. J Am Geriatr Soc 2023;71(7):2052-2081.","American Diabetes Association, American Psychiatric Association et al. Consensus development conference on antipsychotic drugs and obesity and diabetes. Diabetes Care 2004;27(2):596-601.","Lam RW et al. Canadian Network for Mood and Anxiety Treatments (CANMAT) 2023 Update on Clinical Guidelines for Management of Major Depressive Disorder in Adults. Can J Psychiatry 2024.","Inker LA et al. New creatinine- and cystatin C-based equations to estimate GFR without race. N Engl J Med 2021;385:1737-1749."]},{"id":"m03","num":3,"titulo":"Antimicrobianos","escopo":"Princípios da antibioticoterapia e resistência, betalactâmicos, macrolídeos e demais classes antibacterianas, quinolonas, sulfonamidas, glicopeptídeos, antifúngicos, antivirais e antiparasitários de uso comum, com posologia, alimento, interações e orientação ao paciente na dispensação com retenção de receita (RDC 471/2021 e IN 360/2025).","cor":"#11A870","icone":"virus","curto":"Antimicrobianos","topicos":[{"id":"m03-atb-principios","titulo":"Princípios da antibioticoterapia","resumo":"\u003cp>Antimicrobiano é todo fármaco que mata ou inibe micro-organismos: bactérias (antibacterianos, chamados no dia a dia de antibióticos), fungos, vírus e parasitas. A escolha de um antibacteriano cruza três informações: o micro-organismo provável, o local da infecção e o paciente (alergia, idade, gestação, função renal e hepática, outros medicamentos em uso). No balcão, o farmacêutico raramente escolhe o antibiótico, mas confere se a prescrição faz sentido para aquele paciente, procura interações e garante que o tratamento seja tomado do jeito certo, pelo tempo certo.\u003c/p>\u003cp>Boa parte das infecções que chegam à farmácia é viral: resfriado comum, a maioria das faringites e das sinusites agudas nos primeiros dias, bronquite aguda e grande parte das diarreias agudas. Antibiótico não encurta nenhuma delas, expõe o paciente a efeitos adversos e alimenta a resistência bacteriana.\u003c/p>\u003ch3>Bactericida e bacteriostático\u003c/h3>\u003cp>\u003cstrong>Bactericida\u003c/strong> é o fármaco que mata a bactéria nas concentrações alcançadas no organismo. Bacteriostático impede a multiplicação e depende do sistema imune para eliminar a infecção. Em laboratório, chama-se bactericida o antimicrobiano cuja concentração bactericida mínima (CBM) fica próxima da concentração inibitória mínima (CIM), em geral até quatro vezes maior.\u003c/p>\u003cp>A diferença pesa quando a defesa do hospedeiro falha ou o local é de difícil acesso: endocardite, meningite e paciente neutropênico pedem fármaco bactericida. Para as infecções comuns da comunidade, os ensaios clínicos não mostram vantagem consistente de um grupo sobre o outro. O comportamento também varia com a bactéria: a linezolida, por exemplo, é bactericida contra estreptococos e bacteriostática contra estafilococos e enterococos.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Comportamento predominante\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Bactericidas\u003c/td>\u003ctd>Betalactâmicos, aminoglicosídeos, quinolonas, glicopeptídeos (vancomicina, de ação lenta), metronidazol, nitrofurantoína, fosfomicina, sulfametoxazol-trimetoprima (a associação)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bacteriostáticos\u003c/td>\u003ctd>Macrolídeos, tetraciclinas, clindamicina, cloranfenicol, linezolida (contra estafilococo), sulfonamida isolada\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Espectro e grupos de bactérias\u003c/h3>\u003cp>Espectro é o conjunto de micro-organismos que o fármaco atinge. Espectro estreito (penicilina benzatina, cefalexina) poupa a microbiota; espectro amplo (amoxicilina-clavulanato, quinolonas, carbapenêmicos) cobre mais agentes, mas seleciona resistência em mais espécies. Para raciocinar sobre espectro, divide-se as bactérias em quatro grupos práticos.\u003c/p>\u003cp>As \u003cstrong>Gram-positivas\u003c/strong> têm parede espessa de peptidoglicano e nenhuma membrana externa. As Gram-negativas têm parede fina coberta por uma membrana externa com porinas, que funciona como barreira a muitos fármacos (por isso a vancomicina, molécula grande, não age nelas). Os atípicos não se coram bem pelo Gram: o Mycoplasma não tem parede celular e Chlamydophila e Legionella vivem dentro das células, de modo que betalactâmicos não funcionam contra eles. Os anaeróbios crescem sem oxigênio e predominam em abscessos, infecções dentárias, intra-abdominais e pélvicas.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Exemplos de bactérias\u003c/th>\u003cth>Infecções típicas\u003c/th>\u003cth>Fármacos com atividade\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Gram-positivos\u003c/td>\u003ctd>\u003ci>Staphylococcus aureus\u003c/i>, \u003ci>Streptococcus pyogenes\u003c/i>, \u003ci>S. pneumoniae\u003c/i>, \u003ci>Enterococcus\u003c/i>\u003c/td>\u003ctd>Pele e partes moles, faringite, pneumonia, otite\u003c/td>\u003ctd>Penicilinas, cefalosporinas de 1ª geração, macrolídeos, clindamicina, vancomicina, linezolida\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gram-negativos\u003c/td>\u003ctd>\u003ci>Escherichia coli\u003c/i>, \u003ci>Klebsiella\u003c/i>, \u003ci>Proteus\u003c/i>, \u003ci>Haemophilus influenzae\u003c/i>, \u003ci>Pseudomonas aeruginosa\u003c/i>\u003c/td>\u003ctd>Infecção urinária, intra-abdominal, pneumonia hospitalar\u003c/td>\u003ctd>Cefalosporinas de 3ª e 4ª geração, quinolonas, aminoglicosídeos, carbapenêmicos, nitrofurantoína e fosfomicina (urina)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Atípicos\u003c/td>\u003ctd>\u003ci>Mycoplasma pneumoniae\u003c/i>, \u003ci>Chlamydophila pneumoniae\u003c/i>, \u003ci>Legionella\u003c/i>\u003c/td>\u003ctd>Pneumonia comunitária\u003c/td>\u003ctd>Macrolídeos, tetraciclinas, quinolonas respiratórias\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anaeróbios\u003c/td>\u003ctd>\u003ci>Bacteroides fragilis\u003c/i>, \u003ci>Prevotella\u003c/i>, \u003ci>Peptostreptococcus\u003c/i>, \u003ci>Clostridioides difficile\u003c/i>\u003c/td>\u003ctd>Abscessos, infecção dentária, intra-abdominal, pélvica\u003c/td>\u003ctd>Metronidazol, clindamicina (acima do diafragma), amoxicilina-clavulanato, carbapenêmicos\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Farmacocinética e farmacodinâmica (PK/PD)\u003c/h3>\u003cp>A eficácia de um antibiótico depende de como a concentração no sangue se relaciona com a CIM da bactéria ao longo do tempo. Três padrões orientam dose e intervalo.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Padrão\u003c/th>\u003cth>Índice que prediz eficácia\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Consequência prática\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tempo-dependente\u003c/td>\u003ctd>Fração do intervalo com concentração acima da CIM (T &gt; CIM)\u003c/td>\u003ctd>Betalactâmicos\u003c/td>\u003ctd>Doses fracionadas em horários regulares; atrasos repetidos reduzem a eficácia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concentração-dependente\u003c/td>\u003ctd>Pico sobre a CIM (Cmáx/CIM)\u003c/td>\u003ctd>Aminoglicosídeos, metronidazol, daptomicina\u003c/td>\u003ctd>Dose única diária maior, com efeito pós-antibiótico prolongado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exposição total\u003c/td>\u003ctd>Área sob a curva sobre a CIM (AUC/CIM)\u003c/td>\u003ctd>Quinolonas, vancomicina, azitromicina, tetraciclinas, linezolida\u003c/td>\u003ctd>Importa a dose diária total; para a vancomicina, a monitorização é feita pela AUC\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Efeito pós-antibiótico é a supressão do crescimento bacteriano que persiste depois que a concentração cai abaixo da CIM. É longo para aminoglicosídeos e quinolonas e curto para a maioria dos betalactâmicos contra Gram-negativos, o que reforça a importância do horário regular para amoxicilina, cefalexina e afins.\u003c/p>\u003ch3>Resistência bacteriana\u003c/h3>\u003cp>Resistência é a capacidade da bactéria de crescer em concentrações do fármaco que antes a inibiam. Ela surge por mutação ou é adquirida de outras bactérias por plasmídeos e transposons (conjugação), por DNA livre (transformação) ou por vírus bacteriófagos (transdução). Os mecanismos são poucos e se repetem entre as classes:\u003c/p>\u003cul>\u003cli>\u003cstrong>Inativação enzimática\u003c/strong>: betalactamases que abrem o anel betalactâmico; enzimas que modificam aminoglicosídeos.\u003c/li>\u003cli>Alteração do alvo: PBP2a no estafilococo resistente à oxacilina; mutações na DNA girase (quinolonas); metilação do ribossomo (macrolídeos e clindamicina).\u003c/li>\u003cli>Redução da entrada: perda de porinas em Gram-negativos.\u003c/li>\u003cli>Bombas de efluxo: expulsam tetraciclinas, macrolídeos e quinolonas.\u003c/li>\u003cli>Via metabólica alternativa: bactérias que passam a usar folato pré-formado escapam das sulfonamidas.\u003c/li>\u003c/ul>\u003cp>Betalactamases de espectro estendido (\u003cstrong>ESBL\u003c/strong>) são enzimas de enterobactérias, sobretudo \u003ci>E. coli\u003c/i> e \u003ci>Klebsiella\u003c/i>, que inativam penicilinas, cefalosporinas de até 4ª geração e aztreonam. Em infecção grave por ESBL, o tratamento de referência é um carbapenêmico: no ensaio MERINO (2018), piperacilina-tazobactam teve mortalidade maior que meropeném em bacteremia por esses agentes. Na cistite por ESBL, nitrofurantoína e fosfomicina costumam manter atividade. As carbapenemases (KPC, NDM e outras) inativam até os carbapenêmicos e são um problema hospitalar grave no Brasil.\u003c/p>\u003cp>\u003cstrong>MRSA\u003c/strong> (\u003ci>S. aureus\u003c/i> resistente à meticilina, equivalente à oxacilina) carrega o gene \u003ci>mecA\u003c/i>, que produz a PBP2a, de baixa afinidade pelos betalactâmicos. Resulta resistência a praticamente todos eles, com exceção das cefalosporinas de 5ª geração (ceftarolina). O MRSA comunitário, que causa furúnculos e abscessos de repetição, costuma responder a sulfametoxazol-trimetoprima, doxiciclina e, conforme o antibiograma, clindamicina.\u003c/p>\u003cp>A pressão seletiva explica por que o uso desnecessário importa: cada exposição elimina as bactérias sensíveis da microbiota e deixa espaço para as resistentes, que se multiplicam e são transmitidas a outras pessoas. Tratamento curto demais, dose baixa e uso sem indicação contribuem; o fator de maior peso é o volume total de antibiótico consumido.\u003c/p>\u003ch3>Classificação AWaRe da OMS\u003c/h3>\u003cp>A Organização Mundial da Saúde agrupa os antibióticos em três categorias conforme o impacto sobre a resistência. A edição vigente é a de 2025 (documento técnico publicado em 5 de setembro de 2025), revista a cada dois anos pelo comitê da Lista de Medicamentos Essenciais. Os exemplos da tabela conferem com a lista AWaRe on-line da OMS consultada em outubro de 2026.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Definição\u003c/th>\u003cth>Exemplos de uso comunitário\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Access (acesso)\u003c/td>\u003ctd>Primeira ou segunda escolha para infecções comuns, menor potencial de selecionar resistência; devem estar sempre disponíveis\u003c/td>\u003ctd>Amoxicilina, amoxicilina-clavulanato, cefalexina, doxiciclina, nitrofurantoína, sulfametoxazol-trimetoprima, metronidazol, clindamicina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Watch (vigilância)\u003c/td>\u003ctd>Maior potencial de resistência; indicações restritas e uso monitorado\u003c/td>\u003ctd>Azitromicina, claritromicina, ciprofloxacino, levofloxacino, ceftriaxona, cefuroxima, fosfomicina oral\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reserve (reserva)\u003c/td>\u003ctd>Último recurso para bactérias multirresistentes\u003c/td>\u003ctd>Linezolida, colistina, polimixina B, ceftazidima-avibactam, fosfomicina intravenosa\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A declaração política da Assembleia Geral da ONU sobre resistência antimicrobiana (setembro de 2024) fixou a meta de que pelo menos 70% do consumo humano de antibióticos no mundo seja de fármacos do grupo Access até 2030. Pertencer ao grupo Access não significa ser mais fraco: indica que o fármaco resolve a maioria das infecções comuns com menor custo ecológico.\u003c/p>\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Os exemplos acima seguem as edições mais recentes da lista. A classificação muda de tempos em tempos, e alguns países publicam adaptações próprias; antes de usar um exemplo em indicador ou protocolo, confira o anexo da edição de 2025.\u003c/p>\u003c/div>\u003ch3>Uso racional e papel do farmacêutico comunitário\u003c/h3>\u003cp>No Brasil, antimicrobianos de uso sistêmico só são dispensados com receita, que fica retida. A RDC 471/2021 define as regras de prescrição, dispensação e escrituração; desde a RDC 973/2025, o seu art. 7º remete o prazo de validade à instrução normativa específica, que é a IN 360/2025 (lista de substâncias e prazo de 10 dias a partir da emissão).\u003c/p>\u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>A receita dos medicamentos à base das substâncias antimicrobianas listadas \"é válida por 10 (dez) dias, a contar da data de sua emissão\" (IN 360/2025, art. 1º, § 2º, em vigor desde junho de 2025).\u003c/p>\u003c/div>\u003cp>Do ponto de vista clínico, a dispensação é o último momento em que alguém de saúde conversa com o paciente antes da primeira dose, e o farmacêutico deve aproveitá-lo para:\u003c/p>\u003cul>\u003cli>Confirmar alergias e o tipo de reação prévia, gestação, amamentação e doença renal ou hepática conhecida.\u003c/li>\u003cli>Conferir dose, intervalo e duração contra a indicação provável e a idade (em criança, contra o peso).\u003c/li>\u003cli>Rastrear interações relevantes no histórico de medicamentos e de suplementos.\u003c/li>\u003cli>Explicar horário, relação com alimento, o que fazer se esquecer uma dose e quais sinais exigem retorno.\u003c/li>\u003cli>Reforçar adesão: tomar exatamente como prescrito, sem guardar sobras nem repassar a outra pessoa.\u003c/li>\u003cli>Notificar reação adversa ou falha terapêutica suspeita à Anvisa pelo VigiMed.\u003c/li>\u003c/ul>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Cliente de 29 anos pede \"um antibiótico forte\" para dor de garganta com coriza e tosse há dois dias, sem febre. O quadro sugere infecção viral: explique que antibiótico não acelera a melhora, oriente sintomáticos isentos de prescrição, hidratação e repouso, e encaminhe a consulta se surgirem febre alta persistente, placas no fundo da garganta sem tosse, dificuldade para engolir a saliva, falta de ar ou piora depois de melhora inicial.\u003c/p>\u003cp>Sem receita não há dispensação de antimicrobiano sistêmico. Registre a orientação dada, se a farmácia mantiver registro de atendimento farmacêutico.\u003c/p>\u003c/div>"},{"id":"m03-atb-betalactamicos","titulo":"Betalactâmicos","resumo":"\u003cp>Betalactâmicos são os antibióticos mais dispensados na farmácia comercial. Todos têm o anel betalactâmico, que se liga às proteínas ligadoras de penicilina (PBP), as transpeptidases que fazem as ligações cruzadas do peptidoglicano. Sem essas ligações, a parede fica frágil e a bactéria em multiplicação sofre lise: o efeito é bactericida e tempo-dependente. A toxicidade em humanos é baixa, porque células humanas não têm parede; os problemas principais são alergia, diarreia e alteração da microbiota.\u003c/p>\u003cp>A família inclui penicilinas, cefalosporinas, carbapenêmicos e monobactâmicos. Associada a eles, há os inibidores de betalactamase, que protegem o anel da enzima bacteriana.\u003c/p>\u003ch3>Penicilinas\u003c/h3>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Via e apresentação\u003c/th>\u003cth>Espectro principal\u003c/th>\u003cth>Usos típicos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Benzilpenicilina benzatina (Benzetacil®)\u003c/td>\u003ctd>Intramuscular profunda, depósito de liberação lenta\u003c/td>\u003ctd>Estreptococos, \u003ci>Treponema pallidum\u003c/i>\u003c/td>\u003ctd>Sífilis, profilaxia secundária da febre reumática, faringite estreptocócica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Benzilpenicilina cristalina\u003c/td>\u003ctd>Intravenosa, uso hospitalar\u003c/td>\u003ctd>Estreptococos, meningococo, treponema\u003c/td>\u003ctd>Neurossífilis, endocardite estreptocócica\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Amoxicilina\u003c/td>\u003ctd>Oral (cápsula, comprimido, suspensão)\u003c/td>\u003ctd>Estreptococos, pneumococo, \u003ci>Enterococcus faecalis\u003c/i>, \u003ci>H. influenzae\u003c/i> e \u003ci>E. coli\u003c/i> sem betalactamase, \u003ci>Listeria\u003c/i>\u003c/td>\u003ctd>Otite, sinusite e pneumonia comunitária, faringite estreptocócica, erradicação do \u003ci>H. pylori\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ampicilina\u003c/td>\u003ctd>Intravenosa (a oral é pouco absorvida e o alimento reduz ainda mais)\u003c/td>\u003ctd>Semelhante à amoxicilina\u003c/td>\u003ctd>Uso hospitalar, inclusive meningite por \u003ci>Listeria\u003c/i>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oxacilina\u003c/td>\u003ctd>Intravenosa\u003c/td>\u003ctd>Estafilococo sensível à oxacilina\u003c/td>\u003ctd>Infecções estafilocócicas graves em hospital\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Piperacilina-tazobactam\u003c/td>\u003ctd>Intravenosa\u003c/td>\u003ctd>Gram-negativos, inclusive \u003ci>Pseudomonas\u003c/i>, e anaeróbios\u003c/td>\u003ctd>Infecção hospitalar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A benzatina mantém concentrações baixas e prolongadas por semanas. Na sífilis recente, a dose de adulto é 2,4 milhões de UI por via intramuscular (1,2 milhão de UI em cada glúteo), conforme o protocolo do Ministério da Saúde para infecções sexualmente transmissíveis (PCDT IST, 2022). A aplicação dói, deve ser feita em músculo de grande massa e só em local preparado para atender reação anafilática, que é rara. Depois da primeira dose na sífilis pode ocorrer a reação de Jarisch-Herxheimer (febre, mal-estar e piora transitória das lesões nas primeiras 24 horas), que não é alergia e não contraindica as doses seguintes.\u003c/p>\u003cp>A amoxicilina tem boa absorção oral com ou sem alimento e é o antibiótico de primeira escolha em muitas infecções respiratórias da comunidade. Exantema maculopapular durante tratamento de faringite pode ser mononucleose infecciosa, situação em que a aminopenicilina provoca erupção com frequência alta sem que isso signifique alergia verdadeira; o paciente deve ser reavaliado pelo prescritor.\u003c/p>\u003ch3>Inibidores de betalactamase\u003c/h3>\u003cp>Betalactamases são a principal defesa das bactérias contra este grupo. Os inibidores clássicos têm pouca ação antibacteriana própria: funcionam como isca que se liga irreversivelmente à enzima.\u003c/p>\u003cul>\u003cli>\u003cstrong>Clavulanato\u003c/strong>: associado à amoxicilina por via oral. Amplia o espectro para \u003ci>H. influenzae\u003c/i> e \u003ci>Moraxella\u003c/i> produtores de betalactamase, \u003ci>S. aureus\u003c/i> sensível à oxacilina e anaeróbios (mordedura, infecção dentária, sinusite que não respondeu). É responsável por boa parte da diarreia e da náusea da associação e, raramente, por hepatite colestática, mais comum em idosos e em cursos longos.\u003c/li>\u003cli>\u003cstrong>Sulbactam\u003c/strong>: associado à ampicilina por via intravenosa; tem atividade própria contra \u003ci>Acinetobacter\u003c/i>.\u003c/li>\u003cli>\u003cstrong>Tazobactam\u003c/strong>: associado à piperacilina, uso hospitalar.\u003c/li>\u003cli>Inibidores mais novos, como o avibactam (ceftazidima-avibactam), atuam também sobre algumas carbapenemases e ficam no grupo Reserve.\u003c/li>\u003c/ul>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Amoxicilina-clavulanato deve ser tomada no início de uma refeição, o que melhora a tolerância gastrintestinal e a absorção do clavulanato (conforme bula do produto de referência). Diarreia leve é comum; oriente hidratação e procurar o prescritor se houver sangue ou muco nas fezes, febre, dor abdominal forte ou mais de seis evacuações por dia, inclusive semanas depois do fim do tratamento.\u003c/p>\u003cp>Amoxicilina pura pode ser tomada com ou sem alimento. Em ambas, horários regulares (8/8 h ou 12/12 h) importam mais do que a refeição.\u003c/p>\u003c/div>\u003ch3>Cefalosporinas\u003c/h3>\u003cp>As cefalosporinas são agrupadas em gerações. De modo geral, as primeiras gerações são mais ativas contra Gram-positivos e as seguintes ganham Gram-negativos. Nenhuma age contra enterococo ou \u003ci>Listeria\u003c/i>, e só a 5ª geração age contra MRSA.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Geração\u003c/th>\u003cth>Exemplos e via\u003c/th>\u003cth>Espectro\u003c/th>\u003cth>Usos típicos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1ª\u003c/td>\u003ctd>Cefalexina (oral), cefadroxila (oral), cefazolina (intravenosa)\u003c/td>\u003ctd>Estafilococo sensível à oxacilina, estreptococos; \u003ci>E. coli\u003c/i>, \u003ci>Proteus\u003c/i> e \u003ci>Klebsiella\u003c/i> comunitárias\u003c/td>\u003ctd>Celulite, impetigo extenso, infecção urinária baixa, profilaxia cirúrgica (cefazolina)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2ª\u003c/td>\u003ctd>Cefuroxima (oral e intravenosa), cefaclor (oral), cefoxitina (intravenosa)\u003c/td>\u003ctd>Acrescenta \u003ci>H. influenzae\u003c/i> e \u003ci>Moraxella\u003c/i>; cefoxitina cobre anaeróbios\u003c/td>\u003ctd>Otite, sinusite, pneumonia comunitária leve; profilaxia em cirurgia abdominal (cefoxitina)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3ª\u003c/td>\u003ctd>Ceftriaxona (intramuscular e intravenosa), cefotaxima, ceftazidima\u003c/td>\u003ctd>Gram-negativos amplos; ceftriaxona mantém pneumococo; ceftazidima cobre \u003ci>Pseudomonas\u003c/i> e é fraca para Gram-positivos\u003c/td>\u003ctd>Pneumonia, meningite, pielonefrite, gonorreia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4ª\u003c/td>\u003ctd>Cefepima (intravenosa)\u003c/td>\u003ctd>Gram-negativos, inclusive \u003ci>Pseudomonas\u003c/i>, e Gram-positivos\u003c/td>\u003ctd>Infecção hospitalar, neutropenia febril\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5ª\u003c/td>\u003ctd>Ceftarolina (intravenosa)\u003c/td>\u003ctd>MRSA e Gram-negativos comunitários, sem \u003ci>Pseudomonas\u003c/i>\u003c/td>\u003ctd>Pele e partes moles, pneumonia comunitária, uso hospitalar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Pontos de atenção por fármaco: a cefuroxima axetila oral é mais bem absorvida com alimento; a cefalexina pode ser tomada com ou sem alimento; o cefaclor se associa a reação semelhante à doença do soro em crianças (febre, exantema e dor articular). A ceftriaxona é eliminada em parte pela bile e pode formar barro biliar (pseudolitíase), e não deve ser administrada junto com soluções intravenosas de cálcio em recém-nascidos, pelo risco de precipitação. A cefepima acumula na insuficiência renal e pode causar encefalopatia e convulsões quando a dose não é ajustada pela TFG (estimada por CKD-EPI 2021).\u003c/p>\u003ch3>Carbapenêmicos e monobactâmico\u003c/h3>\u003cp>Carbapenêmicos (imipeném-cilastatina, meropeném, ertapeném) têm o espectro mais amplo entre os betalactâmicos: Gram-positivos sensíveis à oxacilina, Gram-negativos produtores de ESBL e anaeróbios. O ertapeném, de dose única diária, não cobre \u003ci>Pseudomonas\u003c/i> nem \u003ci>Acinetobacter\u003c/i>. São fármacos hospitalares, reservados a infecções graves ou por bactérias resistentes. O imipeném reduz o limiar convulsivo.\u003c/p>\u003cp>O \u003cstrong>aztreonam\u003c/strong>, único monobactâmico em uso, age apenas em Gram-negativos aeróbios, inclusive \u003ci>Pseudomonas\u003c/i>. Quase não tem reatividade cruzada com penicilinas; a exceção é a ceftazidima, com a qual compartilha cadeia lateral idêntica.\u003c/p>\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Carbapenêmicos derrubam a concentração de ácido valproico em poucas horas, e o efeito não se corrige aumentando a dose do anticonvulsivante. Paciente epiléptico em uso de valproato que recebe meropeném ou ertapeném pode convulsionar; a associação deve ser evitada e, se inevitável, exige outro anticonvulsivante de cobertura.\u003c/p>\u003c/div>\u003ch3>Alergia a penicilina\u003c/h3>\u003cp>Cerca de 10% dos pacientes relatam alergia a penicilina, mas, quando avaliados, menos de 1% tem alergia confirmada (CDC, orientação a profissionais sobre alergia a penicilina). Os anticorpos IgE contra penicilina tendem a diminuir com os anos, e muitas reações atribuídas ao antibiótico eram sintomas da própria infecção viral. O rótulo falso de alergia empurra o paciente para quinolonas, clindamicina e vancomicina, com mais efeitos adversos, mais diarreia por \u003ci>C. difficile\u003c/i>, mais resistência e custo maior.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo de reação\u003c/th>\u003cth>Quando e como aparece\u003c/th>\u003cth>Implicação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Imediata (mediada por IgE)\u003c/td>\u003ctd>Minutos até cerca de 1 a 6 horas após a dose: urticária, angioedema, broncoespasmo, hipotensão, anafilaxia\u003c/td>\u003ctd>Evitar penicilinas até avaliação especializada; testes cutâneos e provocação conforme risco\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tardia benigna\u003c/td>\u003ctd>Dias após o início: exantema maculopapular sem acometimento de mucosas e sem febre alta\u003c/td>\u003ctd>Muitas vezes de baixo risco e candidata a desrotulagem por provocação oral supervisionada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tardia grave\u003c/td>\u003ctd>Síndrome de Stevens-Johnson, necrólise epidérmica tóxica, DRESS, nefrite intersticial, anemia hemolítica\u003c/td>\u003ctd>Nunca reexpor ao fármaco; registrar de forma destacada\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Intolerância\u003c/td>\u003ctd>Náusea, diarreia, dor abdominal, cefaleia\u003c/td>\u003ctd>Não é alergia; não justifica o rótulo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A reatividade cruzada com cefalosporinas é menor que os 10% citados em textos antigos. Na atualização do parâmetro prático de alergia a medicamentos das academias americanas de alergia (AAAAI e ACAAI, 2022), a chance de reação a cefalosporina em quem tem história de alergia a penicilina fica abaixo de 2%, e ela depende sobretudo da semelhança da cadeia lateral R1. Amoxicilina e ampicilina compartilham cadeia lateral com cefalexina, cefadroxila e cefaclor; ceftriaxona, cefazolina e cefuroxima têm cadeias diferentes. O mesmo documento admite cefalosporina de cadeia lateral diferente, sem teste prévio, mesmo em quem teve anafilaxia à penicilina (recomendação condicional). A reatividade com carbapenêmicos fica abaixo de 1%.\u003c/p>\u003cp>\u003cstrong>Desrotulagem\u003c/strong> é a retirada do registro de alergia depois de avaliação. Usa estratificação de risco (escores validados, como o PEN-FAST), teste cutâneo quando indicado e provocação oral supervisionada com amoxicilina nos pacientes de baixo risco. O farmacêutico comunitário não faz a provocação, mas pode qualificar a história (qual fármaco, que reação, quanto tempo depois, como foi tratada, se já usou outro betalactâmico depois) e encaminhar para avaliação.\u003c/p>\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Cliente de 45 anos traz receita de cefalexina 500 mg de 6/6 h para celulite e diz ser alérgico a penicilina. Perguntado, conta que aos 6 anos teve manchas na pele dias depois de começar amoxicilina, sem falta de ar e sem bolhas. É história tardia benigna e antiga; mesmo assim, como a cefalexina compartilha cadeia lateral com a amoxicilina, o farmacêutico contata o prescritor, relata a história e registra a decisão. Se a história fosse de bolhas, descamação ou lesão em boca e olhos, a dispensação seria suspensa até contato com o médico.\u003c/p>\u003c/div>\u003ch3>Interações e orientação\u003c/h3>\u003cul>\u003cli>\u003cstrong>Metotrexato\u003c/strong>: penicilina

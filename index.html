ão prioridade em todas as etapas.\u003c/li> \u003cli>Antes de aumentar o tratamento, confirmar o diagnóstico, corrigir técnica inalatória, adesão, exposição a gatilhos e comorbidades (rinite, obesidade, refluxo, tabagismo).\u003c/li> \u003cli>Após 3 meses de controle, o médico pode reduzir a dose gradualmente, sem suspender o corticoide inalatório.\u003c/li> \u003cli>Pela GINA 2026, uma exacerbação grave no último ano é fator de risco para novas crises, mesmo em quem tem poucos sintomas, e deve levar à revisão do tratamento.\u003c/li> \u003c/ul> \u003ch3>Dois regimes (tracks) para adultos e adolescentes\u003c/h3> \u003cp>O tratamento é organizado em etapas (1 a 5) e em dois regimes, definidos pelo medicamento de alívio:\u003c/p> \u003cul> \u003cli>\u003cb>Regime 1 (preferencial)\u003c/b>: o alívio é feito com \u003cstrong>CI-formoterol em dose baixa\u003c/strong> (budesonida-formoterol). Nas etapas 1 e 2, ele é usado só quando há sintomas ou antes do exercício (estratégia AIR, de alívio anti-inflamatório). Nas etapas 3 a 5, o mesmo inalador é usado todo dia como manutenção e também como alívio (estratégia MART).\u003c/li> \u003cli>\u003cb>Regime 2 (alternativo)\u003c/b>: alívio com SABA, sempre com corticoide inalatório. Na etapa 1, usa-se CI sempre que usar o SABA (no mesmo inalador ou logo depois); nas etapas seguintes, CI ou CI-LABA de manutenção diária mais SABA quando necessário. É alternativa quando o regime 1 não é viável ou o paciente está estável e aderente. A GINA 2026 também aceita, nesse regime, o alívio com CI-SABA (budesonida-salbutamol), associação que não consta da lista de preços da CMED de out. 2026.\u003c/li> \u003c/ul> \u003cp>O raciocínio do regime 1 é que cada vez que o paciente sente sintoma e usa o alívio, recebe também uma dose de corticoide. Isso reduz crises graves em comparação com o SABA isolado, mesmo em asma leve. Em crianças de 6 a 11 anos com asma leve, a GINA 2026 também recomenda o alívio com CI-formoterol em dose baixa (AIR), que reduz crises em comparação com o SABA isolado; nessa idade, o PCDT prefere a apresentação de budesonida-formoterol 100/6 mcg.\u003c/p> \u003ch3>Doses de budesonida-formoterol no SUS\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Etapa\u003c/th>\u003cth>Uso de budesonida-formoterol 200/6 mcg por inalação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>1 e 2 (AIR)\u003c/td>\u003ctd>1 inalação quando houver sintomas ou antes do exercício\u003c/td>\u003c/tr> \u003ctr>\u003ctd>3 (MART)\u003c/td>\u003ctd>1 inalação uma ou duas vezes ao dia + 1 inalação quando houver sintomas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>4 e 5 (MART)\u003c/td>\u003ctd>2 inalações duas vezes ao dia + 1 inalação quando houver sintomas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Limite diário\u003c/td>\u003ctd>12 inalações no total (72 mcg de formoterol), somando manutenção e alívio\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Fonte: Quadro 11 do PCDT da Asma (2026), adaptado da GINA 2025. Diferentemente do SABA, não é preciso esperar intervalo mínimo entre doses de alívio, mas o limite diário vale sempre. Se o paciente precisar de muitas inalações de alívio por vários dias, deve procurar o médico.\u003c/p> \u003ch3>O que o SUS oferece\u003c/h3> \u003cp>Pelo PCDT da Asma (2026): beclometasona e budesonida (CI), salbutamol e fenoterol (SABA), formoterol (LABA), budesonida-formoterol em cápsula ou pó (6/200 mcg e 12/400 mcg), prednisona e prednisolona, e os imunobiológicos omalizumabe, mepolizumabe, benralizumabe e dupilumabe para asma grave. Beclometasona e salbutamol estão no Programa Farmácia Popular. O protocolo deixa claro que, embora alguns itens sejam monofármacos, não preconiza monoterapia com SABA ou com LABA.\u003c/p> \u003ch3>Crise de asma\u003c/h3> \u003cp>Sinais de crise: piora da falta de ar, chiado, tosse e aperto no peito, necessidade de usar o alívio com mais frequência e menor resposta a ele. A gravidade orienta o lugar do atendimento.\u003c/p> \u003cul> \u003cli>\u003cb>Crise leve\u003c/b>: fala frases completas, consegue deitar, sem uso de musculatura acessória. O paciente segue o plano de ação escrito: SABA com espaçador (ou, no regime 1, doses extras de budesonida-formoterol, respeitando o limite), reavaliação em até 1 hora. Pela GINA 2026, quem usa CI-formoterol como alívio deve procurar atendimento se piorar rápido, se não melhorar em 2 a 3 dias ou se precisar de mais de 12 inalações em 24 horas.\u003c/li> \u003cli>\u003cb>Crise moderada a grave\u003c/b>: fala por palavras ou frases curtas, prefere ficar sentado inclinado para a frente, usa músculos do pescoço para respirar, frequência respiratória ou cardíaca alta, saturação baixa. Precisa de atendimento médico imediato.\u003c/li> \u003cli>\u003cb>Risco de vida\u003c/b>: sonolência, confusão, lábios arroxeados, tórax silencioso (quase sem chiado por pouco ar entrando), exaustão. Acionar o SAMU (192).\u003c/li> \u003c/ul> \u003cp>Pelo PCDT, saturação abaixo de 90% indica tratamento intensivo. Após a crise, o paciente deve sair com tratamento de manutenção contendo CI, medicamento de alívio e curso curto de corticoide oral (prednisolona ou prednisona 40 a 50 mg/dia por 5 a 7 dias em adultos), com consulta de retorno em 2 a 7 dias. Alta só com SABA não é recomendada.\u003c/p> \u003ch3>Quando encaminhar\u003c/h3> \u003cul> \u003cli>Sintomas mais de duas vezes por semana, despertar noturno ou limitação de atividades.\u003c/li> \u003cli>Uso de alívio em quase todos os dias ou compra frequente de SABA.\u003c/li> \u003cli>Qualquer crise que precisou de pronto-socorro ou corticoide oral no último ano.\u003c/li> \u003cli>Asmático em uso só de SABA, sem corticoide inalatório.\u003c/li> \u003cli>Gestante asmática (a asma não controlada é mais perigosa para o feto que os medicamentos; SABA e CI são considerados seguros na gestação, segundo o PCDT).\u003c/li> \u003c/ul> \u003ch3>Medicamentos que pioram a asma\u003c/h3> \u003cp>Betabloqueadores (inclusive colírios de timolol) podem causar broncoespasmo; os cardiosseletivos são mais tolerados, mas a decisão é médica. AINE e AAS pioram a asma em pacientes com doença respiratória exacerbada por AINE (módulo 6). IECA causa tosse, que pode ser confundida com descontrole.\u003c/p>  \u003ch3>Plano de ação escrito\u003c/h3> \u003cp>Todo asmático deve ter um plano de ação escrito, entregue pelo prescritor, que diga: quais são os medicamentos de manutenção e de alívio, como reconhecer a piora (mais sintomas, mais uso do alívio, despertar noturno, queda do pico de fluxo), o que fazer em casa e quando procurar atendimento. O farmacêutico pode pedir para ver o plano, reforçar as etapas e anotar no verso o limite diário do alívio.\u003c/p> \u003ch3>Criança de até 5 anos\u003c/h3> \u003cp>Pelo PCDT da Asma (2026), todas as crianças com asma ou suspeita usam SABA inalatório para alívio, com espaçador e máscara. Corticoide inalatório diário em dose baixa é indicado quando há sintomas mais de duas vezes por semana ou crise grave com atendimento não programado no último ano. Os sinais iniciais de crise na criança pequena são mais tosse (sobretudo à noite), cansaço, menos atividade, piora na alimentação e pouca resposta ao SABA. Os cuidadores devem procurar atendimento se a criança estiver prostrada, não responder ou piorar (principalmente abaixo de 1 ano), se precisar de 4 jatos ou mais de SABA em 4 horas ou de SABA em mais de 3 ocasiões nas primeiras 12 horas. O protocolo não recomenda que os cuidadores iniciem corticoide oral por conta própria.\u003c/p> \u003ch3>Gestante\u003c/h3> \u003cp>Na gestação, SABA, LABA e corticoide inalatório são considerados seguros e o tratamento não deve ser reduzido como prioridade (PCDT da Asma, 2026). Crise em gestante deve ser tratada cedo, porque a falta de oxigênio prejudica o feto.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Asmático comprando só \"bombinha de alívio\" deve ouvir que tratamento só com SABA não é recomendado e ser encaminhado para iniciar corticoide inalatório. Verifique técnica, se há plano de ação escrito e se o paciente sabe o limite diário do budesonida-formoterol. Crise com fala entrecortada, lábios roxos ou sonolência é caso de SAMU.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Estudante de 22 anos compra o terceiro frasco de salbutamol em dois meses e diz que \"só tem asma leve\". O farmacêutico explica que esse consumo indica asma não controlada e risco de crise grave, revisa a técnica com espaçador, entrega orientação por escrito e encaminha à unidade de saúde para iniciar corticoide inalatório, mencionando que o SUS oferece budesonida-formoterol pelo PCDT.\u003c/p>\u003c/div>"},{"id":"m07-dpoc","titulo":"Tratamento da DPOC","resumo":"\u003cp>O tratamento da DPOC tem três objetivos: aliviar a falta de ar, melhorar a tolerância ao esforço e \u003cstrong>prevenir exacerbações\u003c/strong>. A referência internacional é o relatório GOLD, revisado todo ano; a versão 2026 foi publicada em novembro de 2025. No Brasil, o SUS segue o PCDT da DPOC aprovado pela Portaria Conjunta SAES/SCTIE nº 29, de 27 de novembro de 2025, que revogou o protocolo de 2021 (Portaria Conjunta nº 19/2021) e foi adaptado do GOLD 2025.\u003c/p> \u003ch3>Classificação ABE\u003c/h3> \u003cp>O diagnóstico exige espirometria (ou estratégia alternativa quando ela não está disponível, segundo o PCDT). A gravidade da obstrução é graduada de GOLD 1 a 4 pelo VEF1. Para escolher o tratamento, o paciente é classificado em grupos pela intensidade dos sintomas (escala de dispneia mMRC ou questionário CAT) e pelo histórico de exacerbações:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Critério (PCDT 2025)\u003c/th>\u003cth>Tratamento inicial preferencial no SUS\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>A\u003c/td>\u003ctd>Poucos sintomas (mMRC 0 a 1 ou CAT menor que 10) e no máximo 1 exacerbação moderada sem internação no ano\u003c/td>\u003ctd>Broncodilatador de curta ação (SABA ou SAMA) para alívio; considerar LABA se sintomas frequentes\u003c/td>\u003c/tr> \u003ctr>\u003ctd>B\u003c/td>\u003ctd>Mais sintomas (mMRC 2 ou mais ou CAT 10 ou mais) e no máximo 1 exacerbação moderada sem internação\u003c/td>\u003ctd>LAMA + LABA contínuo (umeclidínio + vilanterol) e SABA ou SAMA para alívio\u003c/td>\u003c/tr> \u003ctr>\u003ctd>E\u003c/td>\u003ctd>2 ou mais exacerbações moderadas ou 1 ou mais com internação nos últimos 12 meses, independentemente dos sintomas\u003c/td>\u003ctd>LAMA + LABA (umeclidínio + vilanterol; tiotrópio + olodaterol se GOLD 3 ou 4); terapia tripla quando há indicação de CI\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>O GOLD 2026 ajustou esses critérios: com base em estudos observacionais, passou a considerar que \u003cstrong>uma única exacerbação moderada\u003c/strong> já aumenta o risco de novos eventos e deve levar a considerar a intensificação do tratamento, com a meta de atingir um estado de baixa atividade de doença, sem exacerbações (GOLD 2026, resumo de mudanças de 10/11/2025). O protocolo brasileiro, publicado antes, mantém o critério de 2 exacerbações moderadas ou 1 com internação.\u003c/p> \u003ch3>Quando entra o corticoide inalatório\u003c/h3> \u003cp>Na DPOC, o CI só tem benefício claro em pacientes exacerbadores com eosinófilos altos no sangue e aumenta o risco de pneumonia. Pelo PCDT (2025):\u003c/p> \u003cul> \u003cli>indicar terapia tripla (LAMA + LABA + CI) quando os eosinófilos forem de 300 células/mm³ ou mais, ou entre 100 e 300 com exacerbações frequentes, ou quando as exacerbações persistirem com LAMA + LABA;\u003c/li> \u003cli>evitar CI se eosinófilos abaixo de 100 células/mm³ ou história de pneumonia;\u003c/li> \u003cli>LABA + CI sem LAMA não é recomendado de forma geral; se o CI for indicado, prefere-se a tripla, de preferência em um único dispositivo (furoato de fluticasona + umeclidínio + vilanterol ou beclometasona + formoterol + glicopirrônio).\u003c/li> \u003c/ul> \u003cp>Para pacientes com VEF1 abaixo de 50% e dificuldade com inalador de pó seco, o PCDT recomenda a apresentação em névoa suave de tiotrópio + olodaterol (Respimat), que não depende de fluxo inspiratório forte. O GOLD 2026 também incluiu uma figura sobre a evidência dos imunobiológicos na DPOC com eosinófilos elevados. O dupilumabe tem registro na Anvisa para DPOC com eosinófilos de 300 células/µL ou mais, mas não foi incorporado ao SUS para essa indicação (PCDT da DPOC, 2025).\u003c/p> \u003ch3>Exacerbação\u003c/h3> \u003cp>Exacerbação é a piora aguda da falta de ar, da tosse ou do catarro (mais volume ou mudança de cor) que se instala em até 14 dias (GOLD 2026). O tratamento inclui aumentar o broncodilatador de curta ação e, conforme avaliação médica, corticoide oral por poucos dias e antibiótico quando há sinais de infecção bacteriana. Pelo PCDT, indicam internação: resposta ruim ao tratamento ambulatorial, piora importante da dispneia, prejuízo do sono ou da alimentação, alteração do estado mental e incapacidade de autocuidado. No balcão, a piora da DPOC com confusão, sonolência, lábios roxos ou falta de ar em repouso é urgência.\u003c/p> \u003ch3>Cessação do tabagismo\u003c/h3> \u003cp>Parar de fumar é a intervenção mais eficaz para reduzir a progressão da DPOC e deve ser reforçada em todos os contatos (PCDT, 2025). A abordagem mínima pode ser feita no balcão em poucos minutos: perguntar se fuma, aconselhar a parar, avaliar a disposição, oferecer ajuda e encaminhar ao programa de tratamento do tabagismo do SUS, que oferece abordagem cognitivo-comportamental e, conforme o protocolo de tabagismo vigente, terapia de reposição de nicotina (adesivo, goma, pastilha) e bupropiona. A dependência pode ser avaliada pelo teste de Fagerström.\u003c/p> \u003ch3>Vacinas\u003c/h3> \u003cp>O PCDT da DPOC (2025) preconiza, conforme o Programa Nacional de Imunizações, vacina contra influenza anual para todos os pacientes e vacinas pneumocócicas conjugada 13-valente e polissacarídica 23-valente para pacientes sintomáticos e exacerbadores ou com comorbidades de risco, com intervalo de seis meses começando pela conjugada. O GOLD 2026 atualizou as recomendações de vírus sincicial respiratório (VSR) e influenza e também cita covid-19, coqueluche (dTpa) e herpes-zóster. A disponibilidade de cada vacina no SUS e nos centros de referência deve ser conferida no calendário vigente.\u003c/p> \u003ch3>Medidas não farmacológicas\u003c/h3> \u003cp>Reabilitação pulmonar, atividade física regular, nutrição adequada, oxigenoterapia domiciliar quando indicada e tratamento das comorbidades (doença cardiovascular, ansiedade e depressão, osteoporose, diabetes) fazem parte do cuidado. Paciente em oxigênio domiciliar não pode fumar nem ficar perto de chama.\u003c/p>  \u003ch3>Acesso aos medicamentos\u003c/h3> \u003cp>Beclometasona e salbutamol estão no Programa Farmácia Popular (PCDT da Asma, 2026); o elenco do programa divulgado pelo Ministério da Saúde também lista o brometo de ipratrópio, e a versão vigente deve ser conferida no site do programa. As associações LAMA + LABA e as terapias triplas do PCDT da DPOC (2025) têm critérios próprios de inclusão (por exemplo, tiotrópio + olodaterol e terapia tripla para GOLD 3 ou 4 com perfil exacerbador) e são dispensadas pelo Componente Especializado da Assistência Farmacêutica, de gestão estadual, com laudo de solicitação (LME) e prescrição, conforme o fluxo de cada secretaria. O farmacêutico de drogaria pode orientar o paciente sobre esse caminho quando o custo do inalador impede a adesão.\u003c/p> \u003ch3>Adesão\u003c/h3> \u003cp>Na DPOC, os pacientes são em geral idosos, com várias doenças e muitos medicamentos. Preferir dispositivo único, uma tomada ao dia, mesmo tipo de inalador para todos os fármacos e revisar a técnica em cada visita aumenta a adesão. Interromper o LAMA + LABA porque \"melhorou\" é comum e precisa ser desestimulado: o benefício depende do uso contínuo.\u003c/p>  \u003ch3>Oxigênio domiciliar\u003c/h3> \u003cp>Pacientes com hipoxemia crônica grave podem receber oxigenoterapia domiciliar prolongada, que reduz a mortalidade quando usada muitas horas por dia. Orientações de segurança: não fumar e não permitir que fumem no ambiente, manter o equipamento longe de fogão, velas e aquecedores, não usar cremes à base de petróleo no rosto e seguir exatamente o fluxo prescrito, porque fluxo alto demais pode piorar a retenção de gás carbônico em alguns pacientes.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Fumante acima de 40 anos com tosse e catarro há meses ou falta de ar que piora ao subir escadas deve ser encaminhado para espirometria. Paciente com DPOC deve ter técnica inalatória revisada a cada dispensação, ser lembrado da vacina da gripe e ser perguntado sobre tabagismo em todas as visitas.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhora de 66 anos, ex-tabagista, com DPOC grupo B, chega com receita de umeclidínio + vilanterol e diz que não sente \"o pó\" ao inspirar. O farmacêutico demonstra o Ellipta com o dispositivo de treino: abrir a tampa até o clique, expirar longe do bocal, selar os lábios e inspirar longa e profundamente, segurar a respiração e fechar. Explica que o pó é fino e quase sem sabor e que o contador confirma a dose.\u003c/p>\u003c/div>"},{"id":"m07-tecnica-inalatoria","titulo":"Dispositivos e técnica inalatória","resumo":"\u003cp>O melhor medicamento inalatório não funciona se o paciente usa errado. Estudos mostram que a maioria dos pacientes comete ao menos um erro crítico, e a técnica ruim é uma das principais causas de asma e DPOC não controladas. Ensinar e revisar a técnica é uma das intervenções mais úteis que o farmacêutico pode fazer no balcão, e o PCDT da Asma (2026) recomenda verificar a técnica em toda consulta.\u003c/p> \u003ch3>Tipos de dispositivo\u003c/h3> \u003cul> \u003cli>\u003cb>Aerossol dosimetrado pressurizado\u003c/b> (pMDI, a \"bombinha\"): libera um jato com o fármaco suspenso em propelente. Exige coordenar o disparo com uma inspiração \u003cb>lenta e profunda\u003c/b>. Com espaçador, a coordenação deixa de ser problema.\u003c/li> \u003cli>\u003cb>Inaladores de pó seco\u003c/b> (DPI): o paciente gera o fluxo que dispersa o pó, com uma inspiração \u003cb>rápida e forte\u003c/b>. Não precisam de coordenação, mas exigem força inspiratória e não podem receber o sopro do paciente (a umidade empedra o pó). Exemplos: Turbuhaler, Diskus, Ellipta, inaladores de cápsula (Aerolizer, Breezhaler).\u003c/li> \u003cli>\u003cb>Inalador de névoa suave\u003c/b> (Respimat): solução liberada como névoa lenta, por cerca de 1,5 segundo; exige menos coordenação e não depende de fluxo forte.\u003c/li> \u003cli>\u003cb>Nebulizador\u003c/b>: transforma solução em névoa com ar comprimido ou ultrassom; usado em crise no serviço de saúde, crianças pequenas e pacientes incapazes de usar outros dispositivos.\u003c/li> \u003c/ul> \u003ch3>Espaçador\u003c/h3> \u003cp>O espaçador (ou câmara de inalação) é um tubo acoplado à bombinha. Ele diminui a velocidade das partículas, retém as maiores (que iriam para a garganta), aumenta a deposição no pulmão e elimina a necessidade de coordenar disparo e inspiração. É indicado para crianças, idosos, quem tem dificuldade de coordenação, uso de CI em aerossol e crise de asma. Criança menor de 4 anos usa espaçador com máscara facial bem ajustada. Espaçadores caseiros de garrafa PET são alternativa quando não há outro, conforme orientação do serviço de saúde. O espaçador deve ser lavado com água e detergente neutro e secar ao ar, sem esfregar com pano (a eletricidade estática prende o fármaco nas paredes).\u003c/p> \u003ch3>Passos essenciais em comum\u003c/h3> \u003col> \u003cli>Preparar o dispositivo (agitar o aerossol; carregar a dose no pó seco).\u003c/li> \u003cli>Expirar completamente, \u003cb>longe do bocal\u003c/b>.\u003c/li> \u003cli>Selar os lábios no bocal e inspirar do jeito certo para o dispositivo (lenta no aerossol e Respimat; rápida e forte no pó seco).\u003c/li> \u003cli>Prender a respiração por cerca de 10 segundos ou o máximo confortável.\u003c/li> \u003cli>Expirar devagar; aguardar cerca de 30 a 60 segundos antes de repetir um jato de aerossol.\u003c/li> \u003cli>Após corticoide inalatório, enxaguar a boca e cuspir.\u003c/li> \u003c/ol> \u003ch3>Erros mais comuns por dispositivo\u003c/h3> \u003cul> \u003cli>\u003cb>Aerossol sem espaçador\u003c/b>: disparar antes ou depois de começar a inspirar; inspirar rápido demais; não agitar; disparar dois jatos de uma vez.\u003c/li> \u003cli>\u003cb>Turbuhaler\u003c/b>: não girar a base até o clique nos dois sentidos; segurar na horizontal ao carregar; soprar dentro; inspiração fraca.\u003c/li> \u003cli>\u003cb>Diskus e Ellipta\u003c/b>: abrir e fechar sem inspirar, perdendo a dose; soprar dentro; inclinar o dispositivo depois de carregar.\u003c/li> \u003cli>\u003cb>Cápsula (Aerolizer, Breezhaler)\u003c/b>: engolir a cápsula, não furar, não verificar se a cápsula ficou vazia.\u003c/li> \u003cli>\u003cb>Respimat\u003c/b>: não montar o cartucho corretamente no primeiro uso; não girar a base antes de disparar; apontar para a garganta sem selar os lábios.\u003c/li> \u003c/ul> \u003ch3>Como ensinar no balcão\u003c/h3> \u003col> \u003cli>Pedir ao paciente que \u003cb>mostre\u003c/b> como usa, com o próprio dispositivo ou com o de demonstração.\u003c/li> \u003cli>Elogiar o que está certo e corrigir no máximo dois ou três erros por vez, começando pelos críticos.\u003c/li> \u003cli>Demonstrar em silêncio, devagar, passo a passo.\u003c/li> \u003cli>Pedir que o paciente repita até acertar (método de \"ensinar de volta\").\u003c/li> \u003cli>Entregar instrução escrita ou ilustrada e revisar na próxima visita.\u003c/li> \u003c/ol> \u003cp>Ao escolher ou trocar o dispositivo, pesar a capacidade de fazer inspiração forte (idosos frágeis e pacientes com obstrução grave podem não conseguir usar pó seco), a destreza das mãos (artrite), a visão e a cognição. Evitar dispositivos diferentes para o mesmo paciente sempre que possível, porque as técnicas se misturam.\u003c/p> \u003ch3>Contadores de dose e fim do frasco\u003c/h3> \u003cp>Turbuhaler, Diskus, Ellipta e muitos aerossóis têm contador. No aerossol sem contador, o paciente deve anotar as doses usadas; agitar o frasco e \"ouvir líquido\" engana, porque o propelente continua saindo depois que o fármaco acabou. Boiar o frasco na água é método obsoleto e não deve ser ensinado.\u003c/p>  \u003ch3>Dispositivo por idade\u003c/h3> \u003cul> \u003cli>\u003cb>Até cerca de 4 anos\u003c/b>: aerossol com espaçador e máscara facial; nebulizador quando não for possível.\u003c/li> \u003cli>\u003cb>Dos 4 aos 6 anos\u003c/b>: aerossol com espaçador e bocal, assim que a criança demonstrar técnica adequada.\u003c/li> \u003cli>\u003cb>A partir de 6 anos\u003c/b>: pode-se considerar pó seco, se a criança conseguir inspiração forte; aerossol com espaçador continua sendo opção.\u003c/li> \u003c/ul> \u003cp>O PCDT da Asma (2026) observa que dispositivos de pó não são adequados para a maioria das crianças de até 5 anos e para alguns idosos, e recomenda evitar prescrever aerossol e pó seco ao mesmo tempo para o mesmo paciente.\u003c/p> \u003ch3>Nebulização em casa\u003c/h3> \u003cp>Usar exatamente a dose e o diluente prescritos (em geral soro fisiológico), com máscara bem ajustada ou bocal, respirando normalmente até a névoa acabar (cerca de 10 minutos). Após o uso de antimuscarínico com máscara, proteger os olhos. Lavar copo e máscara com água e detergente, enxaguar e deixar secar ao ar após cada uso, para evitar contaminação.\u003c/p> \u003ch3>Limpeza dos dispositivos\u003c/h3> \u003cp>O bocal do aerossol pode ser lavado com água morna depois de retirado o frasco, e deve secar bem antes de recolocar. Inaladores de pó seco nunca devem ser lavados: limpa-se o bocal com pano seco. O Respimat é limpo com pano úmido no bocal, sem mergulhar.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Toda primeira dispensação de inalatório deve incluir demonstração. Nas seguintes, peça ao paciente que mostre o uso; muitos erram depois de meses. Se o paciente não consegue fazer inspiração forte, informe o prescritor e sugira a discussão de aerossol com espaçador ou Respimat.\u003c/p>\u003c/div>"},{"id":"m07-antileucotrienos","titulo":"Antileucotrienos, cromonas e imunobiológicos","resumo":"\u003ch3>Montelucaste\u003c/h3> \u003cp>O montelucaste bloqueia o receptor de leucotrienos cisteinílicos (CysLT1), reduzindo broncoconstrição, edema e muco. É oral, uma vez ao dia, à noite: 10 mg para adultos e adolescentes a partir de 15 anos, 5 mg em comprimido mastigável dos 6 aos 14 anos e 4 mg (mastigável ou sachê) dos 2 aos 5 anos, conforme a bula (Singulair®, bula FDA/DailyMed, 2025). É de venda sob prescrição (tarja vermelha na lista CMED, out. 2026). Na asma, é menos eficaz que o corticoide inalatório e fica como alternativa ou complemento; na rinite alérgica, é menos eficaz que o corticoide nasal.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Em março de 2020, a FDA exigiu alerta em tarja (boxed warning) sobre eventos neuropsiquiátricos graves com montelucaste: agitação, agressividade, ansiedade, depressão, alterações do sono e pesadelos, sonambulismo, alucinações, problemas de memória e atenção, tiques, gagueira, pensamentos e comportamentos suicidas. A FDA orientou reservar o montelucaste na rinite alérgica para quem não responde ou não tolera outros tratamentos. A agência britânica (MHRA) reforçou o alerta em 2024. Os eventos ocorrem em crianças e adultos, inclusive após a suspensão.\u003c/p>\u003c/div> \u003cp>Orientação ao paciente e à família: observar mudança de humor, sono e comportamento, sobretudo nas primeiras semanas; em caso de alteração, suspender e procurar o médico. O montelucaste não serve para tratar crise.\u003c/p> \u003ch3>Cromonas\u003c/h3> \u003cp>O cromoglicato dissódico estabiliza mastócitos e impede a liberação de mediadores. Tem efeito preventivo, começa a agir em dias e precisa de várias aplicações ao dia. A forma inalatória para asma praticamente saiu de uso por ser menos eficaz que o corticoide inalatório. Persiste a forma oftálmica (conjuntivite alérgica), com excelente segurança, inclusive em crianças e gestantes. A forma nasal, usada na rinite leve em outros países, não consta da lista de preços da CMED de out. 2026.\u003c/p> \u003ch3>Imunobiológicos\u003c/h3> \u003cp>São anticorpos monoclonais injetáveis para asma grave não controlada apesar de tratamento otimizado (etapa 5), indicados por especialista conforme o fenótipo:\u003c/p> \u003cul> \u003cli>\u003cb>Anti-IgE\u003c/b>: omalizumabe (asma alérgica grave).\u003c/li> \u003cli>\u003cb>Anti-IL-5 ou anti-receptor de IL-5\u003c/b>: mepolizumabe, benralizumabe (asma eosinofílica grave); a GINA 2026 incluiu o depemoquimabe, de aplicação semestral, para 12 anos ou mais (Densurko®, já na lista de preços da CMED).\u003c/li> \u003cli>\u003cb>Anti-receptor de IL-4\u003c/b>: dupilumabe (asma tipo 2 grave; também usado em dermatite atópica e, em outros países, na DPOC eosinofílica).\u003c/li> \u003cli>\u003cb>Anti-TSLP\u003c/b>: tezepelumabe.\u003c/li> \u003c/ul> \u003cp>Pelo PCDT da Asma (2026), o SUS oferece omalizumabe, mepolizumabe (com ampliação para crianças de 6 a 11 anos), benralizumabe e dupilumabe, pelo Componente Especializado da Assistência Farmacêutica. São medicamentos de cadeia fria e de dispensação especializada.\u003c/p>  \u003ch3>Detalhes práticos do montelucaste\u003c/h3> \u003cp>O comprimido mastigável contém aspartame, fonte de fenilalanina, e não deve ser usado em pessoas com fenilcetonúria sem orientação. O sachê pode ser misturado a alimento pastoso frio ou em temperatura ambiente e deve ser tomado em até 15 minutos depois de aberto (bula FDA/DailyMed, 2025). Interações relevantes são poucas; indutores enzimáticos como fenobarbital e rifampicina reduzem o nível. Pelo PCDT da Asma (2026), os antagonistas de leucotrienos são considerados seguros na gestação quando necessários, mas não estão incorporados ao SUS para asma.\u003c/p> \u003cp>O montelucaste tem algum papel na prevenção do broncoespasmo induzido por exercício e na asma com doença respiratória exacerbada por AINE, sempre como complemento e por decisão do prescritor.\u003c/p>  \u003ch3>Imunobiológicos na prática\u003c/h3> \u003cp>São medicamentos termolábeis: armazenamento entre 2 e 8 °C, sem congelar, e transporte em caixa térmica com gelo reciclável sem contato direto com a embalagem. A aplicação é subcutânea, a cada 2 a 8 semanas conforme o fármaco. Pelo PCDT da Asma (2026), as três primeiras doses de omalizumabe devem ser aplicadas por profissional de saúde ou sob sua supervisão, com suporte para tratar anafilaxia; depois, pode haver orientação médica para autoaplicação. O imunobiológico não substitui o inalador: o paciente continua com corticoide inalatório e medicamento de alívio.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar montelucaste, pergunte quem usa (criança, adolescente), explique o horário noturno e oriente os familiares a observar sono, humor e comportamento. Se o motivo da prescrição for apenas rinite, lembre o paciente de que há alternativas mais eficazes e mais seguras para discutir com o médico.\u003c/p>\u003c/div>"},{"id":"m07-rinite-tosse","titulo":"Rinite alérgica e tosse","resumo":"\u003ch3>Classificação da rinite alérgica\u003c/h3> \u003cp>A classificação ARIA divide a rinite pela duração (intermitente: menos de 4 dias por semana ou menos de 4 semanas seguidas; persistente: mais que isso) e pela gravidade (leve: não atrapalha sono, trabalho, escola ou lazer; moderada a grave: atrapalha). Essa classificação orienta a escolha:\u003c/p> \u003cul> \u003cli>\u003cb>Intermitente leve\u003c/b>: anti-H1 oral de segunda geração ou anti-H1 nasal, lavagem nasal, controle ambiental.\u003c/li> \u003cli>\u003cb>Persistente ou moderada a grave\u003c/b>: \u003cstrong>corticoide nasal\u003c/strong> é o tratamento mais eficaz, inclusive para obstrução; pode ser associado a anti-H1.\u003c/li> \u003c/ul> \u003ch3>Anti-histamínicos H1\u003c/h3> \u003cp>Os anti-H1 aliviam espirros, coriza e coceira, mas têm pouco efeito sobre a obstrução nasal. Os de segunda geração (loratadina, desloratadina, cetirizina, fexofenadina, bilastina, rupatadina) causam menos sonolência e são preferidos aos de primeira geração (dexclorfeniramina, prometazina), que sedam, prejudicam a atenção e a direção de veículos e têm efeito anticolinérgico (boca seca, retenção urinária, constipação). A cetirizina ainda pode dar sonolência em parte dos usuários. A idade mínima varia conforme o fármaco e a apresentação.\u003c/p> \u003cp>Condição de venda: loratadina, desloratadina, cetirizina e fexofenadina têm apresentações sem tarja (isentas de prescrição) na lista de preços da CMED de 09/10/2026; bilastina, rupatadina, azelastina nasal e os corticoides nasais aparecem com tarja vermelha. Confira sempre a embalagem do produto dispensado.\u003c/p> \u003ch3>Corticoide nasal\u003c/h3> \u003cp>Budesonida, beclometasona, propionato e furoato de fluticasona, furoato de mometasona e triancinolona são os mais usados. O efeito começa em horas, mas o benefício completo leva dias a 2 semanas de uso regular, o que precisa ser explicado para o paciente não abandonar. Absorção sistêmica é baixa; os efeitos adversos mais comuns são ressecamento, ardor e pequenos sangramentos nasais. A idade mínima varia conforme o produto e deve ser conferida na bula.\u003c/p> \u003cp>Técnica: assoar o nariz; agitar o frasco; inclinar levemente a cabeça para a frente; usar a mão direita para a narina esquerda e vice-versa, apontando o jato para a parede lateral do nariz (em direção ao canto do olho), longe do septo; inspirar suavemente, sem fungar forte; limpar o bico. Apontar para o septo causa sangramento e, raramente, perfuração.\u003c/p> \u003ch3>Descongestionantes\u003c/h3> \u003cp>Os descongestionantes tópicos (nafazolina, oximetazolina) são agonistas alfa-adrenérgicos que contraem os vasos da mucosa e desentopem o nariz em minutos. O uso prolongado causa congestão de rebote e \u003cstrong>rinite medicamentosa\u003c/strong>: o nariz entope quando o efeito passa, o paciente reaplica e cria dependência. As bulas de nafazolina nasal (Neosoro®, Multisoro®) orientam não usar por mais de \u003cstrong>3 a 5 dias\u003c/strong>. As apresentações de uso adulto de nafazolina são contraindicadas para menores de 12 anos (mesmas bulas), e esses produtos estão entre causas frequentes de intoxicação em crianças (sonolência, bradicardia, hipotermia, hipotensão ou hipertensão, até coma). Também devem ser evitados em hipertensão não controlada, doença coronariana, glaucoma de ângulo fechado e em usuários de inibidores da MAO. As bulas de nafazolina nasal consultadas trazem a frase \"venda sob prescrição médica\"; na lista da CMED (out. 2026) há apresentações de nafazolina com e sem tarja, e a oximetazolina nasal aparece com tarja vermelha. Por isso, a condição de venda deve ser conferida na embalagem de cada produto.\u003c/p> \u003cp>Descongestionantes orais (pseudoefedrina e fenilefrina, comuns em antigripais) causam taquicardia, aumento da pressão, insônia e retenção urinária. Em 2023, um comitê consultivo da FDA concluiu que a fenilefrina oral nas doses usuais não é eficaz como descongestionante.\u003c/p> \u003ch3>Lavagem nasal\u003c/h3> \u003cp>A lavagem com soro fisiológico (cloreto de sódio 0,9%) ou solução salina hipertônica remove alérgenos, secreção e mediadores, melhora sintomas e reduz a necessidade de medicamentos. É segura em todas as idades, inclusive em gestantes e lactentes. Em adultos, volumes maiores (seringa ou frasco próprio) limpam melhor que gotas; em bebês, gotas ou pequenos volumes com o bebê de lado. Solução caseira exige água fervida ou filtrada e utensílios limpos.\u003c/p> \u003ch3>Tosse\u003c/h3> \u003cp>Tosse é um reflexo de defesa que limpa a via aérea. Ela é classificada pela duração:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Duração\u003c/th>\u003cth>Causas frequentes\u003c/th>\u003cth>Conduta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Aguda\u003c/td>\u003ctd>Menos de 3 semanas\u003c/td>\u003ctd>Resfriado e outras infecções virais\u003c/td>\u003ctd>Medidas gerais; autolimitada\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Subaguda\u003c/td>\u003ctd>3 a 8 semanas\u003c/td>\u003ctd>Tosse pós-infecciosa, coqueluche\u003c/td>\u003ctd>Avaliação médica se persistir ou piorar\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Crônica\u003c/td>\u003ctd>Mais de 8 semanas\u003c/td>\u003ctd>Rinite e gotejamento pós-nasal, asma, refluxo, IECA, tabagismo, DPOC\u003c/td>\u003ctd>Encaminhar para investigação\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Pessoa com tosse por 3 semanas ou mais é considerada sintomática respiratória e deve ser avaliada para tuberculose pela unidade de saúde. Outros sinais de alarme: falta de ar, chiado, febre alta ou por mais de 3 dias, sangue no escarro, perda de peso, dor no peito, tosse em bebê, tosse em acessos com guincho ou vômito (coqueluche).\u003c/p> \u003ch3>Antitussígenos, expectorantes e mucolíticos\u003c/h3> \u003cul> \u003cli>\u003cb>Antitussígenos de ação central\u003c/b>: dextrometorfano (pode causar síndrome serotoninérgica com ISRS, IMAO e outros serotoninérgicos; potencial de abuso em doses altas) e codeína (opioide, sujeita a controle especial; módulo 2). A EMA (2015) contraindicou codeína para tosse em menores de 12 anos e a FDA (2017) fez o mesmo, pelo risco de depressão respiratória em metabolizadores ultrarrápidos do CYP2D6. No Brasil, a lista de preços da CMED (out. 2026) traz a codeína apenas em comprimidos (isolada ou associada), com retenção de receita, e nenhum xarope antitussígeno com codeína.\u003c/li> \u003cli>\u003cb>Antitussígenos de ação periférica\u003c/b>: levodropropizina e dropropizina.\u003c/li> \u003cli>\u003cb>Expectorantes\u003c/b>: guaifenesina, que aumentaria o volume da secreção; evidência fraca.\u003c/li> \u003cli>\u003cb>Mucolíticos\u003c/b>: acetilcisteína, carbocisteína, ambroxol e bromexina alteram a viscosidade do muco. Na tosse aguda do resfriado, a evidência de benefício é limitada. Na DPOC, o prescritor pode usá-los para reduzir exacerbações em pacientes selecionados.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Acetilcisteína e carbocisteína são contraindicadas em menores de 2 anos pelas bulas, porque o lactente não consegue expectorar o muco fluidificado e pode ter piora respiratória; o ambroxol nessa idade só com prescrição; xaropes de hera (\u003ci>Hedera helix\u003c/i>) também são contraindicados em menores de 2 anos. Associar antitussígeno (que suprime a tosse) com expectorante ou mucolítico (que aumenta a secreção a ser eliminada) é combinação sem lógica.\u003c/p>\u003c/div> \u003cp>Para tosse aguda de resfriado em adulto, nenhum xarope tem benefício consistente. Hidratação, mel (somente acima de 1 ano, pelo risco de botulismo no lactente), pastilhas, lavagem nasal e tratar a rinite associada costumam bastar. Em criança pequena com resfriado, antigripais e antitussígenos não são recomendados: a FDA desaconselha esses produtos de venda livre em menores de 2 anos desde 2008. Tosse seca persistente em usuário de IECA (enalapril, captopril) é efeito adverso conhecido e pede contato com o prescritor, que pode trocar por um BRA.\u003c/p>  \u003ch3>Controle ambiental\u003c/h3> \u003cp>Medidas que ajudam na rinite e na asma alérgica: reduzir poeira e ácaros (capas impermeáveis em colchão e travesseiro, lavar roupa de cama semanalmente, retirar tapetes, cortinas e bichos de pelúcia do quarto), controlar mofo e umidade, evitar fumaça de cigarro, incensos e produtos de limpeza com cheiro forte. O efeito isolado de cada medida é modesto; o conjunto e o tratamento medicamentoso trazem o controle.\u003c/p> \u003ch3>Rinossinusite e quando encaminhar\u003c/h3> \u003cp>A maioria das rinossinusites agudas é viral e melhora em 7 a 10 dias com lavagem nasal e analgésico. Sugerem quadro bacteriano ou complicação: sintomas por mais de 10 dias sem melhora, febre alta com secreção purulenta e dor facial por 3 a 4 dias seguidos, piora depois de uma melhora inicial, dor ou inchaço ao redor dos olhos, alteração da visão, dor de cabeça intensa ou rigidez de nuca. Nesses casos, encaminhar; antibiótico só com prescrição.\u003c/p> \u003ch3>Rinite na gestação\u003c/h3> \u003cp>Congestão nasal é comum na gravidez mesmo sem alergia. Lavagem nasal é a primeira medida. Descongestionantes orais devem ser evitados, principalmente no primeiro trimestre, e os tópicos só por poucos dias com orientação. Corticoide nasal e anti-H1 de segunda geração ficam a critério do prescritor; a budesonida é o corticoide nasal com mais dados na gestação.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de qualquer xarope, pergunte idade, duração, se a tosse é seca ou com catarro, febre, falta de ar, chiado, tabagismo e medicamentos em uso (IECA, ISRS). Em adulto com resfriado, priorize medidas gerais e lavagem nasal. Em criança menor de 2 anos, não dispense mucolítico, antitussígeno ou antigripal sem prescrição. Tosse há 3 semanas ou mais vai para a unidade de saúde.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhor de 58 anos pede xarope para tosse seca que começou há dois meses. Usa enalapril há três meses e nega febre e falta de ar. O farmacêutico relaciona a tosse ao IECA, explica que nenhum xarope resolve esse caso e encaminha ao médico com uma nota sugerindo a avaliação da troca do anti-hipertensivo, orientando não suspender o enalapril por conta própria.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m07-mapa-farmacos","titulo":"Broncodilatadores e corticoides inalatórios","centro":"Fármacos respiratórios","ramos":[{"t":"SABA","itens":["Salbutamol, fenoterol: 3 a 5 min, 4 a 6 h","Alívio; agitar antes de cada jato","Mais de 3 frascos/ano: asma descontrolada","Tremor, taquicardia, hipocalemia"]},{"t":"LABA","itens":["Formoterol: início rápido, 12 h","Salmeterol: início lento, 12 h","Vilanterol, indacaterol, olodaterol: 24 h","Na asma, nunca sem corticoide inalatório"]},{"t":"Antimuscarínicos","itens":["SAMA: ipratrópio, 6 a 8 h","LAMA: tiotrópio, glicopirrônio, umeclidínio","Base da DPOC","Boca seca, retenção urinária, glaucoma"]},{"t":"Corticoide inalatório","itens":["Beclometasona, budesonida, fluticasona","Efeito em dias a semanas","Enxaguar a boca e cuspir","Candidíase oral, rouquidão","DPOC: risco de pneumonia"]},{"t":"Associações","itens":["CI-formoterol: único que serve de alívio","CI-salmeterol e CI-vilanterol: só manutenção","LAMA-LABA: DPOC","Tripla: DPOC exacerbadora com eosinófilos"]},{"t":"Teofilina","itens":["Índice terapêutico estreito","Ciprofloxacino e claritromicina sobem nível","Parar de fumar sobe nível","Náusea, arritmia, convulsão"]}]},{"id":"m07-mapa-asma-dpoc","titulo":"Asma e DPOC: tratamento atual","centro":"Asma e DPOC","ramos":[{"t":"Asma: princípios","itens":["Todo asmático usa corticoide inalatório","SABA isolado não é recomendado","Prioridade: evitar crise grave","1 crise com corticoide oral = revisar (GINA 2026)"]},{"t":"Asma: regime 1","itens":["Etapas 1 e 2: budesonida-formoterol se sintoma","Etapas 3 a 5: MART, mesmo inalador","Máximo 12 inalações/dia de 200/6 mcg","PCDT 2026: Portaria Conjunta 43/2026"]},{"t":"Asma: crise","itens":["SABA 4 a 10 jatos com espaçador, 20/20 min","Fala entrecortada ou lábio roxo: 192","Prednisona 40 a 50 mg por 5 a 7 dias","Retorno em 2 a 7 dias"]},{"t":"DPOC: grupos","itens":["A: pouco sintoma, até 1 exacerbação moderada","B: mais sintomas: LAMA + LABA","E: exacerbador: LAMA + LABA, talvez tripla","GOLD 2026: 1 exacerbação moderada já pesa"]},{"t":"DPOC: corticoide","itens":["Eosinófilos 300/mm³ ou mais: tripla","Menos de 100/mm³ ou pneumonia: evitar CI","LABA + CI sem LAMA: não preferido"]},{"t":"DPOC: além do remédio","itens":["Parar de fumar muda a história","Influenza anual e pneumocócicas","Reabilitação e atividade física","PCDT 2025: Portaria Conjunta 29/2025"]}]},{"id":"m07-mapa-dispositivos","titulo":"Dispositivos e técnica inalatória","centro":"Técnica inalatória","ramos":[{"t":"Aerossol (pMDI)","itens":["Agitar antes de cada jato","Inspiração lenta e profunda","Espaçador: dispensa coordenação","Erro: disparar fora da inspiração"]},{"t":"Pó seco (DPI)","itens":["Inspiração rápida e forte","Nunca soprar dentro","Turbuhaler: girar até o clique","Diskus e Ellipta: abriu, inalou"]},{"t":"Cápsula","itens":["Aerolizer, Breezhaler","Cápsula é para inalar, não engolir","Furar e conferir se esvaziou"]},{"t":"Respimat e nebulizador","itens":["Respimat: névoa lenta, menos força","Bom para VEF1 baixo","Nebulizador: crise, criança pequena"]},{"t":"Passos comuns","itens":["Expirar longe do bocal","Prender a respiração por cerca de 10 s","Corticoide: enxaguar e cuspir","Conferir o contador de doses"]},{"t":"Ensinar","itens":["Pedir para o paciente mostrar","Corrigir até 3 erros por vez","Paciente repete até acertar","Revisar em toda dispensação"]}]}],"apoio":[{"tipo":"tabela","id":"m07-tab-dispositivos","titulo":"Dispositivos inalatórios","colunas":["Dispositivo","Exemplos de medicamentos no Brasil","Como usar (passos)","Erro mais comum"],"linhas":[["Aerossol dosimetrado (pMDI) sem espaçador","Salbutamol, fenoterol, ipratrópio, beclometasona, fluticasona + salmeterol, beclometasona + formoterol + glicopirrônio","Agitar; expirar; bocal nos lábios; iniciar inspiração lenta e disparar; continuar inspirando; prender 10 s","Falta de coordenação entre disparo e inspiração"],["Aerossol com espaçador","Os mesmos aerossóis; preferido em crianças, idosos e na crise","Agitar; acoplar; expirar; disparar 1 jato; inspirar lenta e profundamente (ou 4 a 6 respirações em volume corrente com máscara)","Disparar vários jatos de uma vez na câmara"],["Turbuhaler (pó seco)","Budesonida + formoterol (Symbicort® Turbuhaler)","Desrosquear; em pé, girar a base para um lado e voltar até o clique; expirar fora; inspirar rápido e forte; prender","Carregar na horizontal ou inspirar fraco"],["Diskus (pó seco)","Fluticasona + salmeterol em pó (Seretide®)","Abrir; empurrar a alavanca até o clique; expirar fora; inspirar rápido e forte; prender; fechar","Soprar dentro ou mexer na alavanca sem inalar"],["Cápsula (Aerolizer, Breezhaler)","Formoterol, budesonida, budesonida + formoterol em cápsulas; indacaterol, glicopirrônio, indacaterol + glicopirrônio","Abrir; colocar a cápsula; furar uma vez; expirar fora; inspirar rápido e forte; conferir cápsula vazia","Engolir a cápsula ou não furar"],["Ellipta (pó seco)","Umeclidínio + vilanterol; fluticasona furoato + vilanterol; fluticasona furoato + umeclidínio + vilanterol","Abrir a tampa até o clique; expirar fora; selar lábios sem tapar a entrada de ar; inspirar longa e profundamente; prender; fechar","Abrir e fechar sem inalar, perdendo a dose"],["Respimat (névoa suave)","Tiotrópio; tiotrópio + olodaterol","Tampa fechada, girar a base meia volta; abrir; expirar; selar lábios; iniciar inspiração lenta e apertar; prender","Não girar a base ou não montar o cartucho"],["Nebulizador","Salbutamol e ipratrópio em solução; budesonida em suspensão","Diluir conforme prescrição; máscara ou bocal; respirar normalmente até acabar; limpar e secar","Usar soro sem medicamento achando que trata a crise"]],"nota":"Marcas e apresentações conferidas na lista de preços de medicamentos da CMED/Anvisa publicada em 09/10/2026 (Symbicort® Turbuhaler; Seretide® em pó em tiras de 28 ou 60 doses). Fenoterol em solução para nebulização não consta dessa lista. A oferta em cada farmácia varia."},{"tipo":"checklist","id":"m07-check-espacador","titulo":"Técnica: aerossol com espaçador","itens":["Retirar a tampa e conferir se o bocal está limpo","Agitar o aerossol por alguns segundos","Acoplar o aerossol ao espaçador na posição vertical","Expirar completamente, longe do bocal","Selar os lábios no bocal (ou ajustar bem a máscara no rosto da criança)","Disparar um único jato","Inspirar lenta e profundamente e prender a respiração por cerca de 10 segundos (ou 4 a 6 respirações com máscara)","Esperar 30 a 60 segundos e agitar de novo antes do próximo jato","Após corticoide inalatório, enxaguar a boca e cuspir","Lavar o espaçador com detergente neutro e deixar secar ao ar"]},{"tipo":"checklist","id":"m07-check-po","titulo":"Técnica: inalador de pó seco","itens":["Carregar a dose conforme o dispositivo (girar, abrir, deslizar ou furar a cápsula)","Manter o dispositivo na posição indicada depois de carregar","Expirar completamente, longe do bocal (nunca soprar dentro)","Selar os lábios no bocal","Inspirar de forma rápida, forte e profunda desde o início","Prender a respiração por cerca de 10 segundos","Fechar o dispositivo e guardar em local seco","Conferir o contador de doses ou se a cápsula ficou vazia","Após corticoide inalatório, enxaguar a boca e cuspir"]},{"tipo":"tabela","id":"m07-tab-farmacos","titulo":"Fármacos respiratórios","colunas":["Classe","Exemplos","Início / duração","Uso","Efeito adverso"],"linhas":[["SABA","Salbutamol, fenoterol","3 a 5 min / 4 a 6 h","Alívio; crise; antes do exercício","Tremor, taquicardia, hipocalemia"],["LABA","Formoterol, salmeterol","Formoterol minutos, salmeterol 10 a 20 min / 12 h","Manutenção com CI (asma) ou LAMA (DPOC)","Tremor, palpitação"],["LABA 24 h","Vilanterol, indacaterol, olodaterol","Minutos / 24 h","Associações de uso diário","Tremor, tosse"],["SAMA","Ipratrópio","15 a 30 min / 6 a 8 h","Alívio na DPOC; crise grave com SABA","Boca seca, gosto metálico"],["LAMA","Tiotrópio, glicopirrônio, umeclidínio","30 min / 24 h","Manutenção na DPOC; asma grave","Boca seca, retenção urinária, glaucoma"],["Corticoide inalatório","Beclometasona, budesonida, fluticasona, mometasona","Dias / efeito máximo em semanas","Base da asma; DPOC exacerbadora com eosinófilos","Candidíase oral, disfonia; pneumonia na DPOC"],["Antileucotrieno","Montelucaste","Horas / 24 h","Alternativa na asma e rinite","Eventos neuropsiquiátricos (alerta FDA 2020)"],["Metilxantina","Teofilina, aminofilina","Horas / 12 a 24 h (liberação prolongada)","Raro; terceira linha","Náusea, arritmia, convulsão; muitas interações"],["Corticoide oral","Prednisona, prednisolona","Horas / dias","Crise de asma e exacerbação de DPOC","Hiperglicemia, insônia, aumento da PA"]],"nota":"Condição de venda: todos os itens desta tabela são de venda sob prescrição médica (tarja vermelha na lista de preços da CMED de 09/10/2026). Ciclesonida inalatória não consta dessa lista no Brasil. Início e duração são aproximados; conferir a bula do produto."},{"tipo":"tabela","id":"m07-tab-rinite","titulo":"Rinite e tosse: o que usar e quando evitar","colunas":["Produto","Para que serve","Limite ou cuidado","Venda (CMED, out. 2026)"],"linhas":[["Soro fisiológico nasal","Limpeza, alívio, reduz necessidade de remédio","Seguro em todas as idades","Em geral sem receita"],["Corticoide nasal","Rinite persistente ou moderada a grave, inclusive obstrução","Efeito pleno em dias; jato para a lateral","Sob prescrição (tarja vermelha)"],["Anti-H1 oral de 2ª geração","Espirros, coriza, prurido","Pouco efeito na obstrução","Loratadina, desloratadina, cetirizina, fexofenadina: há apresentações sem tarja; bilastina e rupatadina: sob prescrição"],["Descongestionante tópico","Desentupir por curto período","No máximo 3 a 5 dias; nafazolina adulto: contraindicada abaixo de 12 anos (bula)","Conferir a embalagem; bulas de nafazolina trazem venda sob prescrição"],["Descongestionante oral","Congestão em antigripais","Hipertensão, arritmia, glaucoma, próstata; fenilefrina oral pouco eficaz","Pseudoefedrina: tarja vermelha; fenilefrina em antigripais: em geral sem tarja"],["Antitussígeno","Tosse seca que impede o sono","Codeína: contraindicada abaixo de 12 anos (EMA 2015, FDA 2017); dextrometorfano com ISRS: risco","Dropropizina: sem tarja; levodropropizina: tarja vermelha; codeína: retenção de receita"],["Mucolítico","Secreção espessa","Acetilcisteína e carbocisteína: contraindicadas abaixo de 2 anos","Ambroxol, bromexina, carbocisteína: em geral sem tarja; acetilcisteína: varia"]],"nota":"Condição de venda conforme a coluna de tarja da lista de preços da CMED publicada em 09/10/2026; a regra vale para a apresentação, por isso confira a embalagem."},{"tipo":"fluxo","id":"m07-fluxo-falta-ar","titulo":"Cliente com falta de ar ou chiado no balcão","passos":[{"t":"Cliente relata falta de ar, chiado ou aperto no peito","tipo":"inicio"},{"t":"Há sinais de gravidade: fala por palavras, lábios roxos, sonolência ou confusão, esforço intenso para respirar, dor no peito, inchaço de lábios ou língua?","tipo":"decisao","sim":"Acionar SAMU (192), manter sentado, não deixar sozinho","nao":"Seguir a avaliação"},{"t":"Há urticária, inchaço ou exposição recente a alérgeno conhecido?","tipo":"decisao","sim":"Suspeitar de anafilaxia: SAMU e adrenalina antes do broncodilatador","nao":"Seguir a avaliação"},{"t":"É asmático ou tem DPOC com plano de ação e medicamento de alívio próprio?","tipo":"decisao","sim":"Orientar o alívio do plano (SABA com espaçador ou budesonida-formoterol, respeitando o limite)","nao":"Primeiro episódio ou causa desconhecida: encaminhar para atendimento no mesmo dia"},{"t":"Conferir a técnica inalatória e usar espaçador se houver","tipo":"acao"},{"t":"Melhorou de forma sustentada em até 1 hora?","tipo":"decisao","sim":"Orientar consulta em poucos dias para revisar o tratamento de manutenção","nao":"Encaminhar para pronto atendimento imediatamente"},{"t":"Perguntar quantas vezes usou alívio na semana e se usa corticoide inalatório","tipo":"acao"},{"t":"Usa só SABA ou compra muitos frascos: risco de crise grave","tipo":"alerta"},{"t":"Registrar o atendimento e encaminhar por escrito ao médico","tipo":"fim"}]},{"tipo":"cartoes","id":"m07-cartoes","titulo":"Cartões de revisão","itens":[{"f":"Qual receptor o salbutamol estimula?","v":"Beta-2 adrenérgico do músculo liso brônquico."},{"f":"Qual LABA pode ser usado como alívio?","v":"Formoterol, sempre associado a corticoide inalatório."},{"f":"Tratar asma só com SABA é recomendado?","v":"Não; aumenta o risco de crise grave e morte (GINA; PCDT da Asma 2026)."},{"f":"Limite diário de budesonida-formoterol 200/6 mcg no regime MART/AIR?","v":"12 inalações (72 mcg de formoterol), segundo o PCDT da Asma 2026."},{"f":"Consumo de SABA que indica asma descontrolada?","v":"Mais de 3 frascos de 200 doses por ano."},{"f":"Que portaria aprovou o PCDT da Asma vigente?","v":"Portaria Conjunta SAES/SCTIE nº 43, de 24/03/2026."},{"f":"Que portaria aprovou o PCDT da DPOC vigente?","v":"Portaria Conjunta SAES/SCTIE nº 29, de 27/11/2025."},{"f":"Tratamento inicial preferencial da DPOC grupo B no SUS?","v":"LAMA + LABA: umeclidínio + vilanterol."},{"f":"Quando considerar corticoide inalatório na DPOC?","v":"Exacerbador com eosinófilos de 300/mm³ ou mais (ou 100 a 300 com exacerbações frequentes)."},{"f":"O que mudou no GOLD 2026 sobre exacerbações?","v":"Uma única exacerbação moderada já deve levar a considerar intensificar o tratamento."},{"f":"Como prevenir candidíase pelo corticoide inalatório?","v":"Enxaguar a boca e cuspir após o uso; usar espaçador com aerossol."},{"f":"Tipo de inspiração no inalador de pó seco?","v":"Rápida, forte e profunda, sem soprar dentro do dispositivo."},{"f":"Tipo de inspiração no aerossol?","v":"Lenta e profunda, coordenada com o disparo (ou com espaçador)."},{"f":"Por que parar de fumar altera a teofilina?","v":"O tabaco induz o CYP1A2; ao parar, o nível de teofilina sobe."},{"f":"Alerta da FDA (2020) para montelucaste?","v":"Eventos neuropsiquiátricos graves, inclusive pensamentos suicidas."},{"f":"Prazo máximo de descongestionante nasal tópico?","v":"3 a 5 dias (bulas de nafazolina nasal), pelo risco de rinite medicamentosa."},{"f":"Mucolíticos contraindicados abaixo de 2 anos?","v":"Acetilcisteína e carbocisteína; ambroxol só com prescrição."},{"f":"Tosse por quanto tempo exige avaliação para tuberculose?","v":"3 semanas ou mais (sintomático respiratório)."}]},{"tipo":"questoes","id":"m07-questoes","titulo":"Questões de fixação","itens":[{"p":"Segundo o PCDT da Asma (2026) e a GINA, para um adulto com asma e sintomas 1 a 2 dias por semana, o tratamento preferencial é:","alt":["Budesonida-formoterol em dose baixa quando houver sintomas","Salbutamol quando houver sintomas, sem outro medicamento","Salmeterol isolado duas vezes ao dia, como manutenção contínua","Montelucaste 10 mg à noite como única medicação","Teofilina de liberação prolongada a cada 12 horas"],"c":0,"com":"No regime preferencial (etapas 1 e 2), o alívio é feito com CI-formoterol em dose baixa (estratégia AIR). SABA isolado não é recomendado por aumentar crises graves e morte. LABA isolado na asma é perigoso. Montelucaste é menos eficaz que o CI e teofilina não é opção preferida."},{"p":"Paciente em MART com budesonida-formoterol 200/6 mcg pergunta quantas inalações pode fazer por dia. Pelo PCDT da Asma (2026), o limite total é:","alt":["4 inalações","6 inalações","8 inalações","12 inalações","Sem limite, por conter corticoide"],"c":3,"com":"O Quadro 11 do PCDT da Asma (2026) fixa o máximo de 12 inalações ao dia (72 mcg de formoterol), somando manutenção e alívio. Não há intervalo mínimo entre doses de alívio, mas o teto diário vale sempre; necessidade frequente de muitas doses exige reavaliação médica."},{"p":"Qual associação NÃO deve ser usada como medicamento de alívio na asma?","alt":["Budesonida + formoterol em pó","Fluticasona + salmeterol em pó","Beclometasona + formoterol em aerossol","Budesonida + formoterol em cápsula","Budesonida + formoterol em aerossol"],"c":1,"com":"Só associações com formoterol (início rápido) servem de alívio. O PCDT da Asma (2026) orienta não usar CI-salmeterol como alívio pelo início de ação lento, e CI-vilanterol ou CI-indacaterol pela falta de segurança com uso mais de uma vez ao dia."},{"p":"Paciente de 64 anos, ex-tabagista, com DPOC, falta de ar ao subir uma escada (mMRC 2) e nenhuma exacerbação no último ano. Pelo PCDT da DPOC (2025), o tratamento inicial preferencial é:","alt":["Budesonida + formoterol duas vezes ao dia","Beclometasona isolada duas vezes ao dia","Salbutamol apenas quando necessário","Terapia tripla em dispositivo único","Umeclidínio + vilanterol uma vez ao dia"],"c":4,"com":"Mais sintomas sem exacerbações caracteriza o grupo B, cujo tratamento preferencial no SUS é LAMA + LABA (umeclidínio + vilanterol), com SABA ou SAMA para alívio. CI isolado ou CI-LABA não são preferidos na DPOC; tripla é para exacerbadores com critério de eosinófilos; só SABA é próprio do grupo A."},{"p":"Em paciente com DPOC exacerbador, o corticoide inalatório deve ser evitado quando:","alt":["Os eosinófilos estão acima de 300 células/mm³","As exacerbações continuam com LAMA + LABA","Os eosinófilos estão abaixo de 100 células/mm³","O paciente tem asma associada","O paciente já usa terapia tripla com boa resposta"],"c":2,"com":"O PCDT da DPOC (2025) recomenda evitar CI com eosinófilos abaixo de 100 células/mm³ ou história de pneumonia, pelo pouco benefício e maior risco de pneumonia. Eosinófilos altos, exacerbações persistentes e asma associada favorecem o CI; em quem já responde à tripla, não é preciso nova contagem para manter."},{"p":"Qual erro é típico do uso de inalador de pó seco e compromete a dose?","alt":["Soprar no dispositivo antes de inalar","Inspirar de forma rápida e forte","Fechar o dispositivo depois do uso","Prender a respiração por cerca de 10 segundos","Expirar longe do bocal antes de inalar"],"c":0,"com":"Soprar dentro do inalador de pó seco umedece e dispersa o pó, perdendo a dose. A inspiração rápida e forte é a correta no pó seco (no aerossol é lenta). Fechar, prender a respiração e expirar longe do bocal são passos corretos."},{"p":"Idosa de 80 anos com DPOC grave (VEF1 35%) não consegue gerar fluxo inspiratório forte. O dispositivo mais adequado para o LAMA + LABA, segundo o PCDT da DPOC, é:","alt":["Turbuhaler (pó seco multidose)","Inalador de cápsula (pó seco unidose)","Diskus (pó seco em blíster)","Respimat (névoa suave)","Ellipta (pó seco em blíster)"],"c":3,"com":"O PCDT da DPOC (2025) recomenda a apresentação em névoa suave de tiotrópio + olodaterol para pacientes com VEF1 abaixo de 50% e dificuldade com pó seco. Turbuhaler, cápsula, Diskus e Ellipta são inaladores de pó seco e dependem de inspiração forte."},{"p":"Paciente com DPOC em uso de teofilina parou de fumar há 2 semanas e começou ciprofloxacino. Chega com náusea, vômitos e palpitação. A hipótese mais provável é:","alt":["Exacerbação viral da DPOC com broncoespasmo","Intoxicação por teofilina (nível sérico elevado)","Abstinência de nicotina, sem outra causa","Anafilaxia por alergia ao ciprofloxacino","Efeito adverso sistêmico do corticoide inalatório em uso"],"c":1,"com":"A cessação do tabagismo retira a indução do CYP1A2, e o ciprofloxacino inibe o mesmo citocromo: os dois elevam o nível de teofilina, de índice terapêutico estreito. Náusea, vômitos e arritmia são sinais clássicos de intoxicação; o caso exige atendimento no mesmo dia."},{"p":"Pais relatam que o filho de 8 anos, em uso de montelucaste há 3 semanas, passou a ter pesadelos e irritabilidade. A orientação correta é:","alt":["Manter, pois são efeitos que desaparecem sozinhos","Dobrar a dose para melhorar o controle da asma","Trocar a tomada da noite para a manhã sem avisar o médico","Associar anti-histamínico sedativo para melhorar o sono","Suspender e avisar o médico (evento neuropsiquiátrico)"],"c":4,"com":"A FDA (2020) exige alerta em tarja sobre eventos neuropsiquiátricos com montelucaste (pesadelos, agitação, depressão, ideação suicida) e orienta suspender e procurar o médico se surgirem. Mudar dose ou horário sem orientação e associar sedativo são condutas inadequadas."},{"p":"Cliente de 35 anos usa nafazolina nasal há 3 semanas e diz que o nariz \"entope cada vez mais\". O quadro e a conduta mais adequados são:","alt":["Rinite alérgica sazonal; aumentar a frequência da nafazolina","Sinusite bacteriana; dispensar antibiótico sem receita","Rinite medicamentosa; suspender e encaminhar ao médico","Desvio de septo; usar oximetazolina no lugar da nafazolina","Efeito esperado; manter por mais duas semanas"],"c":2,"com":"O uso de vasoconstritor tópico além de 3 a 5 dias (limite das bulas) causa rebote e rinite medicamentosa. A conduta é suspender, com apoio médico (que pode indicar corticoide nasal e lavagem para a transição). Trocar por outro vasoconstritor mantém o problema; antibiótico exige prescrição."},{"p":"Mãe pede xarope de acetilcisteína para bebê de 14 meses com resfriado e tosse com catarro. A conduta correta é:","alt":["Dispensar acetilcisteína pediátrica na menor dose prevista na bula","Dispensar xarope com codeína para controlar a tosse noturna","Dispensar antigripal infantil com descongestionante e analgésico associado","Não dispensar; orientar soro nasal, hidratação e sinais de alarme","Dispensar xarope adulto de bromexina em dose reduzida para o bebê"],"c":3,"com":"Acetilcisteína e carbocisteína são contraindicadas abaixo de 2 anos pelas bulas (risco de obstrução por secreção que o lactente não expectora). Codeína é contraindicada abaixo de 12 anos (EMA 2015, FDA 2017). Antigripais de venda livre não são recomendados abaixo de 2 anos (FDA 2008). Adaptar xarope adulto para lactente é erro de dose. A conduta é medidas gerais e encaminhamento se houver alarme."}]}],"fontes":["Brasil. Ministério da Saúde. Portaria Conjunta SAES/SCTIE nº 43, de 24 de março de 2026. Aprova o Protocolo Clínico e Diretrizes Terapêuticas da Asma; revoga a Portaria Conjunta SAES/SECTICS/MS nº 32/2023. Relatório de Recomendação Conitec nº 1078/2025. Texto integral conferido em out. 2026. https://www.gov.br/conitec/pt-br/midias/protocolos/2026/asma-portaria-conjunta-saes-sctie-no-43.pdf","Brasil. Ministério da Saúde. Portaria Conjunta SAES/SCTIE nº 29, de 27 de novembro de 2025. Aprova o Protocolo Clínico e Diretrizes Terapêuticas da Doença Pulmonar Obstrutiva Crônica; revoga a Portaria Conjunta nº 19/2021. Relatório de Recomendação Conitec nº 1046/2025. Texto integral conferido em out. 2026. https://www.gov.br/conitec/pt-br/midias/protocolos/pcdt-da-doenca-pulmonar-obstrutiva-cronica","Global Initiative for Asthma (GINA). Summary Guide for Asthma Management and Prevention, 2026 (publicado em jul. 2026), complementar ao 2026 GINA Strategy Report. https://ginasthma.org/2026-gina-summary-guide/","Global Initiative for Chronic Obstructive Lung Disease (GOLD). GOLD Report 2026: Key Changes Summary, 10 nov. 2025; GOLD 2026 Pocket Guide (v1.1, 20 nov. 2025). https://goldcopd.org/2026-gold-report-and-pocket-guide/","Anvisa. Câmara de Regulação do Mercado de Medicamentos (CMED). Lista de preços de medicamentos (PMC), publicada em 09/10/2026: produtos, apresentações e tarja. https://www.gov.br/anvisa/pt-br/assuntos/medicamentos/cmed/precos","FDA/DailyMed. SINGULAIR (montelukast sodium), bula americana (Organon), atualizada em 30 abr. 2025.","FDA. Drug Safety Communication: FDA requires Boxed Warning about serious mental health side effects for asthma and allergy drug montelukast (Singulair). 4 mar. 2020.","MHRA. Montelukast: reminder of the risk of neuropsychiatric reactions. Drug Safety Update, 2024.","European Medicines Agency. Codeine not to be used in children below 12 years for cough and cold (Article 31 referral). EMA, 2015.","Bulas para o paciente de cloridrato de nafazolina 0,5 mg/mL solução nasal: Neosoro® (Neo Química), Multisoro® (Multilab) e Narix® (Cimed), consultadas em out. 2026; bulas de acetilcisteína, carbocisteína e ambroxol (reproduções de bula, out. 2026); Cebrim/CFF, resposta técnica sobre mucolíticos e Hedera helix em menores de 2 anos.","Pizzichini MMM, et al. Recomendações para o manejo da asma da Sociedade Brasileira de Pneumologia e Tisiologia, 2020. J Bras Pneumol. 2020;46(1):e20190307.","Sociedade Brasileira de Pneumologia e Tisiologia. Recomendações para o tratamento farmacológico da DPOC: perguntas e respostas. J Bras Pneumol. 2017;43(4):290-301."]},{"id":"m08","num":8,"titulo":"Interações medicamentosas na atenção básica","escopo":"Mecanismos farmacocinéticos e farmacodinâmicos e os pares de maior risco no balcão (anticoagulantes, cardiovasculares, SNC, anti-infecciosos, endócrinos, alimentos e fitoterápicos), sempre com precipitante, objeto, mecanismo e manejo, conferidos em bulas (FDA e brasileiras), na tabela de inibidores e indutores da FDA e em orientação da FSRH.","cor":"#E8468E","icone":"arrows-exchange","curto":"Interações medicamentosas","topicos":[{"id":"m08-conceitos","titulo":"Conceitos, mecanismos e pacientes de risco","resumo":"\n\u003cp>Interação medicamentosa é a alteração do efeito de um medicamento causada por outro medicamento, por alimento, por bebida, por fitoterápico ou por suplemento usado ao mesmo tempo. Toda interação tem dois papéis. O \u003cstrong>precipitante\u003c/strong> é quem causa a mudança; o \u003cstrong>objeto\u003c/strong> é quem sofre a mudança. Na combinação claritromicina e sinvastatina, a claritromicina é o precipitante (inibe a enzima CYP3A4) e a sinvastatina é o objeto (tem sua exposição aumentada). Descrever a interação sempre nessa ordem evita o erro clássico de dizer que \"um potencializa o outro\" sem saber quem muda o quê.\u003c/p>\n\u003cp>Interação não é sinônimo de proibição. Muitas combinações com interação conhecida são prescritas de propósito (IECA com diurético, por exemplo) e pedem apenas monitoramento. O trabalho do farmacêutico é separar as que exigem ação imediata das que só exigem orientação.\u003c/p>\n\u003ch3>Interações farmacocinéticas\u003c/h3>\n\u003cp>Na interação farmacocinética, o precipitante muda a quantidade do objeto que chega ao local de ação. As vias são as etapas do caminho do fármaco no organismo.\u003c/p>\n\u003ch4>Absorção\u003c/h4>\n\u003cul>\n\u003cli>\u003cb>Quelação e adsorção\u003c/b>: cátions di e trivalentes (cálcio, magnésio, alumínio, ferro, zinco) formam complexos insolúveis com quinolonas, tetraciclinas, levotiroxina e bifosfonatos no intestino. O objeto não é absorvido. O manejo é separar os horários.\u003c/li>\n\u003cli>\u003cb>pH gástrico\u003c/b>: inibidores da bomba de prótons (IBP) e antiácidos elevam o pH do estômago e reduzem a absorção de fármacos que precisam de meio ácido, como sais de ferro, itraconazol em cápsula e a própria levotiroxina.\u003c/li>\n\u003cli>\u003cb>Transportadores intestinais\u003c/b>: a glicoproteína P (P-gp) do enterócito bombeia fármacos de volta para a luz intestinal. Inibir a P-gp aumenta a absorção do objeto (digoxina, dabigatrana); induzi-la reduz.\u003c/li>\n\u003c/ul>\n\u003ch4>Metabolismo\u003c/h4>\n\u003cp>As enzimas do citocromo P450 (CYP) no fígado e no intestino oxidam a maior parte dos fármacos. As isoformas mais importantes no balcão são CYP3A4, CYP2C9, CYP2C19, CYP2D6 e CYP1A2.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Inibição\u003c/b>: o precipitante bloqueia a enzima e o objeto se acumula. O efeito aparece em horas a poucos dias. Exemplo: fluconazol inibe CYP2C9 e eleva a exposição à varfarina, com aumento do INR.\u003c/li>\n\u003cli>\u003cb>Indução\u003c/b>: o precipitante aumenta a síntese da enzima (via receptor nuclear PXR) e o objeto é eliminado mais depressa, com perda de efeito. A indução leva de 1 a 2 semanas para atingir o máximo e também demora semanas para desaparecer após a suspensão. Exemplo: rifampicina induz CYP3A4 e reduz os níveis de etinilestradiol e progestagênios, com risco de falha contraceptiva.\u003c/li>\n\u003cli>\u003cb>Pró-fármacos\u003c/b>: quando o objeto precisa ser ativado pela enzima, a lógica se inverte. Inibir CYP2C19 reduz a formação do metabólito ativo do clopidogrel; inibir CYP2D6 reduz a formação de endoxifeno a partir do tamoxifeno.\u003c/li>\n\u003c/ul>\n\u003ch4>Distribuição\u003c/h4>\n\u003cp>O deslocamento da ligação a proteínas plasmáticas foi muito citado no passado, mas raramente tem relevância clínica isolada, porque a fração livre aumentada também é eliminada mais depressa. Quando uma interação era atribuída a deslocamento (sulfonamidas com varfarina, por exemplo), o mecanismo principal costuma ser inibição enzimática.\u003c/p>\n\u003ch4>Excreção renal\u003c/h4>\n\u003cul>\n\u003cli>\u003cb>Secreção tubular\u003c/b>: trimetoprima e AINE reduzem a secreção renal de metotrexato, que se acumula.\u003c/li>\n\u003cli>\u003cb>Reabsorção de sódio e lítio\u003c/b>: diuréticos tiazídicos, IECA e AINE aumentam a reabsorção proximal de lítio e elevam a litemia.\u003c/li>\n\u003cli>\u003cb>Hemodinâmica renal\u003c/b>: AINE inibem prostaglandinas vasodilatadoras da arteríola aferente; IECA e BRA dilatam a eferente. Juntos, com diurético, reduzem a filtração glomerular.\u003c/li>\n\u003c/ul>\n\u003ch3>Interações farmacodinâmicas\u003c/h3>\n\u003cp>Na interação farmacodinâmica, a concentração do objeto não muda; o que muda é o efeito, porque os dois fármacos agem no mesmo sistema.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Efeito somado ou sinérgico\u003c/b>: dois depressores do sistema nervoso central (benzodiazepínico e opioide), dois fármacos que prolongam o intervalo QT (claritromicina e hidroxicloroquina), dois que elevam o potássio (IECA e espironolactona), dois que aumentam a serotonina (sertralina e tramadol), um anticoagulante e um antiagregante.\u003c/li>\n\u003cli>\u003cb>Antagonismo\u003c/b>: um fármaco se opõe ao efeito do outro. Corticoide eleva a glicemia e antagoniza o antidiabético; AINE retém sódio e antagoniza o anti-hipertensivo; vitamina K da dieta antagoniza a varfarina.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Via\u003c/th>\u003cth>Precipitante típico\u003c/th>\u003cth>Objeto típico\u003c/th>\u003cth>Resultado\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Quelação\u003c/td>\u003ctd>Cálcio, ferro, antiácido\u003c/td>\u003ctd>Quinolona, tetraciclina, levotiroxina\u003c/td>\u003ctd>Menos absorção\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inibição de CYP3A4\u003c/td>\u003ctd>Claritromicina, itraconazol\u003c/td>\u003ctd>Sinvastatina, colchicina\u003c/td>\u003ctd>Mais exposição, toxicidade\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inibição de CYP2C9\u003c/td>\u003ctd>Fluconazol, amiodarona, sulfametoxazol\u003c/td>\u003ctd>Varfarina, sulfonilureias\u003c/td>\u003ctd>Sangramento, hipoglicemia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Indução\u003c/td>\u003ctd>Rifampicina, carbamazepina\u003c/td>\u003ctd>Anticoncepcional, DOAC\u003c/td>\u003ctd>Perda de efeito\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inibição de P-gp\u003c/td>\u003ctd>Amiodarona, verapamil, claritromicina\u003c/td>\u003ctd>Digoxina, dabigatrana\u003c/td>\u003ctd>Mais exposição\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Renal\u003c/td>\u003ctd>Tiazídico, IECA, AINE\u003c/td>\u003ctd>Lítio\u003c/td>\u003ctd>Intoxicação por lítio\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Farmacodinâmica\u003c/td>\u003ctd>Opioide\u003c/td>\u003ctd>Benzodiazepínico\u003c/td>\u003ctd>Depressão respiratória\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Tempo de início e de término\u003c/h3>\n\u003cp>O momento em que a interação aparece depende do mecanismo. A quelação é imediata e some quando os horários são separados. A inibição enzimática aparece em horas a poucos dias e some à medida que o inibidor é eliminado; com inibidores de meia-vida longa, como amiodarona e fluoxetina, o efeito dura semanas após a suspensão. A indução é lenta para começar e lenta para acabar: quem termina um curso de rifampicina continua com enzimas induzidas por algumas semanas. Isso explica por que um paciente pode ter sangramento com varfarina depois que o antibiótico já acabou, ou ficar com o INR baixo semanas depois de parar a carbamazepina.\u003c/p>\n\u003ch3>Variação entre pacientes\u003c/h3>\n\u003cp>A mesma combinação pode ser inofensiva em um paciente e perigosa em outro. Pesam a dose do precipitante (fluconazol 150 mg em dose única inibe menos que 200 mg por dia durante semanas), a dependência do objeto daquela via (sinvastatina depende quase toda de CYP3A4; rosuvastatina, pouco), a função renal e hepática e a genética. Pessoas metabolizadoras lentas de CYP2C19 ou CYP2D6, por exemplo, já têm pouca atividade da enzima, e um inibidor muda pouco; metabolizadoras ultrarrápidas reagem de outra forma. Na farmácia comercial não se faz genotipagem de rotina, mas reconhecer que existe variação ajuda a entender por que um paciente tolera bem uma combinação que intoxicou outro.\u003c/p>\n\u003ch3>Interações úteis\u003c/h3>\n\u003cp>Nem toda interação é indesejada. Algumas são usadas de propósito: o ácido clavulânico inibe betalactamases e protege a amoxicilina; a carbidopa inibe a descarboxilase periférica e aumenta a levodopa que chega ao cérebro; o ritonavir em dose baixa inibe CYP3A4 para elevar o nível de outro antirretroviral ou do nirmatrelvir. Reconhecer essas associações evita alertas desnecessários ao prescritor.\u003c/p>\n\u003ch3>Gravidade e documentação\u003c/h3>\n\u003cp>Os compêndios classificam as interações por gravidade (o tamanho do dano possível) e por documentação (a qualidade da evidência). As categorias variam entre fontes. Uma forma prática de usar no balcão:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Contraindicada\u003c/b>: a combinação deve ser evitada (sinvastatina com claritromicina; sildenafila com nitrato).\u003c/li>\n\u003cli>\u003cb>Grave\u003c/b>: pode causar dano sério, como sangramento, arritmia, hipercalemia ou falha terapêutica importante; exige contato com o prescritor ou ajuste.\u003c/li>\n\u003cli>\u003cb>Moderada\u003c/b>: exige monitoramento, ajuste de horário ou orientação.\u003c/li>\n\u003cli>\u003cb>Leve\u003c/b>: efeito pequeno; geralmente basta orientar.\u003c/li>\n\u003c/ul>\n\u003cp>A documentação vai de estudos clínicos controlados a relatos de caso isolados. Uma interação grave com documentação fraca (ginkgo e varfarina, por exemplo) pede cautela e orientação; uma grave e bem documentada (amiodarona e varfarina) pede ação.\u003c/p>\n\u003ch3>Quem tem mais risco\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Idosos\u003c/b>: menor função renal e hepática, mais medicamentos, mais sensibilidade a sedativos e a quedas.\u003c/li>\n\u003cli>\u003cb>Polifarmácia\u003c/b>: o número de pares possíveis cresce rapidamente com o número de medicamentos. Com 5 medicamentos há 10 pares; com 10, há 45.\u003c/li>\n\u003cli>\u003cb>Fármacos de índice terapêutico estreito\u003c/b>: varfarina, digoxina, lítio, fenitoína, carbamazepina, levotiroxina, ciclosporina, tacrolimo, teofilina. Pequenas mudanças de nível causam toxicidade ou falha.\u003c/li>\n\u003cli>\u003cb>Doenças de base\u003c/b>: insuficiência renal ou hepática, insuficiência cardíaca, epilepsia, QT longo congênito.\u003c/li>\n\u003cli>\u003cb>Vários prescritores\u003c/b>: o cardiologista não sabe do antibiótico do dentista; a farmácia pode ser o único lugar onde tudo se encontra.\u003c/li>\n\u003c/ul>\n\u003ch3>Objetos de índice terapêutico estreito e o que monitorar\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Objeto\u003c/th>\u003cth>O que se monitora\u003c/th>\u003cth>Sinal de toxicidade a orientar\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Varfarina\u003c/td>\u003ctd>INR\u003c/td>\u003ctd>Sangramentos, hematomas, fezes pretas\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Digoxina\u003c/td>\u003ctd>Digoxinemia, potássio, função renal\u003c/td>\u003ctd>Náusea, visão amarelada, pulso lento\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lítio\u003c/td>\u003ctd>Litemia, função renal, sódio\u003c/td>\u003ctd>Tremor grosseiro, diarreia, confusão\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fenitoína, carbamazepina\u003c/td>\u003ctd>Nível sérico\u003c/td>\u003ctd>Tontura, visão dupla, ataxia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Levotiroxina\u003c/td>\u003ctd>TSH\u003c/td>\u003ctd>Palpitação, insônia (excesso); cansaço (falta)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Teofilina\u003c/td>\u003ctd>Nível sérico\u003c/td>\u003ctd>Náusea, taquicardia, convulsão\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Metotrexato\u003c/td>\u003ctd>Hemograma, função renal e hepática\u003c/td>\u003ctd>Feridas na boca, febre, sangramento\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 74 anos usa 9 medicamentos prescritos por 4 médicos diferentes e compra mais 2 sem receita. O software da farmácia mostra 14 alertas. O farmacêutico filtra: dois são graves e relevantes (AINE com losartana e furosemida; omeprazol com clopidogrel), os demais são teóricos ou já conhecidos e monitorados. Concentra a intervenção nos dois, orienta a troca do AINE por paracetamol e encaminha ao cardiologista uma nota sobre o omeprazol. Tratar todos os alertas como iguais teria diluído a mensagem.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Ao identificar uma interação, responda quatro perguntas: quem é o precipitante, quem é o objeto, por qual via (absorção, enzima, transportador, rim, efeito somado) e o que acontece com o paciente. Só então decida a conduta.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>A pergunta \"o senhor usa algum outro remédio?\" capta pouco. Pergunte de forma dirigida: remédio para pressão, coração, sangue \"ralo\", tireoide, diabetes, depressão ou sono, anticoncepcional, chás, vitaminas e suplementos, e bebida alcoólica.\u003c/p>\u003c/div>\n"},{"id":"m08-anticoagulantes","titulo":"Anticoagulantes e antiagregantes","resumo":"\n\u003cp>Interações com anticoagulantes estão entre as que mais causam internação por evento adverso. A \u003cstrong>varfarina\u003c/strong> tem índice terapêutico estreito, é metabolizada principalmente por CYP2C9 (o enantiômero S, mais potente) e também por CYP3A4 e CYP1A2 (o enantiômero R), e seu efeito depende da vitamina K da dieta. A bula norte-americana (varfarina, FDA, 2025) resume os mecanismos: interações por inibidores e indutores de CYP2C9, 1A2 e 3A4, por sinergismo na hemostasia e por antagonismo competitivo com a vitamina K, e recomenda INR mais frequente ao iniciar ou suspender qualquer medicamento ou fitoterápico, inclusive antibióticos de curta duração.\u003c/p>\n\u003ch3>Varfarina com AINE e AAS\u003c/h3>\n\u003cp>AINE (ibuprofeno, diclofenaco, naproxeno, cetoprofeno) e AAS são precipitantes farmacodinâmicos: inibem a COX-1 plaquetária (o AAS de forma irreversível) e lesam a mucosa gástrica. O INR pode não mudar, mas o risco de sangramento digestivo aumenta. É uma das combinações mais perigosas do balcão, porque o AINE é comprado sem receita. Para dor e febre, o analgésico de escolha no paciente com varfarina é o paracetamol em dose moderada, ou a dipirona, conforme avaliação. Quando o AAS em baixa dose é associado à varfarina por indicação cardiológica, a decisão é do médico e a orientação é vigiar sinais de sangramento.\u003c/p>\n\u003ch3>Varfarina com amiodarona\u003c/h3>\n\u003cp>A amiodarona inibe CYP2C9 e CYP3A4 e aumenta a exposição à varfarina. As bulas divergem no grau de detalhe: a norte-americana (Pacerone, FDA, 2024) orienta reduzir a dose de varfarina em um terço a metade e monitorar o tempo de protrombina; a brasileira (Ancoron, Libbs, 2025) não fixa fração e pede monitorar o INR com regularidade e ajustar a dose do anticoagulante durante e após o tratamento. O efeito começa em dias, atinge o máximo em semanas e persiste por meses após a suspensão da amiodarona, que tem meia-vida muito longa.\u003c/p>\n\u003ch3>Varfarina com antimicrobianos\u003c/h3>\n\

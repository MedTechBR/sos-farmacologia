s reduzem a eliminação renal e aumentam a toxicidade, sobretudo com doses altas de metotrexato.\u003c/li>\u003cli>Varfarina: há relatos de aumento do RNI com amoxicilina e amoxicilina-clavulanato; orientar controle do RNI se o curso for longo ou houver sangramento.\u003c/li>\u003cli>Alopurinol: aumenta a frequência de exantema com ampicilina e amoxicilina.\u003c/li>\u003cli>Probenecida: reduz a excreção renal das penicilinas e prolonga seu efeito (associação às vezes intencional).\u003c/li>\u003cli>Anticoncepcional hormonal: a eficácia não é reduzida por betalactâmicos (ver tópico de orientação ao paciente).\u003c/li>\u003c/ul>\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Betalactâmico é tempo-dependente: em 8/8 h, distribuir as doses ao longo das 24 horas (por exemplo 6 h, 14 h e 22 h) vale mais do que concentrá-las no horário de vigília. Suspensões de amoxicilina e amoxicilina-clavulanato reconstituídas têm validade curta e exigem conservação conforme bula (ver tabela de suspensões no material de apoio).\u003c/p>\u003c/div>"},{"id":"m03-atb-sintese-proteica","titulo":"Inibidores da síntese proteica","resumo":"\u003cp>O ribossomo bacteriano (70S) é formado pelas subunidades 30S e 50S, diferentes do ribossomo humano (80S). Essa diferença permite inibir a síntese de proteínas da bactéria com toxicidade aceitável. Atuam na \u003cstrong>subunidade 30S\u003c/strong> os aminoglicosídeos e as tetraciclinas; na subunidade 50S, macrolídeos, lincosamidas, cloranfenicol e oxazolidinonas. Exceto os aminoglicosídeos, que são bactericidas, o grupo é predominantemente bacteriostático.\u003c/p>\u003cp>Como vários desses fármacos interagem com o citocromo P450, prolongam o intervalo QT ou dependem de cuidados com alimento e cátions, este é o grupo que mais exige conferência de interações no balcão.\u003c/p>\u003ch3>Macrolídeos\u003c/h3>\u003cp>Azitromicina, claritromicina e eritromicina se ligam à porção 23S da subunidade 50S e bloqueiam o alongamento da cadeia proteica. Cobrem estreptococos (com resistência crescente do pneumococo), atípicos (\u003ci>Mycoplasma\u003c/i>, \u003ci>Chlamydophila\u003c/i>, \u003ci>Legionella\u003c/i>), \u003ci>Bordetella pertussis\u003c/i>, \u003ci>Chlamydia trachomatis\u003c/i> e, no caso da claritromicina, o \u003ci>Helicobacter pylori\u003c/i>. São alternativa em alérgicos a betalactâmicos e componente de esquemas para pneumonia comunitária.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Posologia usual adulto\u003c/th>\u003cth>Farmacocinética e CYP3A4\u003c/th>\u003cth>Ponto de atenção\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Azitromicina\u003c/td>\u003ctd>500 mg 1 vez ao dia por 3 dias (bula brasileira); 1 g em dose única em algumas IST; outros esquemas conforme indicação\u003c/td>\u003ctd>Meia-vida longa (cerca de 68 horas) e alta concentração tecidual; inibição fraca do CYP3A4\u003c/td>\u003ctd>Prolongamento do QT; cardiopatas e uso com outros fármacos que prolongam o QT\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claritromicina\u003c/td>\u003ctd>250 a 500 mg de 12/12 h\u003c/td>\u003ctd>Inibidor potente do CYP3A4 e da glicoproteína P\u003c/td>\u003ctd>Muitas interações graves; gosto metálico; alerta da FDA (2018) sobre mortalidade em cardiopatas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eritromicina\u003c/td>\u003ctd>Conforme sal e indicação (uso hoje restrito)\u003c/td>\u003ctd>Inibidor potente do CYP3A4\u003c/td>\u003ctd>Intolerância gastrintestinal (é agonista da motilina); QT; o estolato causa hepatite colestática\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A FDA alertou em 2013 para risco de arritmia fatal com azitromicina em pacientes com QT longo, hipocalemia, hipomagnesemia, bradicardia ou em uso de antiarrítmicos, e em 2018 recomendou cautela com claritromicina em cardiopatas, depois de um estudo que mostrou excesso de mortalidade no seguimento de longo prazo. Em recém-nascidos, eritromicina e azitromicina se associam a estenose hipertrófica do piloro.\u003c/p>\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Claritromicina com sinvastatina ou lovastatina é contraindicada (rabdomiólise). Também são perigosas as associações com colchicina (toxicidade fatal, especialmente em doença renal), derivados do ergot, alguns antiarrítmicos, anticoagulantes orais diretos e varfarina (sangramento), bloqueadores de canal de cálcio (hipotensão) e alguns benzodiazepínicos. Diante de qualquer um desses na lista do paciente, contate o prescritor: em geral a azitromicina, com interação bem menor pelo CYP3A4, é a troca possível.\u003c/p>\u003c/div>\u003ch3>Tetraciclinas\u003c/h3>\u003cp>Doxiciclina, minociclina e tetraciclina se ligam à subunidade 30S. A doxiciclina é a mais usada: cobre atípicos, \u003ci>Chlamydia trachomatis\u003c/i>, riquétsias (febre maculosa), leptospira, \u003ci>Borrelia\u003c/i>, MRSA comunitário em pele, acne inflamatória e é usada na profilaxia da malária. Pela bula brasileira, a dose usual de adulto é 200 mg no primeiro dia e 100 mg por dia depois, com 200 mg por dia (100 mg de 12/12 h) nas infecções mais graves. A minociclina causa mais tontura e vertigem, hiperpigmentação de pele e dentes e, raramente, reações autoimunes (lúpus induzido, hepatite).\u003c/p>\u003cp>A tigeciclina, derivada intravenosa, é de uso hospitalar para bactérias multirresistentes.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Problema\u003c/th>\u003cth>Mecanismo\u003c/th>\u003cth>Orientação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Quelação com cátions\u003c/td>\u003ctd>Cálcio, magnésio, alumínio, ferro, zinco e bismuto formam complexos não absorvíveis\u003c/td>\u003ctd>Separar de antiácidos, suplementos minerais, multivitamínicos e leite; tetraciclina sofre mais que doxiciclina e minociclina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Esofagite e úlcera esofágica\u003c/td>\u003ctd>Comprimido parado no esôfago libera fármaco ácido\u003c/td>\u003ctd>Tomar com um copo cheio de água, sentado ou em pé, e não deitar nos 30 minutos seguintes; não tomar ao deitar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fotossensibilidade\u003c/td>\u003ctd>Reação fototóxica\u003c/td>\u003ctd>Evitar exposição solar intensa; usar protetor e roupa; maior com doxiciclina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dentes e ossos em formação\u003c/td>\u003ctd>Deposição de complexo com cálcio\u003c/td>\u003ctd>Evitar na gestação (sobretudo a partir do 2º trimestre) e em menores de 8 anos para infecções comuns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hipertensão intracraniana benigna\u003c/td>\u003ctd>Mecanismo incerto\u003c/td>\u003ctd>Cefaleia intensa e alteração visual exigem avaliação; não associar a isotretinoína\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A restrição em crianças foi relativizada para a doxiciclina em cursos curtos. O CDC dos Estados Unidos publicou estudo em que crianças tratadas com doxiciclina antes dos 8 anos para febre maculosa não tiveram diferença de coloração dentária, e a Academia Americana de Pediatria recomenda doxiciclina como fármaco de escolha para febre maculosa suspeita em qualquer idade. Para infecções comuns, a recomendação de evitar tetraciclinas abaixo de 8 anos continua.\u003c/p>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Cliente em uso de carbonato de cálcio e sulfato ferroso recebe doxiciclina 100 mg de 12/12 h. Monte com ele uma tabela de horários: doxiciclina às 8 h e às 20 h, com água e longe de deitar; ferro e cálcio no meio da tarde, pelo menos 2 a 3 horas distantes das doses. Se a bula do produto indicar outro intervalo, siga a bula.\u003c/p>\u003c/div>\u003ch3>Aminoglicosídeos\u003c/h3>\u003cp>Gentamicina, amicacina, tobramicina e estreptomicina se ligam à subunidade 30S e causam leitura errada do RNA mensageiro; são bactericidas e concentração-dependentes, o que fundamenta a dose única diária. Praticamente não são absorvidos por via oral; o uso sistêmico é hospitalar, por via intravenosa ou intramuscular, para Gram-negativos aeróbios graves, em sinergia com betalactâmico na endocardite por enterococo e, no caso da estreptomicina e da amicacina, em micobactérias.\u003c/p>\u003cul>\u003cli>\u003cstrong>Nefrotoxicidade\u003c/strong>: lesão do túbulo proximal, em geral reversível; piora com idade avançada, desidratação, uso prolongado e associação a vancomicina, anfotericina B, contraste iodado e anti-inflamatórios.\u003c/li>\u003cli>Ototoxicidade: coclear (perda auditiva de altas frequências, zumbido) e vestibular (vertigem, desequilíbrio), frequentemente irreversível; diuréticos de alça somam risco.\u003c/li>\u003cli>Bloqueio neuromuscular: raro, relevante na miastenia gravis e após bloqueadores neuromusculares.\u003c/li>\u003cli>Monitorização: concentrações séricas e creatinina, com ajuste pela função renal.\u003c/li>\u003cli>Gestação: risco de ototoxicidade fetal (documentado com estreptomicina).\u003c/li>\u003c/ul>\u003cp>Na farmácia comercial, os aminoglicosídeos aparecem sobretudo em produtos tópicos: colírios de tobramicina e gentamicina, cremes e pomadas de gentamicina e neomicina. A neomicina tópica é causa frequente de dermatite de contato alérgica, e o uso em pele lesada extensa ou em perfuração timpânica traz risco de absorção e ototoxicidade.\u003c/p>\u003ch3>Lincosamidas\u003c/h3>\u003cp>A clindamicina se liga à subunidade 50S. Cobre estreptococos, estafilococos (incluindo parte do MRSA comunitário) e anaeróbios acima do diafragma; é útil em infecções dentárias, de pele e partes moles, em alérgicos a penicilina e, associada à pirimetamina, na toxoplasmose. A bula do Dalacin® C indica, por via oral, 0,6 a 1,8 g por dia divididos em 2 a 4 tomadas, conforme indicação. Estafilococos com resistência induzível a macrolídeos podem falhar à clindamicina mesmo com antibiograma aparentemente sensível; o laboratório detecta isso pelo teste D.\u003c/p>\u003cp>O efeito adverso marcante é a diarreia por \u003cstrong>\u003ci>Clostridioides difficile\u003c/i>\u003c/strong>, que pode ocorrer durante o tratamento ou semanas depois. A clindamicina está entre os antibióticos de maior risco, ao lado de cefalosporinas, quinolonas e amoxicilina-clavulanato. A cápsula deve ser tomada com um copo cheio de água, pelo risco de esofagite.\u003c/p>\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Diarreia aquosa intensa (três ou mais evacuações em 24 horas), com febre, cólica ou sangue, durante ou até cerca de oito semanas depois de antibiótico, exige avaliação médica. Antidiarreicos como a loperamida não devem ser usados por conta própria nessa situação.\u003c/p>\u003c/div>\u003ch3>Cloranfenicol\u003c/h3>\u003cp>Bloqueia a peptidiltransferase na subunidade 50S. Tem espectro amplo e boa penetração no sistema nervoso central, mas o uso sistêmico caiu por causa da toxicidade hematológica: supressão medular dose-dependente e reversível, e aplasia de medula idiossincrática, rara, não relacionada à dose e frequentemente fatal. Em recém-nascidos, a imaturidade da glicuronidação causa a síndrome do bebê cinzento (vômitos, hipotermia, colapso circulatório). No balcão, aparece quase só em colírios e pomadas oftálmicas e em associações tópicas.\u003c/p>\u003ch3>Oxazolidinonas\u003c/h3>\u003cp>A linezolida se liga à subunidade 50S e impede a formação do complexo de iniciação. Tem biodisponibilidade oral próxima de 100%, o que permite trocar a via intravenosa pela oral na mesma dose (600 mg de 12/12 h). Atua em Gram-positivos resistentes: MRSA, enterococo resistente à vancomicina e pneumococo resistente. Pertence ao grupo Reserve da OMS e costuma ser prescrita na alta hospitalar, chegando à farmácia comercial com receita de especialista.\u003c/p>\u003cul>\u003cli>\u003cstrong>Síndrome serotoninérgica\u003c/strong>: a linezolida é inibidor fraco e reversível da monoamina oxidase. Com ISRS, IRSN, tricíclicos, tramadol, meperidina, triptanos ou buspirona, pode surgir agitação, tremor, hipertermia, mioclonia e diarreia. A FDA emitiu alerta específico em 2011 para o uso com antidepressivos serotoninérgicos.\u003c/li>\u003cli>Tiramina: alimentos ricos (queijos curados, embutidos fermentados, molho de soja, chope e vinho tinto em quantidade) podem elevar a pressão arterial; orientar moderação.\u003c/li>\u003cli>Simpatomiméticos: pseudoefedrina e fenilefrina de antigripais aumentam a pressão; evitar.\u003c/li>\u003cli>Mielossupressão: trombocitopenia e anemia, mais comuns após duas semanas de uso; hemograma semanal.\u003c/li>\u003cli>Neuropatia periférica e óptica e acidose lática em uso prolongado; alteração visual exige suspensão e avaliação.\u003c/li>\u003c/ul>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Paciente com receita de linezolida e sertralina em uso: não dispense sem contato com o prescritor. Se a decisão for manter os dois, oriente reconhecer tremor, febre, confusão e rigidez como sinais de procura imediata de atendimento, e evite somar outro serotoninérgico, como tramadol para dor.\u003c/p>\u003c/div>"},{"id":"m03-atb-acidos-nucleicos","titulo":"Inibidores de ácidos nucleicos e outros antibacterianos","resumo":"\u003cp>Este grupo reúne fármacos de mecanismos variados que têm em comum o uso frequente na comunidade: a rifampicina, que bloqueia a síntese de RNA; os nitroimidazólicos (metronidazol, secnidazol e tinidazol) e a nitrofurantoína, que geram intermediários reativos que lesam o DNA; e a fosfomicina, que age na primeira etapa da síntese da parede celular. Todos exigem orientação específica no balcão.\u003c/p>\u003ch3>Rifampicina e outras rifamicinas\u003c/h3>\u003cp>A rifampicina inibe a RNA polimerase dependente de DNA da bactéria. É bactericida, atinge bem tecidos e biofilmes, mas seleciona resistência rapidamente quando usada sozinha; por isso entra sempre em associação. Usos principais: tuberculose (esquema com rifampicina, isoniazida, pirazinamida e etambutol, fornecido pelo SUS), hanseníase (poliquimioterapia), quimioprofilaxia de contatos de doença meningocócica e associação em infecções estafilocócicas de prótese e osso.\u003c/p>\u003cul>\u003cli>\u003cstrong>Indução enzimática\u003c/strong>: é um dos indutores mais potentes conhecidos (CYP3A4, CYP2C9, CYP2C19, glicoproteína P e glicuroniltransferases). Reduz a concentração de anticoncepcionais hormonais, varfarina, anticoagulantes orais diretos, antirretrovirais (inibidores de protease e outros), azóis, corticoides, metadona, tacrolimo e ciclosporina, levotiroxina, sulfonilureias, estatinas, anticonvulsivantes e muitos outros. O efeito começa em dias e persiste por semanas após a suspensão.\u003c/li>\u003cli>Coloração alaranjada a avermelhada de urina, suor, lágrimas, saliva e fezes; mancha lentes de contato gelatinosas de forma permanente.\u003c/li>\u003cli>Hepatotoxicidade, maior em associação com isoniazida e pirazinamida, em etilistas e em hepatopatas.\u003c/li>\u003cli>Síndrome pseudogripal, trombocitopenia e reações de hipersensibilidade, mais associadas ao uso intermitente.\u003c/li>\u003cli>Absorção reduzida por alimento: no tratamento da tuberculose, a orientação usual é tomar em jejum, de uma só vez, pela manhã.\u003c/li>\u003c/ul>\u003cp>A rifabutina tem indução menor e é preferida com alguns antirretrovirais; pode causar uveíte. A rifaximina quase não é absorvida e é usada na encefalopatia hepática e na diarreia do viajante, sem os problemas sistêmicos da rifampicina.\u003c/p>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Mulher em tratamento de tuberculose usa anticoncepcional oral combinado. Explique que a rifampicina reduz a eficácia da pílula (assim como do adesivo, do anel e da pílula só de progestagênio) e que ela precisa de método que não dependa do metabolismo hepático, como DIU de cobre ou hormonal, ou injetável trimestral, conforme decisão com o prescritor. O efeito indutor persiste por semanas depois do fim da rifampicina, e o preservativo deve ser mantido nesse período. Avise também sobre a urina e as lágrimas alaranjadas, para que ela não interrompa o tratamento por susto.\u003c/p>\u003c/div>\u003ch3>Nitroimidazólicos\u003c/h3>\u003cp>Metronidazol, secnidazol e tinidazol entram na célula como pró-fármacos e são reduzidos apenas por micro-organismos anaeróbios e protozoários, gerando radicais que fragmentam o DNA. O espectro é por isso muito específico: anaeróbios estritos (\u003ci>Bacteroides\u003c/i>, \u003ci>Clostridioides\u003c/i>, \u003ci>Prevotella\u003c/i>), \u003ci>Gardnerella\u003c/i> na vaginose bacteriana, \u003ci>Trichomonas vaginalis\u003c/i>, \u003ci>Giardia lamblia\u003c/i> e \u003ci>Entamoeba histolytica\u003c/i>. O metronidazol também compõe esquemas para \u003ci>H. pylori\u003c/i> e infecções intra-abdominais.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Esquemas de adulto (bula e PCDT IST 2022)\u003c/th>\u003cth>Orientação sobre álcool na bula brasileira\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Metronidazol\u003c/td>\u003ctd>Tricomoníase: 2 g dose única ou 500 mg de 12/12 h por 7 dias (PCDT); vaginose bacteriana: 500 mg de 12/12 h por 7 dias (PCDT); giardíase: 250 mg de 8/8 h por 5 dias (bula do Flagyl®)\u003c/td>\u003ctd>Evitar durante o tratamento e por pelo menos 1 dia após a última dose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secnidazol\u003c/td>\u003ctd>Tricomoníase, amebíase intestinal e giardíase: 2 g dose única, com uma refeição, de preferência à noite\u003c/td>\u003ctd>Evitar durante o tratamento e por 4 dias após a última dose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tinidazol\u003c/td>\u003ctd>Dose única de 2 g na maior parte das indicações\u003c/td>\u003ctd>Conforme bula do produto\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Efeitos adversos comuns são gosto metálico, náusea, cefaleia e urina escurecida, avermelhada. Em uso prolongado ou em doses altas, o metronidazol causa neuropatia periférica e, raramente, encefalopatia com ataxia cerebelar e convulsões; formigamento em mãos e pés exige retorno ao prescritor. Interações relevantes: aumento do efeito da varfarina (inibição do CYP2C9, com risco de sangramento), aumento do lítio, aumento do bussulfano e reações psicóticas com dissulfiram. O secnidazol é contraindicado na gestação e na amamentação, segundo a bula brasileira.\u003c/p>\u003ch4>Álcool e metronidazol: o que a evidência mostra\u003c/h4>\u003cp>A orientação de evitar álcool vem de relatos de casos antigos de reação semelhante à do dissulfiram (rubor, náusea, vômitos, taquicardia). Estudos posteriores questionaram o mecanismo: o metronidazol não inibe de forma consistente a aldeído desidrogenase hepática, e ensaio controlado em voluntários sadios não mostrou elevação de acetaldeído no sangue. Um estudo caso-controle publicado em 2023 (Feldman e Jaszczenski, WMJ) revisou atendimentos de emergência e não encontrou reação dissulfiram-símile em 18 pacientes que receberam metronidazol com etanol detectável no sangue, comparados a 18 controles; a amostra é pequena e retrospectiva.\u003c/p>\u003cp>Na prática, a interação verdadeira é improvável, mas não foi descartada, e o álcool piora náusea e intolerância gástrica. As bulas brasileiras mantêm a restrição, e o farmacêutico deve orientar conforme a bula, sem alarmismo e sem afirmar que a reação é certa.\u003c/p>\u003ch3>Nitrofurantoína\u003c/h3>\u003cp>A nitrofurantoína é reduzida por flavoproteínas bacterianas a intermediários que lesam DNA, ribossomos e enzimas; como atua em vários alvos, a resistência é pouco frequente, inclusive entre \u003ci>E. coli\u003c/i> produtoras de ESBL. Concentra-se apenas na urina, sem nível sanguíneo terapêutico: serve para cistite não complicada e profilaxia, e não deve ser usada em pielonefrite ou quando há febre e dor lombar. A apresentação comum no Brasil é a cápsula de macrocristais de 100 mg. A bula da Macrodantina® indica 100 mg de 6/6 h por 7 a 10 dias; a diretriz de cistite da IDSA e da ESCMID (2011) usa cursos de 5 dias, e a duração final é a da prescrição.\u003c/p>\u003cul>\u003cli>Tomar com alimento: melhora a absorção e reduz náusea.\u003c/li>\u003cli>Urina amarelo-escura ou acastanhada é esperada e sem significado.\u003c/li>\u003cli>\u003cstrong>Função renal\u003c/strong>: com TFG baixa, o fármaco não chega à urina em concentração eficaz e se acumula no sangue. A bula profissional brasileira contraindica o uso com depuração de creatinina abaixo de 60 mL/min/1,73 m²; bulas europeias aceitam curso curto, com cautela, com TFG estimada entre 30 e 44 mL/min/1,73 m². Na dúvida, o farmacêutico segue a bula do produto e aciona o prescritor.\u003c/li>\u003cli>Reações pulmonares: aguda (febre, tosse, dispneia nos primeiros dias, de natureza alérgica) e crônica (pneumonite intersticial e fibrose em uso prolongado, como na profilaxia de meses).\u003c/li>\u003cli>Hepatite, neuropatia periférica e hemólise em deficientes de G6PD.\u003c/li>\u003cli>Gestação: usada na cistite da gestante, mas evitada a termo (38 a 42 semanas), durante o trabalho de parto e em recém-nascidos com menos de 1 mês, pelo risco de hemólise neonatal.\u003c/li>\u003c/ul>\u003ch3>Fosfomicina\u003c/h3>\u003cp>A fosfomicina inibe a enzima MurA, que catalisa o primeiro passo da síntese do peptidoglicano; é bactericida. A forma oral, fosfomicina trometamol (Monuril®), é um sachê de 3 g em dose única para cistite não complicada da mulher. Mantém atividade contra muitas \u003ci>E. coli\u003c/i> produtoras de ESBL. A forma oral está no grupo Watch da OMS e a intravenosa, no grupo Reserve.\u003c/p>\u003cul>\u003cli>Dissolver o sachê em 50 a 75 mL de água, mexer e tomar logo; não guardar a solução.\u003c/li>\u003cli>Tomar com o estômago vazio, de preferência à noite, depois de esvaziar a bexiga, para manter o fármaco na urina durante a noite; a bula admite 2 a 3 horas após refeição.\u003c/li>\u003cli>Efeitos: diarreia, náusea, cefaleia, vulvovaginite.\u003c/li>\u003cli>Metoclopramida reduz a concentração sérica e urinária; não associar (bula do Monuril®).\u003c/li>\u003cli>Contraindicada, segundo a bula, com depuração de creatinina abaixo de 10 mL/min e em hemodiálise.\u003c/li>\u003cli>Sintomas que persistem 2 a 3 dias após a dose, febre, dor lombar ou sangue na urina exigem reavaliação.\u003c/li>\u003c/ul>\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 72 anos, com TFG estimada de 38 mL/min/1,73 m² (CKD-EPI 2021) em exame recente, traz receita de nitrofurantoína para cistite. A bula brasileira contraindica o uso nessa faixa. O farmacêutico explica a situação à paciente, contata o prescritor com o valor da TFG e anota a conduta. Fosfomicina em dose única é uma das alternativas que o médico pode considerar.\u003c/p>\u003c/div>"},{"id":"m03-atb-quinolonas","titulo":"Quinolonas","resumo":"\u003cp>As fluoroquinolonas inibem a DNA girase (topoisomerase II, alvo principal em Gram-negativos) e a topoisomerase IV (alvo principal em Gram-positivos), enzimas que desenrolam e separam o DNA durante a replicação. São bactericidas, dependentes de concentração e de AUC/CIM, com ótima absorção oral e boa penetração em tecidos. Essas qualidades levaram a uso excessivo, com aumento da resistência de \u003ci>E. coli\u003c/i> comunitária e reconhecimento de efeitos adversos graves e às vezes permanentes. Hoje são antibióticos de uso restrito, classificados como Watch pela OMS.\u003c/p>\u003ch3>Fármacos e espectro\u003c/h3>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Posologia usual adulto\u003c/th>\u003cth>Espectro e uso\u003c/th>\u003cth>Observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Norfloxacino\u003c/td>\u003ctd>400 mg de 12/12 h\u003c/td>\u003ctd>Gram-negativos urinários; só infecção urinária baixa\u003c/td>\u003ctd>Concentração sérica baixa; uso em queda\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ciprofloxacino\u003c/td>\u003ctd>250 a 750 mg de 12/12 h, conforme indicação (500 mg de 12/12 h é a mais comum)\u003c/td>\u003ctd>Gram-negativos, inclusive \u003ci>Pseudomonas\u003c/i>; fraco para pneumococo\u003c/td>\u003ctd>Inibe o CYP1A2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Levofloxacino\u003c/td>\u003ctd>500 a 750 mg 1 vez ao dia\u003c/td>\u003ctd>Pneumococo, atípicos e Gram-negativos (quinolona respiratória)\u003c/td>\u003ctd>Ajuste pela TFG\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Moxifloxacino\u003c/td>\u003ctd>400 mg 1 vez ao dia\u003c/td>\u003ctd>Pneumococo, atípicos e anaeróbios\u003c/td>\u003ctd>Não serve para infecção urinária (baixa excreção renal); maior efeito sobre o QT\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Alertas de segurança\u003c/h3>\u003cp>A partir de 2016, a FDA passou a recomendar que fluoroquinolonas sistêmicas não sejam usadas em sinusite aguda, exacerbação de bronquite crônica e cistite não complicada quando houver alternativa, porque efeitos incapacitantes e potencialmente permanentes em tendões, músculos, articulações, nervos e sistema nervoso central superam o benefício nessas situações. Em 2018, acrescentou alertas sobre hipoglicemia grave e efeitos na saúde mental e, em dezembro do mesmo ano, sobre aneurisma e dissecção de aorta. A Agência Europeia de Medicamentos (EMA) concluiu revisão em 2018 recomendando não usar quinolonas em infecções leves ou autolimitadas, em prevenção de diarreia do viajante ou de infecção urinária recorrente, nem em pacientes com reação grave prévia à classe, e reforçou a restrição em comunicado de 2023. As bulas brasileiras de fluoroquinolonas trazem advertências sobre esses efeitos, inclusive aneurisma e dissecção de aorta; confira a versão vigente no Bulário Eletrônico da Anvisa.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Efeito\u003c/th>\u003cth>Quem tem mais risco\u003c/th>\u003cth>Sinal para orientar\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tendinite e ruptura de tendão (sobretudo Aquiles)\u003c/td>\u003ctd>Maiores de 60 anos, uso de corticoide, transplantados de rim, coração ou pulmão, atividade física intensa\u003c/td>\u003ctd>Dor, inchaço ou estalo no tendão: parar o esforço e procurar o prescritor; pode surgir até meses depois\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neuropatia periférica\u003c/td>\u003ctd>Qualquer paciente; pode ser permanente\u003c/td>\u003ctd>Formigamento, queimação, dormência, fraqueza em mãos e pés\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Efeitos no sistema nervoso central\u003c/td>\u003ctd>Idosos, epilepsia, doença renal\u003c/td>\u003ctd>Insônia, agitação, confusão, alucinações, convulsões\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hipoglicemia e hiperglicemia\u003c/td>\u003ctd>Diabéticos em uso de sulfonilureia ou insulina, idosos\u003c/td>\u003ctd>Tremor, suor frio, confusão; monitorar glicemia capilar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aneurisma e dissecção de aorta\u003c/td>\u003ctd>Idosos, hipertensos, aneurisma conhecido, doença vascular periférica, síndromes de Marfan e Ehlers-Danlos\u003c/td>\u003ctd>Dor súbita e intensa no peito, abdome ou costas: emergência\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prolongamento do QT\u003c/td>\u003ctd>Moxifloxacino mais que levofloxacino e ciprofloxacino; associação com outros fármacos que prolongam o QT, hipocalemia\u003c/td>\u003ctd>Palpitação, desmaio\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Piora da miastenia gravis\u003c/td>\u003ctd>Pacientes com miastenia\u003c/td>\u003ctd>Fraqueza muscular, dificuldade para respirar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Outros efeitos: fotossensibilidade, diarreia por \u003ci>C. difficile\u003c/i> e náusea. Em crianças e adolescentes, estudos em animais jovens mostraram lesão de cartilagem, e o uso fica limitado a situações específicas sem alternativa. Na gestação, devem ser evitadas.\u003c/p>\u003ch3>Interações\u003c/h3>\u003cul>\u003cli>\u003cstrong>Quelação com cátions polivalentes\u003c/strong>: antiácidos com alumínio ou magnésio, sucralfato, ferro, zinco, cálcio e multivitamínicos reduzem muito a absorção. Para o ciprofloxacino, a bula brasileira do Cipro® orienta tomar 1 a 2 horas antes ou pelo menos 4 horas depois desses produtos, e a bula norte-americana pede 2 horas antes ou 6 horas depois; o intervalo maior é o mais seguro. Para o levofloxacino, a bula pede 2 horas antes ou depois; para as demais, vale a bula do produto.\u003c/li>\u003cli>Leite e iogurte: o ciprofloxacino não deve ser tomado só com laticínio ou suco enriquecido com cálcio; tomado junto a uma refeição que contenha laticínio, a interferência é pequena.\u003c/li>\u003cli>Ciprofloxacino inibe o CYP1A2: aumenta teofilina (convulsões), tizanidina (hipotensão e sedação, associação contraindicada), cafeína, clozapina e olanzapina.\u003c/li>\u003cli>Varfarina: aumento do RNI; controlar.\u003c/li>\u003cli>Corticoides sistêmicos: somam risco de ruptura de tendão.\u003c/li>\u003cli>Antidiabéticos: sulfonilureias e insulina somam risco de hipoglicemia.\u003c/li>\u003cli>Fármacos que prolongam o QT (antiarrítmicos, alguns antipsicóticos, macrolídeos, ondansetrona em dose alta): risco aditivo.\u003c/li>\u003c/ul>\u003ch3>Onde as quinolonas ainda têm lugar\u003c/h3>\u003cp>Apesar das restrições, há situações em que a quinolona é a melhor opção oral: pielonefrite não complicada tratada em casa, quando a resistência local às quinolonas não passa de cerca de 10% (ciprofloxacino 500 mg de 12/12 h por 7 dias, diretriz IDSA e ESCMID de 2011); prostatite bacteriana, pela boa penetração na próstata; infecções por \u003ci>Pseudomonas\u003c/i> em que se precisa de via oral; pneumonia comunitária em paciente com alergia grave a betalactâmicos ou com comorbidades (levofloxacino ou moxifloxacino); algumas diarreias bacterianas invasivas; e esquemas especiais de tuberculose resistente. Por via tópica, em colírios e gotas otológicas, as quinolonas tratam conjuntivite bacteriana e otite externa sem os riscos sistêmicos.\u003c/p>\u003cp>A resistência de \u003ci>E. coli\u003c/i> comunitária ao ciprofloxacino é elevada em várias regiões do Brasil, o que por si só já limita o uso empírico em infecção urinária e reforça a importância da urocultura com antibiograma quando o paciente tem infecções de repetição ou falha de tratamento.\u003c/p>\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Rapaz de 30 anos com pielonefrite sem sinais de gravidade recebe ciprofloxacino 500 mg de 12/12 h por 7 dias. Ele toma suplemento de whey protein com minerais e um polivitamínico com zinco no café da manhã. O farmacêutico combina ciprofloxacino às 8 h e às 20 h e passa o suplemento e o polivitamínico para as 14 h, o que deixa 6 horas de distância de cada lado, e orienta retorno se a febre persistir após 48 a 72 horas de tratamento.\u003c/p>\u003c/div>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Cliente de 68 anos, diabético em uso de glibenclamida e prednisona para doença reumática, traz receita de ciprofloxacino para infecção urinária. Há três fatores de risco somados: idade, corticoide (tendão) e sulfonilureia (hipoglicemia). O farmacêutico contata o prescritor para confirmar se não há alternativa; se a quinolona for mantida, orienta medir a glicemia capilar com mais frequência, reconhecer hipoglicemia, interromper esforço físico se surgir dor em tendão e separar o ciprofloxacino de antiácidos e suplementos.\u003c/p>\u003c/div>\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Na comunidade, quinolonas ficam para situações sem alternativa adequada. Cistite não complicada tem opções de primeira linha (nitrofurantoína, fosfomicina e, conforme perfil local de resistência, sulfametoxazol-trimetoprima); quinolona para cistite simples, sinusite ou bronquite deve ser questionada com o prescritor quando não houver motivo registrado, como alergia ou falha prévia.\u003c/p>\u003c/div>"},{"id":"m03-atb-sulfonamidas","titulo":"Sulfonamidas","resumo":"\u003cp>Bactérias precisam sintetizar o próprio ácido fólico, enquanto as células humanas o obtêm da dieta. As sulfonamidas exploram essa diferença: são análogas do ácido para-aminobenzoico (PABA) e inibem competitivamente a di-hidropteroato sintetase. A trimetoprima age um passo adiante, inibindo a di-hidrofolato redutase bacteriana, com afinidade milhares de vezes maior pela enzima da bactéria do que pela humana. Usadas juntas, produzem \u003cstrong>bloqueio sequencial\u003c/strong> da mesma via: a associação é sinérgica, bactericida e menos sujeita a resistência do que cada componente isolado.\u003c/p>\u003ch3>Sulfametoxazol-trimetoprima\u003c/h3>\u003cp>A associação (cotrimoxazol, Bactrim®) vem na proporção de 5 para 1: comprimido de 400/80 mg, comprimido \"F\" de 800/160 mg e suspensão oral de 200/40 mg por 5 mL, pronta para uso. A posologia mais comum de adulto é 800/160 mg de 12/12 h, de preferência após uma refeição e com bastante líquido (bula do Bactrim® F); doses mais altas, por peso, são usadas em pneumocistose. Espectro e usos:\u003c/p>\u003cul>\u003cli>Infecção urinária, quando a resistência local de \u003ci>E. coli\u003c/i> é baixa ou há antibiograma sensível.\u003c/li>\u003cli>MRSA comunitário em infecções de pele e partes moles (furúnculo, abscesso drenado).\u003c/li>\u003cli>\u003ci>Pneumocystis jirovecii\u003c/i>: tratamento e profilaxia em pessoas com HIV e outros imunossuprimidos; também previne toxoplasmose cerebral.\u003c/li>\u003cli>Nocardiose, \u003ci>Stenotrophomonas maltophilia\u003c/i> e algumas diarreias bacterianas.\u003c/li>\u003cli>Não cobre bem estreptococo do grupo A (faringite) nem anaeróbios.\u003c/li>\u003c/ul>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Efeito adverso\u003c/th>\u003cth>Mecanismo ou fator de risco\u003c/th>\u003cth>O que fazer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Exantema e hipersensibilidade\u003c/td>\u003ctd>As sulfonamidas estão entre as principais causas de síndrome de Stevens-Johnson e necrólise epidérmica tóxica; risco maior em pessoas com HIV\u003c/td>\u003ctd>Suspender ao primeiro sinal de lesão em mucosa, bolha ou febre com exantema e procurar atendimento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Hipercalemia\u003c/strong>\u003c/td>\u003ctd>A trimetoprima bloqueia o canal de sódio do túbulo distal, como a amilorida; soma com IECA, BRA, espironolactona, doença renal e idade avançada\u003c/td>\u003ctd>Evitar a associação ou medir potássio em poucos dias\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Elevação da creatinina\u003c/td>\u003ctd>A trimetoprima reduz a secreção tubular de creatinina sem queda real da filtração\u003c/td>\u003ctd>Interpretar com o prescritor; não confundir com lesão renal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mielossupressão\u003c/td>\u003ctd>Antifolato: anemia megaloblástica, leucopenia, trombocitopenia, maior em deficiência de folato e com metotrexato\u003c/td>\u003ctd>Hemograma em uso prolongado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hemólise\u003c/td>\u003ctd>Deficiência de G6PD\u003c/td>\u003ctd>Evitar em deficientes conhecidos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hipoglicemia\u003c/td>\u003ctd>Potencializa sulfonilureias\u003c/td>\u003ctd>Monitorar glicemia\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cristalúria\u003c/td>\u003ctd>Precipitação da sulfonamida na urina ácida\u003c/td>\u003ctd>Ingerir bastante líquido\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kernicterus\u003c/td>\u003ctd>A sulfonamida desloca a bilirrubina da albumina no recém-nascido\u003c/td>\u003ctd>Evitar no fim da gestação e em menores de 2 meses\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Na gestação, a trimetoprima, como antifolato, se associa a defeitos do tubo neural quando usada no primeiro trimestre, e a sulfonamida, a kernicterus perto do parto; o uso fica restrito a situações em que o benefício supera o risco, decisão do prescritor.\u003c/p>\u003ch3>Uso em infecção urinária e resistência\u003c/h3>\u003cp>Na cistite não complicada, a diretriz internacional da IDSA e da ESCMID (2011) aceita como primeira linha nitrofurantoína 100 mg de 12/12 h por 5 dias (formulação monoidratada e macrocristais), fosfomicina 3 g em dose única e sulfametoxazol-trimetoprima 800/160 mg de 12/12 h por 3 dias apenas onde a resistência local de \u003ci>E. coli\u003c/i> não passa de cerca de 20%. Em muitas cidades brasileiras a resistência comunitária é maior que isso, e por isso nitrofurantoína e fosfomicina costumam ser preferidas como primeira escolha empírica. Com antibiograma mostrando sensibilidade, a associação volta a ser opção barata e eficaz.\u003c/p>\u003cp>Na profilaxia de pneumocistose em pessoas com HIV e contagem baixa de linfócitos CD4, o esquema usual é de um comprimido ao dia, conforme protocolo; o uso é prolongado, e a adesão depende de orientação sobre exantema, hidratação e sinais de anemia. Em uso prolongado ou em doses altas, a fotossensibilidade também pede proteção solar.\u003c/p>\u003ch3>Interações de maior gravidade\u003c/h3>\u003cul>\u003cli>\u003cstrong>Varfarina\u003c/strong>: o sulfametoxazol inibe o CYP2C9 e desloca a varfarina da albumina; o RNI sobe de forma importante em poucos dias, com risco de sangramento. Preferir outro antibiótico ou controlar o RNI de perto.\u003c/li>\u003cli>\u003cstrong>Metotrexato\u003c/strong>: soma de efeito antifolato com redução da eliminação renal, com casos de pancitopenia fatal, mesmo em doses baixas semanais de metotrexato para artrite. Associação a evitar.\u003c/li>\u003cli>Fenitoína: aumento da concentração e risco de toxicidade.\u003c/li>\u003cli>IECA, BRA, espironolactona e suplementos de potássio: hipercalemia.\u003c/li>\u003cli>Sulfonilureias: hipoglicemia.\u003c/li>\u003c/ul>\u003ch3>Sulfadiazina e uso tópico\u003c/h3>\u003cp>A sulfadiazina oral é usada, associada à pirimetamina e ao ácido folínico, no tratamento da toxoplasmose (ocular, cerebral e congênita). Exige hidratação abundante por causa da cristalúria e hemograma pelo efeito antifolato da pirimetamina; o ácido folínico (e não o ácido fólico) protege a medula do paciente sem anular o efeito sobre o parasita. A sulfadiazina de prata 1% em creme é usada em queimaduras, com absorção limitada; em áreas extensas pode causar leucopenia transitória.\u003c/p>\u003ch3>Alergia a sulfa e outros fármacos sulfonamídicos\u003c/h3>\u003cp>Furosemida, hidroclorotiazida, sulfonilureias, acetazolamida e celecoxibe têm grupo sulfonamida, mas não o anel aromático com amina que está ligado às reações alérgicas das sulfonamidas antibacterianas. Os estudos disponíveis indicam que a reatividade cruzada entre os dois grupos é baixa, e o paciente com alergia a antibiótico sulfonamídico também tem mais reações a outros fármacos em geral, sem relação estrutural. A decisão de usar um diurético em quem tem história de alergia grave a sulfametoxazol é do prescritor, que conhece o tipo de reação.\u003c/p>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Senhora de 70 anos em uso de varfarina e losartana traz receita de sulfametoxazol-trimetoprima 800/160 mg de 12/12 h por 7 dias para infecção urinária. São duas interações relevantes: aumento do RNI e risco de hipercalemia. O farmacêutico contata o prescritor; se a prescrição for mantida, combina com a paciente um RNI em 3 a 5 dias, orienta reconhecer sangramento (gengiva, urina escura, manchas roxas, fezes pretas) e fraqueza muscular ou palpitação, e reforça a ingestão de líquidos.\u003c/p>\u003c/div>"},{"id":"m03-atb-glicopeptideos","titulo":"Glicopeptídeos","resumo":"\u003cp>Glicopeptídeos são moléculas grandes que se ligam à extremidade D-alanil-D-alanina dos precursores do peptidoglicano e impedem que eles sejam incorporados à parede. Por serem grandes, não atravessam a membrana externa dos Gram-negativos: o espectro é restrito a \u003cstrong>Gram-positivos\u003c/strong>. A vancomicina e a teicoplanina são de uso hospitalar por via parenteral. Na farmácia comercial, a vancomicina aparece pouco: em geral no paciente que sai do hospital com dose oral para colite por \u003ci>Clostridioides difficile\u003c/i>.\u003c/p>\u003ch3>Vancomicina intravenosa\u003c/h3>\u003cp>Indicada em infecções graves por MRSA (bacteremia, endocardite, pneumonia, osteomielite), por estafilococos coagulase-negativos em próteses e cateteres, por enterococo sensível em alérgicos a penicilina e no esquema empírico de meningite bacteriana e sepse. É bactericida lenta, e seu índice farmacodinâmico é a AUC/CIM.\u003c/p>\u003cp>A atualização do consenso de monitorização da vancomicina (ASHP, IDSA, PIDS e SIDP, 2020) mudou a prática: para infecções graves por MRSA, recomenda alvo de AUC de 24 horas sobre CIM entre 400 e 600 mg·h/L (assumindo CIM de 1 mg/L por microdiluição), estimada de preferência por software bayesiano, ou por duas concentrações (pico e vale). A monitorização só pelo vale, com alvo de 15 a 20 mg/L, deixou de ser recomendada, porque expõe o paciente a mais nefrotoxicidade sem ganho de eficácia. A AUC acima de 600 mg·h/L se associa a mais lesão renal aguda.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Efeito adverso\u003c/th>\u003cth>Características\u003c/th>\u003cth>Prevenção e manejo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Nefrotoxicidade\u003c/strong>\u003c/td>\u003ctd>Aumento da creatinina, em geral reversível; risco maior com AUC elevada, uso prolongado, piperacilina-tazobactam, aminoglicosídeos, contraste e anti-inflamatórios\u003c/td>\u003ctd>Dose ajustada pela função renal e monitorização da AUC; hidratação\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reação de infusão (\"síndrome do homem vermelho\")\u003c/td>\u003ctd>Liberação direta de histamina, sem IgE: rubor em face, pescoço e tronco, prurido e às vezes hipotensão, durante ou logo após a infusão rápida\u003c/td>\u003ctd>Infundir em pelo menos 60 minutos (mais para doses maiores); anti-histamínico antes nas doses seguintes; não é alergia e não impede o reuso\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ototoxicidade\u003c/td>\u003ctd>Rara; maior com outros ototóxicos\u003c/td>\u003ctd>Atenção a zumbido e perda auditiva\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neutropenia e trombocitopenia\u003c/td>\u003ctd>Em uso prolongado, por mecanismo imune\u003c/td>\u003ctd>Hemograma em cursos longos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Flebite\u003c/td>\u003ctd>Solução irritante em veia periférica\u003c/td>\u003ctd>Diluição adequada e rodízio de acesso\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>O nome \"síndrome do homem vermelho\" vem sendo substituído por \"reação de infusão à vancomicina\", termo mais descritivo e sem conotação de gênero ou etnia. A distinção prática é com a anafilaxia verdadeira (rara), que tem urticária generalizada, broncoespasmo ou angioedema e não melhora apenas reduzindo a velocidade.\u003c/p>\u003ch3>Resistência à vancomicina e outros fármacos anti-MRSA\u003c/h3>\u003cp>Enterococos resistentes à vancomicina (VRE) adquirem genes, como \u003ci>vanA\u003c/i> e \u003ci>vanB\u003c/i>, que trocam a extremidade D-alanil-D-alanina por D-alanil-D-lactato, à qual o glicopeptídeo não se liga. Também há estafilococos com sensibilidade intermediária (VISA), de parede espessada. Nessas situações, e em pacientes que não toleram a vancomicina, entram outros fármacos com ação em Gram-positivos resistentes:\u003c/p>\u003cul>\u003cli>Daptomicina: lipopeptídeo intravenoso, bactericida, uma vez ao dia; inativada pelo surfactante pulmonar, não serve para pneumonia; causa miopatia com elevação de CPK, com risco maior junto a estatinas.\u003c/li>\u003cli>Linezolida: opção oral para MRSA e VRE (ver inibidores da síntese proteica).\u003c/li>\u003cli>Ceftarolina: cefalosporina com ação em MRSA.\u003c/li>\u003cli>Para MRSA comunitário em pele e partes moles, fora do hospital: sulfametoxazol-trimetoprima, doxiciclina e, conforme antibiograma, clindamicina.\u003c/li>\u003c/ul>\u003ch3>Teicoplanina\u003c/h3>\u003cp>Tem espectro semelhante ao da vancomicina, meia-vida longa e pode ser dada uma vez ao dia, por via intravenosa ou intramuscular, depois de doses de ataque. Causa menos nefrotoxicidade e menos reação de infusão. A monitorização, quando feita, é pela concentração de vale. Está no grupo Watch da OMS.\u003c/p>\u003ch3>Vancomicina oral para \u003ci>Clostridioides difficile\u003c/i>\u003c/h3>\u003cp>Por via oral, a vancomicina praticamente não é absorvida: age só na luz intestinal, o que a torna inútil para infecções sistêmicas e eficaz contra o \u003ci>C. difficile\u003c/i>. O esquema usual de adulto para o episódio inicial é 125 mg de 6/6 h por 10 dias. Na atualização de 2021 da diretriz da IDSA e da SHEA, a fidaxomicina passou a ser preferida para o episódio inicial quando disponível, e a vancomicina oral continua como alternativa aceita; o metronidazol ficou restrito a episódios não graves quando nenhum dos dois está disponível. Recorrências podem exigir esquemas de vancomicina com redução gradual e pulsos.\u003c/p>\u003cp>No Brasil, a prática corrente é preparar a dose oral a partir do pó liofilizado para solução injetável: por exemplo, o frasco de 500 mg reconstituído com 10 mL de água dá 50 mg/mL, de modo que 125 mg correspondem a 2,5 mL, com estabilidade de 14 dias sob refrigeração (Nota Técnica nº 233/2024 do Serviço de Farmácia do InCor, HC-FMUSP). Se houver cápsula oral registrada, confira na consulta de produtos da Anvisa antes de orientar. O sabor é amargo, e a dose pode ser misturada a um pouco de suco.\u003c/p>\u003cul>\u003cli>Orientar a lavagem das mãos com água e sabão: os esporos do \u003ci>C. difficile\u003c/i> resistem ao álcool em gel.\u003c/li>\u003cli>Evitar antidiarreicos (loperamida) e inibidores da bomba de prótons sem indicação clara, que se associam a recorrência.\u003c/li>\u003cli>Retorno imediato se houver febre alta, distensão abdominal, piora da dor ou parada súbita da diarreia com barriga distendida (sinal de íleo ou megacólon).\u003c/li>\u003cli>Evitar novos antibióticos sem necessidade nos meses seguintes, pelo risco de recorrência.\u003c/li>\u003c/ul>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Paciente que recebeu alta com vancomicina oral 125 mg de 6/6 h pergunta se pode parar quando a diarreia melhorar no terceiro dia. Oriente completar os 10 dias prescritos, porque o esquema foi definido para reduzir recorrência; explique que a melhora começa em poucos dias e que piora, febre ou sangue nas fezes exigem retorno. Reforce a higiene das mãos com água e sabão para toda a família e a limpeza do banheiro com produto à base de cloro.\u003c/p>\u003c/div>\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Vancomicina oral trata só o intestino; vancomicina intravenosa trata infecções sistêmicas e não serve para colite por \u003ci>C. difficile\u003c/i>, porque não chega à luz intestinal em concentração eficaz.\u003c/p>\u003c/div>"},{"id":"m03-atb-antifungicos-antivirais","titulo":"Antifúngicos, antivirais e antiparasitários de uso comum","resumo":"\u003cp>Além dos antibacterianos, a farmácia comercial dispensa todos os dias antifúngicos, antivirais e antiparasitários. Muitos são de dose única ou curso curto, e o paciente tende a vê-los como \"remédios simples\". Os pontos críticos são interações (fluconazol, terbinafina), contraindicações na gestação (albendazol, secnidazol, ivermectina sem orientação médica) e o uso sem indicação.\u003c/p>\u003ch3>Antifúngicos\u003c/h3>\u003cp>\u003cstrong>Fluconazol\u003c/strong> é um azólico que inibe a 14-alfa-desmetilase fúngica (enzima do citocromo P450), bloqueando a síntese de ergosterol da membrana. Tem boa absorção oral, independente de alimento, e meia-vida longa (cerca de 30 horas), o que permite a dose única de 150 mg por via oral na candidíase vulvovaginal não complicada (segunda opção no PCDT IST 2022, depois do tratamento tópico vaginal). Na candidíase recorrente (quatro ou mais episódios por ano), há esquemas de indução e manutenção semanal por meses, definidos pelo prescritor. Também é usado em candidíase oral e esofágica e em criptococose.\u003c/p>\u003cul>\u003cli>\u003cstrong>Interações\u003c/strong>: é inibidor forte do CYP2C19 e moderado do CYP2C9 e do CYP3A4 (tabela de inibidores da FDA). Aumenta o efeito da varfarina (sangramento), da fenitoína, das sulfonilureias (hipoglicemia), de sinvastatina e atorvastatina (miopatia), de alguns benzodiazepínicos e do tacrolimo. Prolonga o QT, com risco aditivo com outros fármacos que também o fazem.\u003c/li>\u003cli>Mesmo a dose única de 150 mg pode elevar o RNI de quem usa varfarina; comunicar o prescritor ou orientar controle.\u003c/li>\u003cli>Gestação: preferir azólico tópico vaginal; o fluconazol oral, sobretudo em doses altas e no primeiro trimestre, se associa a malformações.\u003c/li>\u003cli>Hepatotoxicidade rara; exantema.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Nistatina\u003c/strong> é um polieno que se liga ao ergosterol e forma poros na membrana. Não é absorvida pelo trato digestivo: age só no local. Na candidíase oral, a suspensão de 100 mil UI/mL é usada, no adulto, na faixa de 1 a 6 mL quatro vezes ao dia, conforme prescrição, bochechada e mantida na boca o maior tempo possível antes de engolir, e continuada por pelo menos 48 horas após o desaparecimento das lesões (conforme bula). Retirar e higienizar próteses dentárias. Praticamente não tem interações.\u003c/p>\u003cp>\u003cstrong>Terbinafina\u003c/strong> inibe a esqualeno epoxidase e é fungicida para dermatófitos. Por via oral, 250 mg uma vez ao dia, é usada em onicomicose (pela bula, a maioria dos pacientes precisa de 6 semanas a 3 meses, e a unha do hálux pode exigir 6 meses ou mais) e em tinha do couro cabeludo. Riscos: hepatotoxicidade rara e grave (recomenda-se avaliar função hepática antes; orientar parar e procurar atendimento se houver icterícia, urina escura, náusea persistente ou cansaço intenso), alteração de paladar e olfato que pode durar meses, exantema grave e lúpus induzido. É inibidor forte do CYP2D6 (tabela da FDA): aumenta tricíclicos, metoprolol e alguns antipsicóticos, e reduz a ativação de codeína e tramadol. A terbinafina tópica é isenta de prescrição; a oral exige receita.\u003c/p>\u003ch3>Antivirais\u003c/h3>\u003cp>\u003cstrong>Aciclovir e valaciclovir\u003c/strong> são análogos de guanosina ativados pela timidina quinase do vírus herpes e, depois, inibem a DNA polimerase viral. O valaciclovir é pró-fármaco do aciclovir com biodisponibilidade três a cinco vezes maior, o que permite menos tomadas. O benefício é maior quando o tratamento começa cedo: no herpes-zóster, até 72 horas após o surgimento das lesões.\u003c/p>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Indicação (adulto)\u003c/th>\u003cth>Aciclovir\u003c/th>\u003cth>Valaciclovir\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Herpes genital, primeiro episódio\u003c/td>\u003ctd>400 mg de 8/8 h ou 200 mg cinco vezes ao dia, por 7 a 10 dias (PCDT IST 2022)\u003c/td>\u003ctd>1 g de 12/12 h por 10 dias (bula)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Herpes genital, recidiva\u003c/td>\u003ctd>400 mg de 8/8 h ou 800 mg de 12/12 h, por 5 dias, de preferência desde o pródromo (PCDT IST 2022)\u003c/td>\u003ctd>500 mg de 12/12 h por 3 dias (bula)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Herpes-zóster\u003c/td>\u003ctd>800 mg cinco vezes ao dia por 7 dias (bula do Zovirax®)\u003c/td>\u003ctd>1 g de 8/8 h por 7 dias (bula)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Herpes labial recorrente\u003c/td>\u003ctd>Bula: 200 mg cinco vezes ao dia por 5 dias (herpes simples); creme tópico como alternativa local\u003c/td>\u003ctd>2 g de 12/12 h por 1 dia, iniciado nos primeiros sintomas (bula)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>O PCDT IST de 2022 do Ministério da Saúde traz apenas esquemas de aciclovir; os de valaciclovir vêm da bula do Valtrex® (FDA, revisão de 2025). A dose final depende da prescrição e exige ajuste pela função renal (TFG por CKD-EPI 2021). Os efeitos adversos são leves (náusea, cefaleia), mas, em idosos e em doença renal, podem ocorrer nefrotoxicidade por cristais e neurotoxicidade (confusão, alucinações, tremor). Orientar boa hidratação. Interações relevantes são poucas.\u003c/p>\u003cp>\u003cstrong>Oseltamivir\u003c/strong> inibe a neuraminidase dos vírus influenza A e B e impede a liberação de novas partículas da célula infectada. Pelo guia de manejo e tratamento de influenza do Ministério da Saúde (2023), o tratamento é indicado a todos os casos de síndrome respiratória aguda grave e aos casos de síndrome gripal em pessoas com fator de risco (gestantes e puérperas, menores de 5 anos, idosos a partir de 60 anos, doenças crônicas pulmonares, cardíacas, renais, hepáticas, neurológicas e metabólicas, imunossupressão, obesidade grave, indígenas aldeados, entre outros). O maior benefício ocorre com início em até 48 horas dos sintomas, mas, em grupos de risco e casos graves, o tratamento iniciado depois ainda é indicado.\u003c/p>\u003cul>\u003cli>Tratamento de adulto: 75 mg de 12/12 h por 5 dias; quimioprofilaxia: 75 mg uma vez ao dia por 10 dias, nas situações previstas no guia.\u003c/li>\u003cli>Ajuste renal do tratamento: com depuração de creatinina entre 30 e 60 mL/min, 30 mg de 12/12 h; entre 10 e 30 mL/min, 30 mg uma vez ao dia (bula do Tamiflu®, 2025).\u003c/li>\u003cli>Tomar com alimento reduz náusea e vômito, os efeitos mais comuns.\u003c/li>\u003cli>Relatos raros de alterações neuropsiquiátricas (confusão, comportamento anormal), sobretudo em crianças e adolescentes; família deve observar.\u003c/li>\u003cli>Não substitui a vacina anual contra influenza.\u003c/li>\u003c/ul>\u003ch3>Antiparasitários\u003c/h3>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Mecanismo\u003c/th>\u003cth>Posologia de adulto (bula)\u003c/th>\u003cth>Alimento\u003c/th>\u003cth>Cuidados\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Ivermectina\u003c/strong>\u003c/td>\u003ctd>Abre canais de cloreto dependentes de glutamato do parasita, causando paralisia\u003c/td>\u003ctd>Dose única de cerca de 200 mcg/kg (estrongiloidíase, escabiose, pediculose, ascaridíase); 150 mcg/kg na oncocercose\u003c/td>\u003ctd>Com água, segundo a bula brasileira; a bula norte-americana pede estômago vazio\u003c/td>\u003ctd>Não usar abaixo de 15 kg ou de 5 anos; gestação e amamentação só com orientação médica; na escabiose, reavaliar em 1 a 2 semanas e tratar contactantes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Albendazol\u003c/strong>\u003c/td>\u003ctd>Liga-se à beta-tubulina e bloqueia a captação de glicose pelo verme\u003c/td>\u003ctd>400 mg dose única (ascaridíase, ancilostomíase, tricuríase, enterobíase); 400 mg por dia por 3 dias (estrongiloidíase, teníase)\u003c/td>\u003ctd>Conforme bula do produto\u003c/td>\u003ctd>Contraindicado na gestação; a partir de 2 anos; comprimido mastigável; uso prolongado exige controle hepático e hemograma\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Nitazoxanida\u003c/strong>\u003c/td>\u003ctd>Interfere no metabolismo energético anaeróbio (enzima PFOR) de protozoários e helmintos\u003c/td>\u003ctd>500 mg de 12/12 h por 3 dias; suspensão de 20 mg/mL na criança: 7,5 mg/kg de 12/12 h\u003c/td>\u003ctd>Sempre com alimento\u003c/td>\u003ctd>A partir de 1 ano; urina e sêmen amarelo-esverdeados sem significado clínico; suspensão vale 7 dias após o preparo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>A ivermectina não tem benefício demonstrado no tratamento ou na prevenção da COVID-19 em ensaios clínicos randomizados, e o uso repetido sem indicação expõe o paciente a efeitos adversos e interações (a bula norte-americana cita relatos raros de aumento do RNI com varfarina). Na enterobíase (oxiuríase), é comum repetir a dose do anti-helmíntico após cerca de duas semanas e tratar todos os moradores da casa, com cuidados de higiene (unhas curtas, troca de roupa de cama e lavagem das mãos).\u003c/p>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Mulher de 26 anos pede albendazol para toda a família. Antes de dispensar, pergunte se há gestante ou possibilidade de gravidez (contraindicado), criança com menos de 2 anos e se houve diagnóstico ou apenas desconfiança. Confira o enquadramento sanitário do produto (tarja e lista de isentos de prescrição vigente) e, sem diagnóstico, oriente consulta, higiene dos alimentos e lavagem das mãos. Na mesma situação, se a pessoa já usa varfarina e recebe receita de fluconazol 150 mg, avise o prescritor sobre o risco de aumento do RNI.\u003c/p>\u003c/div>"},{"id":"m03-atb-orientacao","titulo":"Orientação ao paciente em uso de antimicrobiano","resumo":"\u003cp>A orientação na dispensação decide boa parte do resultado de um tratamento antimicrobiano. Falhas de adesão, doses em horários errados, interação com antiácido ou ferro e suspensão mal conservada reduzem a eficácia e aumentam a chance de recaída e de resistência. A conversa deve ser curta, objetiva e confirmada: ao final, peça ao paciente que repita como vai tomar.\u003c/p>\u003ch3>Horários e doses esquecidas\u003c/h3>\u003cp>Intervalo de 8/8 h significa três doses distribuídas nas 24 horas, e não \"de manhã, à tarde e à noite\" com 12 horas de jejum noturno. Ajude o paciente a escolher horários compatíveis com a rotina (6 h, 14 h e 22 h; ou 7 h, 15 h e 23 h) e a usar alarme no celular. Em 12/12 h, horários fixos como 8 h e 20 h. Para as doses esquecidas, a regra geral é tomar assim que lembrar, a não ser que esteja perto da dose seguinte; nesse caso, pular a esquecida e seguir o horário normal. Nunca dobrar a dose.\u003c/p>\u003ch3>Alimento, laticínios e antiácidos\u003c/h3>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Situação\u003c/th>\u003cth>Fármacos\u003c/th>\u003cth>Orientação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tomar com alimento\u003c/td>\u003ctd>Amoxicilina-clavulanato (no início da refeição), cefuroxima axetila, nitrofurantoína, nitazoxanida, secnidazol (em uma refeição), metronidazol (reduz náusea), oseltamivir (reduz náusea), sulfametoxazol-trimetoprima (de preferência após refeição)\u003c/td>\u003ctd>Melhora absorção ou tolerância\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tomar em jejum\u003c/td>\u003ctd>Fosfomicina trometamol (ou 2 a 3 horas após refeição), rifampicina no tratamento da tuberculose\u003c/td>\u003ctd>Alimento reduz ou atrasa a absorção\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Indiferente\u003c/td>\u003ctd>Amoxicilina, cefalexina, azitromicina comprimido, doxiciclina, fluconazol, aciclovir, valaciclovir, linezolida\u003c/td>\u003ctd>Escolher o que favorecer a adesão\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separar de cátions (cálcio, magnésio, alumínio, ferro, zinco)\u003c/td>\u003ctd>Tetraciclinas e quinolonas\u003c/td>\u003ctd>Antiácidos, suplementos minerais, multivitamínicos, sucralfato e leite afastados das doses, no intervalo indicado na bula\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copo cheio de água e não deitar\u003c/td>\u003ctd>Doxiciclina, minociclina, clindamicina\u003c/td>\u003ctd>Prevenção de esofagite\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Álcool\u003c/h3>\u003cp>Para a maioria dos antibióticos, quantidades moderadas de álcool não alteram a eficácia, mas o álcool piora náusea, tontura e hepatotoxicidade e atrapalha o descanso e a hidratação. Há situações específicas:\u003c/p>\u003cul>\u003cli>Nitroimidazólicos: as bulas brasileiras pedem evitar álcool durante o tratamento e por 1 dia (metronidazol) ou 4 dias (secnidazol) depois; a evidência de reação dissulfiram-símile é fraca, mas a orientação da bula vale.\u003c/li>\u003cli>Linezolida: bebidas fermentadas ricas em tiramina (chope e vinho tinto) somam risco de elevação da pressão.\u003c/li>\u003cli>Rifampicina, isoniazida e pirazinamida: o álcool aumenta o risco de hepatite medicamentosa.\u003c/li>\u003cli>Lembrar que xaropes e soluções orais podem conter álcool.\u003c/li>\u003c/ul>\u003ch3>Anticoncepcional hormonal\u003c/h3>\u003cp>A ideia de que \"todo antibiótico corta o efeito da pílula\" não se sustenta. Os critérios médicos de elegibilidade dos Estados Unidos (CDC, US MEC, edição de 2024) classificam os antibióticos de amplo espectro, os antifúngicos e os antiparasitários na categoria 1 com anticoncepcionais combinados (sem restrição). A redução de eficácia comprovada ocorre com os indutores enzimáticos: entre os antimicrobianos, rifampicina e rifabutina (categoria 3 com anticoncepcionais combinados, pílula de progestagênio isolado e adesivo ou anel). A griseofulvina, antifúngico também indutor, entra na mesma preocupação.\u003c/p>\u003cp>A orientação útil é outra: se houver \u003cstrong>vômito em até 3 a 4 horas\u003c/strong> depois de tomar a pílula, ou diarreia intensa, a absorção pode ter falhado, e vale a regra de pílula esquecida da bula do anticoncepcional. Com rifampicina, a paciente precisa de método não afetado pela indução (DIU de cobre ou hormonal, ou injetável trimestral), conforme decisão com o prescritor, mantido por semanas depois de suspender o indutor.\u003c/p>\u003ch3>Suspensões orais reconstituídas\u003c/h3>\u003cp>Antibióticos em pó para suspensão são instáveis em solução e por isso vêm secos. A reconstituição é feita pelo paciente ou, quando a farmácia oferece o serviço, pelo farmacêutico. Passo a passo geral (siga sempre a bula do produto):\u003c/p>\u003cul>\u003cli>Bater o frasco fechado para soltar o pó.\u003c/li>\u003cli>Usar água filtrada ou fervida e já fria, em temperatura ambiente; nunca água quente.\u003c/li>\u003cli>Acrescentar a água até a marca em duas etapas, agitando entre elas, e completar até a marca depois que a espuma baixar.\u003c/li>\u003cli>Anotar no rótulo a data de preparo e a data de descarte.\u003c/li>\u003cli>Agitar antes de cada dose e medir com a seringa ou o copo dosador do produto; colher de cozinha não é medida confiável.\u003c/li>\u003cli>Conservar como a bula indica: algumas suspensões vão à geladeira (amoxicilina-clavulanato, cefuroxima), outras ficam em temperatura ambiente (claritromicina, azitromicina e algumas amoxicilinas genéricas).\u003c/li>\u003cli>Descartar o que sobrar ao fim do prazo, mesmo que pareça bom.\u003c/li>\u003c/ul>\u003cp>A validade após o preparo varia entre fabricantes e concentrações do mesmo fármaco; a tabela do material de apoio traz exemplos conferidos em bulas, mas a regra é sempre a bula do produto dispensado.\u003c/p>\u003ch3>Completar o tratamento ou duração mais curta\u003c/h3>\u003cp>Durante décadas a mensagem foi \"tome até o fim, mesmo que melhore\". Em 2017, uma análise publicada no BMJ (Llewelyn e colaboradores) mostrou que essa recomendação nunca foi baseada em estudos e que não há evidência de que parar cedo cause resistência; o que aumenta a resistência é a exposição mais longa do que o necessário. Desde então, ensaios clínicos confirmaram cursos mais curtos em várias infecções comuns, e diretrizes passaram a recomendar, por exemplo, duração mínima de 5 dias na pneumonia comunitária de adulto com boa evolução (ATS e IDSA, 2019) e cursos de 3 a 7 dias na cistite, conforme o fármaco.\u003c/p>\u003cp>A mensagem atual é \u003cstrong>tomar exatamente como prescrito\u003c/strong> e não interromper por conta própria. Se o paciente melhorou muito antes do previsto, quem decide encurtar é o prescritor. Existem exceções em que o curso longo é indispensável: tuberculose, endocardite, osteomielite, infecções de prótese e algumas ISTs. Sobra de antibiótico em casa não deve ser guardada para \"a próxima vez\" nem oferecida a outra pessoa; o descarte deve ser feito nos pontos de coleta de medicamentos domiciliares previstos no sistema de logística reversa (Decreto nº 10.388/2020).\u003c/p>\u003ch3>Sinais de reação grave\u003c/h3>\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Sinal\u003c/th>\u003cth>Possível causa\u003c/th>\u003cth>Orientação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Falta de ar, chiado, inchaço de lábios, língua ou garganta, urticária generalizada, desmaio, minutos a horas após a dose\u003c/td>\u003ctd>Anafilaxia\u003c/td>\u003ctd>Emergência: SAMU 192; não tomar nova dose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Febre, mal-estar e lesões em boca, olhos ou genitais, bolhas ou descamação da pele\u003c/td>\u003ctd>Síndrome de Stevens-Johnson ou necrólise epidérmica tóxica\u003c/td>\u003ctd>Suspender e procurar atendimento de urgência\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exantema com febre, ínguas e inchaço do rosto 2 a 8 semanas após o início\u003c/td>\u003ctd>DRESS\u003c/td>\u003ctd>Procurar atendimento; exige exames\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Diarreia intensa, com sangue ou febre, durante ou semanas depois\u003c/td>\u003ctd>Colite por \u003ci>C. difficile\u003c/i>\u003c/td>\u003ctd>Procurar o prescritor; não usar antidiarreico por conta própria\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dor ou inchaço em tendão\u003c/td>\u003ctd>Quinolona\u003c/td>\u003ctd>Repouso do membro e contato com o prescritor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pele ou olhos amarelos, urina escura\u003c/td>\u003ctd>Hepatite medicamentosa\u003c/td>\u003ctd>Suspender e procurar atendimento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Palpitação, desmaio\u003c/td>\u003ctd>Prolongamento do QT (macrolídeos, quinolonas, fluconazol)\u003c/td>\u003ctd>Atendimento de urgência\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Zumbido, perda auditiva, tontura rotatória\u003c/td>\u003ctd>Aminoglicosídeo, vancomicina\u003c/td>\u003ctd>Contato imediato com o prescritor\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Suspeita de reação adversa ou de falha terapêutica deve ser notificada à Anvisa pelo VigiMed, sistema aberto a profissionais e cidadãos. Registre também a reação no histórico do paciente na farmácia, com o fármaco, o tipo de reação e a data.\u003c/p>\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Mãe recebe amoxicilina-clavulanato suspensão para o filho de 3 anos com otite. Roteiro rápido: confirmar peso e alergias; reconstituir junto com ela ou demonstrar; anotar a data de descarte no frasco (7 dias, em geladeira, segundo as bulas consultadas); mostrar a dose na seringa; combinar horários de 12/12 h no início das refeições; explicar que diarreia leve pode ocorrer e que vômito, manchas na pele, febre que não cede em 48 a 72 horas ou sonolência excessiva exigem retorno; e pedir que ela repita as instruções.\u003c/p>\u003c/div>\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Antes de entregar o antimicrobiano, confirme cinco pontos com o paciente: para que serve, como e quando tomar, por quantos dias, o que evitar junto e quando voltar ou procurar atendimento.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m03-atb-mapa-principios","titulo":"Princípios e resistência","centro":"Antibioticoterapia","ramos":[{"t":"Ação","itens":["Bactericida: betalactâmicos, aminoglicosídeos, quinolonas","Bacteriostático: macrolídeos, tetraciclinas, clindamicina","Bactericida importa: endocardite, meningite, neutropenia"]},{"t":"Grupos de bactérias","itens":["Gram+: estafilo, estrepto, pneumo, enterococo","Gram-: E. coli, Klebsiella, Pseudomonas, Haemophilus","Atípicos: sem parede ou intracelulares; betalactâmico falha","Anaeróbios: metronidazol, clindamicina, amox-clav"]},{"t":"PK/PD","itens":["Tempo-dependente (T > CIM): betalactâmicos","Pico/CIM: aminoglicosídeos, dose única diária","AUC/CIM: quinolonas, vancomicina, azitromicina","Horário regular pesa mais nos betalactâmicos"]},{"t":"Resistência","itens":["Enzimas, alvo alterado, porinas, efluxo","ESBL: tratar infecção grave com carbapenêmico","MRSA: PBP2a; só ceftarolina entre betalactâmicos","Pressão seletiva: volume de uso é o principal motor"]},{"t":"AWaRe (OMS 2025)","itens":["Access: amoxicilina, cefalexina, doxiciclina","Watch: azitromicina, quinolonas, ceftriaxona","Reserve: linezolida, polimixinas","Meta ONU 2024: 70% do uso em Access até 2030"]},{"t":"Farmacêutico","itens":["Receita retida, válida 10 dias (IN 360/2025)","Conferir alergia, gestação, rim, interações","Orientar horário, alimento, duração, sinais de alerta","Notificar reação adversa no VigiMed"]}]},{"id":"m03-atb-mapa-betalactamicos","titulo":"Betalactâmicos","centro":"Betalactâmicos","ramos":[{"t":"Mecanismo","itens":["Ligam PBP e bloqueiam a parede","Bactericidas e tempo-dependentes","Baixa toxicidade; alergia é o problema principal"]},{"t":"Penicilinas","itens":["Benzatina IM: sífilis 2,4 milhões de UI","Amoxicilina: com ou sem alimento","Amox-clav: no início da refeição; diarreia","Exantema na mononucleose não é alergia IgE"]},{"t":"Cefalosporinas","itens":["1ª: cefalexina, cefadroxila (pele, ITU)","2ª: cefuroxima com alimento (otite, sinusite)","3ª: ceftriaxona; 4ª: cefepima","5ª: ceftarolina, ativa contra MRSA","Nenhuma cobre enterococo nem Listeria"]},{"t":"Carbapenêmicos e outros","itens":["Meropeném, imipeném, ertapeném: ESBL","Carbapenêmico derruba ácido valproico","Aztreonam: só Gram-; cruza com ceftazidima"]},{"t":"Alergia a penicilina","itens":["10% relatam; menos de 1% confirmados (CDC)","Cefalosporina: reação abaixo de 2%","Risco segue a cadeia lateral R1","SSJ, NET, DRESS: nunca reexpor","Desrotulagem: estratificar e provocar"]}]},{"id":"m03-atb-mapa-demais","titulo":"Demais classes antibacterianas","centro":"Demais classes","ramos":[{"t":"Síntese proteica","itens":[{"t":"Macrolídeos","itens":["QT; claritromicina inibe CYP3A4","Claritro + sinvastatina: contraindicado"]},{"t":"Tetraciclinas","itens":["Cátions, sol, esôfago","Doxiciclina: febre maculosa em toda idade"]},"Aminoglicosídeos: rim e ouvido, uso hospitalar","Clindamicina: alto risco de C. difficile","Linezolida: serotoninérgica, mielossupressão"]},{"t":"Ácidos nucleicos e outros","itens":["Rifampicina: indutor potente, secreções laranja","Metronidazol: álcool conforme bula; varfarina","Nitrofurantoína: só cistite; bula BR: ClCr 60","Fosfomicina 3 g em jejum, à noite"]},{"t":"Quinolonas","itens":["Tendão, nervo, SNC, glicemia, aorta, QT","Separar de cátions e antiácidos","Cipro inibe CYP1A2: teofilina, tizanidina","Evitar em infecção leve (FDA 2016, EMA 2018)"]},{"t":"Sulfonamidas","itens":["SMX-TMP: bloqueio sequencial do folato","Hipercalemia com IECA, BRA, espironolactona","Varfarina: RNI sobe; metotrexato: pancitopenia","SSJ: suspender ao primeiro sinal"]},{"t":"Glicopeptídeos","itens":["Vancomicina IV: alvo AUC 400 a 600 (2020)","Reação de infusão: infundir em 60 min ou mais","Vancomicina oral só para C. difficile","Teicoplanina: 1 vez ao dia, menos nefrotóxica"]}]}],"apoio":[{"tipo":"tabela","id":"m03-atb-tab-mestra","titulo":"Tabela-mestra das classes antibacterianas","colunas":["Classe","Exemplos","Mecanismo","Espectro","Efeitos adversos marcantes","Orientação ao paciente"],"linhas":[["Penicilinas","Benzatina, amoxicilina, ampicilina, oxacilina","Inibem PBP (parede)","Estreptococos, treponema; amoxicilina amplia para alguns Gram-","Alergia, diarreia, exantema","Horário regular; amoxicilina com ou sem alimento"],["Penicilina + inibidor","Amoxicilina-clavulanato, ampicilina-sulbactam, piperacilina-tazobactam","Inibidor protege da betalactamase","Acrescenta produtores de betalactamase e anaeróbios","Diarreia, hepatite colestática rara","No início da refeição; procurar se diarreia com sangue"],["Cefalosporinas","Cefalexina, cefadroxila, cefuroxima, ceftriaxona, cefepima, ceftarolina","Inibem PBP","Varia por geração; nenhuma cobre enterococo","Alergia, diarreia, \u003ci>C. difficile\u003c/i>","Cefuroxima com alimento"],["Carbapenêmicos","Meropeném, imipeném, ertapeném","Inibem PBP","Muito amplo, inclusive ESBL","Convulsão (imipeném), \u003ci>C. difficile\u003c/i>","Uso hospitalar; interação com valproato"],["Monobactâmico","Aztreonam","Inibe PBP3 de Gram-","Gram- aeróbios","Exantema, flebite","Uso hospitalar"],["Macrolídeos","Azitromicina, claritromicina, eritromicina","Subunidade 50S","Atípicos, estreptococos, clamídia","QT, náusea, interações CYP3A4","Informar estatinas, colchicina e anticoagulantes em uso"],["Tetraciclinas","Doxiciclina, minociclina","Subunidade 30S","Atípicos, riquétsias, clamídia, MRSA comunitário","Esofagite, fotossensibilidade, dentes","Copo cheio de água, não deitar; separar de cátions"],["Aminoglicosídeos","Gentamicina, amicacina, tobramicina","Subunidade 30S","Gram- aeróbios","Nefro e ototoxicidade","Uso hospitalar; tópicos na farmácia"],["Lincosamidas","Clindamicina","Subunidade 50S","Gram+ e anaeróbios","Diarreia por \u003ci>C. difficile\u003c/i>","Copo cheio de água; procurar se diarreia intensa"],["Cloranfenicol","Cloranfenicol","Subunidade 50S","Amplo","Aplasia de medula","Na farmácia, quase só colírio e pomada"],["Oxazolidinonas","Linezolida","Subunidade 50S (iniciação)","Gram+ resistentes (MRSA, VRE)","Síndrome serotoninérgica, mielossupressão","Evitar antigripais simpatomiméticos e excesso de tiramina"],["Rifamicinas","Rifampicina, rifabutina","RNA polimerase","Micobactérias, estafilococo (associada)","Hepatotoxicidade, indução enzimática","Secreções alaranjadas; método contraceptivo não hormonal oral"],["Nitroimidazólicos","Metronidazol, secnidazol, tinidazol","Radicais que lesam DNA","Anaeróbios e protozoários","Gosto metálico, neuropatia","Evitar álcool conforme bula"],["Nitrofuranos","Nitrofurantoína","Intermediários reativos (DNA, ribossomo)","Gram- urinários","Reações pulmonares, hemólise","Com alimento; urina escura esperada"],["Fosfonatos","Fosfomicina trometamol","Inibe MurA (parede)","Gram- urinários, inclusive ESBL","Diarreia","Dose única em jejum, à noite"],["Fluoroquinolonas","Ciprofloxacino, levofloxacino, moxifloxacino, norfloxacino","DNA girase e topoisomerase IV","Gram-; respiratórias cobrem pneumococo","Tendão, nervo, SNC, glicemia, aorta, QT","Separar de cátions; avisar dor em tendão"],["Sulfonamida + trimetoprima","Sulfametoxazol-trimetoprima, sulfadiazina","Bloqueio sequencial do folato","Gram- urinários, MRSA comunitário, \u003ci>P  h)","Sem restrição na bula; copo cheio de água","Bloqueadores neuromusculares (hospital)"],["Ciprofloxacino","250 a 500 mg de 12/12 h; 750 mg de 12/12 h em infecção grave","Indiferente, mas não só com leite, iogurte ou suco com cálcio","Cátions (1 a 2 h antes ou 4 h depois); teofilina; tizanidina (contraindicada)"],["Levofloxacino","500 mg 1 vez ao dia (750 mg em algumas indicações)","Indiferente","Cátions (2 h antes ou depois); fármacos que prolongam o QT; corticoide (tendão)"],["Norfloxacino","400 mg de 12/12 h (cistite: 3 a 7 dias)","Conforme bula do produto","Cátions e polivitamínicos (2 h de intervalo); teofilina"],["Sulfametoxazol-trimetoprima","800/160 mg de 12/12 h","De preferência após refeição; bastante líquido","Varfarina; metotrexato; IECA, BRA e espironolactona"],["Nitrofurantoína","100 mg de 6/6 h por 7 a 10 dias (bula)","Com alimento","Antiácidos com trissilicato de magnésio reduzem a absorção"],["Fosfomicina trometamol","3 g dose única","Em jejum, à noite","Metoclopramida"],["Metronidazol","400 a 500 mg de 12/12 h ou 2 g dose única, conforme indicação","Após refeição reduz náusea","Varfarina; lítio; álcool (bula)"],["Secnidazol","2 g dose única","Com uma refeição, à noite","Álcool (bula: 4 dias); dissulfiram"],["Rifampicina","Conforme esquema (tuberculose: dose por peso, combinada)","Em jejum","Anticoncepcionais, varfarina, antirretrovirais, muitas outras"],["Fluconazol","150 mg dose única (candidíase vaginal não complicada)","Indiferente","Varfarina; sulfonilureias; fármacos que prolongam o QT"],["Terbinafina oral","250 mg 1 vez ao dia","Indiferente","Substratos do CYP2D6 (tricíclicos, metoprolol)"],["Nistatina suspensão","1 a 6 mL quatro vezes ao dia (candidíase oral)","Bochechar e manter na boca antes de engolir","Praticamente nenhuma"],["Aciclovir","200 a 800 mg, 2 a 5 vezes ao dia conforme indicação","Indiferente; hidratação","Fármacos nefrotóxicos"],["Valaciclovir","500 mg a 2 g, 1 a 3 vezes ao dia conforme indicação","Indiferente; hidratação","Fármacos nefrotóxicos"],["Oseltamivir","75 mg de 12/12 h por 5 dias","Com alimento reduz náusea","Poucas relevantes"],["Ivermectina","Cerca de 200 mcg/kg dose única (150 mcg/kg na oncocercose)","Com água (bula brasileira); em jejum na bula norte-americana","Depressores do SNC e álcool; varfarina (relatos raros de RNI aumentado)"],["Albendazol","400 mg dose única ou 400 mg/dia por 3 dias conforme parasita","Conforme bula do produto","Poucas relevantes em dose única"],["Nitazoxanida","500 mg de 12/12 h por 3 dias (comprimido)","Com alimento","Varfarina e fenitoína (alta ligação proteica; bula)"]],"nota":"Doses de adulto com função renal normal, conferidas em bulas brasileiras (versões de 2025) e, para valaciclovir e ivermectina, também em bulas norte-americanas. Confirme indicação, dose e duração na prescrição e na bula do produto dispensado; ajustar pela TFG (CKD-EPI 2021) quando aplicável."},{"tipo":"tabela","id":"m03-atb-tab-suspensoes","titulo":"Suspensões orais: conservação e validade após o preparo","colunas":["Produto (exemplo consultado)","Reconstituição","Conservação após preparo","Validade após preparo","Observação"],"linhas":[["Amoxicilina 250 mg/5 mL (genérico Prati-Donaduzzi)","Água filtrada até a marca, em duas etapas","Temperatura ambiente (15 a 30 °C)","14 dias","Amoxil® e outros fabricantes: conferir a bula"],["Amoxicilina-clavulanato (Clavulin®)","Água filtrada em temperatura ambiente até a marca","Geladeira (2 a 8 °C)","7 dias","Dar no início da refeição; genéricos e BD: ver bula"],["Azitromicina (Azi® e outros genéricos)","Volume de água indicado no frasco","Temperatura ambiente (15 a 30 °C)","5 dias","Algumas bulas admitem geladeira; descartar a sobra"],["Claritromicina (Klaricid®)","Água até a marca","Temperatura ambiente (15 a 30 °C), ao abrigo de luz e umidade","14 dias","A bula indica temperatura ambiente, não geladeira"],["Cefalexina (Keflex® e genéricos)","Água até a marca","Geladeira (2 a 8 °C)","7 a 14 dias, conforme fabricante","Prazo varia entre produtos"],["Cefadroxila (Cefamox®)","Água até a marca","Ambiente ou geladeira","10 dias em ambiente (25 °C) ou 14 dias em geladeira","Pode amarelar sem perder efeito (bula)"],["Cefuroxima (Zinnat®)","Água até a marca","Geladeira (2 a 8 °C) logo após o preparo","10 dias","Tomar com alimento"],["Nitazoxanida (Annita®)","Água até a marca","Temperatura ambiente","7 dias","Urina amarelo-esverdeada sem significado"],["Sulfametoxazol-trimetoprima","Pronta para uso","Temperatura ambiente","Validade de fábrica após aberta, conforme bula","Agitar antes de usar"],["Nistatina","Pronta para uso","Temperatura ambiente","Conforme bula do fabricante após aberta","Agitar; manter na boca antes de engolir"]],"nota":"Dados conferidos em bulas publicadas em 2025 para os produtos citados. Prazo e temperatura variam entre fabricantes e concentrações: confira sempre a bula do produto dispensado e escreva a data de descarte no rótulo."},{"tipo":"checklist","id":"m03-atb-checklist-dispensacao","titulo":"Checklist da orientação na dispensação de antimicrobiano","itens":["Confirmar para quem é o medicamento, idade e, em criança, o peso atual","Perguntar sobre alergias e qual foi a reação (tipo e tempo após a dose)","Perguntar sobre gestação, possibilidade de gravidez e amamentação","Perguntar sobre doença renal ou hepática e consultar TFG recente, se houver","Listar medicamentos, suplementos e antiácidos em uso e checar interações","Conferir dose, intervalo e duração contra a indicação provável","Combinar horários concretos distribuídos nas 24 horas","Explicar a relação com alimento, laticínios e cátions","Explicar o que fazer em caso de dose esquecida","Orientar sobre álcool quando a bula restringir","Esclarecer o efeito sobre anticoncepcional (só indutores como rifampicina reduzem)","Em suspensão: reconstituir ou demonstrar, anotar data de descarte, orientar conservação","Entregar ou mostrar o dosador correto e a medida da dose","Reforçar tomar exatamente como prescrito e não gua

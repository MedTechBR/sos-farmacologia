m sódio, elevam a PA, causam hipercalemia e reduzem o efeito de anti-hipertensivos e diuréticos.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>\"Triple whammy\" é o nome dado à combinação de \u003cstrong>IECA ou BRA + diurético + AINE\u003c/strong>. O diurético reduz o volume, o IECA ou BRA dilata a arteríola eferente e o AINE contrai a aferente: a pressão de filtração despenca. Em coorte britânica com 487 mil usuários de anti-hipertensivos, a combinação tripla aumentou em 31% a taxa de lesão renal aguda, e o risco foi maior nos primeiros 30 dias de uso (razão de taxas 1,82) (Lapi et al., BMJ 2013). É uma das interações mais relevantes que o farmacêutico pode evitar no balcão.\u003c/p>\u003c/div> \u003cp>Outros pontos de atenção:\u003c/p> \u003cul> \u003cli>Laxantes e enemas com fosfato de sódio: risco de nefropatia por fosfato e distúrbios eletrolíticos em idosos e renais.\u003c/li> \u003cli>Antiácidos e laxantes com magnésio ou alumínio: acumulam na DRC avançada.\u003c/li> \u003cli>Suplementos de potássio e sal light: hipercalemia em quem tem DRC ou usa IECA, BRA ou espironolactona.\u003c/li> \u003cli>Produtos \"naturais\" e suplementos de procedência duvidosa: composição incerta, com casos de contaminação e adulteração.\u003c/li> \u003cli>Desidratação por vômitos, diarreia ou calor em quem usa diurético, IECA, BRA, metformina ou iSGLT2.\u003c/li> \u003c/ul> \u003ch3>Dias de doença\u003c/h3> \u003cp>Em quadros agudos com vômitos, diarreia ou febre que impedem a hidratação, alguns medicamentos aumentam o risco de lesão renal ou de acidose: diuréticos, IECA, BRA, AINE, metformina e iSGLT2. Vários serviços entregam ao paciente um plano escrito de \"dias de doença\" dizendo quais pausar temporariamente e quando retomar. O farmacêutico pode reforçar esse plano, mas não deve criar um por conta própria: a pausa precisa ser orientada pelo médico.\u003c/p> \u003ch3>Proteção renal: iSGLT2\u003c/h3> \u003cp>Os inibidores do SGLT2 (dapagliflozina, empagliflozina) reduzem a progressão da DRC e eventos cardiovasculares, com ou sem diabetes, e a DBHA 2025 recomenda favorecer seu uso na HA com DRC, ao lado do IECA ou BRA e, em diabéticos, da finerenona e dos agonistas de GLP-1. No SUS, a dapagliflozina tem critérios definidos em protocolo para DRC. O tema é detalhado no módulo de sistema endócrino.\u003c/p> \u003ch3>Sinais de alerta que o farmacêutico percebe\u003c/h3> \u003cp>A DRC costuma ser descoberta tarde. No contato frequente com hipertensos e diabéticos, o farmacêutico pode notar sinais que justificam avaliação: urina espumosa persistente, inchaço de pálpebras pela manhã ou de pernas, aumento da vontade de urinar à noite, cansaço sem explicação, perda de apetite e coceira na pele em fases avançadas. A DBHA 2025 recomenda, na avaliação de todo hipertenso, dosar creatinina com cálculo da TFGe e pesquisar albuminúria ou proteinúria. Perguntar \"quando foi o último exame de sangue e de urina?\" é uma forma simples de estimular esse acompanhamento.\u003c/p> \u003ch3>Ajuste renal de fármacos comuns\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>O que acontece na DRC\u003c/th>\u003cth>Conduta usual\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Metformina\u003c/td>\u003ctd>Acúmulo e risco de acidose lática\u003c/td>\u003ctd>Máximo 1 g/dia se TFGe &lt; 45 mL/min/1,73 m²; suspender se &lt; 30 (SBD 2026)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glibenclamida\u003c/td>\u003ctd>Metabólitos ativos acumulam: hipoglicemia prolongada\u003c/td>\u003ctd>Evitar; prescritor costuma preferir gliclazida MR\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Sitagliptina, vildagliptina\u003c/td>\u003ctd>Acúmulo\u003c/td>\u003ctd>Redução de dose conforme bula; linagliptina sem ajuste\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Atenolol\u003c/td>\u003ctd>Eliminação renal\u003c/td>\u003ctd>Redução de dose ou intervalo\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Espironolactona, IECA, BRA\u003c/td>\u003ctd>Hipercalemia\u003c/td>\u003ctd>Monitorar potássio e creatinina\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Antimicrobianos (amoxicilina, aciclovir, nitrofurantoína, fluoroquinolonas)\u003c/td>\u003ctd>Acúmulo ou perda de eficácia\u003c/td>\u003ctd>Ajuste de dose ou de escolha conforme bula\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Gabapentina, pregabalina\u003c/td>\u003ctd>Acúmulo: sonolência, tontura, quedas\u003c/td>\u003ctd>Redução de dose conforme TFG\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Alopurinol, colchicina\u003c/td>\u003ctd>Acúmulo e toxicidade\u003c/td>\u003ctd>Dose ajustada e cautela com interações\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Anticoagulantes diretos, enoxaparina\u003c/td>\u003ctd>Acúmulo: sangramento\u003c/td>\u003ctd>Ajuste conforme bula e TFG\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A tabela é um guia de alerta. O número exato de corte e a nova dose estão na bula de cada produto e são definidos pelo prescritor.\u003c/p> \u003ch3>Hipercalemia e alimentação\u003c/h3> \u003cp>Pessoas com DRC em uso de IECA, BRA ou espironolactona costumam receber orientação de controlar potássio na dieta. Banana, laranja, água de coco, feijão, tomate e frutas secas são ricos em potássio, e o sal light troca parte do sódio por cloreto de potássio. O farmacêutico não deve prescrever dieta, mas precisa saber disso para não indicar suplemento de potássio, isotônico ou sal light a esses clientes. Exames de potássio acima do valor de referência relatados pelo cliente justificam contato com o médico antes da próxima dose de espironolactona.\u003c/p> \u003ch3>Exames com contraste\u003c/h3> \u003cp>O contraste iodado de tomografias e cateterismos pode reduzir a função renal em pessoas com DRC, desidratação ou diabetes. Pacientes em uso de metformina recebem orientação específica sobre pausa e reavaliação da função renal (detalhada no módulo de sistema endócrino). Antes do exame, o serviço de imagem costuma perguntar sobre creatinina, metformina, diuréticos e AINE; o farmacêutico pode ajudar o cliente a levar a lista atualizada de medicamentos.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de indicar ou dispensar um AINE, pergunte: tem pressão alta, problema nos rins, insuficiência cardíaca ou diabetes? Usa remédio de pressão ou diurético? Tem mais de 65 anos? Se sim, prefira analgésico sem efeito renal (paracetamol ou dipirona, respeitando contraindicações) e oriente avaliação médica para dor persistente. Peça ao paciente com DRC o último resultado de creatinina e TFGe e anote no cadastro.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 74 anos, em uso de enalapril e hidroclorotiazida, pede nimesulida para dor no joelho. Está com diarreia há dois dias. O farmacêutico identifica o risco de lesão renal (IECA + diurético + AINE + desidratação), não indica o AINE, orienta hidratação oral, sugere paracetamol em dose adequada para a dor e encaminha ao médico pela diarreia e para avaliar o uso dos anti-hipertensivos durante o quadro.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m04-mapa-antihipertensivos","titulo":"Anti-hipertensivos","centro":"Anti-hipertensivos","ramos":[{"t":"Metas e diagnóstico","itens":["HA: ≥ 140/90 mmHg em 2 ocasiões","Pré-HA: 120-139 e/ou 80-89 mmHg","Meta para todos: \u003c 130/80 mmHg","MRPA ou MAPA: HA se ≥ 130/80 mmHg"]},{"t":"IECA (-pril)","itens":["Tosse seca por bradicinina","Angioedema: emergência, nunca repetir IECA","Hipercalemia: sal light, espironolactona","Captopril 1 h antes das refeições","Contraindicado na gestação"]},{"t":"BRA (-sartana)","itens":["Mesmo efeito do IECA, sem tosse","IECA + BRA: contraindicado","Losartana 50-100 mg; valsartana 80-320 mg","Olmesartana: diarreia crônica rara"]},{"t":"Betabloqueadores","itens":["Seletivos: atenolol, metoprolol, bisoprolol","Não seletivos: propranolol, carvedilol","Asma grave: evitar, sobretudo não seletivos","Mascaram hipoglicemia (sobra o suor)","Nunca suspender de repente"]},{"t":"Bloqueadores de cálcio","itens":["Anlodipino: edema de tornozelo","Verapamil/diltiazem: bradicardia","Não associar verapamil/diltiazem com BB","Sinvastatina: máx. 10 mg com verapamil/diltiazem","Nifedipino só retard na HA crônica"]},{"t":"Escolha (DBHA 2025)","itens":["Início: dupla em comprimido único","IECA/BRA + BCC ou tiazídico","Tripla, depois espironolactona","Gestação: metildopa ou nifedipino retard"]}]},{"id":"m04-mapa-diureticos-rim","titulo":"Diuréticos e rim","centro":"Diuréticos e rim","ramos":[{"t":"Tiazídicos e análogos","itens":["Túbulo distal, cotransportador Na-Cl","HCTZ, clortalidona 12,5-25 mg, indapamida","Hipo K, hipo Na, hiperuricemia, hiperglicemia","Gota ativa: contraindicado"]},{"t":"Diuréticos de alça","itens":["Alça de Henle: Na-K-2Cl","Furosemida 20-240 mg/dia","Edema: IC, DRC, cirrose","Hipo K, hipo Mg, ototoxicidade"]},{"t":"Poupadores de K","itens":["Espironolactona: 4º fármaco na HA resistente","Ginecomastia com espironolactona","Amilorida: associada a tiazídico","Hipercalemia com IECA/BRA e DRC"]},{"t":"Outros diuréticos","itens":["Acetazolamida: glaucoma, mal da montanha","Acetazolamida: acidose, parestesia","Manitol: osmótico, só hospitalar"]},{"t":"Função renal","itens":["TFGe por CKD-EPI 2021, sem raça","DRC: TFGe \u003c 60 ou albuminúria > 3 meses","G3a 45-59; G3b 30-44; G4 15-29","Metformina: suspender se TFGe \u003c 30"]},{"t":"Balcão","itens":["Diurético pela manhã: evita noctúria","IECA/BRA + diurético + AINE: lesão renal","Diurético não emagrece","Vômito/diarreia: médico orienta pausas"]}]}],"apoio":[{"tipo":"tabela","id":"m04-tab-mestra","titulo":"Tabela-mestra dos anti-hipertensivos","colunas":["Classe","Exemplos e dose usual adulto","Mecanismo","Efeito adverso marcante","Contraindicação","Orientação"],"linhas":[["IECA","Enalapril 5-40 mg/dia; captopril 25-150 mg/dia (2-3x); ramipril 2,5-20 mg/dia","Inibe a ECA: menos angiotensina II, mais bradicinina","Tosse seca; angioedema; hipercalemia","Gestação; angioedema prévio; estenose bilateral de artéria renal; associação com BRA","Captopril 1 h antes das refeições; evitar sal light e AINE"],["BRA","Losartana 50-100 mg/dia; valsartana 80-320 mg/dia; olmesartana 20-40 mg/dia","Bloqueia o receptor AT1","Hipercalemia; tontura","Gestação; associação com IECA","Alternativa ao IECA quando há tosse"],["Tiazídico e análogos","Hidroclorotiazida até 50 mg/dia (25-50 mg no SUS); clortalidona 12,5-25 mg; indapamida SR 1,5-3 mg","Inibe Na-Cl no túbulo distal","Hipocalemia; hiponatremia; hiperuricemia","Gota ativa; hiponatremia","Tomar pela manhã; relatar cãibra ou confusão"],["BCC di-hidropiridínico","Anlodipino 2,5-10 mg/dia; nifedipino retard 10-60 mg/dia","Bloqueia canal de cálcio L nos vasos","Edema maleolar; cefaleia; rubor","ICFEr e taquiarritmias (evitar)","Edema não responde a diurético; não partir retard"],["BCC não di-hidropiridínico","Verapamil 120-360 mg/dia; diltiazem 80-240 mg/dia","Bloqueio de cálcio no coração e vasos","Bradicardia; bloqueio AV; constipação","FC \u003c 50 bpm; ICFEr; associação com BB","Conferir sinvastatina e digoxina"],["Betabloqueador","Atenolol 50-100 mg; succinato de metoprolol 50-200 mg; carvedilol 6,25-50 mg","Bloqueio beta-1 (e beta-2 nos não seletivos)","Bradicardia; fadiga; mascara hipoglicemia","Broncopatia grave; BAV; FC \u003c 50 bpm","Não suspender de repente"],["Antagonista mineralocorticoide","Espironolactona 25-100 mg/dia","Bloqueia o receptor da aldosterona","Hipercalemia; ginecomastia","Hipercalemia; DRC avançada sem controle","Sem sal light ou suplemento de K"],["Diurético de alça","Furosemida 20-240 mg/dia","Inibe Na-K-2Cl na alça de Henle","Desidratação; hipocalemia","Hipovolemia","Segunda dose no início da tarde"],["Simpatolítico central","Clonidina 0,2-0,9 mg/dia; metildopa 500 mg a 2 g/dia","Agonista alfa-2 central","Sonolência; boca seca; rebote (clonidina)","Metildopa: hepatopatia ativa","Clonidina: nunca parar de repente"],["Alfabloqueador","Doxazosina 1-16 mg/dia","Bloqueio alfa-1 periférico","Hipotensão postural na 1ª dose","Hipotensão ortostática","Iniciar ao deitar"],["Vasodilatador direto","Hidralazina 50-200 mg/dia; minoxidil 5-40 mg/dia","Relaxa a arteríola diretamente","Taquicardia reflexa; retenção; hirsutismo (minoxidil)","Minoxidil na gestação","Usar associado a diurético e BB"]],"nota":"Doses habituais segundo a Diretriz Brasileira de Hipertensão Arterial 2025 (Quadros 7.2 a 7.7). A dose do paciente é a da prescrição; confira a bula do produto."},{"tipo":"tabela","id":"m04-tab-diureticos","titulo":"Diuréticos por local de ação","colunas":["Local no néfron","Classe","Exemplos","Potência","Eletrólitos e metabolismo","Uso principal"],"linhas":[["Túbulo proximal","Inibidor da anidrase carbônica","Acetazolamida","Fraca","Acidose metabólica; hipocalemia","Glaucoma; mal da montanha"],["Alça de Henle (ramo ascendente espesso)","Diurético de alça","Furosemida, bumetanida","Alta","Hipo K, hipo Mg, hiperuricemia, perda de cálcio","Edema: IC, DRC, cirrose"],["Túbulo contornado distal","Tiazídico e análogos","Hidroclorotiazida, clortalidona, indapamida","Moderada","Hipo K, hipo Na, hiperuricemia, hiperglicemia, retenção de cálcio","Hipertensão arterial"],["Ducto coletor (receptor de aldosterona)","Antagonista mineralocorticoide","Espironolactona, eplerenona","Fraca","Hipercalemia","HA resistente; IC; hiperaldosteronismo; ascite"],["Ducto coletor (ENaC)","Bloqueador de canal de sódio","Amilorida","Fraca","Hipercalemia","Associação com tiazídico"],["Todo o néfron (efeito osmótico)","Diurético osmótico","Manitol (IV)","Variável","Distúrbios de sódio e água","Hipertensão intracraniana; uso hospitalar"]]},{"tipo":"fluxo","id":"m04-fluxo-afericao","titulo":"Aferição da PA na farmácia e encaminhamento","passos":[{"t":"Acolher, confirmar consentimento e verificar se o serviço consta no licenciamento","tipo":"inicio"},{"t":"Perguntar sintomas agudos: dor no peito, falta de ar, déficit neurológico, confusão, alteração visual, cefaleia súbita intensa","tipo":"decisao","sim":"Acionar SAMU 192 ou encaminhar ao pronto-socorro; medir a PA apenas se não atrasar o socorro","nao":"Seguir para o preparo"},{"t":"Checar preparo: 30 min sem café, cigarro ou comida; 90 min sem exercício; bexiga vazia; 5 min sentado em silêncio","tipo":"acao"},{"t":"Escolher manguito adequado, braço apoiado na altura do coração, aparelho automático validado e calibrado","tipo":"acao"},{"t":"Fazer 3 medidas com 1 min de intervalo e calcular a média das 2 últimas","tipo":"acao"},{"t":"Média ≥ 180 e/ou 110 mmHg?","tipo":"decisao","sim":"Com sintomas: emergência. Sem sintomas: avaliação médica em 1 a 7 dias (DBHA 2025), sem indicar medicamento","nao":"Interpretar conforme histórico"},{"t":"Sem diagnóstico e média ≥ 140/90 mmHg, ou hipertenso repetidamente ≥ 130/80 mmHg?","tipo":"decisao","sim":"Orientar consulta médica levando o registro; revisar adesão e técnica de uso","nao":"Reforçar estilo de vida e periodicidade de medidas"},{"t":"Gestante com ≥ 140/90 mmHg ou hipotensão com tontura e síncope em quem usa anti-hipertensivo","tipo":"alerta"},{"t":"Registrar o atendimento e entregar a Declaração de Serviço Farmacêutico com a frase obrigatória (RDC 44/2009, art. 81)","tipo":"fim"}]},{"tipo":"checklist","id":"m04-check-hipertenso","titulo":"Checklist de orientação ao hipertenso","itens":["Conferir a lista completa de medicamentos, inclusive de outros prescritores","Procurar duplicidade de classe e associação IECA + BRA","Conferir se a dose fixa não duplica um componente isolado","Explicar que o tratamento é contínuo, mesmo sem sintomas","Combinar horário fixo; diurético pela manhã","Orientar captopril 1 hora antes das refeições","Perguntar sobre tosse seca, edema de tornozelo, cansaço e tontura ao levantar","Alertar para inchaço de lábios ou língua como emergência (IECA)","Orientar não suspender betabloqueador ou clonidina de repente","Desaconselhar sal light e suplemento de potássio sem orientação médica","Evitar AINE e descongestionantes sistêmicos; sugerir alternativas seguras","Perguntar sobre gestação ou intenção de engravidar em mulheres em uso de IECA ou BRA","Ensinar a técnica de medida em casa e o registro dos valores","Reforçar sal reduzido, atividade física, peso, álcool e tabagismo","Registrar a orientação e combinar o retorno"]},{"tipo":"cartoes","id":"m04-cartoes","titulo":"Cartões de revisão: cardiovascular e renal","itens":[{"f":"Limite de diagnóstico de HA no consultório (DBHA 2025)","v":"≥ 140 e/ou 90 mmHg em duas ocasiões"},{"f":"Faixa de pré-hipertensão","v":"PAS 120 a 139 e/ou PAD 80 a 89 mmHg"},{"f":"Meta pressórica para hipertensos na DBHA 2025","v":"\u003c 130/80 mmHg, independentemente do risco"},{"f":"Limite de HA na MRPA","v":"≥ 130/80 mmHg"},{"f":"Quantas medidas e qual média na técnica da DBHA 2025?","v":"Três medidas, 1 min de intervalo; média das duas últimas"},{"f":"Frase obrigatória na declaração de aferição","v":"\"ESTE PROCEDIMENTO NÃO TEM FINALIDADE DE DIAGNÓSTICO E NÃO SUBSTITUI A CONSULTA MÉDICA\" (RDC 44/2009, art. 81, § 2º, I, d)."},{"f":"Por que o IECA causa tosse?","v":"Acúmulo de bradicinina, que a ECA degradaria"},{"f":"Conduta no angioedema por IECA","v":"Emergência; não usar nenhum IECA depois"},{"f":"Captopril e alimento","v":"Tomar 1 hora antes das refeições"},{"f":"IECA + BRA","v":"Contraindicado: hipercalemia, hipotensão e lesão renal"},{"f":"Sinal de hipoglicemia que o betabloqueador não mascara","v":"Sudorese"},{"f":"Succinato × tartarato de metoprolol","v":"Succinato: liberação prolongada, 1x/dia. Tartarato: imediata. Não trocar sem o prescritor"},{"f":"Edema de tornozelo com anlodipino melhora com","v":"Redução de dose ou associação com IECA/BRA; diurético resolve pouco"},{"f":"Limite de sinvastatina com anlodipino (FDA)","v":"20 mg/dia"},{"f":"Quarto fármaco na HA resistente","v":"Espironolactona (eplerenona se intolerância)"},{"f":"Tiazídico e gota","v":"Eleva o ácido úrico; contraindicado na gota ativa"},{"f":"Triple whammy","v":"IECA ou BRA + diurético + AINE: risco de lesão renal aguda"},{"f":"Equação padrão para TFGe","v":"CKD-EPI 2021, sem coeficiente racial"}]},{"tipo":"questoes","id":"m04-questoes","titulo":"Questões de fixação: cardiovascular e renal","itens":[{"p":"Cliente de 47 anos, sem diagnóstico prévio, tem PA média de 134/86 mmHg medida corretamente na farmácia. Pela Diretriz Brasileira de Hipertensão Arterial 2025, esse valor corresponde a:","alt":["PA normal","Hipertensão estágio 1","Pré-hipertensão","Hipertensão do avental branco confirmada","Hipertensão mascarada"],"c":2,"com":"Pré-hipertensão vai de 120 a 139 e/ou 80 a 89 mmHg. Normal é \u003c 120/80; estágio 1 começa em 140/90. Avental branco e hipertensão mascarada só se definem comparando medidas de consultório com MAPA ou MRPA, o que uma aferição isolada não faz."},{"p":"Sobre a técnica de aferição da PA recomendada pela DBHA 2025, assinale a correta.","alt":["Três medidas com 1 minuto de intervalo; média das duas últimas","Uma única medida logo que o cliente chega ao balcão","Aparelho de punho como primeira escolha, por ser mais prático e rápido","Braço pendente ao lado do corpo, sem apoio, durante a medida","Cliente em pé, para detectar hipotensão em todas as medidas"],"c":0,"com":"O Quadro 3.1 da DBHA 2025 recomenda três medidas com intervalo de 1 minuto, usando a média das duas últimas, após 5 minutos sentado, com o braço apoiado na altura do coração. O aparelho de punho fica para quando a medida no braço é difícil."},{"p":"Segundo a RDC 44/2009, após aferir a PA de um cliente, o farmacêutico deve:","alt":["Indicar anti-hipertensivo de venda sob prescrição se o valor estiver alto","Ajustar a dose do medicamento em uso quando a PA estiver acima da meta","Informar o valor apenas verbalmente, sem nenhum registro do serviço","Entregar a Declaração de Serviço Farmacêutico com a frase obrigatória","Emitir laudo com diagnóstico de hipertensão arterial e estágio"],"c":3,"com":"O art. 81 exige a Declaração de Serviço Farmacêutico com valores, referências, orientação e a frase obrigatória. O art. 69, § 4º, proíbe indicar ou alterar medicamento de venda sob prescrição com base no resultado, e a aferição não tem finalidade diagnóstica."},{"p":"Mulher de 58 anos em uso de enalapril há três meses refere tosse seca persistente, sem febre. A explicação e a conduta mais adequadas são:","alt":["Infecção viral; indicar antitussígeno com codeína por cinco dias","Acúmulo de bradicinina; avaliação médica para trocar por BRA","Hipocalemia pelo IECA; orientar suplemento de potássio","Alergia ao enalapril; indicar anti-histamínico e manter o IECA","Excesso de sal na dieta; orientar substituir por sal light"],"c":1,"com":"A tosse do IECA decorre do acúmulo de bradicinina e some após a troca, geralmente por um BRA, decisão médica. Antitussígeno mascara o problema; suplemento de potássio e sal light aumentam o risco de hipercalemia com IECA."},{"p":"Um paciente apresenta receitas de losartana e de ramipril, de médicos diferentes. A conduta correta do farmacêutico é:","alt":["Dispensar as duas, pois agem em pontos diferentes do mesmo sistema","Dispensar só a losartana e reter a receita de ramipril sem avisar","Orientar o paciente a alternar os dois medicamentos em dias diferentes","Dispensar as duas e recomendar medir a pressão em casa diariamente","Alertar que IECA + BRA é contraindicado e contatar o prescritor"],"c":4,"com":"A DBHA 2025 contraindica IECA + BRA (ONTARGET: mais hipotensão, hipercalemia e lesão renal sem benefício). O farmacêutico não escolhe sozinho qual suspender: comunica o prescritor e registra a intervenção."},{"p":"Paciente diabético em uso de insulina inicia propranolol. Qual orientação é a mais pertinente?","alt":["O propranolol eleva a glicemia e dispensa qualquer ajuste de insulina","Tremor e palpitação podem sumir na hipoglicemia; o suor persiste","O propranolol impede totalmente episódios de hipoglicemia","A insulina deve ser suspensa enquanto durar o uso do betabloqueador","Betabloqueadores não têm nenhuma interação com antidiabéticos"],"c":1,"com":"Betabloqueadores mascaram sinais adrenérgicos da hipoglicemia (tremor, taquicardia); a sudorese, colinérgica, persiste. Os não seletivos ainda retardam a recuperação. Não impedem hipoglicemia nem exigem suspender a insulina."},{"p":"Idosa em uso de anlodipino 10 mg pede diurético porque os tornozelos incham no fim do dia. A melhor orientação é:","alt":["Dispensar furosemida, que resolve esse tipo de edema rapidamente","Indicar meias de compressão e suspender o anlodipino por conta própria","Explicar que o edema vem do anlodipino e encaminhar ao médico","Indicar hidroclorotiazida em dose baixa pela manhã por uma semana","Orientar dobrar a dose do anlodipino à noite para controlar melhor"],"c":2,"com":"O edema dos di-hidropiridínicos vem da dilatação arteriolar e é dose-dependente; não é retenção de sódio, por isso o diurético ajuda pouco. O médico pode reduzir a dose ou associar IECA/BRA (DBHA 2025). Diurético é de venda sob prescrição e suspender por conta própria é inadequado."},{"p":"Paciente em uso de verapamil recebe prescrição de sinvastatina 40 mg/dia. O problema identificado é:","alt":["Nenhum, pois a sinvastatina não depende de metabolismo hepático","O verapamil reduz o efeito da sinvastatina por indução enzimática","A sinvastatina causa bradicardia grave quando associada ao verapamil","Verapamil inibe o CYP3A4; risco de miopatia (limite de 10 mg)","Risco de hipocalemia grave pela soma dos dois medicamentos"],"c":3,"com":"Verapamil e diltiazem inibem o CYP3A4 e elevam a sinvastatina, aumentando o risco de miopatia e rabdomiólise. A FDA limitou a sinvastatina a 10 mg/dia com esses fármacos (20 mg/dia com anlodipino). O verapamil não é indutor."},{"p":"Senhora de 80 anos em uso de hidroclorotiazida chega confusa e sonolenta. O distúrbio mais provável relacionado ao diurético é:","alt":["Hiponatremia","Hipercalemia","Hipocalcemia","Alcalose respiratória","Hipoglicemia"],"c":0,"com":"Tiazídicos causam hiponatremia, sobretudo em idosas magras, com confusão, sonolência e quedas. Eles tendem a causar hipocalemia (não hipercalemia) e retenção de cálcio (hipercalcemia leve). Encaminhar para avaliação no mesmo dia."},{"p":"Na DBHA 2025, a estratégia inicial recomendada para a maioria dos hipertensos é:","alt":["Betabloqueador em monoterapia para todos os pacientes","Diurético de alça em dose plena desde o primeiro dia","Clonidina associada a hidralazina como primeira escolha","Monoterapia com qualquer classe por seis meses antes de associar","Associação dupla em dose baixa, se possível em comprimido único"],"c":4,"com":"A diretriz recomenda iniciar a maioria com associação dupla (IECA ou BRA + BCC ou tiazídico), em doses baixas e de preferência em comprimido único. Monoterapia fica para pré-hipertensão de alto risco, estágio 1 de baixo risco, frágeis e muito idosos. BB entra em indicações específicas."},{"p":"Homem de 70 anos usa losartana e hidroclorotiazida e pede ibuprofeno para dor lombar; está com diarreia há dois dias. Qual o principal risco?","alt":["Hipercalcemia sintomática pelo ibuprofeno","Lesão renal aguda (BRA, diurético, AINE e desidratação)","Broncoespasmo grave desencadeado pelo ibuprofeno","Hipoglicemia grave pela interação com a hidroclorotiazida","Hepatite medicamentosa causada pela losartana associada"],"c":1,"com":"É o triple whammy: diurético reduz volume, BRA dilata a eferente e AINE contrai a aferente, derrubando a filtração; a desidratação piora. Preferir analgésico sem efeito renal e encaminhar ao médico."}]}],"fontes":["Brandão AA, Rodrigues CIS, Bortolotto LA, et al. Diretriz Brasileira de Hipertensão Arterial 2025 (SBC, SBH, SBN). Arquivos Brasileiros de Cardiologia, 2025;122(9):e20250624. doi:10.36660/abc.20250624. Conferidos os Quadros 3.1, 3.2, 3.4, 7.2 a 7.7 e 14.8, o capítulo 10 (gestação) e as recomendações de início, metas e tratamento. https://abccardiol.org/article/diretriz-brasileira-de-hipertensao-arterial-2025/","Anvisa. Resolução RDC nº 44, de 17 de agosto de 2009. Boas Práticas Farmacêuticas em farmácias e drogarias (arts. 61, 63, 64, 69, 71, 72 e 81), texto compilado vigente com as alterações das RDC nº 41/2012, 786/2023 e 812/2023. Anvisalegis, consultado em 15/10/2026.","Anvisa. Resolução RDC nº 978, de 6 de junho de 2025. Funcionamento de serviços que executam exames de análises clínicas (arts. 8º, 60 e 193, que revoga a RDC nº 786/2023). Diário Oficial da União, 10/06/2025; texto compilado com as alterações da RDC nº 1.043, de 1º/10/2026. Anvisalegis, consultado em 15/10/2026.","Ministério da Saúde. Portaria GM/MS nº 6.324, de 26 de dezembro de 2024. Relação Nacional de Medicamentos Essenciais (Rename 2024), com atualização contínua. https://www.gov.br/saude/pt-br/composicao/sectics/rename","Sociedade Brasileira de Diabetes. Tratamento do DM2 no SUS (metformina e função renal: máximo de 1 g/dia se TFGe \u003c 45; suspender se \u003c 30). Diretriz da SBD, edição 2026. doi:10.29327/5937204.2026-1. https://diretriz.diabetes.org.br/tratamento-do-dm2/","Lapi F, Azoulay L, Yin H, Nessim SJ, Suissa S. Concurrent use of diuretics, angiotensin converting enzyme inhibitors, and angiotensin receptor blockers with non-steroidal anti-inflammatory drugs and risk of acute kidney injury: nested case-control study. BMJ, 2013;346:e8525. PMID 23299844.","Fundação Oswaldo Cruz (Farmanguinhos). Captopril: bula do profissional de saúde (tomar 1 hora antes das refeições; dose na HA normalmente até 150 mg/dia). https://www.far.fiocruz.br/","FDA. ZOCOR (sinvastatina): prescribing information, revisão de 2025 (não exceder 10 mg/dia com verapamil, diltiazem ou dronedarona; 20 mg/dia com amiodarona, anlodipino ou ranolazina). openFDA/DailyMed.","FDA. ENTRESTO (sacubitril/valsartana): prescribing information, revisão de 2026 (contraindicado com IECA; intervalo de 36 horas na troca). openFDA/DailyMed.","FDA. Ramipril: prescribing information (hipertensão: 2,5 a 20 mg/dia). openFDA/DailyMed, 2025.","Bula de Capoten (captopril): posologia, tomar 1 hora antes das refeições. Texto de bula consultado em bula.com.br, 2026.","Bula de Zocor (sinvastatina): interações com anlodipino, verapamil, diltiazem e amiodarona. Texto de bula consultado em bula.com.br, 2026.","Bula de Selozok (succinato de metoprolol): posologia. Texto de bula consultado em bula.com.br, 2026.","Bula de Diamox (acetazolamida): posologia. Texto de bula consultado em bula.com.br, 2026."]},{"id":"m05","num":5,"titulo":"Sistema endócrino","escopo":"Diabetes (diagnóstico e metas da SBD 2026, glicemia capilar na farmácia, antidiabéticos orais, agonistas de GLP-1 e tirzepatida com a regra de retenção de receita da RDC 973/2025, insulinas, técnica, conservação e hipoglicemia) e tireoide (levotiroxina, antitireoidianos e fármacos que alteram a função tireoidiana).","cor":"#E89A00","icone":"droplet","curto":"Sistema endócrino","topicos":[{"id":"m05-dm-diagnostico","titulo":"Diabetes: fisiopatologia, diagnóstico e glicemia capilar","resumo":"\u003cp>Diabetes mellitus (DM) é um grupo de doenças com hiperglicemia crônica causada por falta de insulina, resistência à ação da insulina ou ambas. A insulina, produzida pelas células beta do pâncreas, permite que músculo e tecido adiposo captem glicose e freia a produção de glicose pelo fígado. Quando ela falta ou age mal, a glicose sobe no sangue e, ao longo dos anos, lesa pequenos vasos (retina, rim, nervos) e acelera a aterosclerose (infarto, AVC, doença arterial periférica).\u003c/p> \u003ch3>Tipos principais\u003c/h3> \u003cul> \u003cli>\u003cstrong>DM tipo 1 (DM1)\u003c/strong>: destruição autoimune das células beta, com deficiência absoluta de insulina. Costuma surgir em crianças e adultos jovens, de forma rápida, com sede, muita urina, perda de peso e risco de cetoacidose. O tratamento é insulina desde o início, para sempre.\u003c/li> \u003cli>\u003cstrong>DM tipo 2 (DM2)\u003c/strong>: cerca de 90% dos casos. Combina resistência à insulina (ligada a excesso de peso, gordura visceral, sedentarismo e genética) com falência progressiva das células beta. Pode ficar anos sem sintomas. Outros mecanismos participam: excesso de glucagon, menor efeito das incretinas intestinais, maior reabsorção renal de glicose e alterações no controle central do apetite, o que explica por que há classes de medicamentos atuando em cada ponto.\u003c/li> \u003cli>\u003cstrong>Diabetes gestacional\u003c/strong>: hiperglicemia detectada na gestação, com rastreio próprio no pré-natal.\u003c/li> \u003cli>Outros: LADA (autoimune de início no adulto), diabetes monogênico, pancreatogênico e induzido por medicamentos (glicocorticoides, antipsicóticos atípicos, tiazídicos em dose alta).\u003c/li> \u003c/ul> \u003ch3>Diagnóstico (SBD)\u003c/h3> \u003cp>A Diretriz da Sociedade Brasileira de Diabetes (edição 2026, capítulo de diagnóstico) aceita quatro critérios laboratoriais. Se apenas um exame vier alterado, ele deve ser repetido para confirmar. Glicemia ao acaso ≥ 200 mg/dL com sintomas típicos também confirma o diagnóstico.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Exame\u003c/th>\u003cth>Normal\u003c/th>\u003cth>Pré-diabetes\u003c/th>\u003cth>Diabetes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Glicemia de jejum (mg/dL)\u003c/td>\u003ctd>&lt; 100\u003c/td>\u003ctd>100 a 125\u003c/td>\u003ctd>≥ 126\u003c/td>\u003c/tr> \u003ctr>\u003ctd>HbA1c (%)\u003c/td>\u003ctd>&lt; 5,7\u003c/td>\u003ctd>5,7 a 6,4\u003c/td>\u003ctd>≥ 6,5\u003c/td>\u003c/tr> \u003ctr>\u003ctd>TOTG, glicemia de 1 hora (mg/dL)\u003c/td>\u003ctd>&lt; 155\u003c/td>\u003ctd>155 a 208\u003c/td>\u003ctd>≥ 209\u003c/td>\u003c/tr> \u003ctr>\u003ctd>TOTG, glicemia de 2 horas (mg/dL)\u003c/td>\u003ctd>&lt; 140\u003c/td>\u003ctd>140 a 199\u003c/td>\u003ctd>≥ 200\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Uma novidade da SBD foi a adoção do TOTG com dosagem em 1 hora, considerado mais prático e precoce que o de 2 horas. O rastreamento de DM2 é recomendado para todos a partir de 35 anos e para adultos com sobrepeso ou obesidade com ao menos um fator de risco adicional ou escore FINDRISC alto, usando glicemia de jejum e/ou HbA1c como primeiros testes.\u003c/p> \u003ch3>Metas de controle (SBD 2026)\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Parâmetro\u003c/th>\u003cth>Meta geral\u003c/th>\u003cth>Observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>HbA1c\u003c/td>\u003ctd>&lt; 7%\u003c/td>\u003ctd>Idoso saudável: 7 a 7,5%. Idoso com fragilidade, comprometimento funcional ou cognitivo ou comorbidades limitantes: &lt; 8,5%, priorizando evitar hipoglicemia\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glicemia capilar de jejum e pré-prandial\u003c/td>\u003ctd>80 a 130 mg/dL\u003c/td>\u003ctd>Limite inferior de 80 para reduzir hipoglicemia\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glicemia 2 h após o início da refeição\u003c/td>\u003ctd>&lt; 180 mg/dL\u003c/td>\u003ctd>\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Tempo no alvo (70 a 180 mg/dL) no sensor\u003c/td>\u003ctd>&gt; 70%\u003c/td>\u003ctd>Tempo &lt; 70 mg/dL abaixo de 4% e &lt; 54 mg/dL abaixo de 1%\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Coeficiente de variação\u003c/td>\u003ctd>&lt; 36%\u003c/td>\u003ctd>Marcador de estabilidade\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A SBD classifica a hipoglicemia em três níveis: \u003cstrong>nível 1\u003c/strong>, glicemia de 54 a 69 mg/dL; \u003cstrong>nível 2\u003c/strong>, abaixo de 54 mg/dL, mais grave e com necessidade de intervenção imediata; \u003cstrong>nível 3\u003c/strong>, evento grave com alteração mental ou física que exige ajuda de outra pessoa, qualquer que seja o valor. A ADA Standards of Care 2026 também individualiza metas por idade, saúde e funcionalidade.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Diagnóstico: jejum ≥ 126 mg/dL, HbA1c ≥ 6,5%, TOTG 1 h ≥ 209 ou 2 h ≥ 200 mg/dL (repetir se isolado). Meta geral: HbA1c &lt; 7%, jejum 80 a 130 mg/dL, pós-prandial &lt; 180 mg/dL.\u003c/p>\u003c/div> \u003ch3>Glicemia capilar na farmácia\u003c/h3> \u003cp>A RDC 44/2009 permitia, como parâmetro bioquímico, apenas a glicemia capilar por equipamento de autoteste (arts. 69 e 70). O art. 70 foi revogado pela RDC 786/2023, e hoje o art. 69, § 1º, limita a aferição de parâmetros fisiológicos à pressão arterial e à temperatura corporal. A RDC 786/2023 foi revogada pela \u003cstrong>RDC 978/2025\u003c/strong> (alterada pelas RDC 986/2025 e 1.043/2026), que regula os serviços que executam exames de análises clínicas. A farmácia que mede glicemia capilar pode ser classificada como Serviço Tipo I (art. 8º), com estes requisitos: exame só em material obtido por punção capilar ou por coleta em cavidade oral, nasofaringe ou orofaringe (art. 10, I, redação da RDC 986/2025); todas as etapas no próprio serviço, inclusive controle interno e externo da qualidade (art. 10, II); exame feito por profissional legalmente habilitado (art. 11); alvará de licenciamento que indique a atividade (art. 63). O uso de dispositivo de autoteste por profissional dentro do serviço segue a norma, e a venda de autoteste regularizado para uso em casa fica fora dela (art. 4º).\u003c/p> \u003cp>O exame tem finalidade de triagem, sem fins confirmatórios (RDC 978/2025, art. 60). O resultado vai na Declaração de Serviço Farmacêutico (art. 60, § 2º), com o valor de referência e a frase \"ESTE PROCEDIMENTO NÃO TEM FINALIDADE DE DIAGNÓSTICO E NÃO SUBSTITUI A CONSULTA MÉDICA\" (RDC 44/2009, art. 81, § 2º, I, d). Os registros são guardados por no mínimo 5 anos (RDC 978/2025, art. 115). Continuam valendo aparelho regularizado na Anvisa, POP e descarte correto de perfurocortantes. Leis estaduais podem trazer exigências adicionais.\u003c/p> \u003ch4>Técnica\u003c/h4> \u003col> \u003cli>Higienizar as mãos (farmacêutico e cliente). Se usar álcool na pele do cliente, esperar secar completamente, porque resíduo altera o resultado.\u003c/li> \u003cli>Usar luvas, lanceta descartável de uso único e tira dentro da validade, retirada de frasco bem fechado e compatível com o aparelho.\u003c/li> \u003cli>Puncionar a lateral da polpa digital, que dói menos que o centro. Evitar espremer com força, o que dilui a gota com líquido intersticial.\u003c/li> \u003cli>Aplicar a gota na tira conforme o fabricante e aguardar a leitura.\u003c/li> \u003cli>Descartar lanceta em coletor rígido de perfurocortante e algodão com sangue como resíduo infectante, conforme o plano de gerenciamento de resíduos.\u003c/li> \u003cli>Registrar valor, horário, tempo desde a última refeição e medicamentos em uso.\u003c/li> \u003c/ol> \u003ch4>Interpretação e encaminhamento\u003c/h4> \u003cp>A glicemia capilar na farmácia não faz diagnóstico. Ela serve para rastrear quem precisa de avaliação e para acompanhar quem já trata. Pergunte sempre o tempo de jejum: o mesmo valor tem significado diferente em jejum de 8 horas e uma hora depois do almoço.\u003c/p> \u003cul> \u003cli>Jejum de 100 a 125 mg/dL ou casual elevado sem sintomas: orientar consulta para investigação com exames laboratoriais.\u003c/li> \u003cli>Jejum ≥ 126 mg/dL ou casual ≥ 200 mg/dL: orientar consulta médica breve, com o registro em mãos.\u003c/li> \u003cli>Glicemia muito alta ou \"HI\" no aparelho com vômitos, dor abdominal, respiração rápida, sonolência ou confusão: suspeita de cetoacidose ou estado hiperosmolar, encaminhar com urgência.\u003c/li> \u003cli>Glicemia &lt; 70 mg/dL: tratar como hipoglicemia (regra dos 15, tópico de insulinas) e orientar avaliação do tratamento.\u003c/li> \u003c/ul> \u003ch4>Glicosímetros e sensores\u003c/h4> \u003cp>A farmácia vende glicosímetros, tiras e sensores de monitorização contínua de glicose. Pontos de orientação: usar tiras do mesmo fabricante e compatíveis com o aparelho, respeitar a validade da tira e do frasco aberto, guardar longe de calor e umidade, conferir a data e a hora do aparelho para que o registro faça sentido e levar o aparelho às consultas. Os sensores medem a glicose no líquido intersticial, com atraso de alguns minutos em relação ao sangue; quando os sintomas não combinam com a leitura, convém confirmar com glicemia capilar. O tempo de uso de cada sensor e os cuidados com a pele estão no manual do fabricante.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Usuário de iSGLT2 (dapagliflozina, empagliflozina) com náusea, vômitos, dor abdominal, falta de ar ou mal-estar pode ter cetoacidose mesmo com glicemia normal ou pouco elevada (cetoacidose euglicêmica). Glicemia \"boa\" não descarta o quadro: encaminhar para avaliação imediata.\u003c/p>\u003c/div> \u003ch3>Complicações agudas\u003c/h3> \u003cp>A \u003cstrong>cetoacidose diabética\u003c/strong> ocorre principalmente no DM1, por falta grave de insulina: o corpo passa a queimar gordura, forma corpos cetônicos e o sangue fica ácido. Sinais: sede intensa, muita urina, náusea, vômitos, dor abdominal, hálito de fruta, respiração rápida e profunda, sonolência. O \u003cstrong>estado hiperglicêmico hiperosmolar\u003c/strong> é mais comum em idosos com DM2, com glicemias muito altas, desidratação profunda e confusão, frequentemente desencadeado por infecção ou por pouca ingestão de água. Ambos exigem atendimento hospitalar. Na farmácia, os gatilhos mais comuns que o farmacêutico pode ajudar a evitar são abandono ou erro de insulina, infecções não tratadas e desidratação.\u003c/p> \u003ch3>Pé diabético\u003c/h3> \u003cp>Neuropatia (perda de sensibilidade) e doença arterial tornam o pé do diabético vulnerável: um calo, uma unha mal cortada ou um sapato apertado viram úlcera sem que a pessoa sinta dor. No balcão, as orientações práticas são: examinar os pés todos os dias (com espelho ou ajuda), lavar e secar bem entre os dedos, hidratar a pele sem aplicar creme entre os dedos, cortar as unhas retas, usar calçado fechado e confortável e nunca andar descalço. Produtos para calos e verrugas à base de ácidos queratolíticos não devem ser usados em diabéticos sem orientação profissional, porque podem causar feridas. Qualquer ferida, bolha, mudança de cor ou inchaço no pé de uma pessoa com diabetes deve ser avaliada rapidamente por profissional de saúde.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de medir: pergunte se tem diagnóstico, quais remédios usa, a que horas comeu e se está com sintomas. Depois: explique o valor, entregue a declaração, oriente e registre. Para quem usa glicosímetro em casa, revise a técnica, a validade das tiras, o armazenamento (longe de calor e umidade) e a anotação dos valores para levar à consulta.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 44 anos, com obesidade e mãe diabética, pede para \"medir o açúcar\". Está em jejum de 10 horas: 118 mg/dL. O farmacêutico explica que o valor está acima do normal e não fecha diagnóstico, entrega a declaração e orienta procurar a unidade de saúde para glicemia de jejum laboratorial e HbA1c, reforçando atividade física e alimentação.\u003c/p>\u003c/div>"},{"id":"m05-metformina","titulo":"Metformina","resumo":"\u003cp>A metformina é uma biguanida e o fármaco de primeira linha no DM2, salvo contraindicação ou intolerância (SBD 2026). Ela reduz a produção hepática de glicose, melhora a sensibilidade à insulina no músculo e tem ações intestinais (inclusive aumento discreto de GLP-1). Como não estimula a secreção de insulina, \u003cstrong>não causa hipoglicemia quando usada sozinha\u003c/strong>, tem efeito neutro ou de leve redução no peso, custo baixo e está disponível no SUS e no Farmácia Popular.\u003c/p> \u003ch3>Doses e tomada\u003c/h3> \u003cp>A bula do produto de referência (Glifage®) orienta começar com dose baixa e aumentar aos poucos para reduzir efeitos gastrintestinais, tomando os comprimidos \u003cstrong>durante ou logo após as refeições\u003c/strong>:\u003c/p> \u003cul> \u003cli>Comprimido de 500 mg: início com 500 mg duas vezes ao dia, aumento semanal de um comprimido, até 2.500 mg/dia divididos nas refeições.\u003c/li> \u003cli>Comprimido de 850 mg: início com 850 mg no café da manhã, aumento a cada duas semanas, até 2.550 mg/dia (três comprimidos).\u003c/li> \u003cli>Formulação de liberação prolongada (XR): uma tomada diária, em geral no jantar, com melhor tolerância gastrintestinal; não deve ser partida nem mastigada. O SUS dispensa a metformina XR 500 mg pelo Farmácia Popular (SBD 2026).\u003c/li> \u003c/ul> \u003cp>Na formulação XR, o paciente pode encontrar nas fezes a \"carcaça\" do comprimido. É a matriz vazia, eliminada depois de liberar o fármaco, e não indica falha do tratamento; explicar isso evita abandono.\u003c/p> \u003ch3>Intolerância gastrintestinal\u003c/h3> \u003cp>Diarreia, náusea, desconforto abdominal e gosto metálico são os efeitos mais comuns, sobretudo no início e em doses altas. A SBD estima que 20 a 30% dos pacientes não toleram nem a menor dose. As estratégias são: subir a dose devagar, tomar com a refeição, dividir as tomadas e trocar para XR. Diarreia que surge depois de anos de uso estável merece avaliação, porque pode ter outra causa.\u003c/p> \u003ch3>Função renal\u003c/h3> \u003cp>A metformina é eliminada inalterada pelo rim. Na insuficiência renal ela acumula, e o risco de acidose lática, raro mas grave, aumenta. A conduta atual se baseia na TFGe:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>TFGe (mL/min/1,73 m²)\u003c/th>\u003cth>Conduta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>≥ 45\u003c/td>\u003ctd>Dose habitual, com monitoramento periódico da função renal\u003c/td>\u003c/tr> \u003ctr>\u003ctd>30 a 44\u003c/td>\u003ctd>Dose máxima de 1.000 mg/dia (SBD 2026); não iniciar nessa faixa é a orientação da FDA\u003c/td>\u003c/tr> \u003ctr>\u003ctd>&lt; 30\u003c/td>\u003ctd>Contraindicada (bula) e deve ser suspensa\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Contraste iodado, cirurgias e situações de risco\u003c/h3> \u003cp>A bula contraindica a metformina em quem vai fazer cirurgia eletiva de grande porte ou exame com contraste iodado (tomografia, cateterismo), em quem tem acidose metabólica, insuficiência hepática, consumo excessivo de álcool ou condições de baixa oxigenação dos tecidos (insuficiência cardíaca descompensada, insuficiência respiratória, choque, sepse). Na prática, o serviço que realiza o exame orienta a pausa; a recomendação da FDA é suspender no momento do exame com contraste em quem tem TFGe de 30 a 60, doença hepática, alcoolismo, insuficiência cardíaca ou receberá contraste intra-arterial, e só reiniciar após reavaliar a função renal em 48 horas.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Sinais de acidose lática: mal-estar intenso, dor muscular, respiração rápida e profunda, dor abdominal, vômitos, sonolência, hipotermia. Em usuário de metformina com vômitos e diarreia intensos ou desidratação, encaminhar para avaliação. Não é situação de balcão.\u003c/p>\u003c/div> \u003ch3>Vitamina B12\u003c/h3> \u003cp>O uso prolongado de metformina reduz a absorção de vitamina B12 e pode causar deficiência, com anemia megaloblástica e neuropatia periférica (que se confunde com a neuropatia diabética). A ADA recomenda dosar B12 periodicamente em quem usa metformina por longo prazo, principalmente se houver neuropatia. Suplementação deve seguir avaliação clínica.\u003c/p> \u003ch3>Metformina em idosos\u003c/h3> \u003cp>A metformina continua sendo boa opção em idosos, desde que a função renal seja acompanhada com mais frequência, já que a TFGe cai com a idade e em episódios de desidratação. Perda de apetite e de peso não intencional, comuns em idosos frágeis, podem ser agravadas pelos efeitos gastrintestinais e merecem ser relatadas ao médico. A deficiência de B12 também é mais frequente nessa faixa etária e pode se manifestar como piora de memória, desequilíbrio e formigamento.\u003c/p> \u003ch3>Outros usos\u003c/h3> \u003cp>A metformina também aparece em receitas para pré-diabetes de alto risco (a SBD tem capítulo específico sobre tratamento farmacológico do pré-diabetes) e, fora da bula, em situações como síndrome dos ovários policísticos. O farmacêutico não deve estranhar a prescrição em pessoa sem diagnóstico de diabetes, mas deve orientar da mesma forma sobre tomada com as refeições, efeitos intestinais e função renal.\u003c/p> \u003ch3>Interações\u003c/h3> \u003cul> \u003cli>Álcool em excesso: aumenta o risco de acidose lática e de hipoglicemia quando há outros antidiabéticos.\u003c/li> \u003cli>Contraste iodado: ver acima.\u003c/li> \u003cli>Fármacos que reduzem a secreção tubular (cimetidina, dolutegravir, alguns inibidores de tirosina-quinase): aumentam os níveis de metformina.\u003c/li> \u003cli>Associada a sulfonilureia ou insulina, a combinação pode causar hipoglicemia; o risco vem do outro fármaco.\u003c/li> \u003c/ul> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Oriente tomar com a refeição, iniciar devagar, não abandonar por diarreia leve sem falar com o médico, informar o uso em exames de imagem e cirurgias, levar a última TFGe para conferência e relatar formigamento nos pés. A metformina não deve ser usada para emagrecer por conta própria.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 63 anos, metformina 850 mg três vezes ao dia há oito anos, traz exame com TFGe de 38 mL/min/1,73 m² e pergunta se pode continuar igual. O farmacêutico explica que, nessa faixa, a SBD recomenda dose máxima de 1.000 mg/dia, e orienta levar o exame ao médico para ajuste, registrando a intervenção. Não orienta suspensão por conta própria.\u003c/p>\u003c/div>"},{"id":"m05-sulfonilureias","titulo":"Sulfonilureias e glinidas","resumo":"\u003cp>Sulfonilureias e glinidas são \u003cstrong>secretagogos de insulina\u003c/strong>: fecham os canais de potássio dependentes de ATP da célula beta, o que despolariza a célula e libera insulina independentemente do nível de glicose. Por isso funcionam bem para baixar a glicemia, mas causam hipoglicemia e ganho de peso. Precisam de células beta ainda funcionantes, então perdem efeito com a progressão do DM2.\u003c/p> \u003ch3>Sulfonilureias\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose segundo a bula\u003c/th>\u003cth>Tomada\u003c/th>\u003cth>Risco de hipoglicemia\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Glibenclamida (Daonil®)\u003c/td>\u003ctd>Início ½ a 1 comprimido de 5 mg/dia; usual 5 a 10 mg; não mais que 15 mg/dia\u003c/td>\u003ctd>Antes do café da manhã; o excedente antes do jantar\u003c/td>\u003ctd>Alto e prolongado (metabólitos ativos, eliminação renal)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Gliclazida MR (Diamicron MR®)\u003c/td>\u003ctd>30 a 120 mg em dose única\u003c/td>\u003ctd>No café da manhã; o de 60 mg pode ser partido ao meio, o de 30 mg não\u003c/td>\u003ctd>Menor que a glibenclamida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glimepirida (Amaryl®)\u003c/td>\u003ctd>Início 1 mg; usual 1 a 4 mg; acima de 6 mg só em poucos casos\u003c/td>\u003ctd>Antes da primeira refeição principal\u003c/td>\u003ctd>Intermediário\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A glibenclamida e a gliclazida são as sulfonilureias do SUS. A SBD recomenda a \u003cstrong>gliclazida MR\u003c/strong> como sulfonilureia de escolha, pelo menor risco de hipoglicemia, segurança cardiovascular estabelecida e redução de doença renal no diabetes (SBD 2026, capítulo de tratamento do DM2 no SUS). A glibenclamida é a mais associada a hipoglicemia grave e prolongada, especialmente em idosos e em quem tem doença renal; os critérios de Beers recomendam evitá-la em idosos.\u003c/p> \u003ch3>Hipoglicemia por sulfonilureia\u003c/h3> \u003cp>Os fatores de risco são: idade avançada, doença renal ou hepática, refeições puladas ou atrasadas, álcool, exercício não planejado, perda de peso, doses altas e interações. A hipoglicemia por glibenclamida pode durar muitas horas e voltar depois de um tratamento inicial bem-sucedido; casos com confusão, convulsão ou recorrência precisam de serviço de saúde, porque podem exigir observação prolongada.\u003c/p> \u003cp>Interações que aumentam o risco de hipoglicemia:\u003c/p> \u003cul> \u003cli>Fluconazol e miconazol (inclusive gel oral): inibem o metabolismo de várias sulfonilureias.\u003c/li> \u003cli>Sulfametoxazol-trimetoprima e claritromicina.\u003c/li> \u003cli>Álcool, que também bloqueia a produção hepática de glicose.\u003c/li> \u003cli>Betabloqueadores, que mascaram os sintomas.\u003c/li> \u003cli>Associação com insulina.\u003c/li> \u003c/ul> \u003cp>Glicocorticoides, tiazídicos em dose alta e alguns antipsicóticos fazem o oposto: elevam a glicemia.\u003c/p> \u003cp>Com a progressão do DM2, as células beta produzem cada vez menos insulina, e a sulfonilureia perde efeito. Quando a glicemia sobe mesmo com dose máxima e boa adesão, o médico costuma acrescentar outra classe ou insulina. Ao introduzir insulina, a sulfonilureia pode ser reduzida ou suspensa para evitar hipoglicemia.\u003c/p> \u003ch3>Glinidas\u003c/h3> \u003cp>A \u003cstrong>repaglinida\u003c/strong> (NovoNorm®) e a nateglinida têm início rápido e ação curta. São tomadas imediatamente antes de cada refeição principal. A bula da repaglinida indica dose inicial de 0,5 mg antes de cada refeição, podendo chegar a 4 mg por refeição, com máximo de 16 mg/dia, e não recomenda o uso acima de 75 anos nem na doença hepática moderada a grave. A regra prática para o paciente é: \u003cstrong>pulou a refeição, pula a dose\u003c/strong>. A repaglinida não deve ser associada à genfibrozila, que aumenta muito seus níveis e o risco de hipoglicemia.\u003c/p> \u003ch3>Situações que pedem atenção\u003c/h3> \u003cp>Algumas situações aumentam o risco de hipoglicemia em quem usa secretagogo: jejum religioso ou para exames, dietas muito restritivas, exercício prolongado, doença aguda com pouca ingestão de comida, viagens com mudança de horários e idosos que moram sozinhos e comem pouco. Nesses casos, o paciente deve combinar previamente com o médico se reduz ou pula doses. O farmacêutico pode perguntar sobre esses planos ao dispensar e reforçar que dirigir ou operar máquinas logo após um episódio de hipoglicemia é perigoso.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Secretagogos baixam a glicose mesmo quando ela já está normal. Glibenclamida é a de maior risco; gliclazida MR é a preferida pela SBD. Glinida: tomar só se for comer.\u003c/p>\u003c/div> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar sulfonilureia ou glinida: confirme o horário em relação às refeições, ensine os sintomas de hipoglicemia (tremor, suor frio, palpitação, fome, confusão) e a regra dos 15, oriente não pular refeições e cuidado com álcool. Ao dispensar fluconazol, claritromicina ou sulfametoxazol-trimetoprima, pergunte se a pessoa usa remédio para diabetes.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhora de 79 anos, com TFGe de 35, usa glibenclamida 5 mg duas vezes ao dia e relata dois episódios de \"tremedeira e suor frio\" de madrugada. O farmacêutico orienta a regra dos 15, explica o risco da glibenclamida na idade e na função renal dela e comunica o prescritor, sugerindo reavaliação do esquema, com registro da intervenção.\u003c/p>\u003c/div>"},{"id":"m05-orais-outros","titulo":"Inibidores da DPP-4, inibidores do SGLT2, pioglitazona e acarbose","resumo":"\u003cp>Além da metformina e dos secretagogos, quatro classes orais completam o arsenal do DM2. Cada uma atua em um mecanismo diferente da fisiopatologia, o que permite associações racionais.\u003c/p> \u003ch3>Inibidores da DPP-4 (gliptinas)\u003c/h3> \u003cp>As incretinas (GLP-1 e GIP) são hormônios intestinais liberados com a refeição que aumentam a secreção de insulina de forma dependente da glicose e reduzem o glucagon. A enzima DPP-4 as degrada em minutos. As gliptinas inibem essa enzima e prolongam a ação das incretinas do próprio paciente. O efeito na HbA1c é modesto, o peso fica neutro e o risco de hipoglicemia é baixo quando usadas sem sulfonilureia ou insulina.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose usual (bula)\u003c/th>\u003cth>Rim\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Sitagliptina (Januvia®)\u003c/td>\u003ctd>100 mg uma vez ao dia\u003c/td>\u003ctd>Dose menor na doença renal, conforme bula\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Vildagliptina (Galvus®)\u003c/td>\u003ctd>50 mg uma ou duas vezes ao dia; máximo 100 mg/dia\u003c/td>\u003ctd>Ajuste conforme bula\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Linagliptina (Trayenta®)\u003c/td>\u003ctd>5 mg uma vez ao dia\u003c/td>\u003ctd>Sem ajuste renal ou hepático\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Saxagliptina, alogliptina\u003c/td>\u003ctd>Conforme bula\u003c/td>\u003ctd>Ajuste conforme bula\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Os estudos de segurança cardiovascular mostraram neutralidade para a maioria das gliptinas, mas a saxagliptina foi associada a aumento de internação por insuficiência cardíaca, por isso costuma ser evitada em quem tem insuficiência cardíaca.\u003c/p> \u003cp>Efeitos e alertas: nasofaringite, cefaleia, dor articular, raros casos de pancreatite e de penfigoide bolhoso (bolhas na pele, mais em idosos). Não faz sentido associar gliptina a agonista de GLP-1, porque o mecanismo se sobrepõe sem ganho relevante.\u003c/p> \u003ch3>Inibidores do SGLT2 (gliflozinas)\u003c/h3> \u003cp>O SGLT2 é o transportador do túbulo proximal que reabsorve a maior parte da glicose filtrada. Ao bloqueá-lo, a \u003cstrong>dapagliflozina\u003c/strong> (Forxiga®) e a \u003cstrong>empagliflozina\u003c/strong> (Jardiance®) fazem o rim eliminar glicose na urina, com perda de calorias e um pouco de sódio. O efeito glicêmico é moderado e depende da função renal, mas os benefícios vão além da glicose:\u003c/p> \u003cul> \u003cli>reduzem internação por insuficiência cardíaca e morte cardiovascular, com ou sem diabetes;\u003c/li> \u003cli>reduzem a progressão da doença renal crônica, com ou sem diabetes;\u003c/li> \u003cli>causam leve perda de peso e de PA.\u003c/li> \u003c/ul> \u003cp>Doses: dapagliflozina 10 mg uma vez ao dia, sem ajuste de dose pela função renal, mas com menor efeito glicêmico se TFGe &lt; 45; empagliflozina 10 mg, até 25 mg no DM2, não recomendada abaixo de TFGe 30 para tratar diabetes e abaixo de 20 na insuficiência cardíaca (bulas). TFGe sempre estimada por CKD-EPI 2021, sem raça. No SUS, a dapagliflozina foi incorporada para DM2 com risco cardiovascular, para insuficiência cardíaca com fração de ejeção reduzida e para DRC, com critérios de idade e risco; no Farmácia Popular, a SBD 2026 cita o acesso para pessoas com 65 anos ou mais com DM2 e doença cardiovascular; no Componente Especializado, os critérios incluem idade a partir de 40 anos com doença cardiovascular estabelecida e DM2 com TFGe de 25 a 75 mL/min/1,73 m² ou albuminúria elevada.\u003c/p> \u003ch4>Efeitos adversos e cuidados\u003c/h4> \u003cul> \u003cli>\u003cstrong>Infecção genital fúngica\u003c/strong> (candidíase vulvovaginal e balanopostite): a mais comum, pela glicose na urina. Higiene íntima diária, secar bem a região e procurar tratamento ao primeiro sintoma.\u003c/li> \u003cli>Infecção urinária, em menor grau.\u003c/li> \u003cli>Depleção de volume e hipotensão: idosos, uso de diurético de alça, calor.\u003c/li> \u003cli>\u003cstrong>Cetoacidose euglicêmica\u003c/strong>: cetoacidose com glicemia normal ou pouco elevada. Fatores desencadeantes: jejum prolongado, dieta muito pobre em carboidratos, álcool em excesso, doença aguda, desidratação, cirurgia, redução brusca de insulina. O capítulo da SBD sobre cetoacidose euglicêmica (2023) recomenda suspender o iSGLT2 de 3 a 4 dias antes de cirurgia de grande porte, procedimento invasivo planejado ou exercício muito intenso (a tabela do mesmo capítulo fala em 24 a 72 horas), e só reiniciar quando a alimentação estiver liberada; o prazo de cada caso é definido pela equipe médica.\u003c/li> \u003cli>Gangrena de Fournier (infecção grave do períneo): rara, exige emergência.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Usuário de iSGLT2 com náusea, vômitos, dor abdominal, falta de ar, sonolência ou mal-estar, mesmo com glicemia normal ou abaixo de 200 mg/dL (limite usado pela SBD na definição de cetoacidose euglicêmica), pode ter o quadro. A SBD recomenda dosar cetonas nesses casos, de preferência no sangue, porque a cetonúria pode vir falsamente baixa com iSGLT2. Encaminhar para atendimento de urgência.\u003c/p>\u003c/div> \u003ch3>Pioglitazona\u003c/h3> \u003cp>A pioglitazona (Actos®) é uma tiazolidinediona: ativa o receptor PPAR-gama e aumenta a sensibilidade à insulina no tecido adiposo, músculo e fígado. A bula indica 15 a 45 mg uma vez ao dia, com ou sem alimento. Não causa hipoglicemia isolada e tem benefício na doença hepática esteatótica metabólica. Os problemas são: ganho de peso, \u003cstrong>retenção de líquido e edema\u003c/strong>, risco de descompensar insuficiência cardíaca (não usar em insuficiência cardíaca sintomática), aumento de fraturas em mulheres e cautela em quem tem ou teve câncer de bexiga. A bula prevê exames periódicos de função hepática.\u003c/p> \u003ch3>Acarbose\u003c/h3> \u003cp>A acarbose (Glucobay®) inibe as alfa-glicosidases intestinais, que quebram amido e sacarose em glicose. A glicose pós-prandial sobe mais devagar. A bula orienta engolir o comprimido inteiro imediatamente antes da refeição ou mastigá-lo com as primeiras garfadas, começando com 50 mg três vezes ao dia e podendo chegar a 100 mg três vezes ao dia. Causa flatulência, distensão e diarreia, que diminuem com o tempo e com menos açúcar na dieta.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Se um paciente em uso de acarbose tiver hipoglicemia (por estar associado a sulfonilureia ou insulina), açúcar comum e doces podem não funcionar bem, porque a sacarose precisa ser quebrada no intestino. Usar glicose pura (comprimidos ou gel de glicose) ou, na falta, leite, que contém lactose.\u003c/p>\u003c/div> \u003ch3>Como as classes se combinam\u003c/h3> \u003cp>A escolha do segundo ou terceiro antidiabético depende das comorbidades, e não só da HbA1c. Em pessoas com doença cardiovascular estabelecida, insuficiência cardíaca ou doença renal crônica, SBD e ADA priorizam iSGLT2 e aGLP-1 com benefício comprovado, independentemente do controle glicêmico. Quando o objetivo é perda de peso, aGLP-1 e tirzepatida têm o maior efeito. Quando o custo e o acesso pesam, a SBD orienta o caminho do SUS: metformina, depois sulfonilureia (de preferência gliclazida MR), dapagliflozina para quem preenche os critérios e insulina. Existem várias associações em dose fixa com metformina (com sitagliptina, vildagliptina, dapagliflozina ou empagliflozina) e combinações de gliflozina com gliptina. No balcão, o cuidado é o mesmo da hipertensão: evitar duplicidade quando o paciente recebe a associação e também um componente isolado, e conferir a dose total de metformina.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar iSGLT2, oriente higiene genital, hidratação, sinais de cetoacidose e a necessidade de avisar o cirurgião ou dentista antes de procedimentos maiores. Ao dispensar pioglitazona, pergunte sobre falta de ar, inchaço e ganho rápido de peso. Ao dispensar acarbose, explique o horário com a primeira garfada e o tratamento da hipoglicemia com glicose.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 56 anos, em uso de dapagliflozina há um mês, pede creme para \"coceira e corrimento\". O farmacêutico relaciona o quadro ao iSGLT2, orienta higiene, avalia se o caso se enquadra em tratamento de candidíase vulvovaginal sem sinais de alarme ou se precisa de encaminhamento, e informa que o médico deve saber do efeito para decidir se mantém o medicamento.\u003c/p>\u003c/div>"},{"id":"m05-glp1","titulo":"Agonistas de GLP-1 e tirzepatida","resumo":"\u003cp>Os agonistas do receptor de GLP-1 (aGLP-1) são análogos resistentes à DPP-4 que imitam o hormônio intestinal GLP-1 em concentrações muito maiores que as fisiológicas. Eles aumentam a secreção de insulina apenas quando a glicose está alta, reduzem o glucagon, retardam o esvaziamento do estômago e agem no sistema nervoso central reduzindo o apetite. A \u003cstrong>tirzepatida\u003c/strong> é um agonista duplo dos receptores de GIP e GLP-1, com efeito ainda maior sobre glicemia e peso.\u003c/p> \u003cp>Benefícios: redução importante da HbA1c, perda de peso significativa e, para semaglutida, liraglutida e dulaglutida, redução de eventos cardiovasculares em pessoas com doença cardiovascular estabelecida. A DBHA 2025 também cita os aGLP-1 como fármacos com proteção cardiorrenal em diabéticos.\u003c/p> \u003ch3>Produtos e doses (bulas)\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Produto\u003c/th>\u003cth>Indicação principal\u003c/th>\u003cth>Esquema\u003c/th>\u003cth>Conservação após aberto\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Liraglutida (Victoza®)\u003c/td>\u003ctd>DM2\u003c/td>\u003ctd>Diário, SC; inicia em 0,6 mg e sobe para 1,2 e 1,8 mg com pelo menos 1 semana em cada dose\u003c/td>\u003ctd>1 mês, 15 a 30 °C ou geladeira\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Liraglutida (Saxenda®)\u003c/td>\u003ctd>Obesidade\u003c/td>\u003ctd>Diário, SC; escalonamento de 0,6 em 0,6 mg, com intervalo de pelo menos 1 semana, até 3 mg\u003c/td>\u003ctd>4 semanas, 15 a 30 °C ou geladeira\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Semaglutida (Ozempic®)\u003c/td>\u003ctd>DM2\u003c/td>\u003ctd>Semanal, SC; 0,25 mg por 4 semanas, depois 0,5 mg; após pelo menos 4 semanas, pode ir a 1 mg. Doses acima de 1 mg não são recomendadas na bula brasileira. Canetas multidose: 0,25/0,5 mg (1,5 mL) e 1 mg (3 mL)\u003c/td>\u003ctd>6 semanas, abaixo de 30 °C ou geladeira\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Semaglutida (Wegovy®)\u003c/td>\u003ctd>Obesidade ou sobrepeso com comorbidade\u003c/td>\u003ctd>Semanal, SC; 0,25, 0,5, 1 e 1,7 mg (4 semanas cada) até manutenção de 2,4 mg; 7,2 mg (três injeções de 2,4 mg) só em adulto com IMC inicial ≥ 30 kg/m², após 4 semanas em 2,4 mg. Uma caneta multidose por dose, com 4 doses\u003c/td>\u003ctd>6 semanas, abaixo de 30 °C ou geladeira\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Semaglutida oral (Rybelsus®)\u003c/td>\u003ctd>DM2\u003c/td>\u003ctd>Diário; 3 mg por um mês, depois 7 mg; após pelo menos um mês, pode ir a 14 mg (máximo)\u003c/td>\u003ctd>Comprimido\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dulaglutida (Trulicity®)\u003c/td>\u003ctd>DM2\u003c/td>\u003ctd>Semanal, SC; caneta de uso único (0,75 e 1,5 mg)\u003c/td>\u003ctd>Até 14 dias fora da geladeira, até 30 °C\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Tirzepatida (Mounjaro®)\u003c/td>\u003ctd>DM2; obesidade e sobrepeso com comorbidade; apneia obstrutiva do sono com obesidade\u003c/td>\u003ctd>Semanal, SC; 2,5 mg por 4 semanas, depois 5 mg; +2,5 mg após no mínimo 4 semanas na dose atual; manutenção 5, 10 ou 15 mg; máximo 15 mg\u003c/td>\u003ctd>Caneta de uso único: até 21 dias fora da geladeira, abaixo de 30 °C\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A \u003cstrong>semaglutida oral\u003c/strong> exige técnica: tomar em jejum de pelo menos 8 horas, engolir inteiro com até meio copo de água (120 mL) e esperar pelo menos 30 minutos antes de comer, beber ou tomar outros remédios orais, porque o alimento reduz a absorção (bula do Rybelsus®, 2025). A bula determina um comprimido por dia: dois comprimidos de 7 mg não substituem um de 14 mg.\u003c/p> \u003cp>Em março de 2026 a Anvisa registrou também uma caneta multidose de tirzepatida (Mounjaro® KwikPen®, quatro doses fixas por caneta; Resolução-RE nº 1.041/2026). Conservação e descarte dessa apresentação seguem a bula própria dela, diferente da caneta de uso único.\u003c/p> \u003cp>Com o fim da patente da semaglutida no Brasil, em março de 2026, a Anvisa registrou em maio de 2026 a primeira semaglutida sintética nacional (Ozivy®, da EMS), indicada para DM2, e havia outros pedidos em análise. A lixisenatida aparece no Brasil associada à insulina glargina.\u003c/p> \u003ch3>Escalonamento e efeitos gastrintestinais\u003c/h3> \u003cp>Náusea, vômitos, diarreia, constipação, dor abdominal e plenitude são os efeitos mais comuns e dependem da dose. Por isso todos os esquemas começam com dose baixa e sobem a cada 4 semanas (ou semanalmente, na liraglutida). Orientações úteis: comer porções menores e devagar, parar ao sentir saciedade, evitar alimentos gordurosos, manter hidratação. Vômitos e diarreia intensos podem desidratar e levar a lesão renal aguda.\u003c/p> \u003ch3>Riscos que o farmacêutico precisa reconhecer\u003c/h3> \u003cul> \u003cli>\u003cstrong>Pancreatite aguda\u003c/strong>: dor abdominal intensa e persistente, que pode irradiar para as costas, com ou sem vômitos. Suspender e procurar atendimento.\u003c/li> \u003cli>Doença da vesícula biliar (cólica biliar, colecistite), favorecida pela perda rápida de peso.\u003c/li> \u003cli>Hipoglicemia quando associados a sulfonilureia ou insulina; isoladamente o risco é baixo.\u003c/li> \u003cli>Contraindicação em quem tem história pessoal ou familiar de carcinoma medular de tireoide ou neoplasia endócrina múltipla tipo 2, conforme as bulas.\u003c/li> \u003cli>Gestação: não usar; a interrupção antes de engravidar segue a bula de cada produto.\u003c/li> \u003cli>Esvaziamento gástrico lento: avisar o médico ou anestesista antes de cirurgias, sedação e endoscopias.\u003c/li> \u003cli>Tirzepatida pode reduzir a eficácia de anticoncepcional oral; a bula orienta trocar para método não oral ou acrescentar método de barreira por 4 semanas no início e por 4 semanas após cada aumento de dose.\u003c/li> \u003cli>Perda de massa muscular com perda de peso rápida: reforçar proteína na dieta e exercício de força, com acompanhamento profissional.\u003c/li> \u003c/ul> \u003ch3>Uso no tratamento da obesidade\u003c/h3> \u003cp>A bula do Wegovy® indica o produto para adultos com IMC ≥ 30 kg/m², ou ≥ 27 kg/m² com comorbidade relacionada ao peso (diabetes, hipertensão, dislipidemia, apneia do sono, doença cardiovascular), junto com dieta e atividade física, e para adolescentes a partir de 12 anos com obesidade. A tirzepatida recebeu indicação para obesidade e sobrepeso com comorbidades no Brasil em junho de 2025 (a bula atual inclui também apneia obstrutiva do sono moderada a grave em adultos com obesidade), e a liraglutida em dose de 3 mg (Saxenda®) também é indicada para controle de peso. São tratamentos de doença crônica, com acompanhamento, e não produtos estéticos para perder alguns quilos. As doses e canetas para obesidade são diferentes das de diabetes, o que exige atenção para não trocar Ozempic® por Wegovy® ou vice-versa.\u003c/p> \u003ch3>Regra de dispensação vigente\u003c/h3> \u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>A RDC nº 973, de 23 de abril de 2025, alterou a RDC nº 471/2021, que passou a abranger as substâncias listadas na IN nº 360/2025 (art. 2º): semaglutida, liraglutida, dulaglutida, tirzepatida e lixisenatida, isoladas ou em associação. A receita é feita em \u003cstrong>duas vias\u003c/strong> (RDC 471/2021, art. 6º, parágrafo único); a farmácia \u003cstrong>retém a 2ª via\u003c/strong> e devolve a 1ª ao paciente (art. 10); a validade é de \u003cstrong>90 dias\u003c/strong> a contar da emissão (IN 360/2025, art. 2º, § 1º); a movimentação é escriturada no \u003cstrong>SNGPC\u003c/strong> (RDC 471/2021, art. 14). As regras valem desde 23 de junho de 2025.\u003c/p>\u003c/div> \u003cp>A lógica é a mesma já aplicada aos antimicrobianos. Em regra, a receita é aviada uma única vez (RDC 471/2021, art. 13). No tratamento prolongado, ela pode servir para aquisições posteriores dentro dos 90 dias, desde que indique o uso contínuo e a quantidade para cada 30 dias (art. 9º, § 1º). Segundo as Perguntas e Respostas da Anvisa (1ª edição, junho de 2025), cada dispensação deve cobrir no mínimo 30 dias de tratamento, e também é permitido dispensar de uma vez a quantidade para 90 dias; cada atendimento é anotado no anverso das duas vias, e ao menos uma via fica retida. Um resumo do CFF fala em \"até 30 dias por dispensação\", o que diverge do documento da Anvisa: vale o texto da agência. A escrituração no SNGPC segue o cronograma publicado pela Anvisa; antes dele, em livro ou sistema interno. A receita eletrônica é aceita com assinatura eletrônica avançada do prescritor (Lei nº 14.063/2020), desde que a farmácia consiga verificar o documento original. A Anvisa não proibiu o uso fora da bula, que segue sendo responsabilidade do prescritor.\u003c/p> \u003ch3>Dose esquecida e interrupções\u003c/h3> \u003cp>Cada bula traz uma janela para aplicar a dose semanal esquecida: até 5 dias para a semaglutida (Ozempic® e Wegovy®) e até 4 dias (96 horas) para a tirzepatida. Passado esse prazo, a orientação é pular a dose e manter o dia habitual. Duas doses semanais não devem ser aplicadas com intervalo menor que o permitido na bula. Quem interrompe por várias semanas pode precisar recomeçar o escalonamento, porque reiniciar direto em dose alta causa náusea e vômitos intensos; essa decisão é do prescritor. A suspensão costuma ser seguida de recuperação de parte do peso perdido, o que deve ser discutido com o médico antes de parar.\u003c/p> \u003ch3>Manipulação, falsificação e produtos irregulares\u003c/h3> \u003cp>A explosão de procura criou um mercado ilegal. Os pontos a conhecer:\u003c/p> \u003cul> \u003cli>Segundo o CFF (janeiro de 2026), a Anvisa vedou a manipulação de semaglutida e mantém a tirzepatida manipulada sob monitoramento e restrições (Nota Técnica nº 200/2025 e Despacho nº 97/2025).\u003c/li> \u003cli>Em janeiro de 2026, a Resolução RE nº 214 da Anvisa proibiu e mandou apreender canetas de tirzepatida das marcas Synedica e TG e produtos de retatrutida de todas as marcas, sem registro no país e vendidos pela internet. A retatrutida não tem registro aprovado.\u003c/li> \u003cli>Canetas trazidas do Paraguai não são equivalentes às registradas no Brasil, segundo a Anvisa, e a Receita Federal registrou aumento expressivo de apreensões em 2025.\u003c/li> \u003cli>Já houve alertas de lotes falsificados de canetas de semaglutida. Sinais de suspeita: preço muito abaixo do mercado, venda por rede social, embalagem com erros, número de lote ou validade diferentes entre caixa e caneta, solução turva ou com partículas, falta de bula.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>A farmácia só pode adquirir de distribuidores regularizados, conferir nota fiscal e lote e escriturar no SNGPC. Cliente com reação após usar caneta de origem duvidosa deve ser encaminhado, e o caso notificado à Anvisa (queixa técnica e evento adverso).\u003c/p>\u003c/div> \u003ch3>Armazenamento e uso da caneta\u003c/h3> \u003cp>Antes de abrir, todas devem ficar na geladeira, entre 2 e 8 °C, longe do congelador; produto congelado deve ser descartado. Após o início do uso, cada produto tem prazo próprio fora da geladeira (tabela acima). A agulha é trocada a cada aplicação e descartada em recipiente rígido. Nas canetas semanais, a aplicação é no mesmo dia da semana, em qualquer horário, no abdome, coxa ou braço, com rodízio de locais. O dia pode ser trocado respeitando o intervalo mínimo da bula (para semaglutida e tirzepatida, pelo menos 3 dias, ou 72 horas, entre doses).\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Confira a receita (duas vias, validade de 90 dias; no uso contínuo, a indicação expressa e a quantidade para cada 30 dias), retenha a 2ª via, anote a dispensação nas vias e escriture. Pergunte se é o primeiro uso e explique o escalonamento, os efeitos gastrintestinais e os sinais de pancreatite. Mostre como guardar a caneta e o que fazer em viagem. Se a pessoa usa sulfonilureia ou insulina, oriente sobre hipoglicemia. Recuse vender sem receita, mesmo para \"quem já usa\".\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Cliente de 35 anos quer comprar tirzepatida \"manipulada, que é mais barata\", indicada por uma influenciadora, e não tem receita. O farmacêutico explica a exigência de receita retida, os riscos de produtos sem registro e as proibições recentes da Anvisa, recusa a venda e orienta procurar avaliação médica para tratamento da obesidade.\u003c/p>\u003c/div>"},{"id":"m05-insulinas","titulo":"Insulinas","resumo":"\u003cp>A insulina é indispensável no DM1 e necessária em muitos pacientes com DM2 ao longo da doença, quando as células beta perdem função. Ela também é a terapia de escolha em várias situações agudas e na gestação. As insulinas comerciais têm concentração padrão de \u003cstrong>100 UI/mL\u003c/strong>; algumas apresentações têm 300 UI/mL (glargina) ou outras concentrações, o que exige atenção máxima na dispensação.\u003c/p> \u003ch3>Reposição fisiológica em linguagem simples\u003c/h3> \u003cp>O pâncreas saudável libera insulina de dois jeitos: um \"fundo\" constante ao longo do dia e da noite (\u003cstrong>basal\u003c/strong>), que segura a produção de glicose pelo fígado, e picos a cada refeição (\u003cstrong>prandial\u003c/strong> ou \"bolus\"). A SBD resume que, no DM1, cerca de metade da insulina diária é basal e metade prandial. O esquema \u003cstrong>basal-bolus\u003c/strong> imita isso: uma insulina de ação longa ou intermediária faz o fundo, e uma insulina rápida ou ultrarrápida é aplicada antes das refeições, com dose ajustada à quantidade de carboidrato e à glicemia do momento. No DM2, é comum começar só com a basal (por exemplo, NPH ao deitar ou um análogo de ação longa) associada aos orais, e acrescentar insulina prandial depois, se necessário.\u003c/p> \u003ch3>Tipos e perfil de ação\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Insulina\u003c/th>\u003cth>Início\u003c/th>\u003cth>Pico\u003c/th>\u003cth>Duração\u003c/th>\u003cth>Aspecto\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Regular (humana)\u003c/td>\u003ctd>30 a 60 min\u003c/td>\u003ctd>2 a 3 h\u003c/td>\u003ctd>5 a 8 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Asparte, lispro, glulisina\u003c/td>\u003ctd>5 a 15 min\u003c/td>\u003ctd>30 min a 2 h\u003c/td>\u003ctd>3 a 5 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Asparte de ação ultrarrápida (Fiasp®)\u003c/td>\u003ctd>2 a 5 min\u003c/td>\u003ctd>1 a 3 h\u003c/td>\u003ctd>5 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>NPH (humana)\u003c/td>\u003ctd>2 a 4 h\u003c/td>\u003ctd>4 a 10 h\u003c/td>\u003ctd>10 a 18 h\u003c/td>\u003ctd>Turva (suspensão)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Detemir\u003c/td>\u003ctd>1 a 3 h\u003c/td>\u003ctd>6 a 8 h\u003c/td>\u003ctd>18 a 22 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glargina 100 UI/mL\u003c/td>\u003ctd>2 a 4 h\u003c/td>\u003ctd>Sem pico\u003c/td>\u003ctd>20 a 24 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Glargina 300 UI/mL\u003c/td>\u003ctd>6 h\u003c/td>\u003ctd>Sem pico\u003c/td>\u003ctd>36 h\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Degludeca\u003c/td>\u003ctd>Gradual\u003c/td>\u003ctd>Sem pico\u003c/td>\u003ctd>42 h ou mais\u003c/td>\u003ctd>Límpida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Pré-misturas (NPH/regular 70/30; lispro 75/25 e 50/50; asparte 70/30)\u003c/td>\u003ctd>Da fração rápida\u003c/td>\u003ctd>Duplo\u003c/td>\u003ctd>Da fração intermediária\u003c/td>\u003ctd>Turva\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Valores aproximados segundo a SBD (Tabela 1 do capítulo de insulinoterapia no DM1); variam com dose, local e pessoa. A \u003cstrong>regular\u003c/strong> deve ser aplicada cerca de 30 minutos antes da refeição. Os análogos rápidos são aplicados imediatamente antes de comer (a asparte ultrarrápida pode ser aplicada até 20 minutos após o início da refeição). A NPH e as pré-misturas são suspensões e precisam ser \u003cstrong>homogeneizadas com 20 movimentos suaves\u003c/strong> antes de cada uso (SBD), sem agitar com força. Insulina que deveria ser límpida e está turva, com grumos ou cristais, não deve ser usada.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Erros de insulina causam hipoglicemia grave. Confira nome, tipo, concentração (100 ou 300 UI/mL), apresentação (frasco, refil, caneta descartável) e se a caneta é compatível com o refil. Nunca aspire insulina de caneta com seringa, e nunca use seringa graduada em mL: a prescrição é em UI e a seringa deve ter escala em UI.\u003c/p>\u003c/div> \u003ch3>Técnica de aplicação\u003c/h3> \u003cp>A SBD (capítulo de práticas seguras de preparo e aplicação, 2025) recomenda:\u003c/p> \u003cul> \u003cli>\u003cstrong>Agulha mais curta disponível\u003c/strong>: 4 ou 5 mm para caneta e 6 mm para seringa são primeira escolha em todos os pacientes. Agulhas de 12 mm ou mais não devem ser usadas.\u003c/li> \u003cli>\u003cstrong>Prega cutânea\u003c/strong> quando o tecido subcutâneo é fino: IMC abaixo de 19 kg/m², adultos mais velhos, gestantes e crianças de até 6 anos.\u003c/li> \u003cli>Locais: abdome (afastado do umbigo), face anterior e lateral da coxa, face posterior do braço e região superior lateral das nádegas.\u003c/li> \u003cli>\u003cstrong>Rodízio\u003c/strong> sistemático dos locais e dos pontos dentro de cada região, com cerca de 1 cm entre aplicações.\u003c/li> \u003cli>Caneta: teste de fluxo antes de cada aplicação (selecionar pequena dose e ver a gota na pon

rdar sobras","Descrever sinais de reação grave e de falha (sem melhora em 48 a 72 horas)","Pedir que o paciente repita as instruções principais","Registrar a orientação e notificar reação adversa no VigiMed quando ocorrer"]},{"tipo":"fluxo","id":"m03-atb-fluxo-alergia","titulo":"Relato de alergia a penicilina diante de receita de betalactâmico","passos":[{"t":"Paciente com receita de betalactâmico relata alergia a penicilina","tipo":"inicio"},{"t":"Qualificar a história: fármaco, sintomas, tempo até a reação, tratamento, uso posterior de outro betalactâmico","tipo":"acao"},{"t":"Houve bolhas, descamação, lesão de mucosa, febre com exantema extenso ou acometimento de órgão (SSJ, NET, DRESS)?","tipo":"decisao","sim":"Não dispensar; contatar o prescritor e registrar como reação grave","nao":"Seguir para a próxima pergunta"},{"t":"Reação imediata (até cerca de 1 a 6 horas) com urticária, angioedema, falta de ar ou hipotensão?","tipo":"decisao","sim":"Contatar o prescritor antes de dispensar penicilina; cefalosporina de cadeia lateral diferente é decisão médica","nao":"Considerar história de baixo risco"},{"t":"A receita é de penicilina ou de cefalosporina com cadeia lateral semelhante à amoxicilina (cefalexina, cefadroxila, cefaclor)?","tipo":"decisao","sim":"Informar o prescritor sobre a história e registrar a decisão","nao":"Dispensar com orientação e registro da história"},{"t":"Orientar sinais de anafilaxia e o que fazer (SAMU 192)","tipo":"alerta"},{"t":"Sugerir avaliação para desrotulagem em história antiga e de baixo risco","tipo":"acao"},{"t":"Registrar no histórico do paciente o fármaco, a reação e a conduta","tipo":"fim"}]},{"tipo":"cartoes","id":"m03-atb-cartoes","titulo":"Cartões de revisão: antimicrobianos","itens":[{"f":"Índice PK/PD dos betalactâmicos","v":"Tempo com concentração acima da CIM (tempo-dependentes); horário regular é essencial"},{"f":"Índice PK/PD dos aminoglicosídeos","v":"Pico sobre a CIM; por isso dose única diária"},{"f":"Por que betalactâmico não trata Mycoplasma?","v":"Mycoplasma não tem parede celular"},{"f":"O que é ESBL?","v":"Betalactamase de enterobactéria que inativa penicilinas, cefalosporinas até 4ª geração e aztreonam"},{"f":"Mecanismo do MRSA","v":"Gene mecA produz PBP2a, de baixa afinidade pelos betalactâmicos"},{"f":"Meta global de uso de antibióticos Access","v":"Pelo menos 70% do consumo humano até 2030 (declaração da ONU, 2024)"},{"f":"Amoxicilina-clavulanato: quando tomar?","v":"No início da refeição"},{"f":"Reatividade cruzada penicilina e cefalosporina","v":"Abaixo de 2%, guiada pela cadeia lateral R1 (AAAAI/ACAAI, 2022)"},{"f":"Cefalosporinas com cadeia lateral semelhante à amoxicilina","v":"Cefalexina, cefadroxila e cefaclor"},{"f":"Carbapenêmico e ácido valproico","v":"Queda rápida do valproato com risco de convulsão; evitar a associação"},{"f":"Claritromicina com sinvastatina","v":"Contraindicada: inibição do CYP3A4 e risco de rabdomiólise"},{"f":"Doxiciclina: três orientações","v":"Copo cheio de água e não deitar; separar de cátions; proteção solar"},{"f":"Linezolida com sertralina","v":"Risco de síndrome serotoninérgica"},{"f":"Quais antimicrobianos reduzem com certeza o anticoncepcional?","v":"Rifampicina e rifabutina (indutores enzimáticos)"},{"f":"Nitrofurantoína: limite renal da bula brasileira","v":"Contraindicada com depuração abaixo de 60 mL/min/1,73 m²"},{"f":"Fosfomicina trometamol: como tomar","v":"3 g dissolvidos em água, em jejum, à noite após esvaziar a bexiga"},{"f":"Ciprofloxacino e cátions","v":"Bula brasileira: 1 a 2 horas antes ou 4 horas depois de antiácidos, ferro, zinco ou cálcio"},{"f":"SMX-TMP com varfarina","v":"Aumento importante do RNI; evitar ou monitorar"},{"f":"Alvo de monitorização da vancomicina (2020)","v":"AUC/CIM de 400 a 600 mg·h/L em infecção grave por MRSA"},{"f":"Vancomicina oral serve para quê?","v":"Só para colite por C. difficile; não é absorvida"}]},{"tipo":"questoes","id":"m03-atb-questoes","titulo":"Questões de fixação: antimicrobianos","itens":[{"p":"Sobre os princípios de farmacodinâmica dos antimicrobianos, assinale a alternativa correta.","alt":["Aminoglicosídeos são tempo-dependentes e devem ser fracionados","Betalactâmicos dependem do tempo acima da CIM","Quinolonas não têm efeito pós-antibiótico","Vancomicina é monitorada só pelo vale de 15 a 20 mg/L","Macrolídeos são bactericidas para todos os germes"],"c":1,"com":"Betalactâmicos são tempo-dependentes: o índice que prediz eficácia é T > CIM. Aminoglicosídeos são concentração-dependentes (dose única diária). Quinolonas têm efeito pós-antibiótico prolongado contra Gram-negativos. O consenso ASHP/IDSA de 2020 recomenda AUC/CIM de 400 a 600 e abandonou a monitorização só pelo vale. Macrolídeos são predominantemente bacteriostáticos."},{"p":"Cliente de 52 anos usa sinvastatina 40 mg e colchicina para gota e traz receita de claritromicina 500 mg de 12/12 h para pneumonia comunitária. A conduta mais adequada do farmacêutico é:","alt":["Dispensar e orientar tomar a claritromicina longe da sinvastatina","Dispensar e orientar suspender só a colchicina","Contatar o prescritor pelas interações graves via CYP3A4","Trocar por azitromicina por conta própria","Dispensar, pois a interação só ocorre após 14 dias"],"c":2,"com":"A claritromicina é inibidora potente do CYP3A4 e da glicoproteína P: com sinvastatina é contraindicada (rabdomiólise) e com colchicina pode causar toxicidade grave. Separar horários não resolve inibição enzimática. Suspender medicamento ou trocar antibiótico é decisão do prescritor, que deve ser contatado. A interação ocorre em poucos dias."},{"p":"Paciente relata que, aos 8 anos, apresentou manchas vermelhas no corpo no quinto dia de amoxicilina, sem falta de ar ou bolhas. Hoje recebe receita de ceftriaxona IM. Segundo o parâmetro prático de alergia da AAAAI/ACAAI (2022), é correto afirmar:","alt":["A reatividade cruzada com cefalosporinas é de cerca de 10%","Toda cefalosporina está contraindicada","Ceftriaxona tem cadeia lateral R1 idêntica à da amoxicilina","História tardia benigna e antiga é de baixo risco","Carbapenêmicos têm a mesma reatividade das cefalosporinas"],"c":3,"com":"Exantema tardio, sem acometimento de mucosa ou sistêmico, é história de baixo risco. A reatividade com cefalosporinas fica abaixo de 2% e depende da cadeia lateral R1; ceftriaxona tem cadeia diferente da amoxicilina (cefalexina, cefadroxila e cefaclor é que se parecem). Carbapenêmicos têm reatividade abaixo de 1%."},{"p":"Mulher de 24 anos em uso de anticoncepcional oral combinado recebe amoxicilina por 7 dias para sinusite e pergunta se precisa de método adicional. Com base nos critérios de elegibilidade do CDC (US MEC 2024), a resposta correta é:","alt":["Sim, todo antibiótico reduz a eficácia da pílula","Sim, mas só nos 7 dias seguintes ao fim do antibiótico","Não; atenção só se houver vômito ou diarreia intensa","Não, porque a amoxicilina é indutora enzimática fraca","Sim, se ela também usar ferro"],"c":2,"com":"Antibióticos de amplo espectro estão na categoria 1 com anticoncepcionais combinados; só indutores como rifampicina e rifabutina reduzem a eficácia de forma comprovada. A amoxicilina não é indutora. Vômito em até 3 a 4 horas ou diarreia intensa podem prejudicar a absorção da pílula, e então vale a regra de pílula esquecida da bula."},{"p":"Homem de 70 anos, em uso de prednisona e glibenclamida, recebe levofloxacino para infecção respiratória. Qual orientação está correta?","alt":["Tomar junto com o antiácido para proteger o estômago","Suspender o corticoide por conta própria","Exercício intenso ajuda a recuperação do tendão","Hipoglicemia não ocorre com quinolonas","Procurar o prescritor se surgir dor em tendão"],"c":4,"com":"Idade acima de 60 anos e corticoide aumentam o risco de tendinopatia e ruptura de tendão por quinolona; dor ou inchaço exige parar o esforço e procurar o prescritor. Antiácidos com cátions reduzem a absorção. Corticoide não deve ser suspenso sem orientação. Quinolonas causam hipo e hiperglicemia, sobretudo com sulfonilureias (alerta FDA, 2018)."},{"p":"Senhora em uso de varfarina com RNI estável recebe sulfametoxazol-trimetoprima 800/160 mg de 12/12 h. O risco principal e seu mecanismo são:","alt":["Sangramento por inibição do CYP2C9 e deslocamento proteico","Trombose por indução enzimática do metabolismo da varfarina","Hipocalemia grave por efeito diurético da trimetoprima","Nenhum, pois a interação é só teórica","Convulsão por inibição do CYP1A2 hepático pela sulfonamida"],"c":0,"com":"O sulfametoxazol inibe o CYP2C9 e desloca a varfarina da albumina, elevando o RNI de forma importante. A trimetoprima causa hipercalemia (não hipocalemia) por bloqueio do canal de sódio distal. Indução que reduz a varfarina é típica da rifampicina. Inibição do CYP1A2 é característica do ciprofloxacino."},{"p":"Sobre a nitrofurantoína, assinale a alternativa correta.","alt":["Atinge nível sérico adequado para pielonefrite","Resistência é rara mesmo em E. coli com ESBL","Pode ser usada sem restrição até o parto","A urina escura indica hepatotoxicidade","Deve ser tomada em jejum para melhor absorção"],"c":1,"com":"Por agir em vários alvos, a nitrofurantoína mantém atividade contra muitas E. coli produtoras de ESBL. Não alcança nível sérico e não serve para pielonefrite. É evitada a termo e no trabalho de parto (hemólise neonatal). Urina escura é esperada. O alimento melhora a absorção e a tolerância."},{"p":"Paciente em tratamento de tuberculose com esquema contendo rifampicina procura a farmácia assustada com urina e lágrimas alaranjadas. Ela usa lente de contato gelatinosa e varfarina. A orientação correta inclui:","alt":["Suspender a rifampicina até a cor das secreções normalizar","Avisar que a varfarina terá o efeito anticoagulante aumentado","Informar que a cor é esperada e evitar a lente gelatinosa","Tomar a rifampicina após o almoço para reduzir a cor","A cor indica hepatite e exige suspensão imediata"],"c":2,"com":"A coloração alaranjada de secreções é esperada e mancha lentes gelatinosas de forma permanente. A rifampicina é indutora potente e reduz (não aumenta) o efeito da varfarina, exigindo controle de RNI. Deve ser tomada em jejum. Não se suspende tratamento de tuberculose por conta própria."},{"p":"Sobre a vancomicina, assinale a alternativa correta.","alt":["A forma intravenosa trata colite por C. difficile","A reação de infusão é mediada por IgE","É ativa contra E. coli por ser molécula pequena","Por via oral age apenas na luz intestinal","O alvo atual é vale de 15 a 20 mg/L"],"c":3,"com":"Por via oral, a vancomicina não é absorvida e age só no intestino, por isso é usada no C. difficile; a via intravenosa não chega à luz intestinal em concentração eficaz. A reação de infusão é liberação direta de histamina, não IgE. É molécula grande e não age em Gram-negativos. O consenso de 2020 recomenda AUC/CIM de 400 a 600."},{"p":"Paciente usa sertralina 100 mg por dia e recebe alta hospitalar com linezolida 600 mg de 12/12 h por 14 dias. O farmacêutico deve:","alt":["Dispensar sem orientação, pois o risco é só com IMAO clássico","Orientar tomar a linezolida em jejum para evitar interação","Sugerir pseudoefedrina se houver congestão nasal","Recomendar tramadol para dor durante o curso","Contatar o prescritor pelo risco de síndrome serotoninérgica"],"c":4,"com":"A linezolida é inibidor fraco e reversível da MAO; com ISRS há risco de síndrome serotoninérgica (alerta FDA, 2011). O horário não altera essa interação farmacodinâmica. Pseudoefedrina eleva a pressão com linezolida, e tramadol soma efeito serotoninérgico."},{"p":"Sobre o uso de metronidazol e álcool, é correto afirmar:","alt":["Ensaios clínicos mostram reação grave em quase todos os casos","A bula brasileira não traz nenhuma restrição","Evidência recente questiona a reação, mas a bula restringe","A restrição vale só para o metronidazol vaginal","O secnidazol dispensa qualquer restrição ao consumo de álcool"],"c":2,"com":"Estudos controlados e um caso-controle de 2023 (WMJ) não demonstraram reação dissulfiram-símile, mas a evidência é limitada e as bulas brasileiras mantêm a orientação: evitar álcool durante e por 1 dia após o metronidazol oral e por 4 dias após o secnidazol."},{"p":"Mãe recebe amoxicilina-clavulanato em suspensão para criança de 4 anos. Qual orientação está de acordo com as bulas consultadas?","alt":["Guardar a suspensão no armário por até 14 dias","Medir a dose com colher de sopa da cozinha","Conservar em geladeira e descartar após 7 dias","Reconstituir com água morna para dissolver melhor","Congelar o que sobrar para outro episódio"],"c":2,"com":"As bulas de amoxicilina-clavulanato consultadas orientam conservação entre 2 e 8 °C por até 7 dias, sem congelar, com descarte da sobra. A medida deve ser feita com a seringa ou copo dosador do produto. A reconstituição usa água filtrada em temperatura ambiente, nunca quente."}]}],"fontes":["Anvisa. Resolução RDC nº 471, de 23 de fevereiro de 2021, alterada pela Resolução RDC nº 973, de 23 de abril de 2025 (art. 7º remete a validade à instrução normativa). Diário Oficial da União (texto conferido em reprodução da Legisweb, 2026).","Anvisa. Instrução Normativa nº 360, de 23 de abril de 2025 (lista de antimicrobianos; art. 1º, § 2º: validade de 10 dias; revoga a IN nº 244/2023). Diário Oficial da União, 24 abr. 2025.","Organização Mundial da Saúde. AWaRe classification of antibiotics, lista on-line (aware.essentialmeds.org), consultada em outubro de 2026.","Ministério da Saúde (Brasil). Protocolo Clínico e Diretrizes Terapêuticas para Atenção Integral às Pessoas com Infecções Sexualmente Transmissíveis (PCDT IST). Brasília, 2022. Quadros 34, 35 e 38.","Gupta K, Hooton TM, Naber KG, et al. International clinical practice guidelines for the treatment of acute uncomplicated cystitis and pyelonephritis in women: 2010 update by IDSA and ESCMID. Clin Infect Dis. 2011;52(5):e103-e120.","U.S. Food and Drug Administration. Drug Development and Drug Interactions: table of substrates, inhibitors and inducers (classificação de fluconazol, claritromicina, ciprofloxacino, terbinafina e rifampicina).","Hospital das Clínicas da FMUSP, Serviço de Farmácia do InCor. Nota Técnica nº 233, de 10 de janeiro de 2024: preparo de vancomicina 500 mg pó liofilizado para administração por via oral.","Bulas brasileiras conferidas em 2026 (texto de 2025, reproduzido em bula.com.br e consultaremedios.com.br): Zovirax® (aciclovir, GSK, aprovada em 05/08/2025), Macrodantina®, Monuril®, Flagyl®, Secnidal®, Revectina®, Annita® suspensão, Clavulin® suspensão, Amoxil® BD, amoxicilina suspensão genérica, Zinnat®, Cefamox®, Keflex® (bula profissional), Klaricid® suspensão, Azi® suspensão, Zitromax®, Dalacin® C, Bactrim® F, cloridrato de doxiciclina 100 mg, Cipro®, Levaquin®, Floxacin®, Lamisil®, Tamiflu®, Zentel® e nistatina suspensão.","U.S. National Library of Medicine, DailyMed. Bulas de Valtrex® (valaciclovir, revisão de 11/2025) e Stromectol® (ivermectina, revisão de 09/2024).","Organização Mundial da Saúde. The selection and use of essential medicines, 2025: WHO AWaRe (Access, Watch, Reserve) classification of antibiotics for evaluation and monitoring of use. Documento técnico B09489, 5 de setembro de 2025. https://www.who.int/publications/i/item/B09489","Organização Mundial da Saúde. World leaders commit to decisive action on antimicrobial resistance (declaração política da Assembleia Geral da ONU sobre resistência antimicrobiana), 26 de setembro de 2024. https://www.who.int/news/item/26-09-2024-world-leaders-commit-to-decisive-action-on-antimicrobial-resistance","U.S. Food and Drug Administration. Drug Safety Communications sobre fluoroquinolonas sistêmicas: restrição de uso (2016), hipoglicemia e efeitos na saúde mental (2018), aneurisma e dissecção de aorta (dezembro de 2018).","European Medicines Agency. Direct Healthcare Professional Communication: systemic and inhaled fluoroquinolone antibiotics (restrição de uso, 2018; lembrete do PRAC, 2023).","Khan DA, Banerji A, Blumenthal KG, et al. Drug allergy: a 2022 practice parameter update. J Allergy Clin Immunol. 2022;150(6):1333-1393.","Centers for Disease Control and Prevention. Clinical features of penicillin allergy / evaluation of penicillin allergy (orientação a profissionais). https://www.cdc.gov/antibiotic-use/clinicians/penicillin-allergy.html","Rybak MJ, Le J, Lodise TP, et al. Therapeutic monitoring of vancomycin for serious methicillin-resistant Staphylococcus aureus infections: a revised consensus guideline and review by ASHP, IDSA, PIDS e SIDP. Am J Health Syst Pharm. 2020;77(11):835-864.","Feldman R, Jaszczenski R. Can metronidazole cause a disulfiram reaction? A case-control study. WMJ. 2023;122(3):171-177.","Centers for Disease Control and Prevention. U.S. Medical Eligibility Criteria for Contraceptive Use, 2024. MMWR Recomm Rep. 2024;73(4).","Centers for Disease Control and Prevention. Research on doxycycline and tooth staining (febre maculosa). https://www.cdc.gov/rmsf/doxycycline/","Llewelyn MJ, Fitzpatrick JM, Darwin E, et al. The antibiotic course has had its day. BMJ. 2017;358:j3418.","Ministério da Saúde (Brasil). Guia de manejo e tratamento de influenza 2023. Brasília: Ministério da Saúde, 2023 (consultado por reproduções em notas técnicas estaduais).","Bulas brasileiras consultadas (Bulário Eletrônico da Anvisa e reproduções): nitrofurantoína (bula profissional, 2024; Macrodantina®), Flagyl® (metronidazol), Secnidal® (secnidazol), Monuril® (fosfomicina trometamol), Annita® (nitazoxanida), Revectina® (ivermectina), Zentel® (albendazol), Amoxil® (amoxicilina), Clavulin® e genéricos de amoxicilina-clavulanato, Zinnat® (cefuroxima), Klaricid® (claritromicina), Cefamox® (cefadroxila), azitromicina e cefalexina suspensão (genéricos).","Health Products Regulatory Authority (Irlanda). Resumo das características do medicamento de nitrofurantoína (uso com TFG de 30 a 44 mL/min), versão de 2026."]},{"id":"m04","num":4,"titulo":"Sistema cardiovascular e renal","escopo":"Fisiologia da pressão arterial e do SRAA, classificação e metas da Diretriz Brasileira de Hipertensão Arterial 2025, aferição de PA na farmácia (RDC 44/2009), classes de anti-hipertensivos e diuréticos, associações e cuidados com o rim no balcão (TFGe por CKD-EPI 2021, nefrotóxicos e ajuste renal).","cor":"#E5484D","icone":"heartbeat","curto":"Cardiovascular e renal","topicos":[{"id":"m04-pa-afericao","titulo":"Pressão arterial, classificação e aferição na farmácia","resumo":"\u003cp>A pressão arterial (PA) é a força que o sangue exerce sobre a parede das artérias. Ela depende de dois fatores: o \u003cstrong>débito cardíaco\u003c/strong> (quanto sangue o coração bombeia por minuto) e a \u003cstrong>resistência vascular periférica\u003c/strong> (o quanto as arteríolas estão contraídas). Qualquer medicamento que reduza a PA atua em um desses dois fatores, ou no volume de sangue que alimenta o débito cardíaco.\u003c/p> \u003cp>O corpo regula a PA em escalas de tempo diferentes. Em segundos, os barorreceptores da carótida e da aorta ajustam frequência cardíaca e tônus vascular pelo sistema nervoso autônomo. Em horas e dias, quem manda é o rim, que controla quanto sódio e água ficam no organismo. Por isso a hipertensão arterial (HA) é, na maior parte dos casos, uma doença de longo prazo ligada ao manejo renal de sódio, ao tônus simpático e à rigidez das artérias.\u003c/p> \u003ch3>Sistema renina-angiotensina-aldosterona\u003c/h3> \u003cp>O sistema renina-angiotensina-aldosterona (SRAA) explica o mecanismo de quase metade dos anti-hipertensivos. A cascata segue esta ordem:\u003c/p> \u003col> \u003cli>Quando o rim percebe queda de perfusão, pouco sódio chegando à mácula densa ou estímulo simpático (receptor beta-1), as células justaglomerulares liberam \u003cstrong>renina\u003c/strong>.\u003c/li> \u003cli>A renina corta o angiotensinogênio (produzido no fígado) e forma a angiotensina I, que é pouco ativa.\u003c/li> \u003cli>A \u003cstrong>enzima conversora da angiotensina (ECA)\u003c/strong>, abundante no endotélio pulmonar, transforma a angiotensina I em angiotensina II. A mesma enzima degrada a bradicinina, um vasodilatador.\u003c/li> \u003cli>A angiotensina II age no receptor AT1: contrai arteríolas, estimula a suprarrenal a liberar \u003cstrong>aldosterona\u003c/strong>, aumenta a sede e a liberação de hormônio antidiurético, e favorece hipertrofia e fibrose do coração e dos vasos.\u003c/li> \u003cli>A aldosterona atua no ducto coletor: retém sódio e água e elimina potássio.\u003c/li> \u003c/ol> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ponto de ação\u003c/th>\u003cth>Classe\u003c/th>\u003cth>Consequência prática\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Liberação de renina (beta-1)\u003c/td>\u003ctd>Betabloqueadores\u003c/td>\u003ctd>Menos renina e menor frequência cardíaca\u003c/td>\u003c/tr> \u003ctr>\u003ctd>ECA\u003c/td>\u003ctd>IECA\u003c/td>\u003ctd>Menos angiotensina II e acúmulo de bradicinina (tosse)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Receptor AT1\u003c/td>\u003ctd>BRA\u003c/td>\u003ctd>Bloqueio da angiotensina II sem acúmulo de bradicinina\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Receptor da aldosterona\u003c/td>\u003ctd>Espironolactona, eplerenona\u003c/td>\u003ctd>Natriurese e retenção de potássio\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Volume (néfron)\u003c/td>\u003ctd>Diuréticos\u003c/td>\u003ctd>Perda de sódio e água; a longo prazo, queda da resistência\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Músculo liso vascular\u003c/td>\u003ctd>Bloqueadores dos canais de cálcio\u003c/td>\u003ctd>Vasodilatação arteriolar\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Classificação e diagnóstico\u003c/h3> \u003cp>A Diretriz Brasileira de Hipertensão Arterial 2025 (DBHA 2025), elaborada pela SBC, SBN e SBH e publicada em setembro de 2025 nos Arquivos Brasileiros de Cardiologia, substituiu a diretriz de 2020. A principal mudança de classificação foi a volta do termo \u003cstrong>pré-hipertensão\u003c/strong> para a faixa de 120 a 139 mmHg de sistólica ou 80 a 89 mmHg de diastólica, com o objetivo de identificar cedo quem está em risco.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Categoria (consultório)\u003c/th>\u003cth>PAS (mmHg)\u003c/th>\u003cth>\u003c/th>\u003cth>PAD (mmHg)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>PA normal\u003c/td>\u003ctd>&lt; 120\u003c/td>\u003ctd>e\u003c/td>\u003ctd>&lt; 80\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Pré-hipertensão\u003c/td>\u003ctd>120 a 139\u003c/td>\u003ctd>e/ou\u003c/td>\u003ctd>80 a 89\u003c/td>\u003c/tr> \u003ctr>\u003ctd>HA estágio 1\u003c/td>\u003ctd>140 a 159\u003c/td>\u003ctd>e/ou\u003c/td>\u003ctd>90 a 99\u003c/td>\u003c/tr> \u003ctr>\u003ctd>HA estágio 2\u003c/td>\u003ctd>160 a 179\u003c/td>\u003ctd>e/ou\u003c/td>\u003ctd>100 a 109\u003c/td>\u003c/tr> \u003ctr>\u003ctd>HA estágio 3\u003c/td>\u003ctd>≥ 180\u003c/td>\u003ctd>e/ou\u003c/td>\u003ctd>≥ 110\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>O diagnóstico de HA exige PA de consultório ≥ 140 e/ou 90 mmHg em \u003cstrong>duas ocasiões diferentes\u003c/strong>, e o estágio é definido pelo maior valor entre sistólica e diastólica (DBHA 2025, cap. 3). A diretriz recomenda confirmar o diagnóstico com medidas fora do consultório: monitorização ambulatorial de 24 horas (MAPA) ou monitorização residencial (MRPA). Fora do consultório os limites são mais baixos: MRPA ≥ 130/80 mmHg e MAPA de 24 horas ≥ 130/80 mmHg (vigília ≥ 135/85; sono ≥ 120/70) definem HA.\u003c/p> \u003cp>Essas medidas revelam dois fenômenos frequentes. Na \u003cstrong>hipertensão do avental branco\u003c/strong>, a PA é alta no consultório e normal fora dele. Na \u003cstrong>hipertensão mascarada\u003c/strong>, ocorre o contrário: normal no consultório e alta em casa. A aferição na farmácia pode ajudar a levantar as duas suspeitas, mas não as confirma.\u003c/p> \u003ch3>Metas e início do tratamento\u003c/h3> \u003cp>A DBHA 2025 recomenda medidas não medicamentosas (perda de peso, menos sal, mais potássio na dieta exceto na doença renal crônica, dieta DASH, atividade física, menos álcool, não fumar) para todos com PA ≥ 120/80 mmHg. O tratamento medicamentoso começa no diagnóstico quando a PA é ≥ 140/90 mmHg. Na faixa de 130 a 139/80 a 89 mmHg com alto risco cardiovascular, o medicamento entra se não houver controle após 3 meses de medidas não medicamentosas. O risco cardiovascular passou a ser estimado pelo escore PREVENT.\u003c/p> \u003cp>A meta passou a ser a mesma para todos os hipertensos: \u003cstrong>PA &lt; 130/80 mmHg\u003c/strong>, qualquer que seja o risco cardiovascular. Quem não tolera essa meta deve ficar no valor mais baixo tolerado, e idosos frágeis têm a meta individualizada pelo médico (DBHA 2025, cap. 5).\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Diagnóstico: ≥ 140/90 mmHg no consultório em duas ocasiões. Meta de tratamento: &lt; 130/80 mmHg. Pré-hipertensão: 120 a 139 e/ou 80 a 89 mmHg, com mudança de estilo de vida para todos.\u003c/p>\u003c/div> \u003ch3>Aferição de pressão na farmácia\u003c/h3> \u003cp>A RDC nº 44/2009 permite que farmácias e drogarias prestem serviços farmacêuticos, entre eles a aferição de parâmetros fisiológicos, desde que o serviço esteja indicado no licenciamento sanitário do estabelecimento (art. 61, § 3º). A norma segue vigente em outubro de 2026, com a redação dada a vários artigos pela RDC nº 786/2023. Os parâmetros fisiológicos permitidos são a pressão arterial e a temperatura corporal (art. 69, § 1º). Exames de análises clínicas, como a glicemia capilar, seguem outra norma: a RDC nº 978/2025 (alterada pela RDC nº 1.043/2026), que revogou a RDC nº 786/2023 e permite classificar a farmácia como Serviço Tipo I (art. 8º), com exame de finalidade de triagem, sem fins confirmatórios (art. 60). Leis estaduais e municipais podem trazer exigências adicionais.\u003c/p> \u003cdiv class=\"cx lei\">\u003cb>O que diz a norma\u003c/b>\u003cp>RDC 44/2009, art. 69 (redação da RDC 786/2023): a aferição de parâmetros fisiológicos e a execução de exames na farmácia \"devem ter como finalidade a assistência farmacêutica, assistência à saúde e orientação sanitária, não possuindo, em nenhuma hipótese, o objetivo de diagnóstico\". O § 3º manda orientar o usuário a procurar assistência médica quando o valor diverge da referência, e o § 4º proíbe indicar ou alterar medicamento de venda sob prescrição com base no resultado.\u003c/p>\u003c/div> \u003cp>Para o serviço ser regular, a farmácia precisa de: ambiente adequado e reservado; aparelho regularizado na Anvisa (art. 71), com registro das calibrações e manutenções (art. 71, parágrafo único); instruções escritas que indiquem técnica, equipamento, interpretação e referências (art. 72); registro do atendimento com consentimento expresso do usuário (art. 64, § 1º); e entrega da \u003cstrong>Declaração de Serviço Farmacêutico\u003c/strong> (art. 81), que traz o valor medido, os valores de referência, a orientação e a frase obrigatória \"ESTE PROCEDIMENTO NÃO TEM FINALIDADE DE DIAGNÓSTICO E NÃO SUBSTITUI A CONSULTA MÉDICA\" (art. 81, § 2º, I, d).\u003c/p> \u003ch4>Técnica (DBHA 2025, Figura 3.1 e Quadro 3.1)\u003c/h4> \u003cul> \u003cli>Preparo: 30 minutos sem fumar, sem cafeína e sem comer; 90 minutos sem exercício; bexiga vazia.\u003c/li> \u003cli>Repouso de pelo menos 5 minutos, sentado, sem falar, costas apoiadas, pernas descruzadas e pés no chão.\u003c/li> \u003cli>Braço nu, apoiado na altura do coração, palma da mão para cima. Ambiente silencioso.\u003c/li> \u003cli>Manguito do tamanho do braço, sem folga, 2 a 3 cm acima da fossa cubital, com o centro da bolsa sobre a artéria braquial. Manguito pequeno superestima a PA.\u003c/li> \u003cli>Três medidas com 1 minuto de intervalo; usar a média das duas últimas. Se a diferença entre medidas passar de 10 mmHg, fazer medidas adicionais.\u003c/li> \u003cli>Preferir aparelho automático de braço validado. O de punho fica para quando a medida no braço é difícil, como em pessoas com obesidade e braço muito largo.\u003c/li> \u003c/ul> \u003cp>Na primeira aferição de um cliente, medir nos dois braços ajuda a escolher o braço de referência (o de maior valor). Registre data, hora, braço, valores e medicamentos em uso com o horário da última dose.\u003c/p> \u003ch4>Hipotensão ortostática\u003c/h4> \u003cp>Idosos, diabéticos com neuropatia e pessoas em uso de diurético, alfabloqueador ou vários anti-hipertensivos podem ter queda importante da PA ao ficar em pé. Se o cliente relata tontura ao levantar, o farmacêutico pode medir a PA sentado e de novo após 1 a 3 minutos em pé; queda relevante ou reprodução dos sintomas justifica encaminhamento, porque aumenta o risco de quedas e fraturas. A DBHA 2025 considera a hipotensão ortostática sintomática um motivo para começar com monoterapia e metas individualizadas.\u003c/p> \u003ch4>Quando encaminhar\u003c/h4> \u003cp>O resultado orienta o encaminhamento, nunca um diagnóstico ou uma troca de medicamento. A DBHA 2025 diferencia a \u003cstrong>emergência hipertensiva\u003c/strong> (PA muito elevada, em geral ≥ 180 e/ou 110 mmHg, com lesão aguda de órgão-alvo) da \"elevação importante da PA sem lesão aguda de órgão-alvo\", termo que substituiu \"urgência hipertensiva\". Nesse segundo caso, a diretriz sugere reavaliação ambulatorial em 1 a 7 dias.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>PA ≥ 180 e/ou 110 mmHg com dor no peito, falta de ar, fraqueza ou dormência de um lado do corpo, dificuldade para falar, confusão, alteração visual ou cefaleia súbita e intensa é emergência: acionar o SAMU (192) ou orientar ida imediata ao pronto-socorro. Não ofereça medicamento de outra pessoa nem \"remédio para baixar a pressão\" no balcão.\u003c/p>\u003c/div> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Pergunte se a pessoa já tem diagnóstico, quais medicamentos usa, se tomou a dose do dia e se tem sintomas. Sem diagnóstico e com média ≥ 140/90 mmHg: orientar consulta médica para confirmação, de preferência levando registros de medidas. Hipertenso em tratamento acima de 130/80 mmHg de forma repetida: reforçar adesão e técnica, e orientar levar o registro ao médico. PA baixa com tontura ou desmaio em quem usa anti-hipertensivo: encaminhar, porque pode haver excesso de dose ou desidratação. Gestante com PA ≥ 140/90 mmHg deve procurar o pré-natal no mesmo dia.\u003c/p>\u003c/div> \u003ch4>Medida em casa\u003c/h4> \u003cp>A DBHA 2025 valoriza a MRPA para confirmar diagnóstico e acompanhar o tratamento. O farmacêutico é quem mais vende aparelhos de pressão e pode ensinar o uso correto. Prefira aparelho automático de braço com validação clínica independente e manguito do tamanho do braço (a circunferência do braço deve caber na faixa impressa no manguito). Oriente a pessoa a medir sentada, após 5 minutos de repouso, sempre no mesmo braço, antes de tomar os remédios da manhã e antes do jantar, por alguns dias seguidos antes da consulta, anotando todos os valores, sem selecionar só os \"bons\". O médico define o protocolo exato; a farmácia ajuda com a técnica e o registro.\u003c/p> \u003cp>Erros comuns que o farmacêutico pode corrigir: medir logo depois de subir escada ou tomar café, conversar durante a medida, usar manguito pequeno em braço largo, medir sobre a roupa, repetir a medida até \"dar normal\" e trocar a dose do remédio conforme o número do dia.\u003c/p> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 52 anos, sem diagnóstico, pede para medir a pressão \"porque está com dor de cabeça\". Chegou a pé, apressado, e tomou café há 10 minutos. O farmacêutico pede que ele descanse, espera completar o intervalo e mede três vezes: 152/96, 146/92 e 144/90 mmHg. Média das duas últimas: 145/91 mmHg. Sem sinais de alarme, a conduta é registrar, entregar a declaração com a frase obrigatória e orientar consulta médica para confirmar o diagnóstico, sem indicar medicamento.\u003c/p>\u003c/div>"},{"id":"m04-ieca","titulo":"Inibidores da enzima conversora da angiotensina","resumo":"\u003cp>Os inibidores da enzima conversora da angiotensina (IECA) bloqueiam a ECA e reduzem a formação de angiotensina II. Com isso, as arteríolas relaxam, a aldosterona cai (menos retenção de sódio, mais retenção de potássio) e o efeito trófico da angiotensina II sobre coração, vasos e rim diminui. Como a mesma enzima degrada a bradicinina, os IECA aumentam a bradicinina, o que explica parte do efeito vasodilatador e também a tosse e o angioedema.\u003c/p> \u003cp>A DBHA 2025 coloca os IECA entre as classes preferenciais, junto com BRA, bloqueadores dos canais de cálcio e diuréticos tiazídicos. Eles têm benefício demonstrado na insuficiência cardíaca com fração de ejeção reduzida, no pós-infarto e na doença renal com proteinúria, onde reduzem a progressão da lesão renal.\u003c/p> \u003ch3>Fármacos e doses usuais\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose diária habitual (adulto)\u003c/th>\u003cth>Tomadas/dia\u003c/th>\u003cth>Observação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Captopril\u003c/td>\u003ctd>25 a 150 mg\u003c/td>\u003ctd>2 a 3\u003c/td>\u003ctd>Tomar 1 hora antes das refeições (bula)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Enalapril\u003c/td>\u003ctd>5 a 40 mg\u003c/td>\u003ctd>1 a 2\u003c/td>\u003ctd>Pró-fármaco; disponível no SUS\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Lisinopril\u003c/td>\u003ctd>10 a 40 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Não é pró-fármaco\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Ramipril\u003c/td>\u003ctd>2,5 a 20 mg\u003c/td>\u003ctd>1 a 2\u003c/td>\u003ctd>Muito usado em cardiopatas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Perindopril\u003c/td>\u003ctd>4 a 16 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Presente em associações em dose fixa\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Benazepril, fosinopril\u003c/td>\u003ctd>10 a 40 mg\u003c/td>\u003ctd>1 a 2\u003c/td>\u003ctd>Menos usados\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Doses conforme a DBHA 2025 (Quadro 7.4). O teto para HA pode variar entre a diretriz e a bula do produto (o ramipril, por exemplo, vai até 20 mg/dia na bula norte-americana, FDA 2025); vale a prescrição conferida com a bula do produto dispensado. O captopril tem meia-vida curta, por isso precisa de duas ou três tomadas; os demais permitem uma ou duas. A bula do captopril de referência orienta tomar o comprimido \u003cstrong>1 hora antes das refeições\u003c/strong>, porque o alimento reduz sua absorção. Para os outros IECA o alimento não interfere de forma relevante.\u003c/p> \u003ch3>Efeitos adversos que o farmacêutico precisa reconhecer\u003c/h3> \u003ch4>Tosse seca\u003c/h4> \u003cp>É o efeito adverso mais comum. Surge como tosse irritativa, sem catarro, que pode começar semanas ou meses após o início. Não responde a xarope e desaparece em dias a poucas semanas depois da suspensão. A solução é o médico trocar o IECA por um BRA, que não acumula bradicinina. No balcão, a pergunta \"o senhor começou algum remédio de pressão recentemente?\" evita vender antitussígeno para um efeito adverso.\u003c/p> \u003ch4>Angioedema\u003c/h4> \u003cp>Inchaço súbito de lábios, língua, face ou glote, sem coceira importante. É raro, mais frequente em pessoas negras, e pode aparecer a qualquer momento, inclusive depois de anos de uso. É mediado por bradicinina, por isso anti-histamínico tem pouco efeito. Com envolvimento de língua ou garganta, rouquidão ou falta de ar, é \u003cstrong>emergência\u003c/strong>. Quem teve angioedema com um IECA não deve usar nenhum outro IECA.\u003c/p> \u003ch4>Hipercalemia e piora da função renal\u003c/h4> \u003cp>Ao reduzir a aldosterona, o IECA retém potássio. O risco cresce na doença renal crônica, no diabetes, em idosos e com outros fármacos que retêm potássio: espironolactona, amilorida, suplementos de potássio, sal light (que contém cloreto de potássio), sulfametoxazol-trimetoprima e anti-inflamatórios não esteroides (AINE). A DBHA 2025 lembra que o IECA pode piorar a função renal no início, com estabilização posterior; o médico acompanha creatinina e potássio. O IECA é contraindicado na estenose bilateral de artéria renal ou em rim único com estenose, porque nesses casos a filtração depende da angiotensina II.\u003c/p> \u003ch4>Hipotensão da primeira dose\u003c/h4> \u003cp>Mais comum em quem já usa diurético, está desidratado ou tem insuficiência cardíaca. Orientar levantar devagar nos primeiros dias.\u003c/p> \u003ch3>Grupos com cuidado especial\u003c/h3> \u003cp>Em \u003cstrong>idosos\u003c/strong>, comece a observação pela hipotensão postural e pela função renal, que se altera com facilidade em desidratação. Na \u003cstrong>doença renal crônica\u003c/strong>, o IECA protege o rim, mas exige controle de potássio e creatinina, e os pacientes costumam receber dieta com restrição de potássio. No \u003cstrong>diabetes com albuminúria\u003c/strong>, IECA ou BRA fazem parte do tratamento mesmo quando a PA está controlada, porque reduzem a perda de albumina na urina. Na \u003cstrong>insuficiência cardíaca\u003c/strong>, a dose é aumentada aos poucos até a máxima tolerada, e o paciente precisa entender que tontura leve no início não significa que o remédio \"não serve\".\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>IECA (e BRA) são contraindicados na gravidez: no segundo e no terceiro trimestres causam lesão renal fetal, oligoidrâmnio e malformações. A DBHA 2025 orienta evitar o uso em mulheres em idade fértil; quando o IECA é usado, a mulher precisa conhecer o risco e planejar uma gestação com o médico. Mulher em uso de enalapril que conta que está grávida deve procurar o médico imediatamente, sem interromper por conta própria todo o tratamento da pressão.\u003c/p>\u003c/div> \u003ch3>Interações e associações\u003c/h3> \u003cul> \u003cli>\u003cstrong>IECA + BRA\u003c/strong>: contraindicado (DBHA 2025). A dupla aumenta hipercalemia, hipotensão e lesão renal sem reduzir eventos.\u003c/li> \u003cli>\u003cstrong>IECA + sacubitril/valsartana\u003c/strong>: não associar; a bula do sacubitril/valsartana exige intervalo de 36 horas após a última dose do IECA, pelo risco de angioedema.\u003c/li> \u003cli>\u003cstrong>IECA + espironolactona\u003c/strong>: usada de propósito na insuficiência cardíaca e em alguns casos de doença renal com proteinúria, mas exige controle de potássio.\u003c/li> \u003cli>\u003cstrong>IECA + AINE\u003c/strong>: menos efeito anti-hipertensivo e risco renal, principalmente com diurético junto (ver tópico de rim).\u003c/li> \u003cli>\u003cstrong>IECA + lítio\u003c/strong>: aumenta a litemia; exige monitoramento.\u003c/li> \u003c/ul> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar um IECA: explique o horário (captopril longe das refeições), que a tosse seca pode ser efeito do remédio e deve ser relatada ao médico, que inchaço de boca ou garganta exige pronto-socorro, que sal light e suplementos de potássio só com orientação médica, e que dor e febre devem ser tratadas preferencialmente com paracetamol ou dipirona em vez de AINE.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 61 anos pede \"um xarope forte\" para tosse seca há seis semanas, sem febre nem catarro. Usa enalapril 10 mg duas vezes ao dia, iniciado há dois meses. O farmacêutico não indica antitussígeno, explica a possível relação com o enalapril e orienta retorno ao médico para avaliar a troca para um BRA, registrando a suspeita de reação adversa.\u003c/p>\u003c/div>"},{"id":"m04-bra","titulo":"Bloqueadores do receptor de angiotensina","resumo":"\u003cp>Os bloqueadores do receptor AT1 da angiotensina II (BRA, também chamados de ARA II ou \"sartanas\") impedem que a angiotensina II se ligue ao receptor AT1. O resultado clínico é muito parecido com o do IECA: vasodilatação, redução da aldosterona e proteção de coração e rim. A diferença está no mecanismo: o BRA não inibe a ECA, então a bradicinina não se acumula. Por isso a tosse praticamente não ocorre, e ele é a alternativa natural para quem teve tosse com IECA.\u003c/p> \u003cp>A DBHA 2025 resume: os BRA têm \"mesmas informações, recomendações e efeitos colaterais dos IECAs, com exceção de tosse\" (Quadro 7.5). Na prática, valem as mesmas contraindicações (gestação, estenose bilateral de artéria renal), o mesmo cuidado com potássio e função renal e as mesmas interações.\u003c/p> \u003ch3>Fármacos e doses usuais\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose diária habitual (adulto)\u003c/th>\u003cth>Tomadas/dia\u003c/th>\u003cth>Particularidade\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Losartana\u003c/td>\u003ctd>50 a 100 mg\u003c/td>\u003ctd>1 a 2\u003c/td>\u003ctd>Disponível no SUS e no Farmácia Popular; efeito uricosúrico discreto\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Valsartana\u003c/td>\u003ctd>80 a 320 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Também associada ao sacubitril na insuficiência cardíaca\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Irbesartana\u003c/td>\u003ctd>150 a 300 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Estudos em nefropatia diabética\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Candesartana\u003c/td>\u003ctd>8 a 32 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Pró-fármaco\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Olmesartana\u003c/td>\u003ctd>20 a 40 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Raramente causa enteropatia com diarreia crônica\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Telmisartana\u003c/td>\u003ctd>20 a 80 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Meia-vida longa\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Doses conforme a DBHA 2025. A losartana tem meia-vida mais curta que as outras sartanas, o que explica o uso em uma ou duas tomadas. Ela também aumenta discretamente a excreção de ácido úrico, característica às vezes lembrada em quem tem gota. A olmesartana foi associada a uma enteropatia semelhante à doença celíaca, com diarreia crônica e perda de peso, que melhora com a suspensão; é rara, mas o farmacêutico deve lembrar dela quando um cliente em uso de olmesartana pede antidiarreico repetidamente.\u003c/p> \u003ch3>Por que não associar IECA e BRA\u003c/h3> \u003cp>Parece lógico bloquear o SRAA em dois pontos, mas os estudos mostraram o contrário. No ONTARGET, a combinação de telmisartana com ramipril não reduziu eventos cardiovasculares e aumentou hipotensão, hipercalemia e piora renal. A DBHA 2025 lista a associação de IECA com BRA como \u003cstrong>contraindicada\u003c/strong>. A mesma lógica vale para associar qualquer um deles ao alisquireno em diabéticos. Se aparecerem duas receitas, de médicos diferentes, com enalapril e losartana para o mesmo paciente, o farmacêutico deve identificar a duplicidade e contatar o prescritor.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>BRA e IECA são equivalentes em eficácia e proteção de órgãos; o BRA não dá tosse. Nunca os dois juntos. Os cuidados com gestação, potássio e função renal são os mesmos.\u003c/p>\u003c/div> \u003ch3>Associações em dose fixa\u003c/h3> \u003cp>Os BRA estão entre os fármacos com mais apresentações em dose fixa no Brasil: com hidroclorotiazida, com clortalidona, com anlodipino e em combinações triplas. Isso facilita a adesão, que a DBHA 2025 valoriza ao recomendar associação \"preferencialmente em comprimido único\". No balcão, o cuidado é evitar duplicidade: quem usa \"losartana + hidroclorotiazida\" não deve receber também hidroclorotiazida isolada sem que o prescritor tenha pedido isso de forma clara.\u003c/p> \u003ch3>Sacubitril/valsartana\u003c/h3> \u003cp>A associação de sacubitril (inibidor da neprilisina, enzima que degrada peptídeos natriuréticos) com valsartana é usada na insuficiência cardíaca com fração de ejeção reduzida. A DBHA 2025 registra que, embora tenha sido desenvolvida inicialmente para HA, faltam dados para indicá-la no tratamento rotineiro da hipertensão. No balcão, os pontos críticos são: não associar a IECA (risco de angioedema, com intervalo mínimo exigido em bula ao trocar), cuidado com potássio e função renal, e hipotensão sintomática no início.\u003c/p> \u003ch3>Qualidade e recolhimentos\u003c/h3> \u003cp>Desde 2018, agências reguladoras de vários países, incluindo a Anvisa, determinaram recolhimentos de lotes de sartanas por contaminação com nitrosaminas, impurezas com potencial carcinogênico formadas no processo de síntese. O farmacêutico deve acompanhar os comunicados de recolhimento da Anvisa, segregar os lotes atingidos e orientar o paciente a \u003cstrong>não interromper\u003c/strong> o tratamento por conta própria, procurando a troca do produto ou do lote.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar um BRA, pergunte se a pessoa já usa outro remédio de pressão \"terminado em -pril\" ou \"-sartana\", confira se a associação em dose fixa não está duplicando um diurético, oriente sobre sal light e potássio, e pergunte sobre gestação ou intenção de engravidar em mulheres em idade fértil. Diarreia persistente em uso de olmesartana merece encaminhamento.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhor de 70 anos apresenta duas receitas: uma do cardiologista com valsartana 160 mg e outra do clínico com captopril 25 mg duas vezes ao dia. Ele acha que \"um é para o coração e outro para a pressão\". O farmacêutico identifica IECA e BRA em uso simultâneo, explica ao paciente o risco, não dispensa as duas sem esclarecimento e contata um dos prescritores, registrando a intervenção.\u003c/p>\u003c/div>"},{"id":"m04-betabloq","titulo":"Betabloqueadores","resumo":"\u003cp>Os betabloqueadores (BB) bloqueiam receptores beta-adrenérgicos. O receptor beta-1 predomina no coração (frequência e força de contração) e nas células que liberam renina; o beta-2 predomina nos brônquios, nos vasos do músculo esquelético e no fígado (glicogenólise). Ao bloquear beta-1, o BB reduz frequência cardíaca, débito cardíaco e renina, o que baixa a PA e o consumo de oxigênio do miocárdio.\u003c/p> \u003cp>Na DBHA 2025, os BB continuam como opção para HA, mas em situações específicas: insuficiência cardíaca, fibrilação atrial e outras arritmias, doença arterial coronariana (angina, pós-infarto), pacientes em hemodiálise, enxaqueca, tremor essencial, varizes esofágicas e mulheres que desejam engravidar. Fora dessas indicações, eles entram como associação, não como primeira escolha.\u003c/p> \u003ch3>As três gerações\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Fármacos (dose diária habitual)\u003c/th>\u003cth>Característica\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>1ª geração, não seletivos\u003c/td>\u003ctd>Propranolol 80 a 320 mg (2 a 3 tomadas); nadolol 40 a 160 mg; pindolol 10 a 60 mg\u003c/td>\u003ctd>Bloqueiam beta-1 e beta-2: mais broncoespasmo e efeitos periféricos. Pindolol tem atividade simpatomimética intrínseca\u003c/td>\u003c/tr> \u003ctr>\u003ctd>2ª geração, cardiosseletivos\u003c/td>\u003ctd>Atenolol 50 a 100 mg; metoprolol 50 a 200 mg; bisoprolol 5 a 20 mg\u003c/td>\u003ctd>Preferência por beta-1; em doses altas a seletividade diminui\u003c/td>\u003c/tr> \u003ctr>\u003ctd>3ª geração, vasodilatadores\u003c/td>\u003ctd>Nebivolol 2,5 a 10 mg; carvedilol 6,25 a 50 mg (1 a 2 tomadas)\u003c/td>\u003ctd>Nebivolol: cardiosseletivo e libera óxido nítrico. Carvedilol: não seletivo com bloqueio alfa-1\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Doses conforme a DBHA 2025 (Quadro 7.6). O atenolol é eliminado pelo rim e precisa de ajuste na doença renal; o metoprolol e o carvedilol são metabolizados no fígado. Na insuficiência cardíaca com fração de ejeção reduzida, os BB com benefício comprovado são carvedilol, bisoprolol e succinato de metoprolol, iniciados em dose baixa e aumentados aos poucos.\u003c/p> \u003ch3>Succinato e tartarato de metoprolol\u003c/h3> \u003cp>Os dois sais existem no Brasil e \u003cstrong>não são intercambiáveis\u003c/strong> automaticamente. O \u003cstrong>succinato\u003c/strong> é de liberação prolongada (Selozok®), tomado uma vez ao dia; a bula indica 50 mg ao dia na HA, podendo chegar a 100 a 200 mg, e na insuficiência cardíaca começa com 25 mg (ou metade disso nas classes funcionais III e IV) e dobra a cada duas semanas. O \u003cstrong>tartarato\u003c/strong> é de liberação imediata e costuma exigir duas tomadas. A forma de liberação prolongada não deve ser mastigada nem triturada; se o comprimido tiver sulco, a bula informa se pode ser partido. A troca entre sais é decisão do prescritor.\u003c/p> \u003ch3>Contraindicações e situações de cuidado\u003c/h3> \u003cul> \u003cli>\u003cstrong>Asma e DPOC\u003c/strong>: a DBHA 2025 contraindica BB na broncopatia grave ou descompensada. Os não seletivos (propranolol, nadolol, carvedilol) são os mais perigosos para asmáticos, inclusive em colírio (timolol). Na DPOC, cardiosseletivos costumam ser tolerados e não devem ser negados a quem tem indicação cardíaca forte.\u003c/li> \u003cli>\u003cstrong>Bradicardia e bloqueios\u003c/strong>: frequência cardíaca abaixo de 50 bpm, bloqueio sinoatrial ou atrioventricular contraindicam.\u003c/li> \u003cli>\u003cstrong>Doença arterial periférica\u003c/strong>: evitar, exceto os de ação vasodilatadora.\u003c/li> \u003cli>\u003cstrong>Diabetes\u003c/strong>: o BB mascara tremor, palpitação e taquicardia da hipoglicemia. A sudorese continua presente e passa a ser o principal sinal de alerta. Os não seletivos ainda prolongam a recuperação da hipoglicemia, porque o beta-2 participa da liberação hepática de glicose.\u003c/li> \u003cli>\u003cstrong>Feocromocitoma e uso de cocaína\u003c/strong>: BB isolado pode piorar a hipertensão por deixar o efeito alfa sem oposição; situação de serviço médico.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>A retirada abrupta do betabloqueador pode causar taquicardia, piora de angina, arritmia e até infarto em coronariopatas, por hipersensibilidade dos receptores. Quem ficou sem o remédio não deve \"dar uma pausa\". A suspensão é gradual e orientada pelo médico. Na falta do medicamento, o farmacêutico deve ajudar a garantir a continuidade (receita válida, Farmácia Popular, unidade de saúde).\u003c/p>\u003c/div> \u003ch3>Efeitos adversos comuns\u003c/h3> \u003cp>Cansaço, intolerância ao exercício, extremidades frias, bradicardia, tontura, disfunção erétil, distúrbios do sono e pesadelos (mais com os lipofílicos, como propranolol). O carvedilol, por bloquear alfa-1, causa mais hipotensão postural; sua bula orienta tomá-lo com alimento. Os BB podem elevar discretamente glicemia e triglicerídeos, efeito menor com nebivolol e carvedilol.\u003c/p> \u003ch3>Interações importantes\u003c/h3> \u003cul> \u003cli>Verapamil e diltiazem: somam bradicardia e bloqueio atrioventricular (DBHA 2025 recomenda evitar a associação).\u003c/li> \u003cli>Clonidina: se o paciente usa os dois, a clonidina não deve ser retirada antes do BB, pelo risco de crise hipertensiva por rebote.\u003c/li> \u003cli>Insulina e sulfonilureias: hipoglicemia menos percebida.\u003c/li> \u003cli>Agonistas beta-2 (salbutamol, formoterol): efeito antagonizado pelos não seletivos.\u003c/li> \u003cli>Descongestionantes nasais sistêmicos e anti-inflamatórios: podem elevar a PA e reduzir o efeito anti-hipertensivo.\u003c/li> \u003c/ul> \u003ch3>Usos fora da hipertensão\u003c/h3> \u003cp>Propranolol e atenolol aparecem com frequência em receitas para enxaqueca (profilaxia), tremor essencial, ansiedade com sintomas físicos, hipertireoidismo (controle de taquicardia e tremor até o antitireoidiano agir) e hipertensão portal. Todos são de venda sob prescrição. Pedidos de \"remédio para tremedeira antes da prova\" ou \"para o coração acelerado\" sem receita devem ser recusados, com explicação dos riscos, sobretudo em asmáticos e diabéticos. Colírios de timolol, usados no glaucoma, também são absorvidos e podem causar broncoespasmo e bradicardia; pergunte sobre eles ao revisar a farmacoterapia de um asmático.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Pergunte se a pessoa tem asma ou \"chiado no peito\", se tem diabetes e usa insulina ou glibenclamida, e se já sentiu pulso muito lento ou desmaio. Oriente não interromper de repente, conferir o pulso quando houver tontura e informar ao médico cansaço excessivo. Asmático com receita de propranolol para enxaqueca ou ansiedade merece contato com o prescritor.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Rapaz de 24 anos, asmático em uso de budesonida/formoterol, traz receita de propranolol 40 mg duas vezes ao dia para tremor antes de apresentações. O farmacêutico identifica o risco de broncoespasmo com BB não seletivo, contata o prescritor e registra a intervenção; a decisão de troca ou de manter com vigilância é médica.\u003c/p>\u003c/div>"},{"id":"m04-bcc","titulo":"Bloqueadores dos canais de cálcio","resumo":"\u003cp>Os bloqueadores dos canais de cálcio (BCC) impedem a entrada de cálcio pelos canais do tipo L nas células musculares lisas dos vasos e, conforme o grupo, também nas células do coração. Menos cálcio dentro da célula significa menos contração: as arteríolas relaxam e a resistência periférica cai. A DBHA 2025 destaca que todos reduzem a PA de forma semelhante em doses equipotentes e se associam bem com outras classes.\u003c/p> \u003cp>A divisão que importa no balcão é entre os \u003cstrong>di-hidropiridínicos\u003c/strong>, que agem quase só nos vasos, e os \u003cstrong>não di-hidropiridínicos\u003c/strong> (verapamil e diltiazem), que agem também no nó sinusal e no nó atrioventricular, reduzindo frequência cardíaca e condução.\u003c/p> \u003ch3>Di-hidropiridínicos\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose diária habitual\u003c/th>\u003cth>Tomadas/dia\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Anlodipino\u003c/td>\u003ctd>2,5 a 10 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Levanlodipino\u003c/td>\u003ctd>2,5 a 5 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Nifedipino\u003c/td>\u003ctd>10 a 60 mg\u003c/td>\u003ctd>1 a 3 (conforme a formulação)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Felodipino\u003c/td>\u003ctd>2,5 a 10 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Lercanidipino\u003c/td>\u003ctd>10 a 20 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Manidipino\u003c/td>\u003ctd>10 a 20 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Nitrendipino\u003c/td>\u003ctd>10 a 30 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Lacidipino\u003c/td>\u003ctd>2 a 6 mg\u003c/td>\u003ctd>1\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Doses conforme a DBHA 2025 (Quadro 7.3). O \u003cstrong>anlodipino\u003c/strong> é o mais usado: meia-vida longa, uma tomada diária, disponível no SUS. O levanlodipino é o enantiômero ativo do anlodipino, por isso a dose é a metade.\u003c/p> \u003cp>O \u003cstrong>nifedipino\u003c/strong> merece atenção à formulação. Na HA crônica usam-se as formas de liberação prolongada (retard ou de liberação controlada), que não podem ser partidas, mastigadas ou trituradas. A cápsula de liberação imediata causa queda brusca de PA e taquicardia reflexa e não é usada para tratar HA crônica. Na gestação, a DBHA 2025 cita a nifedipina de ação prolongada entre as opções de primeira linha.\u003c/p> \u003ch4>Efeitos adversos\u003c/h4> \u003cul> \u003cli>\u003cstrong>Edema maleolar\u003c/strong>: inchaço de tornozelos, dependente da dose, causado por dilatação arteriolar sem dilatação venosa correspondente. Não é retenção de sódio, por isso responde mal a diurético. A DBHA 2025 observa que melhora com associação a IECA ou BRA, que dilatam o lado venoso.\u003c/li> \u003cli>Cefaleia, rubor facial, calor, palpitação e taquicardia reflexa (mais com os de ação curta).\u003c/li> \u003cli>Hiperplasia gengival, principalmente com nifedipino; higiene oral ajuda.\u003c/li> \u003c/ul> \u003cp>A DBHA 2025 recomenda evitar di-hidropiridínicos na insuficiência cardíaca com fração de ejeção reduzida e em taquiarritmias.\u003c/p> \u003ch3>Não di-hidropiridínicos\u003c/h3> \u003cp>\u003cstrong>Verapamil\u003c/strong> (120 a 360 mg/dia, 1 a 2 tomadas na forma de liberação prolongada) e \u003cstrong>diltiazem\u003c/strong> (80 a 240 mg/dia, 1 a 2 tomadas) são pouco usados hoje para HA isolada. O uso principal é controlar frequência na fibrilação atrial e tratar angina quando o BB não pode ser usado. Efeitos: bradicardia, bloqueio atrioventricular, piora de insuficiência cardíaca e constipação intestinal (típica do verapamil). Não devem ser associados a BB nem usados com frequência cardíaca abaixo de 50 bpm ou na insuficiência cardíaca com fração de ejeção reduzida (DBHA 2025).\u003c/p> \u003ch3>Outros usos\u003c/h3> \u003cp>Os BCC também tratam angina estável, porque dilatam as coronárias e, no caso de verapamil e diltiazem, reduzem o consumo de oxigênio do coração. O nifedipino de liberação prolongada é usado na gestação e, por indicação médica, como tocolítico em ambiente hospitalar. Pomadas de diltiazem manipuladas são usadas na fissura anal, e o anlodipino tem uso no fenômeno de Raynaud. São indicações que o farmacêutico encontra em receitas e precisa reconhecer para não estranhar a prescrição em pessoa sem hipertensão.\u003c/p> \u003ch3>Interações pelo CYP3A4\u003c/h3> \u003cp>Todos os BCC são metabolizados pelo CYP3A4, e verapamil e diltiazem também \u003cstrong>inibem\u003c/strong> essa enzima. Isso gera interações frequentes no balcão:\u003c/p> \u003cul> \u003cli>\u003cstrong>Sinvastatina\u003c/strong>: verapamil, diltiazem e anlodipino aumentam a exposição à sinvastatina e o risco de miopatia e rabdomiólise; a bula da sinvastatina lista os três entre as interações relevantes. A FDA limitou a sinvastatina a 10 mg/dia com verapamil ou diltiazem e a 20 mg/dia com anlodipino. Alternativas como atorvastatina em dose ajustada ou rosuvastatina são decisão do prescritor.\u003c/li> \u003cli>\u003cstrong>Inibidores fortes do CYP3A4\u003c/strong> (claritromicina, cetoconazol, itraconazol, ritonavir): aumentam o efeito do BCC, com hipotensão e edema.\u003c/li> \u003cli>\u003cstrong>Indutores\u003c/strong> (rifampicina, carbamazepina, fenitoína, erva-de-são-joão): reduzem o efeito.\u003c/li> \u003cli>\u003cstrong>Suco de toranja (grapefruit)\u003c/strong>: aumenta a exposição a felodipino e nifedipino.\u003c/li> \u003cli>Verapamil e diltiazem elevam os níveis de digoxina, ciclosporina e alguns anticoagulantes diretos.\u003c/li> \u003c/ul> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Di-hidropiridínico: vaso; dá edema de tornozelo e cefaleia. Verapamil e diltiazem: coração; dão bradicardia e não combinam com betabloqueador. Os três mais vendidos (anlodipino, verapamil, diltiazem) limitam a dose de sinvastatina.\u003c/p>\u003c/div> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Cliente com tornozelos inchados pedindo diurético \"para desinchar\" deve ser perguntado sobre anlodipino ou nifedipino. Explique que diurético não resolve esse edema e oriente levar a queixa ao médico, que pode reduzir a dose ou associar IECA ou BRA. Ao dispensar sinvastatina, confira se a pessoa usa algum BCC e qual a dose da estatina. Oriente engolir inteiros os comprimidos de liberação prolongada.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhora de 68 anos, em uso de diltiazem 180 mg/dia para fibrilação atrial, traz nova receita de sinvastatina 40 mg. O farmacêutico identifica a interação (limite de 10 mg/dia de sinvastatina com diltiazem, segundo a FDA), entra em contato com o prescritor e registra a sugestão de ajuste ou troca da estatina.\u003c/p>\u003c/div>"},{"id":"m04-diureticos","titulo":"Diuréticos","resumo":"\u003cp>Diuréticos aumentam a eliminação de sódio e água pelo rim. Cada classe age em um segmento do néfron, e o local de ação explica a potência, os distúrbios eletrolíticos e o uso clínico. Na HA, o efeito inicial vem da perda de volume; com o tempo, a resistência vascular periférica também cai, e é esse efeito tardio que mantém a PA controlada.\u003c/p> \u003ch3>O néfron em quatro paradas\u003c/h3> \u003col> \u003cli>\u003cstrong>Túbulo proximal\u003c/strong>: reabsorve cerca de dois terços do sódio filtrado, em parte trocado por hidrogênio com ajuda da anidrase carbônica. Aqui age a acetazolamida.\u003c/li> \u003cli>\u003cstrong>Alça de Henle, ramo ascendente espesso\u003c/strong>: cotransportador Na-K-2Cl. Aqui agem os diuréticos de alça, os mais potentes.\u003c/li> \u003cli>\u003cstrong>Túbulo contornado distal\u003c/strong>: cotransportador Na-Cl. Aqui agem os tiazídicos e análogos.\u003c/li> \u003cli>\u003cstrong>Ducto coletor\u003c/strong>: canal de sódio (ENaC) controlado pela aldosterona, que troca sódio por potássio. Aqui agem os poupadores de potássio.\u003c/li> \u003c/ol> \u003cp>Um ponto de fisiologia explica por que tiazídicos e diuréticos de alça espoliam potássio: eles fazem chegar mais sódio ao ducto coletor, onde parte é trocada por potássio, que vai embora na urina. Os poupadores bloqueiam justamente essa troca.\u003c/p> \u003ch3>Tiazídicos e análogos\u003c/h3> \u003cp>São os diuréticos da HA. A DBHA 2025 lista: \u003cstrong>hidroclorotiazida\u003c/strong> até 50 mg/dia (no SUS, 25 a 50 mg em uma tomada; na prática, 12,5 a 25 mg em associações), \u003cstrong>clortalidona\u003c/strong> 12,5 a 25 mg/dia e \u003cstrong>indapamida\u003c/strong> de liberação prolongada 1,5 a 3 mg/dia, todos em uma tomada. Doses maiores aumentam os efeitos metabólicos sem acrescentar efeito anti-hipertensivo relevante. Clortalidona e indapamida têm ação mais longa, e a diretriz recomenda trocar a hidroclorotiazida por uma delas quando a PA não controla com três classes.\u003c/p> \u003cp>Efeitos adversos e alertas:\u003c/p> \u003cul> \u003cli>\u003cstrong>Hipocalemia\u003c/strong> e hipomagnesemia: cãibras, fraqueza, arritmias; perigosas em quem usa digoxina.\u003c/li> \u003cli>\u003cstrong>Hiponatremia\u003c/strong>: principal risco em idosas magras; confusão, quedas, sonolência.\u003c/li> \u003cli>\u003cstrong>Hiperuricemia\u003c/strong>: pode desencadear crise de gota; a DBHA 2025 contraindica na gota ativa.\u003c/li> \u003cli>Hiperglicemia e aumento de lipídios, dose-dependentes.\u003c/li> \u003cli>Hipercalcemia leve (reduzem a excreção urinária de cálcio, efeito útil em litíase cálcica).\u003c/li> \u003cli>Fotossensibilidade e reações em quem tem alergia a sulfonamidas (estrutura semelhante).\u003c/li> \u003cli>Aumento da litemia em quem usa lítio.\u003c/li> \u003c/ul> \u003cp>Na doença renal crônica avançada, os tiazídicos perdem eficácia, e a diretriz considera clortalidona e diurético de alça nesse cenário.\u003c/p> \u003ch3>Diuréticos de alça\u003c/h3> \u003cp>\u003cstrong>Furosemida\u003c/strong> (20 a 240 mg/dia, 1 a 3 tomadas, DBHA 2025) e \u003cstrong>bumetanida\u003c/strong> são indicados em estados edematosos: insuficiência cardíaca, doença renal crônica, síndrome nefrótica e cirrose (associados à espironolactona). Na HA sem edema não são primeira escolha, porque o efeito é curto e intenso. Efeitos: desidratação, hipotensão, hipocalemia, hipomagnesemia, hiperuricemia, alcalose metabólica e ototoxicidade em doses altas intravenosas ou com aminoglicosídeos. Ao contrário dos tiazídicos, aumentam a excreção de cálcio.\u003c/p> \u003ch3>Poupadores de potássio\u003c/h3> \u003cul> \u003cli>\u003cstrong>Espironolactona\u003c/strong> (25 a 100 mg/dia): antagonista do receptor mineralocorticoide. É o quarto fármaco na HA resistente (DBHA 2025, recomendação forte), tem papel na insuficiência cardíaca, no hiperaldosteronismo e na ascite. Efeitos: hipercalemia (sobretudo com IECA ou BRA e na doença renal), ginecomastia, mastalgia, redução de libido e irregularidade menstrual.\u003c/li> \u003cli>\u003cstrong>Eplerenona\u003c/strong> (25 a 100 mg/dia): mais seletiva, sem efeitos hormonais; mesma hipercalemia.\u003c/li> \u003cli>\u003cstrong>Amilorida\u003c/strong> (2,5 a 5 mg/dia): bloqueia o ENaC; no Brasil aparece associada a tiazídico.\u003c/li> \u003c/ul> \u003ch3>Inibidores da anidrase carbônica e osmóticos\u003c/h3> \u003cp>A \u003cstrong>acetazolamida\u003c/strong> (Diamox®) tem efeito diurético fraco e não é anti-hipertensivo. Usos: glaucoma (250 mg a 1 g/dia), prevenção do mal agudo da montanha (500 mg a 1 g/dia, segundo a bula) e algumas formas de epilepsia. Causa acidose metabólica, parestesias de extremidades, gosto metálico em bebidas gaseificadas e litíase. É uma sulfonamida.\u003c/p> \u003cp>O \u003cstrong>manitol\u003c/strong> é um diurético osmótico de uso intravenoso hospitalar: filtrado e não reabsorvido, puxa água para a urina. É usado na hipertensão intracraniana e no glaucoma agudo; não tem lugar na farmácia comercial.\u003c/p> \u003ch3>Como reconhecer os distúrbios mais comuns\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Distúrbio\u003c/th>\u003cth>Quem tem mais risco\u003c/th>\u003cth>Sinais que o cliente relata\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Hipocalemia\u003c/td>\u003ctd>Tiazídico ou alça em dose alta, diarreia, uso de laxantes\u003c/td>\u003ctd>Cãibras, fraqueza, palpitação, constipação\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Hipercalemia\u003c/td>\u003ctd>Espironolactona ou amilorida com IECA/BRA, DRC, diabetes\u003c/td>\u003ctd>Fraqueza, formigamento, palpitação; muitas vezes nenhum sintoma\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Hiponatremia\u003c/td>\u003ctd>Idosos com tiazídico, uso associado de antidepressivos\u003c/td>\u003ctd>Confusão, sonolência, náusea, quedas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Desidratação\u003c/td>\u003ctd>Diurético de alça, calor, vômitos, idosos com pouca ingestão de água\u003c/td>\u003ctd>Tontura ao levantar, boca seca, urina escura e escassa\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Crise de gota\u003c/td>\u003ctd>Tiazídico ou alça em quem já tem ácido úrico alto\u003c/td>\u003ctd>Dor intensa, vermelhidão e inchaço em uma articulação, típica no dedão do pé\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Diuréticos estão na lista de substâncias proibidas no esporte, porque podem mascarar outras substâncias na urina e provocar perda rápida de peso para competições por categoria. Atletas federados devem consultar o médico do esporte antes de usar qualquer diurético, inclusive em associações anti-hipertensivas.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Diurético não é emagrecedor. O peso perdido é água e volta em dias, com risco de desidratação, hipocalemia, arritmia e lesão renal. Pedido de furosemida \"para desinchar\" ou \"para perder peso\" sem receita deve ser recusado, com orientação. Furosemida e hidroclorotiazida são de venda sob prescrição.\u003c/p>\u003c/div> \u003ch3>Horário de tomada\u003c/h3> \u003cp>A DBHA 2025 informa que anti-hipertensivos podem ser tomados pela manhã ou à noite com eficácia semelhante. Para diuréticos, porém, a tomada pela manhã evita acordar à noite para urinar (noctúria), que atrapalha o sono e aumenta o risco de queda em idosos. Quando a furosemida é prescrita em duas tomadas, a segunda costuma ficar no início da tarde. Quem vai sair de casa por muitas horas pode combinar com o médico o melhor horário.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar um diurético: oriente tomar pela manhã, levantar devagar, beber água conforme orientação médica (há pacientes com restrição hídrica na insuficiência cardíaca), não usar sal light ou suplemento de potássio com espironolactona sem orientação, procurar atendimento se houver cãibras intensas, fraqueza, palpitação ou confusão, e evitar AINE. Em vômitos ou diarreia intensos, o diurético pode precisar de suspensão temporária; essa decisão deve ser orientada pelo médico.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Idosa de 82 anos, em uso de hidroclorotiazida 25 mg e sertralina, é trazida pela filha porque está \"confusa e sonolenta há dois dias\". O farmacêutico reconhece risco de hiponatremia (tiazídico, idade, inibidor seletivo da recaptação de serotonina) e orienta avaliação médica no mesmo dia, sem sugerir suspensão por conta própria.\u003c/p>\u003c/div>"},{"id":"m04-associacoes","titulo":"Associações e escolha do anti-hipertensivo","resumo":"\u003cp>A escolha do anti-hipertensivo é decisão médica, mas o farmacêutico precisa entender a lógica para reconhecer prescrições coerentes, duplicidades e associações perigosas. A DBHA 2025 organiza o tratamento em torno de três ideias: classes preferenciais, associação desde o início para a maioria e comprimido único sempre que possível.\u003c/p> \u003ch3>Classes preferenciais e o octeto do tratamento\u003c/h3> \u003cp>As classes preferenciais para tratar HA e reduzir eventos cardiovasculares e renais são: \u003cstrong>diuréticos tiazídicos ou similares, IECA ou BRA e BCC\u003c/strong> (recomendação forte, certeza alta). O BB entra na base quando há indicação específica (angina, pós-infarto, insuficiência cardíaca, arritmias, fibrilação atrial, diálise, mulher que deseja engravidar). A diretriz representa isso como um \"octeto\": mudanças de estilo de vida na base, depois as classes preferenciais, depois espironolactona e, no topo, os fármacos menos usados (simpatolíticos centrais, alfabloqueadores e vasodilatadores diretos).\u003c/p> \u003ch3>Monoterapia ou associação\u003c/h3> \u003cp>Para a maioria dos hipertensos, a DBHA 2025 recomenda iniciar com \u003cstrong>associação dupla em doses baixas, preferencialmente em comprimido único\u003c/strong>: IECA ou BRA combinado com BCC ou com diurético tiazídico. A monoterapia fica reservada para:\u003c/p> \u003cul> \u003cli>pré-hipertensão (130 a 139/80 a 89 mmHg) com alto risco cardiovascular;\u003c/li> \u003cli>HA estágio 1 de baixo risco (a critério médico, pode ser associação);\u003c/li> \u003cli>pessoas frágeis, muito idosas (80 anos ou mais) ou com hipotensão ortostática sintomática.\u003c/li> \u003c/ul> \u003cp>Se a meta não for atingida com duas classes, o passo seguinte é a associação tripla (IECA ou BRA + BCC + tiazídico). Persistindo acima da meta com as três em doses adequadas, configura-se HA resistente, e o quarto fármaco recomendado é a \u003cstrong>espironolactona\u003c/strong> (ou eplerenona se houver intolerância). A diretriz reforça rever o paciente a cada 4 semanas até atingir a meta, verificar adesão sempre e combater a inércia terapêutica.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Sequência típica: IECA/BRA + BCC ou tiazídico (comprimido único) → tripla IECA/BRA + BCC + tiazídico → espironolactona. Betabloqueador quando há indicação cardíaca específica.\u003c/p>\u003c/div> \u003ch3>Por que a dose fixa ajuda\u003c/h3> \u003cp>Cada comprimido a mais reduz a adesão. A associação em dose fixa soma mecanismos complementares (por exemplo, o IECA ou BRA reduz o edema do anlodipino e a perda de potássio do tiazídico), permite doses menores de cada componente e simplifica a rotina. O lado negativo é a menor flexibilidade de ajuste e o risco de duplicidade quando o paciente recebe a associação e também um componente isolado.\u003c/p> \u003ch3>O que não associar\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Associação\u003c/th>\u003cth>Problema\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>IECA + BRA\u003c/td>\u003ctd>Contraindicada: hipercalemia, hipotensão e lesão renal sem benefício\u003c/td>\u003c/tr> \u003ctr>\u003ctd>IECA ou BRA + alisquireno no diabético\u003c/td>\u003ctd>Mesmo problema do duplo bloqueio\u003c/td>\u003c/tr> \u003ctr>\u003ctd>BB + verapamil ou diltiazem\u003c/td>\u003ctd>Bradicardia e bloqueio atrioventricular\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dois fármacos da mesma classe\u003c/td>\u003ctd>Duplicidade (ex.: anlodipino + nifedipino; dose fixa + componente isolado)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Espironolactona + suplemento de potássio ou sal light\u003c/td>\u003ctd>Hipercalemia, principalmente com IECA/BRA e doença renal\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Clonidina suspensa antes do BB\u003c/td>\u003ctd>Crise hipertensiva por rebote\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Outras classes\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose diária habitual\u003c/th>\u003cth>Uso principal\u003c/th>\u003cth>Cuidado marcante\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Clonidina\u003c/td>\u003ctd>0,2 a 0,9 mg em 2 a 3 tomadas\u003c/td>\u003ctd>HA resistente; intolerância à espironolactona\u003c/td>\u003ctd>Rebote grave se suspensa de repente; boca seca, sonolência\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Metildopa\u003c/td>\u003ctd>500 mg a 2 g em 2 tomadas\u003c/td>\u003ctd>HA na gestação (praticamente a única indicação)\u003c/td>\u003ctd>Sonolência; hepatite e anemia hemolítica raras\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Hidralazina\u003c/td>\u003ctd>50 a 200 mg em 2 a 3 tomadas\u003c/td>\u003ctd>HA resistente; gestação\u003c/td>\u003ctd>Taquicardia reflexa, retenção de sódio; síndrome lúpus-like em dose alta. Não usar isolada\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Minoxidil oral\u003c/td>\u003ctd>5 a 40 mg em 1 tomada\u003c/td>\u003ctd>HA refratária\u003c/td>\u003ctd>Hirsutismo, retenção hídrica; proibido na gestação\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Doxazosina\u003c/td>\u003ctd>1 a 16 mg em 1 tomada\u003c/td>\u003ctd>Associação; hiperplasia prostática\u003c/td>\u003ctd>Hipotensão na primeira dose: iniciar ao deitar\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Prazosina\u003c/td>\u003ctd>1 a 20 mg em 2 a 3 tomadas\u003c/td>\u003ctd>Associação\u003c/td>\u003ctd>Hipotensão postural; aumentar a cada 2 dias\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Doses conforme a DBHA 2025 (Quadro 7.7). Na gestação, a diretriz recomenda iniciar com metildopa ou BCC di-hidropiridínico (nifedipina de ação prolongada ou anlodipino); IECA e BRA são formalmente contraindicados, assim como o atenolol e os antagonistas mineralocorticoides, como a espironolactona (DBHA 2025, cap. 10).\u003c/p> \u003ch3>SUS e Farmácia Popular\u003c/h3> \u003cp>A DBHA 2025 traz, pela primeira vez, um capítulo sobre a HA no SUS. O Quadro 14.8 lista no Programa Farmácia Popular: captopril 25 mg, enalapril 10 mg, losartana 50 mg, hidroclorotiazida 25 mg, espironolactona 25 mg, furosemida 40 mg, atenolol 25 mg, propranolol 40 mg e succinato de metoprolol 25 mg. No componente básico da assistência farmacêutica aparecem também anlodipino, nifedipino, verapamil, metildopa, hidralazina, doxazosina e outras apresentações. O elenco e as regras de dispensação mudam: consulte as normas vigentes do programa antes de orientar o cliente.\u003c/p> \u003ch3>Adesão: onde o farmacêutico mais contribui\u003c/h3> \u003cp>A HA quase não dá sintomas, e muitas pessoas tomam o remédio só \"quando a pressão sobe\" ou abandonam o tratamento ao sentir um efeito adverso. A DBHA 2025 inclui a verificação de adesão em toda revisão. No balcão, o farmacêutico pode perguntar de forma aberta e sem julgamento (\"quantas vezes nesta semana o senhor esqueceu algum comprimido?\"), conferir a data da última compra em relação à quantidade dispensada, simplificar horários junto com o prescritor, sugerir associação em dose fixa quando houver mais de um comprimido da mesma combinação e orientar o uso de alarmes ou organizadores. Efeitos adversos relatados devem ser registrados e comunicados, e casos graves notificados à Anvisa pelo sistema de farmacovigilância.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Peça ao hipertenso a lista de todos os remédios, inclusive os de outros médicos e os comprados sem receita. Procure duplicidade de classe e combinações proibidas. Pergunte sobre efeitos que levam ao abandono: tosse (IECA), tornozelo inchado (BCC), cansaço (BB), urinar à noite (diurético). Ofereça organizador de doses ou tabela de horários quando houver três ou mais comprimidos.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Paciente de 59 anos usa \"losartana 50 mg + hidroclorotiazida 12,5 mg\" e anlodipino 5 mg, com PA 148/92 mmHg nas medidas da farmácia por três visitas. Relata que toma o anlodipino só quando \"sente a pressão alta\". O farmacêutico corrige o uso intermitente, explica que o tratamento é contínuo, combina horário fixo e orienta retorno ao médico com o registro das medidas, que pode avaliar trocar a hidroclorotiazida por clortalidona ou ajustar doses.\u003c/p>\u003c/div>"},{"id":"m04-rim","titulo":"Rim e medicamentos no balcão","resumo":"\u003cp>O rim filtra o sangue, elimina fármacos e seus metabólitos, regula água, sódio, potássio e ácido-base e produz eritropoetina e a forma ativa da vitamina D. A doença renal crônica (DRC) é silenciosa nas fases iniciais e muito ligada a HA e diabetes, justamente o público que mais frequenta a farmácia. Muitos medicamentos de uso corrente pioram a função renal ou se acumulam quando ela está reduzida.\u003c/p> \u003ch3>Como estimar a função renal\u003c/h3> \u003cp>A medida usada na prática é a \u003cstrong>taxa de filtração glomerular estimada (TFGe)\u003c/strong>, calculada a partir da creatinina sérica, idade e sexo. A equação padrão atual é a \u003cstrong>CKD-EPI 2021\u003c/strong>, que retirou o coeficiente racial das versões anteriores. Os laboratórios geralmente já informam a TFGe no laudo. A fórmula de Cockcroft-Gault, que estima a depuração de creatinina (ClCr) a partir do peso, não é o padrão. Algumas bulas antigas ainda ajustam a dose por ClCr; nesses casos, o ajuste é decidido pelo prescritor com o dado disponível, e a referência para classificar a função renal continua sendo a TFGe por CKD-EPI 2021.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Categoria\u003c/th>\u003cth>TFGe (mL/min/1,73 m²)\u003c/th>\u003cth>Descrição\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>G1\u003c/td>\u003ctd>≥ 90\u003c/td>\u003ctd>Normal ou alta (DRC só se houver outro marcador de lesão)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>G2\u003c/td>\u003ctd>60 a 89\u003c/td>\u003ctd>Levemente reduzida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>G3a\u003c/td>\u003ctd>45 a 59\u003c/td>\u003ctd>Leve a moderadamente reduzida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>G3b\u003c/td>\u003ctd>30 a 44\u003c/td>\u003ctd>Moderada a gravemente reduzida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>G4\u003c/td>\u003ctd>15 a 29\u003c/td>\u003ctd>Gravemente reduzida\u003c/td>\u003c/tr> \u003ctr>\u003ctd>G5\u003c/td>\u003ctd>&lt; 15\u003c/td>\u003ctd>Falência renal\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Classificação KDIGO. A DRC é definida por alteração de estrutura ou função renal por mais de 3 meses: TFGe abaixo de 60 ou marcador de lesão, como albuminúria (relação albumina/creatinina na urina ≥ 30 mg/g).\u003c/p> \u003ch3>Nefrotóxicos de balcão\u003c/h3> \u003cp>Os \u003cstrong>anti-inflamatórios não esteroides\u003c/strong> (ibuprofeno, naproxeno, diclofenaco, nimesulida, cetoprofeno, inibidores seletivos da COX-2) são os principais. Eles inibem prostaglandinas que mantêm a arteríola aferente dilatada. Em rim saudável e hidratado isso pouco importa; em idosos, desidratados, cardiopatas, cirróticos ou com DRC, a filtração cai e pode haver lesão renal aguda. Os AINE também retê

ato","4 h antes ou 8 h depois","Bula FDA do moxifloxacino (2024)"],["Tetraciclina","Leite e derivados; antiácidos, cálcio, ferro, magnésio","Leite: 1 a 2 h antes ou depois; antiácidos e minerais: 1 a 3 h","Bulas brasileiras de cloridrato de tetraciclina"],["Doxiciclina","Antiácidos, ferro, cálcio","Não tomar junto; separar algumas horas","Bula FDA da doxiciclina"],["Alendronato, risedronato","Alimento, bebida e outros medicamentos","Água pura, 30 min antes; sem deitar","Bula FDA do alendronato"],["Ibandronato oral","Alimento, bebida e outros medicamentos","Água pura, 60 min antes; sem deitar","Bula FDA do ibandronato"],["Sais de ferro","Cálcio, antiácidos, chá, café, leite","Separar; a bula do produto define o intervalo","Bula do produto"],["Cálcio (suplemento)","Levotiroxina, quinolonas, tetraciclinas, bifosfonatos, ferro","Mover para almoço ou jantar","Derivado das bulas acima"],["Antiácidos (Al, Mg, Ca)","Quinolonas, tetraciclinas, levotiroxina, ferro","Usar o intervalo do objeto","Derivado das bulas acima"]],"nota":"Quando a bula brasileira do produto trouxer intervalo diferente, siga a bula do produto dispensado."},{"tipo":"quadro","id":"m08-quadro-cyp","titulo":"Inibidores e indutores fortes de CYP3A4 e de P-gp de uso comum","html":"\n\u003cp>Classificação conforme a tabela de exemplos da FDA (Drug Development and Drug Interactions). Inclui apenas fármacos usados no Brasil com alguma frequência fora do hospital.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Fármacos\u003c/th>\u003cth>Efeito sobre o objeto\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Inibidores fortes de CYP3A4\u003c/td>\u003ctd>claritromicina, cetoconazol, itraconazol, posaconazol, voriconazol, ritonavir e cobicistat (reforçadores de antirretrovirais), nefazodona\u003c/td>\u003ctd>Aumentam muito a exposição de substratos sensíveis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inibidores moderados de CYP3A4\u003c/td>\u003ctd>eritromicina, fluconazol, diltiazem, verapamil, ciprofloxacino, dronedarona, aprepitanto, suco de toranja\u003c/td>\u003ctd>Aumento intermediário\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Indutores fortes de CYP3A4\u003c/td>\u003ctd>rifampicina, carbamazepina, fenitoína, erva-de-são-joão (também apalutamida, enzalutamida, mitotano)\u003c/td>\u003ctd>Reduzem muito a exposição\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Indutores moderados de CYP3A4\u003c/td>\u003ctd>fenobarbital, primidona, efavirenz, bosentana\u003c/td>\u003ctd>Redução intermediária\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inibidores de P-gp\u003c/td>\u003ctd>amiodarona, claritromicina, eritromicina, cetoconazol, itraconazol, verapamil, ciclosporina, dronedarona, propafenona, quinidina, ranolazina\u003c/td>\u003ctd>Aumentam digoxina, dabigatrana, edoxabana, colchicina\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Indutores de P-gp\u003c/td>\u003ctd>rifampicina, erva-de-são-joão, carbamazepina, fenitoína\u003c/td>\u003ctd>Reduzem dabigatrana, digoxina e DOAC\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4>Substratos sensíveis de CYP3A4 vistos no balcão\u003c/h4>\n\u003cp>sinvastatina, lovastatina, sildenafila, vardenafila, felodipina, midazolam, triazolam, buspirona, quetiapina, ticagrelor, budesonida, eplerenona, ivabradina, tacrolimo. A atorvastatina é afetada em grau intermediário; rosuvastatina e pravastatina, pouco.\u003c/p>\n\u003ch4>Outras enzimas que importam\u003c/h4>\n\u003cul>\n\u003cli>\u003cb>CYP2C9\u003c/b>, inibidores moderados: amiodarona, fluconazol, miconazol; o sulfametoxazol também inibe. Objetos: varfarina, sulfonilureias, fenitoína.\u003c/li>\n\u003cli>\u003cb>CYP2C19\u003c/b>, inibidores fortes: fluconazol, fluoxetina, fluvoxamina; o omeprazol é inibidor fraco, mas suficiente para reduzir a ativação do clopidogrel.\u003c/li>\n\u003cli>\u003cb>CYP2D6\u003c/b>, inibidores fortes: fluoxetina, paroxetina, bupropiona, terbinafina, quinidina. Objetos: tamoxifeno, codeína, tramadol, metoprolol.\u003c/li>\n\u003cli>\u003cb>CYP1A2\u003c/b>, inibidores: fluvoxamina (forte), ciprofloxacino e anticoncepcionais orais (moderados). Objetos: cafeína, teofilina, tizanidina, clozapina.\u003c/li>\n\u003c/ul>\n"},{"tipo":"fluxo","id":"m08-fluxo-decisao","titulo":"Decisão ao detectar uma interação no balcão","passos":[{"t":"Interação suspeita na receita ou na entrevista","tipo":"inicio"},{"t":"Identificar precipitante, objeto, via e efeito; confirmar em bula ou compêndio","tipo":"acao"},{"t":"A interação é real e clinicamente relevante para este paciente?","tipo":"decisao","sim":"Seguir","nao":"Dispensar e orientar; registrar se houver dúvida"},{"t":"O paciente já tem sintomas compatíveis (sangramento, confusão, desmaio, palpitação)?","tipo":"decisao","sim":"Encaminhar para atendimento, com urgência se houver sinal de gravidade","nao":"Seguir"},{"t":"É interação de absorção resolvível por horário?","tipo":"decisao","sim":"Montar quadro de horários e orientar","nao":"Seguir"},{"t":"É contraindicada ou grave e ainda não iniciada?","tipo":"decisao","sim":"Contatar o prescritor antes de dispensar e propor alternativa","nao":"Seguir"},{"t":"É grave com medicamento já em uso há tempo?","tipo":"decisao","sim":"Contatar o prescritor sem suspender por conta própria","nao":"Orientar sinais de alerta e monitoramento"},{"t":"Não suspender medicamento de uso contínuo sem o prescritor","tipo":"alerta"},{"t":"Orientar o paciente com linguagem simples e conferir o entendimento","tipo":"acao"},{"t":"Registrar problema, conduta, contato e desfecho","tipo":"fim"}]},{"tipo":"cartoes","id":"m08-cartoes","titulo":"Cartões de revisão: interações","itens":[{"f":"Precipitante e objeto: o que são?","v":"Precipitante causa a alteração; objeto é o fármaco cujo efeito muda."},{"f":"Claritromicina + sinvastatina: mecanismo?","v":"Claritromicina inibe CYP3A4 e aumenta a exposição à sinvastatina; risco de rabdomiólise; contraindicada."},{"f":"Teto de sinvastatina com anlodipino?","v":"20 mg/dia na bula FDA; 40 mg/dia na bula brasileira."},{"f":"Teto de sinvastatina com verapamil ou diltiazem?","v":"10 mg/dia na bula FDA; 20 mg/dia na bula brasileira."},{"f":"Amiodarona + varfarina: conduta da bula?","v":"FDA: reduzir a varfarina em 1/3 a 1/2. Brasil: ajustar pelo INR."},{"f":"Amiodarona + digoxina: conduta da bula?","v":"FDA: digoxina à metade ou suspender. Brasil: dosar nível e ajustar."},{"f":"Por que omeprazol atrapalha o clopidogrel?","v":"Inibe CYP2C19, que ativa o pró-fármaco; menos antiagregação."},{"f":"O que é triple whammy?","v":"IECA ou BRA + diurético + AINE: queda da filtração e lesão renal aguda."},{"f":"Por que a trimetoprima eleva o potássio?","v":"Bloqueia o canal de sódio do túbulo coletor, como a amilorida."},{"f":"Sildenafila + nitrato?","v":"Contraindicada: GMPc somado, hipotensão grave."},{"f":"ISRS + linezolida: risco?","v":"Síndrome serotoninérgica; a linezolida inibe a MAO."},{"f":"Fluoxetina + tamoxifeno?","v":"Fluoxetina inibe CYP2D6 e reduz o endoxifeno; possível perda de eficácia."},{"f":"Três precipitantes que elevam o lítio?","v":"Tiazídicos, IECA ou BRA, AINE."},{"f":"Rifampicina e pílula: orientação FSRH?","v":"Preservativo durante o uso e por 28 dias após a suspensão."},{"f":"Amoxicilina reduz a eficácia da pílula?","v":"Não, segundo a FSRH; só indutores enzimáticos reduzem."},{"f":"Ciprofloxacino e antiácido: intervalo?","v":"Cipro 2 h antes ou 6 h depois (bula FDA)."},{"f":"Levotiroxina e cálcio: intervalo?","v":"Pelo menos 4 horas (bula FDA)."},{"f":"Metronidazol e álcool: prazo após o fim?","v":"Bula brasileira: pelo menos 1 dia; bula FDA: 3 dias."},{"f":"Por que espaçar a toranja não resolve?","v":"A inibição de CYP3A4 intestinal é irreversível e dura cerca de um dia ou mais."},{"f":"Tiramina + tranilcipromina?","v":"Crise hipertensiva por liberação de noradrenalina."}]},{"tipo":"questoes","id":"m08-questoes","titulo":"Questões: interações medicamentosas","itens":[{"p":"Homem de 66 anos usa sinvastatina 40 mg e recebe claritromicina para pneumonia. Assinale a descrição correta da interação:","alt":["a sinvastatina inibe CYP3A4 e eleva a claritromicina","a claritromicina induz CYP3A4 e reduz a sinvastatina","a claritromicina inibe CYP3A4 e eleva a estatina","as duas competem pela P-gp sem efeito clínico","a interação é só farmacodinâmica, sobre o QT"],"c":2,"com":"A claritromicina é inibidor forte de CYP3A4 (lista da FDA) e é o precipitante; a sinvastatina, substrato sensível, é o objeto. A bula da sinvastatina contraindica a combinação pelo risco de miopatia e rabdomiólise. As demais alternativas invertem os papéis ou erram o mecanismo."},{"p":"Paciente com varfarina e INR estável recebe receita de sulfametoxazol com trimetoprima. A conduta mais adequada é:","alt":["contatar o prescritor, pois o sulfametoxazol inibe CYP2C9","dispensar, pois antibióticos sempre reduzem o INR da varfarina","orientar a comer mais verduras para compensar o efeito","separar os horários em 4 horas","suspender a varfarina durante o antibiótico"],"c":0,"com":"O sulfametoxazol inibe CYP2C9, via da S-varfarina, e eleva o INR com risco de sangramento. Separar horários não resolve interação enzimática, mudar a dieta não é manejo seguro e o farmacêutico não suspende anticoagulante por conta própria."},{"p":"Sobre clopidogrel e inibidores da bomba de prótons, é correto afirmar:","alt":["o pantoprazol é contraindicado com clopidogrel","o omeprazol aumenta a formação do metabólito ativo","basta tomar o omeprazol 12 horas após o clopidogrel","o clopidogrel inibe CYP2C19 e eleva o omeprazol","a bula orienta evitar omeprazol e esomeprazol"],"c":4,"com":"A bula do clopidogrel orienta evitar omeprazol e esomeprazol, que inibem CYP2C19 e reduzem a ativação do pró-fármaco. Separar horários não resolve inibição enzimática. Pantoprazol tem menor efeito sobre CYP2C19 e costuma ser a escolha."},{"p":"Idosa de 79 anos usa enalapril e hidroclorotiazida e quer comprar naproxeno para tomar por 15 dias. O principal risco da combinação é:","alt":["hipoglicemia","lesão renal aguda","síndrome serotoninérgica","falha contraceptiva","hipotireoidismo"],"c":1,"com":"IECA, diurético e AINE formam o 'triple whammy': hipovolemia, dilatação eferente e constrição aferente reduzem a filtração glomerular. O AINE também reduz o efeito anti-hipertensivo. As outras alternativas não decorrem dessa combinação."},{"p":"Paciente usa sertralina e recebe linezolida para infecção de pele. O risco a orientar é de:","alt":["hipercalemia por retenção renal de potássio somada","síndrome serotoninérgica, pois a linezolida inibe a MAO","falha da sertralina por indução enzimática hepática intensa","hipoglicemia por inibição de CYP2C9 pela linezolida","nenhum, pois a linezolida não tem interações"],"c":1,"com":"A linezolida é inibidor reversível e fraco da MAO; somada ao ISRS, aumenta a serotonina sináptica. A bula da linezolida relata síndrome serotoninérgica, inclusive fatal, e orienta monitorar ou suspender um dos fármacos."},{"p":"Paciente em uso de lítio inicia hidroclorotiazida para hipertensão. Qual é o mecanismo esperado?","alt":["o tiazídico aumenta a reabsorção renal de lítio","o lítio inibe CYP3A4 e eleva o nível do diurético tiazídico","o tiazídico quela o lítio no intestino","o tiazídico induz o metabolismo hepático do lítio por CYP","não há interação, pois o lítio não é eliminado pelo rim"],"c":0,"com":"O lítio é eliminado quase todo pelo rim e reabsorvido como o sódio. A perda de sódio induzida pelo tiazídico aumenta a reabsorção proximal de sódio e lítio. A bula do lítio orienta monitorar a litemia após iniciar diuréticos, AINE ou antagonistas do sistema renina-angiotensina."},{"p":"Jovem usuária de pílula combinada inicia rifampicina. Segundo a FSRH, a orientação adequada é:","alt":["dobrar a dose da pílula por conta própria","nenhuma, pois antibióticos não interferem","suspender a pílula durante o tratamento","usar preservativo durante e por 28 dias após","trocar a pílula por adesivo combinado, q function fechaCamadas() { $$('.veu,.gaveta').forEach(x => x.remove()); }

/* ---------------- rotas ---------------- */
function rota() {
  if (imprimindo) return;
  fechaCamadas();
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const p = h.split('/').filter(Boolean);
  const m = p[0] && mod(p[0]);
  if (!m) { telaInicio(); $('#titulo-movel').textContent = DADOS.titulo; window.scrollTo(0, 0); return; }
  document.body.style.cssText = `--ac:${m.cor}`;
  moldura(m.id);
  $('#titulo-movel').textContent = m.curto || m.titulo;
  const aba = p[1] || 'resumo';
  if (aba === 'mapa') telaMapa(m); else if (aba === 'apoio') telaApoio(m, p[2]); else telaResumo(m, p[2]);
  if (!p[2]) window.scrollTo(0, 0);
}

function ativaEdicao() { $$('[data-edit]').forEach(el => { if (editando) el.contentEditable = 'true'; else el.removeAttribute('contenteditable'); }); }
function alternaEdicao() { if (!podeEditar) return; commitTodos(); editando = !editando; document.body.classList.toggle('editando', editando); try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) { /* antigo */ } rota(); aviso(editando ? 'Modo edição ligado: clique em um texto para alterar.' : 'Modo edição desligado.'); }
function marcaAlterado() {
  alterado = true; indice = null;
  if (!gravarLS('rascunho', { base: DADOS.versao, quando: new Date().toISOString(), dados: DADOS })) aviso('O navegador não guardou o rascunho (sem espaço). Salve o arquivo agora.');

const pendentes = new Map();
function agendaCommit(el) { clearTimeout(pendentes.get(el)); pendentes.set(el, setTimeout(() => commit(el), 500)); }
function commitTodos() { pendentes.forEach((t, el) => { clearTimeout(t); commit(el); }); pendentes.clear(); }
function commit(el) {
  pendentes.delete(el);
  const [tipo, id, campo] = el.dataset.edit.split(':');
  if (tipo === 'mod') { mod(id)[campo] = el.innerText.replace(/\s+/g, ' ').trim(); }
  else if (tipo === 'top') { const m = moduloAtual(), t = m && m.topicos.find(x => x.id === id); if (!t) return; t[campo] = campo === 'titulo' ? el.innerText.replace(/\s+/g, ' ').trim() : limpaHtml(el.innerHTML); }
  else if (tipo === 'bloco') { const m = moduloAtual(), b = m && m.apoio.find(x => x.id === id); if (!b) return; b.html = limpaHtml(el.innerHTML); }
  marcaAlterado();
}
function moveItem(lista, id, d) { const i = lista.findIndex(x => x.id === id), j = i + d; if (i < 0 || j < 0 || j >= lista.length) return; [lista[i], lista[j]] = [lista[j], lista[i]]; marcaAlterado(); rota(); }

function abreModal(html) {
  fechaCamadas();
  const v = document.createElement('div'); v.className = 'veu';
  v.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v) v.remove(); });

  return v;
}

function editaBloco(m, b, novo) {

    (b.tipo === 'quadro' ? `<p class="sub">O conteúdo do quadro é editado direto na página, no modo edição.</p>` :
      `<pre class="ajuda">${esc(f.ajuda)}</pre><label class="campo">Conteúdo<textarea id="ed-txt" spellcheck="true">${esc(f.para(b))}</textarea></label>`) +
    (b.tipo === 'tabela' ? `<label class="campo">Nota abaixo da tabela (opcional)<input type="text" id="ed-nota" value="${esc(b.nota || '')}"></label>` : '') +
    `<p class="erro-ed" id="ed-erro"></p><div class="rodM"><button class="bt sec" data-fecha>Cancelar</button><button class="bt" id="ed-ok">${ic('check')} Aplicar</button></div>`);
  $('[data-fecha]', d).onclick = () => { if (novo) m.apoio.splice(m.apoio.indexOf(b), 1); d.remove(); };
  $('#ed-ok', d).onclick = () => {
    try {
      const copia = JSON.parse(JSON.stringify(b));
      copia.titulo = $('#ed-tit', d).value.trim() || TIPOS[b.tipo].nome;
      if (f) f.de($('#ed-txt', d).value, copia);

}
function editaMapa(m, mp, novo) {
  const txt = (mp.ramos || []).map(r => r.t + '\n' + (r.itens || []).map(it => typeof it === 'string' ? '- ' + it : '- ' + it.t + '\n' + (it.itens || []).map(s => '-- ' + s).join('\n')).join('\n')).join('\n');
  const d = abreModal(`<h2>${novo ? 'Novo mapa mental' : 'Editar mapa mental'}</h2>` +
    `<div class="duas"><label class="campo">Título<input type="text" id="mp-tit" value="${esc(mp.titulo || '')}"></label><label class="campo">Centro do mapa<input type="text" id="mp-cen" value="${esc(mp.centro || '')}"></label></div>` +
    `<pre class="ajuda">Linha sem traço = ramo (4 a 6 ramos).\n- item do ramo (até ~60 caracteres)\n-- subitem do item (opcional)</pre>` +
    `<label class="campo">Ramos e itens<textarea id="mp-txt">${esc(txt)}</textarea></label>` +
    `<p class="erro-ed" id="ed-erro"></p><div class="rodM"><button class="bt sec" data-fecha>Cancelar</button><button class="bt" id="ed-ok">${ic('check')} Aplicar</button></div>`);
  $('[data-fecha]', d).onclick = () => { if (novo) m.mapas.splice(m.mapas.indexOf(mp), 1); d.remove(); };
  $('#ed-ok', d).onclick = () => {
    const ramos = []; let r = null, it = null;
    $('#mp-txt', d).value.split('\n').forEach(l => {
      const t = l.trim(); if (!t) return;
      if (t.startsWith('--') && it) { if (typeof it.ref === 'string') { const o = { t: it.ref, itens: [] }; r.itens[it.i] = o; it.ref = o; } it.ref.itens.push(t.slice(2).trim()); }
      else if (t.startsWith('-') && r) { r.itens.push(t.slice(1).trim()); it = { i: r.itens.length - 1, ref: t.slice(1).trim() }; }
      else { r = { t, itens: [] }; ramos.push(r); it = null; }
    });
    if (!ramos.length) { $('#ed-erro', d).textContent = 'O mapa precisa de ao menos um ramo.'; return; }
    mp.titulo = $('#mp-tit', d).value.trim() || 'Mapa mental'; mp.centro = $('#mp-cen', d).value.trim() || mp.titulo; mp.ramos = ramos;
    d.remove(); marcaAlterado(); rota();
  };
}

/* ---------------- salvar arquivo, backup e rascunho ---------------- */
function htmlComDados() {
  const json = JSON.stringify(DADOS).replace(/</g, '\\u003c');
  const abre = '<' + 'script id="sos-dados" type="application/json">';
  const ini = ORIGEM.indexOf(abre), fim = ORIGEM.indexOf('<' + '/script>', ini);
  if (ini < 0 || fim < 0) throw new Error('Não achei o bloco de dados no arquivo.');
  return ORIGEM.slice(0, ini) + abre + json + ORIGEM.slice(fim);
}
async function salvarArquivo() {
  if (!podeEditar) return;
  commitTodos();
  const anterior = DADOS.versao;
  DADOS.versao = new Date().toISOString();
  let html;
  try { html = htmlComDados(); } catch (e) { DADOS.versao = anterior; alert(e.message); return; }
  const nome = 'SOS-Farmacologia.html';
  try {
    if (window.showSaveFilePicker) {
      const fh = await window.showSaveFilePicker({ suggestedName: nome, types: [{ description: 'Página HTML', accept: { 'text/html': ['.html'] } }] });
      const w = await fh.createWritable(); await w.write(html); await w.close();
    } else baixar(new Blob([html], { type: 'text/html' }), nome);
  } catch (e) { DADOS.versao = anterior; if (e.name !== 'AbortError') alert('Não foi possível salvar: ' + e.message); return; }
  alterado = false; apagarLS('rascunho'); aviso('Arquivo salvo. Abra sempre a versão nova.'); rota();
}
function baixar(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function verificaRascunho() {
  const r = lerLS('rascunho', null);
  if (!r || !r.dados) return;
  const quando = new Date(r.quando).toLocaleString('pt-BR');
  const d = abreModal(`<h2>Alterações não salvas</h2><p class="sub">Este navegador guardou alterações feitas em ${esc(quando)} que não foram gravadas no arquivo.` +
    (r.base !== DADOS.versao ? ' Elas foram feitas sobre outra versão do arquivo; recuperar substitui o conteúdo atual por aquele rascunho.' : '') + `</p>` +
    `<div class="rodM"><button class="bt sec" id="rs-desc">Descartar</button><button class="bt" id="rs-rec">${ic('restore')} Recuperar alterações</button></div>`);
  $('#rs-desc', d).onclick = () => { if (confirm('Descartar as alterações guardadas no navegador?')) { apagarLS('rascunho'); d.remove(); } };

  else if (cmd === 'h3' || cmd === 'p') document.execCommand('formatBlock', false, cmd);
  else if (cmd === 'tabela') document.execCommand('insertHTML', false, '<div class="tab"><table><thead><tr><th>Coluna 1</th><th>Coluna 2</th><th>Coluna 3</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div><p><br></p>');
  else document.execCommand(cmd, false, null);
  agendaCommit(ed);
});
$('#bt-editar').onclick = alternaEdicao;
$('#bt-salvar').onclick = salvarArquivo;
$('#bt-pdf').onclick = janelaPdf;
$('#bt-ajustes').onclick = ajustes;
$('#bt-tema').onclick = trocaTema;
$$('[data-buscar]').forEach(b => { b.onclick = abreBusca; });
$('#bt-mais').onclick = () => gaveta('mais');
window.addEventListener('hashchange', () => { commitTodos(); rota(); });
window.addEventListener('beforeunload', e => { commitTodos(); if (alterado) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- início ---------------- */
async function inicia() {
  try { await document.fonts.load('16px tabler-icons'); } catch (e) { /* segue */ }
  const q = new URLSearchParams(location.search);
  if (q.get('pdf') && !PORTAO) {
    /* Geração automática (ferramentas/gera_pdfs.py): monta a impressão e avisa que terminou. */
    const ids = q.get('pdf') === 'todos' ? DADOS.modulos.map(x => x.id) : q.get('pdf').split(',');
    const partes = (q.get('partes') || 'resumo,mapa,apoio').split(',');
    imprimindo = true;
    montaImpressao({ ids, capa: q.get('capa') !== '0', resumo: partes.includes('resumo'), mapa: partes.includes('mapa'), apoio: partes.includes('apoio'), gabarito: q.get('gabarito') !== '0', marca: q.get('marca') || DADOS.config.marca, marca2: q.get('marca2') || DADOS.config.marca2 || '' });
    document.body.dataset.pronto = '1';
    return;
  }
  rota();
  /* no site, o rascunho (edição antiga guardada neste navegador) só é oferecido à administração: para o
     cliente ele fica guardado como está, sem aviso e sem botão de descartar */
  if (!PORTAO) verificaRascunho();
}
/* Ganchos da conta (conta-sos.js). liberarEdicao: administração; cliente: leitura com marca-d'água licenciada. */
let rascunhoVisto = false;
function liberarEdicao() {
  if (podeEditar && rascunhoVisto) return;
  podeEditar = true; rota();
  if (!rascunhoVisto) { rascunhoVisto = true; verificaRascunho(); }
}
function cliente(email) { licenciado = String(email || '').trim(); }
window.SOS = { dados: DADOS, htmlComDados, liberarEdicao, cliente, get podeEditar() { return podeEditar; }, PORTAO }; /* conta e testes */
inicia();
})();

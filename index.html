ta), aplicar e \u003cstrong>manter o botão pressionado por pelo menos 10 segundos\u003c/strong> antes de retirar a agulha.\u003c/li> \u003cli>\u003cstrong>Não reutilizar agulhas\u003c/strong>: a reutilização entorta a ponta, aumenta dor, contaminação e lipo-hipertrofia.\u003c/li> \u003cli>Descarte de agulhas e lancetas em recipiente rígido, sem reencapar, dobrar ou quebrar.\u003c/li> \u003c/ul> \u003cp>A \u003cstrong>lipo-hipertrofia\u003c/strong> é um espessamento endurecido do tecido no local de aplicação repetida. Aplicar insulina ali torna a absorção errática, com hiperglicemias e hipoglicemias sem explicação. Uma metanálise citada pela SBD aponta como principais fatores o rodízio incorreto, a reutilização de agulhas e agulhas de 6 mm ou mais. A conduta é inspecionar e palpar os locais e evitar as áreas alteradas.\u003c/p> \u003ch4>Mistura de NPH e regular na seringa\u003c/h4> \u003cp>Só seringas com agulha fixa permitem mistura na mesma seringa. A sequência da SBD: homogeneizar a NPH, injetar ar no frasco de NPH sem aspirar, injetar ar no frasco de regular, aspirar a regular, depois introduzir a agulha no frasco de NPH e aspirar a dose. A insulina límpida entra primeiro na seringa, para não contaminar o frasco de regular com NPH.\u003c/p> \u003ch3>Erros frequentes na dispensação\u003c/h3> \u003cp>Insulinas estão entre os medicamentos potencialmente perigosos, em que um erro causa dano grave. Os mais comuns no balcão envolvem nomes parecidos (Novolin® e NovoRapid®; Humalog® e Humalog® Mix), troca entre insulina basal e prandial, entrega de refil incompatível com a caneta do paciente e confusão entre glargina de 100 e de 300 UI/mL, que não são intercambiáveis sem orientação médica. Medidas de segurança: ler o rótulo inteiro em voz alta com o paciente, conferir a cor e o tipo de caneta que ele já usa, separar fisicamente na geladeira as insulinas de nomes parecidos e registrar o lote dispensado.\u003c/p> \u003ch3>Conservação\u003c/h3> \u003cp>Insulina lacrada fica na geladeira, entre 2 e 8 °C, até a validade, longe do congelador (SBD). Insulina congelada deve ser descartada. Depois de aberta, fica em temperatura ambiente (15 a 30 °C, longe de calor e luz) pelo prazo de cada bula. Algumas apresentações em uso também podem ficar na geladeira (ex.: NovoRapid® FlexPen®, Novolin® R frasco e FlexPen®, Tresiba® FlexTouch®, Humulin® R frasco); outras não devem ser refrigeradas depois de abertas (ex.: refis e carpules em caneta, Humalog® KwikPen®, Basaglar®, Lantus® na caneta, Levemir® Penfill®). Anotar a data de abertura no produto evita uso além do prazo.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Produto\u003c/th>\u003cth>Prazo após aberto (bula)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Humulin® R (frasco e refil) e Humulin® N refil\u003c/td>\u003ctd>28 dias\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Novolin® N frasco\u003c/td>\u003ctd>4 semanas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Novolin® N FlexPen® e Penfill®; Novolin® R (frasco, FlexPen® e Penfill®)\u003c/td>\u003ctd>6 semanas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>NovoRapid® (FlexPen® e Penfill®), Fiasp®\u003c/td>\u003ctd>4 semanas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Pré-misturas\u003c/td>\u003ctd>Conforme a bula do produto\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Humalog® KwikPen®, Apidra®\u003c/td>\u003ctd>28 dias\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Lantus®, Basaglar® (glargina 100 UI/mL)\u003c/td>\u003ctd>28 dias\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Toujeo® (glargina 300 UI/mL)\u003c/td>\u003ctd>6 semanas (42 dias), sem geladeira\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Levemir® (detemir)\u003c/td>\u003ctd>6 semanas (42 dias)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Tresiba® (degludeca)\u003c/td>\u003ctd>8 semanas (56 dias)\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Os prazos variam por fabricante e apresentação. Em caso de dúvida, vale a bula do produto em mãos. No transporte, usar bolsa térmica sem contato direto com gelo, e nunca deixar a insulina no carro ao sol.\u003c/p> \u003ch3>Acesso e situações práticas\u003c/h3> \u003cp>As insulinas humanas NPH e regular são distribuídas no SUS e no Programa Farmácia Popular, e os análogos de ação rápida e prolongada têm acesso por protocolos específicos, sobretudo no DM1. Insumos como seringas, agulhas, lancetas e tiras também têm programas próprios; o farmacêutico pode orientar o paciente sobre os canais de acesso disponíveis no município. Em viagens, a insulina vai na bagagem de mão, com receita ou relatório médico e insumos extras. Em dias de doença, a pessoa com DM1 nunca deve suspender a insulina basal, mesmo comendo pouco, e precisa medir a glicemia com mais frequência e procurar o serviço de saúde se houver vômitos persistentes.\u003c/p> \u003ch3>Hipoglicemia\u003c/h3> \u003cp>Sintomas adrenérgicos: tremor, suor frio, palpitação, fome, ansiedade. Sintomas neuroglicopênicos: confusão, fala arrastada, alteração de comportamento, visão turva, sonolência, convulsão, coma. Idosos e pessoas com muitos anos de diabetes podem perder os sinais de alerta.\u003c/p> \u003ch4>Regra dos 15 (pessoa consciente e capaz de engolir)\u003c/h4> \u003col> \u003cli>Medir a glicemia; se &lt; 70 mg/dL (ou sintomas típicos sem aparelho disponível), tratar.\u003c/li> \u003cli>Oferecer cerca de 15 g de carboidrato de absorção rápida: por exemplo, 1 colher de sopa de açúcar dissolvida em água, meio copo (cerca de 150 mL) de suco de fruta ou refrigerante comum, ou comprimidos ou gel de glicose conforme o rótulo.\u003c/li> \u003cli>Esperar 15 minutos e medir de novo.\u003c/li> \u003cli>Se continuar &lt; 70 mg/dL, repetir.\u003c/li> \u003cli>Normalizada, fazer um lanche com carboidrato e proteína se a próxima refeição estiver longe.\u003c/li> \u003c/ol> \u003cp>Chocolate e alimentos gordurosos não são boa escolha, porque a gordura atrasa a absorção. Em quem usa acarbose, usar glicose pura.\u003c/p> \u003ch4>Hipoglicemia grave e glucagon\u003c/h4> \u003cp>Pessoa inconsciente, convulsionando ou incapaz de engolir \u003cstrong>não pode receber nada pela boca\u003c/strong>, pelo risco de aspiração. Colocar de lado e acionar o SAMU (192). Se houver glucagon e alguém treinado, aplicar. A bula do GlucaGen® HypoKit orienta reconstituir o pó com o diluente e aplicar por via subcutânea ou intramuscular 1 mg (1 mL) em adultos e crianças acima de 25 kg ou de 6 a 8 anos, e 0,5 mg abaixo disso; sem resposta em 10 minutos, buscar assistência médica. Ao acordar e conseguir engolir, oferecer carboidrato. O glucagon funciona pouco em hipoglicemia por álcool ou em jejum prolongado, porque depende de glicogênio no fígado.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Peça ao paciente que mostre como aplica. Confira agulha (tamanho e troca), rodízio, locais endurecidos, homogeneização da NPH, tempo de 10 segundos, conservação e data de abertura. Pergunte sobre hipoglicemias e se a família sabe agir. Oriente sempre carregar uma fonte de glicose e identificação de pessoa com diabetes.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Rapaz com DM1 relata glicemias \"loucas\", ora altas, ora baixas, sem mudança de dieta. Aplica sempre no mesmo lado do abdome e reutiliza a agulha da caneta por uma semana. O farmacêutico palpa a região com consentimento, percebe área endurecida, explica a lipo-hipertrofia, ensina o rodízio e a troca de agulha a cada aplicação e orienta informar o médico, porque a dose pode precisar de ajuste ao mudar para pele saudável.\u003c/p>\u003c/div>"},{"id":"m05-tireoide","titulo":"Tireoide","resumo":"\u003cp>A tireoide produz tiroxina (T4) e tri-iodotironina (T3), hormônios que regulam o metabolismo de quase todos os tecidos. A hipófise controla a glândula pelo TSH: quando há pouco hormônio tireoidiano, o TSH sobe; quando há excesso, o TSH cai. Por isso o TSH é o exame mais usado para diagnosticar e acompanhar o tratamento das doenças primárias da tireoide. O T4 é convertido em T3, a forma mais ativa, nos tecidos.\u003c/p> \u003ch3>Hipotireoidismo e levotiroxina\u003c/h3> \u003cp>O hipotireoidismo primário, cuja causa mais comum é a tireoidite de Hashimoto, causa cansaço, sonolência, intolerância ao frio, ganho de peso, constipação, pele seca, queda de cabelo, alteração menstrual e lentidão. O tratamento é a reposição com \u003cstrong>levotiroxina\u003c/strong> (T4 sintético), em comprimidos de várias concentrações (25, 50, 75, 88, 100, 112, 125, 150 mcg e outras), comercializada no Brasil como Puran T4®, Synthroid®, Euthyrox®, Levoid® e outras marcas.\u003c/p> \u003cp>A bula do Puran T4® indica, no adulto, iniciar com 50 mcg/dia e aumentar 25 mcg a cada 2 ou 3 semanas; em hipotireoidismo de longa data ou suspeita de doença cardiovascular, começar com 25 mcg/dia. A manutenção costuma ficar entre 75 e 125 mcg/dia. Idosos e cardiopatas começam com doses baixas, porque o aumento rápido do metabolismo pode desencadear angina ou arritmia. A dose é ajustada pelo TSH, que leva semanas para se estabilizar; o controle costuma ser feito de 6 a 8 semanas após cada mudança.\u003c/p> \u003ch4>Como tomar\u003c/h4> \u003cp>As bulas de levotiroxina orientam tomar com o \u003cstrong>estômago vazio\u003c/strong>, de 30 minutos a 1 hora antes do café da manhã (ou 2 horas após comer), com água, todos os dias no mesmo horário. A absorção depende de acidez gástrica e é reduzida por alimentos e várias substâncias:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Interferente\u003c/th>\u003cth>Efeito\u003c/th>\u003cth>Orientação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Carbonato de cálcio, sulfato ferroso, polivitamínicos com minerais\u003c/td>\u003ctd>Formam complexos e reduzem a absorção\u003c/td>\u003ctd>Separar pelo menos 4 horas (bula do Synthroid®: 4 horas de medicamentos que alteram a absorção)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Antiácidos com alumínio ou magnésio, sevelâmer, colestiramina, orlistate\u003c/td>\u003ctd>Reduzem absorção\u003c/td>\u003ctd>Separar pelo menos 4 horas\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Omeprazol e outros inibidores da bomba de prótons\u003c/td>\u003ctd>Menos acidez, menos absorção\u003c/td>\u003ctd>Avisar o médico, que pode monitorar o TSH e ajustar a dose\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Café, leite de soja, fibras em excesso\u003c/td>\u003ctd>Reduzem absorção\u003c/td>\u003ctd>Respeitar o intervalo do jejum antes do café\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Rifampicina, carbamazepina, fenitoína, fenobarbital\u003c/td>\u003ctd>Aceleram o metabolismo do hormônio\u003c/td>\u003ctd>Pode ser necessária dose maior\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Estrogênio oral e gestação\u003c/td>\u003ctd>Aumentam a proteína transportadora\u003c/td>\u003ctd>Dose maior; na gestação, o ajuste é precoce\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch4>Índice terapêutico estreito e troca de marca\u003c/h4> \u003cp>Pequenas variações na quantidade absorvida mudam o TSH. Por isso a recomendação clínica é manter \u003cstrong>a mesma marca\u003c/strong> ao longo do tratamento; se houver troca (genérico, similar ou outra marca), o TSH deve ser reavaliado em 6 a 8 semanas. No balcão, isso significa não trocar a marca sem informar o paciente e registrar quando a troca acontecer, orientando contato com o médico.\u003c/p> \u003cp>Excesso de levotiroxina causa palpitação, tremor, insônia, ansiedade, perda de peso, diarreia e, a longo prazo, fibrilação atrial e perda de massa óssea, principalmente em idosos. Levotiroxina não é tratamento para obesidade e não deve ser usada para emagrecer.\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Gestante com hipotireoidismo precisa avisar o médico assim que souber da gravidez, porque a necessidade de hormônio aumenta já no primeiro trimestre e o hipotireoidismo não tratado prejudica o desenvolvimento do feto. Não reduzir nem suspender por conta própria.\u003c/p>\u003c/div> \u003ch4>Situações especiais\u003c/h4> \u003cp>No hipotireoidismo subclínico (TSH alto com T4 livre normal), a decisão de tratar depende do valor do TSH, da idade, de sintomas e de gestação; em idosos, metas de TSH costumam ser mais tolerantes. Em pessoas tratadas por câncer de tireoide, a levotiroxina pode ser usada em dose maior, para manter o TSH baixo, por decisão do especialista. Por isso uma dose \"alta\" na receita nem sempre é erro: o farmacêutico confirma a indicação e o acompanhamento antes de questionar.\u003c/p> \u003ch3>Hipertireoidismo e antitireoidianos\u003c/h3> \u003cp>O hipertireoidismo, mais frequentemente pela doença de Graves, causa palpitação, tremor, calor excessivo, suor, perda de peso com apetite aumentado, diarreia, ansiedade e, na doença de Graves, alterações oculares. As opções de tratamento são medicamentos antitireoidianos, iodo radioativo e cirurgia. O betabloqueador (propranolol, por exemplo) alivia os sintomas adrenérgicos até o controle.\u003c/p> \u003cul> \u003cli>\u003cstrong>Metimazol\u003c/strong> (Tapazol®): bloqueia a síntese hormonal; é o antitireoidiano de escolha na maioria dos casos, em tomada única diária na maior parte dos esquemas. No primeiro trimestre da gestação, está associado a malformações (embriopatia por metimazol).\u003c/li> \u003cli>\u003cstrong>Propiltiouracil (PTU)\u003c/strong>: além de bloquear a síntese, reduz a conversão periférica de T4 em T3. Exige várias tomadas ao dia. Tem risco maior de \u003cstrong>hepatotoxicidade grave\u003c/strong>, por isso fica reservado ao \u003cstrong>primeiro trimestre da gestação\u003c/strong>, à crise tireotóxica e a quem não tolera metimazol. Após o primeiro trimestre, o endocrinologista costuma trocar para metimazol.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Ambos podem causar \u003cstrong>agranulocitose\u003c/strong>, mais comum nos primeiros meses. Febre, dor de garganta, aftas ou infecção em quem usa metimazol ou PTU exigem suspender o remédio e fazer hemograma com urgência. Icterícia, urina escura, dor abdominal ou perda de apetite, principalmente com PTU, indicam possível lesão hepática.\u003c/p>\u003c/div> \u003ch4>Exames e acompanhamento\u003c/h4> \u003cp>O TSH reflete a média das últimas semanas, por isso não adianta repetir o exame poucos dias após mudar a dose. Para o exame, muitos laboratórios e endocrinologistas orientam manter a rotina de tomada da levotiroxina; a orientação específica deve vir do médico ou do laboratório. Sintomas de hipotireoidismo são inespecíficos: cansaço, ganho de peso e queda de cabelo têm muitas causas. Pedidos de \"remédio para tireoide preguiçosa\", suplementos com extrato de tireoide animal ou com iodo em dose alta, vendidos como emagrecedores ou energéticos, devem ser desaconselhados: podem induzir disfunção tireoidiana e não tratam a causa.\u003c/p> \u003ch3>Medicamentos que alteram a tireoide\u003c/h3> \u003cp>A \u003cstrong>amiodarona\u003c/strong> contém grande quantidade de iodo e se parece estruturalmente com os hormônios tireoidianos. Pode causar hipotireoidismo ou hipertireoidismo (inclusive tireoidite), mesmo meses após a suspensão, por isso o paciente faz TSH antes de iniciar e periodicamente. O \u003cstrong>lítio\u003c/strong> inibe a liberação de hormônio e causa hipotireoidismo e bócio, além de alterar cálcio (hiperparatireoidismo). Outros: interferona, alguns imunoterápicos oncológicos, contrastes iodados e suplementos de iodo ou de algas. Suplementos de \u003cstrong>biotina\u003c/strong> em dose alta interferem em alguns exames laboratoriais de TSH e T4 e podem gerar resultado falso; o cliente deve informar o laboratório.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Para quem usa levotiroxina: confirme o horário em jejum, pergunte sobre cálcio, ferro, antiácido, omeprazol e café, oriente separar 4 horas dos minerais, manter a mesma marca e repetir TSH após trocas ou gravidez. Para quem usa metimazol ou PTU: ensine os sinais de agranulocitose e de lesão hepática. Para quem usa amiodarona ou lítio: pergunte quando foi o último exame de tireoide.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhora de 66 anos, com hipotireoidismo controlado há anos com 100 mcg de levotiroxina, passou a tomar carbonato de cálcio com vitamina D junto com o comprimido no café da manhã e omeprazol. Voltou o cansaço e o TSH subiu. O farmacêutico identifica a interação, orienta tomar a levotiroxina em jejum, separar o cálcio por 4 horas, e sugere que ela leve a informação ao médico, que avaliará o omeprazol e a dose.\u003c/p>\u003c/div>"}],"mapas":[{"id":"m05-mapa-antidiabeticos","titulo":"Antidiabéticos orais e injetáveis não insulínicos","centro":"Antidiabéticos não insulina","ramos":[{"t":"Metformina","itens":["1ª linha no DM2; sem hipoglicemia isolada","Tomar com a refeição; XR melhora o intestino","TFGe \u003c 45: máx. 1.000 mg; \u003c 30: suspender","Uso longo: dosar vitamina B12","Contraste iodado: pausa orientada"]},{"t":"Secretagogos","itens":["Glibenclamida: maior risco de hipoglicemia","Gliclazida MR: preferida pela SBD","Glinida: pulou a refeição, pula a dose","Fluconazol e álcool potencializam"]},{"t":"iDPP-4 (gliptinas)","itens":["Peso neutro, pouca hipoglicemia","Linagliptina: sem ajuste renal","Não associar com aGLP-1","Raro: pancreatite, penfigoide"]},{"t":"iSGLT2 (gliflozinas)","itens":["Protegem coração e rim","Candidíase genital: higiene","Cetoacidose com glicemia normal","Suspender 3-4 dias antes de grande cirurgia"]},{"t":"Pioglitazona e acarbose","itens":["Pioglitazona: edema, peso, evitar na IC","Acarbose: com a primeira garfada","Acarbose + hipoglicemia: usar glicose pura"]},{"t":"aGLP-1 e tirzepatida","itens":["Escalonar a cada 4 semanas","Ozempic até 1 mg; Wegovy 2,4 mg (7,2 mg exceção)","Dor abdominal intensa: pensar em pancreatite","Receita em 2 vias retida, validade 90 dias","Uso contínuo: quantidade para cada 30 dias"]}]},{"id":"m05-mapa-insulinas","titulo":"Insulinas","centro":"Insulinas","ramos":[{"t":"Prandiais","itens":["Regular: 30 min antes da refeição","Asparte, lispro, glulisina: logo antes","Fiasp: até 20 min após iniciar a refeição","Todas límpidas"]},{"t":"Basais","itens":["NPH: turva, pico 4-10 h, homogeneizar","Glargina 100: 24 h sem pico","Glargina 300 e degludeca: mais longas","Detemir: 18-22 h"]},{"t":"Técnica","itens":["Agulha 4-5 mm caneta; 6 mm seringa","Segurar 10 s após a aplicação","Rodízio; nunca reutilizar agulha","Lipo-hipertrofia: absorção errática","Seringa sempre em UI, nunca em mL"]},{"t":"Conservação","itens":["Lacrada: 2 a 8 °C; congelou, descarta","Em uso: até 30 °C pelo prazo da bula","Lantus/Humalog/Humulin: 28 dias","Toujeo e Levemir 42 dias; Tresiba 56"]},{"t":"Hipoglicemia","itens":["\u003c 70 mg/dL: 15 g de carboidrato rápido","Reavaliar em 15 min e repetir","Inconsciente: nada pela boca, SAMU","Glucagon 1 mg adulto; 0,5 mg \u003c 25 kg"]}]},{"id":"m05-mapa-tireoide","titulo":"Tireoide","centro":"Tireoide","ramos":[{"t":"Fisiologia","itens":["TSH alto: hipotireoidismo primário","TSH baixo: excesso de hormônio","T4 vira T3 nos tecidos"]},{"t":"Levotiroxina","itens":["Jejum, 30 a 60 min antes do café","Início usual 25 a 50 mcg/dia (bula)","TSH 6 a 8 semanas após ajuste","Manter a mesma marca; IT estreito"]},{"t":"Interações da T4","itens":["Cálcio, ferro, antiácido: 4 h de intervalo","Omeprazol reduz absorção","Indutores e estrogênio: dose maior","Gestação: aumentar cedo"]},{"t":"Antitireoidianos","itens":["Metimazol: escolha na maioria","PTU: 1º trimestre e crise tireotóxica","PTU: hepatotoxicidade grave","Febre e dor de garganta: agranulocitose"]},{"t":"Fármacos e tireoide","itens":["Amiodarona: hipo ou hipertireoidismo","Lítio: hipotireoidismo e bócio","Biotina falseia exames","Levotiroxina não emagrece"]}]}],"apoio":[{"tipo":"tabela","id":"m05-tab-mestra","titulo":"Tabela-mestra dos antidiabéticos","colunas":["Classe","Exemplos","Mecanismo","Risco de hipoglicemia","Efeito no peso","Alerta"],"linhas":[["Biguanida","Metformina","Reduz produção hepática de glicose","Baixo","Neutro ou leve perda","TFGe \u003c 30 suspender; B12; contraste"],["Sulfonilureia","Glibenclamida, gliclazida MR, glimepirida","Libera insulina (canal K-ATP)","Alto (glibenclamida maior)","Ganho","Idoso e DRC; fluconazol; álcool"],["Glinida","Repaglinida","Libera insulina, ação curta","Moderado","Ganho","Só tomar se for comer; não com genfibrozila"],["iDPP-4","Sitagliptina, vildagliptina, linagliptina","Prolonga incretinas endógenas","Baixo","Neutro","Ajuste renal (exceto linagliptina)"],["iSGLT2","Dapagliflozina, empagliflozina","Glicosúria no túbulo proximal","Baixo","Perda","Candidíase; cetoacidose euglicêmica; volume"],["Tiazolidinediona","Pioglitazona","Sensibiliza à insulina (PPAR-gama)","Baixo","Ganho","Edema; IC; fraturas"],["Inibidor de alfa-glicosidase","Acarbose","Retarda digestão de carboidratos","Baixo","Neutro","Gases; tratar hipoglicemia com glicose"],["Agonista de GLP-1","Liraglutida, semaglutida, dulaglutida","Insulina dependente de glicose, menos glucagon, saciedade","Baixo","Perda importante","GI; pancreatite; receita retida"],["Agonista GIP/GLP-1","Tirzepatida","Duplo agonismo incretínico","Baixo","Perda muito importante","GI; anticoncepcional oral; receita retida"],["Insulina","NPH, regular, análogos","Repõe o hormônio","Alto","Ganho","Técnica, conservação, dose em UI"]]},{"tipo":"tabela","id":"m05-tab-insulinas","titulo":"Insulinas: perfil de ação e conservação","colunas":["Insulina","Início","Pico","Duração","Aspecto","Após aberta (bula)"],"linhas":[["Regular (Humulin R, Novolin R)","30 a 60 min","2 a 3 h","5 a 8 h","Límpida","Humulin R: 28 dias; Novolin R (frasco, FlexPen, Penfill): 6 semanas"],["Asparte (NovoRapid FlexPen e Penfill)","5 a 15 min","30 min a 2 h","3 a 5 h","Límpida","4 semanas"],["Lispro (Humalog KwikPen)","5 a 15 min","30 min a 2 h","3 a 5 h","Límpida","28 dias"],["Glulisina (Apidra)","5 a 15 min","30 min a 2 h","3 a 5 h","Límpida","28 dias"],["Asparte ultrarrápida (Fiasp)","2 a 5 min","1 a 3 h","5 h","Límpida","4 semanas"],["NPH (Humulin N, Novolin N)","2 a 4 h","4 a 10 h","10 a 18 h","Turva","Humulin N refil: 28 dias; Novolin N frasco 4 semanas, FlexPen e Penfill 6 semanas"],["Detemir (Levemir)","1 a 3 h","6 a 8 h","18 a 22 h","Límpida","42 dias"],["Glargina 100 UI/mL (Lantus, Basaglar)","2 a 4 h","Sem pico","20 a 24 h","Límpida","28 dias"],["Glargina 300 UI/mL (Toujeo)","6 h","Sem pico","36 h","Límpida","42 dias, sem geladeira"],["Degludeca (Tresiba)","Gradual","Sem pico","42 h ou mais","Límpida","56 dias"],["Pré-misturas (NPH/regular, lispro, asparte)","Da fração rápida","Duplo","Da fração intermediária","Turva","Conforme a bula do produto"]],"nota":"Perfil de ação segundo a SBD (Tabela 1, insulinoterapia no DM1). Prazos após aberta segundo as bulas brasileiras (Novo Nordisk, Lilly e Sanofi), em temperatura de 15 a 30 °C. Lacradas: 2 a 8 °C. Confira sempre a bula da apresentação dispensada, porque frasco, refil e caneta podem ter prazos diferentes."},{"tipo":"fluxo","id":"m05-fluxo-hipoglicemia","titulo":"Hipoglicemia leve no balcão","passos":[{"t":"Cliente com tremor, suor frio, fome, palpitação ou confusão leve, em uso de insulina ou secretagogo","tipo":"inicio"},{"t":"Está consciente e consegue engolir com segurança?","tipo":"decisao","sim":"Seguir a regra dos 15","nao":"Nada pela boca; colocar de lado, acionar SAMU 192; glucagon se disponível e houver pessoa treinada"},{"t":"Medir a glicemia capilar (não atrasar o tratamento se o aparelho não estiver à mão)","tipo":"acao"},{"t":"Glicemia \u003c 70 mg/dL ou sintomas típicos?","tipo":"decisao","sim":"Oferecer 15 g de carboidrato rápido (1 colher de sopa de açúcar em água ou cerca de 150 mL de suco ou refrigerante comum); glicose pura se usa acarbose","nao":"Investigar outra causa e orientar avaliação"},{"t":"Aguardar 15 minutos em repouso e medir de novo","tipo":"acao"},{"t":"Continua \u003c 70 mg/dL?","tipo":"decisao","sim":"Repetir 15 g; se não melhorar após duas tentativas ou piorar, acionar SAMU","nao":"Oferecer lanche com carboidrato e proteína se a refeição estiver distante"},{"t":"Hipoglicemia por glibenclamida ou insulina de ação longa pode voltar horas depois","tipo":"alerta"},{"t":"Identificar a causa (refeição pulada, álcool, exercício, erro de dose, interação), registrar e orientar contato com o médico","tipo":"fim"}]},{"tipo":"checklist","id":"m05-check-caneta","titulo":"Checklist de orientação de caneta de insulina ou GLP-1","itens":["Conferir nome, tipo, concentração e dose prescrita (em UI ou mg)","Conferir receita: para aGLP-1 e tirzepatida, duas vias, validade de 90 dias, retenção e SNGPC","Explicar armazenamento antes de abrir (2 a 8 °C) e prazo depois de aberta","Anotar a data de abertura no produto","Verificar o aspecto: límpida (exceto NPH e pré-misturas); descartar se congelou","Homogeneizar NPH e pré-misturas com 20 movimentos suaves","Usar agulha nova a cada aplicação, de preferência 4 ou 5 mm","Fazer o teste de fluxo antes de aplicar","Escolher o local e fazer rodízio; evitar áreas endurecidas","Manter o botão pressionado pelo menos 10 segundos","Retirar a agulha com a tampa externa e descartar em recipiente rígido","Para aGLP-1: explicar escalonamento, náusea e sinais de pancreatite","Ensinar sinais de hipoglicemia e a regra dos 15","Orientar transporte em bolsa térmica, sem contato direto com gelo","Pedir demonstração da aplicação pelo paciente e registrar a orientação"]},{"tipo":"cartoes","id":"m05-cartoes","titulo":"Cartões de revisão: sistema endócrino","itens":[{"f":"Glicemia de jejum que caracteriza diabetes (SBD)","v":"≥ 126 mg/dL, confirmada se isolada"},{"f":"Corte do TOTG de 1 hora para diabetes","v":"≥ 209 mg/dL (pré-diabetes 155 a 208)"},{"f":"Meta geral de HbA1c (SBD 2026)","v":"\u003c 7%"},{"f":"Meta de glicemia capilar de jejum (SBD 2026)","v":"80 a 130 mg/dL"},{"f":"Hipoglicemia nível 2","v":"Glicemia \u003c 54 mg/dL"},{"f":"Metformina com TFGe entre 30 e 44","v":"Máximo 1.000 mg/dia (SBD 2026)"},{"f":"Vitamina que a metformina reduz","v":"B12"},{"f":"Sulfonilureia preferida pela SBD","v":"Gliclazida MR"},{"f":"Regra da glinida","v":"Pulou a refeição, pula a dose"},{"f":"Efeito adverso mais comum do iSGLT2","v":"Infecção genital fúngica"},{"f":"Quando suspender iSGLT2 antes de grande cirurgia (SBD)","v":"3 a 4 dias antes"},{"f":"Hipoglicemia em quem usa acarbose","v":"Tratar com glicose pura"},{"f":"Regra de dispensação dos aGLP-1 e tirzepatida","v":"Receita em 2 vias, retenção da 2ª, validade de 90 dias, SNGPC (RDC 471/2021 alterada pela RDC 973/2025; IN 360/2025)"},{"f":"Prazo do Ozempic após aberto","v":"6 semanas, abaixo de 30 °C ou na geladeira"},{"f":"Tempo com o botão pressionado após aplicar insulina","v":"Pelo menos 10 segundos"},{"f":"Prazo da Tresiba após aberta","v":"8 semanas (56 dias)"},{"f":"Dose de glucagon (GlucaGen) em adulto","v":"1 mg (1 mL) SC ou IM"},{"f":"Como tomar levotiroxina","v":"Em jejum, 30 a 60 min antes do café; 4 h longe de cálcio e ferro"},{"f":"Antitireoidiano no 1º trimestre da gestação","v":"Propiltiouracil"},{"f":"Sinal de alarme com metimazol ou PTU","v":"Febre e dor de garganta: suspeitar de agranulocitose"}]},{"tipo":"questoes","id":"m05-questoes","titulo":"Questões de fixação: sistema endócrino","itens":[{"p":"Pela Diretriz da SBD, qual conjunto de resultados permite o diagnóstico de diabetes sem necessidade de repetir exame?","alt":["Glicemia de jejum de 118 mg/dL e HbA1c de 6,0% no mesmo dia","Jejum de 130 mg/dL e HbA1c de 6,7% na mesma amostra","HbA1c isolada de 6,6% em exame único de rotina","TOTG de 1 hora com glicemia de 180 mg/dL","Glicemia capilar de 160 mg/dL medida na farmácia"],"c":1,"com":"A SBD estabelece diagnóstico quando glicemia de jejum ≥ 126 mg/dL e HbA1c ≥ 6,5% estão alterados simultaneamente. Um exame isolado alterado deve ser repetido. TOTG 1 h de 180 mg/dL é pré-diabetes (155 a 208). Glicemia capilar na farmácia é exame de triagem, sem finalidade diagnóstica (RDC 978/2025, art. 60)."},{"p":"Paciente com DM2 em metformina 2.550 mg/dia traz exame com TFGe de 40 mL/min/1,73 m². Segundo a SBD 2026, o adequado é:","alt":["Manter a dose, pois a metformina não depende do rim","Suspender imediatamente e iniciar glibenclamida","Avisar o prescritor: nessa faixa, o máximo é 1.000 mg/dia","Dobrar a dose para compensar a menor filtração","Trocar por conta própria para metformina XR, mantendo a mesma dose"],"c":2,"com":"A SBD 2026 recomenda máximo de 1.000 mg/dia se TFGe \u003c 45 e suspensão se \u003c 30. A metformina é eliminada pelo rim. Glibenclamida é má escolha na DRC pelo risco de hipoglicemia prolongada. Trocas e ajustes são decisões do prescritor."},{"p":"Idosa de 80 anos com DRC usa glibenclamida e começa fluconazol para candidíase. O principal risco é:","alt":["Hipoglicemia grave e prolongada","Cetoacidose diabética","Acidose lática","Hiperglicemia por indução enzimática","Pancreatite aguda"],"c":0,"com":"O fluconazol inibe o metabolismo das sulfonilureias, e a glibenclamida já tem metabólitos ativos de eliminação renal. Idade e DRC potencializam a hipoglicemia, que pode durar horas. Acidose lática é associada à metformina; o fluconazol não é indutor."},{"p":"Homem em uso de empagliflozina, com glicemia capilar de 160 mg/dL, refere náusea, vômitos, dor abdominal e falta de ar após dois dias sem se alimentar direito. A hipótese a considerar é:","alt":["Hipoglicemia causada pelo iSGLT2 em jejum","Infecção urinária simples, que pode ser tratada no balcão","Gastrite por anti-inflamatório usado escondido","Cetoacidose euglicêmica; encaminhar com urgência","Efeito esperado nas primeiras semanas de uso"],"c":3,"com":"iSGLT2 pode causar cetoacidose com glicemia normal ou pouco elevada, desencadeada por jejum, doença aguda, desidratação ou álcool. A SBD recomenda dosar cetonas nesses casos; é urgência. Glicemia de 160 mg/dL não exclui o quadro."},{"p":"Paciente em uso de acarbose e glimepirida apresenta hipoglicemia leve, consciente. A melhor opção para correção é:","alt":["Chocolate ao leite","Açúcar comum dissolvido em água","Pão francês com manteiga","Refrigerante diet","Comprimido ou gel de glicose"],"c":4,"com":"A acarbose inibe as alfa-glicosidases, que quebram sacarose e amido; açúcar comum e pão são absorvidos lentamente. Glicose pura dispensa a quebra. Chocolate tem gordura que atrasa a absorção e refrigerante diet não tem açúcar."},{"p":"Sobre a dispensação de semaglutida em farmácia comercial, de acordo com a RDC 973/2025, é correto afirmar:","alt":["Duas vias, retenção de uma, validade de 90 dias e registro no SNGPC","Pode ser vendida sem receita a quem comprova uso anterior do produto","Exige Notificação de Receita B2, com validade de 30 dias","Basta receita simples apresentada, sem retenção nem registro","A regra vale apenas para semaglutida manipulada em farmácia"],"c":0,"com":"A RDC 973/2025 alterou a RDC 471/2021; com a IN 360/2025 (art. 2º), semaglutida, liraglutida, dulaglutida, tirzepatida e lixisenatida passaram a exigir receita em duas vias (RDC 471/2021, art. 6º), retenção da 2ª via (art. 10), validade de 90 dias (IN 360/2025, art. 2º, § 1º) e escrituração no SNGPC (art. 14), desde 23/06/2025. Não se trata de Notificação de Receita B2, não há venda sem receita e a regra não se limita a manipulados."},{"p":"Cliente iniciará tirzepatida e usa anticoncepcional oral. A orientação adequada, segundo a bula, é:","alt":["Suspender o anticoncepcional oral durante todo o tratamento semanal","Nenhuma, pois não há interação relevante","Tomar o anticoncepcional junto com a aplicação semanal","Método não oral ou adicional no início e após aumentos de dose","Dobrar a dose do anticoncepcional nas primeiras semanas"],"c":3,"com":"A tirzepatida retarda o esvaziamento gástrico e pode reduzir a absorção do anticoncepcional oral, sobretudo no início e após cada aumento de dose; a bula recomenda método adicional ou não oral nesses períodos. Dobrar dose ou suspender o anticoncepcional é inadequado."},{"p":"Paciente com DM1 relata glicemias muito instáveis. Aplica insulina sempre na mesma região do abdome e reutiliza a agulha da caneta por vários dias. A causa provável e a conduta são:","alt":["Resistência à insulina; trocar a marca da insulina","Lipo-hipertrofia; rodízio, agulha nova e aviso ao médico","Insulina vencida; descartar o frasco e comprar outro","Alergia à insulina; usar anti-histamínico antes de aplicar","Erro do glicosímetro; trocar o aparelho por outro modelo"],"c":1,"com":"Falta de rodízio e reutilização de agulhas são os principais fatores de lipo-hipertrofia (SBD), que torna a absorção errática. A conduta é evitar a área, fazer rodízio, usar agulha nova a cada aplicação e informar o médico, pois a dose pode mudar ao aplicar em pele saudável."},{"p":"Quanto tempo uma caneta de Tresiba (degludeca) em uso pode ser mantida em temperatura ambiente abaixo de 30 °C, segundo a bula?","alt":["7 dias","14 dias","28 dias","42 dias, como a glargina U300","56 dias"],"c":4,"com":"A bula da Tresiba permite até 8 semanas (56 dias) após aberta. Lantus e Humalog: 28 dias; Toujeo e Levemir: 42 dias. Os prazos variam por produto e devem ser conferidos na bula."},{"p":"Senhora em uso de levotiroxina passou a tomar carbonato de cálcio no café da manhã junto com o comprimido e o TSH subiu. A orientação correta é:","alt":["Levotiroxina em jejum; cálcio pelo menos 4 horas depois","Suspender a levotiroxina enquanto estiver usando o cálcio","Trocar a marca da levotiroxina por outra mais potente","Tomar os dois juntos, acompanhados de um copo de leite","Dobrar a dose da levotiroxina por conta própria"],"c":0,"com":"Cálcio forma complexos com a levotiroxina e reduz sua absorção; as bulas pedem intervalo de pelo menos 4 horas e tomada em jejum. Troca de marca exige reavaliação de TSH e ajuste de dose é decisão médica. Leite também reduz a absorção."},{"p":"Gestante de 8 semanas com doença de Graves precisa de antitireoidiano. O fármaco preferido nesse período e o principal alerta são:","alt":["Metimazol; sem nenhum risco conhecido na gestação","Propiltiouracil; hepatotoxicidade e agranulocitose","Levotiroxina; risco de piorar o hipertireoidismo","Propranolol isolado; controla e cura a doença","Iodo radioativo; considerado seguro em qualquer fase da gestação"],"c":1,"com":"No primeiro trimestre prefere-se o PTU, porque o metimazol está associado a malformações. O PTU tem risco de hepatotoxicidade grave e, como o metimazol, de agranulocitose. Iodo radioativo é contraindicado na gestação; propranolol só controla sintomas."},{"p":"Paciente em uso de amiodarona há um ano refere cansaço, frio e ganho de peso. A conduta adequada do farmacêutico é:","alt":["Indicar suplemento de iodo para estimular a tireoide","Orientar suspender a amiodarona imediatamente","Indicar levotiroxina sem receita para os sintomas","Sugerir chá emagrecedor e atividade física","Encaminhar ao médico para avaliar a tireoide (TSH)"],"c":4,"com":"A amiodarona, rica em iodo, pode causar hipotireoidismo ou hipertireoidismo; os sintomas sugerem hipotireoidismo e exigem TSH e avaliação médica. Suspender antiarrítmico por conta própria é perigoso, levotiroxina exige receita e iodo extra pode piorar a disfunção."}]}],"fontes":["Sociedade Brasileira de Diabetes. Diretriz da SBD, edição 2026: Metas de controle glicêmico (Almeida-Pititto B et al., doi:10.29327/5881296.2026-1). https://diretriz.diabetes.org.br/metas-de-controle-glicemico/","Sociedade Brasileira de Diabetes. Diagnóstico de diabetes mellitus (Rodacki M et al., 2024, doi:10.29327/5412848.2024-1), integrante da edição 2026. https://diretriz.diabetes.org.br/diagnostico-de-diabetes-mellitus/","Sociedade Brasileira de Diabetes. Técnicas de aplicação de insulina / Práticas seguras de preparo e aplicação (Sparapani VC et al., 2025, doi:10.29327/5660187.2025-15). https://diretriz.diabetes.org.br/praticas-seguras-para-preparo-e-aplicacao-de-insulina/","Sociedade Brasileira de Diabetes. Insulinoterapia no diabetes mellitus tipo 1 (Silva Júnior WS et al., 2023), Tabela 1. https://diretriz.diabetes.org.br/insulinoterapia-no-diabetes-mellitus-tipo-1-dm1/","Sociedade Brasileira de Diabetes. Diagnóstico e tratamento da cetoacidose diabética euglicêmica (Santomauro A et al., 2023). https://diretriz.diabetes.org.br/diagnostico-e-tratamento-da-cetoacidose-diabetica-euglicemica-cad-e/","American Diabetes Association. Standards of Care in Diabetes 2026. Diabetes Care, 2026;49(Suppl 1). Resumo das mudanças consultado em fontes secundárias.","CFF. Anvisa torna obrigatória a retenção de receita para compra de canetas emagrecedoras. 16/04/2025. https://site.cff.org.br/noticia/Noticias-gerais/16/04/2025/anvisa-torna-obrigatoria-a-retencao-de-receita-para-compra-de-canetas-emagrecedoras","Anvisa. Resolução RE nº 214, de janeiro de 2026: proibição de tirzepatida (marcas Synedica e TG) e retatrutida sem registro. Noticiado por Poder360 e Agência Brasil, 21/01/2026.","Anvisa. Registro da primeira semaglutida sintética nacional (Ozivy, EMS), maio de 2026. Noticiado por IstoÉ Dinheiro e Metrópoles, 26/05/2026.","Anvisa. Perguntas e respostas: RDC nº 978/2025, 1ª versão revisada. Gerência-Geral de Tecnologia em Serviços de Saúde, ago. 2025.","Anvisa. Resolução RDC nº 973, de 23 de abril de 2025 (altera a RDC nº 471/2021). Diário Oficial da União, 24/04/2025. Texto consolidado da RDC nº 471/2021 (arts. 6º, 9º, 10, 13 e 14) consultado em anvisalegis.datalegis.net, out. 2026.","Anvisa. Instrução Normativa nº 360, de 23 de abril de 2025 (art. 2º e § 1º: agonistas de GLP-1, receita válida por 90 dias). Diário Oficial da União, 24/04/2025. Consultada em anvisalegis.datalegis.net, out. 2026.","Anvisa. Perguntas & Respostas: mudanças na comercialização e escrituração de medicamentos agonistas do receptor do GLP-1 (RDC nº 471/2021 e IN nº 360/2025), 1ª edição, versão 0.1, 30/06/2025. https://www.gov.br/anvisa/pt-br/centraisdeconteudo/publicacoes/monitoramento/farmacovigilancia/perguntas-e-respostas/perguntas-respostas-mudancas-na-comercializacao-e-escrituracao-dos-medicamentos-inibidores-glp-1","CFF. Anvisa estabelece novas regras para prescrição e dispensação de medicamentos agonistas de GLP-1. 16/01/2026. https://site.cff.org.br/noticia/Noticias-gerais/16/01/2026/anvisa-estabelece-novas-regras-para-prescricao-e-dispensacao-de-medicamentos-agonistas-de-glp-1","Anvisa. Resolução RDC nº 44/2009, texto consolidado (art. 69, § 1º; art. 70 revogado e art. 81, § 2º, I, d, com redação da RDC nº 786/2023). Consultada em anvisalegis.datalegis.net, out. 2026.","Anvisa. Resolução RDC nº 978, de 6 de junho de 2025, texto consolidado com as alterações das RDC nº 986/2025 e nº 1.043/2026 (arts. 4º, 8º, 10, 11, 60, 63 e 115). Consultada em anvisalegis.datalegis.net, out. 2026.","Anvisa. Resolução-RE nº 1.041/2026: registro de Mounjaro (tirzepatida) em caneta multidose. Noticiado pela imprensa (ICTQ, Afya, Metrópoles), março de 2026.","Sociedade Brasileira de Diabetes. Tratamento do DM2 no Sistema Único de Saúde (SUS). Diretriz SBD, edição 2026 (doi:10.29327/5937204.2026-1).","Bulas do profissional, Novo Nordisk Brasil (novonordisk.com.br, consultadas em out. 2026): Ozempic 0,25/0,5 mg e 1 mg (v. 03, EU-PI 20251203), Wegovy (v. 1.0, 2026), Rybelsus 3, 7 e 14 mg (v. 2.0), Victoza, Saxenda, NovoRapid, Fiasp, Novolin R e Novolin N (frasco, FlexPen e Penfill), Levemir Penfill, Tresiba Penfill e FlexTouch, GlucaGen HypoKit.","Bulas do profissional, Eli Lilly do Brasil (lilly.com/br, consultadas em out. 2026): Mounjaro caneta de uso único (abr. 2026), Trulicity, Humalog KwikPen, Humulin R (frasco e refil), Humulin N refil, Basaglar (refil e KwikPen).","Bulas reproduzidas em bula.com.br (consultadas em 2026 e out. 2026): Lantus, Apidra, Toujeo, Puran T4, Synthroid, Jardiance, Glifage, Diamicron MR, Daonil, Amaryl, NovoNorm, Januvia, Galvus, Trayenta, Forxiga, Actos, Glucobay, Euthyrox."]},{"id":"m06","num":6,"titulo":"AINEs, corticosteroides e antialérgicos","escopo":"Inflamação e cicloxigenases, AINEs e analgésicos (riscos gastrointestinal, renal, cardiovascular, asma, gestação e dengue), corticosteroides sistêmicos e tópicos, anti-histamínicos e conduta na anafilaxia no balcão. Fontes principais: lista de MIP (IN 285/2024, redação da IN 404/2025), alerta FDA 2020 sobre AINE na gestação, EMA 2012 e bulas brasileiras (nimesulida), manual de dengue do Ministério da Saúde (6ª ed., 2024), PCDT da Asma 2026, WAO 2020, diretriz internacional de urticária 2022 e ASBAI/Anvisa 2026 (autoinjetor).","cor":"#F76E1E","icone":"flame","curto":"AINEs, corticoides e alergia","topicos":[{"id":"m06-inflamacao","titulo":"Inflamação, prostaglandinas e cicloxigenases","resumo":"\u003cp>Inflamação é a resposta do tecido a uma agressão (trauma, infecção, irritante químico, reação imune). Ela serve para conter o dano e iniciar o reparo, mas produz os sinais que levam o cliente à farmácia: \u003cstrong>dor, calor, vermelhidão, inchaço e perda de função\u003c/strong>. Boa parte desses sinais depende de mediadores lipídicos formados no próprio local, e o principal grupo deles são as prostaglandinas.\u003c/p> \u003ch3>Da membrana celular às prostaglandinas\u003c/h3> \u003cp>Quando a célula é agredida, a enzima fosfolipase A2 libera ácido araquidônico dos fosfolipídios da membrana. Esse ácido segue por dois caminhos principais:\u003c/p> \u003cul> \u003cli>\u003cb>Via da cicloxigenase (COX)\u003c/b>: forma prostaglandinas (PGE2, PGI2 ou prostaciclina, PGD2, PGF2-alfa) e tromboxano A2.\u003c/li> \u003cli>\u003cb>Via da lipoxigenase\u003c/b>: forma leucotrienos, que contraem o brônquio e aumentam a secreção de muco. Essa via explica por que alguns asmáticos pioram com AINE (o bloqueio da COX desvia o ácido araquidônico para os leucotrienos) e é o alvo do montelucaste (módulo 7).\u003c/li> \u003c/ul> \u003cp>As prostaglandinas sensibilizam as terminações nervosas (a dor fica mais intensa ao toque), dilatam vasos (calor e vermelhidão), aumentam a permeabilidade (edema) e, no hipotálamo, elevam o ponto de ajuste da temperatura (febre). Bloquear a COX reduz tudo isso de uma vez, e é por isso que o mesmo AINE é analgésico, antitérmico e anti-inflamatório.\u003c/p> \u003ch3>COX-1 e COX-2\u003c/h3> \u003cp>Existem duas isoformas de interesse clínico. A diferença entre elas explica quase todos os efeitos adversos dos AINEs.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Aspecto\u003c/th>\u003cth>COX-1\u003c/th>\u003cth>COX-2\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Expressão\u003c/td>\u003ctd>Constitutiva (sempre presente)\u003c/td>\u003ctd>Induzida na inflamação; constitutiva em rim, endotélio, cérebro e útero\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Estômago\u003c/td>\u003ctd>Mantém muco, bicarbonato e fluxo sanguíneo da mucosa\u003c/td>\u003ctd>Participa da cicatrização de úlceras\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Plaquetas\u003c/td>\u003ctd>Produz tromboxano A2 (agrega e contrai vaso)\u003c/td>\u003ctd>Não há COX-2 relevante na plaqueta\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Endotélio\u003c/td>\u003ctd>Pouca contribuição\u003c/td>\u003ctd>Produz prostaciclina (vasodilata e inibe agregação)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Rim\u003c/td>\u003ctd>Fluxo renal e filtração\u003c/td>\u003ctd>Fluxo renal, excreção de sódio e renina\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Bloqueio causa\u003c/td>\u003ctd>Lesão gástrica, sangramento\u003c/td>\u003ctd>Analgesia e anti-inflamação; retenção de sódio; desequilíbrio pró-trombótico\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>O raciocínio prático é este: o AINE que bloqueia muito a COX-1 agride mais o estômago e prolonga o sangramento; o que poupa a COX-1 (coxibe) protege o estômago, mas deixa o tromboxano das plaquetas agir sem o contrapeso da prostaciclina endotelial, o que aumenta o risco de trombose. Nenhuma das duas escolhas poupa o rim, porque as duas isoformas participam da perfusão renal.\u003c/p> \u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Todo AINE, seletivo ou não, pode causar lesão renal, retenção de sódio, aumento da pressão arterial e eventos cardiovasculares. A seletividade para COX-2 muda o risco gastrointestinal, não elimina os outros.\u003c/p>\u003c/div> \u003ch3>O caso particular do ácido acetilsalicílico\u003c/h3> \u003cp>O ácido acetilsalicílico (AAS) acetila a COX de forma \u003cstrong>irreversível\u003c/strong>. Como a plaqueta não tem núcleo e não fabrica enzima nova, o efeito antiagregante dura o tempo de vida dela (cerca de 7 a 10 dias). Em dose baixa (75 a 100 mg/dia), o AAS é usado como antiagregante; em dose analgésica (500 mg ou mais por tomada) age como AINE, com todos os riscos da classe. Alguns AINEs reversíveis, como o ibuprofeno, ocupam o sítio da COX-1 e podem atrapalhar a acetilação pelo AAS quando tomados antes dele. Paciente em AAS para prevenção cardiovascular que precisa de analgésico frequente deve ter o caso discutido com o prescritor; no balcão, a opção mais segura para dor leve costuma ser paracetamol ou dipirona.\u003c/p> \u003ch3>Analgésicos sem ação anti-inflamatória relevante\u003c/h3> \u003cp>\u003cstrong>Paracetamol\u003c/strong> e \u003cstrong>dipirona\u003c/strong> reduzem dor e febre com eficácia, mas quase não têm efeito anti-inflamatório periférico na dose usual. O paracetamol age sobretudo no sistema nervoso central e perde potência em ambiente com muitos peróxidos (tecido inflamado). A dipirona tem mecanismo central e periférico ainda discutido, com efeito espasmolítico útil em cólica. Por isso não causam a lesão gástrica típica dos AINEs nem interferem de forma importante na agregação plaquetária, o que os torna a escolha para dor e febre em dengue, em gestantes (paracetamol) e em pacientes anticoagulados.\u003c/p>  \u003ch3>Inflamação aguda, crônica e tipos de dor\u003c/h3> \u003cp>A inflamação aguda dura horas a dias, é dominada por edema e neutrófilos e costuma ceder sozinha quando a causa é removida (entorse, dor de garganta viral, dor pós-extração dentária). A inflamação crônica dura semanas a anos, envolve linfócitos e macrófagos, destrói tecido e tem tratamento de base específico (artrite reumatoide, doenças inflamatórias intestinais, asma). No balcão, o AINE serve para alívio de curto prazo na inflamação aguda; inflamação persistente pede diagnóstico.\u003c/p> \u003cp>Também importa distinguir o tipo de dor. A \u003cstrong>dor nociceptiva inflamatória\u003c/strong> (entorse, cólica menstrual, dor dentária, artrose em crise) responde bem a AINE, porque as prostaglandinas participam da sensibilização. A dor neuropática (queimação, choque, formigamento, como na neuropatia diabética ou na neuralgia pós-herpética) responde mal a AINE e a analgésicos simples e precisa de avaliação médica. A cefaleia tensional e a febre respondem tão bem a analgésico simples quanto a AINE.\u003c/p> \u003cp>Na cólica menstrual primária, o útero produz prostaglandinas em excesso; por isso AINE iniciado no começo do fluxo (ibuprofeno, naproxeno, cetoprofeno) costuma ser mais eficaz que analgésico simples. Já na dor de cabeça diária, o uso de qualquer analgésico em mais de 10 a 15 dias por mês pode causar cefaleia por uso excessivo de medicamento, motivo de encaminhamento.\u003c/p> \u003ch3>Febre\u003c/h3> \u003cp>Febre é a elevação regulada da temperatura pelo hipotálamo, mediada por PGE2. Ela não é doença e, por si, raramente causa dano. O antitérmico serve para dar conforto. O que pede atenção é o contexto: febre em bebê com menos de 3 meses, febre com rigidez de nuca, manchas que não somem à pressão, prostração, falta de ar, febre por mais de 3 dias ou suspeita de dengue exigem avaliação.\u003c/p>  \u003ch3>Outros mediadores e o lugar de cada classe\u003c/h3> \u003cp>Prostaglandinas não agem sozinhas. Histamina (liberada por mastócitos) causa coceira e edema imediato; bradicinina causa dor e vasodilatação; leucotrienos contraem brônquios; citocinas como interleucina 1, interleucina 6 e fator de necrose tumoral sustentam a inflamação e a febre. Isso explica as diferenças entre as classes deste módulo:\u003c/p> \u003cul> \u003cli>\u003cb>AINE\u003c/b> bloqueia apenas a COX: reduz prostaglandinas e tromboxano, sem efeito sobre histamina, leucotrienos ou citocinas.\u003c/li> \u003cli>\u003cb>Corticoide\u003c/b> atua acima, na transcrição de genes: reduz a expressão de COX-2, de citocinas e a migração de células. Tem efeito mais amplo e mais lento, com mais efeitos adversos.\u003c/li> \u003cli>\u003cb>Anti-histamínico\u003c/b> bloqueia só o receptor H1: ótimo para coceira, urticária e espirros, inútil para dor inflamatória.\u003c/li> \u003c/ul> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de indicar qualquer analgésico, pergunte: idade, gestação, uso de anticoagulante ou AAS, histórico de úlcera ou sangramento, doença renal ou cardíaca, asma, febre com suspeita de dengue e alergias a medicamentos. Para dor sem sinal inflamatório (cefaleia tensional, febre de resfriado), analgésico simples resolve e expõe menos o paciente.\u003c/p>\u003c/div>"},{"id":"m06-aines","titulo":"Anti-inflamatórios não esteroides","resumo":"\u003cp>Os anti-inflamatórios não esteroides (AINEs) estão entre os medicamentos mais vendidos e mais pedidos sem receita no Brasil. A condição de venda depende do fármaco, da forma farmacêutica e da concentração. Na Lista de Medicamentos Isentos de Prescrição (IN 285/2024, Anexo I, na redação da IN 404/2025) estão, entre outros, ibuprofeno oral até 400 mg por unidade, naproxeno 500 mg, naproxeno sódico 550 mg, AAS 500 mg e AINEs tópicos como diclofenaco gel e nimesulida gel 20 mg/g. Diclofenaco, cetoprofeno, nimesulida, piroxicam, meloxicam e coxibes por via oral não constam da lista e são vendidos sob prescrição (tarja vermelha, sem retenção). A isenção só vale para produto com o mesmo fármaco, forma farmacêutica e indicação, em concentração igual ou menor que a da linha da lista (IN 285/2024, art. 1º, § 2º, I). A responsabilidade do farmacêutico vai além da tarja: o risco do AINE depende do paciente.\u003c/p> \u003ch3>Classes e representantes\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Grupo\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Observação prática\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Derivados do ácido propiônico\u003c/td>\u003ctd>Ibuprofeno, naproxeno, cetoprofeno\u003c/td>\u003ctd>Ibuprofeno em dose baixa tem o menor risco GI entre os não seletivos; naproxeno tem meia-vida longa (2 tomadas/dia)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Derivados do ácido acético\u003c/td>\u003ctd>Diclofenaco, indometacina, cetorolaco\u003c/td>\u003ctd>Diclofenaco tem risco cardiovascular comparável ao dos coxibes; cetorolaco é potente e restrito a uso curto\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Oxicans\u003c/td>\u003ctd>Piroxicam, meloxicam, tenoxicam\u003c/td>\u003ctd>Meia-vida longa (dose única diária); piroxicam com maior risco GI e cutâneo\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Sulfonanilida\u003c/td>\u003ctd>Nimesulida\u003c/td>\u003ctd>Preferência por COX-2; hepatotoxicidade\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Coxibes (seletivos de COX-2)\u003c/td>\u003ctd>Celecoxibe, etoricoxibe\u003c/td>\u003ctd>Menos úlcera; risco cardiovascular e renal mantido\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>As doses usuais e máximas estão na tabela do material de apoio. Regra geral: \u003cstrong>menor dose eficaz, pelo menor tempo\u003c/strong>, sem associar dois AINEs (somar dois AINEs soma toxicidade, não eficácia).\u003c/p> \u003ch3>Nimesulida\u003c/h3> \u003cp>A nimesulida é muito usada no Brasil, mas não é comercializada nos Estados Unidos e foi retirada ou restringida em alguns países europeus a partir de 2002, por casos de hepatite grave, alguns com necessidade de transplante. Na União Europeia, a Agência Europeia de Medicamentos (EMA, 2012) manteve o produto com restrições: uso de segunda linha, no máximo 100 mg duas vezes ao dia por até 15 dias, contraindicação em hepatopatia, etilismo e menores de 12 anos. No Brasil, a nimesulida oral segue registrada e é de \u003cstrong>venda sob prescrição médica\u003c/strong>; só o gel dermatológico de 20 mg/g está na lista de MIP (IN 285/2024). As bulas brasileiras indicam 50 a 100 mg duas vezes ao dia, admitem até 200 mg duas vezes ao dia em casos excepcionais indicados pelo médico, pelo menor tempo possível, e contraindicam o uso em menores de 12 anos, na insuficiência hepática, na insuficiência renal grave e na amamentação (bulas de Nimesilam®, EMS, e Inflalid®, Legrand, 2019).\u003c/p> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Orientar o cliente em uso de nimesulida a suspender o medicamento e procurar atendimento se surgirem urina escura, olhos ou pele amarelados, náusea persistente, dor no lado direito do abdome ou cansaço intenso. Evitar associação com álcool, paracetamol em dose alta e outros fármacos hepatotóxicos.\u003c/p>\u003c/div> \u003ch3>Risco gastrointestinal e gastroproteção\u003c/h3> \u003cp>A lesão vai de dispepsia e erosões até úlcera com sangramento ou perfuração, muitas vezes \u003cstrong>sem dor prévia\u003c/strong>, sobretudo em idosos. O risco cresce com a dose, a duração, a meia-vida longa e a seletividade para COX-1. Fatores que aumentam o risco:\u003c/p> \u003cul> \u003cli>idade de 65 anos ou mais;\u003c/li> \u003cli>úlcera péptica prévia, principalmente complicada (sangramento, perfuração);\u003c/li> \u003cli>uso simultâneo de anticoagulante, antiagregante (inclusive AAS em dose baixa), corticoide sistêmico ou antidepressivo ISRS/IRSN;\u003c/li> \u003cli>dose alta ou uso de mais de um AINE;\u003c/li> \u003cli>infecção por \u003ci>Helicobacter pylori\u003c/i>, etilismo, doença grave associada.\u003c/li> \u003c/ul> \u003cp>Quem precisa de gastroproteção: paciente que vai usar AINE de forma regular e tem ao menos um desses fatores. A estratégia mais usada é associar um inibidor da bomba de prótons (por exemplo, omeprazol 20 mg uma vez ao dia, em jejum) ou trocar por coxibe; no risco muito alto (úlcera com sangramento recente), o ideal é evitar AINE. Antiácido e antagonista H2 em dose usual não previnem a úlcera do AINE; apenas aliviam sintomas e podem mascarar o problema. Uso pontual de um ou dois dias em adulto jovem sem fatores de risco não exige gastroproteção.\u003c/p> \u003ch3>Rim\u003c/h3> \u003cp>Em pessoa saudável e hidratada, o rim depende pouco das prostaglandinas. Quando o volume circulante cai (desidratação, vômitos, diarreia, insuficiência cardíaca, cirrose, doença renal crônica, idoso), as prostaglandinas passam a manter a filtração. O AINE retira esse suporte e pode causar \u003cstrong>lesão renal aguda\u003c/strong>, além de hipercalemia, retenção de sódio e edema. A combinação de AINE com IECA ou BRA e diurético é conhecida como \"tríplice ameaça\" para o rim. A função renal deve ser estimada pela TFG calculada por CKD-EPI 2021; com TFG abaixo de 30 mL/min/1,73 m², AINE sistêmico deve ser evitado.\u003c/p> \u003ch3>Coração e pressão arterial\u003c/h3> \u003cp>AINEs (exceto o AAS em dose baixa) aumentam o risco de infarto e AVC, com efeito que pode surgir já nas primeiras semanas e cresce com a dose (alerta reforçado pela FDA em 2015). O risco é maior com coxibes e diclofenaco; o naproxeno parece ter o menor risco cardiovascular entre os AINEs, à custa de maior risco GI. Também elevam a pressão arterial, reduzem o efeito de anti-hipertensivos e descompensam a insuficiência cardíaca por retenção de sódio e água. Hipertenso com pressão controlada pode usar AINE por poucos dias com vigilância; insuficiência cardíaca e infarto recente são situações para evitar.\u003c/p> \u003ch3>Asma e AINE\u003c/h3> \u003cp>Uma parcela dos adultos asmáticos tem doença respiratória exacerbada por AINE: asma, rinossinusite crônica com pólipos nasais e crises de broncoespasmo, congestão e rubor facial após AAS ou qualquer AINE que iniba COX-1. A reação é cruzada entre os AINEs não seletivos. Coxibes costumam ser tolerados e o paracetamol em dose habitual geralmente é seguro, mas a liberação é decisão médica. Asmático que nunca teve reação pode usar AINE; asmático com pólipo nasal ou reação prévia não deve receber AINE no balcão.\u003c/p> \u003ch3>Gestação\u003c/h3> \u003cp>Em 15 de outubro de 2020, a FDA recomendou \u003cstrong>evitar AINEs a partir de 20 semanas de gestação\u003c/strong>, porque o uso pode causar disfunção renal fetal e oligoâmnio (pouco líquido amniótico), relatado, raramente, já 48 horas após o início do uso. Se o médico julgar o uso necessário entre 20 e 30 semanas, a orientação é menor dose e menor tempo, com ultrassom se passar de 48 horas. A partir de 30 semanas, o AINE deve ser evitado pelo risco de fechamento precoce do canal arterial fetal, hipertensão pulmonar neonatal, prolongamento do trabalho de parto e sangramento. As exceções do alerta são o AAS em dose baixa (81 mg nos Estados Unidos), usado sob orientação do profissional de saúde em certas condições da gestação, e os AINEs aplicados no olho (atualização da FDA de 16/10/2020). O alerta também levou à revisão do rótulo dos AINEs de venda livre para adultos nos Estados Unidos. No primeiro trimestre, alguns estudos observacionais associam AINE a aborto espontâneo. Na prática do balcão: gestante com dor ou febre recebe paracetamol e orientação, não AINE.\u003c/p> \u003ch3>Dengue\u003c/h3> \u003cp>Na suspeita de dengue (febre alta de início súbito, dor no corpo, dor atrás dos olhos, manchas na pele), o manual do Ministério da Saúde orienta não utilizar salicilatos (AAS), anti-inflamatórios não esteroides e corticosteroides (Dengue: diagnóstico e manejo clínico, adulto e criança, 6ª ed., 2024). AAS e AINEs reduzem a função das plaquetas e aumentam o risco de hemorragia digestiva. Para dor e febre, o manual indica dipirona (adulto: 500 mg até de 6 em 6 horas) ou paracetamol (adulto: 500 mg de 4 em 4 horas ou 1 g de 6 em 6 horas, sem passar de 4 g em 24 horas), com hidratação oral abundante e procura da unidade de saúde. A mesma cautela vale para febre aguda em época de epidemia quando a dengue ainda não foi descartada.\u003c/p> \u003ch3>Interações de maior risco\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>AINE associado a\u003c/th>\u003cth>Consequência\u003c/th>\u003cth>Conduta\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Varfarina, DOAC (rivaroxabana, apixabana, dabigatrana)\u003c/td>\u003ctd>Sangramento, sobretudo GI\u003c/td>\u003ctd>Evitar; usar paracetamol ou dipirona\u003c/td>\u003c/tr> \u003ctr>\u003ctd>AAS, clopidogrel\u003c/td>\u003ctd>Sangramento; ibuprofeno pode reduzir efeito do AAS\u003c/td>\u003ctd>Evitar uso regular; discutir com prescritor\u003c/td>\u003c/tr> \u003ctr>\u003ctd>ISRS, IRSN (sertralina, fluoxetina, venlafaxina)\u003c/td>\u003ctd>Sangramento GI\u003c/td>\u003ctd>Evitar ou associar IBP\u003c/td>\u003c/tr> \u003ctr>\u003ctd>IECA, BRA, diuréticos\u003c/td>\u003ctd>Lesão renal aguda, hipercalemia, perda do controle pressórico\u003c/td>\u003ctd>Evitar uso prolongado; hidratação; monitorar\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Lítio\u003c/td>\u003ctd>Aumento da litemia e intoxicação\u003c/td>\u003ctd>Evitar; se inevitável, litemia\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Metotrexato\u003c/td>\u003ctd>Redução da depuração e toxicidade (medula, rim)\u003c/td>\u003ctd>Evitar em dose alta; em dose semanal baixa, só com aval médico\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Corticoide sistêmico\u003c/td>\u003ctd>Úlcera e sangramento\u003c/td>\u003ctd>Gastroproteção se uso conjunto\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Álcool\u003c/td>\u003ctd>Lesão gástrica; hepatotoxicidade com nimesulida\u003c/td>\u003ctd>Orientar abstenção\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>AINE tópico\u003c/h3> \u003cp>Gel ou emplastro de diclofenaco, cetoprofeno ou piroxicam alcançam concentração sistêmica muito menor. São boa opção para dor musculoesquelética localizada (entorse, tendinite, artrose de joelho e mão), principalmente em idosos e em quem tem risco GI ou renal. Não aplicar em pele lesada, evitar exposição solar sobre a área com cetoprofeno (fotossensibilidade) e lavar as mãos depois.\u003c/p>  \u003ch3>Dipirona e paracetamol\u003c/h3> \u003cp>Os dois são analgésicos e antitérmicos de primeira escolha para dor leve a moderada e febre, sem ação anti-inflamatória relevante nas doses usuais.\u003c/p> \u003cul> \u003cli>\u003cb>Paracetamol\u003c/b> (Tylenol®): adulto, 500 mg a 1 g a cada 4 a 6 horas, sem passar de 1 g por dose nem de 4 g em 24 horas em adulto saudável (bula do Tylenol® 750 mg). É MIP (IN 285/2024). Em superdose, o metabólito tóxico (NAPQI) esgota a glutationa do fígado e causa necrose hepática, que pode aparecer só 2 a 3 dias depois de uma ingestão aparentemente sem sintomas. Etilistas, desnutridos, hepatopatas e usuários de indutores enzimáticos têm risco com doses menores; o teto é definido pelo prescritor. O maior perigo do balcão é a \u003cstrong>duplicação\u003c/strong>: o cliente toma paracetamol e, ao mesmo tempo, um antigripal que também contém paracetamol.\u003c/li> \u003cli>\u003cb>Dipirona\u003c/b> (Novalgina®): adulto e adolescente acima de 15 anos, 500 mg a 1 g até 4 vezes ao dia, máximo de 4 g/dia (bulas de dipirona monoidratada 1 g). É MIP em comprimido de até 1 g, solução oral de 500 mg/mL e supositório (IN 285/2024) e tem bom efeito em cólica. O efeito adverso mais temido é a agranulocitose, rara e imprevisível; febre, dor de garganta e aftas durante o uso pedem hemograma. Pode causar hipotensão (sobretudo por via injetável) e reações alérgicas. Na gestação, a bula restringe o uso, sobretudo no terceiro trimestre; a decisão é do prescritor.\u003c/li> \u003c/ul> \u003ch3>Criança\u003c/h3> \u003cp>Para febre e dor em criança, as opções do balcão são paracetamol, dipirona e ibuprofeno, sempre em dose por peso, com a apresentação pediátrica e a seringa ou o conta-gotas que acompanha o produto. O ibuprofeno é usado a partir de 6 meses na dose de 5 a 10 mg/kg por tomada a cada 6 a 8 horas (máximo de 40 mg/kg/dia); o paracetamol, na dose de 10 a 15 mg/kg por tomada, com intervalo mínimo de 4 a 6 horas e no máximo 5 tomadas em 24 horas. Erros comuns: confundir gotas com mL, alternar dois antitérmicos sem necessidade e dar AINE para criança desidratada (vômito ou diarreia), situação em que o risco de lesão renal aumenta. AAS é contraindicado em criança e adolescente com quadro viral pelo risco de síndrome de Reye.\u003c/p>  \u003ch3>Pedidos frequentes no balcão\u003c/h3> \u003cul> \u003cli>\u003cb>Entorse e dor muscular\u003c/b>: repouso relativo, gelo nas primeiras 48 horas, AINE tópico ou oral por 3 a 5 dias. Encaminhar se não consegue apoiar o pé, se há deformidade ou se a dor não cede em uma semana.\u003c/li> \u003cli>\u003cb>Cólica menstrual\u003c/b>: AINE iniciado no começo do fluxo, por 2 a 3 dias. Cólica que mudou de padrão, sangramento muito aumentado, dor fora do período menstrual ou dor que não responde merecem avaliação ginecológica.\u003c/li> \u003cli>\u003cb>Dor de garganta\u003c/b>: analgésico simples ou AINE, hidratação e pastilhas. Febre alta com placas, dificuldade para engolir saliva ou abrir a boca pedem avaliação médica; antibiótico não é dispensado sem receita.\u003c/li> \u003cli>\u003cb>Dor de dente\u003c/b>: analgesia temporária e encaminhamento ao dentista; AINE controla a dor, mas não trata a causa.\u003c/li> \u003cli>\u003cb>Crise de gota\u003c/b>: articulação muito vermelha e dolorosa (comum no dedão do pé). O tratamento (AINE em dose plena, colchicina ou corticoide) é prescrito; AINE é evitado em doença renal, que é comum nesses pacientes.\u003c/li> \u003cli>\u003cb>Dor lombar aguda\u003c/b>: manter-se ativo, calor local, analgésico ou AINE por poucos dias. Dor com perda de força nas pernas, alteração urinária ou intestinal, febre ou história de câncer exige avaliação imediata.\u003c/li> \u003c/ul>  \u003ch3>Como escolher entre os AINEs\u003c/h3> \u003cp>Quando um AINE é adequado, a escolha segue o perfil de risco. Paciente jovem sem fatores de risco: ibuprofeno ou naproxeno em dose baixa, por poucos dias. Risco gastrointestinal aumentado sem risco cardiovascular: coxibe ou AINE não seletivo com inibidor da bomba de prótons, por prescrição. Risco cardiovascular aumentado (infarto ou AVC prévio, insuficiência cardíaca): evitar AINE sistêmico; se indispensável, o prescritor tende a preferir naproxeno em dose baixa com gastroproteção. Doença renal com TFG reduzida, gestação a partir de 20 semanas, dengue e anticoagulação: preferir analgésico simples e medidas não farmacológicas. Dor localizada em articulação superficial: AINE tópico antes do oral.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Antes de dispensar AINE, confira: gestação (e idade gestacional), suspeita de dengue, uso de anticoagulante, AAS, ISRS, anti-hipertensivo, lítio ou metotrexato, úlcera prévia, doença renal ou cardíaca, asma com pólipo nasal. Oriente tomar após refeição, não associar outro AINE (inclusive os escondidos em antigripais) e procurar atendimento se fezes pretas, vômito com sangue, inchaço nas pernas ou falta de ar.\u003c/p>\u003c/div> \u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Senhor de 72 anos, em uso de losartana, hidroclorotiazida e AAS 100 mg, pede \"um anti-inflamatório forte\" para dor no joelho. O farmacêutico identifica três fatores de risco (idade, AAS, combinação anti-hipertensiva com diurético), indica paracetamol em horário fixo e diclofenaco gel no joelho, orienta compressa e encaminha ao médico se a dor persistir por mais de 7 dias ou houver inchaço e calor na articulação.\u003c/p>\u003c/div>"},{"id":"m06-corticoides-sistemicos","titulo":"Corticosteroides sistêmicos","resumo":"\u003cp>Corticosteroides (ou glicocorticoides) são análogos sintéticos do cortisol, o hormônio produzido pela suprarrenal sob comando do eixo hipotálamo-hipófise-adrenal (HHA). São os anti-inflamatórios e imunossupressores mais potentes disponíveis e aparecem diariamente no balcão: prednisona para crise de asma, dexametasona em associação com anti-histamínico, betametasona injetável de depósito, prednisolona em gotas para criança. Todos os corticoides orais e injetáveis são de venda sob prescrição.\u003c/p> \u003ch3>Mecanismo de ação\u003c/h3> \u003cp>O corticoide atravessa a membrana e se liga ao receptor de glicocorticoide no citoplasma. O complexo entra no núcleo e:\u003c/p> \u003cul> \u003cli>\u003cb>reprime genes inflamatórios\u003c/b> (inibe fatores de transcrição como NF-kappa-B e AP-1): cai a produção de citocinas, da COX-2, de moléculas de adesão e a migração de leucócitos;\u003c/li> \u003cli>\u003cb>ativa genes\u003c/b> de proteínas anti-inflamatórias e também de enzimas metabólicas, origem de boa parte dos efeitos adversos (hiperglicemia, catabolismo de proteína, perda óssea).\u003c/li> \u003c/ul> \u003cp>Como o efeito depende de transcrição gênica, ele demora algumas horas para aparecer (os efeitos principais surgem após 4 a 6 horas, segundo o PCDT da Asma, 2026). Por isso o corticoide fica fora da fase de emergência do choque anafilático e do broncoespasmo grave; sua função é conter a continuidade da inflamação.\u003c/p> \u003ch3>Equivalência, potência e duração\u003c/h3> \u003cp>Os corticoides diferem em potência glicocorticoide (anti-inflamatória), atividade mineralocorticoide (retenção de sódio e perda de potássio) e duração do efeito biológico (supressão do eixo HHA). A tabela de equivalência é usada para trocar um corticoide por outro e para comparar doses.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fármaco\u003c/th>\u003cth>Dose equivalente\u003c/th>\u003cth>Potência glicocorticoide\u003c/th>\u003cth>Potência mineralocorticoide\u003c/th>\u003cth>Duração\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Hidrocortisona\u003c/td>\u003ctd>20 mg\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>Curta (8 a 12 h)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Prednisona\u003c/td>\u003ctd>5 mg\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0,8\u003c/td>\u003ctd>Intermediária (12 a 36 h)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Prednisolona\u003c/td>\u003ctd>5 mg\u003c/td>\u003ctd>4\u003c/td>\u003ctd>0,8\u003c/td>\u003ctd>Intermediária (12 a 36 h)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Metilprednisolona\u003c/td>\u003ctd>4 mg\u003c/td>\u003ctd>5\u003c/td>\u003ctd>Mínima\u003c/td>\u003ctd>Intermediária (12 a 36 h)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dexametasona\u003c/td>\u003ctd>0,75 mg\u003c/td>\u003ctd>25 a 30\u003c/td>\u003ctd>Desprezível\u003c/td>\u003ctd>Longa (36 a 72 h)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Betametasona\u003c/td>\u003ctd>0,6 a 0,75 mg\u003c/td>\u003ctd>25 a 30\u003c/td>\u003ctd>Desprezível\u003c/td>\u003ctd>Longa (36 a 72 h)\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>Os valores são aproximados e variam um pouco entre as fontes (tabela de Liu e colaboradores, 2013). Exemplo: 40 mg de prednisona equivalem a cerca de 6 mg de dexametasona ou 32 mg de metilprednisolona. A prednisona é pró-fármaco convertida em prednisolona no fígado; em hepatopatia grave, prefere-se prednisolona. Hidrocortisona é o corticoide de reposição na insuficiência adrenal porque tem ação mineralocorticoide; dexametasona e betametasona são escolhidas quando se quer efeito potente, longo e sem retenção de sódio (por exemplo, edema cerebral, maturação pulmonar fetal), mas suprimem mais o eixo.\u003c/p> \u003ch3>Efeitos adversos\u003c/h3> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Curto prazo (dias)\u003c/th>\u003cth>Longo prazo (semanas a meses)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Hiperglicemia, sobretudo à tarde\u003c/td>\u003ctd>Síndrome de Cushing (face em lua cheia, gordura central, estrias violáceas)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Insônia, euforia, irritabilidade, raramente psicose\u003c/td>\u003ctd>Osteoporose e fraturas; necrose avascular da cabeça do fêmur\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Aumento do apetite, retenção hídrica\u003c/td>\u003ctd>Diabetes, hipertensão, dislipidemia\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Elevação da pressão arterial\u003c/td>\u003ctd>Catarata subcapsular posterior e glaucoma\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Dispepsia (maior risco de úlcera com AINE)\u003c/td>\u003ctd>Miopatia proximal, pele fina, equimoses, má cicatrização\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Leucocitose sem infecção\u003c/td>\u003ctd>Infecções (inclusive reativação de tuberculose e estrongiloidíase disseminada)\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Hipocalemia (maior com hidrocortisona)\u003c/td>\u003ctd>Supressão do eixo HHA; atraso do crescimento em criança\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003ch3>Supressão do eixo e desmame\u003c/h3> \u003cp>O corticoide exógeno desliga o eixo HHA. Depois de algumas semanas, a suprarrenal reduz sua produção e, se o medicamento for interrompido de repente, falta cortisol: fraqueza, náusea, hipotensão, hipoglicemia e, no extremo, crise adrenal. O risco depende da dose, da duração, do horário e do corticoide.\u003c/p> \u003cul> \u003cli>\u003cb>Curso curto\u003c/b> (menos de 2 semanas, como na crise de asma): não precisa desmame; pode parar de uma vez (PCDT da Asma, 2026, com base na GINA).\u003c/li> \u003cli>\u003cb>Uso por 3 semanas ou mais\u003c/b>, dose de prednisona de 20 mg/dia ou mais por algumas semanas, uso noturno, sinais de Cushing ou cursos repetidos: considerar o eixo suprimido; a retirada é gradual e definida pelo prescritor.\u003c/li> \u003cli>Paciente em uso crônico \u003cb>não deve parar por conta própria\u003c/b> e precisa avisar em cirurgia, infecção grave ou trauma (pode precisar de dose de estresse).\u003c/li> \u003c/ul> \u003ch3>Horário, diabetes e hipertensão\u003c/h3> \u003cp>O cortisol natural tem pico no início da manhã. Tomar o corticoide em \u003cstrong>dose única pela manhã\u003c/strong>, junto com o café da manhã, imita esse ritmo, suprime menos o eixo, reduz a insônia e diminui a irritação gástrica. Quando a dose é dividida, a maior parte vai de manhã.\u003c/p> \u003cp>Em diabéticos, a prednisona tomada de manhã eleva principalmente a glicemia da tarde e da noite; a glicemia de jejum pode parecer normal e enganar. Orientar automonitorização mais frequente (incluindo antes do jantar) e contato com o médico se valores altos persistirem, porque pode ser preciso ajustar insulina ou antidiabético. Em hipertensos, monitorar pressão, reduzir sal e observar edema. Em ambos, cursos curtos costumam ser seguros com vigilância.\u003c/p> \u003ch3>Interações e situações especiais\u003c/h3> \u003cul> \u003cli>\u003cb>AINE\u003c/b>: soma risco de úlcera; associar gastroproteção quando o uso conjunto for necessário.\u003c/li> \u003cli>\u003cb>Diuréticos tiazídicos e de alça\u003c/b>: hipocalemia.\u003c/li> \u003cli>\u003cb>Indutores do CYP3A4\u003c/b> (rifampicina, carbamazepina, fenitoína, fenobarbital): reduzem o efeito do corticoide.\u003c/li> \u003cli>\u003cb>Inibidores potentes do CYP3A4\u003c/b> (ritonavir, cobicistate, cetoconazol, itraconazol, claritromicina): aumentam o corticoide; com ritonavir há relatos de síndrome de Cushing até com fluticasona ou budesonida inalada e nasal.\u003c/li> \u003cli>\u003cb>Vacinas de vírus vivo\u003c/b>: evitar quando a dose for imunossupressora (prednisona 20 mg/dia ou mais por 14 dias ou mais, ou equivalente); orientar a perguntar no posto de vacinação.\u003c/li> \u003cli>\u003cb>Gestação\u003c/b>: prednisona e prednisolona são preferidas porque a placenta inativa grande parte da dose; dexametasona e betametasona atravessam a placenta e são usadas justamente para amadurecer o pulmão fetal.\u003c/li> \u003c/ul> \u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Corticoide injetável de depósito (por exemplo, associação de fosfato e dipropionato de betametasona) suprime o eixo por semanas e é usado em excesso para \"gripe forte\", dor nas costas ou alergia. Aplicação na farmácia exige prescrição. Pedidos repetidos sem receita devem ser recusados e o cliente orientado sobre os riscos.\u003c/p>\u003c/div>  \u003ch3>Doses frequentes na receita\u003c/h3> \u003cp>A crise de asma é a indicação de curso curto mais comum. O PCDT da Asma (2026) preconiza, para adolescentes e adultos com exacerbação grave, prednisolona ou prednisona de 40 a 50 mg/dia por 5 a 7 dias, em dose única diária pela manhã; para crianças de 6 a 11 anos, prednisolona de 1 a 2 mg/kg/dia (máximo de 40 mg/dia) por 3 a 5 dias. As apresentações pediátricas de prednisolona em solução oral existem em mais de uma concentração (por exemplo, 1 mg/mL e 3 mg/mL), e trocar uma pela outra triplica ou reduz a um terço a dose. Conferir a concentração na receita e na embalagem é obrigatório.\u003c/p> \u003cp>Outras indicações comuns de curso curto: urticária extensa, dermatite de contato grave, exacerbação de DPOC, crise de gota quando AINE é contraindicado e laringite na criança. Resfriado, gripe, dor de garganta comum e dor lombar sem diagnóstico não são indicações de corticoide.\u003c/p> \u003ch3>Uso prolongado\u003c/h3> \u003cp>Quem usa corticoide por 3 meses ou mais (doenças reumáticas, transplante, doença pulmonar, doença inflamatória intestinal) precisa de cuidados preventivos acompanhados pelo médico: avaliação de densidade óssea, ingestão adequada de cálcio e vitamina D, controle de pressão, glicemia e peso, exame oftalmológico e atualização vacinal antes da imunossupressão. Na farmácia, o papel é reforçar a adesão, reconhecer efeitos adversos e evitar automedicação concomitante com AINE.\u003c/p> \u003cp>Corticoide aumenta o risco de infecções e muda a forma como elas aparecem: febre e dor podem ser menores. Contato com varicela em quem usa dose imunossupressora e nunca teve a doença exige procura de atendimento. Herpes ocular é contraindicação ao corticoide sem avaliação oftalmológica.\u003c/p>  \u003ch3>Insuficiência adrenal após corticoide\u003c/h3> \u003cp>Quem suspende de repente um corticoide usado por semanas pode apresentar cansaço intenso, perda de apetite, náusea, vômitos, dor abdominal, tontura ao levantar, dores musculares e articulares e, em casos graves, confusão e choque. Os sintomas podem ser confundidos com a doença de base voltando. No balcão, cliente com esse quadro que parou corticoide recentemente deve procurar atendimento no mesmo dia.\u003c/p> \u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar corticoide oral: conferir dose em mg (não confundir prednisona 5 mg com 20 mg), explicar a tomada única de manhã com alimento, perguntar sobre diabetes, hipertensão, glaucoma, úlcera e infecção em curso, e reforçar que curso curto termina no dia indicado e uso longo não pode ser interrompido sem orientação. Associações de corticoide com anti-histamínico (ex.: betametasona com dexclorfeniramina) também são de venda sob prescrição.\u003c/p>\u003c/div>"},{"id":"m06-corticoides-topicos","titulo":"Corticosteroides tópicos","resumo":"\u003cp>O corticoide aplicado na pele reduz inflamação, coceira e proliferação celular. É a base do tratamento de dermatite atópica, dermatite de contato, eczemas, psoríase localizada e picadas com reação inflamatória. Os riscos vêm do uso errado: potência alta em pele fina, uso longo sem pausa, aplicação em infecção não diagnosticada e associações desnecessárias com antifúngico e antibiótico.\u003c/p> \u003ch3>Classes de potência\u003c/h3> \u003cp>A potência depende da molécula, da concentração e do veículo. Pomada penetra mais que creme, que penetra mais que loção; oclusão (curativo, fralda, luva) multiplica a absorção. A classificação abaixo, em quatro grupos, segue a usada no Reino Unido e na Nova Zelândia (DermNet NZ); a classificação americana divide em sete classes, com a I sendo a mais potente, e alguns fármacos mudam de grupo de uma escala para outra.\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Potência\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Uso típico\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Baixa\u003c/td>\u003ctd>Acetato de hidrocortisona 1% (MIP); desonida 0,05%\u003c/td>\u003ctd>Face, pálpebras, dobras, área de fralda, criança\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Média\u003c/td>\u003ctd>Triancinolona acetonida 0,1%; butirato de hidrocortisona 0,1%\u003c/td>\u003ctd>Tronco e membros em adulto; dermatite moderada\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Alta\u003c/td>\u003ctd>Valerato de betametasona 0,1%; dipropionato de betametasona 0,05%; furoato de mometasona 0,1%\u003c/td>\u003ctd>Lesões espessas em adulto, por tempo curto\u003c/td>\u003c/tr> \u003ctr>\u003ctd>Muito alta\u003c/td>\u003ctd>Propionato de clobetasol 0,05%\u003c/td>\u003ctd>Psoríase em placa, líquen, mãos e pés; prescrição especializada e cursos curtos\u003c/td>\u003c/tr> \u003c/tbody>\u003c/table>\u003c/div> \u003cp>A tabela é aproximada: a fluticasona 0,05% e a desoximetasona, por exemplo, aparecem em grupos diferentes conforme a fonte. Na dúvida, a bula e o veículo decidem.\u003c/p> \u003ch3>Quantidade: unidade de ponta de dedo\u003c/h3> \u003cp>A unidade de ponta de dedo (FTU, do inglês \u003ci>fingertip unit\u003c/i>) é a quantidade de creme espremida do tubo de bico padrão sobre a falange distal do indicador de um adulto, da ponta até a primeira dobra. Equivale a cerca de \u003cstrong>0,5 g\u003c/strong> no homem adulto (0,4 g na mulher, segundo a DermNet NZ) e cobre uma área igual a duas palmas de mão de adulto (com os dedos). Referência para adulto por aplicação:\u003c/p> \u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Região (adulto)\u003c/th>\u003cth>Unidades de ponta de dedo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody> \u003ctr>\u003ctd>Face e pescoço\u003c/td>\u003ctd>2,5\u003c/td>\u003c/tr> \u003ctr>\u0

u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Precipitante\u003c/th>\u003cth>Mecanismo sobre a varfarina\u003c/th>\u003cth>Efeito\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Sulfametoxazol + trimetoprima\u003c/td>\u003ctd>Sulfametoxazol inibe CYP2C9\u003c/td>\u003ctd>INR sobe muito; sangramento\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Metronidazol\u003c/td>\u003ctd>Inibe o metabolismo da S-varfarina (CYP2C9)\u003c/td>\u003ctd>INR sobe muito\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fluconazol, miconazol (inclusive gel oral)\u003c/td>\u003ctd>Inibem CYP2C9 e CYP3A4\u003c/td>\u003ctd>INR sobe muito\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Claritromicina, eritromicina\u003c/td>\u003ctd>Inibem CYP3A4 (via da R-varfarina)\u003c/td>\u003ctd>INR sobe\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ciprofloxacino\u003c/td>\u003ctd>Inibe CYP1A2 (via da R-varfarina)\u003c/td>\u003ctd>INR pode subir\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rifampicina\u003c/td>\u003ctd>Induz CYP2C9 e CYP3A4\u003c/td>\u003ctd>INR cai; risco de trombose\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Além da enzima, a própria infecção (febre, inapetência, menor ingestão de vitamina K) tende a elevar o INR. Por isso, qualquer antibiótico em paciente com varfarina pede INR de controle em poucos dias, conforme orientação do serviço que acompanha a anticoagulação.\u003c/p>\n\u003ch3>Varfarina com paracetamol em dose alta\u003c/h3>\n\u003cp>Paracetamol em dose alta e regular (acima de cerca de 2 g por dia, por vários dias seguidos) eleva o INR em usuários de varfarina. O mecanismo proposto é a interferência de um metabólito do paracetamol nas enzimas do ciclo da vitamina K. Doses ocasionais não costumam alterar o INR. A orientação é usar a menor dose eficaz por pouco tempo e avisar o serviço de anticoagulação se o uso for diário por vários dias.\u003c/p>\n\u003ch3>Varfarina e vitamina K da dieta\u003c/h3>\n\u003cp>Folhas verde-escuras (couve, espinafre, brócolis, rúcula, agrião), alguns óleos vegetais e suplementos com vitamina K antagonizam a varfarina. A conduta não é proibir esses alimentos: é manter o consumo constante de semana a semana. Aumento brusco (começar uma \"dieta verde\") reduz o INR; corte brusco eleva.\u003c/p>\n\u003ch3>Anticoagulantes orais diretos\u003c/h3>\n\u003cp>Rivaroxabana, apixabana, edoxabana e dabigatrana (DOAC) têm menos interações que a varfarina, mas as que existem passam por dois caminhos: CYP3A4 e P-gp.\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Rivaroxabana\u003c/b>: substrato de CYP3A4 e P-gp. A bula norte-americana (Xarelto, FDA, 2026) orienta evitar inibidores combinados de P-gp e CYP3A4 fortes (cetoconazol, itraconazol, ritonavir) e evitar indutores combinados (rifampicina, carbamazepina, fenitoína, erva-de-são-joão).\u003c/li>\n\u003cli>\u003cb>Apixabana\u003c/b>: mesmo perfil, e aqui as bulas divergem. A norte-americana (Eliquis, FDA, 2025) orienta reduzir a dose em 50% com inibidores combinados fortes de CYP3A4 e P-gp (cetoconazol, itraconazol, ritonavir), ou evitar a combinação se a dose já for 2,5 mg duas vezes ao dia, e evitar indutores combinados. As bulas brasileiras de apixabana (genéricos Sandoz e Zydus Nikkho) não preveem redução: dizem que o uso não é recomendado com antifúngicos azólicos sistêmicos (cetoconazol, itraconazol, voriconazol, posaconazol) e inibidores de protease do HIV, e pedem cautela com indutores (rifampicina, fenitoína, carbamazepina, fenobarbital, erva-de-são-joão), não recomendados no tratamento de trombose venosa profunda e embolia pulmonar. A bula norte-americana dispensa ajuste com claritromicina; as brasileiras, com claritromicina, diltiazem, naproxeno, amiodarona, verapamil e quinidina.\u003c/li>\n\u003cli>\u003cb>Dabigatrana\u003c/b>: pró-fármaco, substrato de P-gp, sem metabolismo relevante por CYP. Inibidores de P-gp (cetoconazol sistêmico, dronedarona, verapamil, amiodarona, claritromicina) aumentam sua exposição, sobretudo com função renal reduzida; a bula traz ajustes conforme a indicação e a função renal. Indutores de P-gp (rifampicina) reduzem sua exposição e devem, em geral, ser evitados (Pradaxa, FDA, 2025).\u003c/li>\n\u003c/ul>\n\u003cp>Os DOAC também somam efeito com AINE, AAS e ISRS (sangramento), pelo mesmo mecanismo farmacodinâmico descrito para a varfarina.\u003c/p>\n\u003ch3>Clopidogrel e omeprazol\u003c/h3>\n\u003cp>O clopidogrel é pró-fármaco ativado em parte por CYP2C19. Omeprazol e esomeprazol inibem CYP2C19, reduzem a formação do metabólito ativo e diminuem a ação antiplaquetária. A bula do clopidogrel orienta evitar o uso concomitante com omeprazol ou esomeprazol (Plavix, FDA, 2025). Quando o paciente precisa de gastroproteção, o prescritor costuma escolher pantoprazol, que tem menor efeito sobre CYP2C19. Separar horários não resolve, porque a inibição é enzimática e dura o dia inteiro.\u003c/p>\n\u003ch3>AAS em baixa dose e ibuprofeno\u003c/h3>\n\u003cp>O ibuprofeno ocupa o sítio da COX-1 plaquetária e impede o acesso do AAS, que inibe a enzima de forma irreversível. Em uso regular, o ibuprofeno pode reduzir a proteção cardiovascular do AAS. A orientação clássica da FDA (2006) para quem usa AAS de liberação imediata e precisa de ibuprofeno ocasional é tomar o ibuprofeno pelo menos 30 minutos depois do AAS ou mais de 8 horas antes dele.\u003c/p>\n\u003ch3>DOAC no balcão\u003c/h3>\n\u003cp>Na prática da atenção básica, as interações de DOAC mais vistas são com AINE comprado sem receita, com antiagregante associado pelo cardiologista e com indutores (carbamazepina e fenitoína em pacientes com epilepsia, rifampicina no tratamento de tuberculose). A claritromicina e a amiodarona são inibidores de P-gp e, no caso da claritromicina, de CYP3A4; elevam moderadamente a exposição à rivaroxabana, apixabana e dabigatrana, o que pode ser relevante em idosos e em quem tem função renal reduzida. Como os DOAC não têm exame de rotina equivalente ao INR, a orientação de sinais de sangramento ganha ainda mais peso.\u003c/p>\n\u003ch3>Terapia antitrombótica combinada\u003c/h3>\n\u003cp>Após infarto ou implante de stent, alguns pacientes usam dupla antiagregação (AAS com clopidogrel, ticagrelor ou prasugrel), e quem também tem fibrilação atrial pode usar anticoagulante junto com antiagregante. Essas combinações são decididas pelo cardiologista, com tempo definido, e o risco de sangramento é somado de forma intencional. O papel do farmacêutico é não acrescentar mais um fator: nada de AINE, cuidado com ISRS novos e com fitoterápicos de efeito antiplaquetário, e reforço da orientação sobre sinais de sangramento. O ticagrelor é substrato de CYP3A4, e inibidores fortes dessa enzima (claritromicina, cetoconazol) aumentam sua exposição.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 70 anos com apixabana chega com dor lombar e pede \"um anti-inflamatório forte\". O farmacêutico explica o risco de sangramento digestivo da combinação, oferece paracetamol em dose adequada, orienta calor local e repouso relativo e encaminha para avaliação se a dor não melhorar em poucos dias ou se surgirem sinais de alerta, como perda de força nas pernas, febre ou alteração urinária.\u003c/p>\u003c/div>\n\u003ch3>Analgesia no paciente anticoagulado\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Opção\u003c/th>\u003cth>Comentário\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Paracetamol\u003c/td>\u003ctd>Primeira escolha; com varfarina, evitar uso diário prolongado em dose alta sem avisar o serviço\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Dipirona\u003c/td>\u003ctd>Sem efeito antiplaquetário relevante em dose usual; atenção às contraindicações próprias\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AINE oral\u003c/td>\u003ctd>Evitar: sangramento digestivo e, com varfarina, possível alteração do INR\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AINE tópico\u003c/td>\u003ctd>Menor absorção; evitar grandes áreas e uso prolongado sem orientação\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>AAS como analgésico\u003c/td>\u003ctd>Evitar\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Paciente com anticoagulante que pede \"algo para dor muscular\" não deve sair com AINE oral, nem com AINE tópico em grande área por vários dias, sem avaliação. Sinais de alerta para orientar: fezes pretas, vômito com sangue ou \"borra de café\", urina avermelhada, hematomas sem trauma, sangramento gengival persistente, dor de cabeça súbita e intensa.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 72 anos, com varfarina por fibrilação atrial, traz receita de sulfametoxazol com trimetoprima para infecção urinária. O farmacêutico identifica: sulfametoxazol (precipitante) inibe CYP2C9 e aumenta a exposição à S-varfarina (objeto), com risco de INR elevado e sangramento em poucos dias. Contata o prescritor, que troca o antibiótico, e orienta a paciente a fazer INR de controle conforme o serviço de anticoagulação. A intervenção é registrada.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Para todo usuário de anticoagulante: perguntar qual anticoagulante usa, se faz controle de INR (no caso da varfarina), se usa AAS ou anti-inflamatório, e orientar a avisar o serviço de anticoagulação antes de iniciar qualquer antibiótico, antifúngico, fitoterápico ou suplemento.\u003c/p>\u003c/div>\n"},{"id":"m08-cardiovasculares","titulo":"Interações de medicamentos cardiovasculares","resumo":"\n\u003cp>Pacientes cardiovasculares usam, em média, vários medicamentos de uso contínuo e são o grupo em que interações graves mais aparecem no balcão. Os pares a seguir respondem pela maior parte dos problemas.\u003c/p>\n\u003ch3>Hipercalemia: IECA, BRA, espironolactona e potássio\u003c/h3>\n\u003cp>IECA (enalapril, captopril, ramipril) e BRA (losartana, valsartana, olmesartana) reduzem a aldosterona e, com ela, a excreção renal de potássio. Espironolactona e eplerenona bloqueiam o receptor da aldosterona; amilorida e triantereno bloqueiam o canal de sódio do túbulo coletor. Todos retêm potássio. A soma é farmacodinâmica: o potássio sobe, sobretudo em idosos, diabéticos, desidratados e com doença renal crônica. Suplementos de cloreto de potássio e substitutos de sal à base de potássio (\"sal light\") somam ao mesmo efeito. A trimetoprima, por bloquear o canal de sódio do túbulo como a amilorida, também eleva o potássio e é um precipitante esquecido.\u003c/p>\n\u003cp>A combinação IECA ou BRA com espironolactona é usada na insuficiência cardíaca com benefício comprovado, mas exige potássio e creatinina monitorados. O problema no balcão é o acréscimo não planejado: suplemento de potássio, sal light, AINE ou sulfametoxazol com trimetoprima.\u003c/p>\n\u003ch3>Triple whammy\u003c/h3>\n\u003cp>A associação de IECA ou BRA, diurético e AINE é conhecida como \"triple whammy\". O diurético reduz a volemia; o IECA ou BRA dilata a arteríola eferente; o AINE contrai a aferente ao bloquear prostaglandinas. A pressão de filtração glomerular cai e o resultado pode ser lesão renal aguda, especialmente nas primeiras semanas, em idosos e em situações de desidratação (diarreia, calor, vômitos). O AINE também retém sódio e reduz o efeito anti-hipertensivo.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 68 anos usa losartana e hidroclorotiazida e pede diclofenaco para dor no joelho, que pretende tomar por duas semanas. O farmacêutico explica o risco renal da combinação, recomenda paracetamol em dose adequada ou dipirona por curto período e medidas não farmacológicas, e orienta procurar o médico se a dor persistir. Ao saber que ele teve diarreia na semana anterior, reforça a necessidade de hidratação.\u003c/p>\u003c/div>\n\u003ch3>Estatinas\u003c/h3>\n\u003cp>Sinvastatina e lovastatina são substratos sensíveis de CYP3A4: inibidores dessa enzima multiplicam a exposição e o risco de miopatia e rabdomiólise. A atorvastatina também depende de CYP3A4, em menor grau. Rosuvastatina e pravastatina dependem pouco de CYP3A4. As bulas trazem limites de dose, e a brasileira não coincide com a norte-americana em todos os pares:\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Precipitante\u003c/th>\u003cth>Mecanismo\u003c/th>\u003cth>Bula FDA (Zocor, 2025)\u003c/th>\u003cth>Bula brasileira (Bula Padrão, 2025)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Claritromicina, eritromicina, itraconazol, cetoconazol, posaconazol, voriconazol, inibidores de protease, nefazodona\u003c/td>\u003ctd>Inibição forte de CYP3A4\u003c/td>\u003ctd>Contraindicada; se o antimicrobiano for inevitável, suspender a estatina durante o curso\u003c/td>\u003ctd>Contraindicada; mesma orientação de suspender\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Genfibrozila, ciclosporina, danazol\u003c/td>\u003ctd>Glicuronidação, OATP1B1 e CYP3A4\u003c/td>\u003ctd>Contraindicada\u003c/td>\u003ctd>Contraindicada\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Verapamil, diltiazem\u003c/td>\u003ctd>Inibição moderada de CYP3A4\u003c/td>\u003ctd>Até 10 mg/dia (também com dronedarona)\u003c/td>\u003ctd>Até 20 mg/dia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Amiodarona\u003c/td>\u003ctd>Inibição de CYP3A4\u003c/td>\u003ctd>Até 20 mg/dia\u003c/td>\u003ctd>Até 20 mg/dia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Anlodipino\u003c/td>\u003ctd>Inibição de CYP3A4\u003c/td>\u003ctd>Até 20 mg/dia (também com ranolazina)\u003c/td>\u003ctd>Até 40 mg/dia\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Suco de toranja (grapefruit)\u003c/td>\u003ctd>Inibição de CYP3A4 intestinal\u003c/td>\u003ctd>Evitar\u003c/td>\u003ctd>Evitar\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A coluna brasileira vem da bula do profissional da sinvastatina genérica (Sandoz), atualizada conforme a Bula Padrão aprovada pela Anvisa em 23/01/2025. A bula norte-americana também restringe a dose de 80 mg a quem já a usa há 12 meses ou mais sem toxicidade muscular e põe 40 mg como dose máxima recomendada. Na dispensação vale a bula do produto registrado no Brasil; quando a FDA é mais restritiva (verapamil, diltiazem, anlodipino), vale avisar o prescritor, que decide.\u003c/p>\n\u003cp>Quando o paciente precisa de um fibrato, o fenofibrato é preferido à genfibrozila. Quando precisa de macrolídeo e usa sinvastatina, a azitromicina tem efeito mínimo sobre CYP3A4. Sintomas a orientar: dor ou fraqueza muscular sem explicação e urina escura (\"cor de coca-cola\").\u003c/p>\n\u003ch3>Digoxina\u003c/h3>\n\u003cp>A digoxina tem índice terapêutico estreito e é substrato de P-gp, que controla sua absorção intestinal e sua secreção renal. Inibidores de P-gp elevam o nível sérico:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Amiodarona\u003c/b>: inibe P-gp e aumenta a digoxinemia (cerca de 70% em um dia, segundo a bula norte-americana). A bula da FDA (Pacerone, 2024) orienta reduzir a digoxina à metade ou suspendê-la; a brasileira (Ancoron, 2025) pede dosar a digoxina, acompanhar o ECG e ajustar a dose se necessário. A mesma bula norte-americana limita a sinvastatina a 20 mg/dia e a lovastatina a 40 mg/dia com amiodarona; a brasileira recomenda preferir estatinas não metabolizadas por CYP3A4. Além disso, as duas somam efeito de bradicardia e bloqueio atrioventricular.\u003c/li>\n\u003cli>\u003cb>Verapamil\u003c/b>: inibe P-gp e soma efeito cronotrópico negativo.\u003c/li>\n\u003cli>\u003cb>Claritromicina e eritromicina\u003c/b>: inibem P-gp e elevam a digoxina; há relatos de intoxicação em idosos.\u003c/li>\n\u003c/ul>\n\u003cp>Sinais de intoxicação digitálica para orientar: náusea, vômito, perda de apetite, confusão, visão amarelada ou borrada, pulso muito lento ou irregular. Diuréticos que causam hipocalemia aumentam a sensibilidade do coração à digoxina, mesmo sem mudar o nível.\u003c/p>\n\u003ch3>Inibidores da PDE-5 e nitratos\u003c/h3>\n\u003cp>Sildenafila, tadalafila e vardenafila inibem a fosfodiesterase 5 e impedem a degradação do GMPc. Nitratos (isossorbida, nitroglicerina) e nitritos inalatórios (\"poppers\") aumentam a produção de GMPc via óxido nítrico. Juntos, causam vasodilatação intensa e hipotensão grave. A combinação é contraindicada nas bulas. Em situação de emergência, a bula da tadalafila exige pelo menos 48 horas entre a última dose e um nitrato (Cialis, FDA, 2026); para a sildenafila, o intervalo usado na prática cardiológica é de 24 horas. A sildenafila também é substrato sensível de CYP3A4, e inibidores fortes dessa enzima aumentam sua exposição.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Homem que compra sildenafila ou tadalafila e usa \"remédio de coração\" deve ser perguntado diretamente sobre isossorbida ou nitroglicerina sublingual. Se usar, a venda não deve ser feita e o paciente deve ser encaminhado ao cardiologista.\u003c/p>\u003c/div>\n\u003ch3>Betabloqueadores com verapamil ou diltiazem\u003c/h3>\n\u003cp>Betabloqueadores (atenolol, metoprolol, propranolol, carvedilol, bisoprolol) e os bloqueadores de canal de cálcio não di-hidropiridínicos (verapamil, diltiazem) reduzem a frequência cardíaca, a condução atrioventricular e a contratilidade. A soma é farmacodinâmica e pode causar bradicardia grave, bloqueio atrioventricular e piora de insuficiência cardíaca. Anlodipino e nifedipino (di-hidropiridínicos) não têm esse efeito relevante sobre o nó atrioventricular e são combinados com betabloqueadores com frequência.\u003c/p>\n\u003ch3>Betabloqueadores e broncodilatadores\u003c/h3>\n\u003cp>Betabloqueadores não seletivos (propranolol, nadolol, timolol, inclusive em colírio) bloqueiam os receptores beta-2 dos brônquios e antagonizam o salbutamol e o fenoterol. Em asmáticos, podem precipitar broncoespasmo. É antagonismo farmacodinâmico. Os cardiosseletivos (bisoprolol, metoprolol, atenolol) têm risco menor, mas a seletividade diminui em doses altas. No balcão, asmático que inicia propranolol para enxaqueca ou tremor, ou colírio de timolol para glaucoma, deve ser orientado a relatar piora da falta de ar.\u003c/p>\n\u003ch3>Descongestionantes e anti-hipertensivos\u003c/h3>\n\u003cp>Antigripais e descongestionantes nasais com fenilefrina, pseudoefedrina ou nafazolina são agonistas alfa-adrenérgicos: contraem vasos e podem elevar a pressão arterial. É um antagonismo farmacodinâmico com qualquer anti-hipertensivo, e o efeito é mais relevante em hipertensos mal controlados e em cardiopatas. No balcão, o hipertenso gripado deve receber preferencialmente lavagem nasal com soro fisiológico e analgésico simples; o descongestionante tópico, se usado, por poucos dias.\u003c/p>\n\u003ch3>Inibidores da PDE-5 com alfabloqueadores\u003c/h3>\n\u003cp>Doxazosina, prazosina e, em menor grau, tansulosina causam vasodilatação e hipotensão postural. Somadas à sildenafila ou à tadalafila, podem causar tontura e queda de pressão, sobretudo no início do tratamento. As bulas recomendam que o paciente esteja estável com o alfabloqueador antes de iniciar o inibidor da PDE-5, com a menor dose. Orientar levantar devagar e sentar se houver tontura.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 63 anos usa sinvastatina 20 mg e o cardiologista acrescentou diltiazem 180 mg por dia para angina. O farmacêutico verifica que a bula brasileira da sinvastatina aceita até 20 mg/dia com diltiazem, mas a norte-americana limita a 10 mg/dia, pela inibição de CYP3A4. Dispensa, informa o prescritor sobre a divergência e a opção de estatina menos dependente de CYP3A4 (rosuvastatina, pravastatina), e orienta a paciente sobre dor muscular e urina escura.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Em paciente cardiovascular, revise a lista completa a cada nova receita: estatina com antimicrobiano novo, AINE com IECA ou BRA, suplemento de potássio com espironolactona, sildenafila com nitrato. Pergunte por tontura, desmaio, cansaço intenso e dor muscular.\u003c/p>\u003c/div>\n"},{"id":"m08-snc","titulo":"Interações no sistema nervoso central","resumo":"\n\u003cp>Antidepressivos, ansiolíticos, analgésicos opioides, anticonvulsivantes e estabilizadores de humor concentram interações graves. Muitas são farmacodinâmicas (efeito somado sobre serotonina, sedação ou sangramento); outras são farmacocinéticas, porque fluoxetina, paroxetina e fluvoxamina são inibidores potentes de CYP e carbamazepina e fenitoína são indutores fortes.\u003c/p>\n\u003ch3>Síndrome serotoninérgica\u003c/h3>\n\u003cp>A síndrome serotoninérgica resulta do excesso de serotonina nas sinapses. Manifesta-se com alteração mental (agitação, confusão), hiperatividade autonômica (taquicardia, sudorese, febre, diarreia) e alterações neuromusculares (tremor, clônus, hiper-reflexia, rigidez). Pode ser fatal. Os precipitantes somam efeitos por mecanismos diferentes:\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Combinação\u003c/th>\u003cth>Mecanismo\u003c/th>\u003cth>Gravidade\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>ISRS ou IRSN + IMAO (tranilcipromina, selegilina, rasagilina)\u003c/td>\u003ctd>Inibição da recaptação somada à inibição da degradação da serotonina\u003c/td>\u003ctd>Contraindicada\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ISRS ou IRSN + linezolida\u003c/td>\u003ctd>A linezolida é inibidor fraco e reversível da MAO\u003c/td>\u003ctd>Grave\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ISRS ou IRSN + tramadol\u003c/td>\u003ctd>Tramadol inibe a recaptação de serotonina; fluoxetina e paroxetina ainda inibem CYP2D6 e acumulam o tramadol original\u003c/td>\u003ctd>Grave\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ISRS ou IRSN + triptanos\u003c/td>\u003ctd>Agonismo 5-HT1B/1D somado; risco real considerado baixo\u003c/td>\u003ctd>Moderada\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ISRS + erva-de-são-joão\u003c/td>\u003ctd>A erva tem ação serotoninérgica própria\u003c/td>\u003ctd>Grave\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Na troca entre antidepressivos, a regra é respeitar intervalos de eliminação: 14 dias entre a suspensão de um IMAO irreversível e o início de um ISRS, e cerca de 5 semanas após a suspensão da fluoxetina, que tem metabólito de meia-vida longa, antes de um IMAO. Esses intervalos são decisão do prescritor, mas o farmacêutico deve reconhecê-los.\u003c/p>\n\u003ch3>Tramadol e inibidores de CYP2D6\u003c/h3>\n\u003cp>O tramadol age por dois caminhos: o fármaco original inibe a recaptação de serotonina e noradrenalina; o metabólito O-desmetiltramadol, formado por CYP2D6, é o agonista opioide. Fluoxetina e paroxetina são inibidores fortes de CYP2D6. O resultado é duplo: menos analgesia opioide e mais tramadol original, com mais risco serotoninérgico e de convulsão. A bula do tramadol lista ISRS, IRSN e tricíclicos entre os fármacos que aumentam o risco de convulsões.\u003c/p>\n\u003ch3>ISRS com AINE ou anticoagulante\u003c/h3>\n\u003cp>As plaquetas não sintetizam serotonina; captam-na do plasma pelo mesmo transportador que os ISRS bloqueiam. Com o ISRS, a plaqueta fica com menos serotonina e agrega menos. Somado ao AINE (que inibe a COX-1 plaquetária e lesa a mucosa) ou ao anticoagulante, o risco de sangramento digestivo aumenta. A conduta habitual é evitar AINE em quem usa ISRS ou, quando indispensável, o prescritor avaliar gastroproteção com IBP.\u003c/p>\n\u003ch3>Depressores do SNC\u003c/h3>\n\u003cp>Benzodiazepínicos (clonazepam, diazepam, alprazolam), opioides (codeína, tramadol, morfina), álcool, anti-histamínicos sedativos (dexclorfeniramina, prometazina, hidroxizina), relaxantes musculares de ação central (ciclobenzaprina), hipnóticos (zolpidem) e alguns antipsicóticos somam depressão do SNC. O resultado vai de sonolência e quedas até depressão respiratória. Em 2016 a FDA incluiu advertência em destaque nas bulas de opioides e benzodiazepínicos sobre o uso combinado, pelo risco de depressão respiratória e morte.\u003c/p>\n\u003cp>No balcão, o caso típico é o idoso que usa clonazepam para dormir e compra um antigripal com anti-histamínico sedativo, ou o paciente com codeína que bebe à noite. O anti-histamínico sedativo também tem efeito anticolinérgico (confusão, retenção urinária, constipação), que se soma ao de outros fármacos do idoso.\u003c/p>\n\u003ch3>Lítio\u003c/h3>\n\u003cp>O lítio tem índice terapêutico estreito e é eliminado quase todo pelo rim, que o trata como sódio. Situações que fazem o rim reter sódio fazem reter lítio. Os principais precipitantes que elevam a litemia:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Diuréticos tiazídicos\u003c/b> (hidroclorotiazida, clortalidona): a perda de sódio no túbulo distal aumenta a reabsorção proximal de sódio e lítio.\u003c/li>\n\u003cli>\u003cb>IECA e BRA\u003c/b>: reduzem a filtração e aumentam a reabsorção de lítio.\u003c/li>\n\u003cli>\u003cb>AINE\u003c/b>: reduzem prostaglandinas renais, a filtração e a excreção de lítio.\u003c/li>\n\u003cli>\u003cb>Metronidazol\u003c/b>: citado na bula do lítio entre os fármacos que exigem monitorar a litemia.\u003c/li>\n\u003c/ul>\n\u003cp>A bula do lítio recomenda dosar a litemia após qualquer mudança de medicação concomitante (diuréticos, AINE, antagonistas do sistema renina-angiotensina, metronidazol) e evitar restrição de sódio. Sinais de intoxicação: tremor grosseiro, diarreia, vômitos, sonolência, confusão, ataxia e fala arrastada.\u003c/p>\n\u003ch3>Fluoxetina e paroxetina como inibidores de CYP2D6\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Tamoxifeno\u003c/b>: pró-fármaco ativado por CYP2D6 em endoxifeno. Fluoxetina e paroxetina (precipitantes) reduzem a formação do metabólito ativo, com possível perda de eficácia contra o câncer de mama. Para a paciente com tamoxifeno que precisa de antidepressivo, o prescritor costuma preferir fármacos com pouca inibição de CYP2D6, como venlafaxina, escitalopram ou citalopram.\u003c/li>\n\u003cli>\u003cb>Metoprolol\u003c/b>: substrato de CYP2D6. Fluoxetina e paroxetina elevam seu nível e podem causar bradicardia e hipotensão.\u003c/li>\n\u003cli>Outros substratos de CYP2D6 afetados: codeína (menos conversão em morfina e menos analgesia), tricíclicos (mais toxicidade), alguns antipsicóticos.\u003c/li>\n\u003c/ul>\n\u003ch3>Carbamazepina e fenitoína como indutores\u003c/h3>\n\u003cp>Carbamazepina e fenitoína induzem fortemente CYP3A4, CYP2C9 e outras vias. Reduzem o efeito de anticoncepcionais hormonais, DOAC, varfarina, estatinas, muitos antirretrovirais, corticoides e outros antiepilépticos. A carbamazepina induz o próprio metabolismo (autoindução), por isso a dose costuma ser ajustada nas primeiras semanas. No sentido inverso, inibidores de CYP3A4 (claritromicina, eritromicina, fluconazol) elevam o nível da carbamazepina e causam tontura, visão dupla e ataxia, e o fluconazol eleva o nível da fenitoína.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Homem de 50 anos, com lítio há anos e litemia estável, começou a tomar ibuprofeno três vezes ao dia por tendinite há uma semana. Volta à farmácia com tremor nas mãos, diarreia e sonolência. O farmacêutico reconhece sinais compatíveis com intoxicação por lítio (o AINE reduz a excreção renal de lítio) e orienta procurar atendimento no mesmo dia, levando a lista de medicamentos. Registra a ocorrência e comunica o psiquiatra.\u003c/p>\u003c/div>\n\u003ch3>Metoclopramida e antipsicóticos\u003c/h3>\n\u003cp>A metoclopramida bloqueia receptores de dopamina no SNC. Somada a antipsicóticos (haloperidol, risperidona) ou a outros bloqueadores dopaminérgicos, aumenta o risco de sintomas extrapiramidais, como rigidez, tremor, inquietação e espasmos de face e pescoço, e, raramente, de síndrome neuroléptica maligna. Também antagoniza o efeito da levodopa no paciente com Parkinson. Para náusea nesses pacientes, a escolha do antiemético deve ser feita pelo prescritor.\u003c/p>\n\u003ch3>Valproato e lamotrigina\u003c/h3>\n\u003cp>O ácido valproico (precipitante) inibe a glicuronidação da lamotrigina (objeto), cuja meia-vida aproximadamente dobra. Níveis altos de lamotrigina aumentam o risco de exantema grave, inclusive síndrome de Stevens-Johnson. Por isso a lamotrigina é iniciada em doses menores e titulada mais devagar em quem usa valproato, conforme a bula. No sentido oposto, indutores (carbamazepina, fenitoína) e anticoncepcionais com estrogênio reduzem o nível da lamotrigina.\u003c/p>\n\u003ch3>Codeína e metabolismo\u003c/h3>\n\u003cp>A codeína é convertida em morfina por CYP2D6. Inibidores fortes dessa enzima (fluoxetina, paroxetina, bupropiona) reduzem a analgesia. No outro extremo, metabolizadores ultrarrápidos formam morfina em excesso, motivo das restrições ao uso de codeína em crianças. Para o balcão, a mensagem prática é: paciente com fluoxetina ou paroxetina que relata que \"a codeína não faz efeito\" pode estar descrevendo uma interação, não falta de adesão.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 45 anos, em uso de sertralina, traz receita de tramadol para dor lombar. O farmacêutico identifica soma serotoninérgica (tramadol inibe a recaptação de serotonina, sertralina também) e risco de convulsão. Como a sertralina é inibidor fraco de CYP2D6, o efeito analgésico tende a ser preservado. Contata o prescritor, que mantém o tramadol por poucos dias na menor dose. O farmacêutico orienta a paciente a procurar atendimento se surgirem agitação, tremor, febre, sudorese intensa ou contrações musculares involuntárias.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Em quem usa antidepressivo, pergunte qual é antes de dispensar tramadol, triptano, linezolida, AINE por vários dias ou antigripal com anti-histamínico. Em quem usa lítio, qualquer diurético, IECA, BRA ou AINE novo exige contato com o prescritor para programar litemia.\u003c/p>\u003c/div>\n"},{"id":"m08-antiinfecciosos","titulo":"Interações de anti-infecciosos","resumo":"\n\u003cp>Antimicrobianos são prescritos por pouco tempo e por profissionais diferentes daqueles que acompanham o uso contínuo do paciente. Por isso, a dispensação do antibiótico é o momento em que a interação costuma ser detectada.\u003c/p>\n\u003ch3>Anticoncepcional hormonal com indutores enzimáticos\u003c/h3>\n\u003cp>Rifampicina e rifabutina (precipitantes) induzem CYP3A4 e a glicuronidação, aumentando a eliminação de etinilestradiol e progestagênios (objetos). O mesmo vale para carbamazepina, fenitoína, fenobarbital, oxcarbazepina em doses usuais, topiramato em doses altas, efavirenz e erva-de-são-joão. A consequência é falha contraceptiva. Segundo a orientação da Faculty of Sexual and Reproductive Healthcare (FSRH, 2022), quem usa contraceptivo hormonal combinado com indutor por pouco tempo deve usar preservativo durante o uso do indutor e por 28 dias após a suspensão; para uso prolongado, métodos não afetados por indutores (DIU de cobre, SIU de levonorgestrel, acetato de medroxiprogesterona injetável) são preferíveis. Na contracepção de emergência com levonorgestrel em usuária de indutor (ou nos 28 dias seguintes), a FSRH orienta dose total de 3 mg, fora do previsto em bula.\u003c/p>\n\u003cdiv class=\"cx chave\">\u003cb>Ponto-chave\u003c/b>\u003cp>Antibióticos que não são indutores (amoxicilina, cefalexina, azitromicina, doxiciclina, ciprofloxacino, nitrofurantoína) não reduzem a eficácia do anticoncepcional hormonal, segundo a FSRH. O cuidado nesses casos é com vômito ou diarreia intensa logo após a tomada da pílula, que podem impedir sua absorção.\u003c/p>\u003c/div>\n\u003ch3>Quinolonas e tetraciclinas com cátions\u003c/h3>\n\u003cp>Cálcio, magnésio, alumínio, ferro e zinco (precipitantes) formam quelatos com quinolonas e tetraciclinas (objetos) no intestino. A absorção do antibiótico cai muito e o tratamento pode falhar. Fontes desses cátions: antiácidos, sucralfato, suplementos de cálcio, sais de ferro, polivitamínicos com minerais, leite e derivados (para as tetraciclinas). As bulas norte-americanas trazem intervalos específicos (Cipro, FDA, 2026; levofloxacino e moxifloxacino, FDA, 2024 e 2025):\u003c/p>\n\u003cul>\n\u003cli>Ciprofloxacino: tomar pelo menos 2 horas antes ou 6 horas depois de antiácidos com magnésio ou alumínio, sucralfato e produtos com cálcio, ferro ou zinco.\u003c/li>\n\u003cli>Levofloxacino: pelo menos 2 horas antes ou 2 horas depois.\u003c/li>\n\u003cli>Moxifloxacino: pelo menos 4 horas antes ou 8 horas depois.\u003c/li>\n\u003cli>Tetraciclinas: a absorção é reduzida por antiácidos com alumínio, cálcio ou magnésio e por preparações com ferro ou zinco; alimentos e laticínios também interferem (tetraciclina, FDA, 2026). Bulas brasileiras de cloridrato de tetraciclina pedem afastar leite e derivados por 1 a 2 horas antes ou depois da dose e evitar antiácidos, cálcio, ferro e laxantes com magnésio nas 1 a 3 horas em torno dela. A doxiciclina é menos afetada por alimentos, mas também deve ser separada de antiácidos e ferro.\u003c/li>\n\u003c/ul>\n\u003cp>Ciprofloxacino também é inibidor moderado de CYP1A2: eleva cafeína, teofilina e tizanidina. A combinação com tizanidina é contraindicada na bula do ciprofloxacino, por hipotensão e sedação intensas.\u003c/p>\n\u003ch3>Metronidazol com álcool e com varfarina\u003c/h3>\n\u003cp>O metronidazol pode causar reação semelhante à do dissulfiram com álcool: rubor, cólica abdominal, náusea, vômito, cefaleia e taquicardia. O mecanismo clássico atribuído é a inibição da aldeído desidrogenase, com acúmulo de acetaldeído; a força da evidência é discutida, mas as bulas mantêm a advertência. As bulas brasileiras pedem evitar álcool durante o tratamento e por pelo menos 1 dia após; a bula norte-americana pede pelo menos 3 dias e inclui produtos com propilenoglicol (Flagyl, FDA, 2026). Na orientação, o prazo mais conservador é o mais seguro. Lembrar que xaropes, enxaguatórios bucais e alguns medicamentos líquidos contêm álcool. Com a varfarina, o metronidazol inibe o metabolismo da S-varfarina e eleva o INR de forma importante.\u003c/p>\n\u003ch3>Macrolídeos e intervalo QT\u003c/h3>\n\u003cp>Eritromicina, claritromicina e, em menor grau, azitromicina prolongam o intervalo QT por bloqueio de canais de potássio cardíacos (efeito de classe). O risco de arritmia grave (torsades de pointes) aumenta com outros fármacos que prolongam o QT: quinolonas, hidroxicloroquina, domperidona, ondansetrona em dose alta, citalopram e escitalopram em dose alta, haloperidol, amiodarona, sotalol, metadona. Fatores que somam risco: hipocalemia, hipomagnesemia, bradicardia, sexo feminino, idade avançada, cardiopatia. Claritromicina e eritromicina ainda são inibidores de CYP3A4: elevam sinvastatina, lovastatina, colchicina, carbamazepina, sildenafila, alguns benzodiazepínicos e antiarrítmicos. A bula da colchicina relata toxicidade fatal com claritromicina.\u003c/p>\n\u003ch3>Fluconazol\u003c/h3>\n\u003cp>O fluconazol é inibidor moderado de CYP2C9 e CYP3A4 e forte de CYP2C19. Interações principais:\u003c/p>\n\u003cul>\n\u003cli>\u003cb>Varfarina\u003c/b>: inibição de CYP2C9 e CYP3A4; o INR sobe de forma importante. Mesmo a dose única de 150 mg para candidíase vaginal merece orientação ao usuário de varfarina.\u003c/li>\n\u003cli>\u003cb>Sulfonilureias\u003c/b> (glibenclamida, glimepirida, glipizida): inibição de CYP2C9, com aumento da exposição e risco de hipoglicemia.\u003c/li>\n\u003cli>\u003cb>Fenitoína\u003c/b>: inibição do metabolismo; a bula relata aumento médio de 88% na exposição.\u003c/li>\n\u003cli>\u003cb>Fármacos que prolongam o QT\u003c/b>: soma de efeito.\u003c/li>\n\u003c/ul>\n\u003ch3>Sulfametoxazol com trimetoprima\u003c/h3>\n\u003cul>\n\u003cli>\u003cb>Varfarina\u003c/b>: sulfametoxazol inibe CYP2C9 e eleva o INR; é uma das interações mais perigosas com varfarina.\u003c/li>\n\u003cli>\u003cb>Metotrexato\u003c/b>: trimetoprima reduz a secreção tubular do metotrexato e soma efeito antifolato; risco de pancitopenia, mesmo com metotrexato em dose baixa semanal. A bula do Bactrim (FDA, 2024) orienta evitar o uso conjunto.\u003c/li>\n\u003cli>\u003cb>IECA, BRA e espironolactona\u003c/b>: trimetoprima bloqueia o canal de sódio do túbulo coletor (efeito semelhante ao da amilorida) e reduz a excreção de potássio. A bula alerta para hipercalemia com fármacos que elevam o potássio, insuficiência renal ou distúrbios do potássio.\u003c/li>\n\u003cli>\u003cb>Sulfonilureias\u003c/b>: sulfametoxazol inibe CYP2C9 e pode causar hipoglicemia.\u003c/li>\n\u003c/ul>\n\u003ch3>Quando a azitromicina é a alternativa\u003c/h3>\n\u003cp>Entre os macrolídeos, a azitromicina quase não inibe CYP3A4. Quando o paciente usa sinvastatina, colchicina, carbamazepina ou varfarina e precisa de macrolídeo, ela costuma ser a opção com menos interações enzimáticas, embora mantenha o risco de prolongar o QT. A sugestão de troca deve ser feita ao prescritor, que avalia se a indicação clínica permite.\u003c/p>\n\u003ch3>Amoxicilina e metotrexato\u003c/h3>\n\u003cp>Penicilinas competem com o metotrexato pela secreção tubular renal e podem elevar seu nível. A relevância é maior com metotrexato em dose alta (oncologia), mas há relatos de toxicidade com doses baixas semanais em pacientes com função renal reduzida. No balcão, paciente com metotrexato que recebe antibiótico deve ser orientado a relatar febre, feridas na boca ou sangramento.\u003c/p>\n\u003ch3>Nirmatrelvir com ritonavir\u003c/h3>\n\u003cp>O nirmatrelvir com ritonavir, usado no tratamento precoce da covid-19 em pacientes de risco, contém ritonavir como reforçador: um inibidor forte de CYP3A4 e de P-gp. Em cinco dias de tratamento, pode elevar perigosamente sinvastatina, lovastatina, colchicina, amiodarona, alguns benzodiazepínicos, sildenafila em dose para hipertensão pulmonar, tacrolimo e outros. É o exemplo atual de antimicrobiano de curta duração com interações extensas. A checagem deve ser feita em base específica (como a da Universidade de Liverpool) antes da dispensação.\u003c/p>\n\u003ch3>Quinolonas e glicemia\u003c/h3>\n\u003cp>As quinolonas podem causar hipoglicemia e hiperglicemia, e a FDA reforçou em 2018 a advertência sobre hipoglicemia grave, sobretudo em idosos e em diabéticos com sulfonilureia ou insulina. O mecanismo atribuído é a ação sobre canais de potássio da célula beta pancreática. No diabético que recebe ciprofloxacino ou levofloxacino, a orientação inclui monitorar a glicemia com mais frequência.\u003c/p>\n\u003ch3>Isotretinoína e tetraciclinas\u003c/h3>\n\u003cp>Isotretinoína e tetraciclinas (doxiciclina, minociclina, limeciclina) podem, cada uma, causar hipertensão intracraniana benigna. O uso conjunto, que pode acontecer no tratamento da acne, é contraindicado nas bulas da isotretinoína. Sinais de alerta: cefaleia intensa, náusea, alteração visual.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Jovem de 22 anos, usuária de pílula combinada, traz receita do esquema de tratamento de tuberculose com rifampicina. O farmacêutico explica que a rifampicina reduz a eficácia da pílula, orienta preservativo em todas as relações durante o tratamento e por 28 dias após o fim, e sugere conversar com a equipe da unidade de saúde sobre um método não afetado pelo indutor, como DIU ou injetável trimestral.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ao dispensar antibiótico ou antifúngico, pergunte por: varfarina, anticoncepcional, estatina, antiácido ou suplemento de cálcio e ferro, metotrexato, medicamentos para coração e para diabetes. Essas classes cobrem a maior parte das interações relevantes desse grupo.\u003c/p>\u003c/div>\n"},{"id":"m08-endocrino","titulo":"Interações de medicamentos endócrinos","resumo":"\n\u003cp>Levotiroxina e antidiabéticos são medicamentos de uso contínuo muito dispensados. As interações desses grupos aparecem como perda de controle (TSH alterado, glicemia alta) ou como evento agudo (hipoglicemia).\u003c/p>\n\u003ch3>Levotiroxina\u003c/h3>\n\u003cp>A levotiroxina tem absorção intestinal incompleta e variável, e pequenas variações mudam o TSH. A bula norte-americana (Synthroid, FDA, 2024) orienta tomar uma vez ao dia, em jejum, de 30 minutos a 1 hora antes do café da manhã, com um copo de água, e com pelo menos 4 horas de distância de fármacos que interferem na absorção.\u003c/p>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Precipitante\u003c/th>\u003cth>Mecanismo sobre a levotiroxina\u003c/th>\u003cth>Manejo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Carbonato de cálcio, sulfato ferroso, antiácidos com alumínio ou magnésio\u003c/td>\u003ctd>Complexos insolúveis no intestino\u003c/td>\u003ctd>Separar por pelo menos 4 horas\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sequestrantes de ácidos biliares (colestiramina)\u003c/td>\u003ctd>Adsorção\u003c/td>\u003ctd>Separar por pelo menos 4 horas\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>IBP (omeprazol e outros)\u003c/td>\u003ctd>pH gástrico mais alto reduz a dissolução\u003c/td>\u003ctd>Monitorar TSH ao iniciar ou suspender\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Café, leite de soja, fibras, refeição\u003c/td>\u003ctd>Reduzem a absorção\u003c/td>\u003ctd>Tomar em jejum, 30 a 60 minutos antes do café\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Indutores (carbamazepina, fenitoína, rifampicina)\u003c/td>\u003ctd>Aumentam a eliminação hepática do hormônio\u003c/td>\u003ctd>Monitorar TSH\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Estrogênio oral\u003c/td>\u003ctd>Aumenta a globulina ligadora de tiroxina\u003c/td>\u003ctd>Monitorar TSH ao iniciar\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>No sentido inverso, a levotiroxina pode aumentar o efeito da varfarina (o hormônio acelera a degradação dos fatores de coagulação), e a correção do hipotireoidismo pode aumentar a necessidade de antidiabéticos.\u003c/p>\n\u003ch3>Metformina e álcool\u003c/h3>\n\u003cp>O álcool reduz a gliconeogênese hepática e aumenta a produção de lactato. Com a metformina (objeto no sentido farmacodinâmico), o consumo excessivo, agudo ou crônico, aumenta o risco de acidose lática e de hipoglicemia. A orientação é evitar o consumo excessivo e não beber em jejum. Outros fatores que somam risco: desidratação, insuficiência renal (função estimada por CKD-EPI 2021), contraste iodado, insuficiência hepática e cardíaca descompensada.\u003c/p>\n\u003ch3>Sulfonilureias com fluconazol e claritromicina\u003c/h3>\n\u003cp>Glibenclamida, glimepirida e glipizida são metabolizadas por CYP2C9 (e a glibenclamida também por CYP3A4). Fluconazol e sulfametoxazol (inibidores de CYP2C9) e claritromicina (inibidor de CYP3A4 e de transportadores) aumentam a exposição à sulfonilureia. O resultado é hipoglicemia, às vezes grave e prolongada em idosos. A orientação é reforçar a monitorização da glicemia capilar durante o antimicrobiano e reconhecer sinais de hipoglicemia; quando o risco é alto, o prescritor pode ajustar a dose ou escolher outro anti-infeccioso.\u003c/p>\n\u003ch3>Corticoides e antidiabéticos\u003c/h3>\n\u003cp>Prednisona, prednisolona, dexametasona e outros corticoides sistêmicos aumentam a produção hepática de glicose e a resistência à insulina. É antagonismo farmacodinâmico: o antidiabético continua no mesmo nível, mas a glicemia sobe, principalmente à tarde e à noite quando o corticoide é tomado pela manhã. Em diabético, um curso de prednisona por 5 a 7 dias já pode descompensar o controle. A orientação é monitorar glicemia com mais frequência e avisar o médico se os valores subirem; corticoide inalatório ou tópico em dose usual tem pouco efeito sistêmico.\u003c/p>\n\u003ch3>Betabloqueadores e hipoglicemia\u003c/h3>\n\u003cp>Betabloqueadores mascaram os sinais adrenérgicos da hipoglicemia (tremor, taquicardia, palpitação); a sudorese, que é colinérgica, costuma persistir. Os não seletivos (propranolol) também podem prolongar a recuperação da hipoglicemia, por bloquear a glicogenólise mediada por receptores beta-2. Em quem usa insulina ou sulfonilureia, a orientação é que a sudorese fria, a fome súbita e a confusão continuam sendo sinais de alerta mesmo sem palpitação. Betabloqueadores cardiosseletivos (metoprolol, bisoprolol) têm menor efeito sobre a recuperação.\u003c/p>\n\u003ch3>Bifosfonatos\u003c/h3>\n\u003cp>Alendronato, risedronato e ibandronato orais têm absorção mínima, praticamente anulada por alimentos, café, leite, cálcio, ferro e antiácidos. A bula do alendronato orienta tomar ao acordar, com água pura, pelo menos 30 minutos antes do primeiro alimento, bebida ou medicamento do dia, e não deitar nesse período; a do ibandronato oral pede 60 minutos. O suplemento de cálcio, quando prescrito, vai para outro horário do dia.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 61 anos, diabética em uso de metformina e gliclazida, recebe prednisona 40 mg por 5 dias para crise de asma. O farmacêutico explica que o corticoide eleva a glicemia, sobretudo à tarde, orienta medir a glicemia capilar duas a três vezes ao dia durante o curso e procurar o médico se os valores ficarem persistentemente altos ou se surgirem sede intensa e urina em excesso. Lembra que, ao terminar o corticoide, a glicemia tende a voltar ao padrão anterior.\u003c/p>\u003c/div>\n\u003ch3>Diuréticos e glicemia\u003c/h3>\n\u003cp>Diuréticos tiazídicos em dose alta podem elevar a glicemia, em parte pela hipocalemia, que reduz a secreção de insulina. Em doses baixas usuais (hidroclorotiazida 12,5 a 25 mg), o efeito é pequeno, mas pode aparecer como piora gradual da hemoglobina glicada. Inibidores do SGLT2 (dapagliflozina, empagliflozina) aumentam a diurese e somam risco de desidratação e hipotensão com diuréticos, sobretudo em idosos e em dias de calor ou diarreia.\u003c/p>\n\u003ch3>Insulina, sulfonilureias e álcool\u003c/h3>\n\u003cp>O álcool inibe a gliconeogênese hepática. Em quem usa insulina ou sulfonilureia, beber em jejum ou à noite sem comer pode causar hipoglicemia horas depois, inclusive durante o sono, e os sintomas podem ser confundidos com embriaguez. A orientação é não beber em jejum, comer junto, monitorar a glicemia antes de dormir e avisar quem acompanha o paciente.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 58 anos toma levotiroxina 75 mcg junto com o carbonato de cálcio e o café da manhã, e o TSH subiu na última consulta. O farmacêutico explica a quelação pelo cálcio e o efeito da refeição. Monta com ela uma rotina: levotiroxina ao acordar, com água, 30 a 60 minutos antes do café; cálcio no almoço ou no jantar. Registra a orientação e sugere que ela informe o endocrinologista sobre a mudança antes do próximo TSH.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Para quem usa levotiroxina, pergunte o horário em que toma e se usa cálcio, ferro, antiácido ou omeprazol. Para diabéticos que recebem corticoide, antifúngico ou antibiótico, oriente sobre sinais de hiperglicemia e de hipoglicemia e sobre medir a glicemia com mais frequência.\u003c/p>\u003c/div>\n"},{"id":"m08-alimentos","titulo":"Alimentos, fitoterápicos e suplementos","resumo":"\n\u003cp>Pacientes raramente contam que usam chás, cápsulas naturais e suplementos, porque não os consideram remédios. Muitos são vendidos na própria farmácia. A pergunta precisa ser explícita.\u003c/p>\n\u003ch3>Toranja (grapefruit)\u003c/h3>\n\u003cp>Furanocumarinas do suco de toranja (como a bergamotina) inibem de forma irreversível a CYP3A4 do intestino. O objeto é absorvido em maior quantidade. Como a enzima precisa ser ressintetizada, o efeito persiste por cerca de um dia ou mais após um copo de suco, e espaçar horários não resolve. Objetos mais afetados: sinvastatina, lovastatina, felodipina, nifedipina, sildenafila, alguns imunossupressores. A atorvastatina é afetada em menor grau. A toranja é pouco consumida no Brasil, mas aparece em sucos importados e em dietas.\u003c/p>\n\u003ch3>Tiramina e IMAO\u003c/h3>\n\u003cp>A tiramina, presente em alimentos fermentados ou envelhecidos, é normalmente degradada pela MAO-A do intestino e do fígado. Com IMAO não seletivo e irreversível (tranilcipromina), a tiramina chega à circulação e libera noradrenalina das terminações nervosas, causando crise hipertensiva (cefaleia occipital intensa, palpitação, sudorese, risco de AVC). Alimentos ricos em tiramina: queijos curados, embutidos e carnes curadas, molho de soja e outros fermentados de soja, extratos de levedura, chope e cervejas não pasteurizadas, alimentos estragados. A moclobemida (IMAO-A reversível) e a selegilina em dose baixa (IMAO-B) têm risco bem menor, mas a orientação dietética segue a bula de cada produto.\u003c/p>\n\u003ch3>Erva-de-são-joão\u003c/h3>\n\u003cp>A erva-de-são-joão (\u003ci>Hypericum perforatum\u003c/i>) é indutora forte de CYP3A4 (tabela da FDA, atualizada em 2026) e também induz a P-gp. Reduz o efeito de anticoncepcionais hormonais, DOAC, varfarina, ciclosporina, tacrolimo, digoxina, sinvastatina e muitos antirretrovirais. Além disso, tem ação serotoninérgica e soma risco de síndrome serotoninérgica com ISRS, IRSN, triptanos e tramadol. É o fitoterápico com interações mais bem documentadas e não deve ser usado junto com esses medicamentos sem avaliação.\u003c/p>\n\u003ch3>Ginkgo e alho\u003c/h3>\n\u003cp>O \u003ci>Ginkgo biloba\u003c/i> tem efeito antiplaquetário atribuído ao antagonismo do fator de ativação plaquetária. O alho em suplemento concentrado também tem efeito antiplaquetário. Há relatos de sangramento com anticoagulantes e antiplaquetários, mas os estudos controlados mostram efeito pequeno ou inconsistente; o NCCIH (2025) registra que o ginkgo pode aumentar o risco de sangramento em quem usa anticoagulante, como a varfarina. A conduta prudente é desaconselhar o uso junto com varfarina, DOAC, clopidogrel ou AAS e suspender antes de cirurgias, conforme orientação médica. O alho como tempero não é o problema; o suplemento concentrado é.\u003c/p>\n\u003ch3>Cálcio, ferro e outros minerais\u003c/h3>\n\u003cp>Suplementos de cálcio, ferro, zinco e magnésio, e polivitamínicos com minerais, são precipitantes de quelação para quinolonas, tetraciclinas, levotiroxina e bifosfonatos. O ferro também tem a absorção reduzida por cálcio, chá preto, café e IBP, e aumentada por vitamina C. Na prática, o paciente que toma \"um monte de comprimidos de manhã\" precisa de um quadro de horários.\u003c/p>\n\u003ch3>Leite e tetraciclinas\u003c/h3>\n\u003cp>O cálcio do leite, iogurte e queijo forma quelato com tetraciclina, oxitetraciclina e limeciclina e reduz sua absorção. Bulas brasileiras de cloridrato de tetraciclina pedem não ingerir leite e derivados de 1 a 2 horas antes ou depois da dose. A doxiciclina e a minociclina são menos afetadas por alimentos, mas a recomendação de não tomar com leite continua válida.\u003c/p>\n\u003ch3>Cafeína\u003c/h3>\n\u003cp>A cafeína é metabolizada por CYP1A2. Ciprofloxacino (inibidor moderado de CYP1A2) e fluvoxamina (inibidor forte) reduzem sua eliminação; o paciente sente palpitação, insônia e tremor com a quantidade habitual de café. A cafeína também aparece em analgésicos combinados, termogênicos e bebidas energéticas, e soma efeito estimulante com descongestionantes como a fenilefrina.\u003c/p>\n\u003ch3>Álcool\u003c/h3>\n\u003cp>O álcool é o \"medicamento\" que mais interage: soma depressão do SNC com benzodiazepínicos, opioides e anti-histamínicos sedativos; aumenta o risco de hipoglicemia com sulfonilureias e insulina; aumenta o risco de lesão gástrica com AINE; causa reação com metronidazol; e o uso crônico induz enzimas hepáticas, enquanto o uso agudo pode inibi-las.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Paciente de 48 anos em uso de tranilcipromina pergunta se pode ir a uma festa com queijos curados, salame e chope. O farmacêutico explica que esses alimentos têm tiramina e que, com o antidepressivo, podem causar crise hipertensiva. Orienta evitar esses itens, reconhecer sinais de alarme (dor de cabeça forte na nuca, palpitação, suor intenso) e procurar atendimento imediato se ocorrerem.\u003c/p>\u003c/div>\n\u003ch3>Outros suplementos e anticoagulantes\u003c/h3>\n\u003cp>Ômega-3 em dose alta, cúrcuma em cápsula, gengibre concentrado e vitamina E em dose alta são citados com efeito antiplaquetário ou com relatos de sangramento em usuários de anticoagulante. A evidência é fraca e, na maioria dos casos, baseada em relatos isolados. A bula da varfarina recomenda INR mais frequente ao iniciar ou suspender produtos botânicos. A conduta prática é registrar o suplemento na lista do paciente, desaconselhar doses altas sem acompanhamento e orientar a avisar o serviço de anticoagulação.\u003c/p>\n\u003ch3>Vitamina C e ferro\u003c/h3>\n\u003cp>Nem toda interação com alimento é prejudicial. A vitamina C reduz o ferro férrico a ferroso e mantém o ferro solúvel no intestino, aumentando sua absorção. Por isso, o sal de ferro oral pode ser tomado com suco de laranja ou outra fonte de vitamina C, longe de leite, café, chá preto e suplementos de cálcio. Tomar o ferro em jejum também aumenta a absorção, mas piora o desconforto gástrico; quando a intolerância compromete a adesão, tomar com pequena refeição é aceitável, conforme orientação do prescritor.\u003c/p>\n\u003ch3>Fibras e psyllium\u003c/h3>\n\u003cp>Fibras solúveis e psyllium podem reduzir a absorção de fármacos tomados ao mesmo tempo, incluindo levotiroxina, digoxina e lítio. A orientação geral é tomar o medicamento pelo menos 1 a 2 horas antes da fibra, ou conforme a bula do produto.\u003c/p>\n\u003ch3>Suplementos de academia\u003c/h3>\n\u003cp>Termogênicos com cafeína, sinefrina ou ioimbina somam efeito estimulante com descongestionantes, metilfenidato e hormônio tireoidiano em excesso, e elevam a pressão arterial. Em hipertensos, cardiopatas e usuários de antidepressivos, o farmacêutico deve perguntar sobre esses produtos e ler a composição.\u003c/p>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Mulher de 30 anos, com anticoncepcional oral combinado, quer comprar cápsulas de erva-de-são-joão \"para ansiedade\". O farmacêutico explica que a erva induz as enzimas que eliminam os hormônios da pílula e pode causar gravidez, além de interagir com antidepressivos. Desaconselha a compra e encaminha para avaliação da ansiedade na unidade básica.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Inclua sempre na entrevista: chás, cápsulas naturais, vitaminas, minerais, suplementos de academia, sucos e bebida alcoólica. Pergunte o nome exato do produto e leia o rótulo: muitos \"naturais\" são misturas com vários extratos.\u003c/p>\u003c/div>\n"},{"id":"m08-manejo","titulo":"Manejo das interações no balcão","resumo":"\n\u003cp>Detectar uma interação é metade do trabalho. A outra metade é decidir o que fazer com ela, comunicar ao paciente e ao prescritor e registrar.\u003c/p>\n\u003ch3>Passo a passo\u003c/h3>\n\u003col>\n\u003cli>\u003cb>Levantar a lista completa\u003c/b>: receitas atuais, medicamentos sem receita, fitoterápicos, suplementos, álcool. Conferir doses e horários reais, que podem diferir dos prescritos.\u003c/li>\n\u003cli>\u003cb>Identificar o par\u003c/b>: precipitante, objeto, via e efeito esperado.\u003c/li>\n\u003cli>\u003cb>Consultar uma fonte confiável\u003c/b>: bula do profissional, compêndio de interações, base de dados.\u003c/li>\n\u003cli>\u003cb>Avaliar o paciente\u003c/b>: idade, função renal (estimada por CKD-EPI 2021, quando houver creatinina), doenças, há quanto tempo usa a combinação, se já há sintomas.\u003c/li>\n\u003cli>\u003cb>Classificar a urgência\u003c/b>: contraindicada ou grave e ainda não iniciada (intervir antes da dispensação); grave já em uso há tempo e sem sintomas (contatar o prescritor sem interromper por conta própria); moderada (orientar e monitorar); leve (orientar).\u003c/li>\n\u003cli>\u003cb>Agir\u003c/b>: separar horários, orientar sinais de alerta, sugerir alternativa ao prescritor, encaminhar.\u003c/li>\n\u003cli>\u003cb>Registrar\u003c/b>: o que foi detectado, o que foi feito, com quem se falou, o desfecho.\u003c/li>\n\u003c/ol>\n\u003ch3>Quando basta separar horários\u003c/h3>\n\u003cp>Interações de absorção por quelação ou adsorção se resolvem com intervalo entre as tomadas: quinolonas, tetraciclinas, levotiroxina e bifosfonatos com cálcio, ferro, zinco, magnésio, alumínio e leite. O intervalo depende do objeto (ver tabela de horários). Interações enzimáticas, por transportador, renais e farmacodinâmicas não se resolvem com horário, porque o efeito do precipitante dura o dia todo.\u003c/p>\n\u003ch3>Quando contatar o prescritor\u003c/h3>\n\u003cul>\n\u003cli>Combinação contraindicada em bula (sinvastatina com claritromicina; sildenafila com nitrato; ciprofloxacino com tizanidina).\u003c/li>\n\u003cli>Fármaco de índice terapêutico estreito com precipitante novo (varfarina com antimicrobiano ou antifúngico; lítio com diurético, IECA ou AINE; digoxina com amiodarona ou claritromicina; carbamazepina com macrolídeo).\u003c/li>\n\u003cli>Risco de sangramento, arritmia, hipercalemia, hipoglicemia grave, síndrome serotoninérgica ou falha de tratamento crítico (anticoncepção, anticoagulação, transplante).\u003c/li>\n\u003cli>Paciente já com sintoma compatível com a interação: encaminhar para atendimento, com urgência quando houver sinal de gravidade.\u003c/li>\n\u003c/ul>\n\u003cp>A comunicação com o prescritor deve ser objetiva: identificar-se, identificar o paciente, citar os dois medicamentos, o mecanismo e o risco em uma frase, e propor uma alternativa. Exemplo: \"A paciente usa varfarina; o sulfametoxazol com trimetoprima inibe o metabolismo da varfarina e pode elevar o INR em poucos dias. O senhor considera outro antibiótico, como nitrofurantoína, ou prefere manter com INR de controle?\"\u003c/p>\n\u003ch3>Documentação da intervenção\u003c/h3>\n\u003cp>O registro protege o paciente e o profissional e dá continuidade ao cuidado. A Resolução CFF nº 585/2013 regulamenta as atribuições clínicas do farmacêutico, e a RDC 44/2009 prevê a declaração de serviço farmacêutico entregue ao paciente. Um registro mínimo contém data, paciente, medicamentos envolvidos, problema identificado, conduta (orientação, contato com prescritor, encaminhamento), resposta do prescritor e desfecho.\u003c/p>\n\u003ch3>Fontes de consulta\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fonte\u003c/th>\u003cth>Acesso\u003c/th>\u003cth>Uso no balcão\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Bulário eletrônico da Anvisa (bula do profissional)\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Interações e conduta do produto registrado no Brasil\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DailyMed e Drugs@FDA (bulas norte-americanas)\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Detalhe de interações, ajustes e intervalos\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tabela de inibidores e indutores da FDA\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Classificar força de inibidores e indutores\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Formulário Terapêutico Nacional e RENAME (Ministério da Saúde)\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Medicamentos do SUS\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Liverpool Drug Interactions (HIV, hepatites)\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Antirretrovirais e antivirais de hepatite\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Verificadores gratuitos (Drugs.com, Medscape)\u003c/td>\u003ctd>Gratuito\u003c/td>\u003ctd>Triagem rápida; conferir em outra fonte\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Stockley's Drug Interactions\u003c/td>\u003ctd>Pago\u003c/td>\u003ctd>Referência detalhada com mecanismo e evidência\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Lexicomp, Micromedex, UpToDate\u003c/td>\u003ctd>Pago ou institucional\u003c/td>\u003ctd>Gravidade, documentação e conduta\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Verificadores automáticos geram muitos alertas de baixa relevância e às vezes deixam de apontar interações importantes. Use-os para triagem e confirme as interações graves em bula ou compêndio.\u003c/p>\n\u003ch3>Registro mínimo da intervenção\u003c/h3>\n\u003cdiv class=\"tab\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Campo\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Data e farmacêutico\u003c/td>\u003ctd>08/10/2026, nome e CRF\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Paciente\u003c/td>\u003ctd>Iniciais, idade, contato\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Medicamentos envolvidos\u003c/td>\u003ctd>Varfarina 5 mg/dia; sulfametoxazol com trimetoprima\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Problema\u003c/td>\u003ctd>Inibição de CYP2C9 com risco de INR elevado\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Conduta\u003c/td>\u003ctd>Contato telefônico com o prescritor; proposta de troca\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Resposta\u003c/td>\u003ctd>Prescritor trocou para nitrofurantoína\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Orientação ao paciente\u003c/td>\u003ctd>Sinais de sangramento; INR conforme o serviço\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Desfecho\u003c/td>\u003ctd>Retorno em 7 dias sem intercorrências\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Pares que não passam sem intervenção\u003c/h3>\n\u003col>\n\u003cli>Sinvastatina ou lovastatina com claritromicina, eritromicina, itraconazol ou cetoconazol.\u003c/li>\n\u003cli>Sildenafila, tadalafila ou vardenafila com nitrato.\u003c/li>\n\u003cli>Varfarina com sulfametoxazol, metronidazol, fluconazol ou amiodarona nova.\u003c/li>\n\u003cli>Anticoagulante com AINE.\u003c/li>\n\u003cli>IECA ou BRA com espironolactona e suplemento de potássio, ou com trimetoprima no idoso.\u003c/li>\n\u003cli>IECA ou BRA com diurético e AINE.\u003c/li>\n\u003cli>Lítio com tiazídico, IECA, BRA ou AINE novo.\u003c/li>\n\u003cli>Digoxina com amiodarona, verapamil ou claritromicina.\u003c/li>\n\u003cli>ISRS ou IRSN com IMAO, linezolida ou tramadol.\u003c/li>\n\u003cli>Benzodiazepínico com opioide.\u003c/li>\n\u003cli>Anticoncepcional hormonal com rifampicina, carbamazepina, fenitoína ou erva-de-são-joão.\u003c/li>\n\u003cli>Colchicina com claritromicina; ciprofloxacino com tizanidina.\u003c/li>\n\u003c/ol>\n\u003ch3>Alertas demais\u003c/h3>\n\u003cp>Sistemas de farmácia e verificadores online geram dezenas de alertas, muitos teóricos ou de baixa relevância. O excesso leva à \"fadiga de alerta\": o profissional passa a ignorar todos, inclusive os graves. Uma rotina útil é definir uma lista curta de pares que sempre exigem ação (os da tabela-mestra classificados como contraindicados ou graves) e tratar os demais com orientação e registro.\u003c/p>\n\u003ch3>Como orientar o paciente\u003c/h3>\n\u003cul>\n\u003cli>Use linguagem simples: \"este antibiótico faz o seu remédio do sangue ficar mais forte\" é mais claro que \"inibe CYP2C9\".\u003c/li>\n\u003cli>Diga o que fazer e o que observar: horário, sinal de alerta, quando procurar atendimento.\u003c/li>\n\u003cli>Escreva os horários na caixa ou entregue um quadro.\u003c/li>\n\u003cli>Peça que o paciente repita a orientação com as próprias palavras.\u003c/li>\n\u003cli>Diante de interação grave, explique que o prescritor será contatado e que o paciente não deve parar o remédio de uso contínuo por conta própria.\u003c/li>\n\u003c/ul>\n\u003ch3>Revisão da farmacoterapia\u003c/h3>\n\u003cp>Para o paciente polimedicado, a revisão periódica de todos os medicamentos, com o paciente e as embalagens em mãos (\"revisão da sacola\"), encontra interações, duplicidades (dois AINE, dois sedativos), doses inadequadas e medicamentos que já não têm indicação. É um serviço clínico previsto na Resolução CFF nº 585/2013 e pode ser oferecido com agendamento em farmácias que dispõem de sala de serviços farmacêuticos.\u003c/p>\n\u003cdiv class=\"cx alerta\">\u003cb>Atenção\u003c/b>\u003cp>Não suspenda por conta própria um medicamento de uso contínuo prescrito (antiarrítmico, anticoagulante, antiepiléptico, antidepressivo, lítio). A conduta do farmacêutico diante de interação em fármaco já em uso é contatar o prescritor e orientar o paciente; a suspensão abrupta pode causar mais dano que a interação.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx exemplo\">\u003cb>Caso\u003c/b>\u003cp>Idoso de 80 anos usa digoxina, furosemida e enalapril e traz receita de claritromicina para pneumonia. O farmacêutico identifica duas questões: claritromicina inibe P-gp e eleva a digoxina; furosemida pode causar hipocalemia, que aumenta a toxicidade digitálica. Liga para o prescritor, que troca para outro antibiótico adequado ao quadro. O farmacêutico registra a intervenção e orienta a família sobre sinais de intoxicação digitálica.\u003c/p>\u003c/div>\n\u003cdiv class=\"cx balcao\">\u003cb>No balcão\u003c/b>\u003cp>Ofereça ao paciente polimedicado um quadro de horários escrito e uma lista atualizada dos medicamentos para levar a todas as consultas. A lista ajuda o próximo prescritor a evitar a interação antes que ela chegue ao balcão.\u003c/p>\u003c/div>\n"}],"mapas":[{"id":"m08-mapa-mecanismos","titulo":"Mecanismos de interação","centro":"Como interagem","ramos":[{"t":"Papéis","itens":["Precipitante: causa a mudança","Objeto: sofre a mudança","Dizer via e efeito, nunca só 'potencializa'"]},{"t":"Absorção","itens":["Quelação: Ca, Fe, Mg, Al, Zn","Objetos: quinolona, tetraciclina, T4, bifosfonato","pH: IBP reduz ferro e levotiroxina","Manejo: separar horários"]},{"t":"Metabolismo (CYP)","itens":["Inibição: efeito em horas a dias","Indução: 1 a 2 semanas para surgir e sumir","Pró-fármaco: inibir reduz efeito","Ex.: clopidogrel com omeprazol"]},{"t":"P-gp e rim","itens":["P-gp: digoxina, dabigatrana","Inibidores: amiodarona, verapamil, claritromicina","Lítio retido por tiazídico, IECA, AINE","Trimetoprima reduz secreção de metotrexato"]},{"t":"Farmacodinâmica","itens":["Somada: sedação, QT, potássio, serotonina","Antagonismo: corticoide e antidiabético","Vitamina K antagoniza varfarina"]},{"t":"Maior risco","itens":["Idoso e polifarmácia","Índice estreito: varfarina, lítio, digoxina","Doença renal ou hepática","Vários prescritores"]}]},{"id":"m08-mapa-cardio","titulo":"Pares de alto risco cardiovascular e anticoagulante","centro":"Coração e coagulação","ramos":[{"t":"Varfarina sobe o INR","itens":["Amiodarona: FDA reduz 1/3 a 1/2; Brasil ajusta pelo INR","SMX-TMP, metronidazol, fluconazol: CYP2C9","Paracetamol acima de ~2 g/dia por dias","AINE e AAS: sangram sem mudar INR"]},{"t":"Varfarina perde efeito","itens":["Rifampicina, carbamazepina: indução","Mais folhas verdes: mais vitamina K","Manter dieta constante"]},{"t":"DOAC","itens":["Rivaroxabana e apixabana: CYP3A4 e P-gp","Apixabana + azólico: FDA reduz; BR não recomenda","Evitar indutores fortes","Dabigatrana: só P-gp","Clopidogrel: evitar omeprazol"]},{"t":"Potássio e rim","itens":["IECA/BRA + espironolactona: hipercalemia","Sal light e KCl somam","Triple whammy: IECA + diurético + AINE"]},{"t":"Estatinas","itens":["Sinvastatina + claritromicina: contraindicada","Genfibrozila: contraindicada","Verapamil/diltiazem: sinva 10 mg (FDA) ou 20 mg (BR)","Anlodipino: sinva 20 mg (FDA) ou 40 mg (BR)","Amiodarona: sinva até 20 mg (FDA e BR)"]},{"t":"Ritmo e pressão","itens":["Digoxina + amiodarona: metade (FDA); dosar nível","Betabloqueador + verapamil: bradicardia","PDE-5 + nitrato: hipotensão grave"]}]},{"id":"m08-mapa-snc-infec","titulo":"SNC, anti-infecciosos e alimentos","centro":"SNC, infecção e dieta","ramos":[{"t":"Serotonina","itens":["ISRS + IMAO: contraindicada","ISRS + linezolida ou tramadol: grave","ISRS + triptano: risco baixo, orientar","Erva-de-são-joão soma efeito"]},{"t":"Sedação e lítio","itens":["Benzo + opioide + álcool: depressão respiratória","Anti-H1 sedativo no idoso: quedas","Lítio sobe com tiazídico, IECA, AINE"]},{"t":"CYP2D6 e indutores","itens":["Fluoxetina/paroxetina: menos endoxifeno","Fluoxetina/paroxetina elevam metoprolol","Carbamazepina, fenitoína: indutores fortes"]},{"t":"Anti-infecciosos","itens":["Rifampicina: pílula falha, 28 dias extra","Quinolona/tetraciclina + cátion: separar","Metronidazol + álcool: evitar","Macrolídeo + outro QT: arritmia"]},{"t":"Endócrino","itens":["Levotiroxina: jejum, 4 h de cálcio e ferro","Sulfonilureia + fluconazol: hipoglicemia","Corticoide eleva a glicemia","Betabloqueador mascara hipoglicemia"]},{"t":"Alimentos e plantas","itens":["Toranja inibe CYP3A4 intestinal","Tiramina + IMAO: crise hipertensiva","Ginkgo e alho: cautela com anticoagulante","Cipro e fluvoxamina acumulam cafeína"]}]}],"apoio":[{"tipo":"tabela","id":"m08-tab-mestra","titulo":"Tabela-mestra de interações na atenção básica","colunas":["Precipitante","Objeto","Mecanismo","Efeito","Gravidade","Manejo"],"linhas":[["Amiodarona","Varfarina","Inibe CYP2C9 e CYP3A4","INR elevado, sangramento","Grave","Bula FDA: reduzir varfarina 1/3 a 1/2; bula brasileira: ajustar pelo INR durante e após"],["Sulfametoxazol (SMX-TMP)","Varfarina","Sulfametoxazol inibe CYP2C9","INR muito elevado","Grave","Preferir outro antibiótico; se mantido, INR em poucos dias"],["Metronidazol","Varfarina","Inibe metabolismo da S-varfarina (CYP2C9)","INR muito elevado","Grave","Contatar prescritor; INR de controle"],["Fluconazol, miconazol","Varfarina","Inibem CYP2C9 e CYP3A4","INR elevado","Grave","Contatar prescritor; INR de controle"],["Claritromicina, eritromicina","Varfarina","Inibem CYP3A4 (R-varfarina)","INR elevado","Moderada","INR de controle; azitromicina tem menos efeito"],["Rifampicina","Varfarina","Induz CYP2C9 e CYP3A4","INR cai, risco de trombose","Grave","Contatar prescritor; INR frequente, inclusive após suspensão"],["AINE (ibuprofeno, diclofenaco, naproxeno)","Varfarina, DOAC","Inibição da COX-1 plaquetária e lesão gástrica (farmacodinâmica)","Sangramento digestivo","Grave","Evitar; preferir paracetamol ou dipirona"],["AAS","Varfarina, DOAC","Antiagregação somada e lesão gástrica","Sangramento","Grave","Só por indicação médica; orientar sinais de sangramento"],["Paracetamol acima de ~2 g/dia por vários dias","Varfarina","Interferência proposta no ciclo da vitamina K","INR elevado","Moderada","Menor dose, menor tempo; avisar serviço de anticoagulação"],["Vitamina K da dieta (folhas verdes)","Varfarina","Antagonismo competitivo","INR cai com aumento do consumo","Moderada","Manter consumo constante"],["Cetoconazol, itraconazol, ritonavir","Rivaroxabana, apixabana","Inibem CYP3A4 e P-gp","Mais exposição, sangramento","Grave","Rivaroxabana: evitar. Apixabana: FDA reduz 50% (evitar se já 2,5 mg 2x/dia); bula brasileira: não recomendado"],["Rifampicina, carbamazepina, fenitoína, erva-de-são-joão","Rivaroxabana, apixabana, dabigatrana","Induzem CYP3A4 e P-gp","Perda de efeito, trombose","Grave","Evitar (FDA); bula brasileira da apixabana: cautela, não recomendado no tratamento de TVP e EP"],["Dronedarona, cetoconazol, verapamil, amiodarona","Dabigatrana","Inibem P-gp","Mais exposição, sangramento","Grave","Seguir ajuste da bula por indicação e função renal"],["Omeprazol, esomeprazol","Clopidogrel","Inibem CYP2C19 e a ativação do pró-fármaco","Menor antiagregação","Grave","Evitar; prescritor costuma preferir pantoprazol"],["Ibuprofeno","AAS em baixa dose","Bloqueia o acesso do AAS à COX-1","Menor proteção cardiovascular","Moderada","Ibuprofeno 30 min após AAS ou mais de 8 h antes"],["Espironolactona, amilorida","IECA, BRA","Retenção de potássio somada","Hipercalemia","Grave","Monitorar potássio e creatinina; evitar KCl extra"],["Cloreto de potássio, sal light","IECA, BRA, espironolactona","Aporte de potássio com excreção reduzida","Hipercalemia","Grave","Não usar sem orientação médica"],["AINE","IECA ou BRA + diurético","Vasoconstrição aferente somada a dilatação eferente e hipovolemia","Lesão renal aguda","Grave","Evitar AINE; hidratação; procurar médico"],["AINE","Anti-hipertensivos","Retenção de sódio e inibição de prostaglandinas","Pressão sobe","Moderada","Uso curto; monitorar pressão"],["Claritromicina, eritromicina, itraconazol, cetoconazol","Sinvastatina, lovastatina","Inibição forte de CYP3A4","Miopatia, rabdomiólise","Contraindicada","Suspender a estatina no curso, a critério do prescritor"],["Genfibrozila","Sinvastatina","Inibe glicuronidação e OATP1B1","Rabdomiólise","Contraindicada","Fenofibrato é a alternativa usual"],["Verapamil, diltiazem","Sinvastatina","Inibição moderada de CYP3A4","Miopatia","Grave","Sinvastatina até 10 mg/dia (FDA) ou 20 mg/dia (bula brasileira)"],["Anlodipino, amiodarona","Sinvastatina","Inibição de CYP3A4","Miopatia","Grave","Amiodarona: até 20 mg/dia (FDA e Brasil). Anlodipino: 20 mg/dia (FDA) ou 40 mg/dia (Brasil)"],["Amiodarona","Digoxina","Inibe P-gp; soma bradicardia","Intoxicação digitálica, bloqueio AV","Grave","FDA: digoxina à metade ou suspender; bula brasileira: dosar digoxina, ECG e ajustar"],["Verapamil","Digoxina","Inibe P-gp; soma efeito no nó AV","Intoxicação, bradicardia","Grave","Ajuste e monitorização pelo prescritor"],["Claritromicina","Digoxina","Inibe P-gp","Intoxicação digitálica","Grave","Preferir outro antibiótico ou monitorar"],["Nitratos (isossorbida, nitroglicerina)","Sildenafila, tadalafila","Aumento de GMPc somado","Hipotensão grave","Contraindicada","Não dispensar PDE-5; encaminhar"],["Verapamil, diltiazem","Betabloqueadores","Efeito cronotrópico e dromotrópico negativo somado","Bradicardia, bloqueio AV, IC","Grave","Só com acompanhamento; orientar tontura e desmaio"],["IMAO","ISRS, IRSN","Menor degradação somada a menor recaptação de serotonina","Síndrome serotoninérgica","Contraindicada","Respeitar intervalos de troca"],["Linezolida","ISRS, IRSN","Inibição fraca da MAO","Síndrome serotoninérgica","Grave","Contatar prescritor; orientar sinais"],["Tramadol","ISRS, IRSN","Recaptação de serotonina somada; menor limiar convulsivo","Síndrome serotoninérgica, convulsão","Grave","Menor dose e menor tempo; orientar sinais"],["Fluoxetina, paroxetina","Tramadol","Inibem CYP2D6","Menos analgesia, mais toxicidade serotoninérgica","Grave","Contatar prescritor"],["ISRS","AINE, anticoagulante","Menos serotonina plaquetária somada a COX-1 e lesão gástrica","Sangramento digestivo","Moderada","Evitar AINE; IBP se indicado pelo prescritor"],["Opioides, álcool, anti-H1 sedativos","Benzodiazepínicos","Depressão do SNC somada","Sedação, quedas, depressão respiratória","Grave","Evitar; não vender antigripal sedativo"],["Hidroclorotiazida, clortalidona","Lítio","Mais reabsorção proximal de lítio","Intoxicação por lítio","Grave","Contatar prescritor; litemia"],["IECA, BRA, AINE","Lítio","Menor filtração e excreção de lítio","Intoxicação por lítio","Grave","Contatar prescritor; litemia"],["Fluoxetina, paroxetina","Tamoxifeno","Inibem CYP2D6 e a formação de endoxifeno","Possível perda de eficácia","Grave","Prescritor prefere venlafaxina ou escitalopram"],["Fluoxetina, paroxetina","Metoprolol","Inibem CYP2D6","Bradicardia, hipotensão","Moderada","Monitorar pulso e pressão"],["Carbamazepina, fenitoína","Anticoncepcional hormonal, DOAC, estatinas","Indução de CYP3A4 e outras vias","Perda de efeito","Grave","Método contraceptivo não hormonal ou DIU; avaliar troca"],["Claritromicina, eritromicina","Carbamazepina","Inibem CYP3A4","Tontura, diplopia, ataxia","Grave","Preferir outro antibiótico"],["Rifampicina, rifabutina","Anticoncepcional hormonal","Indução de CYP3A4 e glicuronidação","Falha contraceptiva","Grave","Preservativo durante e por 28 dias após"],["Cálcio, magnésio, alumínio, ferro, zinco","Ciprofloxacino","Quelação","Falha do antibiótico","Moderada","Cipro 2 h antes ou 6 h depois"],["Cálcio, magnésio, alumínio, ferro, zinco","Levofloxacino","Quelação","Falha do antibiótico","Moderada","2 h antes ou 2 h depois"],["Leite, cálcio, antiácidos, ferro","Tetraciclinas","Quelação","Falha do antibiótico","Moderada","Leite: 1 a 2 h antes ou depois; antiácidos e minerais: 1 a 3 h (bulas brasileiras)"],["Ciprofloxacino","Tizanidina","Inibe CYP1A2","Hipotensão, sedação intensa","Contraindicada","Não dispensar a combinação; contatar prescritor"],["Ciprofloxacino, fluvoxamina","Cafeína, teofilina","Inibem CYP1A2","Palpitação, insônia; toxicidade da teofilina","Moderada","Reduzir cafeína; monitorar teofilina"],["Álcool","Metronidazol","Reação tipo dissulfiram atribuída ao acetaldeído","Rubor, vômito, taquicardia","Moderada","Evitar álcool no tratamento e por 1 a 3 dias após"],["Claritromicina, eritromicina, azitromicina","Outros fármacos que prolongam o QT","Bloqueio de canais de potássio cardíacos somado","Torsades de pointes","Grave","Evitar em cardiopata; corrigir potássio e magnésio"],["Claritromicina","Colchicina","Inibe CYP3A4 e P-gp","Toxicidade grave, fatal","Contraindicada","Evitar, sobretudo com doença renal ou hepática"],["Fluconazol, sulfametoxazol","Glibenclamida, glimepirida","Inibem CYP2C9","Hipoglicemia","Grave","Glicemia capilar; orientar sinais"],["Claritromicina","Sulfonilureias","Inibe CYP3A4 e transportadores","Hipoglicemia","Moderada","Glicemia capilar; orientar sinais"],["Trimetoprima","Metotrexato","Menor secreção tubular e efeito antifolato somado","Pancitopenia","Grave","Evitar; contatar prescritor"],["Trimetoprima","IECA, BRA, espironolactona","Bloqueio do canal de sódio do túbulo coletor","Hipercalemia","Grave","Preferir outro antibiótico em idoso; potássio"],["Cálcio, ferro, antiácidos","Levotiroxina","Quelação e adsorção","TSH sobe","Moderada","Separar por pelo menos 4 h"],["IBP","Levotiroxina","pH gástrico mais alto reduz dissolução","TSH sobe","Leve","Monitorar TSH"],["Álcool","Metformina","Aumento de lactato e menor gliconeogênese","Acidose lática, hipoglicemia","Moderada","Evitar excesso e beber em jejum"],["Corticoides sistêmicos","Antidiabéticos","Antagonismo: resistência à insulina","Hiperglicemia","Moderada","Glicemia mais frequente; avisar médico"],["Betabloqueadores","Insulina, sulfonilureias","Mascaram sinais adrenérgicos; não seletivos atrasam recuperação","Hipoglicemia não percebida","Moderada","Orientar sudorese e fome como alerta"],["Alimentos, café, cálcio, ferro","Alendronato, risedronato, ibandronato","Quelação e adsorção","Absorção quase nula","Moderada","Jejum: 30 min (alendronato) ou 60 min (ibandronato)"],["Suco de toranja","Sinvastatina, lovastatina, felodipina","Inibe CYP3A4 intestinal de forma irreversível","Mais exposição e toxicidade","Moderada","Evitar o suco; espaçar não resolve"],["Alimentos com tiramina","IMAO (tranilcipromina)","Tiramina não degradada libera noradrenalina","Crise hipertensiva","Grave","Dieta restrita conforme bula"],["Erva-de-são-joão","Anticoncepcional, DOAC, varfarina, digoxina","Induz CYP3A4 e P-gp","Perda de efeito","Grave","Desaconselhar o uso"],["Ginkgo, alho concentrado","Anticoagulantes, antiagregantes","Efeito antiplaquetário (evidência fraca)","Possível sangramento","Moderada","Desaconselhar; suspender antes de cirurgia"]],"nota":"Gravidade em escala didática (contraindicada, grave, moderada, leve); os compêndios usam escalas próprias. Onde a bula norte-americana (FDA) e a brasileira divergem, as duas aparecem. Na dispensação vale a bula do produto registrado no Brasil; quando a FDA for mais restritiva, informe o prescritor."},{"tipo":"tabela","id":"m08-tab-horarios","titulo":"Horários para separar a administração","colunas":["Objeto","Separar de","Intervalo recomendado","Fonte"],"linhas":[["Levotiroxina","Café da manhã e alimentos","Jejum, 30 a 60 min antes do café","Bula FDA da levotiroxina (2024)"],["Levotiroxina","Cálcio, ferro, antiácidos, colestiramina","Pelo menos 4 h","Bula FDA da levotiroxina (2024)"],["Ciprofloxacino","Antiácidos com Mg ou Al, sucralfato, cálcio, ferro, zinco","2 h antes ou 6 h depois","Bula FDA do ciprofloxacino (2026)"],["Levofloxacino","Antiácidos, sucralfato, ferro, zinco","2 h antes ou 2 h depois","Bula FDA do levofloxacino (2025)"],["Moxifloxacino","Magnésio, alumínio, ferro, zinco, sucralf
